revision: 2
software: 'Car rental fleet management system (Enterprise/Hertz-style rental ops backend): vehicles, customers, reservations and rentals, damage claims, late fees'
summary: A stateful car rental fleet. Branches hold vehicles. Customers reserve a vehicle for a pickup and due window. Agents pick up, return, cancel and close rentals. Damage claims move through review to approved, denied or settled. A daily job assesses a late fee on rentals returned after their due time, and a second daily job cancels no-show reservations. Most changes go through actions that keep the rental, vehicle and claim state machines consistent.
clock:
  start: 2026-10-06T09:00:00.000Z
  tick: 1s
verdict:
  kind: proceed
entities:
  - name: branch
    purpose: A rental location where vehicles are based and picked up. Identified by a short code.
    keyFields:
      - code
      - name
      - city
  - name: vehicle
    purpose: A car in the fleet with plate, class, daily rate, odometer and an availability status. A vehicle belongs to a home branch.
    keyFields:
      - plate
      - make
      - model
      - vehicle_class
      - daily_rate
      - status
      - branch_id
      - odometer_km
  - name: customer
    purpose: A driver who rents cars. Holds license details and a blocked flag that stops new reservations.
    keyFields:
      - name
      - email
      - license_number
      - phone
      - blocked
  - name: rental
    purpose: A reservation that becomes a rental. Has scheduled pickup_at and due_at, actual picked_up_at and returned_at, a daily rate snapshot, base charge, late fee, damage charge and odometer readings. Created only by the reserve_rental action.
    keyFields:
      - customer_id
      - vehicle_id
      - pickup_branch_id
      - status
      - pickup_at
      - due_at
      - picked_up_at
      - returned_at
      - daily_rate
      - base_charge
      - late_fee
      - late_fee_applied
      - late_fee_waived
      - damage_charge
      - odometer_out
      - odometer_in
      - cancel_reason
  - name: damage_claim
    purpose: A damage report against a rental and vehicle with an estimated cost, reviewed to an approved amount or denied, then settled onto the rental's damage charge.
    keyFields:
      - rental_id
      - vehicle_id
      - description
      - estimated_cost
      - approved_amount
      - status
      - filed_at
      - resolved_at
      - denial_reason
workflows:
  - name: rental_lifecycle
    entity: rental
    states:
      - reserved
      - active
      - returned
      - closed
      - cancelled
    rules:
      - reserved can go to active or cancelled. active goes only to returned. returned goes only to closed. closed and cancelled are final.
      - reserve_rental needs a non-blocked customer, an available vehicle, due_at after pickup_at and no overlapping reserved or active rental on the vehicle. It snapshots daily_rate and sets base_charge to the daily rate times the days in the window, rounded up, minimum 1.
      - pickup_rental needs status reserved and the vehicle available. It sets picked_up_at to now, odometer_out from input (not below the vehicle odometer) and the vehicle to rented.
      - return_rental needs status active and odometer_in at or above odometer_out. It sets returned_at to now, odometer_in, updates the vehicle odometer and returns it to available at the return branch.
      - A rental is late when returned_at is more than 60 minutes after due_at. The daily late_fee_assessment job sets late_fee to ceil(minutes_late / 1440) times 1.5 times daily_rate, then sets late_fee_applied true. A job run never touches a rental twice.
      - waive_late_fee needs late_fee_applied true and a non-zero late_fee. It sets late_fee to 0, late_fee_waived to true and stores the reason. The job will not re-add it.
      - cancel_rental needs status reserved and a reason. It stores cancel_reason and keeps the vehicle as it is.
      - close_rental needs status returned. It refuses with 409 late_fee_pending when the rental was late and the fee is not assessed yet, and with 409 claim_pending when a claim is open or under_review.
      - expire_no_shows cancels reserved rentals more than 24h past pickup_at with cancel_reason no_show.
    actions:
      - reserve_rental
      - pickup_rental
      - return_rental
      - cancel_rental
      - close_rental
      - waive_late_fee
  - name: vehicle_availability
    entity: vehicle
    states:
      - available
      - rented
      - maintenance
      - retired
    rules:
      - available can go to rented, maintenance or retired. rented can go to available or maintenance. maintenance can go to available or retired. retired is final.
      - rented is set only by pickup_rental and cleared only by return_rental. A plain PATCH cannot set or clear it.
      - approve_claim moves an available vehicle to maintenance. A rented vehicle stays rented until it is returned.
    actions: []
  - name: damage_claim_review
    entity: damage_claim
    states:
      - open
      - under_review
      - approved
      - denied
      - settled
    rules:
      - open goes to under_review or denied. under_review goes to approved or denied. approved goes to settled. denied and settled are final.
      - file_damage_claim needs a rental in active, returned or closed status and estimated_cost above 0. It copies vehicle_id from the rental and sets filed_at to now.
      - approve_claim needs under_review and an approved_amount between 1 and estimated_cost. It sets resolved_at.
      - deny_claim needs a non-blank reason, stores denial_reason and sets resolved_at.
      - settle_claim adds approved_amount to the rental damage_charge. It refuses with 409 if the rental is cancelled.
    actions:
      - file_damage_claim
      - review_claim
      - approve_claim
      - deny_claim
      - settle_claim
jobs:
  - name: late_fee_assessment
    every: 1d
    rule: 'For every rental with status returned and late_fee_applied false: if returned_at is more than 60 minutes after due_at, set late_fee to ceil(minutes_late / 1440) times 150% of daily_rate. Set late_fee_applied true either way. Skip rentals with late_fee_waived true. A rental run twice is never charged twice.'
  - name: expire_no_shows
    every: 1d
    rule: Cancel every reserved rental whose pickup_at is more than 24 hours before now, with cancel_reason no_show.
acceptanceTests: []
routes:
  - id: list_branches
    method: GET
    path: /branches
    purpose: List branches, filter by city, search by name.
  - id: get_branch
    method: GET
    path: /branches/{id}
    purpose: Get one branch.
  - id: list_vehicles
    method: GET
    path: /vehicles
    purpose: List vehicles with filters status, vehicle_class, branch_id. Search plate, make and model. Sort by daily_rate and odometer_km.
  - id: get_vehicle
    method: GET
    path: /vehicles/{id}
    purpose: Get one vehicle.
  - id: create_vehicle
    method: POST
    path: /vehicles
    purpose: Add a vehicle to the fleet. It starts available.
  - id: update_vehicle
    method: PATCH
    path: /vehicles/{id}
    purpose: Edit vehicle details and move it between available, maintenance and retired. rented is set only by actions.
  - id: list_customers
    method: GET
    path: /customers
    purpose: List customers, filter by blocked, search name, email and license number.
  - id: get_customer
    method: GET
    path: /customers/{id}
    purpose: Get one customer.
  - id: create_customer
    method: POST
    path: /customers
    purpose: Register a customer.
  - id: update_customer
    method: PATCH
    path: /customers/{id}
    purpose: Edit customer details or the blocked flag.
  - id: list_rentals
    method: GET
    path: /rentals
    purpose: List rentals with filters status, customer_id, vehicle_id, pickup_branch_id, late_fee_applied. Sort by pickup_at, due_at and returned_at.
  - id: get_rental
    method: GET
    path: /rentals/{id}
    purpose: Get one rental.
  - id: list_customer_rentals
    method: GET
    path: /customers/{customer_id}/rentals
    purpose: Rental history of one customer.
  - id: list_vehicle_rentals
    method: GET
    path: /vehicles/{vehicle_id}/rentals
    purpose: Rental history of one vehicle.
  - id: list_damage_claims
    method: GET
    path: /damage_claims
    purpose: List claims with filters status, rental_id, vehicle_id. Sort by estimated_cost and filed_at.
  - id: get_damage_claim
    method: GET
    path: /damage_claims/{id}
    purpose: Get one claim.
  - id: list_rental_damage_claims
    method: GET
    path: /rentals/{rental_id}/damage_claims
    purpose: Claims filed against one rental.
  - id: reserve_rental
    method: POST
    path: /rentals
    purpose: Action. Reserve an available vehicle for a customer between pickup_at and due_at.
  - id: pickup_rental
    method: POST
    path: /rentals/{id}/pickup
    purpose: 'Action. Hand over the keys: reserved to active, vehicle becomes rented, records odometer_out.'
  - id: return_rental
    method: POST
    path: /rentals/{id}/return
    purpose: 'Action. Check the vehicle back in: active to returned, sets returned_at to now, records odometer_in, vehicle becomes available.'
  - id: cancel_rental
    method: POST
    path: /rentals/{id}/cancel
    purpose: Action. Cancel a reserved rental with a reason.
  - id: close_rental
    method: POST
    path: /rentals/{id}/close
    purpose: Action. Close a returned rental once the late fee is assessed and no claim is pending.
  - id: waive_late_fee
    method: POST
    path: /rentals/{id}/waive_late_fee
    purpose: Action. Zero an assessed late fee with a reason.
  - id: file_damage_claim
    method: POST
    path: /damage_claims
    purpose: Action. File a claim against an active, returned or closed rental with an estimated cost.
  - id: review_claim
    method: POST
    path: /damage_claims/{id}/review
    purpose: Action. Move an open claim to under_review.
  - id: approve_claim
    method: POST
    path: /damage_claims/{id}/approve
    purpose: Action. Approve an under_review claim at an approved_amount no higher than the estimate.
  - id: deny_claim
    method: POST
    path: /damage_claims/{id}/deny
    purpose: Action. Deny an open or under_review claim with a reason.
  - id: settle_claim
    method: POST
    path: /damage_claims/{id}/settle
    purpose: Action. Settle an approved claim by adding its approved_amount to the rental's damage_charge.
seed:
  rowsPerEntity:
    branch: 6
    vehicle: 60
    customer: 90
    rental: 170
    damage_claim: 60
  mix: 'Branches: 6 across different cities. Vehicles: about 50% available, 25% rented, 15% maintenance, 10% retired, over classes economy, compact, suv, luxury and van, with realistic plates, makes, models and daily rates in USD cents. Customers: 90 plausible names and emails, about 4 blocked, a few anchors (Elena Voss with one reserved rental, Tomas Reyes with an active overdue SUV rental plus an older closed rental, Priya Natarajan with two late returned rentals). Rentals: about 15% reserved with pickup in the future or less than 24h in the past, 20% active (some already past due_at), 25% returned (some late and not yet assessed because they were returned in the last day, the rest already assessed), 32% closed, 8% cancelled. Rentals returned late and older than a day have late_fee_applied true with a fee of ceil days late times 1.5 times the daily rate. Claims: 60 over returned and closed rentals, about 20% open, 40% under_review (more than 25 so listing pages, with estimated costs from $40 to $3,000, including one exactly at $150), 15% approved, 10% denied, 15% settled. All history is before clock.start. Scheduled future items are reserved pickups only.'
tasks:
  - id: cancel_elena_reservation
    difficulty: easy
    intent: Cancel the upcoming reservation of the customer Elena Voss because her trip was called off. The cancel reason must be given and must contain the word "trip". The vehicle and every other rental stay unchanged. The grader checks that rental.cancel_reason contains "trip".
    decoyIdea: PATCH the rental status to cancelled, or cancel one of another customer's reservations, or leave out the reason, or give a reason without the word trip such as bananas.
  - id: return_tomas_reyes_suv
    difficulty: medium
    intent: Tomas Reyes is at the counter returning his SUV after its due time. Check the rental in with an odometer reading of 48210 km. The late fee is left to the daily job. Do not touch his older closed rental.
    decoyIdea: Return his older closed rental, record a wrong odometer, return it to the wrong state through PATCH, or try to add a late fee by hand.
  - id: waive_priya_late_fee
    difficulty: medium
    intent: Priya Natarajan has two late returns. Waive the late fee only on the rental returned most recently, with a reason of flight delay. Leave the older one charged.
    decoyIdea: Waive the older rental's fee, waive both, or edit the late_fee field directly without a reason.
  - id: triage_small_claims
    difficulty: hard
    intent: Review the damage claims that are in under_review. Deny every one whose estimated cost is under $150 as minor wear and tear, with a denial reason that contains the phrase "wear and tear". Approve every one at $150 or more at its full estimated cost. Do not settle anything or touch claims in any other status. The grader checks that each denied claim's denial_reason contains "wear and tear".
    decoyIdea: Read only the first page of claims, treat $150 as below the threshold, also act on open claims, approve at less than the estimate, settle the approved claims, or deny with a nonsense reason that omits wear and tear.
open_questions:
  - question: Which currency and unit should money use?
    default_answer: USD in integer cents.
  - question: What is the late fee formula and is there a grace period?
    default_answer: 60 minute grace. After that, each started 24h day late costs 150% of the daily rate.
  - question: Should the late fee be charged when the vehicle is returned, or by the daily job?
    default_answer: By the daily job, as the input says. The return itself charges nothing extra.
  - question: Can a vehicle be returned to a different branch from where it was picked up?
    default_answer: Yes. The vehicle's branch becomes the return branch.
  - question: Can a late rental be closed before its late fee is assessed?
    default_answer: No. close_rental refuses with late_fee_pending.
  - question: Is a deductible or insurance applied to damage claims?
    default_answer: No. The approved amount is charged to the rental as is.
  - question: What happens to a reservation the customer never picks up?
    default_answer: A daily job cancels it as a no_show 24h after pickup_at.
  - question: Which time zone are timestamps in?
    default_answer: UTC.
  - question: What is the clock start and does time move on its own?
    default_answer: 2026-10-06T09:00:00.000Z with a 1s tick per committed call. Jobs fire only when time advances past their next run.
assumptions:
  - decision: Clock start is 2026-10-06T09:00:00.000Z with tick 1s. Historical rentals, returns and claims all precede it. Future items are reserved rentals with pickup_at after the start, and the next runs of the daily jobs.
    why: The clock must be explicit and deterministic, and tick 1s keeps event order visible. Jobs fire only when a test advances time, and tasks cannot advance the clock, so tasks grade seeded facts and not job output.
  - decision: Currency is USD in integer cents on every money field.
    why: The input names no currency. The engine requires one fixed currency per field.
  - decision: "Late rule: a rental is late if returned_at is more than 60 minutes after due_at. The fee is ceil(minutes_late / 1440) days times 150% of the rental's daily_rate snapshot."
    why: The input says only 'a late fee'. A grace period and a daily multiplier match common rental practice and make the fee computable.
  - decision: The late_fee_assessment job runs every 1d and acts only on returned rentals with late_fee_applied false. It sets late_fee, adds the fee to the rental's charges and sets late_fee_applied true, so it never charges twice. Waived fees stay zero.
    why: The input says a daily job adds the fee to rentals returned after their due time. The flag makes the job idempotent.
  - decision: A second daily job, expire_no_shows, cancels reserved rentals whose pickup_at is more than 24h past, with cancel_reason no_show, and frees the vehicle.
    why: Reservations that never convert would block a vehicle forever. It is a natural second scheduled behavior and stays small.
  - decision: Rentals are created only through the reserve_rental action, with no plain create route. The action refuses blocked customers, vehicles not available, vehicles with an overlapping reserved or active rental, and due_at not after pickup_at. It snapshots daily_rate and sets base_charge from the whole days of the window.
    why: Overlap and eligibility checks cannot live in a plain create.
  - decision: Rental states are reserved, active, returned, closed and cancelled. reserved goes to active or cancelled. active goes to returned. returned goes to closed. close_rental refuses a late rental whose fee is not yet assessed (409 late_fee_pending) and a rental with an open or under_review claim.
    why: This gives the daily job a real window to act in and creates a cross-entity rule for agents to hit.
  - decision: Vehicle states are available, rented, maintenance and retired. pickup sets rented, return sets available, and approving a claim moves an available vehicle to maintenance. Staff move vehicles between available, maintenance and retired by PATCH, never to or from rented.
    why: The vehicle status must track the rental lifecycle.
  - decision: Damage claim states are open, under_review, approved, denied and settled. approve needs under_review and an approved_amount no greater than estimated_cost. deny works from open or under_review and needs a reason. settle needs approved and adds approved_amount to rental.damage_charge.
    why: The input names damage claims only. A short review pipeline gives claims a meaningful lifecycle.
  - decision: All timestamps are UTC. return_rental stamps returned_at with engine time. Callers cannot choose it.
    why: Prevents agents from backdating a return, and keeps tasks deterministic.
  - decision: "Only one active branch model: a rental is picked up at pickup_branch_id and may be returned to any branch, which becomes the vehicle's branch_id."
    why: The input does not describe one-way rentals. This is the simplest model that keeps fleet location current.
  - decision: Routes use no auth, in a REST style with cursor pagination and a page size of 25.
    why: Matches the engine conventions. Authentication is not in the input.
  - decision: The required keyword for cancel_reason is "trip" and for denial_reason is "wear and tear", both matched case-insensitively.
    why: Each word comes from the task's own wording, so the instruction states what the text must contain and the grader can check it.
outOfScope:
  - what: Payments, deposits, card holds, refunds and invoices
    why: The input needs charges recorded on the rental, not a payment processor.
  - what: Insurance products, deductibles and third-party insurer claims
    why: Claims are modeled as a simple internal review pipeline.
  - what: Dynamic pricing, promotions, taxes and fees other than the late fee
    why: Daily rates are a fixed field on each vehicle.
  - what: Telematics, GPS, fuel level and mileage overage charges
    why: Odometer readings are recorded but not billed.
  - what: Authentication, staff roles and permissions
    why: Not in the input. Every caller acts as a rental agent.
  - what: Notifications by email or SMS
    why: No outbound channel exists in the engine.
  - what: Extending or modifying a rental after reservation
    why: Keeps the rental state machine small. Agents cancel and rebook.
changes:
  - tasks.cancel_elena_reservation
  - tasks.triage_small_claims
