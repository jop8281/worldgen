actions:
  create_branch:
    method: POST
    path: /branches
    description: Open a new rental branch. Branches have no standard create route, so this action adds one.
    input:
      code:
        type: string
        description: Short unique branch code.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 10
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
    handler: "(ctx) => { const b = ctx.body; const code = b.code.trim(); if (code === '') ctx.fail(400, 'input.invalid', 'code must not be blank'); const dup = ctx.db.list('branch', { where: { code } }); if (dup.length > 0) ctx.fail(409, 'duplicate_code', 'branch code ' + code + ' already exists'); const row = ctx.db.create('branch', { code, name: b.name, city: b.city }); return { status: 201, body: row }; }"
  reserve_rental:
    method: POST
    path: /rentals
    description: Reserve an available vehicle for a non-blocked customer between pickup_at and due_at. Snapshots the daily rate and sets base_charge to the daily rate times the days in the window, rounded up, minimum 1.
    input:
      customer_id:
        type: ref
        description: The driver. Must not be blocked.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      vehicle_id:
        type: ref
        description: The vehicle. Must be available with no overlapping reserved or active rental.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: vehicle
        onDelete: restrict
      pickup_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      due_at:
        type: datetime
        description: Must be after pickup_at.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const b = ctx.body; const customer = ctx.db.get('customer', b.customer_id); if (customer === null) ctx.fail(404, 'not_found', 'customer ' + b.customer_id + ' not found'); const vehicle = ctx.db.get('vehicle', b.vehicle_id); if (vehicle === null) ctx.fail(404, 'not_found', 'vehicle ' + b.vehicle_id + ' not found'); const minutes = ctx.time.minutesBetween(b.pickup_at, b.due_at); if (minutes <= 0) ctx.fail(422, 'invalid_window', 'due_at must be after pickup_at'); if (customer.blocked) ctx.fail(409, 'customer_blocked', 'customer ' + customer.id + ' is blocked and cannot reserve vehicles'); if (vehicle.status !== 'available') ctx.fail(409, 'vehicle_unavailable', 'vehicle ' + vehicle.id + ' is ' + vehicle.status + '. Only available vehicles can be reserved.'); const clash = ctx.db.list('rental', { where: { vehicle_id: vehicle.id } }).find((r) => (r.status === 'reserved' || r.status === 'active') && ctx.time.minutesBetween(r.pickup_at, b.due_at) > 0 && ctx.time.minutesBetween(b.pickup_at, r.due_at) > 0); if (clash) ctx.fail(409, 'vehicle_overlap', 'vehicle ' + vehicle.id + ' already has rental ' + clash.id + ' (' + clash.status + ') overlapping that window'); const days = Math.max(1, Math.ceil(minutes / 1440)); const rental = ctx.db.create('rental', { customer_id: customer.id, vehicle_id: vehicle.id, pickup_branch_id: vehicle.branch_id, status: 'reserved', pickup_at: b.pickup_at, due_at: b.due_at, daily_rate: vehicle.daily_rate, base_charge: days * vehicle.daily_rate, late_fee: 0, late_fee_applied: false, late_fee_waived: false, damage_charge: 0 }); return { status: 201, body: rental }; }"
  pickup_rental:
    method: POST
    path: /rentals/{id}/pickup
    description: Hand over the keys. A reserved rental becomes active, the vehicle becomes rented and odometer_out is recorded.
    input:
      odometer_out:
        type: int
        description: Odometer reading at pickup. Not below the vehicle odometer.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
    handler: "(ctx) => { const id = ctx.params.id; const r = ctx.db.get('rental', id); if (r === null) ctx.fail(404, 'not_found', 'rental ' + id + ' not found'); if (r.status !== 'reserved') ctx.fail(409, 'invalid_state', 'rental ' + id + ' is ' + r.status + '. Only reserved rentals can be picked up.'); const v = ctx.db.get('vehicle', r.vehicle_id); if (v.status !== 'available') ctx.fail(409, 'vehicle_unavailable', 'vehicle ' + v.id + ' is ' + v.status + ' and cannot be handed over'); if (ctx.body.odometer_out < v.odometer_km) ctx.fail(422, 'odometer_invalid', 'odometer_out ' + ctx.body.odometer_out + ' is below the vehicle odometer ' + v.odometer_km); const updated = ctx.db.update('rental', id, { status: 'active', picked_up_at: ctx.now(), odometer_out: ctx.body.odometer_out }); ctx.db.update('vehicle', v.id, { status: 'rented' }); return { status: 200, body: updated }; }"
  return_rental:
    method: POST
    path: /rentals/{id}/return
    description: Check the vehicle back in. An active rental becomes returned, returned_at is stamped with engine time, the vehicle odometer is updated and the vehicle becomes available at the return branch. No late fee is charged here, the daily job assesses it.
    input:
      odometer_in:
        type: int
        description: Odometer reading at return. Not below odometer_out.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      branch_id:
        type: ref
        description: Return branch. Defaults to the vehicle's current branch.
        required: false
        nullable: false
        unique: false
        readonly: false
        entity: branch
        onDelete: restrict
    handler: "(ctx) => { const id = ctx.params.id; const r = ctx.db.get('rental', id); if (r === null) ctx.fail(404, 'not_found', 'rental ' + id + ' not found'); if (r.status !== 'active') ctx.fail(409, 'invalid_state', 'rental ' + id + ' is ' + r.status + '. Only active rentals can be returned.'); const odo = ctx.body.odometer_in; if (r.odometer_out !== null && odo < r.odometer_out) ctx.fail(422, 'odometer_invalid', 'odometer_in ' + odo + ' is below odometer_out ' + r.odometer_out); const v = ctx.db.get('vehicle', r.vehicle_id); let branchId = v.branch_id; if (ctx.body.branch_id !== undefined && ctx.body.branch_id !== null) { const br = ctx.db.get('branch', ctx.body.branch_id); if (br === null) ctx.fail(404, 'not_found', 'branch ' + ctx.body.branch_id + ' not found'); branchId = br.id; } const updated = ctx.db.update('rental', id, { status: 'returned', returned_at: ctx.now(), odometer_in: odo }); const vpatch = { odometer_km: odo, branch_id: branchId }; if (v.status === 'rented') vpatch.status = 'available'; ctx.db.update('vehicle', v.id, vpatch); return { status: 200, body: updated }; }"
  cancel_rental:
    method: POST
    path: /rentals/{id}/cancel
    description: Cancel a reserved rental with a reason. The vehicle is left as it is.
    input:
      reason:
        type: string
        description: Why the reservation is cancelled.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 300
    handler: "(ctx) => { const id = ctx.params.id; const r = ctx.db.get('rental', id); if (r === null) ctx.fail(404, 'not_found', 'rental ' + id + ' not found'); if (r.status !== 'reserved') ctx.fail(409, 'invalid_state', 'rental ' + id + ' is ' + r.status + '. Only reserved rentals can be cancelled.'); const reason = ctx.body.reason.trim(); if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for cancel_rental: reason expected a non-blank string, found \"\"'); const updated = ctx.db.update('rental', id, { status: 'cancelled', cancel_reason: reason }); return { status: 200, body: updated }; }"
  close_rental:
    method: POST
    path: /rentals/{id}/close
    description: Close a returned rental. Refused with 409 late_fee_pending when the rental was late and its fee is not assessed yet, and with 409 claim_pending while a damage claim is open or under review.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const r = ctx.db.get('rental', id); if (r === null) ctx.fail(404, 'not_found', 'rental ' + id + ' not found'); if (r.status !== 'returned') ctx.fail(409, 'invalid_state', 'rental ' + id + ' is ' + r.status + '. Only returned rentals can be closed.'); const late = r.returned_at !== null && ctx.time.minutesBetween(r.due_at, r.returned_at) > 60; if (late && !r.late_fee_applied) ctx.fail(409, 'late_fee_pending', 'rental ' + id + ' was returned late and its late fee has not been assessed yet. Try again after the daily late fee job.'); const pending = ctx.db.list('damage_claim', { where: { rental_id: id } }).filter((c) => c.status === 'open' || c.status === 'under_review'); if (pending.length > 0) ctx.fail(409, 'claim_pending', 'rental ' + id + ' has damage claim ' + pending[0].id + ' still ' + pending[0].status + '. Resolve it first.'); const updated = ctx.db.update('rental', id, { status: 'closed' }); return { status: 200, body: updated }; }"
  waive_late_fee:
    method: POST
    path: /rentals/{id}/waive_late_fee
    description: Waive an assessed, non-zero late fee. Sets late_fee to 0, late_fee_waived to true and stores the reason. The daily job never re-adds it.
    input:
      reason:
        type: text
        description: Why the fee is waived.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const id = ctx.params.id; const r = ctx.db.get('rental', id); if (r === null) ctx.fail(404, 'not_found', 'rental ' + id + ' not found'); if (!r.late_fee_applied) ctx.fail(409, 'late_fee_not_assessed', 'rental ' + id + ' has no assessed late fee yet'); if (r.late_fee === 0) ctx.fail(409, 'no_late_fee', 'rental ' + id + ' has no late fee to waive'); const reason = ctx.body.reason.trim(); if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for waive_late_fee: reason expected a non-blank text, found \"\"'); const updated = ctx.db.update('rental', id, { late_fee: 0, late_fee_waived: true, late_fee_waive_reason: reason }); return { status: 200, body: updated }; }"
  file_damage_claim:
    method: POST
    path: /damage_claims
    description: File a damage claim against an active, returned or closed rental. vehicle_id is copied from the rental and filed_at is set to now. The claim starts open.
    input:
      rental_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: rental
        onDelete: restrict
      description:
        type: text
        description: What was damaged.
        required: true
        nullable: false
        unique: false
        readonly: false
      estimated_cost:
        type: money
        description: Estimated repair cost in USD cents. Above 0.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
    handler: "(ctx) => { const r = ctx.db.get('rental', ctx.body.rental_id); if (r === null) ctx.fail(404, 'not_found', 'rental ' + ctx.body.rental_id + ' not found'); if (r.status !== 'active' && r.status !== 'returned' && r.status !== 'closed') ctx.fail(409, 'invalid_state', 'rental ' + r.id + ' is ' + r.status + '. Claims can be filed only against active, returned or closed rentals.'); if (ctx.body.estimated_cost <= 0) ctx.fail(422, 'invalid_estimate', 'estimated_cost must be above 0'); const desc = ctx.body.description.trim(); if (desc === '') ctx.fail(400, 'input.invalid', 'Invalid input for file_damage_claim: description expected a non-blank text, found \"\"'); const claim = ctx.db.create('damage_claim', { rental_id: r.id, vehicle_id: r.vehicle_id, description: desc, estimated_cost: ctx.body.estimated_cost, status: 'open', filed_at: ctx.now() }); return { status: 201, body: claim }; }"
  review_claim:
    method: POST
    path: /damage_claims/{id}/review
    description: Move an open claim to under_review.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const c = ctx.db.get('damage_claim', id); if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found'); if (c.status !== 'open') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only open claims can be reviewed.'); const updated = ctx.db.update('damage_claim', id, { status: 'under_review' }); return { status: 200, body: updated }; }"
  approve_claim:
    method: POST
    path: /damage_claims/{id}/approve
    description: Approve an under_review claim at an approved_amount between 1 and the estimate. Sets resolved_at. An available vehicle moves to maintenance, a rented one stays rented until returned.
    input:
      approved_amount:
        type: money
        description: Approved amount in USD cents, at most estimated_cost.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
    handler: "(ctx) => { const id = ctx.params.id; const c = ctx.db.get('damage_claim', id); if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found'); if (c.status !== 'under_review') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only under_review claims can be approved.'); const amt = ctx.body.approved_amount; if (amt < 1 || amt > c.estimated_cost) ctx.fail(422, 'invalid_amount', 'approved_amount must be between 1 and the estimated cost ' + c.estimated_cost); const updated = ctx.db.update('damage_claim', id, { status: 'approved', approved_amount: amt, resolved_at: ctx.now() }); const v = ctx.db.get('vehicle', c.vehicle_id); if (v !== null && v.status === 'available') ctx.db.update('vehicle', v.id, { status: 'maintenance' }); return { status: 200, body: updated }; }"
  deny_claim:
    method: POST
    path: /damage_claims/{id}/deny
    description: Deny an open or under_review claim with a reason. Stores denial_reason and sets resolved_at.
    input:
      reason:
        type: text
        description: Why the claim is denied.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const id = ctx.params.id; const c = ctx.db.get('damage_claim', id); if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found'); if (c.status !== 'open' && c.status !== 'under_review') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only open or under_review claims can be denied.'); const reason = ctx.body.reason.trim(); if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for deny_claim: reason expected a non-blank text, found \"\"'); const updated = ctx.db.update('damage_claim', id, { status: 'denied', denial_reason: reason, resolved_at: ctx.now() }); return { status: 200, body: updated }; }"
  settle_claim:
    method: POST
    path: /damage_claims/{id}/settle
    description: Settle an approved claim by adding its approved_amount to the rental damage_charge. Refused with 409 when the rental is cancelled.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const c = ctx.db.get('damage_claim', id); if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found'); if (c.status !== 'approved') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only approved claims can be settled.'); const r = ctx.db.get('rental', c.rental_id); if (r.status === 'cancelled') ctx.fail(409, 'rental_cancelled', 'rental ' + r.id + ' is cancelled, so its claim cannot be settled'); ctx.db.update('rental', r.id, { damage_charge: r.damage_charge + c.approved_amount }); const updated = ctx.db.update('damage_claim', id, { status: 'settled' }); return { status: 200, body: updated }; }"
jobs:
  late_fee_assessment:
    description: "Every day. For each returned rental not yet assessed: if it came back more than 60 minutes after due_at, set late_fee to ceil(minutes_late / 1440) days times 150% of the daily rate. Mark late_fee_applied either way so nothing is charged twice. Waived rentals are skipped."
    every: 1d
    run: "(ctx) => { for (const r of ctx.db.list('rental', { where: { status: 'returned', late_fee_applied: false } })) { if (r.late_fee_waived) continue; let fee = 0; if (r.returned_at !== null) { const late = ctx.time.minutesBetween(r.due_at, r.returned_at); if (late > 60) fee = Math.round(Math.ceil(late / 1440) * r.daily_rate * 3 / 2); } ctx.db.update('rental', r.id, { late_fee: fee, late_fee_applied: true }); } }"
  expire_no_shows:
    description: Every day. Cancel every reserved rental whose pickup_at is more than 24 hours in the past, with cancel_reason no_show.
    every: 1d
    run: "(ctx) => { const now = ctx.now(); for (const r of ctx.db.list('rental', { where: { status: 'reserved' } })) { if (ctx.time.minutesBetween(r.pickup_at, now) > 1440) ctx.db.update('rental', r.id, { status: 'cancelled', cancel_reason: 'no_show' }); } }"
