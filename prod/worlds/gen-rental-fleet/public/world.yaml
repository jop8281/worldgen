son,upd:reason==='no_show'?Math.max(0,p-1500):p+200}); } const elig=[]; rows.forEach((r,i)=>{ if (r.status==='returned'||r.status==='closed') elig.push(i); }); for (const p of planClaims(elig.length)) { if (p.status==='settled') rows[elig[p.ri]].damage_charge=p.appr; } return rows; }"
  damage_claim: "(ctx) => { const BASE='2026-01-01T00:00:00.000Z'; const X=ctx.time.minutesBetween(BASE, ctx.now()); const iso=(a)=> a===X?BASE:ctx.time.plus(BASE,(X-a)+'m'); const planClaims=(n)=>{ const order=[]; for (const [s,c] of [['open',10],['under_review',28],['approved',8],['denied',6],['settled',8]]) for (let i=0;i<c;i++) order.push(s); const vals=[4500,7500,9900,14999,18000,22500,35000,48000,62000,89900,125000,210000,300000]; const seen={}; const out=[]; for (let k=0;k<60;k++) { const status=order[(k*17)%60]; const j=seen[status]||0; seen[status]=j+1; let est; if (status==='under_review') { est = j===0?15000 : j%3===1 ? 4000+(j*1370)%10000 : j%3===2 ? 15050+(j*9137)%280000 : 20000+(j*13337)%280000; } else est=vals[(k*5)%vals.length]; const appr=(status==='approved'||status==='settled')?Math.max(1,Math.floor(est*0.8)):null; out.push({k,status,est,appr,ri:(k*7+3)%n}); } return out; }; const descs=['Dent on rear bumper','Scratched driver side door','Cracked windshield from road debris','Curb rash on front right wheel','Torn rear seat upholstery','Broken side mirror','Hail damage on roof and hood','Interior stain on carpet','Cracked tail light','Door ding in parking lot']; const denials=['Pre-existing damage noted at pickup','Minor wear and tear','Damage not attributable to the rental']; const elig=ctx.rows('rental').filter((r)=>r.status==='returned'||r.status==='closed'); const out=[]; for (const p of planClaims(elig.length)) { const r=elig[p.ri]; const rA=X-ctx.time.minutesBetween(BASE,r.returned_at); const f=Math.floor(rA/2); const open=p.status==='open'||p.status==='under_review'; const done=open?null:Math.floor(f/2); out.push({ f, row:{ rental_id:r.id, vehicle_id:r.vehicle_id, description:descs[p.k%descs.length], estimated_cost:p.est, approved_amount:p.appr, status:p.status, filed_at:iso(f), resolved_at:open?null:iso(done), denial_reason:p.status==='denied'?denials[p.k%3]:null, created_at:iso(f), updated_at:iso(open?f:done) } }); } out.sort((a,b)=>b.f-a.f); return out.map((o)=>o.row); }"
tests:
  reserve_rental_rules:
    description: reserve_rental snapshots the rate, charges days rounded up, and refuses a bad window, an overlap, a blocked customer and an unavailable vehicle. Back to back windows are allowed. Also exercises create_branch.
    script: "(ctx) => { const S='2026-10-06T09:00:00.000Z'; const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body)); const setup=(tag,rate)=>{const b=ctx.api('POST','/branches',{code:'T'+tag,name:'Test Branch '+tag,city:'Testville'});ok(b,'create branch');const v=ctx.api('POST','/vehicles',{plate:'TST-'+tag,make:'Toyota',model:'Corolla',vehicle_class:'compact',daily_rate:rate,branch_id:b.body.id,odometer_km:1000});ok(v,'create vehicle');const c=ctx.api('POST','/customers',{name:'Test Driver '+tag,email:'driver'+tag.toLowerCase()+'@test.example',license_number:'LIC-T-'+tag});ok(c,'create customer');return {b:b.body,v:v.body,c:c.body};}; const reserve=(s,p,d)=>ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:s.v.id,pickup_at:p,due_at:d}); const s=setup('R1',5000); const dup=ctx.api('POST','/branches',{code:'TR1',name:'Dup',city:'X'}); ctx.assert(dup.status===409&&dup.body.error.code==='duplicate_code','duplicate branch code: '+JSON.stringify(dup)); const bad=reserve(s,'2026-10-10T09:00:00.000Z','2026-10-10T09:00:00.000Z'); ctx.assert(bad.status===422&&bad.body.error.code==='invalid_window','bad window: '+JSON.stringify(bad)); const r=reserve(s,'2026-10-10T09:00:00.000Z','2026-10-12T10:00:00.000Z'); ctx.assert(r.status===201,'reserve: '+JSON.stringify(r)); ctx.assert(r.body.status==='reserved'&&r.body.daily_rate===5000&&r.body.base_charge===15000&&r.body.pickup_branch_id===s.b.id&&r.body.late_fee===0&&r.body.late_fee_applied===false&&r.body.damage_charge===0,'rental fields: '+JSON.stringify(r.body)); const clash=reserve(s,'2026-10-11T09:00:00.000Z','2026-10-13T09:00:00.000Z'); ctx.assert(clash.status===409&&clash.body.error.code==='vehicle_overlap','overlap: '+JSON.stringify(clash)); const next=reserve(s,'2026-10-12T10:00:00.000Z','2026-10-13T10:00:00.000Z'); ctx.assert(next.status===201&&next.body.base_charge===5000,'back to back: '+JSON.stringify(next)); ok(ctx.api('PATCH','/customers/'+s.c.id,{blocked:true}),'block customer'); const blocked=reserve(s,'2026-11-01T09:00:00.000Z','2026-11-02T09:00:00.000Z'); ctx.assert(blocked.status===409&&blocked.body.error.code==='customer_blocked','blocked: '+JSON.stringify(blocked)); ok(ctx.api('PATCH','/customers/'+s.c.id,{blocked:false}),'unblock customer'); const v2=ctx.api('POST','/vehicles',{plate:'TST-R1M',make:'Ford',model:'Focus',vehicle_class:'compact',daily_rate:4000,branch_id:s.b.id,odometer_km:500}); ok(v2,'create vehicle 2'); ok(ctx.api('PATCH','/vehicles/'+v2.body.id,{status:'maintenance'}),'maintenance'); const un=ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:v2.body.id,pickup_at:'2026-11-01T09:00:00.000Z',due_at:'2026-11-02T09:00:00.000Z'}); ctx.assert(un.status===409&&un.body.error.code==='vehicle_unavailable','unavailable: '+JSON.stringify(un)); const ghost=ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:'veh_9999',pickup_at:'2026-11-01T09:00:00.000Z',due_at:'2026-11-02T09:00:00.000Z'}); ctx.assert(ghost.status>=400&&ghost.status<500,'unknown vehicle: '+ghost.status); const hist=ctx.api('GET','/vehicles/'+s.v.id+'/rentals'); ctx.assert(hist.body.data.length===2,'two rentals on the vehicle, got '+hist.body.data.length); }"
  pickup_and_return_flow:
    description: pickup_rental makes the rental active and the vehicle rented. return_rental stamps returned_at, updates the odometer and moves the vehicle to the return branch as available. Both refuse bad odometer readings and wrong states.
    script: "(ctx) => { const S='2026-10-06T09:00:00.000Z'; const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body)); const setup=(tag,rate)=>{const b=ctx.api('POST','/branches',{code:'T'+tag,name:'Test Branch '+tag,city:'Testville'});ok(b,'create branch');const v=ctx.api('POST','/vehicles',{plate:'TST-'+tag,make:'Toyota',model:'Corolla',vehicle_class:'compact',daily_rate:rate,branch_id:b.body.id,odometer_km:1000});ok(v,'create vehicle');const c=ctx.api('POST','/customers',{name:'Test Driver '+tag,email:'driver'+tag.toLowerCase()+'@test.example',license_number:'LIC-T-'+tag});ok(c,'create customer');return {b:b.body,v:v.body,c:c.body};}; const reserve=(s,p,d)=>ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:s.v.id,pickup_at:p,due_at:d}); const act=(path,body)=>ctx.api('POST',path,body||{}); const s=setup('P1',8000); const b2=ctx.api('POST','/branches',{code:'TP1B',name:'Second Test Branch',city:'Elsewhere'}); ok(b2,'create branch 2'); const r=reserve(s,'2026-10-07T09:00:00.000Z','2026-10-08T09:00:00.000Z'); ok(r,'reserve'); const id=r.body.id; const noreturn=act('/rentals/'+id+'/return',{odometer_in:1100}); ctx.assert(noreturn.status===409&&noreturn.body.error.code==='invalid_state','return of reserved rental: '+JSON.stringify(noreturn)); const low=act('/rentals/'+id+'/pickup',{odometer_out:900}); ctx.assert(low.status===422&&low.body.error.code==='odometer_invalid','pickup low odometer: '+JSON.stringify(low)); const pk=act('/rentals/'+id+'/pickup',{odometer_out:1010}); ctx.assert(pk.status===200&&pk.body.status==='active'&&pk.body.odometer_out===1010&&pk.body.picked_up_at!==null,'pickup: '+JSON.stringify(pk)); const veh=ctx.api('GET','/vehicles/'+s.v.id).body; ctx.assert(veh.status==='rented','vehicle rented, got '+veh.status); const again=act('/rentals/'+id+'/pickup',{odometer_out:1010}); ctx.assert(again.status===409&&again.body.error.code==='invalid_state','second pickup: '+JSON.stringify(again)); const lowin=act('/rentals/'+id+'/return',{odometer_in:1005}); ctx.assert(lowin.status===422&&lowin.body.error.code==='odometer_invalid','return low odometer: '+JSON.stringify(lowin)); const at=ctx.now(); const ret=act('/rentals/'+id+'/return',{odometer_in:1250,branch_id:b2.body.id}); ctx.assert(ret.status===200&&ret.body.status==='returned'&&ret.body.odometer_in===1250&&ret.body.returned_at!==null&&ret.body.late_fee===0&&ret.body.late_fee_applied===false,'return: '+JSON.stringify(ret)); ctx.assert(ret.body.returned_at===at,'returned_at is call time '+at+', got '+ret.body.returned_at); const after=ctx.api('GET','/vehicles/'+s.v.id).body; ctx.assert(after.status==='available'&&after.odometer_km===1250&&after.branch_id===b2.body.id,'vehicle checked in: '+JSON.stringify(after)); const twice=act('/rentals/'+id+'/return',{odometer_in:1300}); ctx.assert(twice.status===409&&twice.body.error.code==='invalid_state','second return: '+JSON.stringify(twice)); const missing=act('/rentals/rnt_9999/pickup',{odometer_out:1}); ctx.assert(missing.status===404&&missing.body.error.code==='not_found','missing rental: '+JSON.stringify(missing)); }"
  cancel_rental_rules:
    description: cancel_rental needs a reserved rental and a non-blank reason, stores cancel_reason, leaves the vehicle alone and frees the window. Active and cancelled rentals cannot be cancelled.
    script: "(ctx) => { const S='2026-10-06T09:00:00.000Z'; const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body)); const setup=(tag,rate)=>{const b=ctx.api('POST','/branches',{code:'T'+tag,name:'Test Branch '+tag,city:'Testville'});ok(b,'create branch');const v=ctx.api('POST','/vehicles',{plate:'TST-'+tag,make:'Toyota',model:'Corolla',vehicle_class:'compact',daily_rate:rate,branch_id:b.body.id,odometer_km:1000});ok(v,'create vehicle');const c=ctx.api('POST','/customers',{name:'Test Driver '+tag,email:'driver'+tag.toLowerCase()+'@test.example',license_number:'LIC-T-'+tag});ok(c,'create customer');return {b:b.body,v:v.body,c:c.body};}; const reserve=(s,p,d)=>ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:s.v.id,pickup_at:p,due_at:d}); const act=(path,body)=>ctx.api('POST',path,body||{}); const s=setup('C1',6000); const r=reserve(s,'2026-10-20T09:00:00.000Z','2026-10-22T09:00:00.000Z'); ok(r,'reserve'); const id=r.body.id; const none=act('/rentals/'+id+'/cancel',{}); ctx.assert(none.status===400&&none.body.error.code==='input.invalid','missing reason: '+JSON.stringify(none)); const blank=act('/rentals/'+id+'/cancel',{reason:'   '}); ctx.assert(blank.status===400&&blank.body.error.code==='input.invalid','blank reason: '+JSON.stringify(blank)); const c=act('/rentals/'+id+'/cancel',{reason:'trip called off'}); ctx.assert(c.status===200&&c.body.status==='cancelled'&&c.body.cancel_reason==='trip called off','cancel: '+JSON.stringify(c)); const veh=ctx.api('GET','/vehicles/'+s.v.id).body; ctx.assert(veh.status==='available','vehicle unchanged, got '+veh.status); const again=act('/rentals/'+id+'/cancel',{reason:'again'}); ctx.assert(again.status===409&&again.body.error.code==='invalid_state','second cancel: '+JSON.stringify(again)); const rebook=reserve(s,'2026-10-20T09:00:00.000Z','2026-10-22T09:00:00.000Z'); ctx.assert(rebook.status===201,'window is free again: '+JSON.stringify(rebook)); const r2=reserve(s,'2026-10-07T09:00:00.000Z','2026-10-08T09:00:00.000Z'); ok(r2,'reserve 2'); ok(act('/rentals/'+r2.body.id+'/pickup',{odometer_out:1000}),'pickup'); const act2=act('/rentals/'+r2.body.id+'/cancel',{reason:'too late'}); ctx.assert(act2.status===409&&act2.body.error.code==='invalid_state','cancel active: '+JSON.stringify(act2)); }"
  late_fee_assess_waive_close:
    description: A rental returned 36h late cannot be closed or waived until the daily job assesses ceil(days) x 150% of the rate. The job never charges twice. waive_late_fee zeroes it and records the reason, and then the rental can be closed.
    script: "(ctx) => { const S='2026-10-06T09:00:00.000Z'; const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body)); const setup=(tag,rate)=>{const b=ctx.api('POST','/branches',{code:'T'+tag,name:'Test Branch '+tag,city:'Testville'});ok(b,'create branch');const v=ctx.api('POST','/vehicles',{plate:'TST-'+tag,make:'Toyota',model:'Corolla',vehicle_class:'compact',daily_rate:rate,branch_id:b.body.id,odometer_km:1000});ok(v,'create vehicle');const c=ctx.api('POST','/customers',{name:'Test Driver '+tag,email:'driver'+tag.toLowerCase()+'@test.example',license_number:'LIC-T-'+tag});ok(c,'create customer');return {b:b.body,v:v.body,c:c.body};}; const reserve=(s,p,d)=>ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:s.v.id,pickup_at:p,due_at:d}); const act=(path,body)=>ctx.api('POST',path,body||{}); const s=setup('L1',10000); const r=reserve(s,S,'2026-10-07T09:00:00.000Z'); ok(r,'reserve'); const id=r.body.id; ok(act('/rentals/'+id+'/pickup',{odometer_out:1000}),'pickup'); const a1=ctx.advance('60h'); ctx.assert(a1.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a1.jobsFailed)); ok(act('/rentals/'+id+'/return',{odometer_in:1300}),'return'); const early=act('/rentals/'+id+'/waive_late_fee',{reason:'flight delay'}); ctx.assert(early.status===409&&early.body.error.code==='late_fee_not_assessed','waive before assessment: '+JSON.stringify(early)); const pend=act('/rentals/'+id+'/close'); ctx.assert(pend.status===409&&pend.body.error.code==='late_fee_pending','close before assessment: '+JSON.stringify(pend)); const a2=ctx.advance('1d'); ctx.assert(a2.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a2.jobsFailed)); ctx.assert(a2.jobsFired.includes('late_fee_assessment'),'late_fee_assessment fired: '+JSON.stringify(a2.jobsFired)); const after=ctx.api('GET','/rentals/'+id).body; ctx.assert(after.late_fee_applied===true&&after.late_fee===30000,'late fee 2 days x 150% x 10000 = 30000, got '+JSON.stringify(after)); ctx.advance('2d'); const still=ctx.api('GET','/rentals/'+id).body; ctx.assert(still.late_fee===30000,'not charged twice, got '+still.late_fee); const blank=act('/rentals/'+id+'/waive_late_fee',{reason:'  '}); ctx.assert(blank.status===400&&blank.body.error.code==='input.invalid','blank waive reason: '+JSON.stringify(blank)); const w=act('/rentals/'+id+'/waive_late_fee',{reason:'flight delay'}); ctx.assert(w.status===200&&w.body.late_fee===0&&w.body.late_fee_waived===true&&w.body.late_fee_waive_reason==='flight delay','waive: '+JSON.stringify(w)); const w2=act('/rentals/'+id+'/waive_late_fee',{reason:'again'}); ctx.assert(w2.status===409&&w2.body.error.code==='no_late_fee','second waive: '+JSON.stringify(w2)); ctx.advance('2d'); const kept=ctx.api('GET','/rentals/'+id).body; ctx.assert(kept.late_fee===0&&kept.late_fee_waived===true,'waived fee stays zero: '+JSON.stringify(kept)); const cl=act('/rentals/'+id+'/close'); ctx.assert(cl.status===200&&cl.body.status==='closed','close: '+JSON.stringify(cl)); const cl2=act('/rentals/'+id+'/close'); ctx.assert(cl2.status===409&&cl2.body.error.code==='invalid_state','close twice: '+JSON.stringify(cl2)); }"
  grace_period_no_fee:
    description: A rental returned less than 60 minutes after due_at is inside the grace period. The job marks it assessed with a zero fee, and there is nothing to waive.
    script: "(ctx) => { const S='2026-10-06T09:00:00.000Z'; const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body)); const setup=(tag,rate)=>{const b=ctx.api('POST','/branches',{code:'T'+tag,name:'Test Branch '+tag,city:'Testville'});ok(b,'create branch');const v=ctx.api('POST','/vehicles',{plate:'TST-'+tag,make:'Toyota',model:'Corolla',vehicle_class:'compact',daily_rate:rate,branch_id:b.body.id,odometer_km:1000});ok(v,'create vehicle');const c=ctx.api('POST','/customers',{name:'Test Driver '+tag,email:'driver'+tag.toLowerCase()+'@test.example',license_number:'LIC-T-'+tag});ok(c,'create customer');return {b:b.body,v:v.body,c:c.body};}; const reserve=(s,p,d)=>ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:s.v.id,pickup_at:p,due_at:d}); const act=(path,body)=>ctx.api('POST',path,body||{}); const s=setup('G1',7000); const r=reserve(s,S,'2026-10-06T10:00:00.000Z'); ok(r,'reserve'); const id=r.body.id; ok(act('/rentals/'+id+'/pickup',{odometer_out:1000}),'pickup'); ctx.advance('90m'); ok(act('/rentals/'+id+'/return',{odometer_in:1040}),'return'); const a=ctx.advance('1d'); ctx.assert(a.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a.jobsFailed)); const after=ctx.api('GET','/rentals/'+id).body; ctx.assert(after.late_fee_applied===true&&after.late_fee===0,'assessed with no fee: '+JSON.stringify(after)); const w=act('/rentals/'+id+'/waive_late_fee',{reason:'none due'}); ctx.assert(w.status===409&&w.body.error.code==='no_late_fee','nothing to waive: '+JSON.stringify(w)); const cl=act('/rentals/'+id+'/close'); ctx.assert(cl.status===200&&cl.body.status==='closed','close: '+JSON.stringify(cl)); }"
  expire_no_shows_job:
    description: The daily job cancels reserved rentals more than 24h past pickup_at with cancel_reason no_show, and leaves later reservations alone.
    script: "(ctx) => { const S='2026-10-06T09:00:00.000Z'; const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body)); const setup=(tag,rate)=>{const b=ctx.api('POST','/branches',{code:'T'+tag,name:'Test Branch '+tag,city:'Testville'});ok(b,'create branch');const v=ctx.api('POST','/vehicles',{plate:'TST-'+tag,make:'Toyota',model:'Corolla',vehicle_class:'compact',daily_rate:rate,branch_id:b.body.id,odometer_km:1000});ok(v,'create vehicle');const c=ctx.api('POST','/customers',{name:'Test Driver '+tag,email:'driver'+tag.toLowerCase()+'@test.example',license_number:'LIC-T-'+tag});ok(c,'create customer');return {b:b.body,v:v.body,c:c.body};}; const reserve=(s,p,d)=>ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:s.v.id,pickup_at:p,due_at:d}); const s=setup('N1',4000); const r1=reserve(s,'2026-10-06T10:00:00.000Z','2026-10-07T10:00:00.000Z'); ok(r1,'reserve 1'); const r2=reserve(s,'2026-10-20T09:00:00.000Z','2026-10-21T09:00:00.000Z'); ok(r2,'reserve 2'); const a=ctx.advance('3d'); ctx.assert(a.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a.jobsFailed)); ctx.assert(a.jobsFired.includes('expire_no_shows'),'expire_no_shows fired: '+JSON.stringify(a.jobsFired)); const n1=ctx.api('GET','/rentals/'+r1.body.id).body; ctx.assert(n1.status==='cancelled'&&n1.cancel_reason==='no_show','no show cancelled: '+JSON.stringify(n1)); const n2=ctx.api('GET','/rentals/'+r2.body.id).body; ctx.assert(n2.status==='reserved'&&n2.cancel_reason===null,'future reservation kept: '+JSON.stringify(n2)); const veh=ctx.api('GET','/vehicles/'+s.v.id).body; ctx.assert(veh.status==='available','vehicle still available, got '+veh.status); }"
  damage_claim_review_flow:
    description: file_damage_claim, review_claim, approve_claim, deny_claim and settle_claim follow the review pipeline. Approval caps at the estimate and moves an available vehicle to maintenance. Settling adds to damage_charge. A pending claim blocks close_rental.
    script: "(ctx) => { const S='2026-10-06T09:00:00.000Z'; const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body)); const setup=(tag,rate)=>{const b=ctx.api('POST','/branches',{code:'T'+tag,name:'Test Branch '+tag,city:'Testville'});ok(b,'create branch');const v=ctx.api('POST','/vehicles',{plate:'TST-'+tag,make:'Toyota',model:'Corolla',vehicle_class:'compact',daily_rate:rate,branch_id:b.body.id,odometer_km:1000});ok(v,'create vehicle');const c=ctx.api('POST','/customers',{name:'Test Driver '+tag,email:'driver'+tag.toLowerCase()+'@test.example',license_number:'LIC-T-'+tag});ok(c,'create customer');return {b:b.body,v:v.body,c:c.body};}; const reserve=(s,p,d)=>ctx.api('POST','/rentals',{customer_id:s.c.id,vehicle_id:s.v.id,pickup_at:p,due_at:d}); const act=(path,body)=>ctx.api('POST',path,body||{}); const file=(rid,cost)=>ctx.api('POST','/damage_claims',{rental_id:rid,description:'Dent on rear door',estimated_cost:cost}); const s=setup('CL1',6000); const r=reserve(s,'2026-10-07T09:00:00.000Z','2026-10-09T09:00:00.000Z'); ok(r,'reserve'); const rid=r.body.id; const early=file(rid,20000); ctx.assert(early.status===409&&early.body.error.code==='invalid_state','claim on reserved rental: '+JSON.stringify(early)); ok(act('/rentals/'+rid+'/pickup',{odometer_out:1000}),'pickup'); ok(act('/rentals/'+rid+'/return',{odometer_in:1100}),'return'); const zero=file(rid,0); ctx.assert(zero.status>=400&&zero.status<500,'zero estimate refused: '+zero.status); const c1=file(rid,20000); ctx.assert(c1.status===201&&c1.body.status==='open'&&c1.body.vehicle_id===s.v.id&&c1.body.rental_id===rid&&c1.body.filed_at!==null&&c1.body.approved_amount===null,'file: '+JSON.stringify(c1)); const id1=c1.body.id; const pre=act('/damage_claims/'+id1+'/approve',{approved_amount:15000}); ctx.assert(pre.status===409&&pre.body.error.code==='invalid_state','approve before review: '+JSON.stringify(pre)); const rv=act('/damage_claims/'+id1+'/review'); ctx.assert(rv.status===200&&rv.body.status==='under_review','review: '+JSON.stringify(rv)); const rv2=act('/damage_claims/'+id1+'/review'); ctx.assert(rv2.status===409&&rv2.body.error.code==='invalid_state','review twice: '+JSON.stringify(rv2)); const big=act('/damage_claims/'+id1+'/approve',{approved_amount:25000}); ctx.assert(big.status===422&&big.body.error.code==='invalid_amount','approve above estimate: '+JSON.stringify(big)); const ap=act('/damage_claims/'+id1+'/approve',{approved_amount:15000}); ctx.assert(ap.status===200&&ap.body.status==='approved'&&ap.body.approved_amount===15000&&ap.body.resolved_at!==null,'approve: '+JSON.stringify(ap)); const veh=ctx.api('GET','/vehicles/'+s.v.id).body; ctx.assert(veh.status==='maintenance','vehicle in maintenance, got '+veh.status); const dn=act('/damage_claims/'+id1+'/deny',{reason:'changed mind'}); ctx.assert(dn.status===409&&dn.body.error.code==='invalid_state','deny approved: '+JSON.stringify(dn)); const st=act('/damage_claims/'+id1+'/settle'); ctx.assert(st.status===200&&st.body.status==='settled','settle: '+JSON.stringify(st)); const rent=ctx.api('GET','/rentals/'+rid).body; ctx.assert(rent.damage_charge===15000,'damage_charge 15000, got '+rent.damage_charge); const st2=act('/damage_claims/'+id1+'/settle'); ctx.assert(st2.status===409&&st2.body.error.code==='invalid_state','settle twice: '+JSON.stringify(st2)); const c2=file(rid,5000); ok(c2,'file 2'); const id2=c2.body.id; const blank=act('/damage_claims/'+id2+'/deny',{reason:'   '}); ctx.assert(blank.status===400&&blank.body.error.code==='input.invalid','blank deny reason: '+JSON.stringify(blank)); const d2=act('/damage_claims/'+id2+'/deny',{reason:'minor wear and tear'}); ctx.assert(d2.status===200&&d2.body.status==='denied'&&d2.body.denial_reason==='minor wear and tear'&&d2.body.resolved_at!==null,'deny open claim: '+JSON.stringify(d2)); const ap2=act('/damage_claims/'+id2+'/approve',{approved_amount:100}); ctx.assert(ap2.status===409,'approve denied: '+JSON.stringify(ap2)); const c3=file(rid,8000); ok(c3,'file 3'); const id3=c3.body.id; const cl1=act('/rentals/'+rid+'/close'); ctx.assert(cl1.status===409&&cl1.body.error.code==='claim_pending','close with open claim: '+JSON.stringify(cl1)); ok(act('/damage_claims/'+id3+'/review'),'review 3'); const cl2=act('/rentals/'+rid+'/close'); ctx.assert(cl2.status===409&&cl2.body.error.code==='claim_pending','close with claim under review: '+JSON.stringify(cl2)); const d3=act('/damage_claims/'+id3+'/deny',{reason:'pre-existing damage'}); ctx.assert(d3.status===200&&d3.body.status==='denied','deny under_review: '+JSON.stringify(d3)); const cl3=act('/rentals/'+rid+'/close'); ctx.assert(cl3.status===200&&cl3.body.status==='closed','close: '+JSON.stringify(cl3)); const c4=file(rid,3000); ctx.assert(c4.status===201,'claim on closed rental: '+JSON.stringify(c4)); const list=ctx.api('GET','/rentals/'+rid+'/damage_claims'); ctx.assert(list.body.data.length===4,'four claims on the rental, got '+list.body.data.length); const miss=act('/damage_claims/clm_9999/review'); ctx.assert(miss.status===404&&miss.body.error.code==='not_found','missing claim: '+JSON.stringify(miss)); }"
