format: 1
meta:
  name: gen_rental_fleet
  description: A stateful car rental fleet. Branches hold vehicles. Customers reserve a vehicle for a pickup and due window. Agents pick up, return, cancel and close rentals. Damage claims move through review to approved, denied or settled. A daily job assesses a late fee on rentals returned after their due time, and a second daily job cancels no-show reservations. Most changes go through actions that keep the rental, vehicle and claim state machines consistent.
  resembles: "Car rental fleet management system (Enterprise/Hertz-style rental ops backend): vehicles, customers, reservations and rentals, damage claims, late fees"
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  branch:
    description: A rental location where vehicles are based and picked up, identified by a short code.
    idPrefix: brn
    fields:
      code:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 10
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
  vehicle:
    description: A car in the fleet. Belongs to a home branch. rented is set only by pickup_rental and cleared only by return_rental.
    idPrefix: veh
    fields:
      plate:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 15
      make:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
      model:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
      vehicle_class:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - economy
          - compact
          - suv
          - luxury
          - van
      daily_rate:
        type: money
        description: Daily rental rate in USD cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - available
          - rented
          - maintenance
          - retired
        initial: available
        transitions:
          available:
            - rented
            - maintenance
            - retired
          rented:
            - available
            - maintenance
          maintenance:
            - available
            - retired
          retired: []
      branch_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: branch
        onDelete: restrict
      odometer_km:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
  customer:
    description: A driver who rents cars. The blocked flag stops new reservations.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      license_number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 30
      phone:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 30
      blocked:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: false
  rental:
    description: A reservation that becomes a rental. Created only by the reserve_rental action. All money in USD cents.
    idPrefix: rnt
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: customer
        onDelete: restrict
      vehicle_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: vehicle
        onDelete: restrict
      pickup_branch_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: branch
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - reserved
          - active
          - returned
          - closed
          - cancelled
        initial: reserved
        transitions:
          reserved:
            - active
            - cancelled
          active:
            - returned
          returned:
            - closed
          closed: []
          cancelled: []
      pickup_at:
        type: datetime
        description: Scheduled pickup time.
        required: true
        nullable: false
        unique: false
        readonly: true
      due_at:
        type: datetime
        description: Scheduled return time.
        required: true
        nullable: false
        unique: false
        readonly: true
      picked_up_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      returned_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      daily_rate:
        type: money
        description: Snapshot of the vehicle daily rate at reservation.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      base_charge:
        type: money
        description: Daily rate times days in the window, rounded up, minimum 1.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      late_fee:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      late_fee_applied:
        type: bool
        description: True once the late fee assessment job has processed this rental.
        required: true
        nullable: false
        unique: false
        readonly: true
        default: false
      late_fee_waived:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: true
        default: false
      late_fee_waive_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      damage_charge:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      odometer_out:
        type: int
        required: false
        nullable: true
        unique: false
        readonly: true
        min: 0
      odometer_in:
        type: int
        required: false
        nullable: true
        unique: false
        readonly: true
        min: 0
      cancel_reason:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: true
        maxLength: 300
  damage_claim:
    description: A damage report against a rental and its vehicle, reviewed to an approved amount or denied, then settled onto the rental damage charge. Created by file_damage_claim.
    idPrefix: clm
    fields:
      rental_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: rental
        onDelete: restrict
      vehicle_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: vehicle
        onDelete: restrict
      description:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: true
      estimated_cost:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 1
      approved_amount:
        type: money
        required: false
        nullable: true
        unique: false
        readonly: true
        currency: USD
        min: 1
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - open
          - under_review
          - approved
          - denied
          - settled
        initial: open
        transitions:
          open:
            - under_review
            - denied
          under_review:
            - approved
            - denied
          approved:
            - settled
          denied: []
          settled: []
      filed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
      resolved_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      denial_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
