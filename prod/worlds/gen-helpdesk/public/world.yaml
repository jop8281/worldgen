format: 1
meta:
  name: gen_helpdesk3
  description: A customer-support helpdesk. Customers on standard, premium or enterprise tiers file tickets. Agents work them through a fixed lifecycle (new, open, pending, escalated, resolved, closed). Each (tier, priority) pair has an SLA resolution target that sets a due time and a breach flag. Escalation hands a ticket to the agent on call at level 1 right now, and a timeout can push urgent tickets to level 2. Background jobs flag SLA breaches, auto-escalate breached urgent tickets, time out level 1 escalations and auto-close old resolved tickets.
  resembles: Zendesk Support-style helpdesk (tickets API) with SLA policies and PagerDuty-style on-call escalation
  source: worldgen
  seed: 0
  clock:
    start: 2026-03-02T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A company that files tickets. Its tier selects the SLA policy.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      tier:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - standard
          - premium
          - enterprise
      email:
        type: string
        required: false
        nullable: true
        unique: true
        readonly: false
        format: email
  agent:
    description: A support agent. tier2 staffs on-call level 1 and sre staffs level 2. Inactive agents cannot be assigned.
    idPrefix: agt
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      team:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - tier1
          - tier2
          - sre
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  sla_policy:
    description: Resolution target in minutes for one (customer tier, ticket priority) pair. code is <tier>_<priority>.
    idPrefix: sla
    fields:
      code:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      tier:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - standard
          - premium
          - enterprise
      priority:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - low
          - normal
          - high
          - urgent
      resolution_minutes:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 5
  oncall_shift:
    description: A half-open window [starts_at, ends_at) in which one agent is on call at an escalation level.
    idPrefix: onc
    fields:
      agent_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: agent
        onDelete: restrict
      level:
        type: int
        description: 1 is first responder (tier2), 2 is the backup (sre).
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 2
      starts_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      ends_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
  ticket:
    description: A support request from a customer, worked by an agent through the status lifecycle. The SLA clock starts at creation.
    idPrefix: tkt
    fields:
      subject:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      assignee_id:
        type: ref
        description: Set by the assign and escalate actions and by jobs.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: agent
        onDelete: nullify
      priority:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - low
          - normal
          - high
          - urgent
      status:
        type: state
        description: Lifecycle. closed is final.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - new
          - open
          - pending
          - escalated
          - resolved
          - closed
        initial: new
        transitions:
          new:
            - open
            - escalated
          open:
            - pending
            - escalated
            - resolved
          pending:
            - open
            - escalated
            - resolved
          escalated:
            - resolved
          resolved:
            - open
            - closed
          closed: []
      escalation_level:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        max: 2
        default: 0
      escalated_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      sla_started_at:
        type: datetime
        description: Creation or last reopen.
        required: true
        nullable: false
        unique: false
        readonly: true
        default: now
      sla_due_at:
        type: datetime
        description: sla_started_at plus the policy target for the customer tier and ticket priority. Set by the workflow.
        required: false
        nullable: true
        unique: false
        readonly: true
      sla_breached:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: true
        default: false
      resolved_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
  ticket_comment:
    description: A public reply or private internal note on a ticket. author_id null means the customer wrote it.
    idPrefix: cmt
    fields:
      ticket_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: ticket
        onDelete: cascade
      author_id:
        type: ref
        description: The agent who wrote it. null means the customer did.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: agent
        onDelete: nullify
      body:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
      public:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  ticket_event:
    description: Append-only audit trail of what happened to a ticket. Written by actions and jobs.
    idPrefix: evt
    fields:
      ticket_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: ticket
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - created
          - assigned
          - escalated
          - sla_breach
          - resolved
          - reopened
          - closed
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      actor_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: agent
        onDelete: nullify
