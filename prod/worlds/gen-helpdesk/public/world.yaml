  ticket: |-
    (ctx) => {
      const BASE = '2026-01-01T00:00:00.000Z';
      const X = ctx.time.minutesBetween(BASE, ctx.now());
      const iso = (ago) => (X === ago ? BASE : ctx.time.plus(BASE, (X - ago) + 'm'));
      const customers = ctx.rows('customer');
      const agents = ctx.rows('agent');
      const target = {};
      for (const p of ctx.rows('sla_policy')) target[p.code] = p.resolution_minutes;
      const shifts = ctx.rows('oncall_shift').map((s) => ({
        level: s.level, agent: s.agent_id,
        from: X - ctx.time.minutesBetween(BASE, s.starts_at), to: X - ctx.time.minutesBetween(BASE, s.ends_at),
      }));
      const onCall = (level, ago) => {
        const s = shifts.find((x) => x.level === level && x.from >= ago && ago > x.to);
