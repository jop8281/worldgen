actions:
  assign_ticket:
    method: POST
    path: /tickets/{id}/assign
    description: Assign a new, open or pending ticket to an active agent. A new ticket moves to open. Writes an assigned event.
    input:
      agent_id:
        type: ref
        description: The agent who will work the ticket. Must be active and different from the current assignee.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: agent
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status === 'escalated') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is escalated and belongs to the on-call agent ' + t.assignee_id + '. Resolve it instead of reassigning.');
        if (t.status !== 'new' && t.status !== 'open' && t.status !== 'pending') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only new, open and pending tickets can be assigned.');
        const agent = ctx.db.get('agent', ctx.body.agent_id);
        if (agent === null) ctx.fail(422, 'unknown_agent', 'agent ' + ctx.body.agent_id + ' not found. List agents with GET /agents.');
        if (!agent.active) ctx.fail(409, 'agent_inactive', 'agent ' + agent.id + ' (' + agent.name + ') is inactive. Pick an active agent.');
        if (t.assignee_id === agent.id) ctx.fail(409, 'no_change', 'ticket ' + id + ' is already assigned to ' + agent.id + '.');
        const patch = t.status === 'new' ? { assignee_id: agent.id, status: 'open' } : { assignee_id: agent.id };
        const updated = ctx.db.update('ticket', id, patch);
        ctx.db.create('ticket_event', { ticket_id: id, kind: 'assigned', note: 'assigned to ' + agent.name, actor_id: null });
        return { status: 200, body: updated };
      }
  escalate_ticket:
    method: POST
    path: /tickets/{id}/escalate
    description: Escalate a new, open or pending ticket to level 1 and reassign it to the agent on call at level 1 right now. Needs a reason. Level 2 is reached only by the escalation_timeout job.
    input:
      reason:
        type: text
        description: Why the ticket needs on-call attention. Stored on the escalated event.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status === 'escalated') ctx.fail(409, 'already_escalated', 'ticket ' + id + ' is already escalated (level ' + t.escalation_level + ', on-call agent ' + t.assignee_id + '). Resolve it when the incident is over.');
        if (t.status !== 'new' && t.status !== 'open' && t.status !== 'pending') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only new, open and pending tickets can be escalated.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for escalate_ticket: reason expected a non-blank text, found blank');
        const now = ctx.now();
        const shift = ctx.db.list('oncall_shift', { where: { level: 1 } }).find((s) => ctx.time.minutesBetween(s.starts_at, now) >= 0 && ctx.time.minutesBetween(now, s.ends_at) > 0);
        if (!shift) ctx.fail(409, 'no_oncall', 'no level 1 on-call shift covers ' + now + '. Check GET /oncall?level=1.');
        const updated = ctx.db.update('ticket', id, { status: 'escalated', escalation_level: 1, escalated_at: now, assignee_id: shift.agent_id });
        ctx.db.create('ticket_event', { ticket_id: id, kind: 'escalated', note: reason, actor_id: null });
        return { status: 200, body: updated };
      }
  resolve_ticket:
    method: POST
    path: /tickets/{id}/resolve
    description: Resolve an open, pending or escalated ticket. Sets resolved_at and stops the SLA clock. The escalation level is kept for history. A new ticket must be assigned first.
    input:
      note:
        type: text
        description: Optional resolution note, stored on the resolved event.
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status === 'new') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is new. Assign it before resolving.');
        if (t.status !== 'open' && t.status !== 'pending' && t.status !== 'escalated') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is already ' + t.status + '. Only open, pending and escalated tickets can be resolved.');
        const now = ctx.now();
        const late = t.sla_due_at !== null && t.sla_due_at !== undefined && ctx.time.minutesBetween(t.sla_due_at, now) > 0;
        const updated = ctx.db.update('ticket', id, { status: 'resolved', resolved_at: now, sla_breached: t.sla_breached || late });
        const note = ctx.body.note === undefined ? null : ctx.body.note;
        ctx.db.create('ticket_event', { ticket_id: id, kind: 'resolved', note, actor_id: t.assignee_id });
        return { status: 200, body: updated };
      }
  reopen_ticket:
    method: POST
    path: /tickets/{id}/reopen
    description: Reopen a resolved ticket. It goes back to open with its assignee, level 0, and a fresh SLA clock from the policy for the customer tier and ticket priority. Closed tickets cannot be reopened.
    input:
      reason:
        type: text
        description: Why the ticket is reopened. Stored on the reopened event.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status === 'closed') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is closed, and closed tickets cannot be reopened. Create a follow-up ticket instead.');
        if (t.status !== 'resolved') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only resolved tickets can be reopened.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for reopen_ticket: reason expected a non-blank text, found blank');
        const customer = ctx.db.get('customer', t.customer_id);
        const code = customer.tier + '_' + t.priority;
        const policy = ctx.db.list('sla_policy', { where: { code } })[0];
        if (!policy) ctx.fail(409, 'no_sla_policy', 'no sla_policy ' + code + ' to restart the SLA clock');
        const now = ctx.now();
        const updated = ctx.db.update('ticket', id, { status: 'open', resolved_at: null, escalation_level: 0, escalated_at: null, sla_started_at: now, sla_due_at: ctx.time.plus(now, policy.resolution_minutes + 'm'), sla_breached: false });
        ctx.db.create('ticket_event', { ticket_id: id, kind: 'reopened', note: reason, actor_id: null });
        return { status: 200, body: updated };
      }
jobs:
  sla_breach:
    description: Every 15 minutes. Pass 1 applies the tier policy to active tickets without a due time. Pass 2 flags active tickets whose sla_due_at has passed and writes sla_breach events. Pass 3 escalates breached urgent level 0 tickets in new, open or pending status to the level 1 on-call agent, skipped while no level 1 shift covers now.
    every: 15m
    run: |-
      (ctx) => {
        const now = ctx.now();
        const active = ['new', 'open', 'pending', 'escalated'];
        const tierOf = {};
        for (const c of ctx.db.list('customer')) tierOf[c.id] = c.tier;
        const target = {};
        for (const p of ctx.db.list('sla_policy')) target[p.code] = p.resolution_minutes;
        for (const t of ctx.db.list('ticket', { where: { sla_breached: false } })) {
          if (!active.includes(t.status)) continue;
          let due = t.sla_due_at;
          if (due === null || due === undefined) {
            const minutes = target[tierOf[t.customer_id] + '_' + t.priority];
            if (minutes === undefined) continue;
            due = ctx.time.plus(t.sla_started_at, minutes + 'm');
            ctx.db.update('ticket', t.id, { sla_due_at: due });
          }
          if (ctx.time.minutesBetween(due, now) < 0) continue;
          ctx.db.update('ticket', t.id, { sla_breached: true });
          ctx.db.create('ticket_event', { ticket_id: t.id, kind: 'sla_breach', note: 'resolution target ' + due + ' passed', actor_id: null });
        }
        const shift = ctx.db.list('oncall_shift', { where: { level: 1 } }).find((s) => ctx.time.minutesBetween(s.starts_at, now) >= 0 && ctx.time.minutesBetween(now, s.ends_at) > 0);
        if (!shift) return;
        for (const t of ctx.db.list('ticket', { where: { priority: 'urgent', sla_breached: true, escalation_level: 0 } })) {
          if (t.status !== 'new' && t.status !== 'open' && t.status !== 'pending') continue;
          ctx.db.update('ticket', t.id, { status: 'escalated', escalation_level: 1, escalated_at: now, assignee_id: shift.agent_id });
          ctx.db.create('ticket_event', { ticket_id: t.id, kind: 'escalated', note: 'auto: SLA breach', actor_id: null });
        }
      }
  escalation_timeout:
    description: Every 15 minutes. An escalated urgent ticket that has sat at level 1 for 60 minutes or more moves to level 2 and to the level 2 on-call agent. Skipped while no level 2 shift covers now.
    every: 15m
    run: |-
      (ctx) => {
        const now = ctx.now();
        const shift = ctx.db.list('oncall_shift', { where: { level: 2 } }).find((s) => ctx.time.minutesBetween(s.starts_at, now) >= 0 && ctx.time.minutesBetween(now, s.ends_at) > 0);
        if (!shift) return;
        for (const t of ctx.db.list('ticket', { where: { status: 'escalated', priority: 'urgent', escalation_level: 1 } })) {
          if (t.escalated_at === null || t.escalated_at === undefined || ctx.time.minutesBetween(t.escalated_at, now) < 60) continue;
          ctx.db.update('ticket', t.id, { escalation_level: 2, escalated_at: now, assignee_id: shift.agent_id });
          ctx.db.create('ticket_event', { ticket_id: t.id, kind: 'escalated', note: 'auto: level 1 timeout', actor_id: null });
        }
      }
  auto_close:
    description: Every hour. A ticket resolved at least 72 hours ago is closed and a closed event is written.
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const t of ctx.db.list('ticket', { where: { status: 'resolved' } })) {
          if (t.resolved_at === null || t.resolved_at === undefined || ctx.time.minutesBetween(t.resolved_at, now) < 72 * 60) continue;
          ctx.db.update('ticket', t.id, { status: 'closed' });
          ctx.db.create('ticket_event', { ticket_id: t.id, kind: 'closed', note: 'auto: 72h after resolution', actor_id: null });
        }
      }
fixtures: {}
seed:
  customer: |-
    (ctx) => {
      const rows = [
        { name: 'Acme Logistics', tier: 'enterprise', email: 'support@acmelogistics.example' },
        { name: 'Acme Paper Co.', tier: 'premium', email: 'help@acmepaper.example' },
        { name: 'Northwind Health', tier: 'enterprise', email: 'it-desk@northwindhealth.example' },
      ];
      const firsts = ['Bluefin', 'Cedar', 'Harbor', 'Summit', 'Brightline', 'Ironwood', 'Silverleaf', 'Redwood', 'Lakeside', 'Granite', 'Copperfield', 'Maple', 'Pioneer', 'Evergreen', 'Riverside', 'Oakridge', 'Starling', 'Kestrel', 'Meridian', 'Juniper', 'Sterling', 'Falcon', 'Atlas', 'Orchid', 'Beacon', 'Coastal', 'Highland', 'Willow', 'Tidewater'];
      const seconds = ['Freight', 'Health', 'Foods', 'Analytics', 'Robotics', 'Retail', 'Energy', 'Labs', 'Logistics', 'Media', 'Credit Union', 'Travel', 'Pharma', 'Studios', 'Systems', 'Outfitters', 'Insurance', 'Motors', 'Telecom', 'Dental'];
      const tiers = [];
      for (let i = 0; i < 4; i++) tiers.push('enterprise');
      for (let i = 0; i < 14; i++) tiers.push('premium');
      for (let i = 0; i < 36; i++) tiers.push('standard');
      for (let i = tiers.length - 1; i > 0; i--) {
        const j = ctx.int(0, i);
        const x = tiers[i]; tiers[i] = tiers[j]; tiers[j] = x;
      }
      const mailbox = ['support', 'helpdesk', 'it', 'ops', 'service'];
      for (let i = 0; i < tiers.length; i++) {
        const name = firsts[i % firsts.length] + ' ' + seconds[(i * 7) % seconds.length];
        const domain = name.toLowerCase().replace(/[^a-z0-9]+/g, '');
        rows.push({ name, tier: tiers[i], email: mailbox[i % mailbox.length] + '@' + domain + '.example' });
      }
      return rows.map((r) => {
        const since = ctx.time.plus('2024-01-08T09:00:00.000Z', ctx.int(1, 700) + 'd');
        return { ...r, created_at: since, updated_at: since };
      });
    }
  agent: |-
    (ctx) => [
      ['Priya Raman', 'tier1'], ['Priya Shah', 'tier1'], ['Marcus Bell', 'tier2'], ['Dana Okafor', 'sre'],
      ['Lena Fischer', 'tier1'], ['Omar Haddad', 'tier2'], ['Sofia Alvarez', 'tier1'], ['Kenji Watanabe', 'sre'],
      ['Grace Mwangi', 'tier2'], ['Lucas Moreau', 'tier1'], ['Aisha Khan', 'sre'], ['Tom Reyes', 'tier1'],
    ].map(([name, team], i) => {
      const hired = ctx.time.plus('2023-06-05T09:00:00.000Z', (i * 37 + 3) + 'd');
      return { name, email: name.toLowerCase().replace(' ', '.') + '@support.example', team, active: name !== 'Tom Reyes', created_at: hired, updated_at: hired };
    })
  sla_policy: |-
    (ctx) => {
      const minutes = {
        enterprise: { urgent: 60, high: 240, normal: 480, low: 1440 },
        premium: { urgent: 120, high: 480, normal: 1440, low: 2880 },
        standard: { urgent: 240, high: 1440, normal: 2880, low: 4320 },
      };
      const rows = [];
