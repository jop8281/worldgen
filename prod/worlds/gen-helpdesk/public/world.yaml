        } else if (t.status === 'new') {
          if (ctx.int(1, 3) === 1) out.push({ at: Math.floor(age / 3), row: { ticket_id: t.id, author_id: null, body: ctx.pick(followUps), public: true } });
        } else if (t.status === 'open' || t.status === 'escalated') {
          const since = t.escalated_at === null ? age : ago(t.escalated_at);
          if (ctx.int(1, 2) === 1) out.push({ at: Math.floor(since / 2), row: { ticket_id: t.id, author_id: t.assignee_id, body: ctx.pick(internal), public: false } });
        } else {
          const rAgo = ago(t.resolved_at);
          out.push({ at: rAgo, row: { ticket_id: t.id, author_id: t.assignee_id, body: ctx.pick(fixes), public: true } });
          if (t.subject === 'Shipment status webhook retries failing') {
            out.push({ at: rAgo - 300, row: { ticket_id: t.id, author_id: null, body: 'Thanks, but the webhook is failing again for us this morning.', public: true } });
          }
        }
      }
      out.sort((a, b) => b.at - a.at);
      return out.map((c) => {
        const when = iso(c.at);
