      });
    }
  ticket_event: |-
    (ctx) => {
      const BASE = '2026-01-01T00:00:00.000Z';
      const X = ctx.time.minutesBetween(BASE, ctx.now());
      const iso = (ago) => (X === ago ? BASE : ctx.time.plus(BASE, (X - ago) + 'm'));
      const ago = (t) => X - ctx.time.minutesBetween(BASE, t);
      const reasons = [
        'Customer reports a production outage', 'Needs tier 2 investigation', 'Workaround failed, customer is blocked',
        'Affects every user at the site', 'Escalated at the request of the account manager',
      ];
      const out = [];
      for (const t of ctx.rows('ticket')) {
        const ev = (kind, at, note, actor) => out.push({ at, row: { ticket_id: t.id, kind, note, actor_id: actor } });
        const age = ago(t.created_at);
        const resolvedAgo = t.resolved_at === null ? null : ago(t.resolved_at);
        const escalatedAgo = t.escalated_at === null ? null : ago(t.escalated_at);
        const t1 = escalatedAgo === null ? null : t.escalation_level === 2 ? escalatedAgo + 60 : escalatedAgo;
        const next = t1 !== null ? t1 : resolvedAgo !== null ? resolvedAgo : 0;
        ev('created', age, null, null);
        if (t.status !== 'new') ev('assigned', age - Math.min(30, Math.floor((age - next) / 2)), null, null);
        if (t.sla_breached) {
          const due = ago(t.sla_due_at);
          const firing = 15 * Math.floor(due / 15);
          ev('sla_breach', resolvedAgo === null || firing >= resolvedAgo ? firing : due, 'resolution target ' + t.sla_due_at + ' passed', null);
        }
        if (t1 !== null) {
          ev('escalated', t1, t.priority === 'urgent' ? 'auto: SLA breach' : ctx.pick(reasons), null);
          if (t.escalation_level === 2) ev('escalated', escalatedAgo, 'auto: level 1 timeout', null);
        }
        if (resolvedAgo !== null) ev('resolved', resolvedAgo, null, t.assignee_id);
        if (t.status === 'closed') ev('closed', 60 * Math.floor((resolvedAgo - 4320) / 60), 'auto: 72h after resolution', null);
      }
      out.sort((a, b) => b.at - a.at);
      return out.map((e) => {
        const when = iso(e.at);
        return { ...e.row, created_at: when, updated_at: when };
      });
    }
tests:
  assign_ticket_rules:
    description: assign_ticket opens a new ticket with the agent and writes an assigned event. It refuses the same agent, an inactive agent, an unknown agent, a missing ticket and a resolved ticket. Adapts to whatever agents the seed holds.
    script: |-
      (ctx) => {
        const all = (p) => { const rows = []; let cur = null; do { const r = ctx.api('GET', p + (cur === null ? '' : (p.includes('?') ? '&' : '?') + 'cursor=' + cur)); ctx.assert(r.status === 200, 'GET ' + p + ' returned ' + r.status); rows.push(...r.body.data); cur = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cur !== null); return rows; };
        let n = 0;
        const mk = (tier, prio) => { n += 1; const c = ctx.api('POST', '/customers', { name: 'Workflow Test ' + tier + ' ' + n, tier, email: 'wf-' + tier + '-' + n + '@wftest.example' }); ctx.assert(c.status === 201 || c.status === 200, 'create customer ' + JSON.stringify(c)); const t = ctx.api('POST', '/tickets', { subject: 'Workflow test ticket ' + n, customer_id: c.body.id, priority: prio }); ctx.assert(t.status === 201 || t.status === 200, 'create ticket ' + JSON.stringify(t)); ctx.assert(t.body.status === 'new', 'a created ticket is new'); return t.body; };
        const t = mk('standard', 'normal');
        const unknown = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: 'agt_9999' });
        ctx.assert(unknown.status === 400 || unknown.status === 422, 'unknown agent: ' + JSON.stringify(unknown));
        const active = all('/agents?active=true');
        const inactive = all('/agents?active=false');
        if (active.length === 0) return;
        const missing = ctx.api('POST', '/tickets/tkt_9999/assign', { agent_id: active[0].id });
        ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'missing ticket: ' + JSON.stringify(missing));
        const r = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: active[0].id });
        ctx.assert(r.status === 200 && r.body.status === 'open' && r.body.assignee_id === active[0].id, 'assign: ' + JSON.stringify(r));
        const same = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: active[0].id });
        ctx.assert(same.status === 409 && same.body.error.code === 'no_change', 'same agent: ' + JSON.stringify(same));
        if (inactive.length > 0) {
          const bad = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: inactive[0].id });
          ctx.assert(bad.status === 409 && bad.body.error.code === 'agent_inactive', 'inactive agent: ' + JSON.stringify(bad));
        }
        const events = all('/tickets/' + t.id + '/events');
        ctx.assert(events.some((e) => e.kind === 'assigned'), 'an assigned event was written');
        if (active.length > 1) {
          const re = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: active[1].id });
          ctx.assert(re.status === 200 && re.body.assignee_id === active[1].id && re.body.status === 'open', 'reassign: ' + JSON.stringify(re));
          ctx.assert(ctx.api('PATCH', '/tickets/' + t.id, { status: 'pending' }).status === 200, 'move to pending');
          const back = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: active[0].id });
          ctx.assert(back.status === 200 && back.body.status === 'pending' && back.body.assignee_id === active[0].id, 'assign a pending ticket keeps it pending: ' + JSON.stringify(back));
        }
        const done = ctx.api('POST', '/tickets/' + t.id + '/resolve', {});
        ctx.assert(done.status === 200, 'resolve: ' + JSON.stringify(done));
        const late = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: active[0].id });
        ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'assign resolved: ' + JSON.stringify(late));
      }
  resolve_ticket_rules:
    description: resolve_ticket refuses a new ticket and a missing ticket, resolves an open ticket with resolved_at and the note on a resolved event, and refuses a second resolve.
    script: |-
      (ctx) => {
        const all = (p) => { const rows = []; let cur = null; do { const r = ctx.api('GET', p + (cur === null ? '' : (p.includes('?') ? '&' : '?') + 'cursor=' + cur)); ctx.assert(r.status === 200, 'GET ' + p + ' returned ' + r.status); rows.push(...r.body.data); cur = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cur !== null); return rows; };
        let n = 0;
        const mk = (tier, prio) => { n += 1; const c = ctx.api('POST', '/customers', { name: 'Workflow Test ' + tier + ' ' + n, tier, email: 'wf-' + tier + '-' + n + '@wftest.example' }); ctx.assert(c.status === 201 || c.status === 200, 'create customer ' + JSON.stringify(c)); const t = ctx.api('POST', '/tickets', { subject: 'Workflow test ticket ' + n, customer_id: c.body.id, priority: prio }); ctx.assert(t.status === 201 || t.status === 200, 'create ticket ' + JSON.stringify(t)); ctx.assert(t.body.status === 'new', 'a created ticket is new'); return t.body; };
        const t = mk('premium', 'high');
        const fresh = ctx.api('POST', '/tickets/' + t.id + '/resolve', {});
        ctx.assert(fresh.status === 409 && fresh.body.error.code === 'invalid_state', 'new ticket: ' + JSON.stringify(fresh));
        const missing = ctx.api('POST', '/tickets/tkt_9999/resolve', {});
        ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'missing ticket: ' + JSON.stringify(missing));
        ctx.assert(ctx.api('PATCH', '/tickets/' + t.id, { status: 'open' }).status === 200, 'move to open');
        const at = ctx.now();
        const r = ctx.api('POST', '/tickets/' + t.id + '/resolve', { note: 'Replaced the faulty module' });
        ctx.assert(r.status === 200, 'resolve returned ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(r.body.status === 'resolved' && r.body.resolved_at === at, 'resolved at ' + at + ', got ' + r.body.status + ' ' + r.body.resolved_at);
        const events = all('/tickets/' + t.id + '/events?kind=resolved');
        ctx.assert(events.length === 1 && events[0].note === 'Replaced the faulty module', 'one resolved event with the note, got ' + JSON.stringify(events));
        const again = ctx.api('POST', '/tickets/' + t.id + '/resolve', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second resolve: ' + JSON.stringify(again));
        const t2 = mk('standard', 'low');
        ctx.assert(ctx.api('PATCH', '/tickets/' + t2.id, { status: 'open' }).status === 200, 'open t2');
        ctx.assert(ctx.api('PATCH', '/tickets/' + t2.id, { status: 'pending' }).status === 200, 'pending t2');
        const p = ctx.api('POST', '/tickets/' + t2.id + '/resolve', {});
        ctx.assert(p.status === 200 && p.body.status === 'resolved', 'resolve a pending ticket: ' + JSON.stringify(p));
      }
  reopen_ticket_rules:
    description: reopen_ticket refuses a ticket that is not resolved, a blank reason and a missing ticket. On a resolved ticket it returns to open with a fresh SLA clock, level 0 and the same assignee, or answers 409 no_sla_policy when the tier has no policy.
    script: |-
      (ctx) => {
        const all = (p) => { const rows = []; let cur = null; do { const r = ctx.api('GET', p + (cur === null ? '' : (p.includes('?') ? '&' : '?') + 'cursor=' + cur)); ctx.assert(r.status === 200, 'GET ' + p + ' returned ' + r.status); rows.push(...r.body.data); cur = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cur !== null); return rows; };
        let n = 0;
        const mk = (tier, prio) => { n += 1; const c = ctx.api('POST', '/customers', { name: 'Workflow Test ' + tier + ' ' + n, tier, email: 'wf-' + tier + '-' + n + '@wftest.example' }); ctx.assert(c.status === 201 || c.status === 200, 'create customer ' + JSON.stringify(c)); const t = ctx.api('POST', '/tickets', { subject: 'Workflow test ticket ' + n, customer_id: c.body.id, priority: prio }); ctx.assert(t.status === 201 || t.status === 200, 'create ticket ' + JSON.stringify(t)); ctx.assert(t.body.status === 'new', 'a created ticket is new'); return t.body; };
        const t = mk('standard', 'normal');
        const early = ctx.api('POST', '/tickets/' + t.id + '/reopen', { reason: 'not resolved yet' });
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'reopen of a new ticket: ' + JSON.stringify(early));
        const missing = ctx.api('POST', '/tickets/tkt_9999/reopen', { reason: 'nothing here' });
        ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'missing ticket: ' + JSON.stringify(missing));
        const agents = all('/agents?active=true');
        let expected = null;
        if (agents.length > 0) {
          const a = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: agents[0].id });
          ctx.assert(a.status === 200, 'assign: ' + JSON.stringify(a));
          expected = agents[0].id;
        } else {
          ctx.assert(ctx.api('PATCH', '/tickets/' + t.id, { status: 'open' }).status === 200, 'move to open');
        }
        const res = ctx.api('POST', '/tickets/' + t.id + '/resolve', {});
        ctx.assert(res.status === 200, 'resolve: ' + JSON.stringify(res));
        const blank = ctx.api('POST', '/tickets/' + t.id + '/reopen', { reason: '   ' });
        ctx.assert(blank.status === 400 && blank.body.error.code === 'input.invalid', 'blank reason: ' + JSON.stringify(blank));
        const none = ctx.api('POST', '/tickets/' + t.id + '/reopen', {});
        ctx.assert(none.status === 400 && none.body.error.code === 'input.invalid', 'missing reason: ' + JSON.stringify(none));
        const policies = all('/sla_policies?tier=standard&priority=normal');
        const at = ctx.now();
        const r = ctx.api('POST', '/tickets/' + t.id + '/reopen', { reason: 'Problem came back after the fix' });
        if (policies.length === 0) {
          ctx.assert(r.status === 409 && r.body.error.code === 'no_sla_policy', 'no policy: ' + JSON.stringify(r));
          return;
        }
        ctx.assert(r.status === 200, 'reopen returned ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(r.body.status === 'open' && r.body.resolved_at === null && r.body.escalation_level === 0 && r.body.escalated_at === null, 'open, unresolved, level 0, got ' + JSON.stringify(r.body));
        ctx.assert(r.body.assignee_id === expected, 'assignee kept, got ' + r.body.assignee_id);
        ctx.assert(r.body.sla_started_at === at && r.body.sla_due_at !== null && r.body.sla_due_at > at && r.body.sla_breached === false, 'SLA restarted at ' + at + ', got ' + r.body.sla_started_at + ' due ' + r.body.sla_due_at);
        const events = all('/tickets/' + t.id + '/events?kind=reopened');
        ctx.assert(events.length === 1 && events[0].note === 'Problem came back after the fix', 'reopened event with the reason, got ' + JSON.stringify(events));
        const again = ctx.api('POST', '/tickets/' + t.id + '/reopen', { reason: 'again' });
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'reopen of an open ticket: ' + JSON.stringify(again));
      }
  escalate_ticket_rules:
    description: escalate_ticket refuses a missing ticket, a missing or blank reason and a resolved ticket. With a level 1 shift covering now it escalates to level 1, assigns that agent and records the reason, and refuses a second escalation. Without one it answers 409 no_oncall and changes nothing.
    script: |-
      (ctx) => {
        const all = (p) => { const rows = []; let cur = null; do { const r = ctx.api('GET', p + (cur === null ? '' : (p.includes('?') ? '&' : '?') + 'cursor=' + cur)); ctx.assert(r.status === 200, 'GET ' + p + ' returned ' + r.status); rows.push(...r.body.data); cur = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cur !== null); return rows; };
        let n = 0;
        const mk = (tier, prio) => { n += 1; const c = ctx.api('POST', '/customers', { name: 'Workflow Test ' + tier + ' ' + n, tier, email: 'wf-' + tier + '-' + n + '@wftest.example' }); ctx.assert(c.status === 201 || c.status === 200, 'create customer ' + JSON.stringify(c)); const t = ctx.api('POST', '/tickets', { subject: 'Workflow test ticket ' + n, customer_id: c.body.id, priority: prio }); ctx.assert(t.status === 201 || t.status === 200, 'create ticket ' + JSON.stringify(t)); ctx.assert(t.body.status === 'new', 'a created ticket is new'); return t.body; };
        const t = mk('enterprise', 'high');
        const missing = ctx.api('POST', '/tickets/tkt_9999/escalate', { reason: 'down' });
        ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'missing ticket: ' + JSON.stringify(missing));
        const none = ctx.api('POST', '/tickets/' + t.id + '/escalate', {});
        ctx.assert(none.status === 400 && none.body.error.code === 'input.invalid', 'missing reason: ' + JSON.stringify(none));
        const blank = ctx.api('POST', '/tickets/' + t.id + '/escalate', { reason: '   ' });
        ctx.assert(blank.status === 400 && blank.body.error.code === 'input.invalid', 'blank reason: ' + JSON.stringify(blank));
        const shifts = all('/oncall?level=1');
        const at = ctx.now();
        const shift = shifts.find((s) => s.starts_at <= at && at < s.ends_at);
        const r = ctx.api('POST', '/tickets/' + t.id + '/escalate', { reason: 'SLA at risk, customer is blocked' });
        if (!shift) {
          ctx.assert(r.status === 409 && r.body.error.code === 'no_oncall', 'no shift: ' + JSON.stringify(r));
          const same = ctx.api('GET', '/tickets/' + t.id).body;
          ctx.assert(same.status === 'new' && same.escalation_level === 0, 'a refused escalation changes nothing');
        } else {
          ctx.assert(r.status === 200, 'escalate returned ' + r.status + ' ' + JSON.stringify(r.body));
          ctx.assert(r.body.status === 'escalated' && r.body.escalation_level === 1 && r.body.escalated_at === at, 'escalated at level 1 at ' + at + ', got ' + JSON.stringify(r.body));
          ctx.assert(r.body.assignee_id === shift.agent_id, 'assigned to the level 1 on-call agent ' + shift.agent_id + ', got ' + r.body.assignee_id);
          const events = all('/tickets/' + t.id + '/events?kind=escalated');
          ctx.assert(events.length === 1 && events[0].note === 'SLA at risk, customer is blocked', 'escalated event with the reason, got ' + JSON.stringify(events));
          const twice = ctx.api('POST', '/tickets/' + t.id + '/escalate', { reason: 'again' });
          ctx.assert(twice.status === 409 && twice.body.error.code === 'already_escalated', 'second escalation: ' + JSON.stringify(twice));
          const reassign = ctx.api('GET', '/agents?active=true&limit=1').body.data[0];
          if (reassign) {
            const blocked = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: reassign.id });
            ctx.assert(blocked.status === 409 && blocked.body.error.code === 'invalid_state', 'assign an escalated ticket: ' + JSON.stringify(blocked));
          }
          const res = ctx.api('POST', '/tickets/' + t.id + '/resolve', { note: 'Incident over' });
          ctx.assert(res.status === 200 && res.body.status === 'resolved' && res.body.escalation_level === 1, 'resolve keeps the level: ' + JSON.stringify(res));
        }
        const t2 = mk('standard', 'low');
        ctx.assert(ctx.api('PATCH', '/tickets/' + t2.id, { status: 'open' }).status === 200, 'open t2');
        ctx.assert(ctx.api('POST', '/tickets/' + t2.id + '/resolve', {}).status === 200, 'resolve t2');
        const late = ctx.api('POST', '/tickets/' + t2.id + '/escalate', { reason: 'too late' });
        ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'resolved ticket: ' + JSON.stringify(late));
      }
  sla_breach_job_flags_and_escalates:
    description: After the standard urgent target passes, the sla_breach job fills the due time, flags the ticket and writes an sla_breach event. A breached urgent ticket is auto-escalated to the level 1 on-call agent when a shift covers the firing, and a breached non-urgent ticket is never escalated.
    script: |-
      (ctx) => {
        const all = (p) => { const rows = []; let cur = null; do { const r = ctx.api('GET', p + (cur === null ? '' : (p.includes('?') ? '&' : '?') + 'cursor=' + cur)); ctx.assert(r.status === 200, 'GET ' + p + ' returned ' + r.status); rows.push(...r.body.data); cur = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cur !== null); return rows; };
        let n = 0;
        const mk = (tier, prio) => { n += 1; const c = ctx.api('POST', '/customers', { name: 'Workflow Test ' + tier + ' ' + n, tier, email: 'wf-' + tier + '-' + n + '@wftest.example' }); ctx.assert(c.status === 201 || c.status === 200, 'create customer ' + JSON.stringify(c)); const t = ctx.api('POST', '/tickets', { subject: 'Workflow test ticket ' + n, customer_id: c.body.id, priority: prio }); ctx.assert(t.status === 201 || t.status === 200, 'create ticket ' + JSON.stringify(t)); ctx.assert(t.body.status === 'new', 'a created ticket is new'); return t.body; };
        const policies = all('/sla_policies?tier=standard&priority=urgent');
        const urgent = mk('standard', 'urgent');
        const normal = mk('standard', 'normal');
        const minutes = policies.length > 0 ? policies[0].resolution_minutes : 60;
        const out = ctx.advance((minutes + 30) + 'm');
        ctx.assert(out.jobsFailed.length === 0, 'no job failed: ' + JSON.stringify(out.jobsFailed));
        ctx.assert(out.jobsFired.includes('sla_breach'), 'sla_breach fired, got ' + JSON.stringify(out.jobsFired));
        const u = ctx.api('GET', '/tickets/' + urgent.id).body;
        const nm = ctx.api('GET', '/tickets/' + normal.id).body;
        ctx.assert(nm.status === 'new' && nm.escalation_level === 0, 'a non-urgent ticket is never auto-escalated, got ' + nm.status);
        if (policies.length === 0) return;
        ctx.assert(u.sla_due_at !== null && u.sla_breached === true, 'urgent ticket flagged with a due time, got ' + JSON.stringify(u));
        const events = all('/tickets/' + urgent.id + '/events');
        ctx.assert(events.filter((e) => e.kind === 'sla_breach').length === 1, 'exactly one sla_breach event, got ' + JSON.stringify(events));
        if (u.status === 'escalated') {
          ctx.assert(u.escalation_level === 1 && u.assignee_id !== null && u.escalated_at !== null, 'auto-escalated to level 1 with an assignee, got ' + JSON.stringify(u));
          const esc = events.filter((e) => e.kind === 'escalated');
          ctx.assert(esc.length === 1 && esc[0].note === 'auto: SLA breach', 'auto escalation event, got ' + JSON.stringify(esc));
          const shift = all('/oncall?level=1').find((s) => s.agent_id === u.assignee_id && s.starts_at <= u.escalated_at && u.escalated_at < s.ends_at);
          ctx.assert(shift !== undefined, 'the assignee was on call at level 1 when it escalated');
        } else {
          ctx.assert(u.status === 'new' && u.escalation_level === 0, 'no shift covered, so the ticket stays new, got ' + u.status);
        }
      }
  escalation_timeout_job_moves_to_level_2:
    description: An urgent ticket escalated at level 1 moves to level 2 and the level 2 on-call agent once 60 minutes pass and a level 2 shift covers the window. A non-urgent escalated ticket stays at level 1.
    script: |-
      (ctx) => {
        const all = (p) => { const rows = []; let cur = null; do { const r = ctx.api('GET', p + (cur === null ? '' : (p.includes('?') ? '&' : '?') + 'cursor=' + cur)); ctx.assert(r.status === 200, 'GET ' + p + ' returned ' + r.status); rows.push(...r.body.data); cur = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cur !== null); return rows; };
        let n = 0;
        const mk = (tier, prio) => { n += 1; const c = ctx.api('POST', '/customers', { name: 'Workflow Test ' + tier + ' ' + n, tier, email: 'wf-' + tier + '-' + n + '@wftest.example' }); ctx.assert(c.status === 201 || c.status === 200, 'create customer ' + JSON.stringify(c)); const t = ctx.api('POST', '/tickets', { subject: 'Workflow test ticket ' + n, customer_id: c.body.id, priority: prio }); ctx.assert(t.status === 201 || t.status === 200, 'create ticket ' + JSON.stringify(t)); ctx.assert(t.body.status === 'new', 'a created ticket is new'); return t.body; };
        const l1 = all('/oncall?level=1');
        const l2 = all('/oncall?level=2');
        const now0 = ctx.now();
        const covered = l1.some((s) => s.starts_at <= now0 && now0 < s.ends_at);
        if (!covered) return;
        const u = mk('standard', 'urgent');
        const nm = mk('standard', 'normal');
        const eu = ctx.api('POST', '/tickets/' + u.id + '/escalate', { reason: 'Checkout is down for every user' });
        ctx.assert(eu.status === 200 && eu.body.escalation_level === 1, 'escalate urgent: ' + JSON.stringify(eu));
        const en = ctx.api('POST', '/tickets/' + nm.id + '/escalate', { reason: 'Customer asked for on-call' });
        ctx.assert(en.status === 200 && en.body.escalation_level === 1, 'escalate normal: ' + JSON.stringify(en));
        const first = ctx.advance('30m');
        ctx.assert(first.jobsFailed.length === 0, 'no job failed: ' + JSON.stringify(first.jobsFailed));
        const early = ctx.api('GET', '/tickets/' + u.id).body;
        ctx.assert(early.escalation_level === 1, 'still level 1 after 30 minutes, got ' + early.escalation_level);
        const out = ctx.advance('45m');
        ctx.assert(out.jobsFailed.length === 0, 'no job failed: ' + JSON.stringify(out.jobsFailed));
        const now2 = ctx.now();
        const T = eu.body.escalated_at;
        const shift = l2.find((s) => s.starts_at <= T && now2 < s.ends_at);
        const after = ctx.api('GET', '/tickets/' + u.id).body;
        const other = ctx.api('GET', '/tickets/' + nm.id).body;
        ctx.assert(other.escalation_level === 1 && other.status === 'escalated', 'a non-urgent ticket stays at level 1, got ' + JSON.stringify(other));
        if (!shift) return;
        ctx.assert(after.status === 'escalated' && after.escalation_level === 2, 'urgent ticket moved to level 2, got ' + JSON.stringify(after));
        ctx.assert(after.assignee_id === shift.agent_id, 'assigned to the level 2 on-call agent ' + shift.agent_id + ', got ' + after.assignee_id);
        ctx.assert(after.escalated_at !== T, 'escalated_at moved to the timeout');
        const events = all('/tickets/' + u.id + '/events?kind=escalated');
        ctx.assert(events.some((e) => e.note === 'auto: level 1 timeout'), 'timeout event written, got ' + JSON.stringify(events));
      }
  auto_close_job_closes_old_resolved:
    description: auto_close leaves a ticket resolved only hours ago untouched and writes no closed event for it. A closed ticket (if the seed holds one) cannot be reopened. Kept short because 72 hours of job firings would exceed the snippet time limit.
    script: |-
      (ctx) => {
        const all = (p) => { const rows = []; let cur = null; do { const r = ctx.api('GET', p + (cur === null ? '' : (p.includes('?') ? '&' : '?') + 'cursor=' + cur)); ctx.assert(r.status === 200, 'GET ' + p + ' returned ' + r.status); rows.push(...r.body.data); cur = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cur !== null); return rows; };
        const c = ctx.api('POST', '/customers', { name: 'Workflow Test close 1', tier: 'standard', email: 'wf-close-1@wftest.example' });
        ctx.assert(c.status === 201 || c.status === 200, 'create customer ' + JSON.stringify(c));
        const created = ctx.api('POST', '/tickets', { subject: 'Workflow test ticket close', customer_id: c.body.id, priority: 'low' });
        ctx.assert(created.status === 201 || created.status === 200, 'create ticket ' + JSON.stringify(created));
        const t = created.body;
        ctx.assert(ctx.api('PATCH', '/tickets/' + t.id, { status: 'open' }).status === 200, 'move to open');
        ctx.assert(ctx.api('POST', '/tickets/' + t.id + '/resolve', {}).status === 200, 'resolve');
        const a = ctx.advance('2h');
        ctx.assert(a.jobsFailed.length === 0, 'no job failed: ' + JSON.stringify(a.jobsFailed));
        ctx.assert(a.jobsFired.includes('auto_close'), 'auto_close fired, got ' + JSON.stringify(a.jobsFired));
        const mid = ctx.api('GET', '/tickets/' + t.id).body;
        ctx.assert(mid.status === 'resolved', 'still resolved after 2 hours, got ' + mid.status);
        const events = all('/tickets/' + t.id + '/events?kind=closed');
        ctx.assert(events.length === 0, 'no closed event yet, got ' + JSON.stringify(events));
        const closed = ctx.api('GET', '/tickets?status=closed&limit=1').body.data[0];
        if (closed) {
          const re = ctx.api('POST', '/tickets/' + closed.id + '/reopen', { reason: 'still broken' });
          ctx.assert(re.status === 409 && re.body.error.code === 'invalid_state', 'reopen of a closed ticket: ' + JSON.stringify(re));
        }
      }
