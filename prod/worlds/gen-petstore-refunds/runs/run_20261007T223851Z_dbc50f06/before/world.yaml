        const one = mine.length === 1 ? mine[0] : null;
        ctx.goal(0.4, 'one new requested refund on the Mochi order', one !== null && one.status === 'requested');
        ctx.goal(0.4, 'amount is 6000', one !== null && one.amount === 6000);
