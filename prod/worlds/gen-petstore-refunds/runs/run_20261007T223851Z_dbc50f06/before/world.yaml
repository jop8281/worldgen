format: 1
meta:
  name: gen_petstore
  description: "A pet store where pets move available → pending → sold as customers place, approve and deliver orders. Placing an order reserves the pet, delivery sells it, and deleting an open order releases it. The 9 spec operations are kept under their spec paths. Three small extras make records discoverable and workflow steps explicit: list orders, categories, and approve and deliver actions."
  resembles: "Swagger Petstore (OpenAPI 3.0 sample): pets, categories and store orders with inventory by pet status"
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-07T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      code: $status
      type: $code
      message: $message
entities:
  category:
    description: Pet category such as Dogs or Cats. Spec schema Category.
    idPrefix: cat
    fields:
      name:
        type: string
        description: Category name, such as Dogs.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 100
  pet:
    description: A pet listed for sale. Status moves available, pending, sold. Spec field names photoUrls, category, tags and status are kept.
    idPrefix: pet
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      photoUrls:
        type: text
        description: Comma-separated photo URLs (spec array of strings).
        required: true
        nullable: false
        unique: false
        readonly: false
      category:
        type: ref
        description: The pet's category.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: category
        onDelete: nullify
      tags:
        type: text
        description: Comma-separated tag names (spec array of Tag).
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: state
        description: Pet status in the store. New pets are always available.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - available
          - pending
          - sold
        initial: available
        transitions:
          available:
            - pending
            - sold
          pending:
            - available
            - sold
          sold:
            - available
  store_order:
    description: A purchase order for a pet. Spec schema Order. Status moves placed, approved, delivered. complete is true once delivered.
    idPrefix: ord
    fields:
      petId:
        type: ref
        description: The ordered pet.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: pet
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      shipDate:
        type: datetime
        description: Planned ship date.
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: state
        description: Order status. Set by the place, approve and deliver actions.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - placed
          - approved
          - delivered
        initial: placed
        transitions:
          placed:
            - approved
          approved:
            - delivered
          delivered: []
      complete:
        type: bool
        description: True once the order is delivered.
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
  refund:
    description: A refund claim on a delivered store order. Status moves requested, then approved or rejected. Holds the amount in USD minor units, the customer's reason, whether the pet was restocked, and the decision note and time.
    idPrefix: rfd
    fields:
      orderId:
        type: ref
        description: The delivered order being refunded.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: store_order
        onDelete: restrict
      amount:
        type: money
        description: Refund amount in USD minor units, at least 1.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
      reason:
        type: text
        description: The customer's reason for the refund.
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        description: Refund status. Set by the request, approve and reject actions.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - requested
          - approved
          - rejected
        initial: requested
        transitions:
          requested:
            - approved
            - rejected
          approved: []
          rejected: []
      restock:
        type: bool
        description: True when approval put the sold pet back on sale.
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
      decision_note:
        type: text
        description: Note recorded when the refund is rejected.
        required: false
        nullable: true
        unique: false
        readonly: true
      decided_at:
        type: datetime
        description: When the refund was approved or rejected. Null while requested.
        required: false
        nullable: true
        unique: false
        readonly: true
routes:
  add_pet:
    op: create
    entity: pet
    method: POST
    path: /pet
    description: Add a new pet. New pets are always available.
  find_pets_by_status:
    op: list
    entity: pet
    filters:
      - status
      - category
    search:
      - name
    sort: []
    pageSize: 25
    method: GET
    path: /pet/findByStatus
    description: List pets filtered by status and category, searchable by name with q.
  get_pet:
    op: get
    entity: pet
    method: GET
    path: /pet/{id}
    description: Fetch one pet.
  delete_pet:
    op: delete
    entity: pet
    method: DELETE
    path: /pet/{id}
    description: Delete a pet. Refused while an order references it.
  get_order:
    op: get
    entity: store_order
    method: GET
    path: /store/orders/{id}
    description: Fetch one order.
  list_orders:
    op: list
    entity: store_order
    filters:
      - petId
      - status
      - complete
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /store/orders
    description: List orders, filtered by pet and status.
  list_categories:
    op: list
    entity: category
    filters: []
    search:
      - name
    sort: []
    pageSize: 25
    method: GET
    path: /categories
    description: List categories, searchable by name.
  create_category:
    op: create
    entity: category
    method: POST
    path: /categories
    description: Create a category.
  list_refunds:
    op: list
    entity: refund
    filters:
      - orderId
      - status
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /refunds
    description: List refunds, filtered by order and status.
  get_refund:
    op: get
    entity: refund
    method: GET
    path: /refunds/{id}
    description: Fetch one refund.
actions:
  update_pet:
    method: PUT
    path: /pet
    description: Update an existing pet by the id in the body. A pet with an open order cannot change status.
    input:
      id:
        type: string
        description: Id of the pet to update.
        required: true
        nullable: false
        unique: false
        readonly: false
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      photoUrls:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
      category:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: category
        onDelete: restrict
      tags:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - available
          - pending
          - sold
    handler: |-
      (ctx) => {
        const pet = ctx.db.get('pet', ctx.body.id);
        if (pet === null) ctx.fail(404, 'pet_not_found', 'pet ' + ctx.body.id + ' not found');
        const patch = { name: ctx.body.name, photoUrls: ctx.body.photoUrls };
        if (ctx.body.category !== undefined) patch.category = ctx.body.category;
        if (ctx.body.tags !== undefined) patch.tags = ctx.body.tags;
        const st = ctx.body.status;
        if (st !== undefined && st !== null && st !== pet.status) {
          const open = ctx.db.list('store_order', { where: { petId: pet.id } }).filter((o) => o.status === 'placed' || o.status === 'approved');
          if (open.length > 0) ctx.fail(409, 'pet_reserved', 'pet ' + pet.id + ' has an open order and stays pending. Delete the order first.');
          patch.status = st;
        }
        const updated = ctx.db.update('pet', pet.id, patch);
        return { status: 200, body: updated };
      }
  place_order:
    method: POST
    path: /store/orders
    description: Place an order for an available pet. The order starts placed and the pet becomes pending.
    input:
      petId:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: pet
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      shipDate:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - placed
          - approved
          - delivered
      complete:
        type: bool
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const b = ctx.body;
        if (b.status !== undefined && b.status !== null && b.status !== 'placed') ctx.fail(422, 'invalid_status', 'new orders are always placed, got ' + b.status);
        if (b.complete === true) ctx.fail(422, 'invalid_status', 'new orders cannot be complete');
        const pet = ctx.db.get('pet', b.petId);
        if (pet === null) ctx.fail(400, 'input.invalid', 'pet ' + b.petId + ' not found');
        if (pet.status !== 'available') ctx.fail(409, 'pet_not_available', 'pet ' + pet.id + ' is ' + pet.status + ', only available pets can be ordered.');
        const data = { petId: pet.id, quantity: b.quantity, complete: false };
        if (b.shipDate !== undefined) data.shipDate = b.shipDate;
        const order = ctx.db.create('store_order', data);
        ctx.db.update('pet', pet.id, { status: 'pending' });
        return { status: 200, body: order };
      }
  approve_order:
    method: POST
    path: /store/orders/{id}/approve
    description: Move a placed order to approved.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('store_order', ctx.params.id);
        if (o === null) ctx.fail(404, 'order_not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'placed') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only placed orders can be approved.');
        const updated = ctx.db.update('store_order', o.id, { status: 'approved' });
        return { status: 200, body: updated };
      }
  deliver_order:
    method: POST
    path: /store/orders/{id}/deliver
    description: Move an approved order to delivered, set complete and mark the pet sold.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('store_order', ctx.params.id);
        if (o === null) ctx.fail(404, 'order_not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'approved') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only approved orders can be delivered.');
        const updated = ctx.db.update('store_order', o.id, { status: 'delivered', complete: true });
        ctx.db.update('pet', o.petId, { status: 'sold' });
        return { status: 200, body: updated };
      }
  delete_order:
    method: DELETE
    path: /store/orders/{id}
    description: Delete an order. A placed or approved order releases its pet back to available.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('store_order', ctx.params.id);
        if (o === null) ctx.fail(404, 'order_not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'delivered') {
          const pet = ctx.db.get('pet', o.petId);
          if (pet !== null && pet.status === 'pending') ctx.db.update('pet', pet.id, { status: 'available' });
        }
        ctx.db.delete('store_order', o.id);
        return { status: 204, body: null };
      }
  get_inventory:
    method: GET
    path: /store/inventory
    description: Count of pets by status.
    input: {}
    handler: |-
      (ctx) => {
        const inv = { available: 0, pending: 0, sold: 0 };
        for (const p of ctx.db.list('pet')) inv[p.status] += 1;
        return { status: 200, body: inv };
      }
  request_refund:
    method: POST
    path: /store/orders/{id}/refunds
    description: Request a refund for a delivered order. One active refund (requested or approved) per order.
    input:
      amount:
        type: money
        description: Refund amount in USD minor units.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
      reason:
        type: text
        description: Why the customer wants a refund.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const o = ctx.db.get('store_order', ctx.params.id);
        if (o === null) ctx.fail(404, 'order_not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'delivered') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only delivered orders can be refunded.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for request_refund: reason expected a non-blank text');
        const active = ctx.db.list('refund', { where: { orderId: o.id } }).filter((r) => r.status === 'requested' || r.status === 'approved');
        if (active.length > 0) ctx.fail(409, 'refund_exists', 'order ' + o.id + ' already has an active refund ' + active[0].id + '.');
        const refund = ctx.db.create('refund', { orderId: o.id, amount: ctx.body.amount, reason, restock: false });
        return { status: 201, body: refund };
      }
  approve_refund:
    method: POST
    path: /refunds/{id}/approve
    description: Approve a requested refund. With restock true the sold pet goes back to available.
    input:
      restock:
        type: bool
        description: Put the sold pet back on sale. Default false.
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const r = ctx.db.get('refund', ctx.params.id);
        if (r === null) ctx.fail(404, 'refund_not_found', 'refund ' + ctx.params.id + ' not found');
        if (r.status !== 'requested') ctx.fail(409, 'invalid_state', 'refund ' + r.id + ' is ' + r.status + '. Only requested refunds can be approved.');
        const restock = ctx.body.restock === true;
        if (restock) {
          const o = ctx.db.get('store_order', r.orderId);
          const pet = o === null ? null : ctx.db.get('pet', o.petId);
          if (pet === null || pet.status !== 'sold') ctx.fail(409, 'cannot_restock', 'the pet of order ' + r.orderId + ' is not sold, so it cannot be restocked.');
          ctx.db.update('pet', pet.id, { status: 'available' });
        }
        const updated = ctx.db.update('refund', r.id, { status: 'approved', restock, decided_at: ctx.now() });
        return { status: 200, body: updated };
      }
  reject_refund:
    method: POST
    path: /refunds/{id}/reject
    description: Reject a requested refund with a required note.
    input:
      note:
        type: text
        description: Why the refund is rejected.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const r = ctx.db.get('refund', ctx.params.id);
        if (r === null) ctx.fail(404, 'refund_not_found', 'refund ' + ctx.params.id + ' not found');
        const note = ctx.body.note.trim();
        if (note === '') ctx.fail(400, 'input.invalid', 'Invalid input for reject_refund: note expected a non-blank text');
        if (r.status !== 'requested') ctx.fail(409, 'invalid_state', 'refund ' + r.id + ' is ' + r.status + '. Only requested refunds can be rejected.');
        const updated = ctx.db.update('refund', r.id, { status: 'rejected', decision_note: note, decided_at: ctx.now() });
        return { status: 200, body: updated };
      }
jobs: {}
