  settle_requested_refunds:
    difficulty: hard
    instruction: Go through every refund that is still in status requested. Reject each one above 10000 (USD minor units) with a note that says why, and approve each one at or below 10000 without restocking the pet. Refunds that are already approved or rejected stay as they are, and no pet or order changes.
    grader: |-
      (ctx) => {
        const targets = ctx.seed.list('refund', { where: { status: 'requested' } });
        if (targets.length === 0) return 0;
        const fields = ['status', 'restock', 'decision_note', 'decided_at'];
        ctx.guardChanges('only the requested refunds were decided, no pet or order changed', targets.map((t) => ({ entity: 'refund', id: t.id, kind: 'updated', fields })));
        for (const t of targets) {
          const end = ctx.db.get('refund', t.id);
          let ok = false;
          if (end !== null) {
            if (t.amount > 10000) ok = end.status === 'rejected' && typeof end.decision_note === 'string' && end.decision_note.trim().length > 0;
            else ok = end.status === 'approved' && end.restock === false;
          }
          ctx.goal(1 / targets.length, 'refund ' + t.id + ' decided by the amount rule', ok);
        }
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const list = ctx.api('GET', '/refunds?status=requested');
        ctx.assert(list.status === 200, 'list failed: ' + JSON.stringify(list.body));
        ctx.assert(list.body.next_cursor === null, 'more refunds than one page');
        ctx.assert(list.body.data.length > 0, 'no requested refunds found');
        for (const r of list.body.data) {
          if (r.amount > 10000) {
            const x = ctx.api('POST', '/refunds/' + r.id + '/reject', { note: 'Amount above the 10000 limit for automatic refunds' });
            ctx.assert(x.status === 200, 'reject ' + r.id + ' failed: ' + JSON.stringify(x.body));
          } else {
            const x = ctx.api('POST', '/refunds/' + r.id + '/approve', { restock: false });
            ctx.assert(x.status === 200, 'approve ' + r.id + ' failed: ' + JSON.stringify(x.body));
          }
        }
      }
    decoys:
      - why: decides only the first requested refund and stops, leaving the others
        script: |-
          (ctx) => {
            const rows = ctx.api('GET', '/refunds?status=requested').body.data;
            const r = rows[0];
            if (r.amount > 10000) ctx.api('POST', '/refunds/' + r.id + '/reject', { note: 'Amount above the 10000 limit' });
            else ctx.api('POST', '/refunds/' + r.id + '/approve', { restock: false });
          }
      - why: approves every requested refund regardless of amount
        script: |-
          (ctx) => {
            const rows = ctx.api('GET', '/refunds?status=requested').body.data;
            for (const r of rows) ctx.api('POST', '/refunds/' + r.id + '/approve', { restock: false });
          }
      - why: rejects every requested refund regardless of amount
        script: |-
          (ctx) => {
            const rows = ctx.api('GET', '/refunds?status=requested').body.data;
            for (const r of rows) ctx.api('POST', '/refunds/' + r.id + '/reject', { note: 'Rejected in bulk' });
          }
      - why: decides each refund by the rule but approves the small ones with restock true, which puts sold pets back on sale
        script: |-
          (ctx) => {
            const rows = ctx.api('GET', '/refunds?status=requested').body.data;
            for (const r of rows) {
              if (r.amount > 10000) ctx.api('POST', '/refunds/' + r.id + '/reject', { note: 'Amount above the 10000 limit' });
              else ctx.api('POST', '/refunds/' + r.id + '/approve', { restock: true });
            }
          }
    alternatives: []
