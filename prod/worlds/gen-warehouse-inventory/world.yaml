  cancel_unstarted_northgate_pos:
    difficulty: medium
    instruction: Cancel every submitted purchase order of the supplier Northgate Industrial (not the similarly named Northgate Industries) that has not received any goods yet. Leave its draft and partially received orders, and every other supplier's orders, exactly as they are.
    grader: "(ctx) => { const sup = ctx.seed.list('supplier', { where: { name: 'Northgate Industrial' } })[0]; if (!sup) return 0; const targets = ctx.seed.list('purchase_order', { where: { supplier_id: sup.id, status: 'submitted' } }).filter((po) => ctx.seed.list('purchase_order_line', { where: { purchase_order_id: po.id } }).every((l) => l.received_qty === 0)); if (targets.length === 0) return 0; ctx.guardChanges('only the status of the target POs changed', targets.map((po) => ({ entity: 'purchase_order', id: po.id, kind: 'updated', fields: ['status'] }))); let done = 0; for (const po of targets) { if (ctx.db.get('purchase_order', po.id).status === 'cancelled') done += 1; } return done / targets.length; }"
    solution: "(ctx) => { const pages = (path) => { const rows = []; let cursor = null; do { const r = ctx.api('GET', path + (cursor === null ? '' : (path.indexOf('?') < 0 ? '?' : '&') + 'cursor=' + cursor)); ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cursor = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cursor !== null); return rows; }; const sup = ctx.api('GET', '/suppliers?q=Northgate').body.data.find((s) => s.name === 'Northgate Industrial'); ctx.assert(sup, 'supplier Northgate Industrial not found'); const pos = pages('/purchase_orders?supplier_id=' + sup.id + '&status=submitted'); ctx.assert(pos.length > 0, 'no submitted POs found'); for (const po of pos) { const lines = ctx.api('GET', '/purchase_orders/' + po.id + '/lines').body.data; if (lines.some((l) => l.received_qty > 0)) continue; const r = ctx.api('POST', '/purchase_orders/' + po.id + '/cancel', {}); ctx.assert(r.status === 200, 'cancel failed: ' + JSON.stringify(r.body)); } }"
