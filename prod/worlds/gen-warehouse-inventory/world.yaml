  restock_pick_bins:
    difficulty: hard
    instruction: Restock the pick bins for the bracket and gasket families. For every active SKU whose code starts with BRK- or GSK- that has a stock level in a pick-zone bin below its reorder_point, transfer stock from a bulk-zone bin that holds that SKU into that pick bin. Transfer exactly the shortfall (the reorder_point minus the pick bin's current quantity), so the pick bin ends exactly at its reorder_point. Skip inactive SKUs and pick bins that are already at or above the reorder point. Do not touch any other stock.
    grader: "(ctx) => { const MF = ['sku_id','bin_id','kind','quantity_delta','balance_after','purchase_order_id','purchase_order_line_id','reference','note']; const skuById = {}; for (const s of ctx.seed.list('sku')) skuById[s.id] = s; const binById = {}; for (const b of ctx.db.list('bin')) binById[b.id] = b; const targets = ctx.seed.list('stock_level').filter((l) => { const s = skuById[l.sku_id]; return s.active && (s.code.startsWith('BRK-') || s.code.startsWith('GSK-')) && binById[l.bin_id].zone === 'pick' && l.quantity < s.reorder_point; }); if (targets.length === 0) return 0; const tsku = new Set(targets.map((t) => t.sku_id)); const moves = ctx.db.list('stock_movement').filter((m) => ctx.seed.get('stock_movement', m.id) === null); const allowed = []; const seen = new Set(); const add = (a) => { const k = a.entity + ':' + a.id; if (seen.has(k)) return; seen.add(k); allowed.push(a); }; for (const t of targets) add({ entity: 'stock_level', id: t.id, kind: 'updated', fields: ['quantity'] }); for (const m of moves) { if (!tsku.has(m.sku_id)) continue; add({ entity: 'stock_movement', id: m.id, kind: 'created', fields: MF }); if (m.kind === 'transfer_out' && binById[m.bin_id].zone === 'bulk') { const lv = ctx.db.list('stock_level', { where: { sku_id: m.sku_id, bin_id: m.bin_id } })[0]; if (lv) add({ entity: 'stock_level', id: lv.id, kind: 'updated', fields: ['quantity'] }); } } ctx.guardChanges('only target pick levels, their bulk source levels and the transfer movements changed', allowed); let done = 0; for (const t of targets) { const s = skuById[t.sku_id]; const short = s.reorder_point - t.quantity; const end = ctx.db.get('stock_level', t.id); const mine = moves.filter((m) => m.sku_id === t.sku_id); const ins = mine.filter((m) => m.kind === 'transfer_in'); const outs = mine.filter((m) => m.kind === 'transfer_out'); if (end.quantity === s.reorder_point && mine.length === 2 && ins.length === 1 && outs.length === 1 && ins[0].bin_id === t.bin_id && ins[0].quantity_delta === short && outs[0].quantity_delta === -short && binById[outs[0].bin_id].zone === 'bulk') done += 1; } return done / targets.length; }"
    solution: "(ctx) => { const pages = (path) => { const rows = []; let cursor = null; do { const r = ctx.api('GET', path + (cursor === null ? '' : (path.indexOf('?') < 0 ? '?' : '&') + 'cursor=' + cursor)); ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cursor = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cursor !== null); return rows; }; const skus = pages('/skus').filter((s) => s.active && (s.code.startsWith('BRK-') || s.code.startsWith('GSK-'))); const pick = new Set(pages('/bins?zone=pick').map((b) => b.id)); const bulk = new Set(pages('/bins?zone=bulk').map((b) => b.id)); const levels = pages('/stock_levels'); let moved = 0; for (const s of skus) { const mine = levels.filter((l) => l.sku_id === s.id); for (const p of mine.filter((l) => pick.has(l.bin_id) && l.quantity < s.reorder_point)) { const short = s.reorder_point - p.quantity; const srcs = mine.filter((l) => bulk.has(l.bin_id) && l.quantity >= short).sort((a, b) => b.quantity - a.quantity); ctx.assert(srcs.length > 0, 'no bulk bin holds ' + short + ' units of ' + s.code); const r = ctx.api('POST', '/stock/transfer', { sku_id: s.id, from_bin_id: srcs[0].bin_id, to_bin_id: p.bin_id, quantity: short }); ctx.assert(r.status === 200, 'transfer failed: ' + JSON.stringify(r.body)); moved++; } } ctx.assert(moved > 0, 'no pick bins below their reorder point found'); }"
    decoys:
      - why: moves the whole quantity of the bulk bin instead of only the shortfall, so pick bins overshoot the reorder point
        script: "(ctx) => { const pages = (path) => { const rows = []; let cursor = null; do { const r = ctx.api('GET', path + (cursor === null ? '' : (path.indexOf('?') < 0 ? '?' : '&') + 'cursor=' + cursor)); rows.push(...r.body.data); cursor = r.body.next_cursor === undefined ? null : r.body.next_cursor; } while (cursor !== null); return rows; }; const skus = pages('/skus').filter((s) => s.active && (s.code.startsWith('BRK-') || s.code.startsWith('GSK-'))); const pick = new Set(pages('/bins?zone=pick').map((b) => b.id)); const bulk = new Set(pages('/bins?zone=bulk').map((b) => b.id)); const levels = pages('/stock_levels'); for (const s of skus) { const mine = levels.filter((l) => l.sku_id === s.id); for (const p of mine.filter((l) => pick.has(l.bin_id) && l.quantity < s.reorder_point)) { const short = s.reorder_point - p.quantity; const srcs = mine.filter((l) => bulk.has(l.bin_id) && l.quantity >= short).sort((a, b) => b.quantity - a.quantity); if (srcs.length > 0) ctx.api('POST', '/stock/transfer', { sku_id: s.id, from_bin_id: srcs[0].bin_id, to_bin_id: p.bin_id, quantity: srcs[0].quantity }); } } }"
