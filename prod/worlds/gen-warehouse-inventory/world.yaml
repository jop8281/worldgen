format: 1
meta:
  name: gen_warehouse_inventory
  description: A single-warehouse inventory system. SKUs are stocked in bins (stock_level rows, one per SKU and bin). Every change to stock is written to an append-only stock_movement ledger by an action, and stock can never go below zero. Purchase orders to suppliers move draft -> submitted -> partially_received -> received (or cancelled). Goods are received one PO line and one bin at a time, so a PO is received into bins in several partial shipments. Receiving is refused when it would exceed the ordered quantity, overfill a bin, or target an inactive or quarantine bin. Agents also issue stock, run cycle-count adjustments and transfer stock between bins. A job flags overdue purchase orders.
  resembles: Warehouse inventory / WMS-style stock ledger with purchase-order receiving (in the spirit of Odoo Inventory, NetSuite Inventory and Fishbowl)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 0s
  api:
    list:
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
    error:
      error:
        code: $code
        message: $message
entities:
  supplier:
    description: A vendor that purchase orders are placed with.
    idPrefix: sup
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        format: email
      active:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  sku:
    description: "A stock keeping unit: a distinct item the warehouse holds. reorder_point is the minimum desired quantity in pick bins."
    idPrefix: sku
    fields:
      code:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 160
      unit_cost:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      reorder_point:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
      active:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  bin:
    description: A storage location. capacity is the maximum total units across all SKUs in the bin. Quarantine and inactive bins cannot receive stock.
    idPrefix: bin
    fields:
      code:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      zone:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - receiving
          - pick
          - bulk
          - quarantine
      capacity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      active:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  purchase_order:
    description: An order to a supplier. Status moves only through actions. overdue is set by a job.
    idPrefix: po
    fields:
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      supplier_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: supplier
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - draft
          - submitted
          - partially_received
          - received
          - cancelled
        initial: draft
        transitions:
          draft:
            - submitted
            - cancelled
          submitted:
            - partially_received
            - received
            - cancelled
          partially_received:
            - received
          received: []
          cancelled: []
      expected_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      submitted_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      received_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      overdue:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  purchase_order_line:
    description: One SKU on a purchase order. received_qty grows with each partial receipt and never exceeds ordered_qty.
    idPrefix: pol
    fields:
      purchase_order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: purchase_order
        onDelete: cascade
      sku_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: sku
        onDelete: restrict
      ordered_qty:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 1
      received_qty:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      unit_cost:
        type: money
        required: false
        nullable: true
        unique: false
        readonly: true
        currency: USD
        min: 0
  stock_level:
    description: Current on-hand quantity of one SKU in one bin. Changed only by actions. Rows with quantity 0 are kept.
    idPrefix: stk
    fields:
      sku_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: sku
        onDelete: restrict
      bin_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: bin
        onDelete: restrict
      quantity:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
  stock_movement:
    description: Append-only ledger row written by every stock action. quantity_delta is signed and balance_after is the bin quantity after the movement.
    idPrefix: mov
    fields:
      sku_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: sku
        onDelete: restrict
      bin_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: bin
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - receipt
          - issue
          - adjustment
          - transfer_in
          - transfer_out
      quantity_delta:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
      balance_after:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
      purchase_order_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: purchase_order
        onDelete: restrict
      purchase_order_line_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: purchase_order_line
        onDelete: restrict
      reference:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: true
        maxLength: 200
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
