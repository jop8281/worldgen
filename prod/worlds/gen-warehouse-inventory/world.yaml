actions:
  add_po_line:
    method: POST
    path: /purchase_orders/{id}/add_line
    description: Add a line to a draft PO. One line per SKU.
    input:
      sku_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: sku
        onDelete: restrict
      ordered_qty:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      unit_cost:
        type: money
        required: false
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const po = ctx.db.get('purchase_order', id);
        if (po === null) ctx.fail(404, 'not_found', 'purchase order ' + id + ' not found');
        if (po.status !== 'draft') ctx.fail(409, 'invalid_state', 'purchase order ' + id + ' is ' + po.status + '. Lines can only be added while draft.');
        const sku = ctx.db.get('sku', ctx.body.sku_id);
        if (sku === null) ctx.fail(404, 'unknown_sku', 'sku ' + ctx.body.sku_id + ' not found');
        if (!sku.active) ctx.fail(409, 'sku_inactive', 'sku ' + sku.code + ' is inactive');
        const dup = ctx.db.list('purchase_order_line', { where: { purchase_order_id: id, sku_id: sku.id } });
        if (dup.length > 0) ctx.fail(409, 'duplicate_sku', 'purchase order ' + id + ' already has a line for sku ' + sku.code);
        const cost = ctx.body.unit_cost === undefined || ctx.body.unit_cost === null ? sku.unit_cost : ctx.body.unit_cost;
        const line = ctx.db.create('purchase_order_line', { purchase_order_id: id, sku_id: sku.id, ordered_qty: ctx.body.ordered_qty, received_qty: 0, unit_cost: cost });
        return { status: 201, body: line };
      }
  submit_purchase_order:
    method: POST
    path: /purchase_orders/{id}/submit
    description: Submit a draft PO that has at least one line.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const po = ctx.db.get('purchase_order', id);
        if (po === null) ctx.fail(404, 'not_found', 'purchase order ' + id + ' not found');
        if (po.status !== 'draft') ctx.fail(409, 'invalid_state', 'purchase order ' + id + ' is ' + po.status + '. Only draft POs can be submitted.');
        const lines = ctx.db.list('purchase_order_line', { where: { purchase_order_id: id } });
        if (lines.length === 0) ctx.fail(409, 'no_lines', 'purchase order ' + id + ' has no lines');
        const updated = ctx.db.update('purchase_order', id, { status: 'submitted', submitted_at: ctx.now() });
        return { status: 200, body: updated };
      }
  receive_purchase_order:
    method: POST
    path: /purchase_orders/{id}/receive
    description: Receive one shipment of one PO line into one bin.
    input:
      line_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: purchase_order_line
        onDelete: restrict
      bin_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bin
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const po = ctx.db.get('purchase_order', id);
        if (po === null) ctx.fail(404, 'not_found', 'purchase order ' + id + ' not found');
        if (po.status !== 'submitted' && po.status !== 'partially_received') ctx.fail(409, 'invalid_state', 'purchase order ' + id + ' is ' + po.status + '. Only submitted or partially received POs can receive goods.');
        const line = ctx.db.get('purchase_order_line', ctx.body.line_id);
        if (line === null) ctx.fail(404, 'unknown_line', 'line ' + ctx.body.line_id + ' not found');
        if (line.purchase_order_id !== id) ctx.fail(409, 'line_mismatch', 'line ' + line.id + ' does not belong to purchase order ' + id);
        const bin = ctx.db.get('bin', ctx.body.bin_id);
        if (bin === null) ctx.fail(404, 'unknown_bin', 'bin ' + ctx.body.bin_id + ' not found');
        if (!bin.active || bin.zone === 'quarantine') ctx.fail(409, 'bin_not_receivable', 'bin ' + bin.code + ' cannot receive stock (inactive or quarantine).');
        const q = ctx.body.quantity;
        const remaining = line.ordered_qty - line.received_qty;
        if (q > remaining) ctx.fail(409, 'over_receipt', 'only ' + remaining + ' units remain on line ' + line.id + ', cannot receive ' + q);
        const levels = ctx.db.list('stock_level', { where: { bin_id: bin.id } });
        let total = 0;
        for (const l of levels) total += l.quantity;
        if (total + q > bin.capacity) ctx.fail(409, 'bin_capacity_exceeded', 'bin ' + bin.code + ' holds ' + total + ' of ' + bin.capacity + ' units, cannot add ' + q);
        const existing = levels.find((l) => l.sku_id === line.sku_id);
        let level;
        if (existing) level = ctx.db.update('stock_level', existing.id, { quantity: existing.quantity + q });
        else level = ctx.db.create('stock_level', { sku_id: line.sku_id, bin_id: bin.id, quantity: q });
        const note = ctx.body.note === undefined ? null : ctx.body.note;
        const movement = ctx.db.create('stock_movement', { sku_id: line.sku_id, bin_id: bin.id, kind: 'receipt', quantity_delta: q, balance_after: level.quantity, purchase_order_id: id, purchase_order_line_id: line.id, reference: po.number, note });
        const newLine = ctx.db.update('purchase_order_line', line.id, { received_qty: line.received_qty + q });
        const all = ctx.db.list('purchase_order_line', { where: { purchase_order_id: id } });
        const done = all.every((l) => l.received_qty >= l.ordered_qty);
        let patch;
        if (done) patch = { status: 'received', received_at: ctx.now() };
        else if (po.status === 'submitted') patch = { status: 'partially_received' };
        else patch = null;
        const newPo = patch === null ? po : ctx.db.update('purchase_order', id, patch);
        return { status: 200, body: { purchase_order: newPo, line: newLine, stock_level: level, movement } };
      }
  cancel_purchase_order:
    method: POST
    path: /purchase_orders/{id}/cancel
    description: Cancel a draft or submitted PO with no receipts.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const po = ctx.db.get('purchase_order', id);
        if (po === null) ctx.fail(404, 'not_found', 'purchase order ' + id + ' not found');
        if (po.status !== 'draft' && po.status !== 'submitted') ctx.fail(409, 'invalid_state', 'purchase order ' + id + ' is ' + po.status + ' and cannot be cancelled.');
        const lines = ctx.db.list('purchase_order_line', { where: { purchase_order_id: id } });
        if (lines.some((l) => l.received_qty > 0)) ctx.fail(409, 'invalid_state', 'purchase order ' + id + ' already has receipts.');
        const updated = ctx.db.update('purchase_order', id, { status: 'cancelled' });
        return { status: 200, body: updated };
      }
  issue_stock:
    method: POST
    path: /stock/issue
    description: Remove stock of a SKU from a bin.
    input:
      sku_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: sku
        onDelete: restrict
      bin_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bin
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      reference:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 200
    handler: |-
      (ctx) => {
        const b = ctx.body;
        const level = ctx.db.list('stock_level', { where: { sku_id: b.sku_id, bin_id: b.bin_id } })[0];
        const have = level ? level.quantity : 0;
        if (have < b.quantity) ctx.fail(409, 'insufficient_stock', 'bin holds ' + have + ' units, cannot issue ' + b.quantity);
        const updated = ctx.db.update('stock_level', level.id, { quantity: have - b.quantity });
        const reference = b.reference === undefined ? null : b.reference;
        const movement = ctx.db.create('stock_movement', { sku_id: b.sku_id, bin_id: b.bin_id, kind: 'issue', quantity_delta: -b.quantity, balance_after: updated.quantity, reference });
        return { status: 200, body: { stock_level: updated, movement } };
      }
  adjust_stock:
    method: POST
    path: /stock/adjust
    description: "Cycle count: set the exact quantity of a SKU in a bin."
    input:
      sku_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: sku
        onDelete: restrict
      bin_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bin
        onDelete: restrict
      new_quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      reason:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const b = ctx.body;
        const reason = b.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for adjust_stock: reason expected a non-blank text, found ""');
        const bin = ctx.db.get('bin', b.bin_id);
        const levels = ctx.db.list('stock_level', { where: { bin_id: b.bin_id } });
        const level = levels.find((l) => l.sku_id === b.sku_id);
        const current = level ? level.quantity : 0;
        const delta = b.new_quantity - current;
        if (delta === 0) ctx.fail(409, 'no_change', 'quantity is already ' + current);
        if (delta > 0) {
          let total = 0;
          for (const l of levels) total += l.quantity;
          if (total + delta > bin.capacity) ctx.fail(409, 'bin_capacity_exceeded', 'bin ' + bin.code + ' holds ' + total + ' of ' + bin.capacity + ' units, cannot add ' + delta);
        }
        let updated;
        if (level) updated = ctx.db.update('stock_level', level.id, { quantity: b.new_quantity });
        else updated = ctx.db.create('stock_level', { sku_id: b.sku_id, bin_id: b.bin_id, quantity: b.new_quantity });
        const movement = ctx.db.create('stock_movement', { sku_id: b.sku_id, bin_id: b.bin_id, kind: 'adjustment', quantity_delta: delta, balance_after: updated.quantity, reference: 'cycle count', note: reason });
        return { status: 200, body: { stock_level: updated, movement } };
      }
  transfer_stock:
    method: POST
    path: /stock/transfer
    description: Move stock of a SKU between two bins.
    input:
      sku_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: sku
        onDelete: restrict
      from_bin_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bin
        onDelete: restrict
      to_bin_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bin
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
    handler: |-
      (ctx) => {
        const b = ctx.body;
        if (b.from_bin_id === b.to_bin_id) ctx.fail(422, 'same_bin', 'source and destination bin are the same');
        const src = ctx.db.list('stock_level', { where: { sku_id: b.sku_id, bin_id: b.from_bin_id } })[0];
        const have = src ? src.quantity : 0;
        if (have < b.quantity) ctx.fail(409, 'insufficient_stock', 'source bin holds ' + have + ' units, cannot transfer ' + b.quantity);
        const dest = ctx.db.get('bin', b.to_bin_id);
        if (!dest.active || dest.zone === 'quarantine') ctx.fail(409, 'bin_not_receivable', 'bin ' + dest.code + ' cannot receive stock (inactive or quarantine).');
        const destLevels = ctx.db.list('stock_level', { where: { bin_id: dest.id } });
        let total = 0;
        for (const l of destLevels) total += l.quantity;
        if (total + b.quantity > dest.capacity) ctx.fail(409, 'bin_capacity_exceeded', 'bin ' + dest.code + ' holds ' + total + ' of ' + dest.capacity + ' units, cannot add ' + b.quantity);
        const from = ctx.db.update('stock_level', src.id, { quantity: have - b.quantity });
        const existing = destLevels.find((l) => l.sku_id === b.sku_id);
        let to;
        if (existing) to = ctx.db.update('stock_level', existing.id, { quantity: existing.quantity + b.quantity });
        else to = ctx.db.create('stock_level', { sku_id: b.sku_id, bin_id: dest.id, quantity: b.quantity });
        ctx.db.create('stock_movement', { sku_id: b.sku_id, bin_id: b.from_bin_id, kind: 'transfer_out', quantity_delta: -b.quantity, balance_after: from.quantity, reference: 'transfer to ' + dest.code });
        ctx.db.create('stock_movement', { sku_id: b.sku_id, bin_id: dest.id, kind: 'transfer_in', quantity_delta: b.quantity, balance_after: to.quantity, reference: 'transfer from ' + b.from_bin_id });
        return { status: 200, body: { from_stock_level: from, to_stock_level: to } };
      }
jobs:
  overdue_purchase_orders:
    description: Every 6 hours, flag submitted and partially received POs whose expected_at has passed as overdue.
    every: 6h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const status of ['submitted', 'partially_received']) {
          for (const po of ctx.db.list('purchase_order', { where: { status } })) {
            if (po.overdue) continue;
            if (po.expected_at === null || po.expected_at === undefined) continue;
            if (ctx.time.minutesBetween(po.expected_at, now) < 0) continue;
            ctx.db.update('purchase_order', po.id, { overdue: true });
          }
        }
      }
