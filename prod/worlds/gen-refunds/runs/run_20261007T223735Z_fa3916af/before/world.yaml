format: 1
meta:
  name: gen_refunds
  description: A deterministic Stripe-style payments sandbox centred on refunds. Seeded charges can be refunded in full or in part through create_refund. Refunds follow Stripe's status lifecycle (pending, requires_action, succeeded, failed, canceled). Every refund keeps the parent charge's amount_refunded and refunded flag in step. Agents can list, retrieve, create, tag with metadata and cancel refunds, and read charges to find what to refund. Jobs settle pending refunds and expire stale requires_action ones. The world keeps Stripe's refund rules, such as the unrefunded-amount cap, the disputed-charge refusal, cancel only from requires_action, and merge-style metadata updates. It keeps Stripe's list envelope with has_more and starting_after / ending_before paging, but takes JSON bodies instead of form encoding.
  resembles: Stripe API (Refunds and Charges), version 2024-06-20
  source: worldgen
  seed: 0
  clock:
    start: 2026-01-05T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: stripe
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        type: invalid_request_error
        code: $code
        message: $message
entities:
  charge:
    description: A card, wallet or bank payment that can be refunded. Seed-only. amount_refunded and refunded are kept in step with the charge's pending, requires_action and succeeded refunds by the refund actions and jobs.
    idPrefix: ch
    fields:
      amount:
        type: money
        description: Amount charged in cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
      amount_captured:
        type: money
        description: Amount captured in cents. 0 when captured is false.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
        default: 0
      amount_refunded:
        type: money
        description: Sum of the charge's pending, requires_action and succeeded refunds.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      refunded:
        type: bool
        description: True when amount_refunded equals amount_captured and is above 0.
        required: true
        nullable: false
        unique: false
        readonly: true
        default: false
      captured:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
      paid:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
      status:
        type: enum
        description: Charge status. Only a captured, succeeded charge can be refunded.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - succeeded
          - pending
          - failed
      payment_method_type:
        type: enum
        description: "Decides the status a new refund starts in: card succeeds at once, wallet is pending, bank_transfer is requires_action."
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - card
          - wallet
          - bank_transfer
      disputed:
        type: bool
        description: A disputed charge refuses new refunds.
        required: true
        nullable: false
        unique: false
        readonly: false
        default: false
      customer:
        type: string
        description: Customer id text such as cus_...
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 60
      receipt_email:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 200
        format: email
      description:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 300
      payment_intent:
        type: string
        description: Payment intent id text such as pi_...
        required: false
        nullable: true
        unique: true
        readonly: false
        maxLength: 60
      currency:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - usd
        default: usd
      livemode:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: false
      failure_code:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 80
      failure_message:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 300
      metadata:
        type: text
        description: JSON object string of key/value pairs.
        required: false
        nullable: true
        unique: false
        readonly: false
        default: "{}"
  refund:
    description: A full or partial return of money on one charge. Walks Stripe's refund lifecycle. Created by create_refund, cancelled by cancel_refund, settled or expired by jobs.
    idPrefix: re
    fields:
      charge:
        type: ref
        description: The charge being refunded.
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: charge
        onDelete: restrict
      payment_intent:
        type: string
        description: Copied from the charge.
        required: false
        nullable: true
        unique: false
        readonly: true
        maxLength: 60
      amount:
        type: money
        description: Refund amount in cents. Never above the charge's unrefunded amount.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 1
      currency:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - usd
        default: usd
      reason:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - duplicate
          - expired_uncaptured_charge
          - fraudulent
          - requested_by_customer
      status:
        type: state
        description: Refund lifecycle. succeeded, failed and canceled are final.
        required: true
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - requires_action
          - succeeded
          - failed
          - canceled
        initial: pending
        transitions:
          pending:
            - succeeded
            - failed
            - requires_action
            - canceled
          requires_action:
            - succeeded
            - failed
            - canceled
          succeeded: []
          failed: []
          canceled: []
      failure_reason:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - lost_or_stolen_card
          - expired_or_canceled_card
          - charge_for_pending_refund_disputed
          - insufficient_funds
          - declined
          - merchant_request
          - unknown
      receipt_number:
        type: string
        description: Set when status becomes succeeded.
        required: false
        nullable: true
        unique: false
        readonly: true
        maxLength: 40
      metadata:
        type: text
        description: JSON object string. Written only by create_refund and update_refund, which merge keys.
        required: false
        nullable: true
        unique: false
        readonly: true
        default: "{}"
routes:
  list_refunds:
    op: list
    entity: refund
    filters:
      - charge
    search: []
    sort: []
    pageSize: 10
    method: GET
    path: /v1/refunds
    description: List refunds with the charge filter, limit (default 10, max 100) and starting_after cursor.
  get_refund:
    op: get
    entity: refund
    method: GET
    path: /v1/refunds/{id}
    description: Retrieve one refund.
  list_charges:
    op: list
    entity: charge
    filters:
      - customer
      - payment_intent
      - status
    search:
      - receipt_email
      - description
    sort: []
    pageSize: 10
    method: GET
    path: /v1/charges
    description: List charges so an agent can find what to refund.
  get_charge:
    op: get
    entity: charge
    method: GET
    path: /v1/charges/{id}
    description: Retrieve one charge with its amount_captured, amount_refunded and refunded values.
actions:
  create_refund:
    method: POST
    path: /v1/refunds
    description: Create a refund on a charge. Give charge or payment_intent. amount defaults to the whole unrefunded balance. A card charge refunds to succeeded at once, a wallet charge to pending and a bank_transfer charge to requires_action. metadata is a JSON object string of string values.
    input:
      charge:
        type: string
        description: Id of the charge to refund, such as ch_0001.
        required: false
        nullable: false
        unique: false
        readonly: false
      payment_intent:
        type: string
        description: Payment intent of the charge to refund. Must match charge when both are given.
        required: false
        nullable: false
        unique: false
        readonly: false
      amount:
        type: int
        description: Amount in cents, at least 1. Defaults to the unrefunded balance of the charge.
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 1
      reason:
        type: enum
        description: Why the refund is made.
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - duplicate
          - expired_uncaptured_charge
          - fraudulent
          - requested_by_customer
      metadata:
        type: text
        description: JSON object string of string values, for example {"order_id":"6735"}.
        required: false
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const b = ctx.body;
        const q = String.fromCharCode(39);
        const usd = (n) => '$' + (n / 100).toFixed(2);
        const txt = (v) => (v === undefined || v === null ? '' : String(v).trim());
        const parseMeta = (raw) => {
          if (raw === undefined || raw === null) return {};
          let v = raw;
          if (typeof raw === 'string') {
            if (raw.trim() === '') return {};
            try { v = JSON.parse(raw); } catch (e) { v = undefined; }
            if (v === undefined) ctx.fail(400, 'parameter_invalid', 'metadata must be a JSON object string of string values.');
          }
          if (v === null || typeof v !== 'object' || Array.isArray(v)) ctx.fail(400, 'parameter_invalid', 'metadata must be a JSON object of string values.');
          for (const k of Object.keys(v)) {
            if (typeof v[k] !== 'string') ctx.fail(400, 'parameter_invalid', 'metadata value for key ' + k + ' must be a string.');
          }
          return v;
        };
        const chId = txt(b.charge);
        const piId = txt(b.payment_intent);
        if (chId === '' && piId === '') ctx.fail(400, 'parameter_missing', 'Must provide either charge or payment_intent.');
        const meta = parseMeta(b.metadata);
        let ch = null;
        if (chId !== '') {
          ch = ctx.db.get('charge', chId);
          if (ch === null) ctx.fail(400, 'resource_missing', 'No such charge: ' + q + chId + q);
        }
        if (piId !== '') {
          const hit = ctx.db.list('charge', { where: { payment_intent: piId } })[0];
          if (!hit) ctx.fail(400, 'resource_missing', 'No such payment_intent: ' + q + piId + q);
          if (ch !== null && ch.id !== hit.id) ctx.fail(400, 'charge_payment_intent_mismatch', 'The payment_intent ' + piId + ' does not belong to charge ' + ch.id + '.');
          ch = hit;
        }
        if (!ch.captured || ch.status !== 'succeeded') ctx.fail(400, 'charge_not_refundable', 'Charge ' + ch.id + ' has not been captured or did not succeed, so it cannot be refunded.');
        if (ch.disputed) ctx.fail(400, 'charge_disputed', 'Charge ' + ch.id + ' has been disputed and cannot be refunded.');
        const balance = ch.amount_captured - ch.amount_refunded;
        if (balance <= 0) ctx.fail(400, 'charge_already_refunded', 'Charge ' + ch.id + ' has already been refunded.');
        let amount = balance;
        if (b.amount !== undefined && b.amount !== null) {
          amount = b.amount;
          if (!Number.isInteger(amount) || amount < 1) ctx.fail(400, 'parameter_invalid', 'amount must be an integer of at least 1.');
          if (amount > balance) ctx.fail(400, 'amount_too_large', 'Refund amount (' + usd(amount) + ') is greater than unrefunded amount on charge (' + usd(balance) + ').');
        }
        const reason = b.reason === undefined ? null : b.reason;
        const created = ctx.db.create('refund', {
          charge: ch.id,
          payment_intent: ch.payment_intent === undefined ? null : ch.payment_intent,
          amount,
          currency: 'usd',
          reason,
          metadata: JSON.stringify(meta),
        });
        let out = created;
        if (ch.payment_method_type === 'card') out = ctx.db.update('refund', created.id, { status: 'succeeded', receipt_number: 'rcpt_' + created.id });
        else if (ch.payment_method_type === 'bank_transfer') out = ctx.db.update('refund', created.id, { status: 'requires_action' });
        const total = ch.amount_refunded + amount;
        ctx.db.update('charge', ch.id, { amount_refunded: total, refunded: total === ch.amount_captured && total > 0 });
        return { status: 200, body: out };
      }
  update_refund:
    method: POST
    path: /v1/refunds/{id}
    description: Merge metadata keys into a refund. A key set to an empty string is removed. Without metadata nothing changes. Works on a refund in any status and changes nothing else.
    input:
      metadata:
        type: text
        description: JSON object string of string values to merge, for example {"ticket_id":"ZD-4821"}. An empty string value removes that key.
        required: false
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const q = String.fromCharCode(39);
        const r = ctx.db.get('refund', ctx.params.id);
        if (r === null) ctx.fail(404, 'resource_missing', 'No such refund: ' + q + ctx.params.id + q);
        const raw = ctx.body.metadata;
              if (raw === undefined || raw === null) return { status: 200, body: r };
        let v = raw;
        if (typeof raw === 'string') {
          if (raw.trim() === '') ctx.fail(400, 'parameter_invalid', 'metadata must be a JSON object string of string values.');
          try { v = JSON.parse(raw); } catch (e) { v = undefined; }
          if (v === undefined) ctx.fail(400, 'parameter_invalid', 'metadata must be a JSON object string of string values.');
        }
        if (v === null || typeof v !== 'object' || Array.isArray(v)) ctx.fail(400, 'parameter_invalid', 'metadata must be a JSON object of string values.');
        for (const k of Object.keys(v)) {
          if (typeof v[k] !== 'string') ctx.fail(400, 'parameter_invalid', 'metadata value for key ' + k + ' must be a string.');
        }
        let cur = {};
        try {
          const p = JSON.parse(r.metadata === null || r.metadata === undefined ? '{}' : r.metadata);
          if (p !== null && typeof p === 'object' && !Array.isArray(p)) cur = p;
        } catch (e) { cur = {}; }
        const merged = Object.assign({}, cur);
        for (const k of Object.keys(v)) {
          if (v[k] === '') delete merged[k];
          else merged[k] = v[k];
        }
        const out = ctx.db.update('refund', r.id, { metadata: JSON.stringify(merged) });
        return { status: 200, body: out };
      }
  cancel_refund:
    method: POST
    path: /v1/refunds/{id}/cancel
    description: Cancel a refund. Only a refund in requires_action can be canceled. Its amount goes back to the charge's unrefunded balance.
    input: {}
    handler: |-
      (ctx) => {
        const q = String.fromCharCode(39);
        const r = ctx.db.get('refund', ctx.params.id);
        if (r === null) ctx.fail(404, 'resource_missing', 'No such refund: ' + q + ctx.params.id + q);
        if (r.status !== 'requires_action') ctx.fail(400, 'refund_not_cancelable', 'Refund ' + r.id + ' cannot be canceled because its status is ' + r.status + '. Only refunds with status requires_action can be canceled.');
        const out = ctx.db.update('refund', r.id, { status: 'canceled' });
        const ch = ctx.db.get('charge', r.charge);
        const total = Math.max(0, ch.amount_refunded - r.amount);
        ctx.db.update('charge', ch.id, { amount_refunded: total, refunded: total === ch.amount_captured && total > 0 });
        return { status: 200, body: out };
      }
jobs:
  settle_pending_refunds:
    description: Every hour. A pending refund created 6 or more hours ago succeeds and gets a receipt number. If its charge is disputed by then, it fails with charge_for_pending_refund_disputed and gives its amount back to the charge.
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const r of ctx.db.list('refund', { where: { status: 'pending' } })) {
          if (ctx.time.minutesBetween(r.created_at, now) < 360) continue;
          const ch = ctx.db.get('charge', r.charge);
          if (ch.disputed) {
            ctx.db.update('refund', r.id, { status: 'failed', failure_reason: 'charge_for_pending_refund_disputed' });
            const total = Math.max(0, ch.amount_refunded - r.amount);
            ctx.db.update('charge', ch.id, { amount_refunded: total, refunded: total === ch.amount_captured && total > 0 });
          } else {
            ctx.db.update('refund', r.id, { status: 'succeeded', receipt_number: 'rcpt_' + r.id });
            ctx.db.update('charge', ch.id, { refunded: ch.amount_refunded === ch.amount_captured && ch.amount_refunded > 0 });
          }
        }
      }
  expire_requires_action:
    description: Every day. A refund left in requires_action for more than 14 days fails with expired_or_canceled_card and gives its amount back to the charge.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const r of ctx.db.list('refund', { where: { status: 'requires_action' } })) {
          if (ctx.time.minutesBetween(r.created_at, now) <= 14 * 24 * 60) continue;
          ctx.db.update('refund', r.id, { status: 'failed', failure_reason: 'expired_or_canceled_card' });
          const ch = ctx.db.get('charge', r.charge);
          const total = Math.max(0, ch.amount_refunded - r.amount);
          ctx.db.update('charge', ch.id, { amount_refunded: total, refunded: total === ch.amount_captured && total > 0 });
        }
      }
fixtures: {}
