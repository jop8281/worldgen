format: 1
meta:
  name: world
  description: A single-shop bakery back office. Customers place pickup orders (including pre-orders for a future pickup time). Staff confirm orders, mark them ready and hand them over. The kitchen runs production batches that consume ingredients, per each product's recipe, and add finished stock. Ingredient stock is tracked against reorder levels, and jobs expire uncollected orders and flag low stock.
  resembles: "Square-for-Restaurants / Toast-style bakery management app: pre-orders and pickup, product catalog, recipes and ingredient stock, and daily production batches"
  source: worldgen
  seed: 0
  clock:
    start: 2026-01-05T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A person who orders from the bakery, with contact details and a loyalty tier.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      phone:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        format: phone
      loyalty_tier:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - none
          - regular
          - gold
        default: none
  product:
    description: A sellable bakery item with a USD price and finished stock on hand. stock_on_hand changes only through batches and orders.
    idPrefix: prd
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      category:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - bread
          - pastry
          - cake
          - cookie
          - drink
      price:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      stock_on_hand:
        type: int
        description: Finished units available. Reduced when an order is confirmed, raised by completed batches and cancellations.
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      par_level:
        type: int
        description: Target finished stock to bake up to each day.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
      contains_allergens:
        type: string
        description: Informational allergen list such as 'wheat, milk, egg'. Not enforced by workflows.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 200
  ingredient:
    description: A raw material such as flour or butter, with stock and a reorder level.
    idPrefix: ing
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 120
      unit:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - g
          - kg
          - ml
          - l
          - each
      stock_qty:
        type: number
        description: Quantity on hand in the ingredient's unit. Changes through restock_ingredient and complete_batch.
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      reorder_level:
        type: number
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
      low_stock:
        type: bool
        description: True when stock_qty is at or below reorder_level.
        required: true
        nullable: false
        unique: false
        readonly: true
        default: false
  recipe_line:
    description: One ingredient quantity needed to produce one unit of a product.
    idPrefix: rcl
    fields:
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: cascade
      ingredient_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: ingredient
        onDelete: restrict
      qty_per_unit:
        type: number
        description: Ingredient quantity, in the ingredient's unit, used per unit of product.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
  bakery_order:
    description: A pickup order from a customer with a status lifecycle and a total computed from its lines. Pre-orders have a future pickup_at.
    idPrefix: ord
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - placed
          - confirmed
          - ready
          - picked_up
          - cancelled
        initial: placed
        transitions:
          placed:
            - confirmed
            - cancelled
          confirmed:
            - ready
            - cancelled
          ready:
            - picked_up
            - cancelled
          picked_up: []
          cancelled: []
      pickup_at:
        type: datetime
        description: When the customer will collect the order.
        required: true
        nullable: false
        unique: false
        readonly: false
      total:
        type: money
        description: Sum of quantity times unit_price over the order lines.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      placed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
        default: now
      ready_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  order_line:
    description: A product and quantity on an order, with the unit price captured at order time.
    idPrefix: orl
    fields:
      order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bakery_order
        onDelete: cascade
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      unit_price:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  production_batch:
    description: A planned or completed bake of a quantity of one product. Completing it consumes recipe ingredients and adds product stock.
    idPrefix: bat
    fields:
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - planned
          - completed
          - cancelled
        initial: planned
        transitions:
          planned:
            - completed
            - cancelled
          completed: []
          cancelled: []
      scheduled_for:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      completed_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      baker_name:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 120
routes:
  list_products:
    op: list
    entity: product
    filters:
      - category
      - active
    search:
      - name
    sort:
      - price
      - stock_on_hand
      - name
    pageSize: 25
    method: GET
    path: /products
  get_product:
    op: get
    entity: product
    method: GET
    path: /products/{id}
  create_product:
    op: create
    entity: product
    method: POST
    path: /products
  update_product:
    op: update
    entity: product
    method: PATCH
    path: /products/{id}
  list_ingredients:
    op: list
    entity: ingredient
    filters:
      - low_stock
      - unit
    search:
      - name
    sort:
      - name
      - stock_qty
    pageSize: 25
    method: GET
    path: /ingredients
  get_ingredient:
    op: get
    entity: ingredient
    method: GET
    path: /ingredients/{id}
  list_recipe_lines:
    op: list
    entity: recipe_line
    filters:
      - ingredient_id
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /products/{product_id}/recipe
  list_customers:
    op: list
    entity: customer
    filters:
      - loyalty_tier
    search:
      - name
      - email
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /customers
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /customers/{id}
  create_customer:
    op: create
    entity: customer
    method: POST
    path: /customers
  update_customer:
    op: update
    entity: customer
    method: PATCH
    path: /customers/{id}
  list_orders:
    op: list
    entity: bakery_order
    filters:
      - status
      - customer_id
    search: []
    sort:
      - pickup_at
      - created_at
    pageSize: 25
    method: GET
    path: /orders
  get_order:
    op: get
    entity: bakery_order
    method: GET
    path: /orders/{id}
  list_order_lines:
    op: list
    entity: order_line
    filters:
      - product_id
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /orders/{order_id}/lines
  list_batches:
    op: list
    entity: production_batch
    filters:
      - status
      - product_id
    search: []
    sort:
      - scheduled_for
      - created_at
    pageSize: 25
    method: GET
    path: /batches
  get_batch:
    op: get
    entity: production_batch
    method: GET
    path: /batches/{id}
  create_batch:
    op: create
    entity: production_batch
    method: POST
    path: /batches
actions:
  create_ingredient:
    method: POST
    path: /ingredients
    description: Register a raw ingredient with an opening stock and reorder level. low_stock is computed. Stock changes afterwards only through restock_ingredient and complete_batch.
    input:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      unit:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - g
          - kg
          - ml
          - l
          - each
      stock_qty:
        type: number
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
      reorder_level:
        type: number
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
    handler: "(ctx) => { const b = ctx.body; const name = String(b.name).trim(); if (name === '') ctx.fail(400, 'input.invalid', 'name must not be blank'); if (ctx.db.list('ingredient', { where: { name } }).length > 0) ctx.fail(409, 'duplicate_name', 'ingredient ' + name + ' already exists'); const qty = b.stock_qty === undefined || b.stock_qty === null ? 0 : b.stock_qty; const level = b.reorder_level === undefined || b.reorder_level === null ? 0 : b.reorder_level; if (qty < 0 || level < 0) ctx.fail(422, 'invalid_quantity', 'stock_qty and reorder_level cannot be negative'); const row = ctx.db.create('ingredient', { name, unit: b.unit, stock_qty: qty, reorder_level: level, low_stock: qty <= level }); return { status: 201, body: row }; }"
  add_recipe_line:
    method: POST
    path: /products/{id}/recipe
    description: Add one ingredient quantity needed per unit of the product. An ingredient can appear once per product.
    input:
      ingredient_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: ingredient
        onDelete: restrict
      qty_per_unit:
        type: number
        description: Quantity in the ingredient's unit used per unit of product. Must be greater than 0.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const id = ctx.params.id; const product = ctx.db.get('product', id); if (product === null) ctx.fail(404, 'not_found', 'product ' + id + ' not found'); const ing = ctx.db.get('ingredient', ctx.body.ingredient_id); if (ing === null) ctx.fail(422, 'unknown_ingredient', 'ingredient ' + ctx.body.ingredient_id + ' not found. List ingredients with GET /ingredients.'); const q = ctx.body.qty_per_unit; if (typeof q !== 'number' || !(q > 0)) ctx.fail(422, 'invalid_quantity', 'qty_per_unit must be greater than 0'); if (ctx.db.list('recipe_line', { where: { product_id: id, ingredient_id: ing.id } }).length > 0) ctx.fail(409, 'duplicate_ingredient', 'product ' + id + ' already uses ' + ing.name + ' in its recipe'); const row = ctx.db.create('recipe_line', { product_id: id, ingredient_id: ing.id, qty_per_unit: q }); return { status: 201, body: row }; }"
  place_order:
    method: POST
    path: /orders
    description: Place a pickup order. lines is a JSON array text such as [{"product_id":"prd_0001","quantity":2}]. Lines are priced from the current product price and the total is computed. The order starts as placed and reserves no stock until confirmed. pickup_at must be in the future.
    input:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      pickup_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      lines:
        type: text
        description: JSON array of {product_id, quantity}. At least one line, each product once, quantity at least 1.
        required: true
        nullable: false
        unique: false
        readonly: false
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: "(ctx) => { const b = ctx.body; const customer = ctx.db.get('customer', b.customer_id); if (customer === null) ctx.fail(422, 'unknown_customer', 'customer ' + b.customer_id + ' not found. List customers with GET /customers.'); const now = ctx.now(); if (ctx.time.minutesBetween(now, b.pickup_at) <= 0) ctx.fail(422, 'pickup_in_past', 'pickup_at ' + b.pickup_at + ' must be after the current time ' + now); let parsed = b.lines; if (typeof parsed === 'string') { try { parsed = JSON.parse(parsed); } catch (e) { parsed = null; } } if (!Array.isArray(parsed)) ctx.fail(400, 'invalid_lines', 'lines must be a JSON array of {product_id, quantity}'); if (parsed.length === 0) ctx.fail(422, 'no_lines', 'an order needs at least one line'); const seen = {}; const priced = []; let total = 0; for (const raw of parsed) { const pid = raw ? raw.product_id : undefined; const qty = raw ? raw.quantity : undefined; if (typeof pid !== 'string') ctx.fail(422, 'invalid_line', 'every line needs a product_id'); if (!Number.isInteger(qty) || qty < 1) ctx.fail(422, 'invalid_quantity', 'quantity for ' + pid + ' must be a whole number of at least 1'); if (seen[pid]) ctx.fail(422, 'duplicate_product', 'product ' + pid + ' appears on more than one line. Combine the quantities.'); seen[pid] = true; const p = ctx.db.get('product', pid); if (p === null) ctx.fail(422, 'unknown_product', 'product ' + pid + ' not found. List products with GET /products.'); if (!p.active) ctx.fail(422, 'product_inactive', 'product ' + p.name + ' (' + p.id + ') is not active and cannot be ordered'); priced.push({ product_id: pid, quantity: qty, unit_price: p.price }); total += qty * p.price; } const note = b.note === undefined ? null : b.note; const order = ctx.db.create('bakery_order', { customer_id: customer.id, pickup_at: b.pickup_at, total, placed_at: now, note }); const lines = []; for (const l of priced) lines.push(ctx.db.create('order_line', { order_id: order.id, product_id: l.product_id, quantity: l.quantity, unit_price: l.unit_price })); return { status: 201, body: { ...order, lines } }; }"
  confirm_order:
    method: POST
    path: /orders/{id}/confirm
    description: Confirm a placed order. Every product must have enough stock_on_hand to cover its lines, otherwise 409 insufficient_stock. Confirming decrements stock_on_hand per line.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const order = ctx.db.get('bakery_order', id); if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (order.status !== 'placed') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only placed orders can be confirmed.'); const lines = ctx.db.list('order_line', { where: { order_id: id } }); const need = {}; for (const l of lines) need[l.product_id] = (need[l.product_id] || 0) + l.quantity; const pids = Object.keys(need); for (const pid of pids) { const p = ctx.db.get('product', pid); if (p.stock_on_hand < need[pid]) ctx.fail(409, 'insufficient_stock', 'insufficient stock for ' + p.name + ' (' + p.id + '): need ' + need[pid] + ', have ' + p.stock_on_hand + '. Bake a batch first.'); } for (const pid of pids) { const p = ctx.db.get('product', pid); ctx.db.update('product', pid, { stock_on_hand: p.stock_on_hand - need[pid] }); } const updated = ctx.db.update('bakery_order', id, { status: 'confirmed' }); return { status: 200, body: updated }; }"
  mark_order_ready:
    method: POST
    path: /orders/{id}/ready
    description: Mark a confirmed order ready for pickup and set ready_at to now.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const order = ctx.db.get('bakery_order', id); if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (order.status !== 'confirmed') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only confirmed orders can be marked ready.'); const updated = ctx.db.update('bakery_order', id, { status: 'ready', ready_at: ctx.now() }); return { status: 200, body: updated }; }"
  complete_pickup:
    method: POST
    path: /orders/{id}/pickup
    description: Hand a ready order to the customer. Allowed only from ready.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const order = ctx.db.get('bakery_order', id); if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (order.status !== 'ready') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only ready orders can be picked up.'); const updated = ctx.db.update('bakery_order', id, { status: 'picked_up' }); return { status: 200, body: updated }; }"
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a placed, confirmed or ready order. Confirmed and ready orders give their line quantities back to stock_on_hand. A placed order changes no stock.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const order = ctx.db.get('bakery_order', id); if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (order.status !== 'placed' && order.status !== 'confirmed' && order.status !== 'ready') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only placed, confirmed and ready orders can be cancelled.'); if (order.status === 'confirmed' || order.status === 'ready') { const lines = ctx.db.list('order_line', { where: { order_id: id } }); for (const l of lines) { const p = ctx.db.get('product', l.product_id); ctx.db.update('product', l.product_id, { stock_on_hand: p.stock_on_hand + l.quantity }); } } const updated = ctx.db.update('bakery_order', id, { status: 'cancelled' }); return { status: 200, body: updated }; }"
  complete_batch:
    method: POST
    path: /batches/{id}/complete
    description: Finish a planned batch. Consumes quantity times qty_per_unit of each recipe ingredient (409 insufficient_ingredients if short), adds quantity to product stock_on_hand, sets completed_at and refreshes low_stock on the touched ingredients. A product with no recipe cannot be batched (422 no_recipe).
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const batch = ctx.db.get('production_batch', id); if (batch === null) ctx.fail(404, 'not_found', 'batch ' + id + ' not found'); if (batch.status !== 'planned') ctx.fail(409, 'invalid_state', 'batch ' + id + ' is ' + batch.status + '. Only planned batches can be completed.'); const lines = ctx.db.list('recipe_line', { where: { product_id: batch.product_id } }); if (lines.length === 0) ctx.fail(422, 'no_recipe', 'product ' + batch.product_id + ' has no recipe lines. Add them with POST /products/' + batch.product_id + '/recipe.'); const r6 = (x) => Math.round(x * 1000000) / 1000000; const need = {}; for (const l of lines) need[l.ingredient_id] = r6((need[l.ingredient_id] || 0) + batch.quantity * l.qty_per_unit); const iids = Object.keys(need); for (const iid of iids) { const ing = ctx.db.get('ingredient', iid); if (ing.stock_qty + 0.000000001 < need[iid]) ctx.fail(409, 'insufficient_ingredients', 'insufficient ' + ing.name + ' (' + ing.id + '): need ' + need[iid] + ' ' + ing.unit + ', have ' + ing.stock_qty + '. Restock it with POST /ingredients/' + ing.id + '/restock.'); } for (const iid of iids) { const ing = ctx.db.get('ingredient', iid); const left = r6(Math.max(0, ing.stock_qty - need[iid])); ctx.db.update('ingredient', iid, { stock_qty: left, low_stock: left <= ing.reorder_level }); } const product = ctx.db.get('product', batch.product_id); ctx.db.update('product', product.id, { stock_on_hand: product.stock_on_hand + batch.quantity }); const updated = ctx.db.update('production_batch', id, { status: 'completed', completed_at: ctx.now() }); return { status: 200, body: updated }; }"
  cancel_batch:
    method: POST
    path: /batches/{id}/cancel
    description: Cancel a planned batch. No stock changes.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const batch = ctx.db.get('production_batch', id); if (batch === null) ctx.fail(404, 'not_found', 'batch ' + id + ' not found'); if (batch.status !== 'planned') ctx.fail(409, 'invalid_state', 'batch ' + id + ' is ' + batch.status + '. Only planned batches can be cancelled.'); const updated = ctx.db.update('production_batch', id, { status: 'cancelled' }); return { status: 200, body: updated }; }"
  restock_ingredient:
    method: POST
    path: /ingredients/{id}/restock
    description: Add a delivered quantity (greater than 0, in the ingredient's unit) to stock_qty and recompute low_stock.
    input:
      quantity:
        type: number
        description: Delivered quantity in the ingredient's unit. Must be greater than 0.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const id = ctx.params.id; const ing = ctx.db.get('ingredient', id); if (ing === null) ctx.fail(404, 'not_found', 'ingredient ' + id + ' not found'); const q = ctx.body.quantity; if (typeof q !== 'number' || !(q > 0)) ctx.fail(422, 'invalid_quantity', 'quantity must be greater than 0'); const stock = Math.round((ing.stock_qty + q) * 1000000) / 1000000; const updated = ctx.db.update('ingredient', id, { stock_qty: stock, low_stock: stock <= ing.reorder_level }); return { status: 200, body: updated }; }"
jobs:
  expire_uncollected_orders:
    description: Every hour. A ready order whose ready_at is more than 24 hours old is cancelled and its reserved stock goes back to product.stock_on_hand.
    every: 1h
    run: "(ctx) => { const now = ctx.now(); for (const o of ctx.db.list('bakery_order', { where: { status: 'ready' } })) { if (o.ready_at === null || o.ready_at === undefined) continue; if (ctx.time.minutesBetween(o.ready_at, now) <= 24 * 60) continue; for (const l of ctx.db.list('order_line', { where: { order_id: o.id } })) { const p = ctx.db.get('product', l.product_id); ctx.db.update('product', l.product_id, { stock_on_hand: p.stock_on_hand + l.quantity }); } ctx.db.update('bakery_order', o.id, { status: 'cancelled' }); } }"
  flag_low_stock:
    description: Every hour. Recompute ingredient.low_stock as stock_qty <= reorder_level for every ingredient.
    every: 1h
    run: "(ctx) => { for (const i of ctx.db.list('ingredient')) { const low = i.stock_qty <= i.reorder_level; if (i.low_stock !== low) ctx.db.update('ingredient', i.id, { low_stock: low }); } }"
