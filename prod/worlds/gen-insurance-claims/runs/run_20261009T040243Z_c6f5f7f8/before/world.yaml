actions:
  file_claim:
    method: POST
    path: /policies/{id}/claims
    description: File a claim against a coverage of an active policy.
    input:
      coverage_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: coverage
        onDelete: restrict
      incident_date:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      claimed_amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
    handler: |-
      (ctx) => {
        const pid = ctx.params.id;
        const p = ctx.db.get('policy', pid);
        if (p === null) ctx.fail(404, 'not_found', 'policy ' + pid + ' not found');
        if (p.status !== 'active') ctx.fail(409, 'policy_not_active', 'policy ' + pid + ' is ' + p.status + '. Only active policies accept claims.');
        const cov = ctx.db.get('coverage', ctx.body.coverage_id);
        if (cov === null || cov.policy_id !== pid) ctx.fail(422, 'coverage_mismatch', 'coverage ' + ctx.body.coverage_id + ' does not belong to policy ' + pid);
        const inc = ctx.body.incident_date;
        if (ctx.time.minutesBetween(p.start_date, inc) < 0 || ctx.time.minutesBetween(inc, p.end_date) < 0) ctx.fail(422, 'incident_outside_policy_period', 'incident_date must fall within the policy period');
        const now = ctx.now();
        if (ctx.time.minutesBetween(now, inc) > 0) ctx.fail(422, 'incident_in_future', 'incident_date cannot be after ' + now);
        const desc = ctx.body.description === undefined ? null : ctx.body.description;
        const claim = ctx.db.create('claim', { policy_id: pid, coverage_id: cov.id, adjuster_id: null, incident_date: inc, description: desc, claimed_amount: ctx.body.claimed_amount, approved_amount: null, deductible_applied: null, denial_reason: null, submitted_at: now });
        ctx.db.create('claim_event', { claim_id: claim.id, kind: 'submitted', note: null, actor_id: null });
        return { status: 201, body: claim };
      }
  start_review:
    method: POST
    path: /claims/{id}/review
    description: Assign an active adjuster and move a submitted claim to under_review.
    input:
      adjuster_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: adjuster
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('claim', id);
        if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found');
        if (c.status !== 'submitted') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only submitted claims can be reviewed.');
        const a = ctx.db.get('adjuster', ctx.body.adjuster_id);
        if (a === null) ctx.fail(422, 'unknown_adjuster', 'adjuster not found');
        if (!a.active) ctx.fail(409, 'adjuster_inactive', 'adjuster ' + a.id + ' is inactive. Pick an active adjuster.');
        const u = ctx.db.update('claim', id, { adjuster_id: a.id, status: 'under_review' });
        ctx.db.create('claim_event', { claim_id: id, kind: 'review_started', note: null, actor_id: a.id });
        return { status: 200, body: u };
      }
  approve_claim:
    method: POST
    path: /claims/{id}/approve
    description: Approve a claim in review, applying the deductible and the remaining limit, and reserve the money.
    input:
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('claim', id);
        if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found');
        if (c.status !== 'under_review') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only under_review claims can be approved.');
        const open = ctx.db.list('fraud_flag', { where: { claim_id: id, status: 'open' } });
        if (open.length > 0) ctx.fail(409, 'fraud_hold', 'claim ' + id + ' has an open fraud flag. Resolve it first.');
        const cov = ctx.db.get('coverage', c.coverage_id);
        const ded = Math.min(cov.deductible, c.claimed_amount);
        const remaining = cov.limit_amount - cov.paid_amount - cov.reserved_amount;
        const payable = Math.min(c.claimed_amount - ded, remaining);
        if (payable <= 0) ctx.fail(409, 'nothing_payable', 'nothing is payable for claim ' + id + ' after the deductible and remaining limit.');
        const now = ctx.now();
        const u = ctx.db.update('claim', id, { approved_amount: payable, deductible_applied: ded, approved_at: now, status: 'approved' });
        ctx.db.update('coverage', cov.id, { reserved_amount: cov.reserved_amount + payable });
        const note = ctx.body.note === undefined ? null : ctx.body.note;
        ctx.db.create('claim_event', { claim_id: id, kind: 'approved', note, actor_id: c.adjuster_id });
        return { status: 200, body: u };
      }
  deny_claim:
    method: POST
    path: /claims/{id}/deny
    description: Deny a submitted or under-review claim with a reason.
    input:
      reason:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('claim', id);
        if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found');
        if (c.status !== 'submitted' && c.status !== 'under_review') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only submitted and under_review claims can be denied.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for deny_claim: reason expected a non-blank text, found ""');
        const u = ctx.db.update('claim', id, { status: 'denied', denial_reason: ctx.body.reason });
        ctx.db.create('claim_event', { claim_id: id, kind: 'denied', note: ctx.body.reason, actor_id: c.adjuster_id });
        return { status: 200, body: u };
      }
  pay_claim:
    method: POST
    path: /claims/{id}/pay
    description: Pay out an approved claim and record the payment.
    input:
      method:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - bank_transfer
          - check
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('claim', id);
        if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found');
        if (c.status !== 'approved') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only approved claims can be paid.');
        const open = ctx.db.list('fraud_flag', { where: { claim_id: id, status: 'open' } });
        if (open.length > 0) ctx.fail(409, 'fraud_hold', 'claim ' + id + ' has an open fraud flag. Resolve it first.');
        const policy = ctx.db.get('policy', c.policy_id);
        const cov = ctx.db.get('coverage', c.coverage_id);
        const now = ctx.now();
        ctx.db.create('payment', { claim_id: id, policyholder_id: policy.policyholder_id, amount: c.approved_amount, method: ctx.body.method, paid_at: now });
        ctx.db.update('coverage', cov.id, { reserved_amount: cov.reserved_amount - c.approved_amount, paid_amount: cov.paid_amount + c.approved_amount });
        const u = ctx.db.update('claim', id, { status: 'paid', paid_at: now });
        ctx.db.create('claim_event', { claim_id: id, kind: 'paid', note: 'paid by ' + ctx.body.method, actor_id: c.adjuster_id });
        return { status: 200, body: u };
      }
  close_claim:
    method: POST
    path: /claims/{id}/close
    description: Close a paid or denied claim.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('claim', id);
        if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found');
        if (c.status !== 'paid' && c.status !== 'denied') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Only paid and denied claims can be closed.');
        const u = ctx.db.update('claim', id, { status: 'closed', closed_at: ctx.now() });
        ctx.db.create('claim_event', { claim_id: id, kind: 'closed', note: null, actor_id: c.adjuster_id });
        return { status: 200, body: u };
      }
  raise_fraud_flag:
    method: POST
    path: /claims/{id}/fraud_flags
    description: Raise a fraud flag on a submitted, under_review or approved claim.
    input:
      severity:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - low
          - medium
          - high
      reason:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
      raised_by_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: adjuster
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('claim', id);
        if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found');
        if (c.status !== 'submitted' && c.status !== 'under_review' && c.status !== 'approved') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is ' + c.status + '. Flags can be raised on submitted, under_review and approved claims.');
        if (ctx.body.reason.trim() === '') ctx.fail(400, 'input.invalid', 'Invalid input for raise_fraud_flag: reason expected a non-blank text, found ""');
        const by = ctx.body.raised_by_id === undefined ? null : ctx.body.raised_by_id;
        const f = ctx.db.create('fraud_flag', { claim_id: id, raised_by_id: by, severity: ctx.body.severity, reason: ctx.body.reason, resolution_note: null, resolved_at: null });
        ctx.db.create('claim_event', { claim_id: id, kind: 'fraud_flagged', note: ctx.body.reason, actor_id: by });
        return { status: 201, body: f };
      }
  resolve_fraud_flag:
    method: POST
    path: /fraud_flags/{id}/resolve
    description: Clear or confirm an open fraud flag. Confirming denies the claim.
    input:
      outcome:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - cleared
          - confirmed
      note:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const f = ctx.db.get('fraud_flag', id);
        if (f === null) ctx.fail(404, 'not_found', 'fraud flag ' + id + ' not found');
        if (f.status !== 'open') ctx.fail(409, 'already_resolved', 'fraud flag ' + id + ' is already ' + f.status);
        const note = ctx.body.note.trim();
        if (note === '') ctx.fail(400, 'input.invalid', 'Invalid input for resolve_fraud_flag: note expected a non-blank text, found ""');
        const now = ctx.now();
        const u = ctx.db.update('fraud_flag', id, { status: ctx.body.outcome, resolution_note: ctx.body.note, resolved_at: now });
        const c = ctx.db.get('claim', f.claim_id);
        if (ctx.body.outcome === 'cleared') {
          ctx.db.create('claim_event', { claim_id: c.id, kind: 'fraud_cleared', note: ctx.body.note, actor_id: null });
          return { status: 200, body: u };
        }
        ctx.db.create('claim_event', { claim_id: c.id, kind: 'fraud_confirmed', note: ctx.body.note, actor_id: null });
        if (c.status === 'submitted' || c.status === 'under_review' || c.status === 'approved') {
          if (c.status === 'approved') {
            const cov = ctx.db.get('coverage', c.coverage_id);
            ctx.db.update('coverage', cov.id, { reserved_amount: cov.reserved_amount - c.approved_amount });
          }
          const reason = 'fraud confirmed: ' + ctx.body.note;
          ctx.db.update('claim', c.id, { status: 'denied', denial_reason: reason });
          ctx.db.create('claim_event', { claim_id: c.id, kind: 'denied', note: reason, actor_id: null });
        }
        return { status: 200, body: u };
      }
  suspend_policy:
    method: POST
    path: /policies/{id}/suspend
    description: Suspend an active policy.
    input:
      reason:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const p = ctx.db.get('policy', id);
        if (p === null) ctx.fail(404, 'not_found', 'policy ' + id + ' not found');
        if (p.status !== 'active') ctx.fail(409, 'invalid_state', 'policy ' + id + ' is ' + p.status + '. Only active policies can be suspended.');
        if (ctx.body.reason.trim() === '') ctx.fail(400, 'input.invalid', 'Invalid input for suspend_policy: reason expected a non-blank text, found ""');
        return { status: 200, body: ctx.db.update('policy', id, { status: 'suspended' }) };
      }
  reinstate_policy:
    method: POST
    path: /policies/{id}/reinstate
    description: Reinstate a suspended policy.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const p = ctx.db.get('policy', id);
        if (p === null) ctx.fail(404, 'not_found', 'policy ' + id + ' not found');
        if (p.status !== 'suspended') ctx.fail(409, 'invalid_state', 'policy ' + id + ' is ' + p.status + '. Only suspended policies can be reinstated.');
        return { status: 200, body: ctx.db.update('policy', id, { status: 'active' }) };
      }
jobs:
  expire_policies:
    description: Daily. Active or suspended policies whose end_date has passed become expired.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const st of ['active', 'suspended']) {
          for (const p of ctx.db.list('policy', { where: { status: st } })) {
            if (ctx.time.minutesBetween(p.end_date, now) >= 0) ctx.db.update('policy', p.id, { status: 'expired' });
          }
        }
      }
  auto_close_paid:
    description: Daily. Claims paid at least 30 days ago are closed.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const c of ctx.db.list('claim', { where: { status: 'paid' } })) {
          if (c.paid_at === null || ctx.time.minutesBetween(c.paid_at, now) < 30 * 24 * 60) continue;
          ctx.db.update('claim', c.id, { status: 'closed', closed_at: now });
          ctx.db.create('claim_event', { claim_id: c.id, kind: 'closed', note: 'auto: 30 days after payout', actor_id: null });
        }
      }
