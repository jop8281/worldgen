  fraud_flag: "(ctx) => { const rows=ctx.rows('claim');const rest=rows.slice(17);const out=[];const mk=(c,sev,reason,st,note)=>{const base=c.approved_at!==null?ctx.time.plus(c.approved_at,'1d'):ctx.time.plus(c.submitted_at,'1d');const resolved=st==='open'?null:ctx.time.plus(base,'2d');out.push({claim_id:c.id,raised_by_id:c.adjuster_id,severity:sev,reason,status:st,resolution_note:st==='open'?null:note,resolved_at:resolved,created_at:base,updated_at:resolved||base});};mk(rows[2],'high','Repair invoice is dated before the reported incident','open');mk(rows[3],'medium','Photos match a different claim','open');mk(rows[6],'high','Water damage photos show prior staining','open');mk(rows[9],'medium','Plumber invoice cannot be verified','open');mk(rows[12],'high','Same loss reported with another insurer','open');const appr=rest.filter((c)=>c.status==='approved');mk(appr[0],'medium','Claimed amount exceeds the repair estimate','open');mk(rows[8],'low','Late report of the loss','cleared','Adjuster verified the loss with the plumber');mk(rows[16],'medium','Contractor not licensed','cleared','Licence verified with the state board');mk(rest.filter((c)=>c.status==='under_review')[0],'low','Inconsistent statement','cleared','Statement clarified in a follow-up call');mk(rest.filter((c)=>c.status==='paid')[0],'low','Repeat claimant','cleared','Prior claims reviewed, no pattern found');mk(appr[1],'medium','Photos taken before the incident date','cleared','Photo metadata confirmed correct');const den=rest.filter((c)=>c.status==='denied'&&c.denial_reason!==null&&c.denial_reason.startsWith('fraud confirmed: '));for(let k=0;k<3;k++)mk(den[k],'high','Evidence of fabricated documents','confirmed',den[k].denial_reason.slice(17));return out; }"
  claim_event: (ctx) => { const out=[];let n=0;const ev=(c,kind,at,note,actor)=>{out.push({at,n:n++,row:{claim_id:c,kind,note,actor_id:actor,created_at:at,updated_at:at}});};const claims=ctx.rows('claim');for(const c of claims){ev(c.id,'submitted',c.submitted_at,null,null);if(c.adjuster_id!==null)ev(c.id,'review_started',ctx.time.plus(c.submitted_at,'1d'),null,c.adjuster_id);if(c.approved_at!==null)ev(c.id,'approved',c.approved_at,null,c.adjuster_id);if(c.denial_reason!==null)ev(c.id,'denied',ctx.time.plus(c.submitted_at,'3d'),c.denial_reason,c.adjuster_id);if(c.paid_at!==null)ev(c.id,'paid',c.paid_at,'paid out',c.adjuster_id);if(c.closed_at!==null)ev(c.id,'closed',c.closed_at,null,c.adjuster_id);}let flags=[];try{flags=ctx.rows('fraud_flag');}catch(e){flags=[];}for(const f of flags){ev(f.claim_id,'fraud_flagged',f.created_at,f.reason,f.raised_by_id);if(f.status==='cleared')ev(f.claim_id,'fraud_cleared',f.resolved_at,f.resolution_note,null);if(f.status==='confirmed')ev(f.claim_id,'fraud_confirmed',f.resolved_at,f.resolution_note,null);}out.sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:a.n-b.n);return out.map((o)=>o.row); }
tests:
  file_claim_validates_and_creates:
    description: file_claim returns 201 with a submitted claim and a submitted event. It refuses an incident before the policy period, a future incident, a coverage from another policy, a zero amount and an unknown policy, and creates no claim for refused calls.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const setup = (tag, limit, ded) => { const h = post('/policyholders', { name: 'Test ' + tag, email: tag + '@acceptance.test', city: 'Austin' }).body; const p = post('/policies', { policy_number: 'ACC-' + tag, policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const c = post('/coverages', { policy_id: p.id, kind: 'collision', limit_amount: limit, deductible: ded }).body; ctx.assert(h && h.id && p && p.id && c && c.id, 'setup failed for ' + tag); return { h, p, c }; }; const s = setup('fc1', 1000000, 50000); const other = setup('fc2', 500000, 10000); const r = post('/policies/' + s.p.id + '/claims', { coverage_id: s.c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Rear-ended at a junction', claimed_amount: 300000 }); ctx.assert(r.status === 201, 'file_claim returned ' + r.status + ' ' + JSON.stringify(r.body)); ctx.assert(r.body.status === 'submitted' && r.body.policy_id === s.p.id && r.body.coverage_id === s.c.id && r.body.claimed_amount === 300000, 'claim fields: ' + JSON.stringify(r.body)); ctx.assert(r.body.submitted_at === ctx.now() && r.body.adjuster_id === null && r.body.approved_amount === null, 'submitted_at is now, no adjuster, no approved amount: ' + JSON.stringify(r.body)); const ev = get('/claims/' + r.body.id + '/events').body.data; ctx.assert(ev.length === 1 && ev[0].kind === 'submitted', 'one submitted event, got ' + JSON.stringify(ev)); const path = '/policies/' + s.p.id + '/claims'; const body = (o) => ({ coverage_id: s.c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Hail damage', claimed_amount: 100000, ...o }); const early = post(path, body({ incident_date: '2025-06-01T00:00:00.000Z' })); ctx.assert(early.status === 422 && early.body.error.code === 'incident_outside_policy_period', 'early incident: ' + JSON.stringify(early)); const future = post(path, body({ incident_date: '2026-12-01T00:00:00.000Z' })); ctx.assert(future.status === 422 && future.body.error.code === 'incident_in_future', 'future incident: ' + JSON.stringify(future)); const mismatch = post(path, body({ coverage_id: other.c.id })); ctx.assert(mismatch.status === 422 && mismatch.body.error.code === 'coverage_mismatch', 'foreign coverage: ' + JSON.stringify(mismatch)); const zero = post(path, body({ claimed_amount: 0 })); ctx.assert(zero.status === 400 && zero.body.error.code === 'input.invalid', 'zero amount: ' + JSON.stringify(zero)); const missing = post('/policies/pol_9999/claims', body({})); ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'unknown policy: ' + JSON.stringify(missing)); const mine = get('/claims?policy_id=' + s.p.id).body.data; ctx.assert(mine.length === 1, 'refused filings created no claim, got ' + mine.length); }"
  start_review_assigns_adjuster:
    description: start_review moves a submitted claim to under_review with the adjuster. A second review gives 409 invalid_state, an inactive adjuster gives 409 adjuster_inactive and leaves the claim submitted, and an unknown claim gives 404.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const setup = (tag, limit, ded) => { const h = post('/policyholders', { name: 'Test ' + tag, email: tag + '@acceptance.test', city: 'Austin' }).body; const p = post('/policies', { policy_number: 'ACC-' + tag, policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const c = post('/coverages', { policy_id: p.id, kind: 'collision', limit_amount: limit, deductible: ded }).body; ctx.assert(h && h.id && p && p.id && c && c.id, 'setup failed for ' + tag); return { h, p, c }; }; const adjuster = (tag, active) => post('/adjusters', { name: 'Adjuster ' + tag, email: 'adj.' + tag + '@acceptance.test', specialty: 'auto', active }).body; const file = (s, amt) => post('/policies/' + s.p.id + '/claims', { coverage_id: s.c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Rear-ended at a junction', claimed_amount: amt }); const s = setup('rv1', 1000000, 50000); const a = adjuster('rv1', true); const idle = adjuster('rv2', false); ctx.assert(a.id && idle.id, 'adjusters created'); const c = file(s, 300000).body; const r = post('/claims/' + c.id + '/review', { adjuster_id: a.id }); ctx.assert(r.status === 200, 'review returned ' + r.status + ' ' + JSON.stringify(r.body)); ctx.assert(r.body.status === 'under_review' && r.body.adjuster_id === a.id, 'under_review with adjuster, got ' + JSON.stringify(r.body)); const again = post('/claims/' + c.id + '/review', { adjuster_id: a.id }); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second review: ' + JSON.stringify(again)); const c2 = file(s, 100000).body; const bad = post('/claims/' + c2.id + '/review', { adjuster_id: idle.id }); ctx.assert(bad.status === 409 && bad.body.error.code === 'adjuster_inactive', 'inactive adjuster: ' + JSON.stringify(bad)); ctx.assert(get('/claims/' + c2.id).body.status === 'submitted' && get('/claims/' + c2.id).body.adjuster_id === null, 'refused review changed nothing'); const missing = post('/claims/clm_9999/review', { adjuster_id: a.id }); ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'unknown claim: ' + JSON.stringify(missing)); const kinds = get('/claims/' + c.id + '/events').body.data.map((e) => e.kind); ctx.assert(kinds.includes('review_started'), 'review_started event, got ' + JSON.stringify(kinds)); }"
  approve_applies_deductible_and_reserves:
    description: Claimed 300000 with a 50000 deductible approves 250000, sets deductible_applied and approved_at, and raises coverage.reserved_amount to 250000. Approving a claim that is not under review gives 409 invalid_state.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const setup = (tag, limit, ded) => { const h = post('/policyholders', { name: 'Test ' + tag, email: tag + '@acceptance.test', city: 'Austin' }).body; const p = post('/policies', { policy_number: 'ACC-' + tag, policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const c = post('/coverages', { policy_id: p.id, kind: 'collision', limit_amount: limit, deductible: ded }).body; ctx.assert(h && h.id && p && p.id && c && c.id, 'setup failed for ' + tag); return { h, p, c }; }; const adjuster = (tag, active) => post('/adjusters', { name: 'Adjuster ' + tag, email: 'adj.' + tag + '@acceptance.test', specialty: 'auto', active }).body; const file = (s, amt) => post('/policies/' + s.p.id + '/claims', { coverage_id: s.c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Rear-ended at a junction', claimed_amount: amt }); const s = setup('ap1', 1000000, 50000); const a = adjuster('ap1', true); const c = file(s, 300000).body; const early = post('/claims/' + c.id + '/approve', {}); ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'approve while submitted: ' + JSON.stringify(early)); ctx.assert(post('/claims/' + c.id + '/review', { adjuster_id: a.id }).status === 200, 'review'); const r = post('/claims/' + c.id + '/approve', {}); ctx.assert(r.status === 200, 'approve returned ' + r.status + ' ' + JSON.stringify(r.body)); ctx.assert(r.body.status === 'approved' && r.body.approved_amount === 250000 && r.body.deductible_applied === 50000, 'approved 250000 after 50000 deductible, got ' + JSON.stringify(r.body)); ctx.assert(r.body.approved_at === ctx.now(), 'approved_at is now'); const cov = get('/coverages/' + s.c.id).body; ctx.assert(cov.reserved_amount === 250000 && cov.paid_amount === 0, 'reserved 250000, paid 0, got ' + JSON.stringify(cov)); const again = post('/claims/' + c.id + '/approve', {}); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second approve: ' + JSON.stringify(again)); const kinds = get('/claims/' + c.id + '/events').body.data.map((e) => e.kind); ctx.assert(kinds.includes('approved'), 'approved event, got ' + JSON.stringify(kinds)); }"
  approve_caps_at_remaining_limit:
    description: With limit 100000 and deductible 20000, a 90000 claim approves 70000, a second 90000 claim approves only the remaining 30000, and a third gets 409 nothing_payable and stays under_review.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const setup = (tag, limit, ded) => { const h = post('/policyholders', { name: 'Test ' + tag, email: tag + '@acceptance.test', city: 'Austin' }).body; const p = post('/policies', { policy_number: 'ACC-' + tag, policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const c = post('/coverages', { policy_id: p.id, kind: 'collision', limit_amount: limit, deductible: ded }).body; ctx.assert(h && h.id && p && p.id && c && c.id, 'setup failed for ' + tag); return { h, p, c }; }; const adjuster = (tag, active) => post('/adjusters', { name: 'Adjuster ' + tag, email: 'adj.' + tag + '@acceptance.test', specialty: 'auto', active }).body; const file = (s, amt) => post('/policies/' + s.p.id + '/claims', { coverage_id: s.c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Rear-ended at a junction', claimed_amount: amt }); const s = setup('cap1', 100000, 20000); const a = adjuster('cap1', true); const mk = (amt) => { const c = file(s, amt).body; ctx.assert(post('/claims/' + c.id + '/review', { adjuster_id: a.id }).status === 200, 'review ' + c.id); return c; }; const c1 = mk(90000); const c2 = mk(90000); const c3 = mk(50000); const r1 = post('/claims/' + c1.id + '/approve', {}); ctx.assert(r1.status === 200 && r1.body.approved_amount === 70000, 'first approves 70000, got ' + JSON.stringify(r1)); const r2 = post('/claims/' + c2.id + '/approve', {}); ctx.assert(r2.status === 200 && r2.body.approved_amount === 30000 && r2.body.deductible_applied === 20000, 'second capped at remaining 30000, got ' + JSON.stringify(r2)); ctx.assert(get('/coverages/' + s.c.id).body.reserved_amount === 100000, 'reserved equals the limit'); const r3 = post('/claims/' + c3.id + '/approve', {}); ctx.assert(r3.status === 409 && r3.body.error.code === 'nothing_payable', 'exhausted limit: ' + JSON.stringify(r3)); ctx.assert(get('/claims/' + c3.id).body.status === 'under_review', 'third claim stays under_review'); ctx.assert(get('/coverages/' + s.c.id).body.reserved_amount === 100000, 'refused approval reserved nothing'); }"
  pay_claim_records_payment:
    description: pay_claim sets status paid and paid_at, creates one payment of 250000, moves coverage reserved_amount to paid_amount, and refuses a second payment, an unapproved claim and an unknown method.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const setup = (tag, limit, ded) => { const h = post('/policyholders', { name: 'Test ' + tag, email: tag + '@acceptance.test', city: 'Austin' }).body; const p = post('/policies', { policy_number: 'ACC-' + tag, policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const c = post('/coverages', { policy_id: p.id, kind: 'collision', limit_amount: limit, deductible: ded }).body; ctx.assert(h && h.id && p && p.id && c && c.id, 'setup failed for ' + tag); return { h, p, c }; }; const adjuster = (tag, active) => post('/adjusters', { name: 'Adjuster ' + tag, email: 'adj.' + tag + '@acceptance.test', specialty: 'auto', active }).body; const file = (s, amt) => post('/policies/' + s.p.id + '/claims', { coverage_id: s.c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Rear-ended at a junction', claimed_amount: amt }); const s = setup('pay1', 1000000, 50000); const a = adjuster('pay1', true); const c = file(s, 300000).body; const unapproved = post('/claims/' + c.id + '/pay', { method: 'bank_transfer' }); ctx.assert(unapproved.status === 409 && unapproved.body.error.code === 'invalid_state', 'pay while submitted: ' + JSON.stringify(unapproved)); ctx.assert(post('/claims/' + c.id + '/review', { adjuster_id: a.id }).status === 200, 'review'); ctx.assert(post('/claims/' + c.id + '/approve', {}).status === 200, 'approve'); const badMethod = post('/claims/' + c.id + '/pay', { method: 'cash' }); ctx.assert(badMethod.status === 400 && badMethod.body.error.code === 'input.invalid', 'unknown method: ' + JSON.stringify(badMethod)); ctx.assert(get('/claims/' + c.id).body.status === 'approved', 'refused payment left the claim approved'); const r = post('/claims/' + c.id + '/pay', { method: 'bank_transfer' }); ctx.assert(r.status === 200, 'pay returned ' + r.status + ' ' + JSON.stringify(r.body)); ctx.assert(r.body.status === 'paid' && r.body.paid_at === ctx.now(), 'paid at now, got ' + JSON.stringify(r.body)); const pays = get('/payments?claim_id=' + c.id).body.data; ctx.assert(pays.length === 1 && pays[0].amount === 250000 && pays[0].method === 'bank_transfer' && pays[0].policyholder_id === s.h.id, 'one payment of 250000 to the policyholder, got ' + JSON.stringify(pays)); const cov = get('/coverages/' + s.c.id).body; ctx.assert(cov.reserved_amount === 0 && cov.paid_amount === 250000, 'reserve moved to paid, got ' + JSON.stringify(cov)); const twice = post('/claims/' + c.id + '/pay', { method: 'check' }); ctx.assert(twice.status === 409 && twice.body.error.code === 'invalid_state', 'second payment: ' + JSON.stringify(twice)); ctx.assert(get('/payments?claim_id=' + c.id).body.data.length === 1, 'still one payment'); }"
  fraud_flag_blocks_then_confirms:
    description: An open flag gives 409 fraud_hold on approve. After clearing, approve works. A second flag blocks pay. Confirming it denies the claim with a 'fraud confirmed' reason and releases the coverage reserve. Resolving again gives 409 already_resolved, and a flag on a denied claim gives 409 invalid_state.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const setup = (tag, limit, ded) => { const h = post('/policyholders', { name: 'Test ' + tag, email: tag + '@acceptance.test', city: 'Austin' }).body; const p = post('/policies', { policy_number: 'ACC-' + tag, policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const c = post('/coverages', { policy_id: p.id, kind: 'collision', limit_amount: limit, deductible: ded }).body; ctx.assert(h && h.id && p && p.id && c && c.id, 'setup failed for ' + tag); return { h, p, c }; }; const adjuster = (tag, active) => post('/adjusters', { name: 'Adjuster ' + tag, email: 'adj.' + tag + '@acceptance.test', specialty: 'auto', active }).body; const file = (s, amt) => post('/policies/' + s.p.id + '/claims', { coverage_id: s.c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Rear-ended at a junction', claimed_amount: amt }); const s = setup('fr1', 1000000, 50000); const a = adjuster('fr1', true); const c = file(s, 300000).body; ctx.assert(post('/claims/' + c.id + '/review', { adjuster_id: a.id }).status === 200, 'review'); const f1 = post('/claims/' + c.id + '/fraud_flags', { severity: 'high', reason: 'Invoice date predates the incident', raised_by_id: a.id }); ctx.assert(f1.status === 201 && f1.body.status === 'open' && f1.body.claim_id === c.id && f1.body.severity === 'high', 'flag raised open: ' + JSON.stringify(f1)); const blocked = post('/claims/' + c.id + '/approve', {}); ctx.assert(blocked.status === 409 && blocked.body.error.code === 'fraud_hold', 'approve with open flag: ' + JSON.stringify(blocked)); ctx.assert(get('/fraud_flags?claim_id=' + c.id + '&status=open').body.data.length === 1, 'one open flag listed'); const cleared = post('/fraud_flags/' + f1.body.id + '/resolve', { outcome: 'cleared', note: 'Invoice verified with the repair shop' }); ctx.assert(cleared.status === 200 && cleared.body.status === 'cleared' && cleared.body.resolved_at === ctx.now() && cleared.body.resolution_note === 'Invoice verified with the repair shop', 'cleared: ' + JSON.stringify(cleared)); const approved = post('/claims/' + c.id + '/approve', {}); ctx.assert(approved.status === 200 && approved.body.status === 'approved', 'approve after clearing: ' + JSON.stringify(approved)); ctx.assert(get('/coverages/' + s.c.id).body.reserved_amount === 250000, 'reserved after approval'); const f2 = post('/claims/' + c.id + '/fraud_flags', { severity: 'medium', reason: 'Duplicate photos across two claims' }); ctx.assert(f2.status === 201 && f2.body.status === 'open', 'second flag on approved claim: ' + JSON.stringify(f2)); const noPay = post('/claims/' + c.id + '/pay', { method: 'check' }); ctx.assert(noPay.status === 409 && noPay.body.error.code === 'fraud_hold', 'pay with open flag: ' + JSON.stringify(noPay)); const conf = post('/fraud_flags/' + f2.body.id + '/resolve', { outcome: 'confirmed', note: 'forged photos' }); ctx.assert(conf.status === 200 && conf.body.status === 'confirmed', 'confirmed: ' + JSON.stringify(conf)); const after = get('/claims/' + c.id).body; ctx.assert(after.status === 'denied' && typeof after.denial_reason === 'string' && after.denial_reason.startsWith('fraud confirmed: '), 'claim denied for fraud, got ' + JSON.stringify(after)); const cov = get('/coverages/' + s.c.id).body; ctx.assert(cov.reserved_amount === 0 && cov.paid_amount === 0, 'reserve released, got ' + JSON.stringify(cov)); const twice = post('/fraud_flags/' + f2.body.id + '/resolve', { outcome: 'cleared', note: 'changed my mind' }); ctx.assert(twice.status === 409 && twice.body.error.code === 'already_resolved', 'resolve twice: ' + JSON.stringify(twice)); const late = post('/claims/' + c.id + '/fraud_flags', { severity: 'low', reason: 'Late concern' }); ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'flag on denied claim: ' + JSON.stringify(late)); const kinds = get('/claims/' + c.id + '/events').body.data.map((e) => e.kind); ctx.assert(kinds.includes('fraud_flagged') && kinds.includes('fraud_cleared') && kinds.includes('fraud_confirmed'), 'fraud events, got ' + JSON.stringify(kinds)); }"
  deny_and_close_claim:
    description: deny_claim refuses a blank reason and stores a real one. close_claim closes a denied claim and a paid claim, refuses a submitted claim, and a closed claim can be neither closed nor denied again.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const setup = (tag, limit, ded) => { const h = post('/policyholders', { name: 'Test ' + tag, email: tag + '@acceptance.test', city: 'Austin' }).body; const p = post('/policies', { policy_number: 'ACC-' + tag, policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const c = post('/coverages', { policy_id: p.id, kind: 'collision', limit_amount: limit, deductible: ded }).body; ctx.assert(h && h.id && p && p.id && c && c.id, 'setup failed for ' + tag); return { h, p, c }; }; const adjuster = (tag, active) => post('/adjusters', { name: 'Adjuster ' + tag, email: 'adj.' + tag + '@acceptance.test', specialty: 'auto', active }).body; const file = (s, amt) => post('/policies/' + s.p.id + '/claims', { coverage_id: s.c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Rear-ended at a junction', claimed_amount: amt }); const s = setup('dc1', 1000000, 50000); const a = adjuster('dc1', true); const c1 = file(s, 200000).body; const blank = post('/claims/' + c1.id + '/deny', { reason: '   ' }); ctx.assert(blank.status === 400 && blank.body.error.code === 'input.invalid', 'blank reason: ' + JSON.stringify(blank)); const d = post('/claims/' + c1.id + '/deny', { reason: 'Loss not covered: pre-existing damage' }); ctx.assert(d.status === 200 && d.body.status === 'denied' && d.body.denial_reason === 'Loss not covered: pre-existing damage', 'denied with reason: ' + JSON.stringify(d)); const closed1 = post('/claims/' + c1.id + '/close', {}); ctx.assert(closed1.status === 200 && closed1.body.status === 'closed' && closed1.body.closed_at === ctx.now(), 'close denied claim: ' + JSON.stringify(closed1)); const again = post('/claims/' + c1.id + '/close', {}); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'close twice: ' + JSON.stringify(again)); const redo = post('/claims/' + c1.id + '/deny', { reason: 'again' }); ctx.assert(redo.status === 409 && redo.body.error.code === 'invalid_state', 'deny closed claim: ' + JSON.stringify(redo)); const c2 = file(s, 100000).body; const early = post('/claims/' + c2.id + '/close', {}); ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'close submitted claim: ' + JSON.stringify(early)); ctx.assert(post('/claims/' + c2.id + '/review', { adjuster_id: a.id }).status === 200, 'review'); ctx.assert(post('/claims/' + c2.id + '/approve', {}).status === 200, 'approve'); ctx.assert(post('/claims/' + c2.id + '/pay', { method: 'check' }).status === 200, 'pay'); const closed2 = post('/claims/' + c2.id + '/close', {}); ctx.assert(closed2.status === 200 && closed2.body.status === 'closed', 'close paid claim: ' + JSON.stringify(closed2)); const c3 = file(s, 100000).body; ctx.assert(post('/claims/' + c3.id + '/review', { adjuster_id: a.id }).status === 200, 'review c3'); const d3 = post('/claims/' + c3.id + '/deny', { reason: 'Policy exclusion applies' }); ctx.assert(d3.status === 200 && d3.body.status === 'denied', 'deny under_review claim: ' + JSON.stringify(d3)); }"
  policy_suspend_and_reinstate:
    description: suspend_policy moves an active policy to suspended and refuses repeats. While suspended, filing gives 409 policy_not_active. reinstate_policy restores it, refuses repeats, and filing works again.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const h = post('/policyholders', { name: 'Test ps1', email: 'ps1@acceptance.test', city: 'Austin' }).body; const p = post('/policies', { policy_number: 'ACC-ps1', policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const c = post('/coverages', { policy_id: p.id, kind: 'collision', limit_amount: 500000, deductible: 25000 }).body; ctx.assert(h.id && p.id && c.id, 'setup'); ctx.assert(p.status === 'active', 'new policy is active, got ' + p.status); const claim = { coverage_id: c.id, incident_date: '2026-09-15T00:00:00.000Z', description: 'Parking lot scrape', claimed_amount: 80000 }; const s = post('/policies/' + p.id + '/suspend', { reason: 'Premium unpaid for 60 days' }); ctx.assert(s.status === 200 && s.body.status === 'suspended', 'suspend: ' + JSON.stringify(s)); const s2 = post('/policies/' + p.id + '/suspend', { reason: 'again' }); ctx.assert(s2.status === 409 && s2.body.error.code === 'invalid_state', 'suspend twice: ' + JSON.stringify(s2)); const blocked = post('/policies/' + p.id + '/claims', claim); ctx.assert(blocked.status === 409 && blocked.body.error.code === 'policy_not_active', 'file on suspended policy: ' + JSON.stringify(blocked)); const r = post('/policies/' + p.id + '/reinstate', {}); ctx.assert(r.status === 200 && r.body.status === 'active', 'reinstate: ' + JSON.stringify(r)); const r2 = post('/policies/' + p.id + '/reinstate', {}); ctx.assert(r2.status === 409 && r2.body.error.code === 'invalid_state', 'reinstate twice: ' + JSON.stringify(r2)); const ok = post('/policies/' + p.id + '/claims', claim); ctx.assert(ok.status === 201 && ok.body.status === 'submitted', 'file after reinstatement: ' + JSON.stringify(ok)); const patch = ctx.api('PATCH', '/policies/' + p.id, { status: 'expired' }); ctx.assert(patch.status >= 400 && patch.status < 500, 'status cannot be set by PATCH, got ' + patch.status); ctx.assert(get('/policies/' + p.id).body.status === 'active', 'policy still active'); }"
  expire_policies_job:
    description: After advancing two days, an active and a suspended policy ending 2026-10-08 are expired, and a policy ending in 2027 is still active.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const h = post('/policyholders', { name: 'Test ex1', email: 'ex1@acceptance.test', city: 'Dallas' }).body; ctx.assert(h.id, 'holder'); const mk = (n, end) => { const p = post('/policies', { policy_number: 'ACC-' + n, policyholder_id: h.id, line: 'home', start_date: '2025-10-09T00:00:00.000Z', end_date: end, premium: 90000 }).body; ctx.assert(p.id, 'policy ' + n); return p; }; const short1 = mk('ex1', '2026-10-08T00:00:00.000Z'); const short2 = mk('ex2', '2026-10-08T00:00:00.000Z'); const long1 = mk('ex3', '2027-10-08T00:00:00.000Z'); ctx.assert(post('/policies/' + short2.id + '/suspend', { reason: 'Nonpayment' }).status === 200, 'suspend short2'); ctx.assert(get('/policies/' + short1.id).body.status === 'active', 'still active before the job'); const run = ctx.advance('2d'); ctx.assert(run.jobsFailed.length === 0, 'no job failed: ' + JSON.stringify(run.jobsFailed)); ctx.assert(get('/policies/' + short1.id).body.status === 'expired', 'active policy expired'); ctx.assert(get('/policies/' + short2.id).body.status === 'expired', 'suspended policy expired'); ctx.assert(get('/policies/' + long1.id).body.status === 'active', 'current policy untouched'); const re = post('/policies/' + short1.id + '/reinstate', {}); ctx.assert(re.status === 409 && re.body.error.code === 'invalid_state', 'expired policy cannot be reinstated: ' + JSON.stringify(re)); }"
  auto_close_paid_job:
    description: A paid claim is still paid after 10 days and closed after 31 days, with closed_at set and a closed event.
    script: "(ctx) => { const post = (p, b) => ctx.api('POST', p, b); const get = (p) => ctx.api('GET', p); const h = post('/policyholders', { name: 'Test ac1', email: 'ac1@acceptance.test', city: 'Denver' }).body; const p = post('/policies', { policy_number: 'ACC-ac1', policyholder_id: h.id, line: 'auto', start_date: '2026-01-01T00:00:00.000Z', end_date: '2027-01-01T00:00:00.000Z', premium: 120000 }).body; const cov = post('/coverages', { policy_id: p.id, kind: 'theft', limit_amount: 400000, deductible: 10000 }).body; const a = post('/adjusters', { name: 'Adjuster ac1', email: 'adj.ac1@acceptance.test', specialty: 'auto', active: true }).body; ctx.assert(h.id && p.id && cov.id && a.id, 'setup'); const c = post('/policies/' + p.id + '/claims', { coverage_id: cov.id, incident_date: '2026-09-20T00:00:00.000Z', description: 'Stolen catalytic converter', claimed_amount: 150000 }).body; ctx.assert(c.id, 'claim filed'); ctx.assert(post('/claims/' + c.id + '/review', { adjuster_id: a.id }).status === 200, 'review'); ctx.assert(post('/claims/' + c.id + '/approve', {}).status === 200, 'approve'); ctx.assert(post('/claims/' + c.id + '/pay', { method: 'bank_transfer' }).status === 200, 'pay'); const first = ctx.advance('10d'); ctx.assert(first.jobsFailed.length === 0, 'no job failed'); ctx.assert(get('/claims/' + c.id).body.status === 'paid', 'still paid after 10 days'); const second = ctx.advance('21d'); ctx.assert(second.jobsFailed.length === 0, 'no job failed: ' + JSON.stringify(second.jobsFailed)); const end = get('/claims/' + c.id).body; ctx.assert(end.status === 'closed' && end.closed_at !== null, 'closed after 31 days, got ' + JSON.stringify(end)); const kinds = get('/claims/' + c.id + '/events').body.data.map((e) => e.kind); ctx.assert(kinds.includes('closed'), 'closed event, got ' + JSON.stringify(kinds)); const again = post('/claims/' + c.id + '/close', {}); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'already closed: ' + JSON.stringify(again)); }"
tasks:
  start_review_newest_submitted_claim:
    difficulty: easy
    instruction: Diego Delgado has more than one claim that is still waiting for review. Start the review of his most recently submitted claim that is still in submitted status, assigning the adjuster Priya Nair. Change nothing else.
    grader: |-
      (ctx) => {
        const h = ctx.seed.list('policyholder', { where: { name: 'Diego Delgado' } })[0];
        const priya = ctx.seed.list('adjuster', { where: { name: 'Priya Nair' } })[0];
        if (!h || !priya) return 0;
        let target = null;
        for (const p of ctx.seed.list('policy', { where: { policyholder_id: h.id } })) {
          for (const c of ctx.seed.list('claim', { where: { policy_id: p.id, status: 'submitted' } })) {
            if (target === null || ctx.time.minutesBetween(target.submitted_at, c.submitted_at) > 0) target = c;
          }
        }
        if (target === null) return 0;
        const events = ctx.db.list('claim_event', { where: { claim_id: target.id, kind: 'review_started' } })
          .filter((e) => ctx.seed.get('claim_event', e.id) === null);
        ctx.guardChanges('only the review fields of the newest submitted claim and its review event changed', [
          { entity: 'claim', id: target.id, kind: 'updated', fields: ['status', 'adjuster_id'] },
          ...events.map((e) => ({ entity: 'claim_event', id: e.id, kind: 'created', fields: ['claim_id', 'kind', 'note', 'actor_id'] })),
        ]);
        const end = ctx.db.get('claim', target.id);
        return end.status === 'under_review' && end.adjuster_id === priya.id ? 1 : 0;
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor || null;
          } while (cursor !== null);
          return rows;
        };
        const holder = pages('/policyholders?q=Delgado').find((h) => h.name === 'Diego Delgado');
        ctx.assert(holder, 'policyholder Diego Delgado not found');
        const claims = [];
        for (const p of pages('/policies?policyholder_id=' + holder.id)) {
