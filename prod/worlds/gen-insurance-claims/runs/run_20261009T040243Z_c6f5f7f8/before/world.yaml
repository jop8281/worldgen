  approve_unflagged_water_damage_claims:
    difficulty: hard
    instruction: Approve every claim that is under review and sits on a water_damage coverage, except those that have an open fraud flag. A claim whose flag was already cleared may be approved. Leave flagged claims under review and change nothing else.
    grader: |-
      (ctx) => {
        const covs = {};
        for (const c of ctx.seed.list('coverage', { where: { kind: 'water_damage' } })) covs[c.id] = c;
        const targets = ctx.seed.list('claim', { where: { status: 'under_review' } })
          .filter((c) => covs[c.coverage_id] !== undefined && ctx.seed.list('fraud_flag', { where: { claim_id: c.id, status: 'open' } }).length === 0);
        if (targets.length === 0) return 0;
        const ids = new Set(targets.map((t) => t.id));
        const events = ctx.db.list('claim_event', { where: { kind: 'approved' } })
          .filter((e) => ctx.seed.get('claim_event', e.id) === null && ids.has(e.claim_id));
        const seenCov = new Set();
        const allowed = [];
        for (const t of targets) {
          allowed.push({ entity: 'claim', id: t.id, kind: 'updated', fields: ['status', 'approved_amount', 'deductible_applied', 'approved_at'] });
          if (!seenCov.has(t.coverage_id)) {
            seenCov.add(t.coverage_id);
            allowed.push({ entity: 'coverage', id: t.coverage_id, kind: 'updated', fields: ['reserved_amount'] });
          }
        }
        for (const e of events) allowed.push({ entity: 'claim_event', id: e.id, kind: 'created', fields: ['claim_id', 'kind', 'note', 'actor_id'] });
        ctx.guardChanges('only the unflagged under-review water damage claims, their coverage reserves and approved events changed', allowed);
        let done = 0;
        for (const t of targets) {
          const cov = covs[t.coverage_id];
          const ded = Math.min(cov.deductible, t.claimed_amount);
          const payable = Math.min(t.claimed_amount - ded, cov.limit_amount - cov.paid_amount - cov.reserved_amount);
          const end = ctx.db.get('claim', t.id);
          if (end.status === 'approved' && end.approved_amount === payable && end.deductible_applied === ded) done += 1;
        }
        return done / targets.length;
      }
