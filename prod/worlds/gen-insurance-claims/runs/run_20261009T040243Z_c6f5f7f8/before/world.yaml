.length].id,incident_date:ctx.time.minus(sub,'10d'),description:kd[i%kd.length],claimed_amount:claimed,approved_amount:approved?pay:null,deductible_applied:approved?ded:null,status,denial_reason:reason,submitted_at:sub,approved_at:approvedAt,paid_at:paidAt,closed_at:closedAt,created_at:sub,updated_at:updated};}); }"
