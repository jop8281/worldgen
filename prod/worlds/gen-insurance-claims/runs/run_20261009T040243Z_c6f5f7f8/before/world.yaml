  approve_and_pay_clean_claim:
    difficulty: medium
    instruction: Marcus Delgado has two claims under review. Approve his collision claim, which has no fraud flags, and then pay it out by bank transfer. Do not touch his other claims.
    grader: |-
      (ctx) => {
        const h = ctx.seed.list('policyholder', { where: { name: 'Marcus Delgado' } })[0];
        if (!h) return 0;
        const targets = [];
        for (const p of ctx.seed.list('policy', { where: { policyholder_id: h.id } })) {
          for (const c of ctx.seed.list('claim', { where: { policy_id: p.id } })) {
            const cov = ctx.seed.get('coverage', c.coverage_id);
            if (c.status === 'under_review' && cov.kind === 'collision' && ctx.seed.list('fraud_flag', { where: { claim_id: c.id } }).length === 0) targets.push({ c, cov });
          }
        }
        if (targets.length !== 1) return 0;
        const t = targets[0].c;
        const cov = targets[0].cov;
        const ded = Math.min(cov.deductible, t.claimed_amount);
        const payable = Math.min(t.claimed_amount - ded, cov.limit_amount - cov.paid_amount - cov.reserved_amount);
        const events = ctx.db.list('claim_event', { where: { claim_id: t.id } }).filter((e) => ctx.seed.get('claim_event', e.id) === null);
        const pays = ctx.db.list('payment', { where: { claim_id: t.id } }).filter((p) => ctx.seed.get('payment', p.id) === null);
        ctx.guardChanges('only the target claim, its coverage totals, its events and its payment changed', [
          { entity: 'claim', id: t.id, kind: 'updated', fields: ['status', 'approved_amount', 'deductible_applied', 'approved_at', 'paid_at'] },
          { entity: 'coverage', id: cov.id, kind: 'updated', fields: ['reserved_amount', 'paid_amount'] },
          ...events.map((e) => ({ entity: 'claim_event', id: e.id, kind: 'created', fields: ['claim_id', 'kind', 'note', 'actor_id'] })),
          ...pays.map((p) => ({ entity: 'payment', id: p.id, kind: 'created', fields: ['claim_id', 'policyholder_id', 'amount', 'method', 'paid_at'] })),
        ]);
        const end = ctx.db.get('claim', t.id);
        const endCov = ctx.db.get('coverage', cov.id);
        const approved = (end.status === 'approved' || end.status === 'paid') && end.approved_amount === payable && end.deductible_applied === ded;
        ctx.goal(0.3, 'the claim is approved with the deductible applied', approved);
        const paid = approved && end.status === 'paid' && end.paid_at !== null && pays.length === 1 && pays[0].amount === payable && pays[0].method === 'bank_transfer' && pays[0].policyholder_id === h.id && endCov.paid_amount === cov.paid_amount + payable && endCov.reserved_amount === cov.reserved_amount;
        ctx.goal(0.7, 'the claim is paid by bank transfer and the coverage totals moved', paid);
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor || null;
          } while (cursor !== null);
          return rows;
        };
        const holder = pages('/policyholders?q=Delgado').find((h) => h.name === 'Marcus Delgado');
        ctx.assert(holder, 'policyholder Marcus Delgado not found');
        let target = null;
        for (const p of pages('/policies?policyholder_id=' + holder.id)) {
          for (const c of pages('/claims?status=under_review&policy_id=' + p.id)) {
            const cov = ctx.api('GET', '/coverages/' + c.coverage_id).body;
            if (cov.kind !== 'collision') continue;
            if (pages('/fraud_flags?claim_id=' + c.id).length > 0) continue;
            target = c;
