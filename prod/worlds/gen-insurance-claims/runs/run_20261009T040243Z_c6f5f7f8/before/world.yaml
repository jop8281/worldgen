  confirm_high_severity_fraud_flag:
    difficulty: medium
    instruction: Aisha Lindqvist has two claims under review, and each carries an open fraud flag. Confirm the fraud flag with high severity, with a note that states the finding, so that claim is denied for fraud. Leave her other claim and its flag as they are.
    grader: |-
      (ctx) => {
        const h = ctx.seed.list('policyholder', { where: { name: 'Aisha Lindqvist' } })[0];
        if (!h) return 0;
        const flags = [];
        for (const p of ctx.seed.list('policy', { where: { policyholder_id: h.id } })) {
          for (const c of ctx.seed.list('claim', { where: { policy_id: p.id } })) {
            for (const f of ctx.seed.list('fraud_flag', { where: { claim_id: c.id, status: 'open' } })) flags.push({ f, c });
          }
        }
        const high = flags.filter((x) => x.f.severity === 'high' && x.c.status === 'under_review');
        if (high.length !== 1) return 0;
        const hf = high[0].f;
        const hc = high[0].c;
        const medium = flags.filter((x) => x.f.severity === 'medium' && x.c.id !== hc.id);
        const events = ctx.db.list('claim_event', { where: { claim_id: hc.id } })
          .filter((e) => ctx.seed.get('claim_event', e.id) === null && (e.kind === 'fraud_confirmed' || e.kind === 'denied'));
        ctx.guardChanges('only the high flag, its claim and their confirmation events changed', [
          { entity: 'fraud_flag', id: hf.id, kind: 'updated', fields: ['status', 'resolution_note', 'resolved_at'] },
          { entity: 'claim', id: hc.id, kind: 'updated', fields: ['status', 'denial_reason'] },
          ...events.map((e) => ({ entity: 'claim_event', id: e.id, kind: 'created', fields: ['claim_id', 'kind', 'note', 'actor_id'] })),
        ]);
        const endF = ctx.db.get('fraud_flag', hf.id);
        const endC = ctx.db.get('claim', hc.id);
        const confirmed = endF.status === 'confirmed' && typeof endF.resolution_note === 'string' && endF.resolution_note.trim() !== '';
        ctx.goal(0.4, 'the high severity flag is confirmed with a note', confirmed);
        ctx.goal(0.4, 'its claim is denied for fraud', confirmed && endC.status === 'denied' && typeof endC.denial_reason === 'string' && endC.denial_reason.startsWith('fraud confirmed: '));
        const untouched = medium.length > 0 && medium.every((x) => ctx.db.get('fraud_flag', x.f.id).status === 'open' && ctx.db.get('claim', x.c.id).status === 'under_review');
        ctx.goal(0.2, 'the other claim and its medium flag are untouched', confirmed && untouched);
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor || null;
          } while (cursor !== null);
          return rows;
        };
        const holder = pages('/policyholders?q=Lindqvist').find((h) => h.name === 'Aisha Lindqvist');
        ctx.assert(holder, 'policyholder Aisha Lindqvist not found');
        let target = null;
        for (const p of pages('/policies?policyholder_id=' + holder.id)) {
          for (const c of pages('/claims?policy_id=' + p.id)) {
            if (c.status !== 'under_review') continue;
            const high = pages('/fraud_flags?claim_id=' + c.id + '&status=open&severity=high');
            if (high.length > 0) target = high[0];
          }
        }
        ctx.assert(target, 'no open high severity flag on an under-review claim');
        const r = ctx.api('POST', '/fraud_flags/' + target.id + '/resolve', { outcome: 'confirmed', note: 'Repair invoice is dated before the incident and could not be explained' });
