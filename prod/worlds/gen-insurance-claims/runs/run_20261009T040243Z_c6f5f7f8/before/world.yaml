format: 1
meta:
  name: gen_insurance_claims
  description: An insurance claims world. Policyholders hold policies with per-coverage limits and per-claim deductibles. Claims are filed against a coverage, reviewed by an adjuster, approved with the deductible and the remaining limit applied (reserving money on the coverage), then paid out, or denied. Adjusters raise fraud flags that block approval and payout until they are cleared or confirmed. Confirming fraud denies the claim and releases the reserve. Jobs expire policies and auto-close old paid claims.
  resembles: Guidewire ClaimCenter / Lemonade-style P&C insurance claims API (policies, coverages, claims, payouts, fraud flags)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-07T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  policyholder:
    description: Person or business that holds one or more policies and receives payouts.
    idPrefix: phd
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
  adjuster:
    description: Claims adjuster who reviews claims and raises fraud flags. Inactive adjusters cannot be assigned to reviews.
    idPrefix: adj
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      specialty:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - auto
          - home
          - renters
          - travel
          - health
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  policy:
    description: Insurance policy for one line of business with a coverage period. Only active policies accept new claims. Status changes only through actions and the expiry job.
    idPrefix: pol
    fields:
      policy_number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      policyholder_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: policyholder
        onDelete: restrict
      line:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - auto
          - home
          - renters
          - travel
          - health
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - active
          - suspended
          - expired
        initial: active
        transitions:
          active:
            - suspended
            - expired
          suspended:
            - active
            - expired
          expired: []
      start_date:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      end_date:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      premium:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  coverage:
    description: One covered peril on a policy, with an aggregate limit, a per-claim deductible, and running paid and reserved totals in USD cents.
    idPrefix: cov
    fields:
      policy_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: policy
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - collision
          - liability
          - theft
          - fire
          - water_damage
          - medical
          - baggage
      limit_amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
      deductible:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
        default: 0
      paid_amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      reserved_amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
  claim:
    description: A loss reported against a coverage. Created by file_claim and changed only by actions and jobs. Moves through submitted, under_review, approved, paid and closed, or denied.
    idPrefix: clm
    fields:
      policy_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: policy
        onDelete: restrict
      coverage_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: coverage
        onDelete: restrict
      adjuster_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: adjuster
        onDelete: nullify
      incident_date:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      claimed_amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 1
      approved_amount:
        type: money
        required: false
        nullable: true
        unique: false
        readonly: true
        currency: USD
        min: 0
      deductible_applied:
        type: money
        required: false
        nullable: true
        unique: false
        readonly: true
        currency: USD
        min: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - submitted
          - under_review
          - approved
          - denied
          - paid
          - closed
        initial: submitted
        transitions:
          submitted:
            - under_review
            - denied
          under_review:
            - approved
            - denied
          approved:
            - paid
            - denied
          paid:
            - closed
          denied:
            - closed
          closed: []
      denial_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      submitted_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
        default: now
      approved_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      paid_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      closed_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
  payment:
    description: Payout record created when a claim is paid. One per paid claim, for the full approved amount.
    idPrefix: pay
    fields:
      claim_id:
        type: ref
        required: true
        nullable: false
        unique: true
        readonly: true
        entity: claim
        onDelete: restrict
      policyholder_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: policyholder
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 1
      method:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - bank_transfer
          - check
      paid_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
        default: now
  fraud_flag:
    description: Suspicion raised against a claim. An open flag blocks approval and payout until it is cleared or confirmed. Confirming denies the claim.
    idPrefix: frd
    fields:
      claim_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: claim
        onDelete: restrict
      raised_by_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: adjuster
        onDelete: nullify
      severity:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - low
          - medium
          - high
      reason:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: true
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - open
          - cleared
          - confirmed
        initial: open
        transitions:
          open:
            - cleared
            - confirmed
          cleared: []
          confirmed: []
      resolution_note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      resolved_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
  claim_event:
    description: Append-only audit trail of what happened to a claim. Written by actions and jobs.
    idPrefix: cev
    fields:
      claim_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: claim
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - submitted
          - review_started
          - approved
          - denied
          - paid
          - closed
          - fraud_flagged
          - fraud_cleared
          - fraud_confirmed
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      actor_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: adjuster
        onDelete: nullify
