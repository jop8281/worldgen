  claim: "(ctx) => { const NOW='2026-10-07T09:00:00.000Z';const LINES=['auto','home','renters','travel','health'];const KINDS={auto:['collision','liability'],home:['fire','water_damage'],renters:['theft','water_damage'],travel:['medical','baggage'],health:['medical','liability']};const kindOf=(ci)=>KINDS[LINES[Math.floor(ci/2)%5]][ci%2];const limitOf=(ci)=>[200000,300000,500000,750000,1000000][(ci*3)%5];const dedOf=(ci)=>[25000,50000,100000][ci%3];const claimedOf=(ci)=>120000+((ci*37)%20)*15000;const buildPlan=()=>{const plan=[];const anchors=[[0,'under_review',25],[1,'under_review',40],[10,'under_review',33],[11,'under_review',28],[20,'submitted',30],[21,'submitted',6]];for(const a of anchors)plan.push({ci:a[0],st:a[1],age:a[2]});const water=[];for(let p=0;p<35;p++)if(p%5===1||p%5===2)water.push(2*p+1);const ws=['under_review','under_review','under_review','under_review','under_review','under_review','under_review','under_review','submitted','submitted','approved'];for(let k=0;k<11;k++){const n=plan.length;plan.push({ci:water[k],st:ws[k],age:20+((n*11)%70)});}const skip=new Set([0,1,10,11,20,21]);const pool=[];for(let ci=0;ci<70;ci++)if(!skip.has(ci)&&kindOf(ci)!=='water_damage')pool.push(ci);const G=[];const add=(s,n)=>{for(let i=0;i<n;i++)G.push(s);};add('submitted',8);add('under_review',4);add('approved',9);add('denied',8);add('paid',10);add('closed_paid',2);add('closed_denied',2);for(let j=0;j<43;j++){const st=G[(j*13)%43];const n=plan.length;const paid=st==='paid'||st==='closed_paid';plan.push({ci:pool[(j*7)%50],st,age:paid?20+((n*7)%20):20+((n*11)%70)});}return plan;}; const plan=buildPlan();const policies=ctx.rows('policy');const covs=ctx.rows('coverage');const advs=ctx.rows('adjuster').filter((a)=>a.active);const reasons=['Loss not covered: pre-existing damage','Policy exclusion applies to this peril','Damage below the deductible after inspection','Claim reported after the filing window'];const FN=['forged repair invoice','staged collision confirmed by witn