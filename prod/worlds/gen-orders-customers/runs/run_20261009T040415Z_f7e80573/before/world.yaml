format: 1
meta:
  name: gen_orders
  description: A small storefront back office. Customers (18) place orders (72) that move through a payment and fulfilment lifecycle. Agents list and filter orders, then pay, ship, deliver, cancel or refund them. A nightly job cancels stale unpaid orders. Seed rows come from the two imported CSV fixtures, with ids and timestamps kept as given.
  resembles: "Shopify-style Admin orders and customers API (order lifecycle: pending, paid, shipped, delivered, cancelled, refunded)"
  source: worldgen
  seed: 0
  clock:
    start: 2026-04-08T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A shopper who places orders. Plan is the subscription tier, country a 2-letter code.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      country:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 2
        pattern: ^[A-Z]{2}$
      plan:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 40
  shop_order:
    description: An order placed by a customer. Total is in USD cents. Status, shipped_at and total_cents are changed only by workflow actions and seed.
    idPrefix: ord
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      status:
        type: state
        description: Order lifecycle. cancelled and refunded are final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - paid
          - shipped
          - delivered
          - cancelled
          - refunded
        initial: pending
        transitions:
          pending:
            - paid
            - cancelled
          paid:
            - shipped
            - cancelled
            - refunded
          shipped:
            - delivered
            - refunded
          delivered:
            - refunded
          cancelled: []
          refunded: []
      total_cents:
        type: money
        description: Order total in USD cents.
        required: false
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      currency:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - USD
        default: USD
      item_count:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        default: 1
      placed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
        default: now
      shipped_at:
        type: datetime
        description: Set by ship_order. Null until the order ships.
        required: false
        nullable: true
        unique: false
        readonly: true
      note:
        type: string
        description: Delivery note or cancellation reason.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 200
routes:
  list_customers:
    op: list
    entity: customer
    filters:
      - country
      - plan
    search:
      - name
      - email
    sort:
      - name
      - created_at
    pageSize: 10
    method: GET
    path: /customers
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /customers/{id}
  create_customer:
    op: create
    entity: customer
    method: POST
    path: /customers
  update_customer:
    op: update
    entity: customer
    method: PATCH
    path: /customers/{id}
  list_orders:
    op: list
    entity: shop_order
    filters:
      - status
      - customer_id
      - currency
    search:
      - note
    sort:
      - placed_at
      - total_cents
      - shipped_at
    pageSize: 25
    method: GET
    path: /orders
  list_customer_orders:
    op: list
    entity: shop_order
    filters:
      - status
      - currency
    search:
      - note
    sort:
      - placed_at
      - total_cents
      - shipped_at
    pageSize: 25
    method: GET
    path: /customers/{customer_id}/orders
  get_order:
    op: get
    entity: shop_order
    method: GET
    path: /orders/{id}
  create_order:
    op: create
    entity: shop_order
    method: POST
    path: /orders
  update_order:
    op: update
    entity: shop_order
    method: PATCH
    path: /orders/{id}
actions:
  pay_order:
    method: POST
    path: /orders/{id}/pay
    description: Mark a pending order paid. Any other status returns 409 invalid_state.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const o = ctx.db.get('shop_order', id); if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (o.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only pending orders can be paid.'); const updated = ctx.db.update('shop_order', id, { status: 'paid' }); return { status: 200, body: updated }; }"
  ship_order:
    method: POST
    path: /orders/{id}/ship
    description: Ship a paid order and set shipped_at to the call time. A pending order must be paid first.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const o = ctx.db.get('shop_order', id); if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (o.status === 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is pending. Pay it before shipping.'); if (o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only paid orders can be shipped.'); const updated = ctx.db.update('shop_order', id, { status: 'shipped', shipped_at: ctx.now() }); return { status: 200, body: updated }; }"
  deliver_order:
    method: POST
    path: /orders/{id}/deliver
    description: Mark a shipped order delivered. shipped_at is kept.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const o = ctx.db.get('shop_order', id); if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (o.status !== 'shipped') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only shipped orders can be delivered.'); const updated = ctx.db.update('shop_order', id, { status: 'delivered' }); return { status: 200, body: updated }; }"
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a pending or paid order. An optional reason is stored in note.
    input:
      reason:
        type: string
        description: Optional cancellation reason, stored in note.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 200
    handler: "(ctx) => { const id = ctx.params.id; const o = ctx.db.get('shop_order', id); if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (o.status !== 'pending' && o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only pending and paid orders can be cancelled.'); const patch = { status: 'cancelled' }; const reason = ctx.body.reason; if (typeof reason === 'string' && reason.trim() !== '') patch.note = reason.trim(); const updated = ctx.db.update('shop_order', id, patch); return { status: 200, body: updated }; }"
  refund_order:
    method: POST
    path: /orders/{id}/refund
    description: Refund a paid, shipped or delivered order. shipped_at is kept.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const o = ctx.db.get('shop_order', id); if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found'); if (o.status !== 'paid' && o.status !== 'shipped' && o.status !== 'delivered') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only paid, shipped and delivered orders can be refunded.'); const updated = ctx.db.update('shop_order', id, { status: 'refunded' }); return { status: 200, body: updated }; }"
jobs:
  cancel_stale_pending:
    description: Every day. Cancels each pending order placed at least 7 days (10080 minutes) before engine time. Other statuses are left alone.
    every: 1d
    run: "(ctx) => { const now = ctx.now(); for (const o of ctx.db.list('shop_order', { where: { status: 'pending' } })) { if (ctx.time.minutesBetween(o.placed_at, now) < 10080) continue; ctx.db.update('shop_order', o.id, { status: 'cancelled' }); } }"
