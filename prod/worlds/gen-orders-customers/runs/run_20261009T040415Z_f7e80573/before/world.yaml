    difficulty: hard
    instruction: Refund every delivered order worth more than $100 (more than 10000 cents) that belongs to a customer on the team plan. Orders of customers on other plans, orders in other statuses and orders of $100 or less must not change. The store has several pages of orders, so check them all.
    grader: |-
      (ctx) => {
        const team = new Set(ctx.seed.list('customer', { where: { plan: 'team' } }).map((c) => c.id));
        const targets = ctx.seed.list('shop_order', { where: { status: 'delivered' } }).filter((o) => team.has(o.customer_id) && o.total_cents > 10000);
        if (targets.length === 0) return 0;
        ctx.guardChanges('only the status of the matching orders changed', targets.map((t) => (
          { entity: 'shop_order', id: t.id, kind: 'updated', fields: ['status'] }
        )));
        let done = 0;
        for (const t of targets) {
          const end = ctx.db.get('shop_order', t.id);
          if (end.status === 'refunded' && end.shipped_at === t.shipped_at) done += 1;
        }
        return done / targets.length;
      }
    solution: "(ctx) => { const pages = (path) => { const rows = []; let cursor = null; const sep = path.includes('?') ? '&' : '?'; do { const r = ctx.api('GET', path + (cursor === null ? '' : sep + 'cursor=' + cursor)); ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null && cursor !== undefined); return rows; }; const team = new Set(pages('/customers?plan=team').map((c) => c.id)); ctx.assert(team.size > 0, 'no team customers'); const targets = pages('/orders?status=delivered').filter((o) => team.has(o.customer_id) && o.total_cents > 10000); ctx.assert(targets.length > 0, 'no matching orders'); for (const o of targets) { const r = ctx.api('POST', '/orders/' + o.id + '/refund', {}); ctx.assert(r.status === 200, 'refund ' + o.id + ' failed: ' + JSON.stringify(r.body)); } }"
