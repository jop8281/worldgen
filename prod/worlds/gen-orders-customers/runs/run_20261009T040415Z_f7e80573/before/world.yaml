seed:
  customer: "(ctx) => { const now = ctx.now(); return ctx.fixtures.customers.map((c) => { const at = c.created_at && c.created_at < now ? c.created_at : now; return { name: c.name, email: c.email, country: c.country, plan: c.plan, created_at: at, updated_at: at }; }); }"
  shop_order: "(ctx) => { const now = ctx.now(); const noShip = ['pending', 'paid', 'cancelled']; return ctx.fixtures.orders.map((o) => { let shipped = o.shipped_at === undefined ? null : o.shipped_at; if (noShip.includes(o.status)) shipped = null; else if (shipped === null) shipped = ctx.time.plus(o.placed_at, '1d'); const at = o.placed_at < now ? o.placed_at : now; return { customer_id: o.customer_id, status: o.status, total_cents: o.total_cents, currency: o.currency, item_count: o.item_count, placed_at: o.placed_at, shipped_at: shipped, note: o.note === undefined ? null : o.note, created_at: at, updated_at: at }; }); }"
tests:
  pay_order_flow:
    description: pay_order moves pending to paid, refuses a second payment and a missing order, and a plain PATCH cannot change status.
    script: "(ctx) => { const c = ctx.api('POST', '/customers', { name: 'Pay Tester', email: 'pay.tester@wf.example', country: 'GB', plan: 'pro' }); ctx.assert(c.status === 201 || c.status === 200, 'create customer: ' + JSON.stringify(c)); const o = ctx.api('POST', '/orders', { customer_id: c.body.id, item_count: 2 }); ctx.assert((o.status === 201 || o.status === 200) && o.body.status === 'pending' && o.body.shipped_at === null, 'new order is pending: ' + JSON.stringify(o)); const p = ctx.api('POST', '/orders/' + o.body.id + '/pay', {}); ctx.assert(p.status === 200 && p.body.status === 'paid', 'pay: ' + JSON.stringify(p)); const again = ctx.api('POST', '/orders/' + o.body.id + '/pay', {}); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second pay: ' + JSON.stringify(again)); const missing = ctx.api('POST', '/orders/ord_9999/pay', {}); ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'missing: ' + JSON.stringify(missing)); ctx.api('PATCH', '/orders/' + o.body.id, { status: 'shipped' }); const after = ctx.api('GET', '/orders/' + o.body.id).body; ctx.assert(after.status === 'paid' && after.shipped_at === null, 'PATCH must not change status: ' + JSON.stringify(after)); }"
  ship_order_flow:
    description: ship_order refuses pending orders, ships a paid order with shipped_at at the call time, and refuses a second ship.
    script: "(ctx) => { const c = ctx.api('POST', '/customers', { name: 'Ship Tester', email: 'ship.tester@wf.example', country: 'GB', plan: 'pro' }); const o = ctx.api('POST', '/orders', { customer_id: c.body.id, item_count: 1 }); const id = o.body.id; const early = ctx.api('POST', '/orders/' + id + '/ship', {}); ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'ship pending: ' + JSON.stringify(early)); ctx.assert(ctx.api('POST', '/orders/' + id + '/pay', {}).status === 200, 'pay'); const at = ctx.now(); const s = ctx.api('POST', '/orders/' + id + '/ship', {}); ctx.assert(s.status === 200 && s.body.status === 'shipped' && s.body.shipped_at === at, 'ship: ' + JSON.stringify(s) + ' at ' + at); const again = ctx.api('POST', '/orders/' + id + '/ship', {}); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second ship: ' + JSON.stringify(again)); const missing = ctx.api('POST', '/orders/ord_9999/ship', {}); ctx.assert(missing.status === 404, 'missing: ' + JSON.stringify(missing)); }"
  deliver_order_flow:
    description: deliver_order moves a shipped order to delivered and keeps shipped_at, and refuses pending, paid and delivered orders.
    script: "(ctx) => { const c = ctx.api('POST', '/customers', { name: 'Deliver Tester', email: 'deliver.tester@wf.example', country: 'SE', plan: 'team' }); const o = ctx.api('POST', '/orders', { customer_id: c.body.id, item_count: 1 }); const id = o.body.id; const a = ctx.api('POST', '/orders/' + id + '/deliver', {}); ctx.assert(a.status === 409 && a.body.error.code === 'invalid_state', 'deliver pending: ' + JSON.stringify(a)); ctx.api('POST', '/orders/' + id + '/pay', {}); const b = ctx.api('POST', '/orders/' + id + '/deliver', {}); ctx.assert(b.status === 409 && b.body.error.code === 'invalid_state', 'deliver paid: ' + JSON.stringify(b)); const s = ctx.api('POST', '/orders/' + id + '/ship', {}).body; const d = ctx.api('POST', '/orders/' + id + '/deliver', {}); ctx.assert(d.status === 200 && d.body.status === 'delivered' && d.body.shipped_at === s.shipped_at && s.shipped_at !== null, 'deliver: ' + JSON.stringify(d)); const again = ctx.api('POST', '/orders/' + id + '/deliver', {}); ctx.assert(again.status === 409, 'second deliver: ' + JSON.stringify(again)); const missing = ctx.api('POST', '/orders/ord_9999/deliver', {}); ctx.assert(missing.status === 404, 'missing: ' + JSON.stringify(missing)); }"
  cancel_order_flow:
    description: cancel_order cancels pending and paid orders and stores the reason, and refuses shipped and already cancelled orders.
    script: "(ctx) => { const c = ctx.api('POST', '/customers', { name: 'Cancel Tester', email: 'cancel.tester@wf.example', country: 'US', plan: 'free' }); const mk = () => ctx.api('POST', '/orders', { customer_id: c.body.id, item_count: 1 }).body.id; const p = mk(); const r = ctx.api('POST', '/orders/' + p + '/cancel', { reason: 'Customer changed their mind' }); ctx.assert(r.status === 200 && r.body.status === 'cancelled' && r.body.note === 'Customer changed their mind', 'cancel pending: ' + JSON.stringify(r)); const twice = ctx.api('POST', '/orders/' + p + '/cancel', {}); ctx.assert(twice.status === 409 && twice.body.error.code === 'invalid_state', 'cancel twice: ' + JSON.stringify(twice)); const q = mk(); ctx.api('POST', '/orders/' + q + '/pay', {}); const r2 = ctx.api('POST', '/orders/' + q + '/cancel', {}); ctx.assert(r2.status === 200 && r2.body.status === 'cancelled' && r2.body.note === null, 'cancel paid without reason: ' + JSON.stringify(r2)); const s = mk(); ctx.api('POST', '/orders/' + s + '/pay', {}); ctx.api('POST', '/orders/' + s + '/ship', {}); const r3 = ctx.api('POST', '/orders/' + s + '/cancel', {}); ctx.assert(r3.status === 409 && r3.body.error.code === 'invalid_state', 'cancel shipped: ' + JSON.stringify(r3)); const long = ctx.api('POST', '/orders/' + mk() + '/cancel', { reason: 'x'.repeat(201) }); ctx.assert(long.status === 400, 'too long reason: ' + JSON.stringify(long)); const missing = ctx.api('POST', '/orders/ord_9999/cancel', {}); ctx.assert(missing.status === 404, 'missing: ' + JSON.stringify(missing)); }"
  refund_order_flow:
    description: refund_order refunds paid, shipped and delivered orders keeping shipped_at, and refuses pending, cancelled and refunded orders.
    script: "(ctx) => { const c = ctx.api('POST', '/customers', { name: 'Refund Tester', email: 'refund.tester@wf.example', country: 'GB', plan: 'pro' }); const mk = () => ctx.api('POST', '/orders', { customer_id: c.body.id, item_count: 1 }).body.id; const pending = mk(); const a = ctx.api('POST', '/orders/' + pending + '/refund', {}); ctx.assert(a.status === 409 && a.body.error.code === 'invalid_state', 'refund pending: ' + JSON.stringify(a)); ctx.api('POST', '/orders/' + pending + '/cancel', {}); const b = ctx.api('POST', '/orders/' + pending + '/refund', {}); ctx.assert(b.status === 409 && b.body.error.code === 'invalid_state', 'refund cancelled: ' + JSON.stringify(b)); const paid = mk(); ctx.api('POST', '/orders/' + paid + '/pay', {}); const r1 = ctx.api('POST', '/orders/' + paid + '/refund', {}); ctx.assert(r1.status === 200 && r1.body.status === 'refunded' && r1.body.shipped_at === null, 'refund paid: ' + JSON.stringify(r1)); const again = ctx.api('POST', '/orders/' + paid + '/refund', {}); ctx.assert(again.status === 409, 'refund twice: ' + JSON.stringify(again)); const shipped = mk(); ctx.api('POST', '/orders/' + shipped + '/pay', {}); const sh = ctx.api('POST', '/orders/' + shipped + '/ship', {}).body; const r2 = ctx.api('POST', '/orders/' + shipped + '/refund', {}); ctx.assert(r2.status === 200 && r2.body.status === 'refunded' && r2.body.shipped_at === sh.shipped_at, 'refund shipped: ' + JSON.stringify(r2)); const delivered = mk(); ctx.api('POST', '/orders/' + delivered + '/pay', {}); ctx.api('POST', '/orders/' + delivered + '/ship', {}); ctx.api('POST', '/orders/' + delivered + '/deliver', {}); const r3 = ctx.api('POST', '/orders/' + delivered + '/refund', {}); ctx.assert(r3.status === 200 && r3.body.status === 'refunded' && r3.body.shipped_at !== null, 'refund delivered: ' + JSON.stringify(r3)); const missing = ctx.api('POST', '/orders/ord_9999/refund', {}); ctx.assert(missing.status === 404, 'missing: ' + JSON.stringify(missing)); }"
  stale_pending_job:
    description: cancel_stale_pending cancels pending orders placed 7 or more days ago and leaves younger pending orders and other statuses alone.
    script: "(ctx) => { const c = ctx.api('POST', '/customers', { name: 'Stale Tester', email: 'stale.tester@wf.example', country: 'NL', plan: 'free' }); const mk = (placed) => { const r = ctx.api('POST', '/orders', { customer_id: c.body.id, item_count: 1, placed_at: placed }); ctx.assert(r.status === 200 || r.status === 201, 'create order: ' + JSON.stringify(r)); return r.body.id; }; const old = mk('2026-03-20T09:00:00.000Z'); const boundary = mk('2026-04-02T09:00:00.000Z'); const younger = mk('2026-04-02T10:00:00.000Z'); const fresh = mk(ctx.now()); const paidOld = mk('2026-03-01T09:00:00.000Z'); ctx.assert(ctx.api('POST', '/orders/' + paidOld + '/pay', {}).status === 200, 'pay old order'); const res = ctx.advance('1d'); ctx.assert(res.jobsFailed.length === 0, 'job failed: ' + JSON.stringify(res.jobsFailed)); ctx.assert(res.jobsFired.includes('cancel_stale_pending'), 'job fired: ' + JSON.stringify(res.jobsFired)); const st = (id) => ctx.api('GET', '/orders/' + id).body.status; ctx.assert(st(old) === 'cancelled', 'old pending cancelled, got ' + st(old)); ctx.assert(st(boundary) === 'cancelled', 'exactly 7 days old is cancelled, got ' + st(boundary)); ctx.assert(st(younger) === 'pending', 'under 7 days stays pending, got ' + st(younger)); ctx.assert(st(fresh) === 'pending', 'fresh stays pending, got ' + st(fresh)); ctx.assert(st(paidOld) === 'paid', 'old paid order untouched, got ' + st(paidOld)); }"
  seed_chronology:
    description: Imported order placement and shipping are historical, and shipping follows placement.
    script: "(ctx) => { let cursor = null; do { const r = ctx.api('GET', '/orders' + (cursor === null ? '' : '?cursor=' + cursor)); ctx.assert(r.status === 200, 'list orders'); for (const o of r.body.data) { ctx.assert(o.placed_at <= ctx.now(), 'order placement is in the future: ' + o.id); if (o.shipped_at !== null) { ctx.assert(o.shipped_at >= o.placed_at, 'shipping precedes placement: ' + o.id); ctx.assert(o.shipped_at <= ctx.now(), 'shipping is in the future: ' + o.id); } } cursor = r.body.next_cursor; } while (cursor !== null && cursor !== undefined); }"
tasks:
  ship_ada_paid_order:
    difficulty: easy
    instruction: Ship the paid order of the customer Ada Lovelace. Look the customer up by name. Change nothing else.
    grader: |-
      (ctx) => {
        const ada = ctx.seed.list('customer', { where: { name: 'Ada Lovelace' } })[0];
        if (!ada) return 0;
        const paid = ctx.seed.list('shop_order', { where: { customer_id: ada.id, status: 'paid' } });
        if (paid.length !== 1) return 0;
        const target = paid[0];
        ctx.guardChanges('only the status and shipped_at of Ada paid order changed', [
          { entity: 'shop_order', id: target.id, kind: 'updated', fields: ['status', 'shipped_at'] },
        ]);
        const end = ctx.db.get('shop_order', target.id);
        return end.status === 'shipped' && end.shipped_at !== null && end.shipped_at >= target.placed_at ? 1 : 0;
      }
    solution: "(ctx) => { const cs = ctx.api('GET', '/customers?q=Ada+Lovelace'); ctx.assert(cs.status === 200, 'customer search failed'); const ada = cs.body.data.find((c) => c.name === 'Ada Lovelace'); ctx.assert(ada, 'customer Ada Lovelace not found'); const paid = ctx.api('GET', '/customers/' + ada.id + '/orders?status=paid').body.data; ctx.assert(paid.length === 1, 'expected one paid order, found ' + paid.length); const r = ctx.api('POST', '/orders/' + paid[0].id + '/ship', {}); ctx.assert(r.status === 200, 'ship failed: ' + JSON.stringify(r.body)); }"
    decoys:
      - why: ships the first paid order in the store instead of looking up Ada Lovelace's order
        script: (ctx) => { const first = ctx.api('GET', '/orders?status=paid').body.data[0]; ctx.api('POST', '/orders/' + first.id + '/ship', {}); }
      - why: ships Ada's paid order correctly, then also changes its item_count
        script: |-
          (ctx) => {
            const ada = ctx.api('GET', '/customers?q=Ada+Lovelace').body.data.find((c) => c.name === 'Ada Lovelace');
            const paid = ctx.api('GET', '/customers/' + ada.id + '/orders?status=paid').body.data;
            ctx.api('POST', '/orders/' + paid[0].id + '/ship', {});
            ctx.api('PATCH', '/orders/' + paid[0].id, { item_count: paid[0].item_count + 1 });
          }
    alternatives: []
  cancel_customer_unpaid_orders:
    difficulty: medium
    instruction: The customer with the email edsger.dijkstra@example.com wants all of their unpaid (pending) orders cancelled. Cancel every pending order of that customer, with a reason. Leave their orders in any other status and every other customer's orders untouched.
    grader: |-
      (ctx) => {
        const c = ctx.seed.list('customer', { where: { email: 'edsger.dijkstra@example.com' } })[0];
        if (!c) return 0;
        const targets = ctx.seed.list('shop_order', { where: { customer_id: c.id, status: 'pending' } });
        if (targets.length === 0) return 0;
        ctx.guardChanges('only the status and note of the pending orders changed', targets.map((t) => (
          { entity: 'shop_order', id: t.id, kind: 'updated', fields: ['status', 'note'] }
        )));
        let done = 0;
        for (const t of targets) {
          const end = ctx.db.get('shop_order', t.id);
          if (end.status === 'cancelled') done += 1;
        }
        return done / targets.length;
      }
    solution: "(ctx) => { const cs = ctx.api('GET', '/customers?q=edsger.dijkstra'); ctx.assert(cs.status === 200, 'customer search failed'); const cust = cs.body.data.find((c) => c.email === 'edsger.dijkstra@example.com'); ctx.assert(cust, 'customer not found'); const ids = []; let cursor = null; do { const r = ctx.api('GET', '/customers/' + cust.id + '/orders?status=pending' + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'list orders failed: ' + JSON.stringify(r.body)); for (const o of r.body.data) ids.push(o.id); cursor = r.body.next_cursor; } while (cursor !== null && cursor !== undefined); ctx.assert(ids.length > 0, 'no pending orders found'); for (const id of ids) { const r = ctx.api('POST', '/orders/' + id + '/cancel', { reason: 'Cancelled at customer request' }); ctx.assert(r.status === 200, 'cancel ' + id + ' failed: ' + JSON.stringify(r.body)); } }"
    decoys:
      - why: tries to cancel every order of the customer, including the paid one, which is a change the task did not ask for
        script: "(ctx) => { const cust = ctx.api('GET', '/customers?q=edsger.dijkstra').body.data.find((c) => c.email === 'edsger.dijkstra@example.com'); const orders = ctx.api('GET', '/customers/' + cust.id + '/orders').body.data; for (const o of orders) ctx.api('POST', '/orders/' + o.id + '/cancel', { reason: 'Cancelled' }); }"
      - why: cancels every pending order in the store instead of only that customer's
        script: "(ctx) => { const orders = ctx.api('GET', '/orders?status=pending').body.data; for (const o of orders) ctx.api('POST', '/orders/' + o.id + '/cancel', { reason: 'Cancelled' }); }"
      - why: cancels only the first pending order of the customer and stops
        script: "(ctx) => { const cust = ctx.api('GET', '/customers?q=edsger.dijkstra').body.data.find((c) => c.email === 'edsger.dijkstra@example.com'); const first = ctx.api('GET', '/customers/' + cust.id + '/orders?status=pending').body.data[0]; ctx.api('POST', '/orders/' + first.id + '/cancel', { reason: 'Cancelled' }); }"
      - why: cancels every pending order of the customer correctly, then also changes one order's item_count
        script: |-
          (ctx) => {
            const cust = ctx.api('GET', '/customers?q=edsger.dijkstra').body.data.find((c) => c.email === 'edsger.dijkstra@example.com');
            const pending = ctx.api('GET', '/customers/' + cust.id + '/orders?status=pending').body.data;
            for (const o of pending) ctx.api('POST', '/orders/' + o.id + '/cancel', { reason: 'Cancelled at customer request' });
            ctx.api('PATCH', '/orders/' + pending[0].id, { item_count: pending[0].item_count + 1 });
          }
