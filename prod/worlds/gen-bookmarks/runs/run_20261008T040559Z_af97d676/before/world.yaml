actions:
  mark_read:
    method: POST
    path: /bookmarks/{id}/read
    description: Mark an unread bookmark as read.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const b = ctx.db.get('bookmark', id);
        if (b === null) ctx.fail(404, 'not_found', 'bookmark ' + id + ' not found');
        if (b.status !== 'unread') ctx.fail(409, 'invalid_state', 'bookmark ' + id + ' is ' + b.status + '. Only unread bookmarks can be marked read.');
        const u = ctx.db.update('bookmark', id, { status: 'read', read_at: ctx.now() });
        ctx.db.create('activity', { kind: 'bookmark_read', actor_id: b.owner_id, subject_id: id, note: null });
        return { status: 200, body: u };
      }
  archive_bookmark:
    method: POST
    path: /bookmarks/{id}/archive
    description: Archive an unread or read bookmark.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const b = ctx.db.get('bookmark', id);
        if (b === null) ctx.fail(404, 'not_found', 'bookmark ' + id + ' not found');
        if (b.status !== 'unread' && b.status !== 'read') ctx.fail(409, 'invalid_state', 'bookmark ' + id + ' is ' + b.status + '. Only unread or read bookmarks can be archived.');
        const u = ctx.db.update('bookmark', id, { status: 'archived' });
        ctx.db.create('activity', { kind: 'bookmark_archived', actor_id: b.owner_id, subject_id: id, note: null });
        return { status: 200, body: u };
      }
  trash_bookmark:
    method: POST
    path: /bookmarks/{id}/trash
    description: Move an unread, read or archived bookmark to trash.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const b = ctx.db.get('bookmark', id);
        if (b === null) ctx.fail(404, 'not_found', 'bookmark ' + id + ' not found');
        if (b.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + id + ' is already trashed.');
        const u = ctx.db.update('bookmark', id, { status: 'trashed', trashed_at: ctx.now() });
        ctx.db.create('activity', { kind: 'bookmark_trashed', actor_id: b.owner_id, subject_id: id, note: null });
        return { status: 200, body: u };
      }
  restore_bookmark:
    method: POST
    path: /bookmarks/{id}/restore
    description: Restore an archived or trashed bookmark to unread.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const b = ctx.db.get('bookmark', id);
        if (b === null) ctx.fail(404, 'not_found', 'bookmark ' + id + ' not found');
        if (b.status !== 'archived' && b.status !== 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + id + ' is ' + b.status + '. Only archived or trashed bookmarks can be restored.');
        const u = ctx.db.update('bookmark', id, { status: 'unread', trashed_at: null });
        ctx.db.create('activity', { kind: 'bookmark_restored', actor_id: b.owner_id, subject_id: id, note: null });
        return { status: 200, body: u };
      }
  move_bookmark:
    method: POST
    path: /bookmarks/{id}/move
    description: Move a bookmark into one of its owner's folders, or to the root with a null folder_id.
    input:
      folder_id:
        type: ref
        description: Target folder, null for the root.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const b = ctx.db.get('bookmark', id);
        if (b === null) ctx.fail(404, 'not_found', 'bookmark ' + id + ' not found');
        if (b.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + id + ' is trashed. Restore it first.');
        const fid = ctx.body.folder_id === undefined ? null : ctx.body.folder_id;
        if (fid !== null) {
          const f = ctx.db.get('folder', fid);
          if (f === null) ctx.fail(400, 'input.invalid', 'folder ' + fid + ' not found');
          if (f.owner_id !== b.owner_id) ctx.fail(409, 'owner_mismatch', 'folder ' + fid + ' belongs to another user.');
        }
        const u = ctx.db.update('bookmark', id, { folder_id: fid });
        ctx.db.create('activity', { kind: 'bookmark_moved', actor_id: b.owner_id, subject_id: id, note: fid === null ? 'to root' : 'to ' + fid });
        return { status: 200, body: u };
      }
  tag_bookmark:
    method: POST
    path: /bookmarks/{id}/tag
    description: Tag a bookmark by name. Trims and lowercases the name, and reuses or creates the owner's tag.
    input:
      name:
        type: string
        description: Tag name.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const b = ctx.db.get('bookmark', id);
        if (b === null) ctx.fail(404, 'not_found', 'bookmark ' + id + ' not found');
        const name = String(ctx.body.name).trim().toLowerCase();
        if (name === '') ctx.fail(400, 'input.invalid', 'Invalid input for tag_bookmark: name expected a non-blank string, found ""');
        let tag = ctx.db.list('tag', { where: { owner_id: b.owner_id } }).find((t) => t.name === name);
        if (!tag) tag = ctx.db.create('tag', { owner_id: b.owner_id, name, color: null });
        const dup = ctx.db.list('bookmark_tag', { where: { bookmark_id: id, tag_id: tag.id } });
        if (dup.length > 0) ctx.fail(409, 'already_tagged', 'bookmark ' + id + ' already has tag ' + name);
        const link = ctx.db.create('bookmark_tag', { bookmark_id: id, tag_id: tag.id });
        ctx.db.create('activity', { kind: 'bookmark_tagged', actor_id: b.owner_id, subject_id: id, note: name });
        return { status: 201, body: link };
      }
  untag_bookmark:
    method: POST
    path: /bookmarks/{id}/untag
    description: Remove a tag from a bookmark. The tag row stays.
    input:
      tag_id:
        type: ref
        description: Tag to remove.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: tag
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const b = ctx.db.get('bookmark', id);
        if (b === null) ctx.fail(404, 'not_found', 'bookmark ' + id + ' not found');
        const links = ctx.db.list('bookmark_tag', { where: { bookmark_id: id, tag_id: ctx.body.tag_id } });
        if (links.length === 0) ctx.fail(404, 'not_tagged', 'bookmark ' + id + ' does not have tag ' + ctx.body.tag_id);
        for (const l of links) ctx.db.delete('bookmark_tag', l.id);
        ctx.db.create('activity', { kind: 'bookmark_untagged', actor_id: b.owner_id, subject_id: id, note: ctx.body.tag_id });
        return { status: 200, body: links[0] };
      }
  merge_tags:
    method: POST
    path: /tags/{id}/merge
    description: Merge this tag into another tag of the same owner, then delete this tag.
    input:
      into_tag_id:
        type: ref
        description: Target tag that keeps the links.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: tag
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const src = ctx.db.get('tag', id);
        if (src === null) ctx.fail(404, 'not_found', 'tag ' + id + ' not found');
        const tid = ctx.body.into_tag_id;
        if (tid === id) ctx.fail(409, 'invalid_merge', 'cannot merge a tag into itself');
        const target = ctx.db.get('tag', tid);
        if (target === null) ctx.fail(400, 'input.invalid', 'tag ' + tid + ' not found');
        if (target.owner_id !== src.owner_id) ctx.fail(409, 'owner_mismatch', 'tags belong to different users');
        const have = new Set(ctx.db.list('bookmark_tag', { where: { tag_id: tid } }).map((l) => l.bookmark_id));
        for (const l of ctx.db.list('bookmark_tag', { where: { tag_id: id } })) {
          if (have.has(l.bookmark_id)) ctx.db.delete('bookmark_tag', l.id);
          else { ctx.db.update('bookmark_tag', l.id, { tag_id: tid }); have.add(l.bookmark_id); }
        }
        ctx.db.delete('tag', id);
        ctx.db.create('activity', { kind: 'tags_merged', actor_id: src.owner_id, subject_id: tid, note: 'merged ' + src.name + ' into ' + target.name });
        return { status: 200, body: ctx.db.get('tag', tid) };
      }
  move_folder:
    method: POST
    path: /folders/{id}/move
    description: Re-parent a folder. Refuses cycles and cross-owner parents. A null parent_id moves it to the root.
    input:
      parent_id:
        type: ref
        description: New parent folder, null for the root.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const f = ctx.db.get('folder', id);
        if (f === null) ctx.fail(404, 'not_found', 'folder ' + id + ' not found');
        const pid = ctx.body.parent_id === undefined ? null : ctx.body.parent_id;
        if (pid !== null) {
          if (pid === id) ctx.fail(409, 'folder_cycle', 'a folder cannot be moved under itself');
          const p = ctx.db.get('folder', pid);
          if (p === null) ctx.fail(400, 'input.invalid', 'folder ' + pid + ' not found');
          if (p.owner_id !== f.owner_id) ctx.fail(409, 'owner_mismatch', 'folder ' + pid + ' belongs to another user');
          let cur = p;
          let guard = 0;
          while (cur && cur.parent_id && guard < 1000) {
            if (cur.parent_id === id) ctx.fail(409, 'folder_cycle', 'folder ' + pid + ' is inside folder ' + id);
            cur = ctx.db.get('folder', cur.parent_id);
            guard++;
          }
        }
        const u = ctx.db.update('folder', id, { parent_id: pid });
        ctx.db.create('activity', { kind: 'folder_moved', actor_id: f.owner_id, subject_id: id, note: pid === null ? 'to root' : 'under ' + pid });
        return { status: 200, body: u };
      }
  share_collection:
    method: POST
    path: /collections/{id}/share
    description: The owner adds a member as viewer or editor.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - viewer
          - editor
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('collection', id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + id + ' not found');
        if (ctx.body.actor_id !== c.owner_id) ctx.fail(409, 'not_permitted', 'only the collection owner can share it');
        const uid = ctx.body.user_id;
        if (uid === c.owner_id) ctx.fail(409, 'owner_cannot_be_member', 'the owner already has full access');
        if (ctx.db.list('collection_member', { where: { collection_id: id, user_id: uid } }).length > 0) ctx.fail(409, 'already_member', 'user ' + uid + ' is already a member');
        const m = ctx.db.create('collection_member', { collection_id: id, user_id: uid, role: ctx.body.role });
        if (c.visibility === 'private') ctx.db.update('collection', id, { visibility: 'shared' });
        ctx.db.create('activity', { kind: 'collection_shared', actor_id: c.owner_id, subject_id: id, note: uid + ' as ' + ctx.body.role });
        return { status: 201, body: m };
      }
  unshare_collection:
    method: POST
    path: /collections/{id}/unshare
    description: The owner removes a member. The last member leaving makes a shared collection private.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('collection', id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + id + ' not found');
        if (ctx.body.actor_id !== c.owner_id) ctx.fail(409, 'not_permitted', 'only the collection owner can unshare it');
        const uid = ctx.body.user_id;
        const m = ctx.db.list('collection_member', { where: { collection_id: id, user_id: uid } })[0];
        if (!m) ctx.fail(404, 'not_member', 'user ' + uid + ' is not a member');
        ctx.db.delete('collection_member', m.id);
        const left = ctx.db.list('collection_member', { where: { collection_id: id } }).length;
        if (left === 0 && c.visibility === 'shared') ctx.db.update('collection', id, { visibility: 'private' });
        ctx.db.create('activity', { kind: 'collection_unshared', actor_id: c.owner_id, subject_id: id, note: uid });
        return { status: 200, body: ctx.db.get('collection', id) };
      }
  publish_collection:
    method: POST
    path: /collections/{id}/publish
    description: The owner makes the collection public, with an optional expiry in days.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      expires_in_days:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 1
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('collection', id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + id + ' not found');
        if (ctx.body.actor_id !== c.owner_id) ctx.fail(409, 'not_permitted', 'only the collection owner can publish it');
        const d = ctx.body.expires_in_days;
        const exp = d === undefined || d === null ? null : ctx.time.plus(ctx.now(), d + 'd');
        const patch = { share_expires_at: exp };
        if (c.visibility !== 'public') patch.visibility = 'public';
        const u = ctx.db.update('collection', id, patch);
        ctx.db.create('activity', { kind: 'collection_published', actor_id: c.owner_id, subject_id: id, note: exp === null ? 'no expiry' : 'expires ' + exp });
        return { status: 200, body: u };
      }
  unpublish_collection:
    method: POST
    path: /collections/{id}/unpublish
    description: The owner makes a public collection shared (if it has members) or private.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('collection', id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + id + ' not found');
        if (ctx.body.actor_id !== c.owner_id) ctx.fail(409, 'not_permitted', 'only the collection owner can unpublish it');
        if (c.visibility !== 'public') ctx.fail(409, 'invalid_state', 'collection ' + id + ' is ' + c.visibility + ', not public');
        const members = ctx.db.list('collection_member', { where: { collection_id: id } }).length;
        const u = ctx.db.update('collection', id, { visibility: members > 0 ? 'shared' : 'private', share_expires_at: null });
        ctx.db.create('activity', { kind: 'collection_unpublished', actor_id: c.owner_id, subject_id: id, note: null });
        return { status: 200, body: u };
      }
  add_bookmark_to_collection:
    method: POST
    path: /collections/{id}/add_bookmark
    description: An owner or editor adds one of their own non-trashed bookmarks to the collection.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bookmark
        onDelete: restrict
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('collection', id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + id + ' not found');
        const actor = ctx.body.actor_id;
        const isEditor = ctx.db.list('collection_member', { where: { collection_id: id, user_id: actor } }).some((m) => m.role === 'editor');
        if (actor !== c.owner_id && !isEditor) ctx.fail(409, 'not_permitted', 'only the owner or an editor can add bookmarks');
        const b = ctx.db.get('bookmark', ctx.body.bookmark_id);
        if (b === null) ctx.fail(400, 'input.invalid', 'bookmark not found');
        if (b.owner_id !== actor) ctx.fail(409, 'not_your_bookmark', 'bookmark ' + b.id + ' belongs to another user');
        if (b.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + b.id + ' is trashed');
        if (ctx.db.list('collection_item', { where: { collection_id: id, bookmark_id: b.id } }).length > 0) ctx.fail(409, 'already_in_collection', 'bookmark ' + b.id + ' is already in the collection');
        const note = ctx.body.note === undefined ? null : ctx.body.note;
        const item = ctx.db.create('collection_item', { collection_id: id, bookmark_id: b.id, added_by: actor, note });
        ctx.db.create('activity', { kind: 'collection_item_added', actor_id: actor, subject_id: id, note: b.id });
        return { status: 201, body: item };
      }
jobs:
  purge_trash:
    description: Daily. Deletes bookmarks trashed 30 or more days ago. Tag links and collection items cascade. Logs bookmark_purged.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const b of ctx.db.list('bookmark', { where: { status: 'trashed' } })) {
          if (b.trashed_at === null || ctx.time.minutesBetween(b.trashed_at, now) < 30 * 1440) continue;
          ctx.db.create('activity', { kind: 'bookmark_purged', actor_id: null, subject_id: b.id, note: 'auto: trashed 30 days' });
          ctx.db.delete('bookmark', b.id);
        }
      }
  expire_public_shares:
    description: Hourly. Public collections whose expiry has passed go back to shared (if members exist) or private. Logs share_expired.
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const c of ctx.db.list('collection', { where: { visibility: 'public' } })) {
          if (c.share_expires_at === null || ctx.time.minutesBetween(now, c.share_expires_at) > 0) continue;
          const members = ctx.db.list('collection_member', { where: { collection_id: c.id } }).length;
          ctx.db.update('collection', c.id, { visibility: members > 0 ? 'shared' : 'private', share_expires_at: null });
          ctx.db.create('activity', { kind: 'share_expired', actor_id: null, subject_id: c.id, note: 'auto: public link expired' });
        }
      }
