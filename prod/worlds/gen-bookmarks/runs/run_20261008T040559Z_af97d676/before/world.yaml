  share_maya_big_private_collections:
    difficulty: hard
    instruction: Acting as Maya Chen, the owner, share every private collection of hers that holds at least 3 bookmarks with Dev Patel as an editor. Leave her smaller private collection and her already-shared collection alone, and do not change anything else.
    grader: "(ctx) => { const maya = ctx.seed.list('user', { where: { name: 'Maya Chen' } })[0]; const dev = ctx.seed.list('user', { where: { name: 'Dev Patel' } })[0]; if (!maya || !dev) return 0; const targets = ctx.seed.list('collection', { where: { owner_id: maya.id, visibility: 'private' } }).filter((c) => ctx.seed.list('collection_item', { where: { collection_id: c.id } }).length >= 3); if (targets.length === 0) return 0; const ids = new Set(targets.map((c) => c.id)); const members = ctx.db.list('collection_member', { where: { user_id: dev.id } }).filter((m) => ctx.seed.get('collection_member', m.id) === null && ids.has(m.collection_id)); const acts = ctx.db.list('activity', { where: { kind: 'collection_shared' } }).filter((a) => ctx.seed.get('activity', a.id) === null && ids.has(a.subject_id)); ctx.guardChanges('only the target collections, their new Dev member rows and share activity changed', [ ...targets.map((c) => ({ entity: 'collection', id: c.id, kind: 'updated', fields: ['visibility'] })), ...members.map((m) => ({ entity: 'collection_member', id: m.id, kind: 'created', fields: ['collection_id', 'user_id', 'role'] })), ...acts.map((a) => ({ entity: 'activity', id: a.id, kind: 'created', fields: ['kind', 'actor_id', 'subject_id', 'note'] })) ]); for (const t of targets) { const ms = ctx.db.list('collection_member', { where: { collection_id: t.id, user_id: dev.id } }); const end = ctx.db.get('collection', t.id); ctx.goal(1 / targets.length, 'collection ' + t.id + ' shared with Dev as editor', ms.length === 1 && ms[0].role === 'editor' && end !== null && end.visibility === 'shared'); } return ctx.score(); }"
    solution: "(ctx) => { const maya = ctx.api('GET', '/users?q=Maya').body.data.find((u) => u.name === 'Maya Chen'); const dev = ctx.api('GET', '/users?q=Dev').body.data.find((u) => u.name === 'Dev Patel'); ctx.assert(maya && dev, 'users not found'); const cols = ctx.api('GET', '/collections?owner_id=' + maya.id + '&visibility=private').body.data; ctx.assert(cols.length > 0, 'no private collections'); let shared = 0; for (const c of cols) { const items = ctx.api('GET', '/collection_items?collection_id=' + c.id).body.data; if (items.length < 3) continue; const r = ctx.api('POST', '/collections/' + c.id + '/share', { actor_id: maya.id, user_id: dev.id, role: 'editor' }); ctx.assert(r.status === 201, 'share ' + c.id + ' failed: ' + JSON.stringify(r.body)); shared++; } ctx.assert(shared > 0, 'nothing was shared'); }"
