  trash_maya_broken_links:
    difficulty: hard
    instruction: Maya Chen has bookmarks whose links are broken. Move every broken-link bookmark of hers that is still unread or read (not archived) to the trash. Leave her archived bookmarks as they are, and do not touch anyone else's bookmarks.
    grader: "(ctx) => { const maya = ctx.seed.list('user', { where: { name: 'Maya Chen' } })[0]; if (!maya) return 0; const targets = ctx.seed.list('bookmark', { where: { owner_id: maya.id, link_status: 'broken' } }).filter((b) => b.status === 'unread' || b.status === 'read'); if (targets.length === 0) return 0; const ids = new Set(targets.map((t) => t.id)); const acts = ctx.db.list('activity', { where: { kind: 'bookmark_trashed' } }).filter((a) => ctx.seed.get('activity', a.id) === null && ids.has(a.subject_id)); ctx.guardChanges('only the target bookmarks and their trashed activity changed', [ ...targets.map((t) => ({ entity: 'bookmark', id: t.id, kind: 'updated', fields: ['status', 'trashed_at'] })), ...acts.map((a) => ({ entity: 'activity', id: a.id, kind: 'created', fields: ['kind', 'actor_id', 'subject_id', 'note'] })) ]); for (const t of targets) { const end = ctx.db.get('bookmark', t.id); ctx.goal(1 / targets.length, 'bookmark ' + t.id + ' is trashed', end !== null && end.status === 'trashed' && end.trashed_at !== null); } return ctx.score(); }"
    solution: "(ctx) => { const pages = (path) => { const rows = []; let cursor = null; do { const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor); return rows; }; const maya = ctx.api('GET', '/users?q=Maya').body.data.find((u) => u.name === 'Maya Chen'); ctx.assert(maya, 'Maya Chen not found'); const targets = pages('/bookmarks?owner_id=' + maya.id + '&link_status=broken').filter((b) => b.status === 'unread' || b.status === 'read'); ctx.assert(targets.length > 0, 'no broken unread or read bookmarks found'); for (const b of targets) { const r = ctx.api('POST', '/bookmarks/' + b.id + '/trash', {}); ctx.assert(r.status === 200, 'trash ' + b.id + ' failed: ' + JSON.stringify(r.body)); } }"
    decoys:
      - why: also trashes Maya's archived broken bookmarks, treating archived as in scope
