format: 1
meta:
  name: gen_bookmarks
  description: A multi-user bookmark manager. Users save bookmarks into a nested folder tree and label them with per-user tags. Each bookmark moves through unread, read, archived and trashed, and trash is purged after 30 days. Users group bookmarks into collections that are private, shared with members as viewer or editor, or public with an optional expiry. Actions enforce ownership, permission and cycle rules and write an activity log. Two jobs purge old trash and expire public links.
  resembles: Raindrop.io / Pocket-style bookmark manager (bookmarks, nested folders, tags, shared collections)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  user:
    description: A person with a bookmark library. Owns bookmarks, folders, tags and collections, and can be a collection member.
    idPrefix: usr
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
  folder:
    description: A user's folder. Nesting goes through parent_id, which only the move_folder action sets, so cycles are impossible. A null parent_id means root.
    idPrefix: fld
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      parent_id:
        type: ref
        description: Parent folder, null at the root. Set only by move_folder.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: folder
        onDelete: restrict
  bookmark:
    description: A saved URL owned by a user, optionally in one folder. Moves through unread, read, archived and trashed by actions only.
    idPrefix: bkm
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      folder_id:
        type: ref
        description: Folder holding the bookmark, null at the root.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: nullify
      url:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 2000
        format: url
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 300
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      favorite:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: false
      link_status:
        type: enum
        description: Plain data about link health. There is no crawler.
        required: false
        nullable: false
        unique: false
        readonly: false
        values:
          - unchecked
          - ok
          - broken
        default: unchecked
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - unread
          - read
          - archived
          - trashed
        initial: unread
        transitions:
          unread:
            - read
            - archived
            - trashed
          read:
            - archived
            - trashed
          archived:
            - unread
            - trashed
          trashed:
            - unread
      read_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      trashed_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
  tag:
    description: A lowercase label scoped to one user. Created by tag_bookmark. The name is readonly and merge_tags is the only way to combine tags.
    idPrefix: tag
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 60
      color:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 20
  bookmark_tag:
    description: Join row linking a bookmark to a tag. One row per pair, enforced by the actions. Cascades when either side is deleted.
    idPrefix: btg
    fields:
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: bookmark
        onDelete: cascade
      tag_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: tag
        onDelete: cascade
  collection:
    description: A named set of bookmarks that is private, shared with members, or public with an optional expiry.
    idPrefix: col
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      visibility:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - private
          - shared
          - public
        initial: private
        transitions:
          private:
            - shared
            - public
          shared:
            - private
            - public
          public:
            - shared
            - private
      share_expires_at:
        type: datetime
        description: When the public link expires. Null means no expiry.
        required: false
        nullable: true
        unique: false
        readonly: true
  collection_member:
    description: Grants a user viewer or editor access to a collection. Written only by share_collection and unshare_collection.
    idPrefix: cmb
    fields:
      collection_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: collection
        onDelete: cascade
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - viewer
          - editor
  collection_item:
    description: A bookmark placed in a collection, with who added it and an optional note.
    idPrefix: cit
    fields:
      collection_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: collection
        onDelete: cascade
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: bookmark
        onDelete: cascade
      added_by:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
  activity:
    description: Append-only audit log written by actions and jobs. subject_id is a plain string, so entries survive purges.
    idPrefix: act
    fields:
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - bookmark_read
          - bookmark_archived
          - bookmark_trashed
          - bookmark_restored
          - bookmark_moved
          - bookmark_purged
          - bookmark_tagged
          - bookmark_untagged
          - tags_merged
          - folder_moved
          - collection_shared
          - collection_unshared
          - collection_published
          - collection_unpublished
          - collection_item_added
          - share_expired
      actor_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: user
        onDelete: nullify
      subject_id:
        type: string
        description: Id of the row the entry is about, kept as plain text so it survives deletes.
        required: false
        nullable: true
        unique: false
        readonly: true
        maxLength: 60
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
