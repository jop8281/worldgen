tests:
  bookmark_lifecycle_transitions:
    description: Creates a bookmark, then archives, restores and trashes it, checking defaults, trashed_at, restore clearing trashed_at, 409 invalid_state for wrong states and 404 for a missing bookmark.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const uu=ctx.api('POST','/users',{name:'Lia Lifecycle',email:'lia.lifecycle@tests.example'});ok(uu,'user');const c=ctx.api('POST','/bookmarks',{owner_id:uu.body.id,url:'https://example.com/lifecycle',title:'Lifecycle page'});ok(c,'create');const id=c.body.id;ctx.assert(c.body.status==='unread'&&c.body.favorite===false&&c.body.link_status==='unchecked'&&c.body.trashed_at===null,'defaults: '+JSON.stringify(c.body));const a=ctx.api('POST','/bookmarks/'+id+'/archive',{});ctx.assert(a.status===200&&a.body.status==='archived','archive: '+JSON.stringify(a.body));is(ctx.api('POST','/bookmarks/'+id+'/archive',{}),409,'invalid_state','archive twice');const r=ctx.api('POST','/bookmarks/'+id+'/restore',{});ctx.assert(r.status===200&&r.body.status==='unread','restore archived: '+JSON.stringify(r.body));const at=ctx.now();const t=ctx.api('POST','/bookmarks/'+id+'/trash',{});ctx.assert(t.status===200&&t.body.status==='trashed'&&t.body.trashed_at===at,'trash: '+JSON.stringify(t.body));is(ctx.api('POST','/bookmarks/'+id+'/archive',{}),409,'invalid_state','archive trashed');is(ctx.api('POST','/bookmarks/'+id+'/read',{}),409,'invalid_state','read trashed');const b=ctx.api('POST','/bookmarks/'+id+'/restore',{});ctx.assert(b.status===200&&b.body.status==='unread'&&b.body.trashed_at===null,'restore trashed: '+JSON.stringify(b.body));is(ctx.api('POST','/bookmarks/'+id+'/restore',{}),409,'invalid_state','restore unread');is(ctx.api('POST','/bookmarks/bkm_9999/trash',{}),404,'not_found','missing bookmark');}"
  mark_read_sets_read_at:
    description: Reads a new bookmark, checks read_at equals the engine time and one bookmark_read activity exists, refuses a repeat, and allows archiving a read bookmark.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const uu=ctx.api('POST','/users',{name:'Rae Reader',email:'rae.reader@tests.example'});ok(uu,'user');const c=ctx.api('POST','/bookmarks',{owner_id:uu.body.id,url:'https://example.com/read',title:'Read me'});ok(c,'create');const id=c.body.id;const at=ctx.now();const r=ctx.api('POST','/bookmarks/'+id+'/read',{});ctx.assert(r.status===200&&r.body.status==='read'&&r.body.read_at===at,'read: '+JSON.stringify(r.body));is(ctx.api('POST','/bookmarks/'+id+'/read',{}),409,'invalid_state','read twice');const ev=ctx.api('GET','/activity?kind=bookmark_read&subject_id='+id);ctx.assert(ev.status===200&&ev.body.data.length===1,'one bookmark_read activity: '+JSON.stringify(ev.body));const a=ctx.api('POST','/bookmarks/'+id+'/archive',{});ctx.assert(a.status===200&&a.body.status==='archived','archive a read bookmark: '+JSON.stringify(a.body));}"
  tag_and_untag_bookmark:
    description: Tags two bookmarks with 'Recipes' in different cases, checks one lowercase tag exists, 409 already_tagged, 400 for a blank name, then untags and checks 404 not_tagged and that the tag survives.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const uu=ctx.api('POST','/users',{name:'Tina Tagger',email:'tina.tagger@tests.example'});ok(uu,'user');const u=uu.body.id;const mk=(n)=>{const r=ctx.api('POST','/bookmarks',{owner_id:u,url:'https://example.com/'+n,title:'Page '+n});ok(r,'bookmark '+n);return r.body.id;};const b1=mk('one');const b2=mk('two');const t1=ctx.api('POST','/bookmarks/'+b1+'/tag',{name:'  Recipes '});ctx.assert(t1.status===201&&t1.body.bookmark_id===b1&&t1.body.tag_id,'tag: '+t1.status+' '+JSON.stringify(t1.body));const tags=ctx.api('GET','/tags?owner_id='+u);ctx.assert(tags.status===200&&tags.body.data.length===1&&tags.body.data[0].name==='recipes','one lowercase tag: '+JSON.stringify(tags.body));is(ctx.api('POST','/bookmarks/'+b1+'/tag',{name:'RECIPES'}),409,'already_tagged','tag twice');const t2=ctx.api('POST','/bookmarks/'+b2+'/tag',{name:'recipes'});ctx.assert(t2.status===201&&t2.body.tag_id===t1.body.tag_id,'second bookmark reuses the tag: '+JSON.stringify(t2.body));ctx.assert(ctx.api('GET','/tags?owner_id='+u).body.data.length===1,'still one tag');const blank=ctx.api('POST','/bookmarks/'+b1+'/tag',{name:'   '});ctx.assert(blank.status===400&&blank.body.error.code==='input.invalid','blank name: '+JSON.stringify(blank));const un=ctx.api('POST','/bookmarks/'+b1+'/untag',{tag_id:t1.body.tag_id});ctx.assert(un.status===200,'untag: '+un.status+' '+JSON.stringify(un.body));ctx.assert(ctx.api('GET','/bookmark_tags?bookmark_id='+b1).body.data.length===0,'b1 has no links');is(ctx.api('POST','/bookmarks/'+b1+'/untag',{tag_id:t1.body.tag_id}),404,'not_tagged','untag twice');ctx.assert(ctx.api('GET','/tags/'+t1.body.tag_id).status===200,'tag still exists for b2');}"
  merge_tags_dedupes_links:
    description: Tags b1 with js and javascript and b2 with js, merges js into javascript, and checks each bookmark has exactly one javascript link, the source is gone and tags_merged was logged. Self-merge and a cross-owner merge are refused with 409.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const user=(n)=>{const r=ctx.api('POST','/users',{name:n,email:n.toLowerCase().replace(/ /g,'.')+'@tests.example'});ok(r,'user '+n);return r.body.id;};const bm=(o,n)=>{const r=ctx.api('POST','/bookmarks',{owner_id:o,url:'https://example.com/'+n,title:'Page '+n});ok(r,'bookmark '+n);return r.body.id;};const tag=(b,n)=>{const r=ctx.api('POST','/bookmarks/'+b+'/tag',{name:n});ctx.assert(r.status===201,'tag '+n+': '+r.status+' '+JSON.stringify(r.body));return r.body.tag_id;};const u=user('Mel Merger');const b1=bm(u,'m1');const b2=bm(u,'m2');const js=tag(b1,'js');const jsc=tag(b1,'javascript');tag(b2,'js');is(ctx.api('POST','/tags/'+js+'/merge',{into_tag_id:js}),409,'invalid_merge','self merge');const o=user('Otto Other');const bo=bm(o,'o1');const ot=tag(bo,'misc');is(ctx.api('POST','/tags/'+jsc+'/merge',{into_tag_id:ot}),409,'owner_mismatch','cross-owner merge');const m=ctx.api('POST','/tags/'+js+'/merge',{into_tag_id:jsc});ctx.assert(m.status===200&&m.body.id===jsc,'merge: '+m.status+' '+JSON.stringify(m.body));ctx.assert(ctx.api('GET','/tags/'+js).status===404,'source tag deleted');for(const b of [b1,b2]){const l=ctx.api('GET','/bookmark_tags?bookmark_id='+b);ctx.assert(l.status===200&&l.body.data.length===1&&l.body.data[0].tag_id===jsc,'bookmark '+b+' has exactly the javascript link: '+JSON.stringify(l.body));}const ev=ctx.api('GET','/activity?kind=tags_merged&subject_id='+jsc);ctx.assert(ev.status===200&&ev.body.data.length===1,'one tags_merged activity: '+JSON.stringify(ev.body));}"
  move_folder_prevents_cycles:
    description: Builds A, B and C, nests B under A and C under B, then checks that moving A under C or A under A is a 409 folder_cycle, a foreign-owner parent is a 409 owner_mismatch, an unknown parent is a 400, and a null parent returns to the root.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const user=(n)=>{const r=ctx.api('POST','/users',{name:n,email:n.toLowerCase().replace(/ /g,'.')+'@tests.example'});ok(r,'user '+n);return r.body.id;};const u=user('Fay Folder');const o=user('Ona Outsider');const mk=(owner,n)=>{const r=ctx.api('POST','/folders',{owner_id:owner,name:n});ok(r,'folder '+n);ctx.assert(r.body.parent_id===null,'new folder is a root');return r.body.id;};const A=mk(u,'A');const B=mk(u,'B');const C=mk(u,'C');const F=mk(o,'Foreign');const mv=(id,p)=>ctx.api('POST','/folders/'+id+'/move',{parent_id:p});const r1=mv(B,A);ctx.assert(r1.status===200&&r1.body.parent_id===A,'B under A: '+JSON.stringify(r1.body));const r2=mv(C,B);ctx.assert(r2.status===200&&r2.body.parent_id===B,'C under B: '+JSON.stringify(r2.body));is(mv(A,C),409,'folder_cycle','A under its descendant C');is(mv(A,A),409,'folder_cycle','A under itself');is(mv(A,F),409,'owner_mismatch','foreign parent');const unk=mv(A,'fld_9999');ctx.assert(unk.status===400&&unk.body.error.code==='input.invalid','unknown parent: '+JSON.stringify(unk));is(mv('fld_9999',A),404,'not_found','missing folder');const r3=mv(C,null);ctx.assert(r3.status===200&&r3.body.parent_id===null,'C back to root: '+JSON.stringify(r3.body));ctx.assert(ctx.api('GET','/folders/'+A).body.parent_id===null,'A is unchanged');}"
  move_bookmark_between_folders:
    description: Moves a bookmark into its owner's folder, to the root, then tries a foreign folder (409 owner_mismatch) and a trashed bookmark (409 invalid_state).
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const user=(n)=>{const r=ctx.api('POST','/users',{name:n,email:n.toLowerCase().replace(/ /g,'.')+'@tests.example'});ok(r,'user '+n);return r.body.id;};const u=user('Moe Mover');const o=user('Ola Other');const f1=ctx.api('POST','/folders',{owner_id:u,name:'Reading'});ok(f1,'folder');const f2=ctx.api('POST','/folders',{owner_id:o,name:'Theirs'});ok(f2,'folder 2');const b=ctx.api('POST','/bookmarks',{owner_id:u,url:'https://example.com/mv',title:'Movable'});ok(b,'bookmark');const id=b.body.id;ctx.assert(b.body.folder_id===null,'new bookmark has no folder');const m1=ctx.api('POST','/bookmarks/'+id+'/move',{folder_id:f1.body.id});ctx.assert(m1.status===200&&m1.body.folder_id===f1.body.id,'move: '+JSON.stringify(m1.body));is(ctx.api('POST','/bookmarks/'+id+'/move',{folder_id:f2.body.id}),409,'owner_mismatch','foreign folder');ctx.assert(ctx.api('GET','/bookmarks/'+id).body.folder_id===f1.body.id,'refused move changed nothing');const m2=ctx.api('POST','/bookmarks/'+id+'/move',{folder_id:null});ctx.assert(m2.status===200&&m2.body.folder_id===null,'move to root: '+JSON.stringify(m2.body));ok(ctx.api('POST','/bookmarks/'+id+'/trash',{}),'trash');is(ctx.api('POST','/bookmarks/'+id+'/move',{folder_id:f1.body.id}),409,'invalid_state','move trashed');}"
  delete_folder_rules:
    description: Nests a folder under a parent, checks the parent cannot be deleted, deletes the leaf and sees the bookmark's folder_id become null, then deletes the now-empty parent.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const uu=ctx.api('POST','/users',{name:'Dee Deleter',email:'dee.deleter@tests.example'});ok(uu,'user');const u=uu.body.id;const p=ctx.api('POST','/folders',{owner_id:u,name:'Parent'});ok(p,'parent');const l=ctx.api('POST','/folders',{owner_id:u,name:'Leaf'});ok(l,'leaf');ok(ctx.api('POST','/folders/'+l.body.id+'/move',{parent_id:p.body.id}),'nest');const b=ctx.api('POST','/bookmarks',{owner_id:u,folder_id:l.body.id,url:'https://example.com/in-leaf',title:'In leaf'});ok(b,'bookmark');ctx.assert(b.body.folder_id===l.body.id,'bookmark starts in the leaf');const bad=ctx.api('DELETE','/folders/'+p.body.id);ctx.assert(bad.status>=400&&bad.status<500,'deleting a parent with a subfolder is refused: '+bad.status);ctx.assert(ctx.api('GET','/folders/'+p.body.id).status===200,'parent still exists');ok(ctx.api('DELETE','/folders/'+l.body.id),'delete leaf');ctx.assert(ctx.api('GET','/folders/'+l.body.id).status===404,'leaf is gone');ctx.assert(ctx.api('GET','/bookmarks/'+b.body.id).body.folder_id===null,'bookmark folder_id is null');ok(ctx.api('DELETE','/folders/'+p.body.id),'delete empty parent');}"
  share_and_unshare_collection:
    description: Shares a private collection with a viewer, checks visibility shared, then tries a duplicate, the owner, a non-owner actor and a bad role. Unshares the viewer, checks the collection is private again, and refuses an unknown member.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const user=(n)=>{const r=ctx.api('POST','/users',{name:n,email:n.toLowerCase().replace(/ /g,'.')+'@tests.example'});ok(r,'user '+n);return r.body.id;};const owner=user('Cora Owner');const viewer=user('Vic Viewer');const out=user('Otis Outsider');const c=ctx.api('POST','/collections',{owner_id:owner,name:'Design links',description:'Inspiration'});ok(c,'collection');const id=c.body.id;ctx.assert(c.body.visibility==='private'&&c.body.share_expires_at===null,'new collection is private: '+JSON.stringify(c.body));const s=ctx.api('POST','/collections/'+id+'/share',{actor_id:owner,user_id:viewer,role:'viewer'});ctx.assert(s.status===201&&s.body.collection_id===id&&s.body.user_id===viewer&&s.body.role==='viewer','share: '+s.status+' '+JSON.stringify(s.body));ctx.assert(ctx.api('GET','/collections/'+id).body.visibility==='shared','collection is shared');is(ctx.api('POST','/collections/'+id+'/share',{actor_id:owner,user_id:viewer,role:'editor'}),409,'already_member','duplicate member');is(ctx.api('POST','/collections/'+id+'/share',{actor_id:owner,user_id:owner,role:'editor'}),409,'owner_cannot_be_member','owner as member');is(ctx.api('POST','/collections/'+id+'/share',{actor_id:out,user_id:out,role:'editor'}),409,'not_permitted','non-owner shares');const bad=ctx.api('POST','/collections/'+id+'/share',{actor_id:owner,user_id:out,role:'admin'});ctx.assert(bad.status===400&&bad.body.error.code==='input.invalid','bad role: '+JSON.stringify(bad));is(ctx.api('POST','/collections/'+id+'/unshare',{actor_id:out,user_id:viewer}),409,'not_permitted','non-owner unshares');is(ctx.api('POST','/collections/'+id+'/unshare',{actor_id:owner,user_id:out}),404,'not_member','unknown member');const u=ctx.api('POST','/collections/'+id+'/unshare',{actor_id:owner,user_id:viewer});ctx.assert(u.status===200,'unshare: '+u.status+' '+JSON.stringify(u.body));ctx.assert(ctx.api('GET','/collections/'+id).body.visibility==='private','last member removed, so private');ctx.assert(ctx.api('GET','/collection_members?collection_id='+id).body.data.length===0,'no members left');}"
  add_bookmark_permissions:
    description: Adds bookmarks as an outsider (409 not_permitted), a viewer (409), an editor (201, but 409 not_your_bookmark for another's bookmark), a duplicate (409 already_in_collection), the owner with a note (201) and a trashed bookmark (409). Then lists the items and deletes one.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const user=(n)=>{const r=ctx.api('POST','/users',{name:n,email:n.toLowerCase().replace(/ /g,'.')+'@tests.example'});ok(r,'user '+n);return r.body.id;};const bm=(o,n)=>{const r=ctx.api('POST','/bookmarks',{owner_id:o,url:'https://example.com/'+n,title:'Page '+n});ok(r,'bookmark '+n);return r.body.id;};const owner=user('Gus Owner');const editor=user('Edie Editor');const viewer=user('Vera Viewer');const out=user('Oz Outsider');const c=ctx.api('POST','/collections',{owner_id:owner,name:'Team reading'});ok(c,'collection');const id=c.body.id;ctx.assert(ctx.api('POST','/collections/'+id+'/share',{actor_id:owner,user_id:editor,role:'editor'}).status===201,'share editor');ctx.assert(ctx.api('POST','/collections/'+id+'/share',{actor_id:owner,user_id:viewer,role:'viewer'}).status===201,'share viewer');const bo=bm(owner,'bo');const be=bm(editor,'be');const bv=bm(viewer,'bv');const bx=bm(out,'bx');const add=(a,b,note)=>ctx.api('POST','/collections/'+id+'/add_bookmark',note===undefined?{actor_id:a,bookmark_id:b}:{actor_id:a,bookmark_id:b,note});is(add(out,bx),409,'not_permitted','outsider');is(add(viewer,bv),409,'not_permitted','viewer');const e1=add(editor,be);ctx.assert(e1.status===201&&e1.body.collection_id===id&&e1.body.bookmark_id===be&&e1.body.added_by===editor,'editor adds own: '+e1.status+' '+JSON.stringify(e1.body));is(add(editor,bo),409,'not_your_bookmark','editor adds the owner bookmark');is(add(editor,be),409,'already_in_collection','duplicate');const o1=add(owner,bo,'start here');ctx.assert(o1.status===201&&o1.body.note==='start here','owner adds with a note: '+JSON.stringify(o1.body));const bt=bm(owner,'bt');ok(ctx.api('POST','/bookmarks/'+bt+'/trash',{}),'trash');is(add(owner,bt),409,'invalid_state','trashed bookmark');const items=ctx.api('GET','/collection_items?collection_id='+id);ctx.assert(items.status===200&&items.body.data.length===2,'two items: '+JSON.stringify(items.body));ok(ctx.api('DELETE','/collection_items/'+e1.body.id),'remove item');ctx.assert(ctx.api('GET','/collection_items?collection_id='+id).body.data.length===1,'one item left');}"
  publish_and_expire_collection:
    description: Publishes a collection with 7 days of expiry and checks it stays public at 6 days. After 2 more days the job returns it to shared (it has a member) with the expiry cleared. A collection published without expiry stays public for 30 days, then unpublish returns it to private. Non-owner, zero-day and repeat unpublish calls are refused.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const is=(r,s,c,m)=>ctx.assert(r.status===s&&r.body.error&&r.body.error.code===c,m+': expected '+s+' '+c+', got '+r.status+' '+JSON.stringify(r.body));const user=(n)=>{const r=ctx.api('POST','/users',{name:n,email:n.toLowerCase().replace(/ /g,'.')+'@tests.example'});ok(r,'user '+n);return r.body.id;};const owner=user('Pia Publisher');const member=user('Max Member');const col=(n)=>{const r=ctx.api('POST','/collections',{owner_id:owner,name:n});ok(r,'collection '+n);return r.body.id;};const c1=col('Launch notes');const c2=col('Evergreen');ctx.assert(ctx.api('POST','/collections/'+c1+'/share',{actor_id:owner,user_id:member,role:'viewer'}).status===201,'share');is(ctx.api('POST','/collections/'+c1+'/publish',{actor_id:member,expires_in_days:7}),409,'not_permitted','non-owner publish');const zero=ctx.api('POST','/collections/'+c1+'/publish',{actor_id:owner,expires_in_days:0});ctx.assert(zero.status===400&&zero.body.error.code==='input.invalid','zero days: '+JSON.stringify(zero));const p=ctx.api('POST','/collections/'+c1+'/publish',{actor_id:owner,expires_in_days:7});ctx.assert(p.status===200&&p.body.visibility==='public'&&typeof p.body.share_expires_at==='string'&&p.body.share_expires_at>ctx.now(),'publish: '+JSON.stringify(p.body));const a1=ctx.advance('6d');ctx.assert(a1.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a1.jobsFailed));ctx.assert(ctx.api('GET','/collections/'+c1).body.visibility==='public','still public after 6 days');const a2=ctx.advance('2d');ctx.assert(a2.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a2.jobsFailed));const e=ctx.api('GET','/collections/'+c1).body;ctx.assert(e.visibility==='shared'&&e.share_expires_at===null,'expired, back to shared: '+JSON.stringify(e));const ev=ctx.api('GET','/activity?kind=share_expired&subject_id='+c1);ctx.assert(ev.status===200&&ev.body.data.length===1,'one share_expired activity: '+JSON.stringify(ev.body));const p2=ctx.api('POST','/collections/'+c2+'/publish',{actor_id:owner});ctx.assert(p2.status===200&&p2.body.visibility==='public'&&p2.body.share_expires_at===null,'publish with no expiry: '+JSON.stringify(p2.body));ctx.advance('30d');ctx.assert(ctx.api('GET','/collections/'+c2).body.visibility==='public','no expiry, still public');const u=ctx.api('POST','/collections/'+c2+'/unpublish',{actor_id:owner});ctx.assert(u.status===200&&u.body.visibility==='private','unpublish to private: '+JSON.stringify(u.body));is(ctx.api('POST','/collections/'+c2+'/unpublish',{actor_id:owner}),409,'invalid_state','unpublish a private collection');}"
  purge_trash_job:
    description: Trashes two bookmarks, restores one after 10 days and checks the other survives until day 29. After day 31 it is gone with its links, items and a bookmark_purged activity, while the restored and the untouched bookmark remain.
    script: "(ctx)=>{const ok=(r,m)=>ctx.assert(r.status>=200&&r.status<300,m+': '+r.status+' '+JSON.stringify(r.body));const uu=ctx.api('POST','/users',{name:'Pat Purger',email:'pat.purger@tests.example'});ok(uu,'user');const u=uu.body.id;const mk=(n)=>{const r=ctx.api('POST','/bookmarks',{owner_id:u,url:'https://example.com/'+n,title:'Page '+n});ok(r,'bookmark '+n);return r.body.id;};const b1=mk('doomed');const b2=mk('untouched');const b3=mk('restored');const col=ctx.api('POST','/collections',{owner_id:u,name:'Keepers'});ok(col,'collection');ctx.assert(ctx.api('POST','/bookmarks/'+b1+'/tag',{name:'temp'}).status===201,'tag b1');ctx.assert(ctx.api('POST','/collections/'+col.body.id+'/add_bookmark',{actor_id:u,bookmark_id:b1}).status===201,'add b1 to collection');ok(ctx.api('POST','/bookmarks/'+b1+'/trash',{}),'trash b1');ok(ctx.api('POST','/bookmarks/'+b3+'/trash',{}),'trash b3');const a1=ctx.advance('10d');ctx.assert(a1.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a1.jobsFailed));ok(ctx.api('POST','/bookmarks/'+b3+'/restore',{}),'restore b3');const a2=ctx.advance('19d');ctx.assert(a2.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a2.jobsFailed));const still=ctx.api('GET','/bookmarks/'+b1);ctx.assert(still.status===200&&still.body.status==='trashed','b1 still trashed at day 29: '+still.status);const a3=ctx.advance('2d');ctx.assert(a3.jobsFailed.length===0,'jobs failed: '+JSON.stringify(a3.jobsFailed));ctx.assert(ctx.api('GET','/bookmarks/'+b1).status===404,'b1 purged at day 31');ctx.assert(ctx.api('GET','/bookmark_tags?bookmark_id='+b1).body.data.length===0,'b1 tag links gone');ctx.assert(ctx.api('GET','/collection_items?collection_id='+col.body.id).body.data.length===0,'b1 collection item gone');const ev=ctx.api('GET','/activity?kind=bookmark_purged&subject_id='+b1);ctx.assert(ev.status===200&&ev.body.data.length===1,'one bookmark_purged activity: '+JSON.stringify(ev.body));ctx.assert(ctx.api('GET','/bookmarks/'+b2).status===200,'untouched bookmark survives');const r=ctx.api('GET','/bookmarks/'+b3);ctx.assert(r.status===200&&r.body.status==='unread','restored bookmark survives');}"
tasks:
  mark_postgres_article_read:
    difficulty: easy
    instruction: Mark Maya Chen's unread bookmark 'Postgres Index-Only Scans Explained' as read. Another user has a bookmark with the same title. Leave that one alone.
    grader: "(ctx) => { const maya = ctx.seed.list('user', { where: { name: 'Maya Chen' } })[0]; if (!maya) return 0; const target = ctx.seed.list('bookmark', { where: { owner_id: maya.id, title: 'Postgres Index-Only Scans Explained' } })[0]; if (!target) return 0; const acts = ctx.db.list('activity', { where: { kind: 'bookmark_read', subject_id: target.id } }).filter((a) => ctx.seed.get('activity', a.id) === null); ctx.guardChanges('only the target bookmark and its read activity changed', [ { entity: 'bookmark', id: target.id, kind: 'updated', fields: ['status', 'read_at'] }, ...acts.map((a) => ({ entity: 'activity', id: a.id, kind: 'created', fields: ['kind', 'actor_id', 'subject_id', 'note'] })) ]); const end = ctx.db.get('bookmark', target.id); ctx.goal(0.8, 'the target bookmark is read', end !== null && end.status === 'read'); ctx.goal(0.2, 'read_at is set', end !== null && end.status === 'read' && end.read_at !== null); return ctx.score(); }"
    solution: "(ctx) => { const maya = ctx.api('GET', '/users?q=Maya').body.data.find((u) => u.name === 'Maya Chen'); ctx.assert(maya, 'Maya Chen not found'); const list = ctx.api('GET', '/bookmarks?owner_id=' + maya.id + '&status=unread').body.data; const b = list.find((x) => x.title === 'Postgres Index-Only Scans Explained'); ctx.assert(b, 'bookmark not found'); const r = ctx.api('POST', '/bookmarks/' + b.id + '/read', {}); ctx.assert(r.status === 200, 'read failed: ' + JSON.stringify(r.body)); }"
    decoys:
      - why: marks the same-titled bookmark owned by Dev Patel as read instead of Maya's
        script: (ctx) => { const dev = ctx.api('GET', '/users?q=Dev').body.data.find((u) => u.name === 'Dev Patel'); const list = ctx.api('GET', '/bookmarks?owner_id=' + dev.id + '&status=unread').body.data; const b = list.find((x) => x.title === 'Postgres Index-Only Scans Explained'); ctx.api('POST', '/bookmarks/' + b.id + '/read', {}); }
      - why: archives Maya's bookmark instead of marking it read
        script: (ctx) => { const maya = ctx.api('GET', '/users?q=Maya').body.data.find((u) => u.name === 'Maya Chen'); const list = ctx.api('GET', '/bookmarks?owner_id=' + maya.id + '&status=unread').body.data; const b = list.find((x) => x.title === 'Postgres Index-Only Scans Explained'); ctx.api('POST', '/bookmarks/' + b.id + '/archive', {}); }
    alternatives: []
  merge_maya_ml_tags:
    difficulty: medium
    instruction: Maya Chen has two tags, 'ml' and 'machine-learning'. Merge her 'ml' tag into 'machine-learning' so every bookmark that carried 'ml' now carries 'machine-learning' (once only) and her 'ml' tag no longer exists. Do not touch any other user's tags.
    grader: "(ctx) => { const maya = ctx.seed.list('user', { where: { name: 'Maya Chen' } })[0]; const dev = ctx.seed.list('user', { where: { name: 'Dev Patel' } })[0]; if (!maya || !dev) return 0; const ml = ctx.seed.list('tag', { where: { owner_id: maya.id, name: 'ml' } })[0]; const target = ctx.seed.list('tag', { where: { owner_id: maya.id, name: 'machine-learning' } })[0]; const devMl = ctx.seed.list('tag', { where: { owner_id: dev.id, name: 'ml' } })[0]; if (!ml || !target || !devMl) return 0; const mlLinks = ctx.seed.list('bookmark_tag', { where: { tag_id: ml.id } }); const tLinks = ctx.seed.list('bookmark_tag', { where: { tag_id: target.id } }); const union = new Set([...mlLinks, ...tLinks].map((l) => l.bookmark_id)); const mlLinkIds = new Set(mlLinks.map((l) => l.id)); ctx.guard('only the merge rows changed', ctx.changes().every((c) => { if (c.entity === 'activity') return c.kind === 'created' && ['tags_merged', 'bookmark_tagged', 'bookmark_untagged'].includes(ctx.db.get('activity', c.id).kind); if (c.entity === 'tag') return c.kind === 'deleted' && c.id === ml.id; if (c.entity === 'bookmark_tag') { if (c.kind === 'created') { const r = ctx.db.get('bookmark_tag', c.id); return r.tag_id === target.id && union.has(r.bookmark_id); } if (c.kind === 'updated') { const r = ctx.db.get('bookmark_tag', c.id); return mlLinkIds.has(c.id) && r.tag_id === target.id && c.fields.every((f) => f === 'tag_id'); } if (c.kind === 'deleted') return mlLinkIds.has(c.id); } return false; })); const devBefore = ctx.seed.list('bookmark_tag', { where: { tag_id: devMl.id } }).length; ctx.guard('Dev ml tag and its links are intact', ctx.db.get('tag', devMl.id) !== null && ctx.db.list('bookmark_tag', { where: { tag_id: devMl.id } }).length === devBefore); const gone = ctx.db.get('tag', ml.id) === null && ctx.db.get('tag', target.id) !== null; const endLinks = ctx.db.list('bookmark_tag', { where: { tag_id: target.id } }); const per = {}; for (const l of endLinks) per[l.bookmark_id] = (per[l.bookmark_id] || 0) + 1; const linksOk = endLinks.length === union.size && Array.from(union).every((b) => per[b] === 1); ctx.goal(0.4, 'ml tag is gone and machine-learning is kept', gone); ctx.goal(0.6, 'every bookmark has exactly one machine-learning link and nothing more', linksOk); return ctx.score(); }"
    solution: "(ctx) => { const maya = ctx.api('GET', '/users?q=Maya').body.data.find((u) => u.name === 'Maya Chen'); ctx.assert(maya, 'Maya Chen not found'); const tags = ctx.api('GET', '/tags?owner_id=' + maya.id).body.data; const ml = tags.find((t) => t.name === 'ml'); const target = tags.find((t) => t.name === 'machine-learning'); ctx.assert(ml && target, 'Maya tags not found'); const r = ctx.api('POST', '/tags/' + ml.id + '/merge', { into_tag_id: target.id }); ctx.assert(r.status === 200, 'merge failed: ' + JSON.stringify(r.body)); }"
