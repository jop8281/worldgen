      - why: drops the owner filter and trashes every user's unread or read broken bookmark
        script: "(ctx) => { const ids = []; let cursor = null; do { const r = ctx.api('GET', '/bookmarks?link_status=broken' + (cursor === null ? '' : '&cursor=' + cursor)); for (const b of r.body.data) { if (b.status === 'unread' || b.status === 'read') ids.push(b.id); } cursor = r.body.next_cursor; } while (cursor); for (const id of ids) ctx.api('POST', '/bookmarks/' + id + '/trash', {}); }"
      - why: archives the broken bookmarks instead of trashing them
