seed:
  course: |-
    (ctx) => {
      const day = (d) => { const s = String(d); return s.length === 10 ? s + 'T00:00:00.000Z' : s; };
      return ctx.fixtures.courses.map((c) => ({
        code: c.course_id,
        title: c.title,
        department: c.department,
        credits: c.credits,
        capacity: c.capacity,
        starts_on: day(c.starts_on),
        created_at: '2026-06-01T09:00:00.000Z',
        updated_at: '2026-06-01T09:00:00.000Z',
      }));
    }
  enrollment: |-
    (ctx) => {
      const day = (d) => { const s = String(d); return s.length === 10 ? s + 'T00:00:00.000Z' : s; };
      const byCode = {};
      for (const c of ctx.rows('course')) byCode[c.code] = c.id;
      return ctx.fixtures.enrollments.map((e) => {
        const when = day(e.enrolled_on);
        const grade = e.status === 'completed' && e.grade ? e.grade : null;
        return {
          code: e.enrollment_id,
          course_id: byCode[e.course_id],
          student_email: e.student_email,
          enrolled_on: when,
          status: e.status,
          grade,
          created_at: when,
          updated_at: when,
        };
      });
    }
tests:
  enroll_waitlist_and_drop_promotes:
    description: Enrolling past capacity waitlists, duplicates are refused, and dropping a seat promotes the oldest waitlisted student.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/courses', { code: 'T901', title: 'Test Course', department: 'Math', credits: 3, capacity: 1, starts_on: '2026-11-02T00:00:00.000Z' });
        ctx.assert(c.status === 201, 'create course ' + JSON.stringify(c.body));
        const a = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'a@uni.example' });
        ctx.assert(a.status === 201 && a.body.status === 'enrolled', 'a enrolled ' + JSON.stringify(a.body));
        const b = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'b@uni.example' });
        ctx.assert(b.status === 201 && b.body.status === 'waitlisted', 'b waitlisted ' + JSON.stringify(b.body));
        const d = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'd@uni.example' });
        ctx.assert(d.body.status === 'waitlisted', 'd waitlisted');
        const dup = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'b@uni.example' });
        ctx.assert(dup.status === 409, 'duplicate refused ' + dup.status);
        const bad = ctx.api('POST', '/enrollments', { course_id: 'crs_9999', student_email: 'x@uni.example' });
        ctx.assert(bad.status >= 400 && bad.status < 500, 'unknown course refused ' + bad.status);
        const drop = ctx.api('POST', '/enrollments/' + a.body.id + '/drop', {});
        ctx.assert(drop.status === 200 && drop.body.status === 'dropped', 'drop ' + JSON.stringify(drop.body));
        ctx.assert(ctx.api('GET', '/enrollments/' + b.body.id).body.status === 'enrolled', 'b promoted');
        ctx.assert(ctx.api('GET', '/enrollments/' + d.body.id).body.status === 'waitlisted', 'd still waitlisted');
        const again = ctx.api('POST', '/enrollments/' + a.body.id + '/drop', {});
        ctx.assert(again.status === 409, 'second drop refused');
        const miss = ctx.api('POST', '/enrollments/enr_9999/drop', {});
        ctx.assert(miss.status === 404, 'missing drop 404');
        const re = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'a@uni.example' });
        ctx.assert(re.status === 201 && re.body.status === 'waitlisted', 're-enroll after drop waitlisted');
      }
  complete_requires_enrolled_and_grade:
    description: complete_enrollment records the grade on enrolled enrollments only.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/courses', { code: 'T902', title: 'Test Course 2', department: 'Art', credits: 2, capacity: 1, starts_on: '2026-11-02T00:00:00.000Z' });
        const a = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'a@uni.example' });
        const b = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'b@uni.example' });
        const w = ctx.api('POST', '/enrollments/' + b.body.id + '/complete', { grade: 'A' });
        ctx.assert(w.status === 409, 'waitlisted cannot complete ' + w.status);
        const nog = ctx.api('POST', '/enrollments/' + a.body.id + '/complete', {});
        ctx.assert(nog.status >= 400 && nog.status < 500, 'grade required ' + nog.status);
        const badg = ctx.api('POST', '/enrollments/' + a.body.id + '/complete', { grade: 'F' });
        ctx.assert(badg.status >= 400 && badg.status < 500, 'bad grade refused ' + badg.status);
        const ok = ctx.api('POST', '/enrollments/' + a.body.id + '/complete', { grade: 'B' });
        ctx.assert(ok.status === 200 && ok.body.status === 'completed' && ok.body.grade === 'B', 'completed ' + JSON.stringify(ok.body));
        const twice = ctx.api('POST', '/enrollments/' + a.body.id + '/complete', { grade: 'A' });
        ctx.assert(twice.status === 409, 'second complete refused');
        const miss = ctx.api('POST', '/enrollments/enr_9999/complete', { grade: 'A' });
        ctx.assert(miss.status === 404, 'missing 404');
      }
  promote_waitlist_action_fills_free_seats:
    description: promote_waitlist fills free seats oldest first, and lowering capacity drops nobody.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/courses', { code: 'T903', title: 'Test Course 3', department: 'Biology', credits: 4, capacity: 1, starts_on: '2026-11-02T00:00:00.000Z' });
        const a = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'a@uni.example' });
        const b = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'b@uni.example' });
        const d = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'd@uni.example' });
        const none = ctx.api('POST', '/courses/' + c.body.id + '/promote_waitlist', {});
        ctx.assert(none.status === 200 && none.body.promoted.length === 0, 'full course promotes none');
        ctx.assert(ctx.api('PATCH', '/courses/' + c.body.id, { capacity: 2 }).status === 200, 'raise capacity');
        const r = ctx.api('POST', '/courses/' + c.body.id + '/promote_waitlist', {});
        ctx.assert(r.status === 200 && r.body.promoted.length === 1 && r.body.promoted[0].id === b.body.id, 'b promoted ' + JSON.stringify(r.body));
        ctx.assert(ctx.api('GET', '/enrollments/' + d.body.id).body.status === 'waitlisted', 'd waits');
        ctx.assert(ctx.api('PATCH', '/courses/' + c.body.id, { capacity: 1 }).status === 200, 'lower capacity');
        ctx.assert(ctx.api('GET', '/enrollments/' + a.body.id).body.status === 'enrolled' && ctx.api('GET', '/enrollments/' + b.body.id).body.status === 'enrolled', 'nobody dropped');
        ctx.assert(ctx.api('POST', '/courses/crs_9999/promote_waitlist', {}).status === 404, 'missing course 404');
      }
  promote_waitlisted_job_runs_hourly:
    description: The hourly job promotes waitlisted students when capacity grows.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/courses', { code: 'T904', title: 'Test Course 4', department: 'History', credits: 3, capacity: 1, starts_on: '2026-11-02T00:00:00.000Z' });
        ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'a@uni.example' });
        const b = ctx.api('POST', '/enrollments', { course_id: c.body.id, student_email: 'b@uni.example' });
        ctx.assert(b.body.status === 'waitlisted', 'b waitlisted');
        ctx.api('PATCH', '/courses/' + c.body.id, { capacity: 2 });
        ctx.advance('2h');
        ctx.assert(ctx.api('GET', '/enrollments/' + b.body.id).body.status === 'enrolled', 'job promoted b');
      }
tasks:
  drop_student_from_course:
    difficulty: easy
    instruction: Drop the enrollment of student53@uni.example in the course titled 'Math Seminar 9'. Do not change that student's other enrollments or anyone else's.
    grader: |-
      (ctx) => {
        const course = ctx.seed.list('course', { where: { title: 'Math Seminar 9' } })[0];
        if (!course) return 0;
        const target = ctx.seed.list('enrollment', { where: { course_id: course.id, student_email: 'student53@uni.example', status: 'enrolled' } })[0];
        if (!target) return 0;
        for (const c of ctx.changes()) {
          if (c.entity !== 'enrollment' || c.kind === 'created') return 0;
          if (c.id === target.id) continue;
          const before = ctx.seed.get('enrollment', c.id);
          const after = ctx.db.get('enrollment', c.id);
          if (before && after && before.course_id === course.id && before.status === 'waitlisted' && after.status === 'enrolled') continue;
          return 0;
        }
        const end = ctx.db.get('enrollment', target.id);
        return end.status === 'dropped' ? 1 : 0;
      }
    solution: |-
      (ctx) => {
        const courses = ctx.api('GET', '/courses?q=Math+Seminar+9').body.data.filter((c) => c.title === 'Math Seminar 9');
        ctx.assert(courses.length === 1, 'expected one course titled Math Seminar 9, found ' + courses.length);
        const rows = ctx.api('GET', '/enrollments?course_id=' + courses[0].id + '&student_email=student53@uni.example&status=enrolled').body.data;
        ctx.assert(rows.length === 1, 'expected one enrolled enrollment, found ' + rows.length);
        const r = ctx.api('POST', '/enrollments/' + rows[0].id + '/drop', {});
        ctx.assert(r.status === 200, 'drop failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: drops every enrolled enrollment of the student across all courses instead of only the one in Math Seminar 9
        script: |-
          (ctx) => {
            const rows = ctx.api('GET', '/enrollments?student_email=student53@uni.example&status=enrolled').body.data;
            for (const e of rows) ctx.api('POST', '/enrollments/' + e.id + '/drop', {});
          }
      - why: drops the other enrolled student of Math Seminar 9 instead of the named student
        script: |-
          (ctx) => {
            const course = ctx.api('GET', '/courses?q=Math+Seminar+9').body.data.find((c) => c.title === 'Math Seminar 9');
            const rows = ctx.api('GET', '/enrollments?course_id=' + course.id + '&status=enrolled').body.data;
            const other = rows.find((e) => e.student_email !== 'student53@uni.example');
            ctx.api('POST', '/enrollments/' + other.id + '/drop', {});
          }
    alternatives: []
    allows:
      - entity: enrollment
        kind: updated
        fields:
          - status
        where:
          student_email: student53@uni.example
          course_id: crs_0009
          status: enrolled
      - entity: enrollment
        kind: updated
        fields:
          - status
        where:
          course_id: crs_0009
          status: waitlisted
  enroll_into_full_course:
    difficulty: medium
    instruction: The course 'Physics Lab 13' is being cut back to 3 seats. Set its capacity to 3. Then enroll student99@uni.example in it, which should put that student on the waitlist because the course is full. Finally release the seat held by student8@uni.example so the waitlist moves forward. Do not raise the capacity or edit enrollments in any other way.
    grader: |-
      (ctx) => {
        const course = ctx.seed.list('course', { where: { title: 'Physics Lab 13' } })[0];
        if (!course) return 0;
        const rows = ctx.seed.list('enrollment', { where: { course_id: course.id } });
        const waiting = rows.filter((r) => r.status === 'waitlisted').sort((a, b) => a.enrolled_on < b.enrolled_on ? -1 : a.enrolled_on > b.enrolled_on ? 1 : a.id < b.id ? -1 : 1);
        const seat = rows.find((r) => r.student_email === 'student8@uni.example' && r.status === 'enrolled');
        if (!seat || waiting.length < 3) return 0;
        const fresh = ctx.db.list('enrollment', { where: { course_id: course.id, student_email: 'student99@uni.example' } });
        const newIds = new Set(fresh.map((r) => r.id));
        const allowed = new Set([seat.id, waiting[0].id]);
        const endCourse = ctx.db.get('course', course.id);
        ctx.guard('only the course capacity changed on the course', endCourse.title === course.title && endCourse.department === course.department && endCourse.credits === course.credits && endCourse.starts_on === course.starts_on && endCourse.code === course.code);
        const collateral = ctx.changes().some((c) => {
          if (c.entity === 'course' && c.id === course.id) return false;
          if (c.entity === 'enrollment' && (allowed.has(c.id) || newIds.has(c.id))) return false;
          return true;
        });
        ctx.guard('nothing changed except the course, the new enrollment, the released seat and the promoted student', !collateral);
        const end = (id) => ctx.db.get('enrollment', id);
        ctx.goal(0.15, 'capacity set to 3', endCourse.capacity === 3);
        ctx.goal(0.25, 'new student is waitlisted', fresh.length === 1 && fresh[0].status === 'waitlisted');
        ctx.goal(0.2, 'student8 seat dropped', end(seat.id).status === 'dropped');
        ctx.goal(0.4, 'only the oldest waitlisted student was promoted', end(waiting[0].id).status === 'enrolled' && end(waiting[1].id).status === 'waitlisted' && end(waiting[2].id).status === 'waitlisted' && end(seat.id).status === 'dropped');
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const courses = ctx.api('GET', '/courses?q=Physics+Lab+13').body.data.filter((c) => c.title === 'Physics Lab 13');
        ctx.assert(courses.length === 1, 'expected one Physics Lab 13, found ' + courses.length);
        const course = courses[0];
        const cap = ctx.api('PATCH', '/courses/' + course.id, { capacity: 3 });
        ctx.assert(cap.status === 200, 'capacity update failed: ' + JSON.stringify(cap.body));
        const enr = ctx.api('POST', '/enrollments', { course_id: course.id, student_email: 'student99@uni.example' });
        ctx.assert(enr.status === 201 && enr.body.status === 'waitlisted', 'expected a waitlisted enrollment: ' + JSON.stringify(enr.body));
        const seats = ctx.api('GET', '/enrollments?course_id=' + course.id + '&student_email=student8@uni.example&status=enrolled').body.data.filter((e) => e.student_email === 'student8@uni.example');
        ctx.assert(seats.length === 1, 'expected one seat for student8, found ' + seats.length);
        const drop = ctx.api('POST', '/enrollments/' + seats[0].id + '/drop', {});
        ctx.assert(drop.status === 200, 'drop failed: ' + JSON.stringify(drop.body));
      }
    decoys:
      - why: raises the capacity so the new student gets a seat directly instead of cutting it to 3 and using the waitlist
        script: |-
          (ctx) => {
            const course = ctx.api('GET', '/courses?q=Physics+Lab+13').body.data.find((c) => c.title === 'Physics Lab 13');
            ctx.api('PATCH', '/courses/' + course.id, { capacity: 4 });
            ctx.api('POST', '/enrollments', { course_id: course.id, student_email: 'student99@uni.example' });
          }
      - why: drops a different enrolled student than student8 so the wrong seat is released
        script: |-
          (ctx) => {
            const course = ctx.api('GET', '/courses?q=Physics+Lab+13').body.data.find((c) => c.title === 'Physics Lab 13');
            ctx.api('PATCH', '/courses/' + course.id, { capacity: 3 });
            ctx.api('POST', '/enrollments', { course_id: course.id, student_email: 'student99@uni.example' });
            const other = ctx.api('GET', '/enrollments?course_id=' + course.id + '&status=enrolled').body.data.find((e) => e.student_email === 'student2@uni.example');
            ctx.api('POST', '/enrollments/' + other.id + '/drop', {});
          }
      - why: drops the seat before lowering the capacity, so the drop promotes the whole waitlist instead of one student
        script: |-
          (ctx) => {
            const course = ctx.api('GET', '/courses?q=Physics+Lab+13').body.data.find((c) => c.title === 'Physics Lab 13');
            const seat = ctx.api('GET', '/enrollments?course_id=' + course.id + '&student_email=student8@uni.example&status=enrolled').body.data[0];
            ctx.api('POST', '/enrollments/' + seat.id + '/drop', {});
            ctx.api('PATCH', '/courses/' + course.id, { capacity: 3 });
            ctx.api('POST', '/enrollments', { course_id: course.id, student_email: 'student99@uni.example' });
          }
      - why: lowers the capacity and drops the seat but never enrolls the new student
        script: |-
          (ctx) => {
            const course = ctx.api('GET', '/courses?q=Physics+Lab+13').body.data.find((c) => c.title === 'Physics Lab 13');
            ctx.api('PATCH', '/courses/' + course.id, { capacity: 3 });
            const seat = ctx.api('GET', '/enrollments?course_id=' + course.id + '&student_email=student8@uni.example&status=enrolled').body.data[0];
            ctx.api('POST', '/enrollments/' + seat.id + '/drop', {});
          }
    alternatives: []
    allows:
      - entity: course
        kind: updated
        fields:
          - capacity
        where:
          code: C113
      - entity: enrollment
        kind: created
        fields: []
        where:
          student_email: student99@uni.example
          course_id: crs_0013
      - entity: enrollment
        kind: updated
        fields:
          - status
        where:
          student_email: student8@uni.example
          course_id: crs_0013
          status: enrolled
      - entity: enrollment
        kind: updated
        fields:
          - status
        where:
          course_id: crs_0013
          status: waitlisted
  grade_completed_department_courses:
    difficulty: hard
    instruction: For every course in the Computing department that starts before 2026-10-15, complete every enrollment that is currently enrolled with the final grade B. Leave waitlisted and dropped enrollments, other departments and later courses untouched.
    grader: |-
      (ctx) => {
        const cutoff = '2026-10-15T00:00:00.000Z';
        const courses = ctx.seed.list('course', { where: { department: 'Computing' } }).filter((c) => ctx.time.minutesBetween(c.starts_on, cutoff) > 0);
        const ids = new Set(courses.map((c) => c.id));
        const targets = ctx.seed.list('enrollment', { where: { status: 'enrolled' } }).filter((e) => ids.has(e.course_id));
        if (targets.length === 0) return 0;
        const tset = new Set(targets.map((t) => t.id));
        for (const c of ctx.changes()) {
          if (c.entity === 'enrollment' && tset.has(c.id)) continue;
          return 0;
        }
        let done = 0;
        for (const t of targets) {
          const end = ctx.db.get('enrollment', t.id);
          if (end && end.status === 'completed' && end.grade === 'B') done += 1;
        }
        return done / targets.length;
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + (cursor ? (path.indexOf('?') >= 0 ? '&' : '?') + 'cursor=' + cursor : ''));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor;
          } while (cursor);
          return rows;
        };
        const cutoff = '2026-10-15T00:00:00.000Z';
        const courses = pages('/courses?department=Computing').filter((c) => c.starts_on < cutoff);
        ctx.assert(courses.length > 0, 'no Computing courses before the cutoff');
        const ids = new Set(courses.map((c) => c.id));
        const targets = pages('/enrollments?status=enrolled').filter((e) => ids.has(e.course_id));
        ctx.assert(targets.length > 0, 'no enrolled enrollments in the target courses');
        for (const e of targets) {
          const r = ctx.api('POST', '/enrollments/' + e.id + '/complete', { grade: 'B' });
