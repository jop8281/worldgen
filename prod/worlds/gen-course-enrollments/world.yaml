format: 1
meta:
  name: gen_course_enrollments
  description: "A course registrar world built from two imported tables. Courses have a department, credits, capacity and start date. Enrollments link a student email to a course and move through a lifecycle: waitlisted, enrolled, dropped or completed. Enrolling past capacity lands on the waitlist. Dropping an enrolled seat promotes the oldest waitlisted student, and an hourly job fills any seats that are free. Completing an enrollment requires a grade. Agents list and filter with paging, enroll, drop and grade students, and bulk-edit across a department."
  resembles: "University course registration system (Ellucian Banner / Canvas SIS style): course catalog with capacity limits, student enrollments, waitlists and grading"
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  course:
    description: A catalog course offering with department, credits, seat capacity and start date. Seats used are the enrollments of the course with status enrolled.
    idPrefix: crs
    fields:
      code:
        type: string
        description: Catalog code such as C101.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 20
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      department:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - Computing
          - Physics
          - History
          - Biology
          - Art
          - Math
      credits:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 6
      capacity:
        type: int
        description: Maximum enrolled seats. Lowering it below the seats used drops nobody.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      starts_on:
        type: datetime
        description: Course start date at 00:00:00Z.
        required: true
        nullable: false
        unique: false
        readonly: false
  enrollment:
    description: One student's seat or waitlist spot in a course, with a lifecycle status and an optional final grade. Created only by the enroll action.
    idPrefix: enr
    fields:
      code:
        type: string
        description: Registrar code such as E5001.
        required: true
        nullable: false
        unique: true
        readonly: true
        maxLength: 20
      course_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: course
        onDelete: restrict
      student_email:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
        format: email
      enrolled_on:
        type: datetime
        description: When the student asked for the seat. Orders the waitlist.
        required: true
        nullable: false
        unique: false
        readonly: true
      status:
        type: state
        description: Lifecycle. dropped and completed are final. Changed only by actions and jobs.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - waitlisted
          - enrolled
          - dropped
          - completed
        initial: waitlisted
        transitions:
          waitlisted:
            - enrolled
            - dropped
          enrolled:
            - dropped
            - completed
          dropped: []
          completed: []
      grade:
        type: enum
        description: Final grade. Null unless status is completed.
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - A
          - B
          - C
          - D
routes:
  list_courses:
    op: list
    entity: course
    filters:
      - department
      - credits
    search:
      - title
      - code
    sort:
      - starts_on
      - title
    pageSize: 25
    method: GET
    path: /courses
    description: List courses, paged.
  get_course:
    op: get
    entity: course
    method: GET
    path: /courses/{id}
    description: Fetch one course.
  create_course:
    op: create
    entity: course
    method: POST
    path: /courses
    description: Create a course.
  update_course:
    op: update
    entity: course
    method: PATCH
    path: /courses/{id}
    description: Edit a course such as capacity or start date.
  list_enrollments:
    op: list
    entity: enrollment
    filters:
      - course_id
      - status
      - grade
      - student_email
    search: []
    sort:
      - enrolled_on
    pageSize: 25
    method: GET
    path: /enrollments
    description: List enrollments, paged.
  get_enrollment:
    op: get
    entity: enrollment
    method: GET
    path: /enrollments/{id}
    description: Fetch one enrollment.
  list_course_enrollments:
    op: list
    entity: enrollment
    filters:
      - status
    search: []
    sort:
      - enrolled_on
    pageSize: 25
    method: GET
    path: /courses/{course_id}/enrollments
    description: List enrollments of one course.
actions:
  enroll_student:
    method: POST
    path: /enrollments
    description: Enroll a student in a course. Enrolled if a seat is free, otherwise waitlisted. Refuses a student who already holds an enrolled or waitlisted enrollment in the course.
    input:
      course_id:
        type: ref
        description: The course to join.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: course
        onDelete: restrict
      student_email:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
        format: email
    handler: |-
      (ctx) => {
        const course = ctx.db.get('course', ctx.body.course_id);
        if (course === null) ctx.fail(422, 'unknown_course', 'course ' + ctx.body.course_id + ' not found. List courses with GET /courses.');
        const email = ctx.body.student_email;
        const mine = ctx.db.list('enrollment', { where: { course_id: course.id } });
        const dup = mine.find((e) => e.student_email === email && (e.status === 'enrolled' || e.status === 'waitlisted'));
        if (dup) ctx.fail(409, 'already_enrolled', email + ' already holds ' + dup.status + ' enrollment ' + dup.id + ' in course ' + course.id + '.');
        const used = mine.filter((e) => e.status === 'enrolled').length;
        let max = 5000;
        for (const e of ctx.db.list('enrollment')) {
          const n = parseInt(String(e.code).slice(1), 10);
          if (!isNaN(n) && n > max) max = n;
        }
        let row = ctx.db.create('enrollment', { code: 'E' + (max + 1), course_id: course.id, student_email: email, enrolled_on: ctx.now(), grade: null });
        if (used < course.capacity) row = ctx.db.update('enrollment', row.id, { status: 'enrolled' });
        return { status: 201, body: row };
      }
  drop_enrollment:
    method: POST
    path: /enrollments/{id}/drop
    description: Drop an enrolled or waitlisted enrollment. A freed seat goes to the oldest waitlisted student of the course.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const e = ctx.db.get('enrollment', id);
        if (e === null) ctx.fail(404, 'not_found', 'enrollment ' + id + ' not found');
        if (e.status !== 'enrolled' && e.status !== 'waitlisted') ctx.fail(409, 'invalid_state', 'enrollment ' + id + ' is ' + e.status + '. Only enrolled and waitlisted enrollments can be dropped.');
        const wasEnrolled = e.status === 'enrolled';
        const updated = ctx.db.update('enrollment', id, { status: 'dropped' });
        if (wasEnrolled) {
          const course = ctx.db.get('course', e.course_id);
          const rows = ctx.db.list('enrollment', { where: { course_id: e.course_id } });
          let used = rows.filter((r) => r.status === 'enrolled').length;
          const queue = rows.filter((r) => r.status === 'waitlisted').sort((a, b) => a.enrolled_on < b.enrolled_on ? -1 : a.enrolled_on > b.enrolled_on ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
          for (const w of queue) {
            if (used >= course.capacity) break;
            ctx.db.update('enrollment', w.id, { status: 'enrolled' });
            used += 1;
          }
        }
        return { status: 200, body: updated };
      }
  complete_enrollment:
    method: POST
    path: /enrollments/{id}/complete
    description: Complete an enrolled enrollment with a final grade A, B, C or D.
    input:
      grade:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - A
          - B
          - C
          - D
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const e = ctx.db.get('enrollment', id);
        if (e === null) ctx.fail(404, 'not_found', 'enrollment ' + id + ' not found');
        if (e.status !== 'enrolled') ctx.fail(409, 'invalid_state', 'enrollment ' + id + ' is ' + e.status + '. Only enrolled enrollments can be completed.');
        const updated = ctx.db.update('enrollment', id, { status: 'completed', grade: ctx.body.grade });
        return { status: 200, body: updated };
      }
  promote_waitlist:
    method: POST
    path: /courses/{id}/promote_waitlist
    description: Fill the free seats of one course from its waitlist, oldest enrolled_on first then lowest id. Returns the promoted enrollments.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const course = ctx.db.get('course', id);
        if (course === null) ctx.fail(404, 'not_found', 'course ' + id + ' not found');
        const rows = ctx.db.list('enrollment', { where: { course_id: id } });
        let used = rows.filter((r) => r.status === 'enrolled').length;
        const queue = rows.filter((r) => r.status === 'waitlisted').sort((a, b) => a.enrolled_on < b.enrolled_on ? -1 : a.enrolled_on > b.enrolled_on ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
        const promoted = [];
        for (const w of queue) {
          if (used >= course.capacity) break;
          promoted.push(ctx.db.update('enrollment', w.id, { status: 'enrolled' }));
          used += 1;
        }
        return { status: 200, body: { promoted } };
      }
jobs:
  promote_waitlisted:
    description: Every hour, fill free seats of every course from its waitlist, oldest enrolled_on first then lowest id.
    every: 1h
    run: |-
      (ctx) => {
        const byCourse = {};
        for (const e of ctx.db.list('enrollment')) {
          if (e.status !== 'enrolled' && e.status !== 'waitlisted') continue;
          (byCourse[e.course_id] = byCourse[e.course_id] || []).push(e);
        }
        for (const cid of Object.keys(byCourse)) {
          const course = ctx.db.get('course', cid);
          if (course === null) continue;
          const rows = byCourse[cid];
          let used = rows.filter((r) => r.status === 'enrolled').length;
          const queue = rows.filter((r) => r.status === 'waitlisted').sort((a, b) => a.enrolled_on < b.enrolled_on ? -1 : a.enrolled_on > b.enrolled_on ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
          for (const w of queue) {
            if (used >= course.capacity) break;
            ctx.db.update('enrollment', w.id, { status: 'enrolled' });
            used += 1;
          }
        }
      }
