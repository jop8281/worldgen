revision: 2
software: 'University course registration system (Ellucian Banner / Canvas SIS style): course catalog with capacity limits, student enrollments, waitlists and grading'
summary: 'A course registrar world built from two imported tables. Courses have a department, credits, capacity and start date. Enrollments link a student email to a course and move through a lifecycle: waitlisted, enrolled, dropped or completed. Enrolling past capacity lands on the waitlist. Dropping an enrolled seat promotes the oldest waitlisted student, and an hourly job fills any seats that are free. Completing an enrollment requires a grade. Agents list and filter with paging, enroll, drop and grade students, and bulk-edit across a department. Revision 2: every task now declares an allows list taken from its instruction, so any change outside the named entities, kinds, fields and target rows scores 0.'
clock:
  start: 2026-10-06T09:00:00.000Z
  tick: 1s
verdict:
  kind: proceed
entities:
  - name: course
    purpose: A catalog course offering with department, credits, seat capacity and start date. Imported from courses.csv.
    keyFields:
      - code
      - title
      - department
      - credits
      - capacity
      - starts_on
  - name: enrollment
    purpose: One student's seat or waitlist spot in a course, with a lifecycle status and an optional final grade. Imported from enrollments.csv.
    keyFields:
      - code
      - course_id
      - student_email
      - enrolled_on
      - status
      - grade
workflows:
  - name: enrollment_lifecycle
    entity: enrollment
    states:
      - waitlisted
      - enrolled
      - dropped
      - completed
    rules:
      - enroll_student creates the enrollment. It is enrolled if enrolled seats of the course are below capacity, otherwise waitlisted.
      - Refuse with 409 if the student already holds an enrolled or waitlisted enrollment in that course. Refuse with 404 or 422 for an unknown course.
      - Transitions are waitlisted to enrolled or dropped, enrolled to dropped or completed. dropped and completed are final.
      - drop_enrollment works on enrolled and waitlisted enrollments. When an enrolled seat is freed, the oldest waitlisted enrollment of that course becomes enrolled.
      - complete_enrollment works only on enrolled enrollments, needs a grade of A, B, C or D, and records it. Other statuses give 409.
      - grade is null unless status is completed.
      - The standard update route cannot change status, grade, course_id or student_email.
    actions:
      - enroll_student
      - drop_enrollment
      - complete_enrollment
  - name: course_capacity
    entity: course
    states: []
    rules:
      - Seats used are the enrollments of the course with status enrolled.
      - promote_waitlist fills free seats from the waitlist, oldest enrolled_on first, then lowest id, and returns the promoted enrollments.
      - Lowering capacity below the seats used is allowed and does not drop anyone. No new seats are given until the used count falls below capacity.
      - The job promote_waitlisted applies the same promotion rule to every course each hour.
    lifecycle:
      representation: descriptive
      reason: Course capacity is derived from counting enrolled enrollments. No state field holds it.
    actions:
      - promote_waitlist
jobs:
  - name: promote_waitlisted
    every: 1h
    rule: For every course, count enrolled enrollments. While the count is below capacity and the course has waitlisted enrollments, set the oldest (enrolled_on, then id) to enrolled.
acceptanceTests: []
routes:
  - id: list_courses
    method: GET
    path: /courses
    purpose: List courses, paged, filter by department and credits, search by title or code, sort by starts_on or title.
  - id: get_course
    method: GET
    path: /courses/{id}
    purpose: Fetch one course.
  - id: create_course
    method: POST
    path: /courses
    purpose: Create a course.
  - id: update_course
    method: PATCH
    path: /courses/{id}
    purpose: Edit a course such as capacity or start date.
  - id: list_enrollments
    method: GET
    path: /enrollments
    purpose: List enrollments, paged, filter by course_id, status, grade and student_email, sort by enrolled_on.
  - id: get_enrollment
    method: GET
    path: /enrollments/{id}
    purpose: Fetch one enrollment.
  - id: list_course_enrollments
    method: GET
    path: /courses/{course_id}/enrollments
    purpose: List enrollments for one course, filter by status.
  - id: enroll_student
    method: POST
    path: /enrollments
    purpose: Action. Enroll a student in a course. Enrolled if a seat is free, otherwise waitlisted.
  - id: drop_enrollment
    method: POST
    path: /enrollments/{id}/drop
    purpose: Action. Drop an enrolled or waitlisted enrollment. A freed seat goes to the oldest waitlisted student.
  - id: complete_enrollment
    method: POST
    path: /enrollments/{id}/complete
    purpose: Action. Complete an enrolled enrollment with a grade.
  - id: promote_waitlist
    method: POST
    path: /courses/{id}/promote_waitlist
    purpose: Action. Fill the free seats of one course from its waitlist, oldest first.
seed:
  rowsPerEntity:
    course: 30
    enrollment: 210
  mix: Courses and enrollments come from the fixtures. Every enrollment course_id resolves to a course. The 6 departments appear in the courses. Capacity has 4 distinct values. Enrollment statuses are enrolled, dropped, completed and waitlisted, with none above 70%. About 25% of enrollments carry a grade, all of them completed. A few courses are full or over capacity, so the waitlist rules and the promotion job have work to do. 66 distinct students each hold several enrollments. 210 enrollments over 30 courses gives enough rows for paging.
tasks:
  - id: drop_student_from_course
    difficulty: easy
    intent: 'Drop the enrollment of one named student (an email from the seed) in one named course (by title). The student must hold an enrolled enrollment in it. The instruction tells the agent that a freed seat goes to the oldest waitlisted student. Graded on the enrollment ending as dropped with no collateral changes other than that permitted waitlist promotion. ALLOWS (from the instruction, not from the solution): (1) enrollment updated, fields [status], where {student_email: the named email, course_id: the named course, status: enrolled}; (2) enrollment updated, fields [status], where {course_id: the named course, status: waitlisted} for the promoted student. Nothing created, nothing deleted, no course changes.'
    decoyIdea: Drops the same student's enrollment in a different course with a similar title, or PATCHes status to dropped, which the standard route refuses, or drops all of the student's enrollments.
  - id: enroll_into_full_course
    difficulty: medium
    intent: "A named student asks to join a course that is already at capacity. Find the course by title, enroll the student through the enroll action so the student ends up waitlisted, then drop another named student's enrolled seat in that course (named by email in the instruction) to promote the oldest waitlisted student. Graded on the new enrollment being enrolled or waitlisted as the rules require, with the correct promotion, and no other student changed. ALLOWS (from the instruction): (1) enrollment created, where {student_email: the asking student, course_id: the named course}; (2) enrollment updated, fields [status], where {student_email: the student to drop, course_id: the named course, status: enrolled}; (3) enrollment updated, fields [status], where {course_id: the named course, status: waitlisted} for the promoted waitlisted student. No course edits (capacity must not change), no deletes, no other fields."
    decoyIdea: Raises the course capacity with PATCH to force a seat instead of using the waitlist, or drops a different student than named, or promotes a student other than the oldest waitlisted one.
  - id: grade_completed_department_courses
    difficulty: hard
    intent: "For every Computing course starting before a stated date, complete every enrolled enrollment with grade B, paging through the courses and enrollments lists. Graded as the fraction of target enrollments completed with B, with a guard against collateral changes to other departments, waitlisted students or dropped ones. ALLOWS (from the instruction): one entry per Computing course starting before the stated date, each enrollment updated, fields [status, grade], where {course_id: that course, status: enrolled}. The where of a course covers only that course's enrolled rows, so other departments, later start dates, waitlisted, dropped and already completed enrollments are outside it. Nothing created, nothing deleted, no course changes."
    decoyIdea: Reads only the first page of enrollments, or includes the Physics department, or completes waitlisted and dropped enrollments, or compares dates as the wrong year, or grades the first course only.
    pressure:
      paging: enrollment
      states:
        - enrollment.enrolled
        - enrollment.waitlisted
        - enrollment.dropped
open_questions:
  - question: Should the waitlist promotion that follows a drop be allowed for every task that drops a seat?
    default_answer: Yes, but only where the instruction tells the agent a freed seat goes to the oldest waitlisted student, and only for waitlisted enrollments of the same course, changing status.
  - question: The allows where can match one value per field. How should a department-wide task name its target rows?
    default_answer: 'One allows entry per Computing course starting before the stated date, each with where {course_id, status: enrolled}.'
  - question: Should the enroll task allow editing the course capacity?
    default_answer: No. The instruction asks for the waitlist path, so no course update is allowed.
assumptions:
  - decision: clock.start is 2026-10-06T09:00:00Z and tick is 1s.
    why: The environment date is 2026-10-06. It is assumed to be after every enrolled_on in the data (the sample is 2026-08-28). Course starts_on dates such as 2026-11-02 are in the future, so they are the scheduled events. Tick 1s gives distinct timestamps for calls.
  - decision: The imported course_id (C101) and enrollment_id (E5001) become a unique string field `code` on each entity. Rows get engine ids crs_0001 and enr_0001. The enrollment course_id field is a ref to course, mapped from the course code by the seed.
    why: Engine ids are generated. Keeping the source keys lets agents and tasks refer to the codes users know.
  - decision: No student entity. student_email stays a string field on enrollment with an email format.
    why: The input has only the email. 66 distinct emails identify students and no other student attributes exist.
  - decision: 'Enrollment status is a state machine: waitlisted to enrolled or dropped, enrolled to dropped or completed, and dropped and completed are final. status, grade and enrolled_on are readonly in the standard routes, and only actions, jobs and seed change them. Enrollments are created only through the enroll action.'
    why: Capacity, waitlist and grade rules cannot be bypassed by a plain PATCH. This also makes the task decoys that PATCH the status measurable.
  - decision: Seats used by a course equal its enrollments with status enrolled. Completed and dropped enrollments free their seat. Completed enrollments are treated as having left the seat count.
    why: This is the usual registrar convention. The input has no seat counter, so it is computed from rows to avoid a stored total that could disagree with the data.
  - decision: Imported grades are kept only on completed enrollments. Grade is nullable and set by the complete action. The data says 75% null, so about 52 grades exist. Any imported grade on a non-completed row is cleared or the row is set to completed by the seed.
    why: A grade on a dropped or waitlisted enrollment is inconsistent. The 25% non-null share is about the same as the share of completed rows.
  - decision: 'Duplicate active enrollment is refused: the same student_email cannot hold two non-dropped enrollments (enrolled or waitlisted) in one course. A student can re-enroll after dropping.'
    why: This is standard registrar behavior. The data has 66 students over 210 rows, so repeats across courses are normal and repeats within a course are only possible after a drop.
  - decision: The job promote_waitlisted runs every 1h. For each course with free seats it moves waitlisted enrollments to enrolled, oldest enrolled_on first, then lowest id.
    why: This models automatic waitlist handling. drop_enrollment does the same inline for its own course, so tasks do not depend on the clock.
  - decision: Credits are 1 to 6, capacity is at least 1, and department is an enum of Computing, Physics, History, Biology, Art and Math.
    why: The data has 4 distinct credits and capacities. The department enum is taken from the input.
  - decision: starts_on and enrolled_on are stored as datetime at 00:00:00Z.
    why: The engine has a datetime type and no date-only type. Source values are ISO dates.
  - decision: No registration window rule is enforced against starts_on.
    why: The sample data has enrollments made after a course start. Enforcing it would reject imported rows, so it is not a rule.
  - decision: An action-created enrollment gets enrolled_on equal to the engine time and a code like E<next number> continuing after the highest imported code.
    why: Callers send only the course and the student. The code keeps the E5001 style.
  - decision: Each task's allows list is written into the task intent, taken from what its instruction permits. It is built from entity, kind, exact fields for updates, and a where of seed field values that picks the target rows. Because where matches a single value per field, a department-wide task gets one allows entry per target course. The waitlist promotion in a drop is permitted only where the instruction tells the agent about it.
    why: The plan task shape has no allows field, so the intent carries it for the tasks stage to turn into the engine's allows guard. Job changes and engine timestamps are exempt from the guard.
  - decision: The request changes only the three tasks. No entity, route, workflow rule, job or test changes, so changes lists only tasks.* items.
    why: The change request asks only for allows lists on tasks. Workflow rules stay as they were.
outOfScope:
  - what: Authentication, student and instructor accounts, and permissions
    why: The input has no users beyond emails. Agents act as the registrar.
  - what: Prerequisites, schedules, rooms, instructors and time conflicts
    why: None of these are in the data.
  - what: Tuition, billing and refunds
    why: The data has no money fields.
  - what: GPA calculation and transcripts
    why: Grades are stored per enrollment only. Aggregates are not in the input.
  - what: Notification emails for promotion from the waitlist
    why: There is no outbound email in the world.
  - what: Deleting courses and enrollments
    why: Registrars keep records. Drop is the supported way to end an enrollment.
changes:
  - tasks.drop_student_from_course
  - tasks.enroll_into_full_course
  - tasks.grade_completed_department_courses
