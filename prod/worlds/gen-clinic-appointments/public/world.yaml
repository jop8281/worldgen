  get_patient:
    op: get
    entity: patient
    method: GET
    path: /patients/{id}
  create_patient:
    op: create
    entity: patient
    method: POST
    path: /patients
  update_patient:
    op: update
    entity: patient
    method: PATCH
    path: /patients/{id}
  list_slots:
    op: list
    entity: slot
    filters:
      - doctor_id
      - status
    search: []
    sort:
      - starts_at
    pageSize: 25
    method: GET
    path: /slots
  get_slot:
    op: get
    entity: slot
    method: GET
    path: /slots/{id}
  create_slot:
    op: create
    entity: slot
    method: POST
    path: /slots
  update_slot:
    op: update
    entity: slot
    method: PATCH
    path: /slots/{id}
  list_appointments:
    op: list
    entity: appointment
    filters:
      - status
      - patient_id
      - doctor_id
      - slot_id
    search: []
    sort:
      - starts_at
    pageSize: 25
    method: GET
    path: /appointments
  get_appointment:
    op: get
    entity: appointment
    method: GET
    path: /appointments/{id}
  list_patient_appointments:
    op: list
    entity: appointment
    filters:
      - status
      - doctor_id
    search: []
    sort:
      - starts_at
    pageSize: 25
    method: GET
    path: /patients/{patient_id}/appointments
actions:
  book_appointment:
    method: POST
    path: /slots/{id}/book
    description: Book an open slot for a patient. Refused with 409 slot_taken unless the slot is open, slot_in_past unless it starts after now, doctor_inactive, patient_blocked, and patient_conflict when the patient holds a booked or checked_in appointment that overlaps. Copies doctor_id and starts_at onto the new appointment and sets the slot to booked.
    input:
      patient_id:
        type: ref
        description: The patient who books the slot.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: patient
        onDelete: restrict
      reason:
        type: text
        description: Why the patient is visiting. Must not be blank.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
       const id = ctx.params.id;
       const slot = ctx.db.get('slot', id);
       if (slot === null) ctx.fail(404, 'not_found', 'slot ' + id + ' not found');
       const reason = ctx.body.reason.trim();
       if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for book_appointment: reason expected a non-blank text');
       const patient = ctx.db.get('patient', ctx.body.patient_id);
       if (patient === null) ctx.fail(422, 'unknown_patient', 'patient ' + ctx.body.patient_id + ' not found. List patients with GET /patients.');
       if (slot.status !== 'open') ctx.fail(409, 'slot_taken', 'slot ' + id + ' is ' + slot.status + ' and cannot be booked. List open slots with GET /slots?status=open.');
       const now = ctx.now();
       if (ctx.time.minutesBetween(now, slot.starts_at) <= 0) ctx.fail(409, 'slot_in_past', 'slot ' + id + ' starts at ' + slot.starts_at + ', which is not after ' + now + '.');
       const doctor = ctx.db.get('doctor', slot.doctor_id);
       if (doctor === null || !doctor.active) ctx.fail(409, 'doctor_inactive', 'doctor ' + slot.doctor_id + ' is inactive and cannot take bookings.');
       if (patient.booking_blocked) ctx.fail(409, 'patient_blocked', 'patient ' + patient.id + ' is blocked from booking after ' + patient.no_show_count + ' no-shows.');
       for (const a of ctx.db.list('appointment', { where: { patient_id: patient.id } })) {
        if (a.status !== 'booked' && a.status !== 'checked_in') continue;
        const other = ctx.db.get('slot', a.slot_id);
        if (other === null) continue;
        if (ctx.time.minutesBetween(other.starts_at, slot.ends_at) > 0 && ctx.time.minutesBetween(slot.starts_at, other.ends_at) > 0) ctx.fail(409, 'patient_conflict', 'patient ' + patient.id + ' already holds appointment ' + a.id + ' at ' + other.starts_at + ', which overlaps this slot.');
       }
       const apt = ctx.db.create('appointment', { slot_id: slot.id, patient_id: patient.id, doctor_id: slot.doctor_id, starts_at: slot.starts_at, reason });
       ctx.db.update('slot', slot.id, { status: 'booked' });
       return { status: 201, body: apt };
      }
  cancel_appointment:
    method: POST
    path: /appointments/{id}/cancel
    description: Cancel a booked appointment whose visit starts at least 24 hours from now (exactly 24h is allowed). Stores cancel_reason, sets cancelled_at and returns the slot to open. Otherwise 409 cancellation_window_closed.
    input:
      cancel_reason:
        type: text
        description: Why the appointment is cancelled. Must not be blank.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
       const id = ctx.params.id;
       const a = ctx.db.get('appointment', id);
       if (a === null) ctx.fail(404, 'not_found', 'appointment ' + id + ' not found');
       const why = ctx.body.cancel_reason.trim();
       if (why === '') ctx.fail(400, 'input.invalid', 'Invalid input for cancel_appointment: cancel_reason expected a non-blank text');
       if (a.status !== 'booked') ctx.fail(409, 'invalid_state', 'appointment ' + id + ' is ' + a.status + '. Only booked appointments can be cancelled.');
       const slot = ctx.db.get('slot', a.slot_id);
       const now = ctx.now();
       if (ctx.time.minutesBetween(now, slot.starts_at) < 1440) ctx.fail(409, 'cancellation_window_closed', 'appointment ' + id + ' starts at ' + slot.starts_at + ', less than 24 hours from ' + now + '. It can no longer be cancelled.');
       const updated = ctx.db.update('appointment', id, { status: 'cancelled', cancel_reason: why, cancelled_at: now });
       ctx.db.update('slot', slot.id, { status: 'open' });
       return { status: 200, body: updated };
      }
  check_in_appointment:
    method: POST
    path: /appointments/{id}/check_in
    description: Check in a booked appointment. Allowed from 30 minutes before the slot starts until the slot ends. 409 too_early or too_late otherwise.
    input: {}
    handler: |-
      (ctx) => {
       const id = ctx.params.id;
       const a = ctx.db.get('appointment', id);
       if (a === null) ctx.fail(404, 'not_found', 'appointment ' + id + ' not found');
       if (a.status !== 'booked') ctx.fail(409, 'invalid_state', 'appointment ' + id + ' is ' + a.status + '. Only booked appointments can be checked in.');
       const slot = ctx.db.get('slot', a.slot_id);
       const now = ctx.now();
       if (ctx.time.minutesBetween(now, slot.starts_at) > 30) ctx.fail(409, 'too_early', 'check-in opens 30 minutes before ' + slot.starts_at + '.');
       if (ctx.time.minutesBetween(slot.ends_at, now) > 0) ctx.fail(409, 'too_late', 'the visit ended at ' + slot.ends_at + '. Check-in is closed.');
       const updated = ctx.db.update('appointment', id, { status: 'checked_in', checked_in_at: now });
       return { status: 200, body: updated };
      }
  complete_appointment:
    method: POST
    path: /appointments/{id}/complete
    description: Complete a checked_in appointment.
    input: {}
    handler: |-
      (ctx) => {
       const id = ctx.params.id;
       const a = ctx.db.get('appointment', id);
       if (a === null) ctx.fail(404, 'not_found', 'appointment ' + id + ' not found');
       if (a.status !== 'checked_in') ctx.fail(409, 'invalid_state', 'appointment ' + id + ' is ' + a.status + '. Only checked_in appointments can be completed.');
       const updated = ctx.db.update('appointment', id, { status: 'completed' });
       return { status: 200, body: updated };
      }
  mark_no_show:
    method: POST
    path: /appointments/{id}/no_show
    description: Record a booked appointment as no_show once the slot has started. Increments the patient's no_show_count and blocks booking at 3. The slot stays booked.
    input: {}
    handler: |-
      (ctx) => {
       const id = ctx.params.id;
       const a = ctx.db.get('appointment', id);
       if (a === null) ctx.fail(404, 'not_found', 'appointment ' + id + ' not found');
       if (a.status !== 'booked') ctx.fail(409, 'invalid_state', 'appointment ' + id + ' is ' + a.status + '. Only booked appointments can be marked no-show.');
       const slot = ctx.db.get('slot', a.slot_id);
       const now = ctx.now();
       if (ctx.time.minutesBetween(slot.starts_at, now) < 0) ctx.fail(409, 'too_early', 'appointment ' + id + ' starts at ' + slot.starts_at + '. A no-show can be recorded once the visit time has come.');
       const updated = ctx.db.update('appointment', id, { status: 'no_show' });
       const p = ctx.db.get('patient', a.patient_id);
       const count = p.no_show_count + 1;
       ctx.db.update('patient', p.id, { no_show_count: count, booking_blocked: count >= 3 ? true : p.booking_blocked });
       return { status: 200, body: updated };
      }
jobs:
  close_expired_slots:
    description: Every hour. An open slot whose starts_at has passed becomes closed.
    every: 1h
    run: |-
      (ctx) => {
       const now = ctx.now();
       for (const s of ctx.db.list('slot', { where: { status: 'open' } })) {
        if (ctx.time.minutesBetween(s.starts_at, now) < 0) continue;
        ctx.db.update('slot', s.id, { status: 'closed' });
       }
      }
  auto_no_show:
    description: Every 30 minutes. A booked appointment whose slot ended more than 30 minutes ago becomes no_show, with the same patient counter and 3-strike block as mark_no_show.
    every: 30m
    run: |-
      (ctx) => {
       const now = ctx.now();
       for (const a of ctx.db.list('appointment', { where: { status: 'booked' } })) {
        const slot = ctx.db.get('slot', a.slot_id);
        if (slot === null || ctx.time.minutesBetween(slot.ends_at, now) <= 30) continue;
        ctx.db.update('appointment', a.id, { status: 'no_show' });
        const p = ctx.db.get('patient', a.patient_id);
        const count = p.no_show_count + 1;
        ctx.db.update('patient', p.id, { no_show_count: count, booking_blocked: count >= 3 ? true : p.booking_blocked });
       }
      }
