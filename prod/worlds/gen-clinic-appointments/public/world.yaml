format: 1
meta:
  name: world
  description: A single-clinic scheduling system. Doctors publish time slots. Patients book one open slot at a time, so a slot can never be double booked. A booked appointment can be cancelled only if the visit starts at least 24 hours from now, and cancelling frees the slot. After the visit time the front desk checks patients in and completes them, or marks them as no-show. No-shows are counted per patient, and 3 of them block further booking. Time-based jobs auto-close expired open slots and auto-mark no-shows. The clock moves only through jobs and explicit advances.
  resembles: Jane App / Zocdoc-style clinic appointment scheduling API
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  doctor:
    description: A clinician who owns time slots. Inactive doctors (on leave or left the clinic) cannot take new bookings.
    idPrefix: doc
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      specialty:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - general_practice
          - cardiology
          - dermatology
          - pediatrics
          - orthopedics
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      active:
        type: bool
        description: false when the doctor is on leave or has left. Inactive doctors cannot be booked.
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  patient:
    description: A person who books visits. Tracks no-show history and a booking block set by the workflow.
    idPrefix: pat
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      phone:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 40
      no_show_count:
        type: int
        description: Number of this patient's appointments recorded as no_show. Incremented by the no-show action and job.
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      booking_blocked:
        type: bool
        description: true once no_show_count reaches 3. A blocked patient cannot book.
        required: true
        nullable: false
        unique: false
        readonly: true
        default: false
  slot:
    description: A bookable time window [starts_at, ends_at) on one doctor's calendar. The slot's own status is what prevents double booking.
    idPrefix: slt
    fields:
      doctor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: doctor
        onDelete: restrict
      starts_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      ends_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        description: open can be booked or closed. booked returns to open only through cancel. closed is final.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - open
          - booked
          - closed
        initial: open
        transitions:
          open:
            - booked
            - closed
          booked:
            - open
          closed: []
  appointment:
    description: A patient's claim on one slot, with its visit outcome. Created only by book_appointment and changed only by actions and jobs.
    idPrefix: apt
    fields:
      slot_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: slot
        onDelete: restrict
      patient_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: patient
        onDelete: restrict
      doctor_id:
        type: ref
        description: Copied from the slot at booking.
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: doctor
        onDelete: restrict
      starts_at:
        type: datetime
        description: Copied from the slot at booking.
        required: true
        nullable: false
        unique: false
        readonly: true
      status:
        type: state
        description: booked can go to checked_in, cancelled or no_show. checked_in can go to completed. completed, cancelled and no_show are final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - booked
          - checked_in
          - completed
          - cancelled
          - no_show
        initial: booked
        transitions:
          booked:
            - checked_in
            - cancelled
            - no_show
          checked_in:
            - completed
          completed: []
          cancelled: []
          no_show: []
      reason:
        type: text
        description: Why the patient is visiting.
        required: true
        nullable: false
        unique: false
        readonly: true
      cancel_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      cancelled_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      checked_in_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
