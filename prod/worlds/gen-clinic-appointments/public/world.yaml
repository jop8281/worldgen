; return items.map((it) => { const status = it.status || 'open'; const created = P(M0, -(ctx.int(16, 60) * 1440) + ctx.int(0, 600)); const updated = status === 'open' ? created : P(created, ctx.int(1, 10) * 1440 + ctx.int(0, 600)); return { doctor_id: docs[it.d].id, starts_at: it.start, ends_at: it.end, status, created_at: created, updated_at: updated }; }); }"
  appointment: "(ctx) => { const now = ctx.now(); const P = (iso, m) => { const dc = (y, mo, d) => { y -= mo <= 2 ? 1 : 0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5) + d - 1; return era * 146097 + yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy - 719468; }; const n = dc(+iso.slice(0, 4), +iso.slice(5, 7), +iso.slice(8, 10)) * 1440 + (+iso.slice(11, 13)) * 60 + (+iso.slice(14, 16)) + m; const days = Math.floor(n / 1440); const rem = n - days * 1440; const z = days + 719468; const era = Math.floor(z / 146097); const doe = z - era * 146097; const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365); const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100)); const mp = Math.floor((5 * doy + 2) / 153); const d = doy - Math.floor((153 * mp + 2) / 5) + 1; const mo = mp < 10 ? mp + 3 : mp - 9; const y = yoe + era * 400 + (mo <= 2 ? 1 : 0); const p = (x, w) => String(x).padStart(w, '0'); return p(y, 4) + '-' + p(mo, 2) + '-' + p(d, 2) + 'T' + p(Math.floor(rem / 60), 2) + ':' + p(rem % 60, 2) + iso.slice(16); }; const M0 = now.slice(0, 10) + 'T00:00:00.000Z'; const weekday = iso => { const year = +iso.slice(0,4), month = +iso.slice(5,7), day = +iso.slice(8,10); const a = Math.floor((14-month)/12), y = year-a, m = month+12*a-2; return (day+y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)+Math.floor(31*m/12))%7; }; const businessStart = (days,hour) => { let at=P(M0,days*1440+hour*60); while(weekday(at)===0||weekday(at)===6) at=P(at,1440); return at; }; const slots = ctx.rows('slot'); const patients = ctx.rows('patient'); const docs = ctx.rows('doctor'); const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = ctx.int(0, i); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }; const mins = (st) => ctx.time.minutesBetween(now, st); const maria = patients[0]; const daniel = patients[1]; const pool = patients.slice(2); const busy = {}; const isFree = (p, s) => !(busy[p.id] && busy[p.id][s.starts_at]); const hold = (p, s) => { if (!busy[p.id]) busy[p.id] = {}; busy[p.id][s.starts_at] = true; }; const assign = (s, allowBlocked) => { for (let t = 0; t < 500; t++) { const p = pool[ctx.int(0, pool.length - 1)]; if (p.booking_blocked && !allowBlocked) continue; if (!isFree(p, s)) continue; hold(p, s); return p; } throw new Error('no free patient for ' + s.id); }; const reasons = ['Annual physical exam', 'Follow-up on blood test results', 'Persistent cough for two weeks', 'Skin rash on forearm', 'Lower back pain', 'Blood pressure check', 'Child vaccination review', 'Knee pain after running', 'Chest tightness during exercise', 'Medication review', 'Migraine headaches', 'Mole check', 'Ear infection', 'Sports injury assessment']; const cancelReasons = ['Patient has a work conflict', 'Feeling better, no longer needs the visit', 'Travelling that week', 'Booked a closer clinic', 'Family emergency', 'Child is sick, need to reschedule']; const rows = []; const live = {}; const add = (s, p, status, x) => { if (status !== 'cancelled') live[s.id] = p.id; rows.push(Object.assign({ slot_id: s.id, patient_id: p.id, doctor_id: s.doctor_id, starts_at: s.starts_at, status, reason: ctx.pick(reasons), cancel_reason: null, cancelled_at: null, checked_in_at: null }, x)); }; const booked = slots.filter((s) => s.status === 'booked'); const nearStart = businessStart(0, 16); const farStart = businessStart(4, 14); const near = booked.find((s) => s.doctor_id === docs[3].id && s.starts_at === nearStart); const far = booked.find((s) => s.doctor_id === docs[4].id && s.starts_at === farStart); for (const s of [far, near]) { hold(maria, s); const c = P(now, -ctx.int(3000, 9000)); add(s, maria, 'booked', { created_at: c, updated_at: c }); } const isAnchor = (s) => s === near || s === far; const inWin = (s) => s.starts_at >= M0 && mins(s.starts_at) >= -29 && mins(s.starts_at) <= 30; for (const s of booked.filter((x) => !isAnchor(x) && inWin(x))) { const p = assign(s, false); const c = P(now, -ctx.int(1500, 9000)); const ci = P(now, -ctx.int(2, 25)); add(s, p, 'checked_in', { checked_in_at: ci, created_at: c, updated_at: ci }); } const rest = booked.filter((s) => !isAnchor(s) && !inWin(s)); const future = rest.filter((s) => mins(s.starts_at) > 0); const past = rest.filter((s) => mins(s.starts_at) <= 0); for (const s of future) { const p = assign(s, false); const c = P(now, -ctx.int(60, 12000)); add(s, p, 'booked', { created_at: c, updated_at: c }); } const yStart = P(M0, -1440); const yest = shuffle(past.filter((s) => s.starts_at >= yStart)); const older = shuffle(past.filter((s) => s.starts_at < yStart)); const recentOld = older.slice().sort((a,b) => a.starts_at > b.starts_at ? -1 : a.starts_at < b.starts_at ? 1 : 0); const dist = recentOld.slice(0, 4); let R = older.filter((s) => !dist.includes(s)); const queue = []; for (const p of patients) for (let i = 0; i < p.no_show_count; i++) queue.push(p); shuffle(queue); for (const p of queue) { const idx = R.findIndex((s) => isFree(p, s)); if (idx < 0) throw new Error('no slot for no-show of ' + p.id); const s = R.splice(idx, 1)[0]; hold(p, s); const c = P(s.starts_at, -(ctx.int(1, 10) * 1440 + ctx.int(0, 600))); add(s, p, 'no_show', { created_at: c, updated_at: P(s.starts_at, ctx.int(95, 300)) }); } const done = R.concat(yest.slice(30)); let spec = 0; for (const s of done) { let p = null; if (spec === 0 && isFree(maria, s)) { p = maria; hold(p, s); spec = 1; } else if (spec === 1 && isFree(daniel, s)) { p = daniel; hold(p, s); spec = 2; } else p = assign(s, true); const c = P(s.starts_at, -(ctx.int(1, 10) * 1440 + ctx.int(0, 600))); add(s, p, 'completed', { created_at: c, updated_at: P(s.starts_at, ctx.int(35, 110)) }); } for (const s of dist.concat(yest.slice(0, 30))) { const p = assign(s, false); const c = P(s.starts_at, -(ctx.int(1, 10) * 1440 + ctx.int(0, 600))); add(s, p, 'booked', { created_at: c, updated_at: c }); } const priya = docs[0].id; const openFuture = shuffle(slots.filter((s) => s.status === 'open' && mins(s.starts_at) > 0 && s.doctor_id !== priya)); const rebooked = shuffle(future.filter((s) => s.doctor_id !== priya)); const targets = openFuture.slice(0, 20).concat(rebooked.slice(0, 5)); for (const s of targets) { let p = pool[ctx.int(0, pool.length - 1)]; while (p.id === live[s.id]) p = pool[ctx.int(0, pool.length - 1)]; const a = P(now, -60); const b = P(s.starts_at, -1440); const latest = a < b ? a : b; const at = P(latest, -ctx.int(0, 3000)); const c = P(at, -ctx.int(300, 6000)); add(s, p, 'cancelled', { cancel_reason: ctx.pick(cancelReasons), cancelled_at: at, created_at: c, updated_at: at }); } rows.sort((x, y) => (x.starts_at < y.starts_at ? -1 : x.starts_at > y.starts_at ? 1 : 0)); return rows; }"
tests:
  book_appointment_rules:
    description: book_appointment books an open slot, copies doctor and start onto the appointment, and refuses a taken slot, blank or missing reason, unknown slot or patient, a slot starting now, an inactive doctor and an overlapping patient booking. Adjacent slots are fine.
    script: |-
      (ctx) => {
       const t0 = ctx.now();
       const plus = (iso, m) => { const dc = (y, mo, d) => { y -= mo <= 2 ? 1 : 0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5) + d - 1; return era * 146097 + yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy - 719468; }; const n = dc(+iso.slice(0, 4), +iso.slice(5, 7), +iso.slice(8, 10)) * 1440 + (+iso.slice(11, 13)) * 60 + (+iso.slice(14, 16)) + m; const days = Math.floor(n / 1440); const rem = n - days * 1440; const z = days + 719468; const era = Math.floor(z / 146097); const doe = z - era * 146097; const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365); const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100)); const mp = Math.floor((5 * doy + 2) / 153); const d = doy - Math.floor((153 * mp + 2) / 5) + 1; const mo = mp < 10 ? mp + 3 : mp - 9; const y = yoe + era * 400 + (mo <= 2 ? 1 : 0); const p = (x, w) => String(x).padStart(w, '0'); return p(y, 4) + '-' + p(mo, 2) + '-' + p(d, 2) + 'T' + p(Math.floor(rem / 60), 2) + ':' + p(rem % 60, 2) + iso.slice(16); };
       const at = (m) => plus(t0, m);
       const ok = (r, m) => ctx.assert(r.status >= 200 && r.status < 300, m + ': ' + r.status + ' ' + JSON.stringify(r.body));
       const doc = (n) => { const r = ctx.api('POST', '/doctors', { name: 'Dr ' + n, specialty: 'cardiology', email: n + '@clinic.example' }); ok(r, 'create doctor'); return r.body; };
       const pat = (n) => { const r = ctx.api('POST', '/patients', { name: 'Pat ' + n, email: n + '@mail.example', phone: '555-0100' }); ok(r, 'create patient'); return r.body; };
       const slot = (d, s, e) => { const r = ctx.api('POST', '/slots', { doctor_id: d.id, starts_at: at(s), ends_at: at(e) }); ok(r, 'create slot'); return r.body; };
       const book = (s, p, reason) => ctx.api('POST', '/slots/' + s.id + '/book', { patient_id: p.id, reason });
       const code = (r) => (r.body && r.body.error ? r.body.error.code : null);
       const d1 = doc('amy'); const d2 = doc('ben'); const d4 = doc('fox'); const p1 = pat('cara'); const p2 = pat('dev');
       const s1 = slot(d1, 2880, 2910);
       const r = book(s1, p1, '  follow-up consultation  ');
       ctx.assert(r.status === 201, 'book returned ' + r.status + ' ' + JSON.stringify(r.body));
       ctx.assert(r.body.status === 'booked' && r.body.slot_id === s1.id && r.body.patient_id === p1.id && r.body.doctor_id === d1.id && r.body.starts_at === s1.starts_at && r.body.reason === 'follow-up consultation', 'appointment fields: ' + JSON.stringify(r.body));
       ctx.assert(ctx.api('GET', '/slots/' + s1.id).body.status === 'booked', 'slot is booked');
       const taken = book(s1, p2, 'checkup');
       ctx.assert(taken.status === 409 && code(taken) === 'slot_taken', 'double booking: ' + JSON.stringify(taken));
       ctx.assert(ctx.api('GET', '/appointments?slot_id=' + s1.id).body.data.length === 1, 'one appointment on the slot');
       const blank = book(s1, p2, '   ');
       ctx.assert(blank.status === 400 && code(blank) === 'input.invalid', 'blank reason: ' + JSON.stringify(blank));
       const none = ctx.api('POST', '/slots/' + s1.id + '/book', { patient_id: p2.id });
       ctx.assert(none.status === 400 && code(none) === 'input.invalid', 'missing reason: ' + JSON.stringify(none));
       const nos = book({ id: 'slt_9999' }, p2, 'checkup');
       ctx.assert(nos.status === 404 && code(nos) === 'not_found', 'unknown slot: ' + JSON.stringify(nos));
       const s2 = slot(d2, 4000, 4030);
       const nop = ctx.api('POST', '/slots/' + s2.id + '/book', { patient_id: 'pat_9999', reason: 'checkup' });
       ctx.assert(nop.status >= 400 && nop.status < 500, 'unknown patient: ' + JSON.stringify(nop));
       const s0 = slot(d2, 0, 30);
       const past = book(s0, p2, 'checkup');
       ctx.assert(past.status === 409 && code(past) === 'slot_in_past', 'slot starting now: ' + JSON.stringify(past));
       const d3 = doc('eve');
       ok(ctx.api('PATCH', '/doctors/' + d3.id, { active: false }), 'deactivate doctor');
       const s3 = slot(d3, 2880, 2910);
       const inactive = book(s3, p2, 'checkup');
       ctx.assert(inactive.status === 409 && code(inactive) === 'doctor_inactive', 'inactive doctor: ' + JSON.stringify(inactive));
       ctx.assert(ctx.api('GET', '/slots/' + s3.id).body.status === 'open', 'refused booking leaves the slot open');
       const s4 = slot(d4, 2895, 2925);
       const conflict = book(s4, p1, 'checkup');
       ctx.assert(conflict.status === 409 && code(conflict) === 'patient_conflict', 'overlap: ' + JSON.stringify(conflict));
       const s5 = slot(d2, 2910, 2940);
       ctx.assert(book(s5, p1, 'checkup').status === 201, 'adjacent slot books');
       ctx.assert(book(s4, p2, 'checkup').status === 201, 'another patient books the overlapping slot');
      }
  cancel_appointment_window:
    description: cancel_appointment allows a visit exactly 24h away, stores the reason and reopens the slot (which can be rebooked). A visit 23h59m away is refused with cancellation_window_closed. Missing reason, repeat cancel and unknown id are refused.
    script: |-
      (ctx) => {
       const t0 = ctx.now();
       const plus = (iso, m) => { const dc = (y, mo, d) => { y -= mo <= 2 ? 1 : 0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5) + d - 1; return era * 146097 + yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy - 719468; }; const n = dc(+iso.slice(0, 4), +iso.slice(5, 7), +iso.slice(8, 10)) * 1440 + (+iso.slice(11, 13)) * 60 + (+iso.slice(14, 16)) + m; const days = Math.floor(n / 1440); const rem = n - days * 1440; const z = days + 719468; const era = Math.floor(z / 146097); const doe = z - era * 146097; const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365); const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100)); const mp = Math.floor((5 * doy + 2) / 153); const d = doy - Math.floor((153 * mp + 2) / 5) + 1; const mo = mp < 10 ? mp + 3 : mp - 9; const y = yoe + era * 400 + (mo <= 2 ? 1 : 0); const p = (x, w) => String(x).padStart(w, '0'); return p(y, 4) + '-' + p(mo, 2) + '-' + p(d, 2) + 'T' + p(Math.floor(rem / 60), 2) + ':' + p(rem % 60, 2) + iso.slice(16); };
       const at = (m) => plus(t0, m);
       const ok = (r, m) => ctx.assert(r.status >= 200 && r.status < 300, m + ': ' + r.status + ' ' + JSON.stringify(r.body));
       const doc = (n) => { const r = ctx.api('POST', '/doctors', { name: 'Dr ' + n, specialty: 'dermatology', email: n + '@clinic.example' }); ok(r, 'create doctor'); return r.body; };
       const pat = (n) => { const r = ctx.api('POST', '/patients', { name: 'Pat ' + n, email: n + '@mail.example' }); ok(r, 'create patient'); return r.body; };
       const slot = (d, s, e) => { const r = ctx.api('POST', '/slots', { doctor_id: d.id, starts_at: at(s), ends_at: at(e) }); ok(r, 'create slot'); return r.body; };
       const book = (s, p) => { const r = ctx.api('POST', '/slots/' + s.id + '/book', { patient_id: p.id, reason: 'skin check' }); ctx.assert(r.status === 201, 'book: ' + r.status + ' ' + JSON.stringify(r.body)); return r.body; };
       const code = (r) => (r.body && r.body.error ? r.body.error.code : null);
       const d1 = doc('fay'); const d2 = doc('gus'); const p1 = pat('hal'); const p2 = pat('ida'); const p3 = pat('jon');
       const sa = slot(d1, 1440, 1470);
       const a1 = book(sa, p1);
       const r = ctx.api('POST', '/appointments/' + a1.id + '/cancel', { cancel_reason: 'Patient is travelling' });
       ctx.assert(r.status === 200, 'cancel at exactly 24h: ' + r.status + ' ' + JSON.stringify(r.body));
       ctx.assert(r.body.status === 'cancelled' && r.body.cancel_reason === 'Patient is travelling' && r.body.cancelled_at === t0, 'cancelled fields: ' + JSON.stringify(r.body));
       ctx.assert(ctx.api('GET', '/slots/' + sa.id).body.status === 'open', 'slot is open again');
       ctx.assert(ctx.api('POST', '/slots/' + sa.id + '/book', { patient_id: p2.id, reason: 'skin check' }).status === 201, 'freed slot can be rebooked');
       const again = ctx.api('POST', '/appointments/' + a1.id + '/cancel', { cancel_reason: 'again' });
       ctx.assert(again.status === 409 && code(again) === 'invalid_state', 'cancel twice: ' + JSON.stringify(again));
       const sb = slot(d2, 1439, 1469);
       const a3 = book(sb, p3);
       const late = ctx.api('POST', '/appointments/' + a3.id + '/cancel', { cancel_reason: 'Changed my mind' });
       ctx.assert(late.status === 409 && code(late) === 'cancellation_window_closed', 'inside 24h: ' + JSON.stringify(late));
       const after = ctx.api('GET', '/appointments/' + a3.id).body;
       ctx.assert(after.status === 'booked' && after.cancelled_at === null && after.cancel_reason === null, 'refused cancel changed nothing: ' + JSON.stringify(after));
       ctx.assert(ctx.api('GET', '/slots/' + sb.id).body.status === 'booked', 'slot stays booked');
       const none = ctx.api('POST', '/appointments/' + a3.id + '/cancel', {});
       ctx.assert(none.status === 400 && code(none) === 'input.invalid', 'missing reason: ' + JSON.stringify(none));
       const nf = ctx.api('POST', '/appointments/apt_9999/cancel', { cancel_reason: 'x' });
       ctx.assert(nf.status === 404 && code(nf) === 'not_found', 'unknown appointment: ' + JSON.stringify(nf));
      }
