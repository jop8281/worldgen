       const a1 = book(slot(d1, 120, 150), p1);
       const a2 = book(slot(d2, 120, 150), p2);
       const early = ctx.api('POST', '/appointments/' + a1.id + '/check_in', {});
       ctx.assert(early.status === 409 && code(early) === 'too_early', 'check-in 2h before: ' + JSON.stringify(early));
       const notYet = ctx.api('POST', '/appointments/' + a1.id + '/complete', {});
       ctx.assert(notYet.status === 409 && code(notYet) === 'invalid_state', 'complete a booked appointment: ' + JSON.stringify(notYet));
       ctx.advance('90m');
       const c = ctx.api('POST', '/appointments/' + a1.id + '/check_in', {});
       ctx.assert(c.status === 200 && c.body.status === 'checked_in' && c.body.checked_in_at === ctx.now(), 'check-in 30m before: ' + JSON.stringify(c));
       const cancel = ctx.api('POST', '/appointments/' + a1.id + '/cancel', { cancel_reason: 'x' });
       ctx.assert(cancel.status === 409 && code(cancel) === 'invalid_state', 'cancel after check-in: ' + JSON.stringify(cancel));
       const done = ctx.api('POST', '/appointments/' + a1.id + '/complete', {});
       ctx.assert(done.status === 200 && done.body.status === 'completed', 'complete: ' + JSON.stringify(done));
       const twice = ctx.api('POST', '/appointments/' + a1.id + '/complete', {});
       ctx.assert(twice.status === 409 && code(twice) === 'invalid_state', 'complete twice: ' + JSON.stringify(twice));
       ctx.advance('61m');
       const late = ctx.api('POST', '/appointments/' + a2.id + '/check_in', {});
       ctx.assert(late.status === 409 && code(late) === 'too_late', 'check-in after the slot ended: ' + JSON.stringify(late));
       ctx.assert(ctx.api('GET', '/appointments/' + a2.id).body.status === 'booked', 'late check-in changed nothing');
       const nf = ctx.api('POST', '/appointments/apt_9999/check_in', {});
       ctx.assert(nf.status === 404, 'unknown appointment: ' + nf.status);
       const nf2 = ctx.api('POST', '/appointments/apt_9999/complete', {});
       ctx.assert(nf2.status === 404, 'unknown appointment on complete: ' + nf2.status);
      }
  mark_no_show_three_strikes:
    description: mark_no_show is refused before the visit starts, increments the patient's no_show_count, keeps the slot booked, and at 3 blocks the patient from booking.
    script: |-
      (ctx) => {
       const t0 = ctx.now();
       const plus = (iso, m) => { const dc = (y, mo, d) => { y -= mo <= 2 ? 1 : 0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5) + d - 1; return era * 146097 + yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy - 719468; }; const n = dc(+iso.slice(0, 4), +iso.slice(5, 7), +iso.slice(8, 10)) * 1440 + (+iso.slice(11, 13)) * 60 + (+iso.slice(14, 16)) + m; const days = Math.floor(n / 1440); const rem = n - days * 1440; const z = days + 719468; const era = Math.floor(z / 146097); const doe = z - era * 146097; const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365); const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100)); const mp = Math.floor((5 * doy + 2) / 153); const d = doy - Math.floor((153 * mp + 2) / 5) + 1; const mo = mp < 10 ? mp + 3 : mp - 9; const y = yoe + era * 400 + (mo <= 2 ? 1 : 0); const p = (x, w) => String(x).padStart(w, '0'); return p(y, 4) + '-' + p(mo, 2) + '-' + p(d, 2) + 'T' + p(Math.floor(rem / 60), 2) + ':' + p(rem % 60, 2) + iso.slice(16); };
       const at = (m) => plus(t0, m);
       const ok = (r, m) => ctx.assert(r.status >= 200 && r.status < 300, m + ': ' + r.status + ' ' + JSON.stringify(r.body));
       const code = (r) => (r.body && r.body.error ? r.body.error.code : null);
       const d = ctx.api('POST', '/doctors', { name: 'Dr Ola', specialty: 'general_practice', email: 'ola@clinic.example' }).body;
       const p = ctx.api('POST', '/patients', { name: 'Pat Quin', email: 'quin@mail.example' }).body;
       const mk = (s, e) => { const r = ctx.api('POST', '/slots', { doctor_id: d.id, starts_at: at(s), ends_at: at(e) }); ok(r, 'create slot'); const b = ctx.api('POST', '/slots/' + r.body.id + '/book', { patient_id: p.id, reason: 'back pain' }); ctx.assert(b.status === 201, 'book: ' + JSON.stringify(b.body)); return b.body; };
       const a1 = mk(60, 90); const a2 = mk(90, 120); const a3 = mk(120, 150);
       const early = ctx.api('POST', '/appointments/' + a1.id + '/no_show', {});
       ctx.assert(early.status === 409 && code(early) === 'too_early', 'before the start: ' + JSON.stringify(early));
       ctx.advance('1h');
       const r1 = ctx.api('POST', '/appointments/' + a1.id + '/no_show', {});
       ctx.assert(r1.status === 200 && r1.body.status === 'no_show', 'no-show at the start time: ' + JSON.stringify(r1));
       let pp = ctx.api('GET', '/patients/' + p.id).body;
       ctx.assert(pp.no_show_count === 1 && pp.booking_blocked === false, 'one strike: ' + JSON.stringify(pp));
       ctx.assert(ctx.api('GET', '/slots/' + a1.slot_id).body.status === 'booked', 'slot stays booked');
       const again = ctx.api('POST', '/appointments/' + a1.id + '/no_show', {});
       ctx.assert(again.status === 409 && code(again) === 'invalid_state', 'second no-show on the same appointment: ' + JSON.stringify(again));
       const soon = ctx.api('POST', '/appointments/' + a2.id + '/no_show', {});
       ctx.assert(soon.status === 409 && code(soon) === 'too_early', 'next visit not started: ' + JSON.stringify(soon));
       ctx.advance('30m');
       ok(ctx.api('POST', '/appointments/' + a2.id + '/no_show', {}), 'second no-show');
       pp = ctx.api('GET', '/patients/' + p.id).body;
       ctx.assert(pp.no_show_count === 2 && pp.booking_blocked === false, 'two strikes: ' + JSON.stringify(pp));
       ctx.advance('30m');
       ok(ctx.api('POST', '/appointments/' + a3.id + '/no_show', {}), 'third no-show');
       pp = ctx.api('GET', '/patients/' + p.id).body;
       ctx.assert(pp.no_show_count === 3 && pp.booking_blocked === true, 'three strikes block: ' + JSON.stringify(pp));
       const s = ctx.api('POST', '/slots', { doctor_id: d.id, starts_at: at(300), ends_at: at(330) }).body;
       const blocked = ctx.api('POST', '/slots/' + s.id + '/book', { patient_id: p.id, reason: 'back pain' });
       ctx.assert(blocked.status === 409 && code(blocked) === 'patient_blocked', 'blocked patient: ' + JSON.stringify(blocked));
       ctx.assert(ctx.api('GET', '/slots/' + s.id).body.status === 'open', 'slot stays open');
       const nf = ctx.api('POST', '/appointments/apt_9999/no_show', {});
       ctx.assert(nf.status === 404, 'unknown appointment: ' + nf.status);
      }
  close_expired_slots_job:
    description: close_expired_slots closes open slots that have started and leaves future open slots and booked slots alone. A closed slot cannot be booked.
    script: |-
      (ctx) => {
       const t0 = ctx.now();
       const plus = (iso, m) => { const dc = (y, mo, d) => { y -= mo <= 2 ? 1 : 0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5) + d - 1; return era * 146097 + yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy - 719468; }; const n = dc(+iso.slice(0, 4), +iso.slice(5, 7), +iso.slice(8, 10)) * 1440 + (+iso.slice(11, 13)) * 60 + (+iso.slice(14, 16)) + m; const days = Math.floor(n / 1440); const rem = n - days * 1440; const z = days + 719468; const era = Math.floor(z / 146097); const doe = z - era * 146097; const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365); const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100)); const mp = Math.floor((5 * doy + 2) / 153); const d = doy - Math.floor((153 * mp + 2) / 5) + 1; const mo = mp < 10 ? mp + 3 : mp - 9; const y = yoe + era * 400 + (mo <= 2 ? 1 : 0); const p = (x, w) => String(x).padStart(w, '0'); return p(y, 4) + '-' + p(mo, 2) + '-' + p(d, 2) + 'T' + p(Math.floor(rem / 60), 2) + ':' + p(rem % 60, 2) + iso.slice(16); };
       const at = (m) => plus(t0, m);
       const d = ctx.api('POST', '/doctors', { name: 'Dr Rae', specialty: 'orthopedics', email: 'rae@clinic.example' }).body;
       const p = ctx.api('POST', '/patients', { name: 'Pat Sol', email: 'sol@mail.example' }).body;
       const mk = (s, e) => ctx.api('POST', '/slots', { doctor_id: d.id, starts_at: at(s), ends_at: at(e) }).body;
       const stale = mk(30, 60); const future = mk(180, 210); const booked = mk(60, 90);
       ctx.assert(ctx.api('POST', '/slots/' + booked.id + '/book', { patient_id: p.id, reason: 'knee pain' }).status === 201, 'book the third slot');
       const res = ctx.advance('2h');
       ctx.assert(res.jobsFailed.length === 0, 'jobs failed: ' + JSON.stringify(res.jobsFailed));
       ctx.assert(ctx.api('GET', '/slots/' + stale.id).body.status === 'closed', 'expired open slot is closed');
       ctx.assert(ctx.api('GET', '/slots/' + future.id).body.status === 'open', 'future open slot stays open');
       ctx.assert(ctx.api('GET', '/slots/' + booked.id).body.status === 'booked', 'booked slot stays booked');
       const r = ctx.api('POST', '/slots/' + stale.id + '/book', { patient_id: p.id, reason: 'knee pain' });
       ctx.assert(r.status === 409 && r.body.error.code === 'slot_taken', 'closed slot cannot be booked: ' + JSON.stringify(r));
      }
  auto_no_show_job:
    description: auto_no_show marks booked appointments no_show once the slot ended more than 30 minutes ago, counts the strikes, blocks the patient at 3 and leaves future appointments alone.
    script: |-
      (ctx) => {
       const t0 = ctx.now();
       const plus = (iso, m) => { const dc = (y, mo, d) => { y -= mo <= 2 ? 1 : 0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5) + d - 1; return era * 146097 + yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy - 719468; }; const n = dc(+iso.slice(0, 4), +iso.slice(5, 7), +iso.slice(8, 10)) * 1440 + (+iso.slice(11, 13)) * 60 + (+iso.slice(14, 16)) + m; const days = Math.floor(n / 1440); const rem = n - days * 1440; const z = days + 719468; const era = Math.floor(z / 146097); const doe = z - era * 146097; const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365); const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100)); const mp = Math.floor((5 * doy + 2) / 153); const d = doy - Math.floor((153 * mp + 2) / 5) + 1; const mo = mp < 10 ? mp + 3 : mp - 9; const y = yoe + era * 400 + (mo <= 2 ? 1 : 0); const p = (x, w) => String(x).padStart(w, '0'); return p(y, 4) + '-' + p(mo, 2) + '-' + p(d, 2) + 'T' + p(Math.floor(rem / 60), 2) + ':' + p(rem % 60, 2) + iso.slice(16); };
       const at = (m) => plus(t0, m);
       const d = ctx.api('POST', '/doctors', { name: 'Dr Tia', specialty: 'general_practice', email: 'tia@clinic.example' }).body;
       const p = ctx.api('POST', '/patients', { name: 'Pat Uma', email: 'uma@mail.example' }).body;
       const q = ctx.api('POST', '/patients', { name: 'Pat Vic', email: 'vic@mail.example' }).body;
       const mk = (pt, s, e) => { const sl = ctx.api('POST', '/slots', { doctor_id: d.id, starts_at: at(s), ends_at: at(e) }).body; const b = ctx.api('POST', '/slots/' + sl.id + '/book', { patient_id: pt.id, reason: 'checkup' }); ctx.assert(b.status === 201, 'book: ' + JSON.stringify(b.body)); return b.body; };
       const a1 = mk(p, 30, 60); const a2 = mk(p, 60, 90); const a3 = mk(p, 90, 120); const far = mk(q, 2880, 2910);
       const r1 = ctx.advance('90m');
       ctx.assert(r1.jobsFailed.length === 0, 'jobs failed: ' + JSON.stringify(r1.jobsFailed));
       ctx.assert(ctx.api('GET', '/appointments/' + a1.id).body.status === 'booked', 'exactly 30 minutes after the end is not enough');
       const r2 = ctx.advance('100m');
       ctx.assert(r2.jobsFailed.length === 0, 'jobs failed: ' + JSON.stringify(r2.jobsFailed));
       for (const a of [a1, a2, a3]) ctx.assert(ctx.api('GET', '/appointments/' + a.id).body.status === 'no_show', a.id + ' is no_show');
       const pp = ctx.api('GET', '/patients/' + p.id).body;
       ctx.assert(pp.no_show_count === 3 && pp.booking_blocked === true, 'patient counters: ' + JSON.stringify(pp));
       ctx.assert(ctx.api('GET', '/appointments/' + far.id).body.status === 'booked', 'future appointment untouched');
       const qq = ctx.api('GET', '/patients/' + q.id).body;
       ctx.assert(qq.no_show_count === 0 && qq.booking_blocked === false, 'other patient untouched: ' + JSON.stringify(qq));
       ctx.assert(ctx.api('GET', '/slots/' + a1.slot_id).body.status === 'booked', 'no-show slot stays booked');
      }
tasks:
  cancel_marias_far_appointment:
    difficulty: easy
    instruction: Cancel the upcoming appointment of the patient Maria Lopez that is more than 24 hours away. The cancel reason must mention the word 'rescheduling'. Her other appointments must stay as they are.
    decoys: []
    alternatives: []
  book_earliest_cardiology_slot:
    difficulty: medium
    instruction: Book the patient Daniel Okoye into the earliest open slot that has not started yet with any cardiologist who is currently taking bookings. Use the reason 'follow-up consultation'.
    decoys: []
    alternatives: []
  record_yesterdays_no_shows:
    difficulty: hard
    instruction: Many of yesterday's appointments are still in status booked, but those patients never showed up and nobody checked them in. Yesterday means the calendar day before the world's current date, as given by the engine clock. Mark every appointment from yesterday that is still booked as a no-show. Leave appointments that are checked in, completed or cancelled alone, and leave older and upcoming appointments alone.
    decoys: []
    alternatives: []
  clear_dr_patel_calendar_for_leave:
    difficulty: hard
    instruction: Dr. Priya Patel is going on leave starting now. Deactivate her. Cancel every one of her booked appointments that can still be cancelled under the clinic's 24-hour cancellation rule, giving each a cancel reason that includes the words 'on leave'. Appointments that cannot be cancelled must stay booked. Then close all of her open slots, including the ones freed by those cancellations, so nobody else can book them. Leave every other doctor, patient and slot alone.
    decoys: []
    alternatives: []
