  patient: "(ctx) => { const firsts = ['Aiden','Beatrice','Carlos','Dina','Ethan','Fatima','Gabriel','Hana','Isaac','Julia','Kofi','Laura','Mateo','Nadia','Oliver','Parisa','Quentin','Rosa','Simon','Tamsin','Umar','Vera','Wesley','Yuki']; const lasts = ['Anderson','Bianchi','Castillo','Dubois','Evans','Farouk','Gupta','Hoffman','Ivanov','Jensen','Kowalski','Lindqvist','Moreau','Nguyen','Ortega','Petrov','Quinn','Rossi','Schmidt','Tanaka','Underwood','Vargas','Walker','Zhang']; const rows = []; for (let i = 0; i < 60; i++) { const name = i === 0 ? 'Maria Lopez' : i === 1 ? 'Daniel Okoye' : firsts[i % 24] + ' ' + lasts[(i * 5 + 3) % 24]; const count = i >= 2 && i <= 4 ? 3 : i >= 5 && i <= 10 ? 2 : i >= 11 && i <= 15 ? 1 : 0; const c = ctx.time.plus('2025-02-03T09:00:00.000Z', (i * 5 + 3) + 'd'); rows.push({ name, email: name.toLowerCase().replace(/[^a-z]+/g, '.') + (i > 1 ? String(i) : '') + '@mail.example', phone: i % 9 === 4 ? null : '555-' + String(1000 + (i * 137) % 9000), no_show_count: count, booking_blocked: count >= 3, created_at: c, updated_at: c }); } return rows; }"
  slot: "(ctx) => { const now = ctx.now(); const P = (iso, m) => { const dc = (y, mo, d) => { y -= mo <= 2 ? 1 : 0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (mo + (mo > 2 ? -3 : 9)) + 2) / 5) + d - 1; return era * 146097 + yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy - 719468; }; const n = dc(+iso.slice(0, 4), +iso.slice(5, 7), +iso.slice(8, 10)) * 1440 + (+iso.slice(11, 13)) * 60 + (+iso.slice(14, 16)) + m; const days = Math.floor(n / 1440); const rem = n - days * 1440; const z = days + 719468; const era = Math.floor(z / 146097); const doe = z - era * 146097; const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365); const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100)); const mp = Math.floor((5 * doy + 2) / 153); const d = doy - Math.floor((153 * mp + 2) / 5) + 1; const mo = mp < 10 ? mp + 3 : mp - 9; const y = yoe + era * 400 + (mo <= 2 ? 1 : 0); const p = (x, w) => String(x).padStart(w, '0'); return p(y, 4) + '-' + p(mo, 2) + '-' + p(d, 2) + 'T' + p(Math.floor(rem / 60), 2) + ':' + p(rem % 60, 2) + iso.slice(16); }; const M0 = now.slice(0, 10) + 'T00:00:00.000Z'; const weekday = iso => { const year = +iso.slice(0,4), month = +iso.slice(5,7), day = +iso.slice(8,10); const a = Math.floor((14-month)/12), y = year-a, m = month+12*a-2; return (day+y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)+Math.floor(31*m/12))%7; }; const businessStart = (days,hour) => { let at=P(M0,days*1440+hour*60); while(weekday(at)===0||weekday(at)===6) at=P(at,1440); return at; }; const docs = ctx.rows('doctor'); const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = ctx.int(0, i); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; }; const mins = (st) => ctx.time.minutesBetween(now, st); const items = []; for (let d = 0; d < docs.length; d++) { for (let o = -14; o <= 21; o++) { const day=weekday(P(M0,o*1440)); if(day===0