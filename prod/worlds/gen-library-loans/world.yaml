format: 1
meta:
  name: gen_library_loans
  description: A library circulation system built from the books and loans CSVs. Staff look up books and members, check books out, renew them, return them and collect overdue fines. A job marks late loans overdue and accrues fines. Checkout rules cover copy availability, a loan limit, unpaid fines and member suspension.
  resembles: Koha/Evergreen-style public library circulation desk (catalog, patrons, loans, renewals, overdue fines)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-07T09:00:00Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  book:
    description: A catalog title held at one branch, with the number of physical copies. Availability is copies minus open (active or overdue) loans, so it is not stored.
    idPrefix: book
    fields:
      isbn:
        type: string
        description: 13-digit ISBN, kept as a string.
        required: true
        nullable: false
        unique: true
        readonly: false
        pattern: ^[0-9]{13}$
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      author:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      genre:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - fiction
          - mystery
          - science-fiction
          - fantasy
          - science
          - history
          - biography
          - travel
          - poetry
          - children
      branch:
        type: enum
        description: Library branch that holds the copies.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - central
          - northgate
          - eastfield
          - riverside
      copies:
        type: int
        description: Number of physical copies owned.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 1
  member:
    description: A library patron. A suspended member cannot check out or renew, but can still return books and pay fines. Members are never deleted.
    idPrefix: mem
    fields:
      code:
        type: string
        description: Member card code, such as M0005.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        format: email
      status:
        type: state
        description: Staff move a member between active and suspended with a plain PATCH.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - active
          - suspended
        initial: active
        transitions:
          active:
            - suspended
          suspended:
            - active
  loan:
    description: One copy of a book borrowed by a member, from borrowed_at to due_at. returned_at is set when the book comes back. Carries the overdue fine and whether it was paid. Written only by the checkout, return, renew and pay_fine actions and the accrue_overdue job.
    idPrefix: loan
    fields:
      loan_ref:
        type: string
        description: L plus a 5-digit sequence, such as L00301.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 20
      book_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: book
        onDelete: restrict
      member_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: member
        onDelete: restrict
      borrowed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      due_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      returned_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: state
        description: active until due_at passes, then overdue (set by the accrue_overdue job), then returned.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - active
          - overdue
          - returned
        initial: active
        transitions:
          active:
            - overdue
            - returned
          overdue:
            - returned
          returned: []
      renewals:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        max: 2
        default: 0
      fine_cents:
        type: money
        description: Overdue fine, 25 cents per full day past due, capped at 2000.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
        default: 0
      fine_paid:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: false
routes:
  list_books:
    op: list
    entity: book
    filters:
      - genre
      - branch
    search:
      - title
      - author
    sort:
      - title
      - author
    pageSize: 25
    method: GET
    path: /books
    description: "List books. Filters: genre, branch. Search with q over title and author."
  get_book:
    op: get
    entity: book
    method: GET
    path: /books/{id}
  create_book:
    op: create
    entity: book
    method: POST
    path: /books
    description: Add a catalog title.
  update_book:
    op: update
    entity: book
    method: PATCH
    path: /books/{id}
    description: Edit book details, such as the copy count or branch.
  list_members:
    op: list
    entity: member
    filters:
      - status
    search:
      - name
      - code
    sort:
      - name
    pageSize: 25
    method: GET
    path: /members
  get_member:
    op: get
    entity: member
    method: GET
    path: /members/{id}
  create_member:
    op: create
    entity: member
    method: POST
    path: /members
    description: Register a member. The status starts as active.
  update_member:
    op: update
    entity: member
    method: PATCH
    path: /members/{id}
    description: Edit a member, including active to suspended and back.
  list_loans:
    op: list
    entity: loan
    filters:
      - status
      - member_id
      - book_id
      - fine_paid
    search: []
    sort:
      - due_at
      - borrowed_at
    pageSize: 25
    method: GET
    path: /loans
    description: List loans. Loans are created only by the checkout action.
  get_loan:
    op: get
    entity: loan
    method: GET
    path: /loans/{id}
  list_member_loans:
    op: list
    entity: loan
    filters:
      - status
      - fine_paid
    search: []
    sort:
      - due_at
      - borrowed_at
    pageSize: 25
    method: GET
    path: /members/{member_id}/loans
    description: List one member's loans.
  list_book_loans:
    op: list
    entity: loan
    filters:
      - status
      - fine_paid
    search: []
    sort:
      - due_at
      - borrowed_at
    pageSize: 25
    method: GET
    path: /books/{book_id}/loans
    description: List the loans of one book.
actions:
  checkout_book:
    method: POST
    path: /loans/checkout
    description: Check a book out to a member. Active loan due in 21 days.
    input:
      book_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: book
        onDelete: restrict
      member_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: member
        onDelete: restrict
    handler: |-
      (ctx) => {
        const book = ctx.db.get('book', ctx.body.book_id);
        if (book === null) ctx.fail(404, 'not_found', 'book ' + ctx.body.book_id + ' not found');
        const member = ctx.db.get('member', ctx.body.member_id);
        if (member === null) ctx.fail(404, 'not_found', 'member ' + ctx.body.member_id + ' not found');
        if (member.status === 'suspended') ctx.fail(409, 'member_suspended', 'member ' + member.id + ' is suspended');
        const open = (l) => l.status === 'active' || l.status === 'overdue';
        const mine = ctx.db.list('loan', { where: { member_id: member.id } });
        if (mine.filter(open).length >= 5) ctx.fail(409, 'loan_limit', 'member ' + member.id + ' already has 5 open loans');
        let unpaid = 0;
        for (const l of mine) {
          if ((l.status === 'returned' || l.status === 'overdue') && !l.fine_paid) unpaid += l.fine_cents;
        }
        if (unpaid >= 1000) ctx.fail(409, 'unpaid_fines', 'member ' + member.id + ' has ' + unpaid + ' cents of unpaid fines');
        const bookLoans = ctx.db.list('loan', { where: { book_id: book.id } }).filter(open);
        if (bookLoans.length >= book.copies) ctx.fail(409, 'no_copies_available', 'no copies of book ' + book.id + ' are available');
        const n = ctx.db.list('loan').length + 1;
        const ref = 'L' + ('00000' + n).slice(-5);
        const now = ctx.now();
        const loan = ctx.db.create('loan', { loan_ref: ref, book_id: book.id, member_id: member.id, borrowed_at: now, due_at: ctx.time.plus(now, '21d'), returned_at: null, status: 'active', renewals: 0, fine_cents: 0, fine_paid: false });
        return { status: 201, body: loan };
      }
  return_loan:
    method: POST
    path: /loans/{id}/return
    description: Return an active or overdue loan and fix the fine.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const l = ctx.db.get('loan', id);
        if (l === null) ctx.fail(404, 'not_found', 'loan ' + id + ' not found');
        if (l.status !== 'active' && l.status !== 'overdue') ctx.fail(409, 'invalid_state', 'loan ' + id + ' is ' + l.status + '. Only active or overdue loans can be returned.');
        const now = ctx.now();
        const mins = ctx.time.minutesBetween(l.due_at, now);
        const days = mins > 0 ? Math.floor(mins / 1440) : 0;
        const fine = Math.min(2000, days * 25);
        const updated = ctx.db.update('loan', id, { status: 'returned', returned_at: now, fine_cents: fine });
        return { status: 200, body: updated };
      }
  renew_loan:
    method: POST
    path: /loans/{id}/renew
    description: Renew an active loan for 14 days, at most twice.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const l = ctx.db.get('loan', id);
        if (l === null) ctx.fail(404, 'not_found', 'loan ' + id + ' not found');
        if (l.status === 'returned') ctx.fail(409, 'invalid_state', 'loan ' + id + ' is already returned');
        if (l.status === 'overdue') ctx.fail(409, 'loan_overdue', 'loan ' + id + ' is overdue and cannot be renewed');
        const member = ctx.db.get('member', l.member_id);
        if (member.status === 'suspended') ctx.fail(409, 'member_suspended', 'member ' + member.id + ' is suspended');
        if (l.renewals >= 2) ctx.fail(409, 'renewal_limit', 'loan ' + id + ' has reached the renewal limit');
        const updated = ctx.db.update('loan', id, { due_at: ctx.time.plus(l.due_at, '14d'), renewals: l.renewals + 1 });
        return { status: 200, body: updated };
      }
  pay_fine:
    method: POST
    path: /loans/{id}/pay_fine
    description: Pay the fine of a returned loan in full.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const l = ctx.db.get('loan', id);
        if (l === null) ctx.fail(404, 'not_found', 'loan ' + id + ' not found');
        if (l.status !== 'returned' || l.fine_cents <= 0 || l.fine_paid) ctx.fail(409, 'no_fine_due', 'loan ' + id + ' has no payable fine');
        const updated = ctx.db.update('loan', id, { fine_paid: true });
        return { status: 200, body: updated };
      }
jobs:
  accrue_overdue:
    description: Hourly. Active loans past due become overdue. Overdue loans carry 25 cents per full day overdue, capped at 2000.
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const status of ['active', 'overdue']) {
          for (const l of ctx.db.list('loan', { where: { status } })) {
            const mins = ctx.time.minutesBetween(l.due_at, now);
            if (mins <= 0) continue;
            const fine = Math.min(2000, Math.floor(mins / 1440) * 25);
            if (l.status === 'active') ctx.db.update('loan', l.id, { status: 'overdue', fine_cents: fine });
            else if (l.fine_cents !== fine) ctx.db.update('loan', l.id, { fine_cents: fine });
          }
        }
      }
