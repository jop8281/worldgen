format: 1
meta:
  name: world
  description: An online store's support backend. Customers have saved payment methods (credit card, PayPal, gift card with a balance). Products have variants (size and color) with their own price and stock. Orders move pending -> shipped -> delivered. A pending order can be cancelled, or have its address, payment method or items changed (items only once, only to another variant of the same product). A delivered order can have items returned or exchanged for another variant of the same product. Money goes back to the original payment method or to one of the user's gift cards, and every refund is recorded. Every state change goes through an action that enforces these rules. A job issues refunds that are waiting and completes return and exchange requests.
  resembles: Retail customer-service backend in the style of the tau-bench retail domain, backed by a Shopify-like order and refund model (orders, line items, variants, payment methods, gift cards, refunds)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  user:
    description: A customer of the store. Support finds them by email or name. The address is the default address only, and existing orders keep their own shipping address.
    idPrefix: usr
    fields:
      first_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
      last_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 120
        format: email
      address_line:
        type: string
        description: Default street address. Changed only by update_user_address.
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 160
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 80
      state_code:
        type: string
        description: State or province code such as TX
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 3
      zip:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 12
      country:
        type: string
        description: ISO country code
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 2
        default: US
  payment_method:
    description: A saved payment method owned by a user. Gift cards carry a balance in USD cents, credit cards and PayPal accounts have none.
    idPrefix: pay
    fields:
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - credit_card
          - paypal
          - gift_card
      label:
        type: string
        description: Human readable label, such as Visa ending 4242 or PayPal account name
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      balance:
        type: money
        description: Remaining balance in cents. Set only for gift cards, null for other kinds. Changed by actions and jobs.
        required: false
        nullable: true
        unique: false
        readonly: true
        currency: USD
        min: 0
  product:
    description: A catalog product such as a rain jacket or a mechanical keyboard. Each product has several variants. The catalog is read-only.
    idPrefix: prd
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      category:
        type: string
        description: Catalog category such as outerwear, keyboards, desks or accessories
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
  variant:
    description: A purchasable option of a product with its own options, price and stock. A variant is only orderable when available is true.
    idPrefix: var
    fields:
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      option_summary:
        type: string
        description: The options of this variant, such as color blue, size L
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 160
      price:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      available:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
      stock:
        type: int
        description: Units on hand. Changed by cancel, exchange and return completion.
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
  order:
    description: A purchase by a user with a shipping address, a payment method and a lifecycle status. Status changes only through actions and jobs. The total equals the sum of quantity times unit_price over its items.
    idPrefix: ord
    fields:
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      status:
        type: state
        description: pending to shipped or cancelled. shipped to delivered. delivered to return_requested or exchange_requested. return_requested to returned. exchange_requested to exchanged. cancelled, returned and exchanged are final.
        required: true
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - shipped
          - delivered
          - cancelled
          - return_requested
          - exchange_requested
          - returned
          - exchanged
        initial: pending
        transitions:
          pending:
            - shipped
            - cancelled
          shipped:
            - delivered
          delivered:
            - return_requested
            - exchange_requested
          cancelled: []
          return_requested:
            - returned
          exchange_requested:
            - exchanged
          returned: []
          exchanged: []
      payment_method_id:
        type: ref
        description: The payment method the order was paid with. Must belong to the order's user.
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: payment_method
        onDelete: restrict
      ship_address_line:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 160
      ship_city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 80
      ship_state_code:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 3
      ship_zip:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 12
      ship_country:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 2
        default: US
      total:
        type: money
        description: Sum of quantity times unit_price over the order's items, in cents
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      items_modified:
        type: bool
        description: True once modify_pending_order_items has been used. Items can be modified only once.
        required: true
        nullable: false
        unique: false
        readonly: true
        default: false
      cancel_reason:
        type: enum
        description: Set when the order is cancelled
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - no longer needed
          - ordered by mistake
      placed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
        default: now
      delivered_at:
        type: datetime
        description: Set when the order was delivered
        required: false
        nullable: true
        unique: false
        readonly: true
  order_item:
    description: A line item on an order for one variant. It also tracks any return or exchange request on that line. Returns and exchanges work on whole lines.
    idPrefix: oit
    fields:
      order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: order
        onDelete: cascade
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      variant_id:
        type: ref
        description: The variant ordered. Must belong to product_id. Changed only by modify_pending_order_items.
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: variant
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 20
        default: 1
      unit_price:
        type: money
        description: Price of one unit in cents at the time of purchase or last modification
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      return_status:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - none
          - return_requested
          - exchange_requested
          - returned
          - exchanged
        default: none
      exchange_variant_id:
        type: ref
        description: The variant requested in an exchange. Null unless an exchange was requested.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: variant
        onDelete: restrict
  refund:
    description: A record of money going back to a payment method, or of the extra amount settled on an exchange. A refund to a gift card is issued at once. Others start pending and are issued by a job.
    idPrefix: rfd
    fields:
      order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: order
        onDelete: restrict
      payment_method_id:
        type: ref
        description: "Destination of the money: the original payment method or a gift card of the user"
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - cancellation
          - return
          - exchange_difference
      status:
        type: state
        description: pending until issued. issued is final.
        required: true
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - issued
        initial: pending
        transitions:
          pending:
            - issued
          issued: []
      issued_at:
        type: datetime
        description: When the refund was issued. Null while pending.
        required: false
        nullable: true
        unique: false
        readonly: true
