    op: get
    entity: refund
    method: GET
    path: /refunds/{id}
    description: Get one refund.
actions:
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a pending order. Sets cancel_reason, restocks the items and creates a cancellation refund for the full total to the original payment method. A gift card refund is issued at once and credited, any other refund starts pending.
    input:
      reason:
        type: enum
        description: Why the order is cancelled
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - no longer needed
          - ordered by mistake
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const order = ctx.db.get('order', id);
        if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (order.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only pending orders can be cancelled.');
        const reason = ctx.body.reason;
        if (reason !== 'no longer needed' && reason !== 'ordered by mistake') ctx.fail(400, 'input.invalid', 'Invalid input for cancel_order: reason must be no longer needed or ordered by mistake');
        const pm = ctx.db.get('payment_method', order.payment_method_id);
        if (pm === null) ctx.fail(409, 'no_payment_method', 'payment method ' + order.payment_method_id + ' of the order not found');
        const now = ctx.now();
        for (const it of ctx.db.list('order_item', { where: { order_id: id } })) {
          const v = ctx.db.get('variant', it.variant_id);
          ctx.db.update('variant', v.id, { stock: v.stock + it.quantity });
        }
        const updated = ctx.db.update('order', id, { status: 'cancelled', cancel_reason: reason });
        if (order.total > 0) {
          const r = ctx.db.create('refund', { order_id: id, payment_method_id: pm.id, amount: order.total, kind: 'cancellation' });
          if (pm.kind === 'gift_card') {
            ctx.db.update('refund', r.id, { status: 'issued', issued_at: now });
            ctx.db.update('payment_method', pm.id, { balance: (pm.balance || 0) + order.total });
          }
        }
        return { status: 200, body: updated };
      }
  modify_pending_order_address:
    method: POST
    path: /orders/{id}/address
    description: Change the shipping address of a pending order. The user's default address is not changed.
    input:
      address_line:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 160
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      state_code:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 3
      zip:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 12
      country:
        type: string
        description: ISO country code, US when omitted
        required: false
        nullable: false
        unique: false
        readonly: false
        maxLength: 2
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const order = ctx.db.get('order', id);
        if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (order.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only pending orders can change address.');
        const f = {
          ship_address_line: ctx.body.address_line,
          ship_city: ctx.body.city,
          ship_state_code: ctx.body.state_code,
          ship_zip: ctx.body.zip,
          ship_country: ctx.body.country === undefined || ctx.body.country === null ? 'US' : ctx.body.country,
        };
        for (const k of Object.keys(f)) {
          if (typeof f[k] !== 'string' || f[k].trim() === '') ctx.fail(400, 'input.invalid', 'Invalid input for modify_pending_order_address: ' + k + ' expected a non-blank string');
          f[k] = f[k].trim();
        }
        const updated = ctx.db.update('order', id, f);
        return { status: 200, body: updated };
      }
  modify_pending_order_payment:
    method: POST
    path: /orders/{id}/payment
    description: Change the payment method of a pending order. The new method must belong to the order's user and differ from the current one. A gift card must hold at least the order total.
    input:
      payment_method_id:
        type: ref
        description: The new payment method
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const order = ctx.db.get('order', id);
        if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (order.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only pending orders can change payment method.');
        const pm = ctx.db.get('payment_method', ctx.body.payment_method_id);
        if (pm === null) ctx.fail(422, 'unknown_payment_method', 'payment method ' + ctx.body.payment_method_id + ' not found');
        if (pm.user_id !== order.user_id) ctx.fail(409, 'payment_method_not_owned', 'payment method ' + pm.id + ' does not belong to the user of order ' + id);
        if (pm.id === order.payment_method_id) ctx.fail(409, 'no_change', 'order ' + id + ' already uses payment method ' + pm.id);
        if (pm.kind === 'gift_card' && (pm.balance || 0) < order.total) ctx.fail(409, 'insufficient_balance', 'gift card ' + pm.id + ' holds ' + (pm.balance || 0) + ' cents but the order total is ' + order.total);
        const updated = ctx.db.update('order', id, { payment_method_id: pm.id });
        return { status: 200, body: updated };
      }
  modify_pending_order_items:
    method: POST
    path: /orders/{id}/modify_items
    description: Swap line items of a pending order for other variants of the same product. Allowed once per order. item_ids and new_variant_ids are comma separated lists of the same length, matched by position. The price difference is charged to (a gift card is debited) or refunded to payment_method_id.
    input:
      item_ids:
        type: string
        description: Comma separated order_item ids, such as oit_0001,oit_0002
        required: true
        nullable: false
        unique: false
        readonly: false
      new_variant_ids:
        type: string
        description: Comma separated variant ids, one per item id in the same order
        required: true
        nullable: false
        unique: false
        readonly: false
      payment_method_id:
        type: ref
        description: Payment method of the user that settles the price difference
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const ids = (s) => String(s).split(',').map((x) => x.trim()).filter((x) => x !== '');
        const order = ctx.db.get('order', id);
        if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (order.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only pending orders can be modified.');
        if (order.items_modified) ctx.fail(409, 'already_modified', 'order ' + id + ' already had its items modified once.');
        const itemIds = ids(ctx.body.item_ids);
        const varIds = ids(ctx.body.new_variant_ids);
        if (itemIds.length === 0 || itemIds.length !== varIds.length) ctx.fail(400, 'input.invalid', 'Invalid input for modify_pending_order_items: item_ids and new_variant_ids must be non-empty lists of the same length');
        if (new Set(itemIds).size !== itemIds.length) ctx.fail(400, 'input.invalid', 'Invalid input for modify_pending_order_items: item_ids has duplicates');
        const pay = ctx.db.get('payment_method', ctx.body.payment_method_id);
        if (pay === null) ctx.fail(422, 'unknown_payment_method', 'payment method ' + ctx.body.payment_method_id + ' not found');
        if (pay.user_id !== order.user_id) ctx.fail(409, 'payment_method_not_owned', 'payment method ' + pay.id + ' does not belong to the user of order ' + id);
        const need = {};
        const swaps = [];
        let diff = 0;
        for (let i = 0; i < itemIds.length; i++) {
          const item = ctx.db.get('order_item', itemIds[i]);
          if (item === null || item.order_id !== id) ctx.fail(422, 'unknown_item', 'order item ' + itemIds[i] + ' is not on order ' + id);
          const nv = ctx.db.get('variant', varIds[i]);
          if (nv === null) ctx.fail(422, 'unknown_variant', 'variant ' + varIds[i] + ' not found');
          if (nv.product_id !== item.product_id) ctx.fail(409, 'wrong_product', 'variant ' + nv.id + ' is not a variant of product ' + item.product_id);
          if (nv.id === item.variant_id) ctx.fail(409, 'same_variant', 'item ' + item.id + ' already has variant ' + nv.id);
          if (!nv.available) ctx.fail(409, 'variant_unavailable', 'variant ' + nv.id + ' is not available');
          need[nv.id] = (need[nv.id] || 0) + item.quantity;
          if (nv.stock < need[nv.id]) ctx.fail(409, 'out_of_stock', 'variant ' + nv.id + ' has only ' + nv.stock + ' in stock');
          diff += (nv.price - item.unit_price) * item.quantity;
          swaps.push({ item, nv });
        }
        if (diff > 0 && pay.kind === 'gift_card' && (pay.balance || 0) < diff) ctx.fail(409, 'insufficient_balance', 'gift card ' + pay.id + ' holds ' + (pay.balance || 0) + ' cents but the price difference is ' + diff);
        const now = ctx.now();
        for (const s of swaps) {
          const ov = ctx.db.get('variant', s.item.variant_id);
          ctx.db.update('variant', ov.id, { stock: ov.stock + s.item.quantity });
          const nv = ctx.db.get('variant', s.nv.id);
          ctx.db.update('variant', nv.id, { stock: nv.stock - s.item.quantity });
          ctx.db.update('order_item', s.item.id, { variant_id: nv.id, unit_price: nv.price });
        }
        if (diff > 0 && pay.kind === 'gift_card') {
          ctx.db.update('payment_method', pay.id, { balance: (pay.balance || 0) - diff });
        } else if (diff < 0) {
          const r = ctx.db.create('refund', { order_id: id, payment_method_id: pay.id, amount: -diff, kind: 'exchange_difference' });
          if (pay.kind === 'gift_card') {
            ctx.db.update('refund', r.id, { status: 'issued', issued_at: now });
            ctx.db.update('payment_method', pay.id, { balance: (pay.balance || 0) - diff });
          }
        }
        const updated = ctx.db.update('order', id, { total: order.total + diff, items_modified: true });
        return { status: 200, body: updated };
      }
  return_delivered_order_items:
    method: POST
    path: /orders/{id}/return
    description: Request a return of whole line items of a delivered order. The refund for the sum of the returned items goes to the original payment method or to a gift card of the user. A gift card refund is issued at once. The order moves to return_requested.
    input:
      item_ids:
        type: string
        description: Comma separated order_item ids to return
        required: true
        nullable: false
        unique: false
        readonly: false
      payment_method_id:
        type: ref
        description: "Refund destination: the original payment method or a gift card of the user"
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const ids = (s) => String(s).split(',').map((x) => x.trim()).filter((x) => x !== '');
        const order = ctx.db.get('order', id);
        if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (['return_requested', 'exchange_requested', 'returned', 'exchanged'].includes(order.status)) ctx.fail(409, 'already_requested', 'order ' + id + ' is ' + order.status + ' and already had a return or exchange.');
        if (order.status !== 'delivered') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only delivered orders can be returned.');
        const itemIds = ids(ctx.body.item_ids);
        if (itemIds.length === 0) ctx.fail(400, 'input.invalid', 'Invalid input for return_delivered_order_items: item_ids must list at least one order item');
        if (new Set(itemIds).size !== itemIds.length) ctx.fail(400, 'input.invalid', 'Invalid input for return_delivered_order_items: item_ids has duplicates');
        const pm = ctx.db.get('payment_method', ctx.body.payment_method_id);
        if (pm === null) ctx.fail(422, 'unknown_payment_method', 'payment method ' + ctx.body.payment_method_id + ' not found');
        if (pm.user_id !== order.user_id) ctx.fail(409, 'payment_method_not_owned', 'payment method ' + pm.id + ' does not belong to the user of order ' + id);
        if (pm.id !== order.payment_method_id && pm.kind !== 'gift_card') ctx.fail(409, 'invalid_refund_destination', 'refunds go to the original payment method ' + order.payment_method_id + ' or to a gift card of the user.');
        let amount = 0;
        const items = [];
        for (const itemId of itemIds) {
          const item = ctx.db.get('order_item', itemId);
          if (item === null || item.order_id !== id) ctx.fail(422, 'unknown_item', 'order item ' + itemId + ' is not on order ' + id);
          if (item.return_status !== 'none') ctx.fail(409, 'already_requested', 'order item ' + itemId + ' is ' + item.return_status);
          amount += item.quantity * item.unit_price;
          items.push(item);
        }
        const now = ctx.now();
        for (const item of items) ctx.db.update('order_item', item.id, { return_status: 'return_requested' });
        const updated = ctx.db.update('order', id, { status: 'return_requested' });
        if (amount > 0) {
          const r = ctx.db.create('refund', { order_id: id, payment_method_id: pm.id, amount, kind: 'return' });
          if (pm.kind === 'gift_card') {
            ctx.db.update('refund', r.id, { status: 'issued', issued_at: now });
            ctx.db.update('payment_method', pm.id, { balance: (pm.balance || 0) + amount });
          }
        }
        return { status: 200, body: updated };
      }
  exchange_delivered_order_items:
    method: POST
    path: /orders/{id}/exchange
    description: Request an exchange of whole line items of a delivered order for other available variants of the same product. item_ids and new_variant_ids are comma separated lists matched by position. The price difference is charged to (a gift card is debited) or refunded to payment_method_id. The order moves to exchange_requested.
    input:
      item_ids:
        type: string
        description: Comma separated order_item ids to exchange
        required: true
        nullable: false
        unique: false
        readonly: false
      new_variant_ids:
        type: string
        description: Comma separated variant ids, one per item id in the same order
        required: true
        nullable: false
        unique: false
        readonly: false
      payment_method_id:
        type: ref
        description: Payment method of the user that settles the price difference
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const ids = (s) => String(s).split(',').map((x) => x.trim()).filter((x) => x !== '');
        const order = ctx.db.get('order', id);
        if (order === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (['return_requested', 'exchange_requested', 'returned', 'exchanged'].includes(order.status)) ctx.fail(409, 'already_requested', 'order ' + id + ' is ' + order.status + ' and already had a return or exchange.');
        if (order.status !== 'delivered') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + order.status + '. Only delivered orders can be exchanged.');
        const itemIds = ids(ctx.body.item_ids);
        const varIds = ids(ctx.body.new_variant_ids);
        if (itemIds.length === 0 || itemIds.length !== varIds.length) ctx.fail(400, 'input.invalid', 'Invalid input for exchange_delivered_order_items: item_ids and new_variant_ids must be non-empty lists of the same length');
        if (new Set(itemIds).size !== itemIds.length) ctx.fail(400, 'input.invalid', 'Invalid input for exchange_delivered_order_items: item_ids has duplicates');
        const pay = ctx.db.get('payment_method', ctx.body.payment_method_id);
        if (pay === null) ctx.fail(422, 'unknown_payment_method', 'payment method ' + ctx.body.payment_method_id + ' not found');
        if (pay.user_id !== order.user_id) ctx.fail(409, 'payment_method_not_owned', 'payment method ' + pay.id + ' does not belong to the user of order ' + id);
        const need = {};
        const swaps = [];
        let diff = 0;
        for (let i = 0; i < itemIds.length; i++) {
          const item = ctx.db.get('order_item', itemIds[i]);
          if (item === null || item.order_id !== id) ctx.fail(422, 'unknown_item', 'order item ' + itemIds[i] + ' is not on order ' + id);
          if (item.return_status !== 'none') ctx.fail(409, 'already_requested', 'order item ' + item.id + ' is ' + item.return_status);
          const nv = ctx.db.get('variant', varIds[i]);
          if (nv === null) ctx.fail(422, 'unknown_variant', 'variant ' + varIds[i] + ' not found');
          if (nv.product_id !== item.product_id) ctx.fail(409, 'wrong_product', 'variant ' + nv.id + ' is not a variant of product ' + item.product_id);
          if (nv.id === item.variant_id) ctx.fail(409, 'same_variant', 'item ' + item.id + ' already has variant ' + nv.id);
          if (!nv.available) ctx.fail(409, 'variant_unavailable', 'variant ' + nv.id + ' is not available');
          need[nv.id] = (need[nv.id] || 0) + item.quantity;
          if (nv.stock < need[nv.id]) ctx.fail(409, 'out_of_stock', 'variant ' + nv.id + ' has only ' + nv.stock + ' in stock');
          diff += (nv.price - item.unit_price) * item.quantity;
          swaps.push({ item, nv });
        }
        if (diff > 0 && pay.kind === 'gift_card' && (pay.balance || 0) < diff) ctx.fail(409, 'insufficient_balance', 'gift card ' + pay.id + ' holds ' + (pay.balance || 0) + ' cents but the price difference is ' + diff);
        const now = ctx.now();
        for (const s of swaps) {
          const ov = ctx.db.get('variant', s.item.variant_id);
          ctx.db.update('variant', ov.id, { stock: ov.stock + s.item.quantity });
          const nv = ctx.db.get('variant', s.nv.id);
          ctx.db.update('variant', nv.id, { stock: nv.stock - s.item.quantity });
          ctx.db.update('order_item', s.item.id, { return_status: 'exchange_requested', exchange_variant_id: nv.id });
        }
        if (diff > 0 && pay.kind === 'gift_card') {
          ctx.db.update('payment_method', pay.id, { balance: (pay.balance || 0) - diff });
        } else if (diff < 0) {
          const r = ctx.db.create('refund', { order_id: id, payment_method_id: pay.id, amount: -diff, kind: 'exchange_difference' });
          if (pay.kind === 'gift_card') {
            ctx.db.update('refund', r.id, { status: 'issued', issued_at: now });
            ctx.db.update('payment_method', pay.id, { balance: (pay.balance || 0) - diff });
          }
        }
        const updated = ctx.db.update('order', id, { status: 'exchange_requested' });
        return { status: 200, body: updated };
      }
  update_user_address:
    method: POST
    path: /users/{id}/address
    description: Change a user's default address. Orders already placed keep their shipping address.
    input:
      address_line:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 160
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      state_code:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 3
      zip:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 12
      country:
        type: string
        description: ISO country code, US when omitted
        required: false
        nullable: false
        unique: false
        readonly: false
        maxLength: 2
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const user = ctx.db.get('user', id);
        if (user === null) ctx.fail(404, 'not_found', 'user ' + id + ' not found');
        const f = {
          address_line: ctx.body.address_line,
          city: ctx.body.city,
          state_code: ctx.body.state_code,
          zip: ctx.body.zip,
          country: ctx.body.country === undefined || ctx.body.country === null ? 'US' : ctx.body.country,
        };
        for (const k of Object.keys(f)) {
          if (typeof f[k] !== 'string' || f[k].trim() === '') ctx.fail(400, 'input.invalid', 'Invalid input for update_user_address: ' + k + ' expected a non-blank string');
          f[k] = f[k].trim();
        }
        const updated = ctx.db.update('user', id, f);
        return { status: 200, body: updated };
      }
jobs:
  issue_pending_refunds:
    description: Every 6 hours. A pending refund at least 24 hours old becomes issued with issued_at set to now. Gift card refunds are created issued and credited, so nothing is credited here.
    every: 6h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const r of ctx.db.list('refund', { where: { status: 'pending' } })) {
          if (ctx.time.minutesBetween(r.created_at, now) < 24 * 60) continue;
          ctx.db.update('refund', r.id, { status: 'issued', issued_at: now });
        }
      }
  complete_return_and_exchange_requests:
    description: Every day. A return_requested order not updated for 72 hours becomes returned, its return_requested items become returned and the stock goes back. An exchange_requested order of the same age becomes exchanged and its items become exchanged.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const o of ctx.db.list('order', { where: { status: 'return_requested' } })) {
          if (ctx.time.minutesBetween(o.updated_at, now) < 72 * 60) continue;
          for (const it of ctx.db.list('order_item', { where: { order_id: o.id, return_status: 'return_requested' } })) {
            ctx.db.update('order_item', it.id, { return_status: 'returned' });
            const v = ctx.db.get('variant', it.variant_id);
            ctx.db.update('variant', v.id, { stock: v.stock + it.quantity });
          }
          ctx.db.update('order', o.id, { status: 'returned' });
        }
        for (const o of ctx.db.list('order', { where: { status: 'exchange_requested' } })) {
          if (ctx.time.minutesBetween(o.updated_at, now) < 72 * 60) continue;
          for (const it of ctx.db.list('order_item', { where: { order_id: o.id, return_status: 'exchange_requested' } })) {
            ctx.db.update('order_item', it.id, { return_status: 'exchanged' });
          }
          ctx.db.update('order', o.id, { status: 'exchanged' });
        }
      }
