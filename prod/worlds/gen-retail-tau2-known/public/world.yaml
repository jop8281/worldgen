)=>{ let raw; if(i<ANCH.length) raw=ANCH[i][4]; else { const r=rngf((i+1)*9973+17); const u=r(); const n=u<0.3?1:u<0.6?2:u<0.82?3:u<0.94?4:5; raw=[]; const used={}; for(let k=0;k<n;k++){ let p=Math.floor(r()*30); let v=Math.floor(r()*P[p].vs.length); for(let t=0;t<30;t++){ const vs=P[p].vs; let f=-1; for(let s=0;s<vs.length;s++){ const w=(v+s)%vs.length; if(vs[w].avail&&vs[w].stock>0&&!used[vs[w].gid]){ f=w; break; } } if(f>=0){ v=f; break; } p=(p+1)%30; v=0; } used[P[p].vs[v].gid]=true; raw.push([p,v,r()<0.82?1:2+Math.floor(r()*2)]); } } return raw.map((x,k)=>{ const p=x[0]; const v=x[1]; const V=P[p].vs[v]; let rs='none'; let xv=null; let xp=null; if((status==='return_requested'||status==='returned')&&k%2===0) rs=status==='returned'?'returned':'return_requested'; else if((status==='exchange_requested'||status==='exchanged')&&k===0){ const a=alt(p,v); if(a){ rs=status==='exchanged'?'exchanged':'exchange_requested'; xv=a.gid; xp=a.price; } } return {pid:p+1,vid:V.gid,q:x[2],price:V.price,rs:rs,xv:xv,xp:xp}; }); }; const orders=ctx.rows('order'); const pms=ctx.rows('payment_method'); const now=ctx.now(); const rows=[]; orders.forEach((o,i)=>{ const ls=lines(i,o.status); const opm=pms.find((p)=>p.id===o.payment_method_id); let kind=null; let amount=0; let dest=opm; if(o.status==='cancelled'){ kind='cancellation'; amount=o.total; } else if(o.status==='return_requested'||o.status==='returned'){ kind='return'; amount=ls.filter((l)=>l.rs==='return_requested'||l.rs==='returned').reduce((s,l)=>s+l.q*l.price,0); const gifts=pms.filter((p)=>p.user_id===o.user_id&&p.kind==='gift_card'); if(i%3===0&&gifts.length>0) dest=gifts[0]; } else if(o.status==='exchange_requested'||o.status==='exchanged'){ const l=ls.find((x)=>x.xv!==null); if(l&&l.xp<l.price){ kind='exchange_difference'; amount=(l.price-l.xp)*l.q; } } if(kind===null||amount<=0) return; const age=ctx.time.minutesBetween(o.updated_at,now); const gift=dest.kind==='gift_card'; if(gift){ rows.push({order_id:o.id,payment_method_id:dest.id,amount:amount,kind:kind,status:'issued',issued_at:o.updated_at,created_at:o.updated_at,updated_at:o.updated_at}); } else if(age>=1440){ const at=ctx.time.plus(o.updated_at,'1440m'); rows.push({order_id:o.id,payment_method_id:dest.id,amount:amount,kind:kind,status:'issued',issued_at:at,created_at:o.updated_at,updated_at:at}); } else { rows.push({order_id:o.id,payment_method_id:dest.id,amount:amount,kind:kind,status:'pending',issued_at:null,created_at:o.updated_at,updated_at:o.updated_at}); } }); return rows; }
tests:
  actions_refuse_unknown_rows:
    description: Every action answers 404 for an order or user that does not exist, and refuses bad input before touching data.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/orders/ord_9999/cancel', { reason: 'ordered by mistake' });
        ctx.assert(c.status === 404 && c.body.error.code === 'not_found', 'cancel unknown order: ' + JSON.stringify(c));
        const a = ctx.api('POST', '/orders/ord_9999/address', { address_line: '1 Main St', city: 'Austin', state_code: 'TX', zip: '78701' });
        ctx.assert(a.status === 404 && a.body.error.code === 'not_found', 'address unknown order: ' + JSON.stringify(a));
        const u = ctx.api('POST', '/users/usr_9999/address', { address_line: '1 Main St', city: 'Austin', state_code: 'TX', zip: '78701' });
        ctx.assert(u.status === 404 && u.body.error.code === 'not_found', 'address unknown user: ' + JSON.stringify(u));
        const p = ctx.api('POST', '/orders/ord_9999/payment', { payment_method_id: 'pay_9999' });
        ctx.assert(p.status === 400 || p.status === 404, 'payment unknown order: ' + JSON.stringify(p));
        const m = ctx.api('POST', '/orders/ord_9999/modify_items', { item_ids: 'oit_9999', new_variant_ids: 'var_9999', payment_method_id: 'pay_9999' });
        ctx.assert(m.status === 400 || m.status === 404, 'modify unknown order: ' + JSON.stringify(m));
        const r = ctx.api('POST', '/orders/ord_9999/return', { item_ids: 'oit_9999', payment_method_id: 'pay_9999' });
        ctx.assert(r.status === 400 || r.status === 404, 'return unknown order: ' + JSON.stringify(r));
        const x = ctx.api('POST', '/orders/ord_9999/exchange', { item_ids: 'oit_9999', new_variant_ids: 'var_9999', payment_method_id: 'pay_9999' });
        ctx.assert(x.status === 400 || x.status === 404, 'exchange unknown order: ' + JSON.stringify(x));
      }
  actions_refuse_bad_input:
    description: Missing or invalid inputs are refused with 400 input.invalid.
    script: |-
      (ctx) => {
        const c1 = ctx.api('POST', '/orders/ord_9999/cancel', {});
        ctx.assert(c1.status === 400 && c1.body.error.code === 'input.invalid', 'cancel without reason: ' + JSON.stringify(c1));
        const c2 = ctx.api('POST', '/orders/ord_9999/cancel', { reason: 'changed my mind' });
        ctx.assert(c2.status === 400 && c2.body.error.code === 'input.invalid', 'cancel with a reason outside the enum: ' + JSON.stringify(c2));
        const a = ctx.api('POST', '/orders/ord_9999/address', { address_line: '1 Main St', state_code: 'TX', zip: '78701' });
        ctx.assert(a.status === 400 && a.body.error.code === 'input.invalid', 'address without city: ' + JSON.stringify(a));
        const u = ctx.api('POST', '/users/usr_9999/address', { address_line: '1 Main St', city: 'Austin', state_code: 'TX' });
        ctx.assert(u.status === 400 && u.body.error.code === 'input.invalid', 'user address without zip: ' + JSON.stringify(u));
        const r = ctx.api('POST', '/orders/ord_9999/return', { payment_method_id: 'pay_9999' });
        ctx.assert(r.status === 400 && r.body.error.code === 'input.invalid', 'return without item_ids: ' + JSON.stringify(r));
        const x = ctx.api('POST', '/orders/ord_9999/exchange', { item_ids: 'oit_9999', payment_method_id: 'pay_9999' });
        ctx.assert(x.status === 400 && x.body.error.code === 'input.invalid', 'exchange without new_variant_ids: ' + JSON.stringify(x));
        const m = ctx.api('POST', '/orders/ord_9999/modify_items', { new_variant_ids: 'var_9999', payment_method_id: 'pay_9999' });
        ctx.assert(m.status === 400 && m.body.error.code === 'input.invalid', 'modify without item_ids: ' + JSON.stringify(m));
        const p = ctx.api('POST', '/orders/ord_9999/payment', {});
        ctx.assert(p.status === 400 && p.body.error.code === 'input.invalid', 'payment without payment_method_id: ' + JSON.stringify(p));
      }
  jobs_run_cleanly:
    description: Both jobs run on a week of engine time without failing.
    script: |-
      (ctx) => {
        const r = ctx.advance('7d');
        ctx.assert(r.jobsFailed.length === 0, 'jobs failed: ' + JSON.stringify(r.jobsFailed));
      }
  cancel_order_flow:
    description: Cancelling a pending order sets the reason, restocks the items and creates one full-total cancellation refund to the original payment method. A second cancel is refused. Skips while there is no pending order.
    script: |-
      (ctx) => {
        const list = ctx.api('GET', '/orders?status=pending').body.data;
        if (!list || list.length === 0) return;
        const order = list[0];
        const items = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data;
        const before = {};
        const gain = {};
        for (const it of items) {
          before[it.variant_id] = ctx.api('GET', '/variants/' + it.variant_id).body.stock;
          gain[it.variant_id] = (gain[it.variant_id] || 0) + it.quantity;
        }
        const pms = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data;
        const pm = pms.find((p) => p.id === order.payment_method_id);
        const bad = ctx.api('POST', '/orders/' + order.id + '/cancel', { reason: 'changed my mind' });
        ctx.assert(bad.status === 400, 'a reason outside the enum is refused: ' + JSON.stringify(bad));
        const r = ctx.api('POST', '/orders/' + order.id + '/cancel', { reason: 'ordered by mistake' });
        ctx.assert(r.status === 200, 'cancel returned ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(r.body.status === 'cancelled' && r.body.cancel_reason === 'ordered by mistake', 'cancelled with reason, got ' + JSON.stringify(r.body));
        for (const v of Object.keys(before)) {
          const now = ctx.api('GET', '/variants/' + v).body.stock;
          ctx.assert(now === before[v] + gain[v], 'variant ' + v + ' restocked from ' + before[v] + ' to ' + (before[v] + gain[v]) + ', got ' + now);
        }
        const refunds = ctx.api('GET', '/refunds?order_id=' + order.id + '&kind=cancellation').body.data;
        if (order.total > 0) {
          ctx.assert(refunds.length === 1, 'one cancellation refund, got ' + refunds.length);
          ctx.assert(refunds[0].amount === order.total && refunds[0].payment_method_id === order.payment_method_id, 'refund of the full total to the original method, got ' + JSON.stringify(refunds[0]));
          if (pm && pm.kind === 'gift_card') {
            ctx.assert(refunds[0].status === 'issued' && refunds[0].issued_at !== null, 'gift card refund is issued at once');
            const after = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data.find((p) => p.id === pm.id);
            ctx.assert(after.balance === pm.balance + order.total, 'gift card credited, got ' + after.balance);
          } else {
            ctx.assert(refunds[0].status === 'pending' && refunds[0].issued_at === null, 'refund to another method starts pending');
          }
        }
        const again = ctx.api('POST', '/orders/' + order.id + '/cancel', { reason: 'no longer needed' });
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second cancel: ' + JSON.stringify(again));
      }
  cancel_refuses_non_pending:
    description: A delivered order cannot be cancelled and nothing changes. Skips while there is no delivered order.
    script: |-
      (ctx) => {
        const list = ctx.api('GET', '/orders?status=delivered&limit=1').body.data;
        if (!list || list.length === 0) return;
        const o = list[0];
        const r = ctx.api('POST', '/orders/' + o.id + '/cancel', { reason: 'no longer needed' });
        ctx.assert(r.status === 409 && r.body.error.code === 'invalid_state', 'cancel delivered: ' + JSON.stringify(r));
        const a = ctx.api('POST', '/orders/' + o.id + '/address', { address_line: '9 Elm St', city: 'Reno', state_code: 'NV', zip: '89501' });
        ctx.assert(a.status === 409 && a.body.error.code === 'invalid_state', 'address on delivered: ' + JSON.stringify(a));
        const after = ctx.api('GET', '/orders/' + o.id).body;
        ctx.assert(JSON.stringify(after) === JSON.stringify(o), 'the refused calls changed the order');
        ctx.assert(ctx.api('GET', '/refunds?order_id=' + o.id + '&kind=cancellation').body.data.length === 0, 'no cancellation refund for a delivered order');
      }
  modify_address_flow:
    description: modify_pending_order_address changes only the shipping address of a pending order and leaves the user's default address alone. Skips while there is no pending order.
    script: |-
      (ctx) => {
        const list = ctx.api('GET', '/orders?status=pending&limit=1').body.data;
        if (!list || list.length === 0) return;
        const o = list[0];
        const userBefore = ctx.api('GET', '/users/' + o.user_id).body;
        const r = ctx.api('POST', '/orders/' + o.id + '/address', { address_line: '77 Harbor Road', city: 'Portland', state_code: 'OR', zip: '97201' });
        ctx.assert(r.status === 200, 'address returned ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(r.body.ship_address_line === '77 Harbor Road' && r.body.ship_city === 'Portland' && r.body.ship_state_code === 'OR' && r.body.ship_zip === '97201' && r.body.ship_country === 'US', 'address changed, got ' + JSON.stringify(r.body));
        ctx.assert(r.body.status === 'pending' && r.body.total === o.total, 'status and total unchanged');
        const userAfter = ctx.api('GET', '/users/' + o.user_id).body;
        ctx.assert(JSON.stringify(userAfter) === JSON.stringify(userBefore), 'the user default address must not change');
        const blank = ctx.api('POST', '/orders/' + o.id + '/address', { address_line: '  ', city: 'Portland', state_code: 'OR', zip: '97201' });
        ctx.assert(blank.status === 400 && blank.body.error.code === 'input.invalid', 'blank address line: ' + JSON.stringify(blank));
      }
  modify_payment_flow:
    description: modify_pending_order_payment switches a pending order to another payment method of the same user, refuses the current method, and refuses a gift card with too little balance. Skips while there is no suitable order.
    script: |-
      (ctx) => {
        const orders = ctx.api('GET', '/orders?status=pending').body.data;
        if (!orders) return;
        for (const o of orders) {
          const pms = ctx.api('GET', '/users/' + o.user_id + '/payment_methods?limit=25').body.data;
          const other = pms.find((p) => p.id !== o.payment_method_id && (p.kind !== 'gift_card' || p.balance >= o.total));
          if (!other) continue;
          const same = ctx.api('POST', '/orders/' + o.id + '/payment', { payment_method_id: o.payment_method_id });
          ctx.assert(same.status === 409 && same.body.error.code === 'no_change', 'same method: ' + JSON.stringify(same));
          const poor = pms.find((p) => p.id !== o.payment_method_id && p.kind === 'gift_card' && p.balance < o.total);
          if (poor) {
            const refused = ctx.api('POST', '/orders/' + o.id + '/payment', { payment_method_id: poor.id });
            ctx.assert(refused.status === 409 && refused.body.error.code === 'insufficient_balance', 'poor gift card: ' + JSON.stringify(refused));
          }
          const r = ctx.api('POST', '/orders/' + o.id + '/payment', { payment_method_id: other.id });
          ctx.assert(r.status === 200 && r.body.payment_method_id === other.id, 'payment switched: ' + JSON.stringify(r));
          ctx.assert(r.body.total === o.total && r.body.status === 'pending', 'total and status unchanged');
          return;
        }
      }
  modify_items_flow:
    description: modify_pending_order_items swaps one line to another available variant of the same product, recomputes the total, settles the difference on the given payment method and refuses a second modification. Skips while there is no suitable order.
    script: |-
      (ctx) => {
        const orders = ctx.api('GET', '/orders?status=pending').body.data;
        if (!orders) return;
        for (const order of orders) {
          if (order.items_modified) continue;
          const items = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data;
          const pms = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data;
          const pay = pms.find((p) => p.kind !== 'gift_card');
          if (!pay) continue;
          for (const item of items) {
            const vs = ctx.api('GET', '/products/' + item.product_id + '/variants?limit=25').body.data;
            const nv = vs.find((v) => v.available && v.id !== item.variant_id && v.stock >= item.quantity);
            if (!nv) continue;
            const oldStock = ctx.api('GET', '/variants/' + item.variant_id).body.stock;
            const diff = (nv.price - item.unit_price) * item.quantity;
            const r = ctx.api('POST', '/orders/' + order.id + '/modify_items', { item_ids: item.id, new_variant_ids: nv.id, payment_method_id: pay.id });
            ctx.assert(r.status === 200, 'modify returned ' + r.status + ' ' + JSON.stringify(r.body));
            ctx.assert(r.body.items_modified === true && r.body.total === order.total + diff, 'total recomputed to ' + (order.total + diff) + ', got ' + JSON.stringify(r.body));
            const after = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data.find((i) => i.id === item.id);
            ctx.assert(after.variant_id === nv.id && after.unit_price === nv.price && after.quantity === item.quantity, 'line swapped, got ' + JSON.stringify(after));
            ctx.assert(ctx.api('GET', '/variants/' + nv.id).body.stock === nv.stock - item.quantity, 'new variant stock went down');
            ctx.assert(ctx.api('GET', '/variants/' + item.variant_id).body.stock === oldStock + item.quantity, 'old variant stock went up');
            const refunds = ctx.api('GET', '/refunds?order_id=' + order.id + '&kind=exchange_difference').body.data;
            if (diff < 0) {
              ctx.assert(refunds.length === 1 && refunds[0].amount === -diff && refunds[0].payment_method_id === pay.id, 'difference refunded to the chosen method, got ' + JSON.stringify(refunds));
            } else {
              ctx.assert(refunds.length === 0, 'no refund when the price does not drop');
            }
            const again = ctx.api('POST', '/orders/' + order.id + '/modify_items', { item_ids: item.id, new_variant_ids: item.variant_id, payment_method_id: pay.id });
            ctx.assert(again.status === 409 && again.body.error.code === 'already_modified', 'second modification: ' + JSON.stringify(again));
            return;
          }
        }
      }
  return_flow_and_completion:
    description: return_delivered_order_items marks only the listed items, moves the order to return_requested and creates a return refund to the original method. A second request is refused with 409. After 4 days the job marks the order and items returned, restocks and issues the refund. Skips while there is no delivered order.
    script: |-
      (ctx) => {
        const orders = ctx.api('GET', '/orders?status=delivered').body.data;
        if (!orders) return;
        for (const order of orders) {
          const items = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data;
          const item = items.find((i) => i.return_status === 'none');
          if (!item) continue;
          const before = ctx.api('GET', '/variants/' + item.variant_id).body.stock;
          const unknown = ctx.api('POST', '/orders/' + order.id + '/return', { item_ids: 'oit_9999', payment_method_id: order.payment_method_id });
          ctx.assert(unknown.status === 422 && unknown.body.error.code === 'unknown_item', 'unknown item: ' + JSON.stringify(unknown));
          const r = ctx.api('POST', '/orders/' + order.id + '/return', { item_ids: item.id, payment_method_id: order.payment_method_id });
          ctx.assert(r.status === 200 && r.body.status === 'return_requested', 'return: ' + JSON.stringify(r));
          const lines = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data;
          for (const l of lines) {
            ctx.assert(l.return_status === (l.id === item.id ? 'return_requested' : 'none'), 'only the listed item is marked, got ' + l.id + ' ' + l.return_status);
          }
          const amount = item.quantity * item.unit_price;
          const refunds = ctx.api('GET', '/refunds?order_id=' + order.id + '&kind=return').body.data;
          if (amount > 0) {
            ctx.assert(refunds.length === 1 && refunds[0].amount === amount && refunds[0].payment_method_id === order.payment_method_id, 'return refund of ' + amount + ', got ' + JSON.stringify(refunds));
          }
          const again = ctx.api('POST', '/orders/' + order.id + '/return', { item_ids: item.id, payment_method_id: order.payment_method_id });
          ctx.assert(again.status === 409 && again.body.error.code === 'already_requested', 'second return: ' + JSON.stringify(again));
          const ex = ctx.api('POST', '/orders/' + order.id + '/exchange', { item_ids: item.id, new_variant_ids: item.variant_id, payment_method_id: order.payment_method_id });
          ctx.assert(ex.status === 409, 'exchange after return: ' + JSON.stringify(ex));
          const fired = ctx.advance('4d');
          ctx.assert(fired.jobsFailed.length === 0, 'jobs failed: ' + JSON.stringify(fired.jobsFailed));
          const done = ctx.api('GET', '/orders/' + order.id).body;
          ctx.assert(done.status === 'returned', 'order returned by the job, got ' + done.status);
          const doneLine = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data.find((i) => i.id === item.id);
          ctx.assert(doneLine.return_status === 'returned', 'item returned, got ' + doneLine.return_status);
          ctx.assert(ctx.api('GET', '/variants/' + item.variant_id).body.stock === before + item.quantity, 'stock went back');
          for (const f of ctx.api('GET', '/refunds?order_id=' + order.id + '&kind=return').body.data) {
            ctx.assert(f.status === 'issued' && f.issued_at !== null, 'refund issued after 4 days, got ' + f.status);
          }
          return;
        }
      }
  return_refund_to_gift_card:
    description: A return refunded to a gift card of the user is issued at once and credits the balance. A destination that is neither the original method nor a gift card is refused. Skips while there is no suitable order.
    script: |-
      (ctx) => {
        const orders = ctx.api('GET', '/orders?status=delivered').body.data;
        if (!orders) return;
        for (const order of orders) {
          const items = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data;
          const item = items.find((i) => i.return_status === 'none');
          if (!item) continue;
          const pms = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data;
          const gift = pms.find((p) => p.kind === 'gift_card');
          if (!gift) continue;
          const wrong = pms.find((p) => p.kind !== 'gift_card' && p.id !== order.payment_method_id);
          if (wrong) {
            const refused = ctx.api('POST', '/orders/' + order.id + '/return', { item_ids: item.id, payment_method_id: wrong.id });
            ctx.assert(refused.status === 409 && refused.body.error.code === 'invalid_refund_destination', 'wrong destination: ' + JSON.stringify(refused));
          }
          const r = ctx.api('POST', '/orders/' + order.id + '/return', { item_ids: item.id, payment_method_id: gift.id });
          ctx.assert(r.status === 200, 'return to gift card: ' + JSON.stringify(r));
          const amount = item.quantity * item.unit_price;
          if (amount > 0) {
            const refunds = ctx.api('GET', '/refunds?order_id=' + order.id + '&kind=return').body.data;
            ctx.assert(refunds.length === 1 && refunds[0].payment_method_id === gift.id && refunds[0].amount === amount, 'refund to the gift card, got ' + JSON.stringify(refunds));
            ctx.assert(refunds[0].status === 'issued' && refunds[0].issued_at !== null, 'gift card refund is issued at once');
            const after = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data.find((p) => p.id === gift.id);
            ctx.assert(after.balance === gift.balance + amount, 'gift card credited by ' + amount + ', got ' + after.balance);
          }
          return;
        }
      }
  exchange_flow_and_completion:
    description: exchange_delivered_order_items points the line to a new variant of the same product, moves stock, settles the price difference, moves the order to exchange_requested and refuses a second request. After 4 days the job marks the order and item exchanged. Skips while there is no suitable order.
    script: |-
      (ctx) => {
        const orders = ctx.api('GET', '/orders?status=delivered').body.data;
        if (!orders) return;
        for (const order of orders) {
          const items = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data;
          const pms = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data;
          const pay = pms.find((p) => p.kind !== 'gift_card');
          if (!pay) continue;
          for (const item of items) {
            if (item.return_status !== 'none') continue;
            const vs = ctx.api('GET', '/products/' + item.product_id + '/variants?limit=25').body.data;
            const nv = vs.find((v) => v.available && v.id !== item.variant_id && v.stock >= item.quantity);
            if (!nv) continue;
            const oldStock = ctx.api('GET', '/variants/' + item.variant_id).body.stock;
            const diff = (nv.price - item.unit_price) * item.quantity;
            const wrongProduct = ctx.api('GET', '/variants/' + item.variant_id).body;
            ctx.assert(wrongProduct.product_id === item.product_id, 'seed: the line variant belongs to the line product');
            const same = ctx.api('POST', '/orders/' + order.id + '/exchange', { item_ids: item.id, new_variant_ids: item.variant_id, payment_method_id: pay.id });
            ctx.assert(same.status === 409 && same.body.error.code === 'same_variant', 'same variant: ' + JSON.stringify(same));
            const r = ctx.api('POST', '/orders/' + order.id + '/exchange', { item_ids: item.id, new_variant_ids: nv.id, payment_method_id: pay.id });
            ctx.assert(r.status === 200 && r.body.status === 'exchange_requested', 'exchange: ' + JSON.stringify(r));
            ctx.assert(r.body.total === order.total, 'the order total does not change on an exchange');
            const line = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data.find((i) => i.id === item.id);
            ctx.assert(line.return_status === 'exchange_requested' && line.exchange_variant_id === nv.id && line.variant_id === item.variant_id, 'line marked for exchange, got ' + JSON.stringify(line));
            ctx.assert(ctx.api('GET', '/variants/' + nv.id).body.stock === nv.stock - item.quantity, 'new variant stock went down');
            ctx.assert(ctx.api('GET', '/variants/' + item.variant_id).body.stock === oldStock + item.quantity, 'old variant stock went up');
            const refunds = ctx.api('GET', '/refunds?order_id=' + order.id + '&kind=exchange_difference').body.data;
            if (diff < 0) {
              ctx.assert(refunds.length === 1 && refunds[0].amount === -diff && refunds[0].payment_method_id === pay.id, 'difference refunded, got ' + JSON.stringify(refunds));
            } else {
              ctx.assert(refunds.length === 0, 'no refund when the price does not drop');
            }
            const again = ctx.api('POST', '/orders/' + order.id + '/exchange', { item_ids: item.id, new_variant_ids: nv.id, payment_method_id: pay.id });
            ctx.assert(again.status === 409 && again.body.error.code === 'already_requested', 'second exchange: ' + JSON.stringify(again));
            const fired = ctx.advance('4d');
            ctx.assert(fired.jobsFailed.length === 0, 'jobs failed: ' + JSON.stringify(fired.jobsFailed));
            ctx.assert(ctx.api('GET', '/orders/' + order.id).body.status === 'exchanged', 'order exchanged by the job');
            const done = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data.find((i) => i.id === item.id);
            ctx.assert(done.return_status === 'exchanged', 'item exchanged, got ' + done.return_status);
            return;
          }
        }
      }
  exchange_gift_card_difference:
    description: When an exchange costs more, a gift card pays the difference and is debited. Too little balance is refused. Skips while there is no suitable order.
    script: |-
      (ctx) => {
        const orders = ctx.api('GET', '/orders?status=delivered').body.data;
        if (!orders) return;
        for (const order of orders) {
          const items = ctx.api('GET', '/orders/' + order.id + '/items?limit=25').body.data;
          const pms = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data;
          const gift = pms.find((p) => p.kind === 'gift_card');
          if (!gift) continue;
          for (const item of items) {
            if (item.return_status !== 'none') continue;
            const vs = ctx.api('GET', '/products/' + item.product_id + '/variants?limit=25').body.data;
            const nv = vs.find((v) => v.available && v.id !== item.variant_id && v.stock >= item.quantity && (v.price - item.unit_price) * item.quantity > 0);
            if (!nv) continue;
            const diff = (nv.price - item.unit_price) * item.quantity;
            const body = { item_ids: item.id, new_variant_ids: nv.id, payment_method_id: gift.id };
            if (gift.balance < diff) {
              const refused = ctx.api('POST', '/orders/' + order.id + '/exchange', body);
              ctx.assert(refused.status === 409 && refused.body.error.code === 'insufficient_balance', 'poor gift card: ' + JSON.stringify(refused));
              ctx.assert(ctx.api('GET', '/orders/' + order.id).body.status === 'delivered', 'the refused exchange changed nothing');
            } else {
              const r = ctx.api('POST', '/orders/' + order.id + '/exchange', body);
              ctx.assert(r.status === 200, 'exchange: ' + JSON.stringify(r));
              const after = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data.find((p) => p.id === gift.id);
              ctx.assert(after.balance === gift.balance - diff, 'gift card debited by ' + diff + ', got ' + after.balance);
            }
            return;
          }
        }
      }
  pending_refund_is_issued_by_job:
    description: A pending refund to a non-gift-card method stays pending, and issue_pending_refunds issues it once it is 24 hours old. Skips while there is no suitable order.
    script: |-
      (ctx) => {
        const orders = ctx.api('GET', '/orders?status=pending').body.data;
        if (!orders) return;
        for (const order of orders) {
          if (order.total <= 0) continue;
          const pm = ctx.api('GET', '/users/' + order.user_id + '/payment_methods?limit=25').body.data.find((p) => p.id === order.payment_method_id);
          if (!pm || pm.kind === 'gift_card') continue;
          const r = ctx.api('POST', '/orders/' + order.id + '/cancel', { reason: 'no longer needed' });
          ctx.assert(r.status === 200, 'cancel: ' + JSON.stringify(r));
          ctx.advance('6h');
          const early = ctx.api('GET', '/refunds?order_id=' + order.id + '&kind=cancellation').body.data[0];
          ctx.assert(early.status === 'pending', 'still pending after 6 hours, got ' + early.status);
          ctx.advance('30h');
          const late = ctx.api('GET', '/refunds?order_id=' + order.id + '&kind=cancellation').body.data[0];
          ctx.assert(late.status === 'issued' && late.issued_at !== null, 'issued after 36 hours, got ' + JSON.stringify(late));
          return;
        }
      }
  update_user_address_flow:
    description: update_user_address changes the user's default address and leaves existing orders alone. Skips while there are no users.
    script: |-
      (ctx) => {
        const users = ctx.api('GET', '/users?limit=1').body.data;
        if (!users || users.length === 0) return;
        const u = users[0];
        const ordersBefore = ctx.api('GET', '/orders?user_id=' + u.id).body.data;
        const r = ctx.api('POST', '/users/' + u.id + '/address', { address_line: '500 Lakeview Drive', city: 'Madison', state_code: 'WI', zip: '53703', country: 'US' });
        ctx.assert(r.status === 200, 'update address: ' + JSON.stringify(r));
        ctx.assert(r.body.address_line === '500 Lakeview Drive' && r.body.city === 'Madison' && r.body.state_code === 'WI' && r.body.zip === '53703', 'address changed, got ' + JSON.stringify(r.body));
        ctx.assert(r.body.email === u.email && r.body.first_name === u.first_name && r.body.last_name === u.last_name, 'name and email unchanged');
        const ordersAfter = ctx.api('GET', '/orders?user_id=' + u.id).body.data;
        ctx.assert(JSON.stringify(ordersAfter) === JSON.stringify(ordersBefore), 'existing orders keep their shipping address');
      }
