revision: 2
software: Linear-style issue tracker (Linear issues, projects, milestones and labels, exposed as a REST API)
summary: A single-team issue tracker seeded from a real 123-issue Linear backlog (team key YOS, project WorldGen). Issues move through Backlog, In Progress, In Review, Done, Canceled and Duplicate. They carry a priority, a project, a milestone, labels, an optional parent and a completion time. Agents triage, move, relabel, re-milestone, close out and de-duplicate issues. Status changes go through actions that enforce the workflow rules and write an audit history. Two jobs auto-close parents and archive old done issues.
clock:
  start: 2026-10-07T09:00:00.000Z
  tick: 1s
verdict:
  kind: proceed
entities:
  - name: team
    purpose: The workspace team that owns issues and issue numbering. One row, key YOS. next_number is the counter create_issue uses.
    keyFields:
      - key
      - name
      - next_number
  - name: project
    purpose: A project issues belong to. The CSV has one, WorldGen. Issues with no project are allowed.
    keyFields:
      - name
      - status
      - description
  - name: milestone
    purpose: A named delivery stage (D1 .. D8, R1, R2, Later). Many issues share one milestone and a milestone may have none. Two milestones share the code R1, so code is not unique. sort_order keeps the roadmap order.
    keyFields:
      - name
      - code
      - sort_order
      - project_id
  - name: label
    purpose: A tag such as factory, kind:decision or area:infra. Built by splitting the CSV labels column on '; '. group is the part before ':' when there is one.
    keyFields:
      - name
      - group
  - name: issue
    purpose: 'The core record. identifier is TEAM-number (YOS-1) and the engine id is iss_NNNN. Fields: title, description, status (state), priority (nullable, no priority allowed), team_id, project_id, milestone_id, parent_id (sub-issue), duplicate_of_id, completed_at, archived_at. identifier, number, status, parent_id, duplicate_of_id, completed_at and archived_at are readonly and set only by actions, jobs and seed.'
    keyFields:
      - identifier
      - number
      - title
      - status
      - priority
      - project_id
      - milestone_id
      - parent_id
      - duplicate_of_id
      - completed_at
      - archived_at
  - name: issue_label
    purpose: Join row attaching a label to an issue. Unique per (issue, label), enforced by the add_label action.
    keyFields:
      - issue_id
      - label_id
  - name: comment
    purpose: A discussion note on an issue. Linear's CSV export has none, so the seed writes a small believable set of them.
    keyFields:
      - issue_id
      - body
  - name: issue_event
    purpose: Append-only history of what happened to an issue (created, status_changed, priority_changed, milestone_changed, label_added, label_removed, parent_changed, commented, archived). Written by actions and jobs.
    keyFields:
      - issue_id
      - kind
      - from_value
      - to_value
workflows:
  - name: issue_lifecycle
    entity: issue
    states:
      - backlog
      - in_progress
      - in_review
      - done
      - canceled
      - duplicate
    rules:
      - New issues start in backlog with completed_at null, via create_issue only. The action takes number = team.next_number, builds identifier = key + '-' + number, bumps next_number and writes a created event.
      - 'Transitions: backlog to in_progress, canceled, duplicate. in_progress to backlog, in_review, done, canceled, duplicate. in_review to in_progress, done, canceled, duplicate. done to in_progress. canceled and duplicate to backlog. The engine enforces this on every write.'
      - start_issue works only from backlog. request_review only from in_progress. complete_issue from in_progress or in_review. A wrong source status gives 409 invalid_state.
      - complete_issue, cancel_issue and mark_duplicate set completed_at to the call time. reopen_issue clears completed_at and duplicate_of_id.
      - complete_issue is refused with 409 open_sub_issues if any sub-issue is still backlog, in_progress or in_review. Close the children first.
      - mark_duplicate needs duplicate_of_id naming a different issue that is not itself a duplicate, else 409 or 422. The original is not changed.
      - cancel_issue takes an optional reason, which becomes a comment on the issue.
      - reopen_issue sends done back to in_progress, and canceled and duplicate back to backlog. A backlog, in_progress or in_review issue cannot be reopened.
      - set_parent rejects self-parenting and cycles with 409. Clearing the parent is allowed. Moving a child under a parent that is already done is refused.
      - add_label returns 409 if the label is already attached. remove_label returns 404 if it is not.
      - Every status, priority, milestone, parent and label change writes one issue_event with from_value and to_value. PATCH changes to priority and milestone_id write their events through update_issue's own logic, which the model stage must cover by making priority and milestone changes go through the event-writing action or accepting plain PATCH without history (the model stage decides and records it).
      - 'Jobs: auto_close_parents (every 1h) marks a parent in in_progress or in_review as done when it has sub-issues, all closed, and at least one done. auto_archive_done (every 1d) sets archived_at on done issues completed over 30 days ago.'
    actions:
      - create_issue
      - start_issue
      - request_review
      - complete_issue
      - cancel_issue
      - mark_duplicate
      - reopen_issue
      - set_parent
      - add_label
      - remove_label
jobs: []
acceptanceTests: []
routes:
  - id: list_issues
    method: GET
    path: /issues
    purpose: 'List issues. Filters: status, priority, project_id, milestone_id, parent_id, duplicate_of_id. Search: title and description. Sort: created_at, updated_at, completed_at, number. Cursor paging, 25 per page.'
  - id: get_issue
    method: GET
    path: /issues/{id}
    purpose: Fetch one issue by engine id.
  - id: create_issue
    method: POST
    path: /issues
    purpose: Built as an action, not a plain create. Allocates the next YOS-number from team.next_number, starts the issue in backlog and writes a created event.
  - id: update_issue
    method: PATCH
    path: /issues/{id}
    purpose: Edit title, description, priority, project_id and milestone_id. Readonly fields (status, parent, completion) are refused.
  - id: list_sub_issues
    method: GET
    path: /issues/{parent_id}/children
    purpose: List the sub-issues of a parent issue.
  - id: list_issue_labels
    method: GET
    path: /issues/{issue_id}/labels
    purpose: List the label attachments of an issue.
  - id: list_issue_comments
    method: GET
    path: /issues/{issue_id}/comments
    purpose: List the comments on an issue.
  - id: create_comment
    method: POST
    path: /issues/{issue_id}/comments
    purpose: Add a comment to an issue.
  - id: update_comment
    method: PATCH
    path: /comments/{id}
    purpose: Edit a comment body.
  - id: delete_comment
    method: DELETE
    path: /comments/{id}
    purpose: Delete a comment.
  - id: list_issue_events
    method: GET
    path: /issues/{issue_id}/history
    purpose: List the audit history of an issue, oldest first or by created_at sort.
  - id: list_projects
    method: GET
    path: /projects
    purpose: List projects.
  - id: get_project
    method: GET
    path: /projects/{id}
    purpose: Fetch one project.
  - id: list_milestones
    method: GET
    path: /milestones
    purpose: 'List milestones. Filter: project_id. Sort: sort_order.'
  - id: get_milestone
    method: GET
    path: /milestones/{id}
    purpose: Fetch one milestone.
  - id: update_milestone
    method: PATCH
    path: /milestones/{id}
    purpose: Rename or reorder a milestone.
  - id: list_labels
    method: GET
    path: /labels
    purpose: 'List labels. Filter: group. Search: name.'
  - id: get_label
    method: GET
    path: /labels/{id}
    purpose: Fetch one label.
  - id: create_label
    method: POST
    path: /labels
    purpose: Create a label. The name must be unique.
  - id: list_teams
    method: GET
    path: /teams
    purpose: List teams (one).
  - id: start_issue
    method: POST
    path: /issues/{id}/start
    purpose: Action. backlog to in_progress.
  - id: request_review
    method: POST
    path: /issues/{id}/review
    purpose: Action. in_progress to in_review.
  - id: complete_issue
    method: POST
    path: /issues/{id}/complete
    purpose: Action. in_progress or in_review to done. Sets completed_at. Refused while a sub-issue is still open.
  - id: cancel_issue
    method: POST
    path: /issues/{id}/cancel
    purpose: Action. Any open status to canceled. Sets completed_at. Optional reason becomes a comment.
  - id: mark_duplicate
    method: POST
    path: /issues/{id}/duplicate
    purpose: Action. Any open status to duplicate. Needs duplicate_of_id, which must be another issue that is not itself a duplicate. Sets completed_at.
  - id: reopen_issue
    method: POST
    path: /issues/{id}/reopen
    purpose: Action. done goes back to in_progress. canceled and duplicate go back to backlog. Clears completed_at and duplicate_of_id.
  - id: set_parent
    method: POST
    path: /issues/{id}/parent
    purpose: Action. Set or clear parent_id, with no self-parent and no cycles.
  - id: add_label
    method: POST
    path: /issues/{id}/labels
    purpose: Action. Attach an existing label to an issue. 409 if already attached.
  - id: remove_label
    method: DELETE
    path: /issues/{id}/labels/{label_id}
    purpose: Action. Detach a label from an issue.
seed:
  rowsPerEntity:
    team: 1
    project: 1
    milestone: 12
    label: 16
    issue: 123
    issue_label: 170
    comment: 60
    issue_event: 420
  mix: Issues come from the imported linear_backlog fixture and keep its status, priority, milestone, label and parent mix as is. Status counts are not forced. Done is the largest group, and 33% of rows have no completed time, which matches the open ones. Priority has about 3% empty values. 7% have no project and 18% no milestone. Three parents (YOS-91, YOS-105, YOS-114) have the only sub-issues, about 2% of rows. Comments, history events and ids are derived from the fixture rows with the seeded rng. Every row has created_at <= updated_at < 2026-10-07T09:00:00Z, because the imported rows end on 2026-10-06 23:18 UTC.
tasks:
  - id: start_the_welcome_issue
    difficulty: easy
    intent: Find the one backlog issue titled 'Get familiar with Linear' (or the seed's equivalent single backlog onboarding issue the seed stage pins) and move it to In Progress. Nothing else may change. The grader checks status = in_progress and that only that issue and its own history events changed.
    decoyIdea: Moves a different issue with a similar 'Get familiar' style title, or PATCHes status (refused) and then cancels it instead of starting it.
  - id: cancel_stale_backlog_in_milestone
    difficulty: medium
    intent: "Cancel every Backlog issue in the milestone named in the instruction (a seeded later-stage milestone such as 'Later: Fidelity and factory operations') that carries the label named in the instruction (such as 'factory'). Give each cancellation a reason, and the instruction states the reason must contain the keyword 'stale'. The grader checks that each cancel comment (comment.body) on a target issue contains 'stale' (case-insensitive), so nonsense such as 'bananas' scores below 1. Leave issues in other milestones, issues with other statuses and issues with a different label alone. The list spans more than one page, so the agent has to read milestones and labels first and then page issues and issue_labels."
    decoyIdea: Cancels every backlog issue in that milestone and ignores the label, or filters by label but reads only page 1, or cancels the issues in all milestones with that label, or cancels the right issues with a reason that does not contain 'stale'.
  - id: close_out_epic_with_sub_issues
    difficulty: hard
    intent: 'Close out the parent issue YOS-91 (a seeded parent that has open sub-issues): complete each sub-issue that is in_review or in_progress, cancel each sub-issue still in backlog with a reason, then complete the parent. complete_issue on the parent is refused until every child is closed, so order matters. The grader checks the ending statuses, that no unrelated issue changed, and through ctx.trace that every child was closed before the parent was completed.'
    decoyIdea: Tries to complete the parent first and gives up after the 409, completes the children but skips the backlog ones so the parent stays open, or cancels all the children, which loses the done work.
  - id: merge_duplicate_issues
    difficulty: hard
    intent: Two non-closed issues that the seed pins carry near-identical titles. Mark the newer one as a duplicate of the older one, and copy its labels onto the older one that are not there yet. The older issue keeps its status and priority. The grader checks status = duplicate with duplicate_of_id equal to the older issue, the label union on the older issue, and that no other issue changed.
    decoyIdea: Marks the older issue as the duplicate of the newer one, cancels the newer issue instead of using mark_duplicate, or marks the duplicate and forgets to merge labels.
open_questions:
  - question: Should the world model users and assignees even though the CSV has none?
    default_answer: No. The world has no user entity and issues have no assignee.
  - question: What is the clock start, given that the data ends on 2026-10-06T23:18Z?
    default_answer: 2026-10-07T09:00:00Z with a 1s tick.
  - question: Do canceled and duplicate issues get a completed time?
    default_answer: Yes. Done, canceled and duplicate all set completed_at, which fits the 33% null rate.
  - question: How should an empty priority be stored?
    default_answer: As null, meaning 'No priority'. It is not invented as a fifth enum value.
  - question: Is the labels column a list of tags or one tag per issue?
    default_answer: A list split on ';'. Each tag becomes a label row with a join row, and the part before ':' is the group.
  - question: May a parent be completed while sub-issues are still open?
    default_answer: No. complete_issue returns 409 open_sub_issues. The auto_close_parents job closes parents once their children are closed.
  - question: Can the status be changed by a plain PATCH?
    default_answer: No. Status is readonly, so only the lifecycle actions can change it.
  - question: Should issue history be written for plain PATCH edits to priority and milestone?
    default_answer: Yes where possible. The model stage may route priority and milestone edits through actions if PATCH cannot write history, and records the choice.
  - question: Is there a source OpenAPI spec to match?
    default_answer: No. Only the CSV was given, so the REST shape is designed here.
assumptions:
  - decision: clock.start is 2026-10-07T09:00:00.000Z and clock.tick is 1s.
    why: The latest imported timestamp is 2026-10-06T23:18:05Z, so the world starts the next morning, after all historical events. A 1s tick gives each committed call a distinct, deterministic timestamp. The jobs have no future scheduled events before the start.
  - decision: The world is a REST mirror of Linear, not GraphQL. Engine ids are iss_0001 style, and the Linear identifier (YOS-1) is kept in issue.identifier plus issue.number.
    why: The engine builds REST routes with idPrefix ids. The identifier is unique and filterable via search.
  - decision: Issue ids are assigned by identifier number order, so YOS-1 is iss_0001 where the numbers are dense. The seed resolves parent_id by looking up the identifier, not by guessing the id.
    why: Parents must be seeded before their children, and a child may have a lower number than its parent. The seed stage orders self-referencing rows with parents first.
  - decision: 'Status values map to snake_case states: Backlog=backlog, In Progress=in_progress, In Review=in_review, Done=done, Canceled=canceled, Duplicate=duplicate.'
    why: State names must match ^[a-z][a-z0-9_]*$. The CSV values map one to one.
  - decision: 'Status transitions: backlog to in_progress, canceled or duplicate. in_progress to backlog, in_review, done, canceled or duplicate. in_review to in_progress, done, canceled or duplicate. done to in_progress. canceled and duplicate to backlog.'
    why: The CSV carries no transition history, so this is the usual Linear flow. Reopening needs a legal path back.
  - decision: completed_at is set for done, canceled and duplicate issues, and cleared on reopen.
    why: About 33% of CSV rows have no completed time. Those would be the active statuses (backlog, in_progress, in_review), so all three terminal statuses must carry one.
  - decision: Empty priority is stored as null and means 'No priority'. The priority enum values are urgent, high, medium and low.
    why: 3% of CSV priorities are null. Linear's 'No priority' is a real state, so it is not invented as a value.
  - decision: Empty project and empty milestone stay null. The one project is WorldGen, and the 12 distinct milestone strings become 12 milestone rows, including the two separate R1 entries. code is the text before ':' and is not unique.
    why: 7% and 18% of the rows are empty in the CSV. Two milestones really are both called R1.
  - decision: labels is split on ';' and trimmed. Each token becomes a label row, and each (issue, label) pair becomes an issue_label row. A token like area:infra gets group area, and a plain token like factory has no group.
    why: The 23 distinct values are combos of tags. Treating them as flat labels would lose the filtering agents expect.
  - decision: Parent links form a depth-one tree in the seed. set_parent allows deeper nesting but rejects self-parenting and cycles. The create_issue action allows an optional parent_id.
    why: The CSV shows 3 parents. Linear permits nesting, and cycle protection is the rule an agent could break.
  - decision: complete_issue is refused with 409 open_sub_issues while any sub-issue is not done, canceled or duplicate. The auto_close_parents job completes a parent once every sub-issue is closed and at least one is done.
    why: This models Linear's 'close parent when sub-issues are closed' behaviour and gives hard tasks an ordering constraint.
  - decision: Status, parent, duplicate and completion fields are readonly, so a plain PATCH cannot change them. Only actions, jobs and seed do.
    why: Rules like completed_at and the history write live in the actions. A PATCH that skipped them would corrupt state, so it is refused.
  - decision: There are no users, assignees or authors. Comments and history events have no actor.
    why: The CSV has no assignee or user column. Adding an invented user table would give the agent facts the source never held.
  - decision: Comments and issue_event rows are synthesised in the seed from the fixture. They are not in the CSV.
    why: Comments and history are needed for lookups and audit checks. The seed derives them from each issue's timestamps and status so the data stays consistent.
  - decision: auto_archive_done runs every 1d and sets archived_at on done issues completed more than 30 days before now. Archived issues stay listable and filterable. The seed has none that old, so the job does nothing until the clock advances.
    why: Linear auto-archives closed issues. The imported data spans only one day, so the job is quiet at the start and only tests move the clock.
  - decision: 'The list envelope uses the engine defaults: data, next_cursor, limit and cursor. The error body is {error:{code,message}}.'
    why: No source API spec was given, so nothing contradicts the defaults.
  - decision: The required keyword in the cancel reason is 'stale', matching the task name, checked case-insensitively against the new comment.body on each target issue.
    why: The request asks for a keyword the task already gives; the task id says stale backlog.
outOfScope:
  - what: Users, assignees, authentication, permissions and workspace membership
    why: The CSV has no people columns. Inventing them would be unsourced.
  - what: Cycles/sprints, estimates, due dates, roadmaps, initiatives and custom views
    why: None of them appear in the imported backlog. They would add surface with no task value.
  - what: Attachments, file uploads, rich-text markdown rendering and @mentions
    why: The world stores plain text bodies only.
  - what: Webhooks, notifications, integrations (GitHub, Slack) and the GraphQL endpoint
    why: The engine exposes REST routes and actions only, and none of these affect the graded state.
  - what: Bulk import and export, templates, and multiple teams
    why: The CSV holds a single team. Fixtures are loaded by code, not by an API.
  - what: Hard delete of issues
    why: Linear archives or cancels instead of deleting, so there is no delete route for issue. Only comments can be deleted.
changes:
  - tasks.cancel_stale_backlog_in_milestone
