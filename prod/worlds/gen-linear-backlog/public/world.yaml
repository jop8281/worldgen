seed:
  team: "(ctx) => [{ key: 'YOS', name: 'Yos', next_number: 124, created_at: '2026-10-06T18:55:10.836Z', updated_at: '2026-10-06T18:55:10.836Z' }]"
  project: "(ctx) => [{ name: 'WorldGen', status: 'started', description: 'Build WorldGen: a factory that turns a description, OpenAPI spec or CSV into a graded, deterministic world for testing AI agents.', created_at: '2026-10-06T19:46:00.000Z', updated_at: '2026-10-06T19:46:00.000Z' }]"
  milestone: |-
    (ctx) => {
      const prj = ctx.rows('project')[0];
      const names = [];
      for (const r of ctx.fixtures.linear_backlog) if (r.milestone && !names.includes(r.milestone)) names.push(r.milestone);
      const rank = (n) => {
        const c = n.split(':')[0];
        if (/^D[0-9]+$/.test(c)) return parseInt(c.slice(1), 10);
        if (c === 'R1') return 20;
        if (c === 'R2') return 21;
        return 30;
      };
      const sorted = names.map((n, i) => ({ n, i })).sort((a, b) => rank(a.n) - rank(b.n) || a.i - b.i);
      return sorted.map((x, k) => ({ name: x.n, code: x.n.split(':')[0], sort_order: k, project_id: prj.id, created_at: '2026-10-06T19:46:00.000Z', updated_at: '2026-10-06T19:46:00.000Z' }));
    }
  label: |-
    (ctx) => {
      const names = [];
      for (const r of ctx.fixtures.linear_backlog) {
        if (!r.labels) continue;
        for (const t of String(r.labels).split(';')) {
          const n = t.trim();
          if (n !== '' && !names.includes(n)) names.push(n);
        }
      }
      return names.map((n) => ({ name: n, group: n.includes(':') ? n.split(':')[0] : null, created_at: '2026-10-06T19:46:00.000Z', updated_at: '2026-10-06T19:46:00.000Z' }));
    }
  issue: |-
    (ctx) => {
      const fx = ctx.fixtures.linear_backlog;
      const team = ctx.rows('team')[0];
      const prj = ctx.rows('project')[0];
      const msByName = {};
      for (const m of ctx.rows('milestone')) msByName[m.name] = m.id;
      const idOf = {};
      const pos = {};
      fx.forEach((r, i) => { idOf[r.id] = 'iss_' + String(i + 1).padStart(4, '0'); pos[r.id] = i; });
      const dupOf = { 'YOS-74': 'YOS-29', 'YOS-92': 'YOS-90', 'YOS-106': 'YOS-88', 'YOS-122': 'YOS-121' };
      return fx.map((r, i) => {
        const status = String(r.status).toLowerCase().replace(/ /g, '_');
        const pr = r.priority ? String(r.priority).toLowerCase() : null;
        const d = dupOf[r.id];
        return {
          identifier: r.id,
          number: i + 1,
          title: r.title,
          description: null,
          status,
          priority: pr,
          team_id: team.id,
          project_id: r.project ? prj.id : null,
          milestone_id: r.milestone ? msByName[r.milestone] : null,
          parent_id: r.parent && pos[r.parent] < i ? idOf[r.parent] : null,
          duplicate_of_id: status === 'duplicate' && d && pos[d] < i ? idOf[d] : null,
          completed_at: r.completed || null,
          archived_at: null,
          created_at: r.created,
          updated_at: r.updated,
        };
      });
    }
  issue_label: |-
    (ctx) => {
      const lid = {};
      for (const l of ctx.rows('label')) lid[l.name] = l.id;
      const out = [];
      const fx = ctx.fixtures.linear_backlog;
      ctx.rows('issue').forEach((iss, i) => {
        const r = fx[i];
        if (!r.labels) return;
        for (const t of String(r.labels).split(';')) {
          const n = t.trim();
          if (n === '' || !lid[n]) continue;
          out.push({ issue_id: iss.id, label_id: lid[n], created_at: iss.created_at, updated_at: iss.created_at });
        }
      });
      return out;
    }
  comment: |-
    (ctx) => {
      const pools = {
        backlog: ['Parking this until the engine work lands.', 'Needs a clearer acceptance test before we pick it up.', 'Blocked on the decision in the milestone notes.'],
        in_progress: ['Branch is up, first pass of the tests is green.', 'Hit an edge case with nested transactions, investigating.', 'Pairing on this with the stress run results.'],
        in_review: ['PR is open, waiting on review.', 'Addressed review comments, please take another look.'],
        done: ['Merged to main, closing.', 'Verified against the check suite, all green.', 'Landed with tests. Follow-ups filed separately.'],
        canceled: ['No longer needed, dropping this.', 'Out of scope for the current milestone.'],
        duplicate: ['Closing as a duplicate of the newer ticket.', 'Superseded by the consolidated issue.'],
      };
      const out = [];
      for (const iss of ctx.rows('issue')) {
        if (iss.number < 5) continue;
        if (ctx.rng() >= 0.5) continue;
        const body = ctx.pick(pools[iss.status]);
        let t = ctx.time.plus(iss.created_at, ctx.int(5, 120) + 'm');
        if (ctx.time.minutesBetween(t, iss.updated_at) < 0) t = iss.updated_at;
        out.push({ issue_id: iss.id, body, created_at: t, updated_at: t });
      }
      return out;
    }
  issue_event: |-
    (ctx) => {
      const out = [];
      const labels = {};
      for (const l of ctx.rows('label')) labels[l.id] = l.name;
      const add = (t, mins) => (mins >= 1 ? ctx.time.plus(t, mins + 'm') : t);
      const clamp = (t, iss) => (ctx.time.minutesBetween(t, iss.updated_at) < 0 ? iss.updated_at : t);
      const mid = (a, b) => add(a, Math.floor(Math.max(0, ctx.time.minutesBetween(a, b)) / 2));
      for (const iss of ctx.rows('issue')) {
        const ev = (kind, at, from, to) => out.push({ at, row: { issue_id: iss.id, kind, from_value: from, to_value: to, created_at: at, updated_at: at } });
        ev('created', iss.created_at, null, iss.identifier);
        const end = iss.completed_at || iss.updated_at;
        const m = mid(iss.created_at, end);
        if (iss.status === 'in_progress') ev('status_changed', m, 'backlog', 'in_progress');
        else if (iss.status === 'in_review') {
          ev('status_changed', mid(iss.created_at, m), 'backlog', 'in_progress');
          ev('status_changed', m, 'in_progress', 'in_review');
        } else if (iss.status === 'done') {
          ev('status_changed', mid(iss.created_at, m), 'backlog', 'in_progress');
          ev('status_changed', end, 'in_progress', 'done');
        } else if (iss.status === 'canceled' || iss.status === 'duplicate') {
          ev('status_changed', end, 'backlog', iss.status);
        }
        if (iss.priority && ctx.rng() < 0.2) ev('priority_changed', clamp(add(iss.created_at, 3), iss), 'medium', iss.priority);
      }
      const byId = {};
      for (const i of ctx.rows('issue')) byId[i.id] = i;
      for (const il of ctx.rows('issue_label')) {
        const iss = byId[il.issue_id];
        const at = clamp(add(iss.created_at, 1), iss);
        out.push({ at, row: { issue_id: iss.id, kind: 'label_added', from_value: null, to_value: labels[il.label_id], created_at: at, updated_at: at } });
      }
      out.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
      return out.map((e) => e.row);
    }
tests:
  create_issue_allocates_number:
    description: create_issue allocates sequential identifiers, starts in backlog, writes a created event and validates the parent.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/issues', { title: 'First workflow issue', priority: 'high' });
        ctx.assert(a.status === 201, 'create returned ' + a.status + ' ' + JSON.stringify(a.body));
        ctx.assert(a.body.status === 'backlog' && a.body.completed_at === null && a.body.priority === 'high', 'backlog, high: ' + JSON.stringify(a.body));
        ctx.assert(/^[A-Z]+-[0-9]+$/.test(a.body.identifier), 'identifier shape ' + a.body.identifier);
        const b = ctx.api('POST', '/issues', { title: 'Second workflow issue', parent_id: a.body.id });
        ctx.assert(b.status === 201 && b.body.number === a.body.number + 1 && b.body.parent_id === a.body.id, 'second: ' + JSON.stringify(b.body));
        const h = ctx.api('GET', '/issues/' + a.body.id + '/history').body.data;
        ctx.assert(h.length === 1 && h[0].kind === 'created', 'created event: ' + JSON.stringify(h));
        const blank = ctx.api('POST', '/issues', { title: '   ' });
        ctx.assert(blank.status === 400, 'blank title: ' + blank.status);
        const bad = ctx.api('POST', '/issues', { title: 'x', parent_id: 'iss_999999' });
        ctx.assert(bad.status >= 400 && bad.status < 500, 'unknown parent: ' + bad.status);
      }
  status_lifecycle_actions:
    description: start, review, complete and reopen move an issue along the lifecycle and refuse wrong source statuses.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/issues', { title: 'Lifecycle issue' }).body;
        const early = ctx.api('POST', '/issues/' + a.id + '/review', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'review from backlog: ' + JSON.stringify(early));
        const s = ctx.api('POST', '/issues/' + a.id + '/start', {});
        ctx.assert(s.status === 200 && s.body.status === 'in_progress', 'start: ' + JSON.stringify(s));
        const s2 = ctx.api('POST', '/issues/' + a.id + '/start', {});
        ctx.assert(s2.status === 409, 'second start: ' + s2.status);
        const r = ctx.api('POST', '/issues/' + a.id + '/review', {});
        ctx.assert(r.status === 200 && r.body.status === 'in_review', 'review: ' + JSON.stringify(r));
        const c = ctx.api('POST', '/issues/' + a.id + '/complete', {});
        ctx.assert(c.status === 200 && c.body.status === 'done' && typeof c.body.completed_at === 'string', 'complete: ' + JSON.stringify(c));
        const c2 = ctx.api('POST', '/issues/' + a.id + '/complete', {});
        ctx.assert(c2.status === 409, 'second complete: ' + c2.status);
        const re = ctx.api('POST', '/issues/' + a.id + '/reopen', {});
        ctx.assert(re.status === 200 && re.body.status === 'in_progress' && re.body.completed_at === null, 'reopen done: ' + JSON.stringify(re));
        const re2 = ctx.api('POST', '/issues/' + a.id + '/reopen', {});
        ctx.assert(re2.status === 409, 'reopen in_progress: ' + re2.status);
        const h = ctx.api('GET', '/issues/' + a.id + '/history?kind=status_changed').body.data;
        ctx.assert(h.length === 4, 'four status events, got ' + h.length);
        const miss = ctx.api('POST', '/issues/iss_999999/start', {});
        ctx.assert(miss.status === 404, 'missing: ' + miss.status);
      }
  cancel_and_reopen:
    description: cancel_issue sets completed_at, stores the reason as a comment, and reopen returns the issue to backlog.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/issues', { title: 'Stale idea' }).body;
        const c = ctx.api('POST', '/issues/' + a.id + '/cancel', { reason: 'No longer needed' });
        ctx.assert(c.status === 200 && c.body.status === 'canceled' && c.body.completed_at !== null, 'cancel: ' + JSON.stringify(c));
        const cm = ctx.api('GET', '/issues/' + a.id + '/comments').body.data;
        ctx.assert(cm.length === 1 && cm[0].body === 'No longer needed', 'reason comment: ' + JSON.stringify(cm));
        const again = ctx.api('POST', '/issues/' + a.id + '/cancel', {});
        ctx.assert(again.status === 409, 'cancel twice: ' + again.status);
        const r = ctx.api('POST', '/issues/' + a.id + '/reopen', {});
        ctx.assert(r.status === 200 && r.body.status === 'backlog' && r.body.completed_at === null, 'reopen: ' + JSON.stringify(r));
        const b = ctx.api('POST', '/issues', { title: 'No reason' }).body;
        ctx.assert(ctx.api('POST', '/issues/' + b.id + '/cancel', {}).status === 200, 'cancel without reason');
        ctx.assert(ctx.api('GET', '/issues/' + b.id + '/comments').body.data.length === 0, 'no comment without reason');
      }
  complete_blocked_by_open_children:
    description: A parent cannot be completed while a sub-issue is open and can once the children are closed.
    script: |-
      (ctx) => {
        const p = ctx.api('POST', '/issues', { title: 'Epic' }).body;
        const k1 = ctx.api('POST', '/issues', { title: 'Child one', parent_id: p.id }).body;
        const k2 = ctx.api('POST', '/issues', { title: 'Child two', parent_id: p.id }).body;
        ctx.api('POST', '/issues/' + p.id + '/start', {});
        const blocked = ctx.api('POST', '/issues/' + p.id + '/complete', {});
        ctx.assert(blocked.status === 409 && blocked.body.error.code === 'open_sub_issues', 'blocked: ' + JSON.stringify(blocked));
        ctx.api('POST', '/issues/' + k1.id + '/start', {});
        ctx.assert(ctx.api('POST', '/issues/' + k1.id + '/complete', {}).status === 200, 'complete child one');
        const still = ctx.api('POST', '/issues/' + p.id + '/complete', {});
        ctx.assert(still.status === 409, 'still blocked by child two: ' + still.status);
        ctx.assert(ctx.api('POST', '/issues/' + k2.id + '/cancel', { reason: 'out of scope' }).status === 200, 'cancel child two');
        const ok = ctx.api('POST', '/issues/' + p.id + '/complete', {});
        ctx.assert(ok.status === 200 && ok.body.status === 'done', 'parent completes: ' + JSON.stringify(ok));
        const kids = ctx.api('GET', '/issues/' + p.id + '/children').body.data;
        ctx.assert(kids.length === 2, 'two children listed');
      }
  mark_duplicate_rules:
    description: mark_duplicate links to the original, refuses self and duplicate originals, and reopen clears the link.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/issues', { title: 'Original bug', priority: 'high' }).body;
        const b = ctx.api('POST', '/issues', { title: 'Original bug again' }).body;
        const self = ctx.api('POST', '/issues/' + b.id + '/duplicate', { duplicate_of_id: b.id });
        ctx.assert(self.status === 409, 'self: ' + self.status);
        const d = ctx.api('POST', '/issues/' + b.id + '/duplicate', { duplicate_of_id: a.id });
        ctx.assert(d.status === 200 && d.body.status === 'duplicate' && d.body.duplicate_of_id === a.id && d.body.completed_at !== null, 'duplicate: ' + JSON.stringify(d));
        const after = ctx.api('GET', '/issues/' + a.id).body;
        ctx.assert(after.status === 'backlog' && after.priority === 'high', 'original untouched: ' + JSON.stringify(after));
        const c = ctx.api('POST', '/issues', { title: 'Third' }).body;
        const bad = ctx.api('POST', '/issues/' + c.id + '/duplicate', { duplicate_of_id: b.id });
        ctx.assert(bad.status === 409, 'original is duplicate: ' + bad.status);
        const again = ctx.api('POST', '/issues/' + b.id + '/duplicate', { duplicate_of_id: a.id });
        ctx.assert(again.status === 409, 'already duplicate: ' + again.status);
        const r = ctx.api('POST', '/issues/' + b.id + '/reopen', {});
        ctx.assert(r.status === 200 && r.body.status === 'backlog' && r.body.duplicate_of_id === null, 'reopen: ' + JSON.stringify(r));
      }
  set_parent_rules:
    description: set_parent sets and clears parents and refuses self-parenting, cycles and done parents.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/issues', { title: 'Top' }).body;
        const b = ctx.api('POST', '/issues', { title: 'Middle' }).body;
        const s = ctx.api('POST', '/issues/' + b.id + '/parent', { parent_id: a.id });
        ctx.assert(s.status === 200 && s.body.parent_id === a.id, 'set: ' + JSON.stringify(s));
        ctx.assert(ctx.api('POST', '/issues/' + b.id + '/parent', { parent_id: a.id }).status === 409, 'no change');
        ctx.assert(ctx.api('POST', '/issues/' + a.id + '/parent', { parent_id: a.id }).status === 409, 'self parent');
        const cyc = ctx.api('POST', '/issues/' + a.id + '/parent', { parent_id: b.id });
        ctx.assert(cyc.status === 409 && cyc.body.error.code === 'parent_cycle', 'cycle: ' + JSON.stringify(cyc));
        const clr = ctx.api('POST', '/issues/' + b.id + '/parent', { parent_id: null });
        ctx.assert(clr.status === 200 && clr.body.parent_id === null, 'clear: ' + JSON.stringify(clr));
        const x = ctx.api('POST', '/issues', { title: 'Finished' }).body;
        ctx.api('POST', '/issues/' + x.id + '/start', {});
        ctx.api('POST', '/issues/' + x.id + '/complete', {});
        const done = ctx.api('POST', '/issues/' + b.id + '/parent', { parent_id: x.id });
        ctx.assert(done.status === 409 && done.body.error.code === 'parent_done', 'done parent: ' + JSON.stringify(done));
        const h = ctx.api('GET', '/issues/' + b.id + '/history?kind=parent_changed').body.data;
        ctx.assert(h.length === 2, 'two parent events, got ' + h.length);
      }
  label_attach_and_detach:
    description: add_label attaches once, remove_label detaches, and both write history.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/issues', { title: 'Label me' }).body;
        const l = ctx.api('POST', '/labels', { name: 'wf-test-label' });
        ctx.assert(l.status === 201, 'create label: ' + JSON.stringify(l));
        const add = ctx.api('POST', '/issues/' + a.id + '/labels', { label_id: l.body.id });
        ctx.assert(add.status === 201 && add.body.label_id === l.body.id, 'add: ' + JSON.stringify(add));
        const dup = ctx.api('POST', '/issues/' + a.id + '/labels', { label_id: l.body.id });
        ctx.assert(dup.status === 409 && dup.body.error.code === 'already_attached', 'dup: ' + JSON.stringify(dup));
        ctx.assert(ctx.api('GET', '/issues/' + a.id + '/labels').body.data.length === 1, 'one attachment');
        const rm = ctx.api('DELETE', '/issues/' + a.id + '/labels/' + l.body.id);
        ctx.assert(rm.status === 200, 'remove: ' + JSON.stringify(rm));
        const rm2 = ctx.api('DELETE', '/issues/' + a.id + '/labels/' + l.body.id);
        ctx.assert(rm2.status === 404, 'remove twice: ' + rm2.status);
        ctx.assert(ctx.api('GET', '/issues/' + a.id + '/labels').body.data.length === 0, 'none attached');
        const h = ctx.api('GET', '/issues/' + a.id + '/history').body.data.map((e) => e.kind);
        ctx.assert(h.includes('label_added') && h.includes('label_removed'), 'label events: ' + h.join(','));
      }
  auto_close_parent_job:
    description: auto_close_parents completes an in_progress parent once all children are closed and one is done.
    script: |-
      (ctx) => {
        const p = ctx.api('POST', '/issues', { title: 'Auto parent' }).body;
        const k = ctx.api('POST', '/issues', { title: 'Auto child', parent_id: p.id }).body;
        ctx.api('POST', '/issues/' + p.id + '/start', {});
        ctx.api('POST', '/issues/' + k.id + '/start', {});
        ctx.advance('2h');
        ctx.assert(ctx.api('GET', '/issues/' + p.id).body.status === 'in_progress', 'parent stays open while child is open');
        ctx.api('POST', '/issues/' + k.id + '/complete', {});
        const r = ctx.advance('1h');
        ctx.assert(r.jobsFailed.length === 0, 'jobs failed: ' + JSON.stringify(r.jobsFailed));
        const after = ctx.api('GET', '/issues/' + p.id).body;
        ctx.assert(after.status === 'done' && after.completed_at !== null, 'parent closed by job: ' + JSON.stringify(after));
      }
  auto_archive_job:
    description: auto_archive_done archives done issues completed more than 30 days ago and leaves recent ones.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/issues', { title: 'Old done' }).body;
        ctx.api('POST', '/issues/' + a.id + '/start', {});
        ctx.api('POST', '/issues/' + a.id + '/complete', {});
        ctx.advance('480h');
        ctx.assert(ctx.api('GET', '/issues/' + a.id).body.archived_at === null, 'not archived after 20 days');
        const b = ctx.api('POST', '/issues', { title: 'Newer done' }).body;
        ctx.api('POST', '/issues/' + b.id + '/start', {});
        ctx.api('POST', '/issues/' + b.id + '/complete', {});
        const r = ctx.advance('288h');
        ctx.assert(r.jobsFailed.length === 0, 'jobs failed: ' + JSON.stringify(r.jobsFailed));
        const oldRow = ctx.api('GET', '/issues/' + a.id).body;
        const newRow = ctx.api('GET', '/issues/' + b.id).body;
        ctx.assert(typeof oldRow.archived_at === 'string', 'old archived: ' + JSON.stringify(oldRow));
        ctx.assert(newRow.archived_at === null, 'newer not archived: ' + JSON.stringify(newRow));
      }
tasks:
  start_the_welcome_issue:
    difficulty: easy
    instruction: Find the backlog issue about the timed live-run rehearsal on sealed unseen prompts and start work on it by moving it to In Progress. Change nothing else.
    decoys: []
    alternatives: []
  cancel_stale_backlog_in_milestone:
    difficulty: medium
    instruction: "Clean up the backlog of the milestone 'Later: Fidelity and factory operations': cancel every issue in it that is still in Backlog and carries the label 'area:engine'. Give each cancellation a short reason. Leave all other issues alone, including issues in other statuses, in other milestones, or with other labels."
    decoys: []
    alternatives: []
  close_out_epic_with_sub_issues:
    difficulty: hard
    instruction: Close out the epics. An epic is an issue that is still In Progress and has sub-issues. For every epic, first complete each of its open sub-issues, then complete the epic itself. Change nothing else.
    decoys: []
    alternatives: []
  merge_duplicate_issues:
    difficulty: hard
    instruction: Several issues were closed as duplicates of another issue, but the labels on those duplicates were never carried over to the issues they duplicate. For every duplicate that has a recorded original, attach to the original any label the duplicate carries that the original is missing. Do not touch the duplicates themselves, do not remove any label, and change nothing else.
    decoys: []
    alternatives: []
