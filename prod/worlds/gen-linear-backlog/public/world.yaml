format: 1
meta:
  name: gen_linear_backlog
  description: A single-team issue tracker seeded from a real 123-issue Linear backlog (team key YOS, project WorldGen). Issues move through Backlog, In Progress, In Review, Done, Canceled and Duplicate. They carry a priority, a project, a milestone, labels, an optional parent and a completion time. Agents triage, move, relabel, re-milestone, close out and de-duplicate issues. Status changes go through actions that enforce the workflow rules and write an audit history. Two jobs auto-close parents and archive old done issues.
  resembles: Linear-style issue tracker (Linear issues, projects, milestones and labels, exposed as a REST API)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-07T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  team:
    description: The workspace team that owns issues and issue numbering. One row, key YOS. next_number is the counter the create_issue action uses.
    idPrefix: team
    fields:
      key:
        type: string
        description: Short team key used in issue identifiers, such as YOS.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 10
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      next_number:
        type: int
        description: Number the next created issue takes. Bumped only by create_issue.
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 1
        default: 1
  project:
    description: A project issues belong to. Issues with no project are allowed.
    idPrefix: prj
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 120
      status:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - planned
          - started
          - paused
          - completed
          - canceled
        default: started
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  milestone:
    description: A named delivery stage such as D1, R1 or Later. Many issues share one milestone. Two milestones share the code R1, so code is not unique. sort_order keeps the roadmap order.
    idPrefix: mil
    fields:
      name:
        type: string
        description: "Full milestone name, such as 'D1: Engine core: format, check, store, CRUD, transactions, clock'."
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      code:
        type: string
        description: Text before the first colon in the name. Not unique.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 20
      sort_order:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      project_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: project
        onDelete: nullify
  label:
    description: A tag such as factory, kind:decision or area:infra. group is the part before ':' when there is one.
    idPrefix: lbl
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 80
      group:
        type: string
        description: Part of the name before ':', or null for a plain label.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 40
  issue:
    description: The core record. identifier is TEAM-number (YOS-1). Status, parent, duplicate link, completion and archive fields are readonly and change only through actions, jobs and seed. Plain PATCH edits to title, description, priority, project and milestone are accepted without writing history events (decision recorded by the model stage).
    idPrefix: iss
    fields:
      identifier:
        type: string
        description: TEAM-number, such as YOS-91.
        required: true
        nullable: false
        unique: true
        readonly: true
        maxLength: 30
      number:
        type: int
        required: true
        nullable: false
        unique: true
        readonly: true
        min: 1
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 300
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: state
        description: Workflow status. Changed only by lifecycle actions.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - backlog
          - in_progress
          - in_review
          - done
          - canceled
          - duplicate
        initial: backlog
        transitions:
          backlog:
            - in_progress
            - canceled
            - duplicate
          in_progress:
            - backlog
            - in_review
            - done
            - canceled
            - duplicate
          in_review:
            - in_progress
            - done
            - canceled
            - duplicate
          done:
            - in_progress
          canceled:
            - backlog
          duplicate:
            - backlog
      priority:
        type: enum
        description: null means no priority.
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - urgent
          - high
          - medium
          - low
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: restrict
      project_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: project
        onDelete: nullify
      milestone_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: milestone
        onDelete: nullify
      parent_id:
        type: ref
        description: Parent issue when this is a sub-issue. Set by set_parent.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: issue
        onDelete: nullify
      duplicate_of_id:
        type: ref
        description: Original issue when status is duplicate. Set by mark_duplicate.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: issue
        onDelete: nullify
      completed_at:
        type: datetime
        description: Set when the issue becomes done, canceled or duplicate. Cleared on reopen.
        required: false
        nullable: true
        unique: false
        readonly: true
      archived_at:
        type: datetime
        description: Set by the auto_archive_done job.
        required: false
        nullable: true
        unique: false
        readonly: true
  issue_label:
    description: Join row attaching a label to an issue. Unique per (issue, label), enforced by the add_label action.
    idPrefix: isl
    fields:
      issue_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: issue
        onDelete: cascade
      label_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: label
        onDelete: cascade
  comment:
    description: A discussion note on an issue. Comments have no author.
    idPrefix: cmt
    fields:
      issue_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: issue
        onDelete: cascade
      body:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
  issue_event:
    description: Append-only history of what happened to an issue. Written by actions and jobs.
    idPrefix: evt
    fields:
      issue_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: issue
        onDelete: cascade
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - created
          - status_changed
          - priority_changed
          - milestone_changed
          - label_added
          - label_removed
          - parent_changed
          - commented
          - archived
      from_value:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 300
      to_value:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 300
routes:
  list_issues:
    op: list
    entity: issue
    filters:
      - status
      - priority
      - project_id
      - milestone_id
      - parent_id
      - duplicate_of_id
    search:
      - title
      - description
      - identifier
    sort:
      - created_at
      - updated_at
      - completed_at
      - number
    pageSize: 25
    method: GET
    path: /issues
    description: List issues with filters, search and cursor paging.
  get_issue:
    op: get
    entity: issue
    method: GET
    path: /issues/{id}
    description: Fetch one issue by engine id.
  update_issue:
    op: update
    entity: issue
    method: PATCH
    path: /issues/{id}
    description: Edit title, description, priority, project_id and milestone_id. Status, parent and completion fields are readonly. No history event is written for these edits.
  list_sub_issues:
    op: list
    entity: issue
    filters:
      - status
    search: []
    sort:
      - number
      - created_at
    pageSize: 25
    method: GET
    path: /issues/{parent_id}/children
    description: List the sub-issues of a parent issue.
  list_issue_labels:
    op: list
    entity: issue_label
    filters:
      - label_id
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /issues/{issue_id}/labels
    description: List the label attachments of an issue.
  list_issue_comments:
    op: list
    entity: comment
    filters: []
    search:
      - body
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /issues/{issue_id}/comments
    description: List the comments on an issue.
  create_comment:
    op: create
    entity: comment
    method: POST
    path: /issues/{issue_id}/comments
    description: Add a comment to an issue.
  update_comment:
    op: update
    entity: comment
    method: PATCH
    path: /comments/{id}
    description: Edit a comment body.
  delete_comment:
    op: delete
    entity: comment
    method: DELETE
    path: /comments/{id}
    description: Delete a comment.
  list_issue_events:
    op: list
    entity: issue_event
    filters:
      - kind
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /issues/{issue_id}/history
    description: List the audit history of an issue.
  list_projects:
    op: list
    entity: project
    filters:
      - status
    search:
      - name
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /projects
    description: List projects.
  get_project:
    op: get
    entity: project
    method: GET
    path: /projects/{id}
    description: Fetch one project.
  list_milestones:
    op: list
    entity: milestone
    filters:
      - project_id
      - code
    search:
      - name
    sort:
      - sort_order
    pageSize: 25
    method: GET
    path: /milestones
    description: List milestones in roadmap order.
  get_milestone:
    op: get
    entity: milestone
    method: GET
    path: /milestones/{id}
    description: Fetch one milestone.
  update_milestone:
    op: update
    entity: milestone
    method: PATCH
    path: /milestones/{id}
    description: Rename or reorder a milestone.
  list_labels:
    op: list
    entity: label
    filters:
      - group
    search:
      - name
    sort:
      - name
    pageSize: 25
    method: GET
    path: /labels
    description: List labels.
  get_label:
    op: get
    entity: label
    method: GET
    path: /labels/{id}
    description: Fetch one label.
  create_label:
    op: create
    entity: label
    method: POST
    path: /labels
    description: Create a label. The name must be unique.
  list_teams:
    op: list
    entity: team
    filters: []
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /teams
    description: List teams.
actions:
  create_issue:
    method: POST
    path: /issues
    description: Create an issue in backlog. Allocates the next TEAM-number from team.next_number and writes a created event.
    input:
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 300
      description:
        type: text
        required: false
        nullable: false
        unique: false
        readonly: false
      priority:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - urgent
          - high
          - medium
          - low
      project_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: project
        onDelete: restrict
      milestone_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: milestone
        onDelete: restrict
      parent_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: issue
        onDelete: restrict
    handler: |-
      (ctx) => {
        const b = ctx.body;
        if (b.title.trim() === '') ctx.fail(400, 'input.invalid', 'title must not be blank');
        let team = ctx.db.list('team')[0];
        if (!team) team = ctx.db.create('team', { key: 'YOS', name: 'YOS', next_number: 1 });
        if (b.parent_id) {
          const p = ctx.db.get('issue', b.parent_id);
          if (!p) ctx.fail(422, 'unknown_parent', 'parent ' + b.parent_id + ' not found');
          if (p.status === 'done') ctx.fail(409, 'parent_done', 'parent ' + p.identifier + ' is done');
        }
        let n = team.next_number;
        while (ctx.db.list('issue', { where: { number: n } }).length > 0) n++;
        const row = { identifier: team.key + '-' + n, number: n, title: b.title, team_id: team.id, status: 'backlog', completed_at: null };
        for (const k of ['description', 'priority', 'project_id', 'milestone_id']) if (b[k] !== undefined) row[k] = b[k];
        if (b.parent_id) row.parent_id = b.parent_id;
        const issue = ctx.db.create('issue', row);
        ctx.db.update('team', team.id, { next_number: n + 1 });
        ctx.db.create('issue_event', { issue_id: issue.id, kind: 'created', from_value: null, to_value: issue.identifier });
        return { status: 201, body: issue };
      }
  start_issue:
    method: POST
    path: /issues/{id}/start
    description: Move a backlog issue to in_progress.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        if (t.status !== 'backlog') ctx.fail(409, 'invalid_state', 'issue ' + t.identifier + ' is ' + t.status + '. Only backlog issues can be started.');
        const u = ctx.db.update('issue', id, { status: 'in_progress' });
        ctx.db.create('issue_event', { issue_id: id, kind: 'status_changed', from_value: 'backlog', to_value: 'in_progress' });
        return { status: 200, body: u };
      }
  request_review:
    method: POST
    path: /issues/{id}/review
    description: Move an in_progress issue to in_review.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        if (t.status !== 'in_progress') ctx.fail(409, 'invalid_state', 'issue ' + t.identifier + ' is ' + t.status + '. Only in_progress issues can go to review.');
        const u = ctx.db.update('issue', id, { status: 'in_review' });
        ctx.db.create('issue_event', { issue_id: id, kind: 'status_changed', from_value: 'in_progress', to_value: 'in_review' });
        return { status: 200, body: u };
      }
  complete_issue:
    method: POST
    path: /issues/{id}/complete
    description: Complete an in_progress or in_review issue. Refused while a sub-issue is still open.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        if (t.status !== 'in_progress' && t.status !== 'in_review') ctx.fail(409, 'invalid_state', 'issue ' + t.identifier + ' is ' + t.status + '. Only in_progress and in_review issues can be completed.');
        const open = ctx.db.list('issue', { where: { parent_id: id } }).filter((c) => c.status === 'backlog' || c.status === 'in_progress' || c.status === 'in_review');
        if (open.length > 0) ctx.fail(409, 'open_sub_issues', 'issue ' + t.identifier + ' has ' + open.length + ' open sub-issues: ' + open.map((c) => c.identifier).join(', ') + '. Close them first.');
        const u = ctx.db.update('issue', id, { status: 'done', completed_at: ctx.now() });
        ctx.db.create('issue_event', { issue_id: id, kind: 'status_changed', from_value: t.status, to_value: 'done' });
        return { status: 200, body: u };
      }
  cancel_issue:
    method: POST
    path: /issues/{id}/cancel
    description: Cancel a backlog, in_progress or in_review issue. An optional reason becomes a comment.
    input:
      reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        if (t.status !== 'backlog' && t.status !== 'in_progress' && t.status !== 'in_review') ctx.fail(409, 'invalid_state', 'issue ' + t.identifier + ' is ' + t.status + '. Only open issues can be canceled.');
        const u = ctx.db.update('issue', id, { status: 'canceled', completed_at: ctx.now() });
        ctx.db.create('issue_event', { issue_id: id, kind: 'status_changed', from_value: t.status, to_value: 'canceled' });
        const reason = ctx.body.reason;
        if (typeof reason === 'string' && reason.trim() !== '') {
          ctx.db.create('comment', { issue_id: id, body: reason });
          ctx.db.create('issue_event', { issue_id: id, kind: 'commented', from_value: null, to_value: reason.slice(0, 300) });
        }
        return { status: 200, body: u };
      }
  mark_duplicate:
    method: POST
    path: /issues/{id}/duplicate
    description: Mark an open issue as a duplicate of another issue that is not itself a duplicate.
    input:
      duplicate_of_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: issue
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        if (t.status !== 'backlog' && t.status !== 'in_progress' && t.status !== 'in_review') ctx.fail(409, 'invalid_state', 'issue ' + t.identifier + ' is ' + t.status + '. Only open issues can be marked duplicate.');
        const oid = ctx.body.duplicate_of_id;
        if (oid === id) ctx.fail(409, 'self_duplicate', 'an issue cannot duplicate itself');
        const o = ctx.db.get('issue', oid);
        if (o === null) ctx.fail(422, 'unknown_issue', 'issue ' + oid + ' not found');
        if (o.status === 'duplicate') ctx.fail(409, 'original_is_duplicate', 'issue ' + o.identifier + ' is itself a duplicate. Point at the original.');
        const u = ctx.db.update('issue', id, { status: 'duplicate', duplicate_of_id: oid, completed_at: ctx.now() });
        ctx.db.create('issue_event', { issue_id: id, kind: 'status_changed', from_value: t.status, to_value: 'duplicate' });
        return { status: 200, body: u };
      }
  reopen_issue:
    method: POST
    path: /issues/{id}/reopen
    description: Reopen a done issue to in_progress, or a canceled or duplicate issue to backlog.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        if (t.status !== 'done' && t.status !== 'canceled' && t.status !== 'duplicate') ctx.fail(409, 'invalid_state', 'issue ' + t.identifier + ' is ' + t.status + '. Only done, canceled and duplicate issues can be reopened.');
        const to = t.status === 'done' ? 'in_progress' : 'backlog';
        const u = ctx.db.update('issue', id, { status: to, completed_at: null, duplicate_of_id: null, archived_at: null });
        ctx.db.create('issue_event', { issue_id: id, kind: 'status_changed', from_value: t.status, to_value: to });
        return { status: 200, body: u };
      }
  set_parent:
    method: POST
    path: /issues/{id}/parent
    description: Set or clear the parent of an issue. No self-parenting, no cycles, no done parent.
    input:
      parent_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: issue
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        const pid = ctx.body.parent_id === undefined ? null : ctx.body.parent_id;
        const cur = t.parent_id === undefined ? null : t.parent_id;
        if (pid === cur) ctx.fail(409, 'no_change', 'parent is already ' + (pid === null ? 'empty' : pid));
        let toVal = null;
        if (pid !== null) {
          if (pid === id) ctx.fail(409, 'self_parent', 'an issue cannot be its own parent');
          const p = ctx.db.get('issue', pid);
          if (p === null) ctx.fail(422, 'unknown_parent', 'issue ' + pid + ' not found');
          if (p.status === 'done') ctx.fail(409, 'parent_done', 'parent ' + p.identifier + ' is done');
          let walk = p;
          let guard = 0;
          while (walk && walk.parent_id && guard < 1000) {
            if (walk.parent_id === id) ctx.fail(409, 'parent_cycle', 'making ' + p.identifier + ' the parent would create a cycle');
            walk = ctx.db.get('issue', walk.parent_id);
            guard++;
          }
          toVal = p.identifier;
        }
        let fromVal = null;
        if (cur !== null) { const o = ctx.db.get('issue', cur); fromVal = o ? o.identifier : cur; }
        const u = ctx.db.update('issue', id, { parent_id: pid });
        ctx.db.create('issue_event', { issue_id: id, kind: 'parent_changed', from_value: fromVal, to_value: toVal });
        return { status: 200, body: u };
      }
  add_label:
    method: POST
    path: /issues/{id}/labels
    description: Attach an existing label to an issue. 409 if already attached.
    input:
      label_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: label
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        const lid = ctx.body.label_id;
        const l = ctx.db.get('label', lid);
        if (l === null) ctx.fail(422, 'unknown_label', 'label ' + lid + ' not found');
        if (ctx.db.list('issue_label', { where: { issue_id: id, label_id: lid } }).length > 0) ctx.fail(409, 'already_attached', 'label ' + l.name + ' is already on ' + t.identifier);
        const row = ctx.db.create('issue_label', { issue_id: id, label_id: lid });
        ctx.db.create('issue_event', { issue_id: id, kind: 'label_added', from_value: null, to_value: l.name });
        return { status: 201, body: row };
      }
  remove_label:
    method: DELETE
    path: /issues/{id}/labels/{label_id}
    description: Detach a label from an issue. 404 if it is not attached.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('issue', id);
        if (t === null) ctx.fail(404, 'not_found', 'issue ' + id + ' not found');
        const lid = ctx.params.label_id;
        const rows = ctx.db.list('issue_label', { where: { issue_id: id, label_id: lid } });
        if (rows.length === 0) ctx.fail(404, 'not_attached', 'label ' + lid + ' is not on ' + t.identifier);
        const l = ctx.db.get('label', lid);
        ctx.db.delete('issue_label', rows[0].id);
        ctx.db.create('issue_event', { issue_id: id, kind: 'label_removed', from_value: l ? l.name : lid, to_value: null });
        return { status: 200, body: { issue_id: id, label_id: lid, removed: true } };
      }
jobs:
  auto_close_parents:
    description: Every hour. A parent in in_progress or in_review whose sub-issues are all closed, with at least one done, becomes done.
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        const closed = ['done', 'canceled', 'duplicate'];
        for (const status of ['in_progress', 'in_review']) {
          for (const p of ctx.db.list('issue', { where: { status } })) {
            const kids = ctx.db.list('issue', { where: { parent_id: p.id } });
            if (kids.length === 0) continue;
            if (!kids.every((k) => closed.includes(k.status))) continue;
            if (!kids.some((k) => k.status === 'done')) continue;
            ctx.db.update('issue', p.id, { status: 'done', completed_at: now });
            ctx.db.create('issue_event', { issue_id: p.id, kind: 'status_changed', from_value: status, to_value: 'done' });
          }
        }
      }
  auto_archive_done:
    description: Every day. Done issues completed more than 30 days ago get archived_at.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const t of ctx.db.list('issue', { where: { status: 'done' } })) {
          if (t.archived_at !== null && t.archived_at !== undefined) continue;
          if (t.completed_at === null || t.completed_at === undefined) continue;
          if (ctx.time.minutesBetween(t.completed_at, now) <= 30 * 1440) continue;
          ctx.db.update('issue', t.id, { archived_at: now });
          ctx.db.create('issue_event', { issue_id: t.id, kind: 'archived', from_value: null, to_value: now });
        }
      }
