format: 1
meta:
  name: gen_shipments
  description: A multi-carrier shipment tracker. The 120 imported shipments become shipment rows that link to carrier and hub rows. Operators dispatch, delay, resume, deliver, return and re-carrier shipments through lifecycle actions. Every step writes an append-only tracking event. Late or damaged parcels get claims that are reviewed and resolved. An hourly job flags in-transit shipments that pass their ETA. Tasks cover filtering, paging, state rules and collateral checks.
  resembles: Parcel shipment-tracking and carrier-operations API (EasyPost / AfterShip / Shippo-style tracking and dispatch backend)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-15T09:00:00.000Z
    tick: 1s
  api:
    list:
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
    error:
      error:
        code: $code
        message: $message
entities:
  carrier:
    description: A shipping carrier such as UPS, PostNL, DHL, FedEx or DPD. transit_days is its service level and drives expected_delivery_at on dispatch.
    idPrefix: car
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 80
      code:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 10
      transit_days:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 30
        default: 3
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  hub:
    description: A city hub that parcels leave from or arrive at. Serves as both origin and destination.
    idPrefix: hub
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 80
      country:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  shipment:
    description: One parcel moving between two hubs with one carrier. Status and lifecycle timestamps change only through lifecycle actions.
    idPrefix: shp
    fields:
      reference:
        type: string
        description: Public shipment reference such as SH-1001.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 20
      carrier_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: carrier
        onDelete: restrict
      origin_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: hub
        onDelete: restrict
      destination_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: hub
        onDelete: restrict
      weight_kg:
        type: number
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      status:
        type: state
        description: Lifecycle. Moves only through the dispatch, delay, resume, deliver and return actions.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - created
          - in_transit
          - delayed
          - delivered
          - returned
        initial: created
        transitions:
          created:
            - in_transit
            - returned
          in_transit:
            - delayed
            - delivered
            - returned
          delayed:
            - in_transit
            - delivered
            - returned
          delivered:
            - returned
          returned: []
      shipped_at:
        type: datetime
        description: Set when dispatched.
        required: false
        nullable: true
        unique: false
        readonly: true
      expected_delivery_at:
        type: datetime
        description: ETA, set on dispatch and moved later by delay.
        required: false
        nullable: true
        unique: false
        readonly: true
      delivered_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      delay_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      return_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
  shipment_event:
    description: Append-only tracking history of a shipment. Written by the seed, actions and the overdue job.
    idPrefix: evt
    fields:
      shipment_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: shipment
        onDelete: cascade
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - created
          - dispatched
          - delayed
          - resumed
          - delivered
          - returned
          - carrier_changed
          - claim_opened
      hub_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: hub
        onDelete: nullify
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  claim:
    description: A compensation claim on a late, damaged or lost shipment. Open until approved or rejected.
    idPrefix: clm
    fields:
      shipment_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: shipment
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - late
          - damaged
          - lost
      status:
        type: state
        description: Moves only through resolve_claim.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - open
          - approved
          - rejected
        initial: open
        transitions:
          open:
            - approved
            - rejected
          approved: []
          rejected: []
      amount:
        type: money
        description: Claimed amount in EUR cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: EUR
        min: 1
      resolution_note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      resolved_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
routes:
  list_shipments:
    op: list
    entity: shipment
    filters:
      - carrier_id
      - origin_id
      - destination_id
      - status
    search:
      - reference
    sort:
      - shipped_at
      - expected_delivery_at
      - weight_kg
      - created_at
    pageSize: 25
    method: GET
    path: /shipments
  get_shipment:
    op: get
    entity: shipment
    method: GET
    path: /shipments/{id}
  create_shipment:
    op: create
    entity: shipment
    method: POST
    path: /shipments
  update_shipment:
    op: update
    entity: shipment
    method: PATCH
    path: /shipments/{id}
  list_shipment_events:
    op: list
    entity: shipment_event
    filters: []
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /shipments/{shipment_id}/events
  list_shipment_claims:
    op: list
    entity: claim
    filters: []
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /shipments/{shipment_id}/claims
  list_carriers:
    op: list
    entity: carrier
    filters:
      - active
    search:
      - name
    sort: []
    pageSize: 25
    method: GET
    path: /carriers
  get_carrier:
    op: get
    entity: carrier
    method: GET
    path: /carriers/{id}
  update_carrier:
    op: update
    entity: carrier
    method: PATCH
    path: /carriers/{id}
  list_hubs:
    op: list
    entity: hub
    filters:
      - country
      - active
    search:
      - name
    sort: []
    pageSize: 25
    method: GET
    path: /hubs
  get_hub:
    op: get
    entity: hub
    method: GET
    path: /hubs/{id}
  list_claims:
    op: list
    entity: claim
    filters:
      - shipment_id
      - kind
      - status
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /claims
  get_claim:
    op: get
    entity: claim
    method: GET
    path: /claims/{id}
actions:
  dispatch_shipment:
    method: POST
    path: /shipments/{id}/dispatch
    description: Move a created shipment to in_transit. Sets shipped_at to now and expected_delivery_at to now plus the carrier's transit_days. The carrier must be active.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const s = ctx.db.get('shipment', id);
        if (s === null) ctx.fail(404, 'not_found', 'shipment ' + id + ' not found');
        if (s.status !== 'created') ctx.fail(409, 'invalid_state', 'shipment ' + id + ' is ' + s.status + '. Only created shipments can be dispatched.');
        const carrier = ctx.db.get('carrier', s.carrier_id);
        if (carrier === null) ctx.fail(409, 'no_carrier', 'shipment ' + id + ' has no carrier. Reassign it first.');
        if (!carrier.active) ctx.fail(409, 'carrier_inactive', 'carrier ' + carrier.id + ' (' + carrier.name + ') is inactive. Reassign the shipment to an active carrier first.');
        const now = ctx.now();
        const eta = ctx.time.plus(now, carrier.transit_days + 'd');
        const updated = ctx.db.update('shipment', id, { status: 'in_transit', shipped_at: now, expected_delivery_at: eta });
        ctx.db.create('shipment_event', { shipment_id: id, kind: 'dispatched', hub_id: s.origin_id, note: 'dispatched with ' + carrier.name });
        return { status: 200, body: updated };
      }
  delay_shipment:
    method: POST
    path: /shipments/{id}/delay
    description: Move an in_transit shipment to delayed. Needs a non-blank reason and a new expected_delivery_at later than the current one.
    input:
      reason:
        type: text
        description: Why the shipment is delayed. Stored as delay_reason.
        required: true
        nullable: false
        unique: false
        readonly: false
      expected_delivery_at:
        type: datetime
        description: The new ETA. Must be after the current expected_delivery_at.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const s = ctx.db.get('shipment', id);
        if (s === null) ctx.fail(404, 'not_found', 'shipment ' + id + ' not found');
        if (s.status !== 'in_transit') ctx.fail(409, 'invalid_state', 'shipment ' + id + ' is ' + s.status + '. Only in_transit shipments can be delayed.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for delay_shipment: reason expected a non-blank text, found ""');
        const eta = ctx.body.expected_delivery_at;
        if (s.expected_delivery_at !== null && ctx.time.minutesBetween(s.expected_delivery_at, eta) <= 0) ctx.fail(422, 'invalid_eta', 'expected_delivery_at ' + eta + ' must be after the current ETA ' + s.expected_delivery_at + '.');
        const updated = ctx.db.update('shipment', id, { status: 'delayed', delay_reason: reason, expected_delivery_at: eta });
        ctx.db.create('shipment_event', { shipment_id: id, kind: 'delayed', hub_id: null, note: reason });
        return { status: 200, body: updated };
      }
  resume_shipment:
    method: POST
    path: /shipments/{id}/resume
    description: Move a delayed shipment back to in_transit and clear its delay_reason.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const s = ctx.db.get('shipment', id);
        if (s === null) ctx.fail(404, 'not_found', 'shipment ' + id + ' not found');
        if (s.status !== 'delayed') ctx.fail(409, 'invalid_state', 'shipment ' + id + ' is ' + s.status + '. Only delayed shipments can be resumed.');
        const updated = ctx.db.update('shipment', id, { status: 'in_transit', delay_reason: null });
        ctx.db.create('shipment_event', { shipment_id: id, kind: 'resumed', hub_id: null, note: 'resumed after delay: ' + (s.delay_reason === null ? 'no reason recorded' : s.delay_reason) });
        return { status: 200, body: updated };
      }
  deliver_shipment:
    method: POST
    path: /shipments/{id}/deliver
    description: Mark an in_transit or delayed shipment as delivered and set delivered_at to now.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const s = ctx.db.get('shipment', id);
        if (s === null) ctx.fail(404, 'not_found', 'shipment ' + id + ' not found');
        if (s.status !== 'in_transit' && s.status !== 'delayed') ctx.fail(409, 'invalid_state', 'shipment ' + id + ' is ' + s.status + '. Only in_transit and delayed shipments can be delivered.');
        const now = ctx.now();
        const updated = ctx.db.update('shipment', id, { status: 'delivered', delivered_at: now });
        ctx.db.create('shipment_event', { shipment_id: id, kind: 'delivered', hub_id: s.destination_id, note: null });
        return { status: 200, body: updated };
      }
  return_shipment:
    method: POST
    path: /shipments/{id}/return
    description: Return a created, in_transit, delayed or delivered shipment with a required reason. A delivered shipment can be returned only within 14 days of delivered_at.
    input:
      reason:
        type: text
        description: Why the shipment is returned. Stored as return_reason.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const s = ctx.db.get('shipment', id);
        if (s === null) ctx.fail(404, 'not_found', 'shipment ' + id + ' not found');
        if (s.status === 'returned') ctx.fail(409, 'invalid_state', 'shipment ' + id + ' is already returned.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for return_shipment: reason expected a non-blank text, found ""');
        const now = ctx.now();
        if (s.status === 'delivered' && s.delivered_at !== null && ctx.time.minutesBetween(s.delivered_at, now) > 14 * 24 * 60) ctx.fail(409, 'return_window_closed', 'shipment ' + id + ' was delivered at ' + s.delivered_at + '. Delivered shipments can be returned only within 14 days.');
        const updated = ctx.db.update('shipment', id, { status: 'returned', return_reason: reason });
        ctx.db.create('shipment_event', { shipment_id: id, kind: 'returned', hub_id: s.origin_id, note: reason });
        return { status: 200, body: updated };
      }
  reassign_carrier:
    method: POST
    path: /shipments/{id}/reassign_carrier
    description: Switch the carrier of a shipment that is still in status created. The new carrier must be active and differ from the current one. Writes a carrier_changed event.
    input:
      carrier_id:
        type: ref
        description: The new carrier. Must be active.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: carrier
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const s = ctx.db.get('shipment', id);
        if (s === null) ctx.fail(404, 'not_found', 'shipment ' + id + ' not found');
        if (s.status !== 'created') ctx.fail(409, 'invalid_state', 'shipment ' + id + ' is ' + s.status + '. Only created shipments can change carrier.');
        const next = ctx.db.get('carrier', ctx.body.carrier_id);
        if (next === null) ctx.fail(422, 'unknown_carrier', 'carrier ' + ctx.body.carrier_id + ' not found. List carriers with GET /carriers.');
        if (next.id === s.carrier_id) ctx.fail(409, 'no_change', 'shipment ' + id + ' already uses carrier ' + next.id + '.');
        if (!next.active) ctx.fail(409, 'carrier_inactive', 'carrier ' + next.id + ' (' + next.name + ') is inactive. Pick an active carrier.');
        const old = ctx.db.get('carrier', s.carrier_id);
        const oldName = old === null ? s.carrier_id : old.name;
        const updated = ctx.db.update('shipment', id, { carrier_id: next.id });
        ctx.db.create('shipment_event', { shipment_id: id, kind: 'carrier_changed', hub_id: null, note: 'carrier changed from ' + oldName + ' (' + s.carrier_id + ') to ' + next.name + ' (' + next.id + ')' });
        return { status: 200, body: updated };
      }
  open_claim:
    method: POST
    path: /shipments/{id}/claim
    description: Open a claim of kind late, damaged or lost on a delayed, delivered or returned shipment. A late claim needs the shipment to be past its expected_delivery_at. Only one open claim of the same kind per shipment.
    input:
      kind:
        type: enum
        description: The claim kind.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - late
          - damaged
          - lost
      amount:
        type: money
        description: Claimed amount in EUR cents, greater than 0.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: EUR
        min: 1
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const s = ctx.db.get('shipment', id);
        if (s === null) ctx.fail(404, 'not_found', 'shipment ' + id + ' not found');
        if (s.status !== 'delayed' && s.status !== 'delivered' && s.status !== 'returned') ctx.fail(409, 'invalid_state', 'shipment ' + id + ' is ' + s.status + '. Claims can be opened only on delayed, delivered or returned shipments.');
        const kind = ctx.body.kind;
        const amount = ctx.body.amount;
        if (!(amount > 0)) ctx.fail(400, 'input.invalid', 'Invalid input for open_claim: amount expected greater than 0, found ' + amount);
        const now = ctx.now();
        if (kind === 'late') {
          const seen = s.delivered_at !== null ? s.delivered_at : now;
          if (s.expected_delivery_at === null || ctx.time.minutesBetween(s.expected_delivery_at, seen) <= 0) ctx.fail(409, 'not_late', 'shipment ' + id + ' was not later than its expected delivery time ' + s.expected_delivery_at + ', so no late claim is possible.');
        }
        const dup = ctx.db.list('claim', { where: { shipment_id: id, kind: kind, status: 'open' } });
        if (dup.length > 0) ctx.fail(409, 'duplicate_claim', 'shipment ' + id + ' already has an open ' + kind + ' claim ' + dup[0].id + '.');
        const claim = ctx.db.create('claim', { shipment_id: id, kind: kind, amount: amount });
        ctx.db.create('shipment_event', { shipment_id: id, kind: 'claim_opened', hub_id: null, note: kind + ' claim ' + claim.id + ' for ' + amount });
        return { status: 201, body: claim };
      }
  resolve_claim:
    method: POST
    path: /claims/{id}/resolve
    description: Approve or reject an open claim with a non-blank note. Claims over 50000 (EUR 500.00) cannot be approved here.
    input:
      decision:
        type: enum
        description: The outcome.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - approved
          - rejected
      note:
        type: text
        description: Resolution note, stored as resolution_note.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const c = ctx.db.get('claim', id);
        if (c === null) ctx.fail(404, 'not_found', 'claim ' + id + ' not found');
        if (c.status !== 'open') ctx.fail(409, 'invalid_state', 'claim ' + id + ' is already ' + c.status + '. Only open claims can be resolved.');
        const note = ctx.body.note.trim();
        if (note === '') ctx.fail(400, 'input.invalid', 'Invalid input for resolve_claim: note expected a non-blank text, found ""');
        const decision = ctx.body.decision;
        if (decision === 'approved' && c.amount > 50000) ctx.fail(409, 'needs_manager_review', 'claim ' + id + ' is for ' + c.amount + ', over 50000. Claims this large cannot be approved here. Reject it or send it to a manager.');
        const updated = ctx.db.update('claim', id, { status: decision, resolution_note: note, resolved_at: ctx.now() });
        return { status: 200, body: updated };
      }
jobs:
  flag_overdue_shipments:
    description: "Every hour. An in_transit shipment whose expected_delivery_at is at or before now moves to delayed with delay_reason 'auto: past ETA' and a delayed event."
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const s of ctx.db.list('shipment', { where: { status: 'in_transit' } })) {
          if (s.expected_delivery_at === null || ctx.time.minutesBetween(s.expected_delivery_at, now) < 0) continue;
          ctx.db.update('shipment', s.id, { status: 'delayed', delay_reason: 'auto: past ETA' });
          ctx.db.create('shipment_event', { shipment_id: s.id, kind: 'delayed', hub_id: null, note: 'auto: past ETA' });
        }
      }
