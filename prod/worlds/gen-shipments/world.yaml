seed:
  carrier: "(ctx) => [['UPS','UPS',3,true],['PostNL','POSTNL',4,true],['DHL','DHL',2,true],['FedEx','FEDEX',3,false],['DPD','DPD',5,true]].map(([name, code, transit_days, active]) => ({ name, code, transit_days, active, created_at: '2025-01-06T09:00:00.000Z', updated_at: '2025-01-06T09:00:00.000Z' }))"
  hub: "(ctx) => [['Dublin','Ireland'],['Milan','Italy'],['Vienna','Austria'],['Prague','Czechia'],['Madrid','Spain'],['Hamburg','Germany'],['Lyon','France'],['Warsaw','Poland'],['Rotterdam','Netherlands'],['Lisbon','Portugal']].map(([name, country]) => ({ name, country, active: true, created_at: '2025-01-10T09:00:00.000Z', updated_at: '2025-01-10T09:00:00.000Z' }))"
  shipment: |-
    (ctx) => {
      const NOW = ctx.now();
      const EP = '2026-08-01T00:00:00.000Z';
      const iso = (v) => { let s = String(v); if (s.length === 19) s += '.000Z'; return s; };
      const back = (t, m) => ctx.time.plus(EP, (ctx.time.minutesBetween(EP, t) - m) + 'm');
      const cmap = {};
      for (const c of ctx.rows('carrier')) cmap[c.name] = c;
      const hmap = {};
      for (const h of ctx.rows('hub')) hmap[h.name] = h.id;
      const reasons = ['Weather disruption at sorting hub', 'Customs inspection backlog', 'Vehicle breakdown on linehaul', 'Missed connection at transfer hub', 'Address verification pending'];
      const returnReasons = ['Recipient refused delivery', 'Address could not be located', 'Customer requested return to sender'];
      const Ls = [-6, 12, 30, 60, 100, 47, 75, -20, 55, 36];
      const rows = [];
      let k = 0;
      let r = 0;
      for (const f of ctx.fixtures.shipments) {
        let status = f.status;
        let carrierName = f.carrier;
        if (status === 'created' && (f.shipment_id === 'SH-1022' || f.shipment_id === 'SH-1077')) carrierName = 'PostNL';
        const car = cmap[carrierName];
        let T = iso(f.shipped_at);
        if (ctx.time.minutesBetween(T, NOW) < 60) T = back(NOW, 1440);
        const created = back(T, 1440);
        const row = {
          reference: f.shipment_id, carrier_id: car.id, origin_id: hmap[f.origin], destination_id: hmap[f.destination],
          weight_kg: Number(f.weight_kg), status, shipped_at: null, expected_delivery_at: null, delivered_at: null,
          delay_reason: null, return_reason: null, created_at: created, updated_at: created,
        };
        if (status === 'in_transit') {
          row.shipped_at = T;
          row.expected_delivery_at = ctx.time.plus(NOW, ctx.int(20, 150) + 'h');
          row.updated_at = T;
        } else if (status === 'delayed') {
          row.shipped_at = T;
          row.expected_delivery_at = ctx.time.plus(T, (car.transit_days + ctx.int(1, 3)) + 'd');
          row.delay_reason = ctx.pick(reasons);
          row.updated_at = ctx.time.plus(T, '2d');
        } else if (status === 'delivered') {
          let D = f.delivered_at === null || f.delivered_at === undefined ? ctx.time.plus(T, '3d') : iso(f.delivered_at);
          if (ctx.time.minutesBetween(D, NOW) < 60) D = ctx.time.plus(T, '3d');
          let eta = back(D, Ls[k % 10] * 60 + 17);
          k++;
          if (ctx.time.minutesBetween(T, eta) < 6 * 60 + 13) eta = ctx.time.plus(T, '373m');
          row.shipped_at = T;
          row.expected_delivery_at = eta;
          row.delivered_at = D;
          row.updated_at = D;
        } else if (status === 'returned') {
          row.shipped_at = T;
          row.expected_delivery_at = ctx.time.plus(T, car.transit_days + 'd');
          row.return_reason = returnReasons[r % 3];
          r++;
          row.updated_at = ctx.time.plus(T, '36h');
        }
        rows.push(row);
      }
      return rows;
    }
  shipment_event: |-
    (ctx) => {
      const out = [];
      for (const s of ctx.rows('shipment')) {
        const ev = (kind, at, hub, note) => out.push({ at, row: { shipment_id: s.id, kind, hub_id: hub, note, created_at: at, updated_at: at } });
        ev('created', s.created_at, s.origin_id, 'shipment registered');
        if (s.status === 'created') continue;
        ev('dispatched', s.shipped_at, s.origin_id, 'dispatched');
        if (s.status === 'delayed') ev('delayed', ctx.time.plus(s.shipped_at, '2d'), null, s.delay_reason);
        if (s.status === 'delivered') ev('delivered', s.delivered_at, s.destination_id, null);
        if (s.status === 'returned') ev('returned', ctx.time.plus(s.shipped_at, '36h'), s.origin_id, s.return_reason);
      }
      out.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
      return out.map((e) => e.row);
    }
  claim: |-
    (ctx) => {
      const ships = ctx.rows('shipment');
      const lateMin = (s) => ctx.time.minutesBetween(s.expected_delivery_at, s.delivered_at);
      const del = ships.filter((s) => s.status === 'delivered');
      const big = del.filter((s) => lateMin(s) > 48 * 60);
      const dl = ships.filter((s) => s.status === 'delayed');
      const rt = ships.filter((s) => s.status === 'returned');
      const plan = [];
      for (const i of [0, 3, 6, 9]) if (big[i]) plan.push({ s: big[i], kind: 'late', at: ctx.time.plus(big[i].delivered_at, '2h') });
      dl.slice(0, 4).forEach((s) => plan.push({ s, kind: 'late', at: ctx.time.plus(s.expected_delivery_at, '3h') }));
      if (dl[4]) plan.push({ s: dl[4], kind: 'lost', at: ctx.time.plus(dl[4].expected_delivery_at, '3h') });
      del.filter((s, i) => i % 9 === 4).slice(0, 5).forEach((s) => plan.push({ s, kind: 'damaged', at: ctx.time.plus(s.delivered_at, '5h') }));
      rt.forEach((s, i) => plan.push({ s, kind: i < 2 ? 'lost' : 'damaged', at: ctx.time.plus(s.shipped_at, '39h') }));
      plan.sort((a, b) => (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
      const notesOk = ['Carrier confirmed the delay', 'Photos confirm the damage', 'Tracking history supports the claim'];
      const notesNo = ['Parcel was located and delivered', 'Evidence insufficient', 'Claim exceeds the policy limit'];
      return plan.map((p, i) => {
        const amount = p.kind === 'late' ? ctx.int(15, 60) * 100 : p.kind === 'damaged' ? ctx.int(10, 100) * 100 : ctx.int(30, 90) * 1000;
        let status = 'open';
        if (i % 5 >= 3) status = amount > 50000 ? 'rejected' : i % 2 === 0 ? 'approved' : 'rejected';
        const done = status !== 'open';
        const resolved = done ? ctx.time.plus(p.at, '1d') : null;
        return {
          shipment_id: p.s.id, kind: p.kind, status, amount,
          resolution_note: done ? (status === 'approved' ? notesOk[i % 3] : notesNo[i % 3]) : null,
          resolved_at: resolved, created_at: p.at, updated_at: done ? resolved : p.at,
        };
      });
    }
tests:
  dispatch_sets_eta_and_refusals:
    description: dispatch_shipment moves a created shipment to in_transit with shipped_at and a later ETA, writes a dispatched event, and refuses unknown ids, repeats and inactive carriers.
    script: |-
      (ctx) => {
        const missing = ctx.api('POST', '/shipments/shp_9999/dispatch', {});
        ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'unknown shipment: ' + JSON.stringify(missing));
        const all = ctx.api('GET', '/carriers').body.data;
        const cs = all.filter((c) => c.active);
        const hs = ctx.api('GET', '/hubs').body.data.filter((h) => h.active);
        if (cs.length < 1 || hs.length < 2) return;
        const make = (ref, carrier) => {
          const r = ctx.api('POST', '/shipments', { reference: ref, carrier_id: carrier.id, origin_id: hs[0].id, destination_id: hs[1].id, weight_kg: 4.5 });
          ctx.assert(r.status >= 200 && r.status < 300, 'create shipment: ' + JSON.stringify(r));
          return r.body;
        };
        const s = make('TST-DSP-1', cs[0]);
        ctx.assert(s.status === 'created', 'new shipment is created, got ' + s.status);
        const at = ctx.now();
        const r = ctx.api('POST', '/shipments/' + s.id + '/dispatch', {});
        ctx.assert(r.status === 200, 'dispatch: ' + JSON.stringify(r));
        ctx.assert(r.body.status === 'in_transit' && r.body.shipped_at === at, 'in_transit shipped at ' + at + ', got ' + JSON.stringify(r.body));
        ctx.assert(r.body.expected_delivery_at > r.body.shipped_at, 'ETA after shipped_at, got ' + r.body.expected_delivery_at);
        const ev = ctx.api('GET', '/shipments/' + s.id + '/events').body.data.map((e) => e.kind);
        ctx.assert(ev.includes('dispatched'), 'dispatched event, got ' + JSON.stringify(ev));
        const again = ctx.api('POST', '/shipments/' + s.id + '/dispatch', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second dispatch: ' + JSON.stringify(again));
        const off = all.find((c) => !c.active);
        if (off) {
          const t = make('TST-DSP-2', off);
          const bad = ctx.api('POST', '/shipments/' + t.id + '/dispatch', {});
          ctx.assert(bad.status === 409 && bad.body.error.code === 'carrier_inactive', 'inactive carrier: ' + JSON.stringify(bad));
          const still = ctx.api('GET', '/shipments/' + t.id).body;
          ctx.assert(still.status === 'created' && still.shipped_at === null, 'refused dispatch changed the shipment');
        }
      }
  delay_and_resume_flow:
    description: delay_shipment needs in_transit, a reason and a later ETA. resume_shipment moves delayed back to in_transit and clears the reason. Both write events and refuse wrong states.
    script: |-
      (ctx) => {
        const dm = ctx.api('POST', '/shipments/shp_9999/delay', { reason: 'x', expected_delivery_at: '2030-01-01T00:00:00.000Z' });
        ctx.assert(dm.status === 404, 'delay unknown: ' + JSON.stringify(dm));
        const rm = ctx.api('POST', '/shipments/shp_9999/resume', {});
        ctx.assert(rm.status === 404, 'resume unknown: ' + JSON.stringify(rm));
        const cs = ctx.api('GET', '/carriers').body.data.filter((c) => c.active);
        const hs = ctx.api('GET', '/hubs').body.data.filter((h) => h.active);
        if (cs.length < 1 || hs.length < 2) return;
        const r0 = ctx.api('POST', '/shipments', { reference: 'TST-DLY-1', carrier_id: cs[0].id, origin_id: hs[0].id, destination_id: hs[1].id, weight_kg: 3 });
        ctx.assert(r0.status >= 200 && r0.status < 300, 'create: ' + JSON.stringify(r0));
        const id = r0.body.id;
        const early = ctx.api('POST', '/shipments/' + id + '/delay', { reason: 'storm', expected_delivery_at: '2030-01-01T00:00:00.000Z' });
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'delay of created: ' + JSON.stringify(early));
        const early2 = ctx.api('POST', '/shipments/' + id + '/resume', {});
        ctx.assert(early2.status === 409 && early2.body.error.code === 'invalid_state', 'resume of created: ' + JSON.stringify(early2));
        const d = ctx.api('POST', '/shipments/' + id + '/dispatch', {});
        ctx.assert(d.status === 200, 'dispatch: ' + JSON.stringify(d));
        const eta = d.body.expected_delivery_at;
        const later = (parseInt(eta.slice(0, 4), 10) + 1) + eta.slice(4);
        const blank = ctx.api('POST', '/shipments/' + id + '/delay', { reason: '   ', expected_delivery_at: later });
        ctx.assert(blank.status === 400 && blank.body.error.code === 'input.invalid', 'blank reason: ' + JSON.stringify(blank));
        const same = ctx.api('POST', '/shipments/' + id + '/delay', { reason: 'storm', expected_delivery_at: eta });
        ctx.assert(same.status === 422 && same.body.error.code === 'invalid_eta', 'same ETA: ' + JSON.stringify(same));
        const ok = ctx.api('POST', '/shipments/' + id + '/delay', { reason: 'storm at hub', expected_delivery_at: later });
        ctx.assert(ok.status === 200, 'delay: ' + JSON.stringify(ok));
        ctx.assert(ok.body.status === 'delayed' && ok.body.delay_reason === 'storm at hub' && ok.body.expected_delivery_at === later, 'delayed with reason and new ETA, got ' + JSON.stringify(ok.body));
        const twice = ctx.api('POST', '/shipments/' + id + '/delay', { reason: 'again', expected_delivery_at: later.replace(/^\d{4}/, (y) => String(parseInt(y, 10) + 1)) });
        ctx.assert(twice.status === 409 && twice.body.error.code === 'invalid_state', 'delay of delayed: ' + JSON.stringify(twice));
        const res = ctx.api('POST', '/shipments/' + id + '/resume', {});
        ctx.assert(res.status === 200 && res.body.status === 'in_transit' && res.body.delay_reason === null, 'resume: ' + JSON.stringify(res));
        const res2 = ctx.api('POST', '/shipments/' + id + '/resume', {});
        ctx.assert(res2.status === 409 && res2.body.error.code === 'invalid_state', 'resume of in_transit: ' + JSON.stringify(res2));
        const kinds = ctx.api('GET', '/shipments/' + id + '/events').body.data.map((e) => e.kind);
        ctx.assert(kinds.includes('dispatched') && kinds.includes('delayed') && kinds.includes('resumed'), 'events, got ' + JSON.stringify(kinds));
      }
  deliver_and_return_flow:
    description: deliver_shipment sets delivered_at and refuses created or finished shipments. return_shipment needs a reason, works from created, in_transit and delivered, and refuses a delivered shipment after 14 days.
    script: |-
      (ctx) => {
        const dm = ctx.api('POST', '/shipments/shp_9999/deliver', {});
        ctx.assert(dm.status === 404, 'deliver unknown: ' + JSON.stringify(dm));
        const rm = ctx.api('POST', '/shipments/shp_9999/return', { reason: 'refused' });
        ctx.assert(rm.status === 404, 'return unknown: ' + JSON.stringify(rm));
        const cs = ctx.api('GET', '/carriers').body.data.filter((c) => c.active);
        const hs = ctx.api('GET', '/hubs').body.data.filter((h) => h.active);
        if (cs.length < 1 || hs.length < 2) return;
        let n = 0;
        const make = () => {
          n += 1;
          const r = ctx.api('POST', '/shipments', { reference: 'TST-DLV-' + n, carrier_id: cs[0].id, origin_id: hs[0].id, destination_id: hs[1].id, weight_kg: 2 });
          ctx.assert(r.status >= 200 && r.status < 300, 'create: ' + JSON.stringify(r));
          return r.body.id;
        };
        const a = make();
        const early = ctx.api('POST', '/shipments/' + a + '/deliver', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'deliver of created: ' + JSON.stringify(early));
        ctx.assert(ctx.api('POST', '/shipments/' + a + '/dispatch', {}).status === 200, 'dispatch a');
        const at = ctx.now();
        const del = ctx.api('POST', '/shipments/' + a + '/deliver', {});
        ctx.assert(del.status === 200 && del.body.status === 'delivered' && del.body.delivered_at === at, 'deliver at ' + at + ': ' + JSON.stringify(del));
        const del2 = ctx.api('POST', '/shipments/' + a + '/deliver', {});
        ctx.assert(del2.status === 409 && del2.body.error.code === 'invalid_state', 'deliver twice: ' + JSON.stringify(del2));
        const blank = ctx.api('POST', '/shipments/' + a + '/return', { reason: '  ' });
        ctx.assert(blank.status === 400 && blank.body.error.code === 'input.invalid', 'blank return reason: ' + JSON.stringify(blank));
        const ret = ctx.api('POST', '/shipments/' + a + '/return', { reason: 'Customer sent it back' });
        ctx.assert(ret.status === 200 && ret.body.status === 'returned' && ret.body.return_reason === 'Customer sent it back', 'return delivered: ' + JSON.stringify(ret));
        const ret2 = ctx.api('POST', '/shipments/' + a + '/return', { reason: 'again' });
        ctx.assert(ret2.status === 409 && ret2.body.error.code === 'invalid_state', 'return twice: ' + JSON.stringify(ret2));
        const kinds = ctx.api('GET', '/shipments/' + a + '/events').body.data.map((e) => e.kind);
        ctx.assert(kinds.includes('delivered') && kinds.includes('returned'), 'events, got ' + JSON.stringify(kinds));
        const b = make();
        const rb = ctx.api('POST', '/shipments/' + b + '/return', { reason: 'Address invalid' });
        ctx.assert(rb.status === 200 && rb.body.status === 'returned', 'return of created: ' + JSON.stringify(rb));
        const c = make();
        ctx.api('POST', '/shipments/' + c + '/dispatch', {});
        const rc = ctx.api('POST', '/shipments/' + c + '/return', { reason: 'Recalled by sender' });
        ctx.assert(rc.status === 200 && rc.body.status === 'returned', 'return of in_transit: ' + JSON.stringify(rc));
        const d = make();
        ctx.api('POST', '/shipments/' + d + '/dispatch', {});
        ctx.assert(ctx.api('POST', '/shipments/' + d + '/deliver', {}).status === 200, 'deliver d');
        ctx.advance('15d');
        const late = ctx.api('POST', '/shipments/' + d + '/return', { reason: 'Too late to return' });
        ctx.assert(late.status === 409 && late.body.error.code === 'return_window_closed', 'return after 14 days: ' + JSON.stringify(late));
        const still = ctx.api('GET', '/shipments/' + d).body;
        ctx.assert(still.status === 'delivered' && still.return_reason === null, 'refused return changed the shipment');
      }
  reassign_carrier_rules:
    description: reassign_carrier switches the carrier of a created shipment and writes a carrier_changed event naming both carriers. It refuses the same carrier, an inactive carrier, an unknown carrier and a dispatched shipment.
    script: |-
      (ctx) => {
        const all = ctx.api('GET', '/carriers').body.data;
        const cs = all.filter((c) => c.active);
        const hs = ctx.api('GET', '/hubs').body.data.filter((h) => h.active);
        const missing = ctx.api('POST', '/shipments/shp_9999/reassign_carrier', { carrier_id: cs.length > 0 ? cs[0].id : 'car_0001' });
        ctx.assert(missing.status === 404 || missing.status === 400, 'unknown shipment: ' + JSON.stringify(missing));
        if (cs.length < 2 || hs.length < 2) return;
        ctx.assert(missing.status === 404, 'unknown shipment is 404: ' + JSON.stringify(missing));
        const r0 = ctx.api('POST', '/shipments', { reference: 'TST-CAR-1', carrier_id: cs[0].id, origin_id: hs[0].id, destination_id: hs[1].id, weight_kg: 6 });
        ctx.assert(r0.status >= 200 && r0.status < 300, 'create: ' + JSON.stringify(r0));
        const id = r0.body.id;
        const same = ctx.api('POST', '/shipments/' + id + '/reassign_carrier', { carrier_id: cs[0].id });
        ctx.assert(same.status === 409 && same.body.error.code === 'no_change', 'same carrier: ' + JSON.stringify(same));
        const unknown = ctx.api('POST', '/shipments/' + id + '/reassign_carrier', { carrier_id: 'car_9999' });
        ctx.assert(unknown.status === 400 || unknown.status === 422, 'unknown carrier: ' + JSON.stringify(unknown));
        const off = all.find((c) => !c.active);
        if (off) {
          const bad = ctx.api('POST', '/shipments/' + id + '/reassign_carrier', { carrier_id: off.id });
          ctx.assert(bad.status === 409 && bad.body.error.code === 'carrier_inactive', 'inactive carrier: ' + JSON.stringify(bad));
        }
        const ok = ctx.api('POST', '/shipments/' + id + '/reassign_carrier', { carrier_id: cs[1].id });
        ctx.assert(ok.status === 200 && ok.body.carrier_id === cs[1].id && ok.body.status === 'created', 'reassign: ' + JSON.stringify(ok));
        const ev = ctx.api('GET', '/shipments/' + id + '/events').body.data.filter((e) => e.kind === 'carrier_changed');
        ctx.assert(ev.length === 1, 'one carrier_changed event, got ' + ev.length);
        ctx.assert(ev[0].note.includes(cs[0].name) && ev[0].note.includes(cs[1].name), 'event names both carriers, got ' + ev[0].note);
        ctx.assert(ctx.api('POST', '/shipments/' + id + '/dispatch', {}).status === 200, 'dispatch');
        const late = ctx.api('POST', '/shipments/' + id + '/reassign_carrier', { carrier_id: cs[0].id });
        ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'reassign of dispatched: ' + JSON.stringify(late));
        const after = ctx.api('GET', '/shipments/' + id).body;
        ctx.assert(after.carrier_id === cs[1].id, 'refused reassign changed the carrier');
      }
  claim_open_and_resolve:
    description: open_claim needs a delayed, delivered or returned shipment, refuses a late claim on an on-time shipment and duplicate open claims of one kind. resolve_claim needs a note, refuses approving claims over 50000 and refuses resolving twice.
    script: |-
      (ctx) => {
        const om = ctx.api('POST', '/shipments/shp_9999/claim', { kind: 'damaged', amount: 1000 });
        ctx.assert(om.status === 404, 'claim on unknown shipment: ' + JSON.stringify(om));
        const rm = ctx.api('POST', '/claims/clm_9999/resolve', { decision: 'approved', note: 'ok' });
        ctx.assert(rm.status === 404, 'resolve unknown claim: ' + JSON.stringify(rm));
        const cs = ctx.api('GET', '/carriers').body.data.filter((c) => c.active);
        const hs = ctx.api('GET', '/hubs').body.data.filter((h) => h.active);
        if (cs.length < 1 || hs.length < 2) return;
        let n = 0;
        const make = () => {
          n += 1;
          const r = ctx.api('POST', '/shipments', { reference: 'TST-CLM-' + n, carrier_id: cs[0].id, origin_id: hs[0].id, destination_id: hs[1].id, weight_kg: 7 });
          ctx.assert(r.status >= 200 && r.status < 300, 'create: ' + JSON.stringify(r));
          return r.body.id;
        };
        const id = make();
        const early = ctx.api('POST', '/shipments/' + id + '/claim', { kind: 'damaged', amount: 1500 });
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'claim on created: ' + JSON.stringify(early));
        ctx.api('POST', '/shipments/' + id + '/dispatch', {});
        ctx.assert(ctx.api('POST', '/shipments/' + id + '/deliver', {}).status === 200, 'deliver');
        const notLate = ctx.api('POST', '/shipments/' + id + '/claim', { kind: 'late', amount: 2500 });
        ctx.assert(notLate.status === 409 && notLate.body.error.code === 'not_late', 'late claim on on-time shipment: ' + JSON.stringify(notLate));
        const zero = ctx.api('POST', '/shipments/' + id + '/claim', { kind: 'damaged', amount: 0 });
        ctx.assert(zero.status === 400, 'zero amount: ' + JSON.stringify(zero));
        const c1 = ctx.api('POST', '/shipments/' + id + '/claim', { kind: 'damaged', amount: 1500 });
        ctx.assert(c1.status === 201 && c1.body.status === 'open' && c1.body.kind === 'damaged' && c1.body.amount === 1500, 'damaged claim: ' + JSON.stringify(c1));
        const dup = ctx.api('POST', '/shipments/' + id + '/claim', { kind: 'damaged', amount: 900 });
        ctx.assert(dup.status === 409 && dup.body.error.code === 'duplicate_claim', 'duplicate: ' + JSON.stringify(dup));
        const lost = ctx.api('POST', '/shipments/' + id + '/claim', { kind: 'lost', amount: 60000 });
        ctx.assert(lost.status === 201, 'lost claim of another kind: ' + JSON.stringify(lost));
        const kinds = ctx.api('GET', '/shipments/' + id + '/events').body.data.filter((e) => e.kind === 'claim_opened');
        ctx.assert(kinds.length === 2, 'two claim_opened events, got ' + kinds.length);
        const claims = ctx.api('GET', '/shipments/' + id + '/claims').body.data;
        ctx.assert(claims.length === 2, 'two claims on the shipment, got ' + claims.length);
        const big = ctx.api('POST', '/claims/' + lost.body.id + '/resolve', { decision: 'approved', note: 'Looks fine' });
        ctx.assert(big.status === 409 && big.body.error.code === 'needs_manager_review', 'approve over 50000: ' + JSON.stringify(big));
        const blank = ctx.api('POST', '/claims/' + lost.body.id + '/resolve', { decision: 'rejected', note: '   ' });
        ctx.assert(blank.status === 400 && blank.body.error.code === 'input.invalid', 'blank note: ' + JSON.stringify(blank));
        const at = ctx.now();
        const rej = ctx.api('POST', '/claims/' + lost.body.id + '/resolve', { decision: 'rejected', note: 'Parcel was found' });
        ctx.assert(rej.status === 200 && rej.body.status === 'rejected' && rej.body.resolution_note === 'Parcel was found' && rej.body.resolved_at === at, 'reject: ' + JSON.stringify(rej));
        const again = ctx.api('POST', '/claims/' + lost.body.id + '/resolve', { decision: 'approved', note: 'changed my mind' });
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'resolve twice: ' + JSON.stringify(again));
        const app = ctx.api('POST', '/claims/' + c1.body.id + '/resolve', { decision: 'approved', note: 'Photos confirm damage' });
        ctx.assert(app.status === 200 && app.body.status === 'approved', 'approve: ' + JSON.stringify(app));
        const r2 = make();
        ctx.api('POST', '/shipments/' + r2 + '/return', { reason: 'Refused at door' });
        const rc = ctx.api('POST', '/shipments/' + r2 + '/claim', { kind: 'damaged', amount: 800 });
        ctx.assert(rc.status === 201, 'claim on returned: ' + JSON.stringify(rc));
      }
  overdue_job_and_late_claim:
    description: "flag_overdue_shipments moves an in_transit shipment past its ETA to delayed with 'auto: past ETA' and a delayed event, leaves earlier and delivered shipments alone, and the delayed shipment then supports a late claim."
    script: |-
      (ctx) => {
        const cs = ctx.api('GET', '/carriers').body.data.filter((c) => c.active);
        const hs = ctx.api('GET', '/hubs').body.data.filter((h) => h.active);
        if (cs.length < 1 || hs.length < 2) return;
        const days = cs[0].transit_days;
        const make = (ref) => {
          const r = ctx.api('POST', '/shipments', { reference: ref, carrier_id: cs[0].id, origin_id: hs[0].id, destination_id: hs[1].id, weight_kg: 5 });
          ctx.assert(r.status >= 200 && r.status < 300, 'create: ' + JSON.stringify(r));
          return r.body.id;
        };
        const a = make('TST-JOB-1');
        const b = make('TST-JOB-2');
        const c = make('TST-JOB-3');
        ctx.assert(ctx.api('POST', '/shipments/' + a + '/dispatch', {}).status === 200, 'dispatch a');
        ctx.assert(ctx.api('POST', '/shipments/' + b + '/dispatch', {}).status === 200, 'dispatch b');
        ctx.assert(ctx.api('POST', '/shipments/' + b + '/deliver', {}).status === 200, 'deliver b');
        const first = ctx.advance((days * 24 - 3) + 'h');
        ctx.assert(first.jobsFailed.length === 0, 'job failed: ' + JSON.stringify(first.jobsFailed));
        ctx.assert(ctx.api('GET', '/shipments/' + a).body.status === 'in_transit', 'not flagged before its ETA');
        const second = ctx.advance('5h');
        ctx.assert(second.jobsFailed.length === 0, 'job failed: ' + JSON.stringify(second.jobsFailed));
        ctx.assert(second.jobsFired.includes('flag_overdue_shipments'), 'job fired, got ' + JSON.stringify(second.jobsFired));
        const after = ctx.api('GET', '/shipments/' + a).body;
        ctx.assert(after.status === 'delayed' && after.delay_reason === 'auto: past ETA', 'flagged delayed, got ' + JSON.stringify(after));
        const kinds = ctx.api('GET', '/shipments/' + a + '/events').body.data.filter((e) => e.kind === 'delayed');
        ctx.assert(kinds.length === 1 && kinds[0].note === 'auto: past ETA', 'one delayed event, got ' + JSON.stringify(kinds));
        ctx.assert(ctx.api('GET', '/shipments/' + b).body.status === 'delivered', 'delivered shipment untouched');
        ctx.assert(ctx.api('GET', '/shipments/' + c).body.status === 'created', 'created shipment untouched');
        const late = ctx.api('POST', '/shipments/' + a + '/claim', { kind: 'late', amount: 2500 });
        ctx.assert(late.status === 201 && late.body.kind === 'late' && late.body.status === 'open', 'late claim on overdue shipment: ' + JSON.stringify(late));
        const dup = ctx.api('POST', '/shipments/' + a + '/claim', { kind: 'late', amount: 2500 });
        ctx.assert(dup.status === 409 && dup.body.error.code === 'duplicate_claim', 'duplicate late claim: ' + JSON.stringify(dup));
        const res = ctx.api('POST', '/claims/' + late.body.id + '/resolve', { decision: 'approved', note: 'Carrier missed the ETA' });
        ctx.assert(res.status === 200 && res.body.status === 'approved', 'approve late claim: ' + JSON.stringify(res));
        const del = ctx.api('POST', '/shipments/' + a + '/deliver', {});
        ctx.assert(del.status === 200 && del.body.status === 'delivered', 'deliver a delayed shipment: ' + JSON.stringify(del));
      }
tasks:
  dispatch_heaviest_created_shipment:
    difficulty: easy
    instruction: Dispatch the heaviest shipment that is still in status created. Use the shipment's dispatch action. Do not change any other shipment.
    grader: |-
      (ctx) => {
        const created = ctx.seed.list('shipment', { where: { status: 'created' } });
        let target = null;
        for (const s of created) { if (target === null || s.weight_kg > target.weight_kg) target = s; }
        if (target === null) return 0;
        const old = new Set(ctx.seed.list('shipment_event', { where: { shipment_id: target.id } }).map((e) => e.id));
        const events = ctx.db.list('shipment_event', { where: { shipment_id: target.id } }).filter((e) => !old.has(e.id));
        ctx.guardChanges('only the target shipment status, shipped_at and ETA, and its new events changed', [
          { entity: 'shipment', id: target.id, kind: 'updated', fields: ['status', 'shipped_at', 'expected_delivery_at'] },
          ...events.map((e) => ({ entity: 'shipment_event', id: e.id, kind: 'created', fields: ['shipment_id', 'kind', 'hub_id', 'note'] })),
        ]);
        const end = ctx.db.get('shipment', target.id);
        const ok = end !== null && end.status === 'in_transit' && end.shipped_at !== null && end.expected_delivery_at !== null;
        const fresh = events.filter((e) => e.kind === 'dispatched');
        ctx.goal(0.7, 'the heaviest created shipment is in_transit with shipped_at and an ETA', ok);
        ctx.goal(0.3, 'one dispatched event was written', ok && fresh.length === 1);
        return ctx.score();
      }
    solution: "(ctx) => { const r = ctx.api('GET', '/shipments?status=created&sort=-weight_kg&limit=1'); ctx.assert(r.status === 200 && r.body.data.length === 1, 'no created shipment found: ' + JSON.stringify(r.body)); const d = ctx.api('POST', '/shipments/' + r.body.data[0].id + '/dispatch', {}); ctx.assert(d.status === 200, 'dispatch failed: ' + JSON.stringify(d.body)); }"
    decoys:
      - why: dispatches the lightest created shipment instead of the heaviest
        script: (ctx) => { const r = ctx.api('GET', '/shipments?status=created&sort=weight_kg&limit=1'); ctx.api('POST', '/shipments/' + r.body.data[0].id + '/dispatch', {}); }
      - why: dispatches the two heaviest created shipments, so one extra shipment changes
        script: (ctx) => { const r = ctx.api('GET', '/shipments?status=created&sort=-weight_kg&limit=2'); for (const s of r.body.data) ctx.api('POST', '/shipments/' + s.id + '/dispatch', {}); }
      - why: dispatches the heaviest created shipment correctly, then also edits its weight
        script: |-
          (ctx) => {
            const r = ctx.api('GET', '/shipments?status=created&sort=-weight_kg&limit=1');
            const s = r.body.data[0];
            ctx.api('POST', '/shipments/' + s.id + '/dispatch', {});
            ctx.api('PATCH', '/shipments/' + s.id, { weight_kg: s.weight_kg + 1 });
          }
  move_postnl_created_to_dpd:
    difficulty: medium
    instruction: PostNL has suspended pickups. Move every shipment that is still in status created and uses the carrier PostNL over to the carrier DPD. Use the carrier reassignment action so each change is recorded in the tracking history. Leave PostNL shipments that are already in transit, delayed, delivered or returned alone.
    grader: |-
      (ctx) => {
        const post = ctx.seed.list('carrier', { where: { name: 'PostNL' } })[0];
        const dpd = ctx.seed.list('carrier', { where: { name: 'DPD' } })[0];
        if (!post || !dpd) return 0;
        const targets = ctx.seed.list('shipment', { where: { carrier_id: post.id, status: 'created' } });
        if (targets.length === 0) return 0;
        const old = new Set(ctx.seed.list('shipment_event').map((e) => e.id));
        const events = targets.flatMap((t) => ctx.db.list('shipment_event', { where: { shipment_id: t.id } })).filter((e) => !old.has(e.id));
        ctx.guardChanges('only the carrier of the created PostNL shipments and their new events changed', [
          ...targets.map((t) => ({ entity: 'shipment', id: t.id, kind: 'updated', fields: ['carrier_id'] })),
          ...events.map((e) => ({ entity: 'shipment_event', id: e.id, kind: 'created', fields: ['shipment_id', 'kind', 'hub_id', 'note'] })),
        ]);
        let done = 0;
        for (const t of targets) {
          const end = ctx.db.get('shipment', t.id);
          if (end === null || end.carrier_id !== dpd.id || end.status !== 'created') continue;
          const evs = events.filter((e) => e.shipment_id === t.id && e.kind === 'carrier_changed');
          if (evs.length === 1) done += 1;
        }
        return done / targets.length;
      }
    solution: "(ctx) => { const cars = ctx.api('GET', '/carriers').body.data; const post = cars.find((c) => c.name === 'PostNL'); const dpd = cars.find((c) => c.name === 'DPD'); ctx.assert(post && dpd, 'carriers PostNL and DPD not found'); const rows = []; let cur = null; do { const r = ctx.api('GET', '/shipments?carrier_id=' + post.id + '&status=created' + (cur === null ? '' : '&cursor=' + cur)); ctx.assert(r.status === 200, 'list failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cur = r.body.next_cursor; } while (cur); ctx.assert(rows.length > 0, 'no created PostNL shipments found'); for (const s of rows) { const r = ctx.api('POST', '/shipments/' + s.id + '/reassign_carrier', { carrier_id: dpd.id }); ctx.assert(r.status === 200, 'reassign ' + s.id + ' failed: ' + JSON.stringify(r.body)); } }"
    decoys:
      - why: PATCHes carrier_id to DPD on every PostNL shipment whatever its status, so dispatched, delayed and delivered shipments change too
        script: "(ctx) => { const cars = ctx.api('GET', '/carriers').body.data; const post = cars.find((c) => c.name === 'PostNL'); const dpd = cars.find((c) => c.name === 'DPD'); const ids = []; let cur = null; do { const r = ctx.api('GET', '/shipments?carrier_id=' + post.id + (cur === null ? '' : '&cursor=' + cur)); for (const s of r.body.data) ids.push(s.id); cur = r.body.next_cursor; } while (cur); for (const id of ids) ctx.api('PATCH', '/shipments/' + id, { carrier_id: dpd.id }); }"
      - why: reads only the first page of PostNL shipments, so created shipments on page 2 are missed
        script: "(ctx) => { const cars = ctx.api('GET', '/carriers').body.data; const post = cars.find((c) => c.name === 'PostNL'); const dpd = cars.find((c) => c.name === 'DPD'); const page = ctx.api('GET', '/shipments?carrier_id=' + post.id).body.data; for (const s of page) { if (s.status === 'created') ctx.api('POST', '/shipments/' + s.id + '/reassign_carrier', { carrier_id: dpd.id }); } }"
      - why: reassigns the right shipments but to DHL instead of DPD
        script: "(ctx) => { const cars = ctx.api('GET', '/carriers').body.data; const post = cars.find((c) => c.name === 'PostNL'); const dhl = cars.find((c) => c.name === 'DHL'); const rows = ctx.api('GET', '/shipments?carrier_id=' + post.id + '&status=created').body.data; for (const s of rows) ctx.api('POST', '/shipments/' + s.id + '/reassign_carrier', { carrier_id: dhl.id }); }"
      - why: PATCHes carrier_id on the right shipments instead of using the reassignment action, so no carrier_changed event is recorded
        script: "(ctx) => { const cars = ctx.api('GET', '/carriers').body.data; const post = cars.find((c) => c.name === 'PostNL'); const dpd = cars.find((c) => c.name === 'DPD'); const rows = ctx.api('GET', '/shipments?carrier_id=' + post.id + '&status=created').body.data; for (const s of rows) ctx.api('PATCH', '/shipments/' + s.id, { carrier_id: dpd.id }); }"
      - why: reassigns every created PostNL shipment correctly, then also edits the weight of one
        script: |-
          (ctx) => {
            const cars = ctx.api('GET', '/carriers').body.data;
            const post = cars.find((c) => c.name === 'PostNL');
            const dpd = cars.find((c) => c.name === 'DPD');
            const rows = [];
            let cur = null;
            do {
              const r = ctx.api('GET', '/shipments?carrier_id=' + post.id + '&status=created' + (cur === null ? '' : '&cursor=' + cur));
              rows.push(...r.body.data);
              cur = r.body.next_cursor;
            } while (cur);
            for (const s of rows) ctx.api('POST', '/shipments/' + s.id + '/reassign_carrier', { carrier_id: dpd.id });
            ctx.api('PATCH', '/shipments/' + rows[0].id, { weight_kg: rows[0].weight_kg + 1 });
          }
  claim_for_late_delivered_shipments:
    difficulty: hard
    instruction: Open a 'late' claim of 2500 (EUR 25.00) for every delivered shipment that arrived more than 48 hours after its expected delivery time and has no late claim yet, open or resolved. Do not open claims on any other shipment, and change nothing else.
    grader: "(ctx) => { const seedClaims = ctx.seed.list('claim'); const has = new Set(seedClaims.filter((c) => c.kind === 'late').map((c) => c.shipment_id)); const targets = ctx.seed.list('shipment', { where: { status: 'delivered' } }).filter((s) => s.expected_delivery_at !== null && s.delivered_at !== null && ctx.time.minutesBetween(s.expected_delivery_at, s.delivered_at) > 48 * 60 && !has.has(s.id)); if (targets.length === 0) return 0; const ids = new Set(targets.map((t) => t.id)); const collateral = ctx.changes().some((c) => { if (c.kind !== 'created') return true; if (c.entity === 'claim') { const row = ctx.db.get('claim', c.id); return row === null || !ids.has(row.shipment_id) || row.kind !== 'late'; } if (c.entity === 'shipment_event') { const e = ctx.db.get('shipment_event', c.id); return e === null || !ids.has(e.shipment_id) || e.kind !== 'claim_opened'; } return true; }); ctx.guard('only late claims and their claim_opened events on the target shipments were created', !collateral); const old = new Set(seedClaims.map((c) => c.id)); let done = 0; for (const t of targets) { const fresh = ctx.db.list('claim', { where: { shipment_id: t.id, kind: 'late' } }).filter((c) => !old.has(c.id)); if (fresh.length === 1 && fresh[0].status === 'open' && fresh[0].amount === 2500) done += 1; } return done / targets.length; }"
    solution: "(ctx) => { const pages = (p) => { const rows = []; let cur = null; do { const r = ctx.api('GET', p + (cur === null ? '' : '&cursor=' + cur)); ctx.assert(r.status === 200, 'GET ' + p + ' failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cur = r.body.next_cursor; } while (cur); return rows; }; const toMin = (iso) => { const y0 = +iso.slice(0, 4); const m = +iso.slice(5, 7); const d = +iso.slice(8, 10); const H = +iso.slice(11, 13); const M = +iso.slice(14, 16); const y = m <= 2 ? y0 - 1 : y0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (m > 2 ? m - 3 : m + 9) + 2) / 5) + d - 1; const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy; return (era * 146097 + doe) * 1440 + H * 60 + M; }; const has = new Set(pages('/claims?kind=late').map((c) => c.shipment_id)); const ships = pages('/shipments?status=delivered'); const targets = ships.filter((s) => s.expected_delivery_at && s.delivered_at && toMin(s.delivered_at) - toMin(s.expected_delivery_at) > 48 * 60 && !has.has(s.id)); ctx.assert(targets.length > 0, 'no late delivered shipments without a late claim'); for (const s of targets) { const r = ctx.api('POST', '/shipments/' + s.id + '/claim', { kind: 'late', amount: 2500 }); ctx.assert(r.status === 201, 'claim on ' + s.id + ' failed: ' + JSON.stringify(r.body)); } }"
    decoys:
      - why: reads only the first page of delivered shipments, so late deliveries on later pages get no claim
        script: "(ctx) => { const toMin = (iso) => { const y0 = +iso.slice(0, 4); const m = +iso.slice(5, 7); const d = +iso.slice(8, 10); const H = +iso.slice(11, 13); const M = +iso.slice(14, 16); const y = m <= 2 ? y0 - 1 : y0; const era = Math.floor(y / 400); const yoe = y - era * 400; const doy = Math.floor((153 * (m > 2 ? m - 3 : m + 9) + 2) / 5) + d - 1; const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy; return (era * 146097 + doe) * 1440 + H * 60 + M; }; const claims = ctx.api('GET', '/claims?kind=late').body.data; const has = new Set(claims.map((c) => c.shipment_id)); const page = ctx.api('GET', '/shipments?status=delivered').body.data; for (const s of page) { if (s.expected_delivery_at && s.delivered_at && toMin(s.delivered_at) - toMin(s.expected_delivery_at) > 48 * 60 && !has.has(s.id)) ctx.api('POST', '/shipments/' + s.id + '/claim', { kind: 'late', amount: 2500 }); } }"
