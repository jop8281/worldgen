format: 1
meta:
  name: retail_tau2
  description: "An online retail store after the tau2-bench retail domain: customers with payment methods, products with variants, and orders that can be cancelled, modified, returned or exchanged under status guards."
  resembles: tau2-bench retail domain (sierra-research/tau2-bench, commit 5bfa7e3)
  source: hand
  seed: 7
  clock:
    start: 2026-03-02T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A shopper. The default address is what a new order would ship to.
    idPrefix: cus
    fields:
      first_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      last_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      address1:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      address2:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      state:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      country:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      zip:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
  payment_method:
    description: "A payment method on file: a credit card, a PayPal account or a gift card. Only gift cards hold a balance."
    idPrefix: pay
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - credit_card
          - paypal
          - gift_card
      brand:
        type: string
        description: Card brand, for credit cards.
        required: false
        nullable: true
        unique: false
        readonly: false
      last_four:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        pattern: ^[0-9]{4}$
      balance:
        type: money
        description: Gift card balance in cents. Null for other kinds.
        required: false
        nullable: true
        unique: false
        readonly: false
        currency: USD
        min: 0
  product:
    description: "A product type. A product id is not an item id: items are its variants."
    idPrefix: prd
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
  variant:
    description: One purchasable item of a product, with its options and price. The item id in order calls is the id of a variant.
    idPrefix: var
    fields:
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      options:
        type: string
        description: 'For example "color: blue, size: M".'
        required: true
        nullable: false
        unique: false
        readonly: false
      available:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
      price:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  order:
    description: An order. Its status moves only through the order actions.
    idPrefix: ord
    fields:
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        pattern: ^#W[0-9]{7}$
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - pending
          - pending_item_modified
          - processed
          - delivered
          - cancelled
          - exchange_requested
          - return_requested
        initial: pending
        transitions:
          pending:
            - pending_item_modified
            - processed
            - cancelled
          pending_item_modified:
            - processed
          processed:
            - delivered
          delivered:
            - return_requested
            - exchange_requested
          cancelled: []
          exchange_requested: []
          return_requested: []
      address1:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      address2:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      state:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      country:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      zip:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      cancel_reason:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - no longer needed
          - ordered by mistake
      return_payment_method_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
      exchange_payment_method_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
      exchange_price_difference:
        type: money
        description: Cents. Negative when the new items cost less.
        required: false
        nullable: true
        unique: false
        readonly: false
        currency: USD
  order_item:
    description: "One line of an order: the variant bought and its price at purchase."
    idPrefix: itm
    fields:
      order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: order
        onDelete: restrict
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      variant_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: variant
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      price:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      options:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      request:
        type: enum
        description: Set when the line is part of a return or exchange request.
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - return
          - exchange
      exchange_variant_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: variant
        onDelete: restrict
  payment_entry:
    description: "One row of an order payment history: a payment or a refund against a payment method."
    idPrefix: txn
    fields:
      order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: order
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - payment
          - refund
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      payment_method_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
