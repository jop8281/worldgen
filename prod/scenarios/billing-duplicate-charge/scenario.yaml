name: billing-duplicate-charge
description: Acme Logistics was charged $149.00 twice for order O-7301, so the agent refunds the duplicate once, though the first refund response is lost, and resolves the support ticket with a note that cites the refund.
worlds:
  support: worlds/support
  payments: worlds/payments
gates:
  - world: support
    task: resolve_acme_double_charge
  - world: payments
    task: refund_acme_duplicate_o7301
faults:
  - world: payments
    method: POST
    path: /v1/refunds
    nth: 1
    kind: drop_response
links:
  - name: the ticket note cites the refund payments created
    from:
      world: payments
      entity: refund
      where:
        charge: ch_0142
      field: id
    to:
      world: support
      entity: ticket_event
      where:
        ticket_id: tkt_0321
        kind: resolved
      field: note
    rule: cites
