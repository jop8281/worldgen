name: billing-duplicate-charge
description: Acme Logistics was charged $149.00 twice for order O-7301, so the agent refunds the duplicate once, though the first refund response is lost, and resolves the support ticket with a note that cites the refund. Payments notifies the ticket of each refund, twice.
worlds:
  support: worlds/support
  payments: worlds/payments
gates:
  - world: support
    task: resolve_acme_double_charge
  - world: payments
    task: refund_acme_duplicate_o7301
faults:
  - world: payments
    method: POST
    path: /v1/refunds
    nth: 1
    kind: drop_response
events:
  - name: a refund notifies the billing ticket
    on:
      world: payments
      method: POST
      path: /v1/refunds
      status: 200
    deliver:
      world: support
      method: POST
      path: /tickets/tkt_0321/payment_events
      body:
        kind: charge.refunded
        refund: ${response.id}
        charge: ${response.charge}
    fault: duplicate
links:
  - name: the ticket note cites the refund payments created
    from:
      world: payments
      entity: refund
      where:
        charge: ch_0142
      field: id
    to:
      world: support
      entity: ticket_event
      where:
        ticket_id: tkt_0321
        kind: resolved
      field: note
    rule: cites
provenance:
  - name: each refund event on a ticket was delivered by payments and cites a refund payments has
    rows:
      world: support
      entity: ticket_event
      where:
        kind: payment_refunded
    source: event
    cites:
      field: note
      world: payments
      entity: refund
