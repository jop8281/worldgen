  refund_duplicate_charge:
    difficulty: medium
    instruction: Cedar Analytics says it was billed twice for the same order. Find the two succeeded charges of the same amount and the same description that were created minutes apart, and refund the later one in full with the reason 'duplicate'. Do not touch the earlier charge or any other charge.
    grader: |-
      (ctx) => {
        const cust = ctx.seed.list('customer', { where: { name: 'Cedar Analytics' } })[0];
        if (!cust) return 0;
        const groups = {};
        for (const c of ctx.seed.list('charge', { where: { customer: cust.id, status: 'succeeded' } })) {
          const k = c.amount + '|' + c.description;
          if (!groups[k]) groups[k] = [];
          groups[k].push(c);
        }
        const pairs = Object.values(groups).filter((g) => g.length === 2);
        if (pairs.length !== 1) return 0;
        const later = pairs[0][0].created_at > pairs[0][1].created_at ? pairs[0][0] : pairs[0][1];
        const collateral = ctx.changes().some((c) => {
          if (c.entity === 'charge' && c.id === later.id) return false;
          if (c.entity === 'refund' && c.kind === 'created') {
            const r = ctx.db.get('refund', c.id);
            return !(r && r.charge === later.id);
          }
          return true;
        });
        ctx.guard('only the later charge and its new refund changed', !collateral);
        const old = new Set(ctx.seed.list('refund', { where: { charge: later.id } }).map((r) => r.id));
        const fresh = ctx.db.list('refund', { where: { charge: later.id } }).filter((r) => !old.has(r.id));
        ctx.goal(0.4, 'one new refund for the full amount of the later charge', fresh.length === 1 && fresh[0].amount === later.amount);
        ctx.goal(0.3, 'the refund reason is duplicate', fresh.length === 1 && fresh[0].reason === 'duplicate');
        const end = ctx.db.get('charge', later.id);
        ctx.goal(0.3, 'the later charge is fully refunded', end.amount_refunded === later.amount && end.refunded === true);
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + '&limit=100' + (cursor === null ? '' : '&starting_after=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.has_more === true ? r.body.data[r.body.data.length - 1].id : null;
          } while (cursor !== null);
          return rows;
        };
        const cust = ctx.api('GET', '/v1/customers?q=Cedar').body.data.find((c) => c.name === 'Cedar Analytics');
        ctx.assert(cust, 'customer Cedar Analytics not found');
        const groups = {};
        for (const c of pages('/v1/charges?customer=' + cust.id + '&status=succeeded')) {
          const k = c.amount + '|' + c.description;
          if (!groups[k]) groups[k] = [];
          groups[k].push(c);
        }
        const pairs = Object.values(groups).filter((g) => g.length === 2);
        ctx.assert(pairs.length === 1, 'expected one duplicate pair, found ' + pairs.length);
        const later = pairs[0][0].created_at > pairs[0][1].created_at ? pairs[0][0] : pairs[0][1];
        const r = ctx.api('POST', '/v1/refunds', { charge: later.id, reason: 'duplicate' });
        ctx.assert(r.status === 200, 'refund failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: refunds the earlier of the two duplicate charges instead of the later one
        script: |-
          (ctx) => {
            const cust = ctx.api('GET', '/v1/customers?q=Cedar').body.data.find((c) => c.name === 'Cedar Analytics');
            let cursor = null;
            const rows = [];
            do {
              const r = ctx.api('GET', '/v1/charges?customer=' + cust.id + '&status=succeeded&limit=100' + (cursor === null ? '' : '&starting_after=' + cursor));
              rows.push(...r.body.data);
              cursor = r.body.has_more === true ? r.body.data[r.body.data.length - 1].id : null;
            } while (cursor !== null);
            const dups = rows.filter((c) => c.description === 'Order #4821').sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
            ctx.api('POST', '/v1/refunds', { charge: dups[0].id, reason: 'duplicate' });
