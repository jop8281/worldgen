  refund_remaining_balance_for_customer:
    difficulty: hard
    instruction: Redwood Labs is closing its account. For every Redwood Labs charge that is succeeded and captured and not yet fully refunded, refund the remaining refundable balance (the captured amount minus what is already refunded) with the reason 'requested_by_customer'. Skip charges that are failed, pending, uncaptured or already fully refunded. Do not touch charges of any other customer, including customers with a similar name. The customer has many charges, so check every page of results.
    grader: |-
      (ctx) => {
        const cust = ctx.seed.list('customer', { where: { name: 'Redwood Labs' } })[0];
        if (!cust) return 0;
        const targets = ctx.seed.list('charge', { where: { customer: cust.id } })
          .filter((c) => c.status === 'succeeded' && c.captured === true && c.amount_captured - c.amount_refunded > 0);
        if (targets.length === 0) return 0;
        const byId = {};
        for (const t of targets) byId[t.id] = t;
        const seedRefunds = new Set(ctx.seed.list('refund').map((r) => r.id));
        for (const c of ctx.changes()) {
          if (c.entity === 'charge' && byId[c.id]) continue;
          if (c.entity === 'refund' && c.kind === 'created') {
            const r = ctx.db.get('refund', c.id);
            if (r && byId[r.charge]) continue;
          }
          return 0;
        }
        let done = 0;
        for (const t of targets) {
          const end = ctx.db.get('charge', t.id);
          const remaining = t.amount_captured - t.amount_refunded;
          const fresh = ctx.db.list('refund', { where: { charge: t.id } }).filter((r) => !seedRefunds.has(r.id));
          if (end.amount_refunded === end.amount_captured && fresh.length === 1 && fresh[0].amount === remaining && fresh[0].reason === 'requested_by_customer') done += 1;
        }
        return done / targets.length;
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + '&limit=100' + (cursor === null ? '' : '&starting_after=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.has_more === true ? r.body.data[r.body.data.length - 1].id : null;
          } while (cursor !== null);
          return rows;
        };
        const cust = ctx.api('GET', '/v1/customers?q=Redwood').body.data.find((c) => c.name === 'Redwood Labs');
        ctx.assert(cust, 'customer Redwood Labs not found');
        const charges = pages('/v1/charges?customer=' + cust.id + '&status=succeeded&captured=true&refunded=false');
        const targets = charges.filter((c) => c.amount_captured - c.amount_refunded > 0);
        ctx.assert(targets.length > 0, 'no refundable Redwood Labs charges found');
        for (const c of targets) {
          const r = ctx.api('POST', '/v1/refunds', { charge: c.id, amount: c.amount_captured - c.amount_refunded, reason: 'requested_by_customer' });
          ctx.assert(r.status === 200, 'refund of ' + c.id + ' failed: ' + JSON.stringify(r.body));
