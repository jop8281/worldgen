format: 1
meta:
  name: acme_payments
  description: "Derived from gen_stripe_charges for the flagship scenario billing-duplicate-charge (A-397). A deterministic replica of the Stripe REST charges and refunds surface. Customers hold a card state that decides how a new charge resolves (succeeded, failed or pending). Charges can be created uncaptured, then captured in full or in part. Refunds are issued against captured charges and move through pending to succeeded, failed or canceled. Jobs settle pending bank-debit charges, expire stale uncaptured authorizations after 7 days, and settle pending refunds. Agents list, retrieve, create, capture and refund with Stripe-style paths, a list envelope and an error body. The input keeps only three charge operations. The world adds refunds, capture and customer lookup so that writes and realistic tasks are possible. Acme Logistics has three $149.00 charges: order O-7301 twice, minutes apart, and order O-7302."
  resembles: Stripe API (2024-06-20), charges and refunds subset
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: stripe
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        type: invalid_request_error
        code: $code
        message: $message
entities:
  customer:
    description: A Stripe customer that charges are billed to. card_state is a simulation switch for the card on file and decides how a new charge for this customer resolves.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        format: email
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      card_state:
        type: enum
        description: valid charges succeed, declined and expired charges fail, bank_debit charges stay pending until settled.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - valid
          - declined
          - expired
          - bank_debit
        default: valid
      livemode:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: false
  charge:
    description: A payment attempt, mirroring the Stripe Charge object. Amounts are integer minor units. Status, paid, captured and the amount fields are maintained by actions and jobs.
    idPrefix: ch
    fields:
      amount:
        type: int
        description: Charge amount in minor units of currency.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 50
      currency:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - usd
          - eur
          - gbp
      customer:
        type: ref
        description: The customer billed. null for a charge with no customer.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      description:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 500
      receipt_email:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        format: email
      status:
        type: state
        description: pending until a bank debit settles, then succeeded or failed. Both are final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - succeeded
          - failed
        initial: pending
        transitions:
          pending:
            - succeeded
            - failed
          succeeded: []
          failed: []
      paid:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
      captured:
        type: bool
        description: false for an authorization made with capture=false.
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
      amount_captured:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      amount_refunded:
        type: int
        description: Sum of pending and succeeded refunds. Never exceeds amount_captured, or amount for a released authorization.
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      refunded:
        type: bool
        description: true once amount_refunded covers the whole captured amount.
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
      failure_code:
        type: string
        description: card_declined or expired_card on a failed charge.
        required: false
        nullable: true
        unique: false
        readonly: true
      failure_message:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: true
      payment_intent:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: true
      livemode:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
  refund:
    description: A refund of all or part of a charge, mirroring the Stripe Refund object. Written by create_refund, cancel_refund and the settlement jobs.
    idPrefix: re
    fields:
      charge:
        type: ref
        description: The charge being refunded.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: charge
        onDelete: restrict
      amount:
        type: int
        description: Refund amount in minor units, in the charge currency.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      currency:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - usd
          - eur
          - gbp
      reason:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - duplicate
          - expired_uncaptured_charge
          - fraudulent
          - requested_by_customer
      status:
        type: state
        description: pending until settled. succeeded, failed and canceled are final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - succeeded
          - failed
          - canceled
        initial: pending
        transitions:
          pending:
            - succeeded
            - failed
            - canceled
          succeeded: []
          failed: []
          canceled: []
      failure_reason:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - expired_or_canceled_card
          - lost_or_stolen_card
          - unknown
      receipt_number:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: true
      payment_intent:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: true
routes:
  list_charges:
    op: list
    entity: charge
    filters:
      - customer
      - status
      - captured
      - paid
      - refunded
    search:
      - description
      - receipt_email
    sort: []
    pageSize: 10
    method: GET
    path: /v1/charges
    description: List charges, newest first. Page with starting_after and limit.
  get_charge:
    op: get
    entity: charge
    method: GET
    path: /v1/charges/{id}
    description: Retrieve one charge.
  list_refunds:
    op: list
    entity: refund
    filters:
      - charge
      - status
      - reason
    search: []
    sort: []
    pageSize: 10
    method: GET
    path: /v1/refunds
    description: List refunds. Filter by charge to see the refunds of one charge.
  get_refund:
    op: get
    entity: refund
    method: GET
    path: /v1/refunds/{id}
    description: Retrieve one refund.
  list_customers:
    op: list
    entity: customer
    filters:
      - card_state
    search:
      - name
      - email
    sort: []
    pageSize: 10
    method: GET
    path: /v1/customers
    description: List customers. Search by name or email to find a customer id.
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /v1/customers/{id}
    description: Retrieve one customer.
actions:
  create_charge:
    method: POST
    path: /v1/charges
    description: "Create a charge. The customer's card_state decides the outcome: valid succeeds (captured unless capture is false), declined and expired produce a failed charge with a failure_code, bank_debit stays pending until settled. A failed charge is returned with 200 and status failed. A charge with no customer succeeds."
    input:
      amount:
        type: int
        description: Amount in minor units. At least 50.
        required: true
        nullable: false
        unique: false
        readonly: false
      currency:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - usd
          - eur
          - gbp
      customer:
        type: string
        description: Customer id, such as cus_0001.
        required: false
        nullable: true
        unique: false
        readonly: false
      description:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 500
      receipt_email:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        format: email
      capture:
        type: bool
        description: false makes an authorization to capture later. Default true.
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const b = ctx.body;
        if (!Number.isInteger(b.amount) || b.amount < 50) ctx.fail(422, 'invalid_amount', 'amount must be an integer of at least 50 minor units, found ' + b.amount);
        let cust = null;
        if (b.customer !== undefined && b.customer !== null) {
          cust = ctx.db.get('customer', b.customer);
          if (cust === null) ctx.fail(422, 'resource_missing', 'No such customer: ' + b.customer + '. Find customers with GET /v1/customers.');
        }
        const capture = b.capture === undefined || b.capture === null ? true : b.capture;
        const state = cust === null ? 'valid' : cust.card_state;
        if (state === 'bank_debit' && capture === false) ctx.fail(422, 'capture_unsupported', 'Customer ' + cust.id + ' pays by bank debit, which cannot be authorized and captured later. Use capture true.');
        const row = ctx.db.create('charge', {
          amount: b.amount,
          currency: b.currency,
          customer: cust === null ? null : cust.id,
          description: b.description === undefined ? null : b.description,
          receipt_email: b.receipt_email === undefined ? null : b.receipt_email,
        });
        const patch = { payment_intent: 'pi_' + row.id.slice(3) };
        if (state === 'declined') {
          patch.status = 'failed';
          patch.failure_code = 'card_declined';
          patch.failure_message = 'Your card was declined.';
        } else if (state === 'expired') {
          patch.status = 'failed';
          patch.failure_code = 'expired_card';
          patch.failure_message = 'Your card has expired.';
        } else if (state === 'valid') {
          patch.status = 'succeeded';
          patch.paid = true;
          patch.captured = capture;
          patch.amount_captured = capture ? b.amount : 0;
        }
        const updated = ctx.db.update('charge', row.id, patch);
        return { status: 200, body: updated };
      }
  capture_charge:
    method: POST
    path: /v1/charges/{id}/capture
    description: Capture a succeeded, uncaptured, not refunded charge, in full or in part with amount_to_capture. The rest of the authorization is released. A charge can be captured only once.
    input:
      amount_to_capture:
        type: int
        description: Amount to capture, between 1 and the charge amount. Default is the full amount.
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('charge', id);
        if (t === null) ctx.fail(404, 'resource_missing', 'No such charge: ' + id);
        if (t.status !== 'succeeded') ctx.fail(409, 'charge_not_capturable', 'Charge ' + id + ' is ' + t.status + '. Only succeeded authorizations can be captured.');
        if (t.refunded) ctx.fail(409, 'charge_already_refunded', 'Charge ' + id + ' was refunded or released and cannot be captured.');
        if (t.captured) ctx.fail(409, 'charge_already_captured', 'Charge ' + id + ' has already been captured.');
        const a = ctx.body.amount_to_capture;
        const given = a !== undefined && a !== null;
        if (given && (!Number.isInteger(a) || a < 1 || a > t.amount)) ctx.fail(422, 'invalid_amount', 'amount_to_capture must be between 1 and ' + t.amount + ', found ' + a);
        const updated = ctx.db.update('charge', id, { captured: true, paid: true, amount_captured: given ? a : t.amount });
        return { status: 200, body: updated };
      }
  create_refund:
    method: POST
    path: /v1/refunds
    description: "Refund a succeeded charge. Amount defaults to the refundable balance (amount_captured minus amount_refunded). A refund of a captured charge starts pending and counts against amount_refunded at once. Refunding an uncaptured authorization releases all of it: amount must be omitted or equal the charge amount, and the refund is succeeded at once."
    input:
      charge:
        type: string
        description: Id of the charge to refund.
        required: true
        nullable: false
        unique: false
        readonly: false
      amount:
        type: int
        description: Amount in minor units. Default is the full refundable balance.
        required: false
        nullable: true
        unique: false
        readonly: false
      reason:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - duplicate
          - fraudulent
          - requested_by_customer
    handler: |-
      (ctx) => {
        const b = ctx.body;
        const charge = ctx.db.get('charge', b.charge);
        if (charge === null) ctx.fail(422, 'resource_missing', 'No such charge: ' + b.charge + '. List charges with GET /v1/charges.');
        if (charge.status !== 'succeeded') ctx.fail(409, 'charge_not_refundable', 'Charge ' + charge.id + ' is ' + charge.status + '. Only succeeded charges can be refunded.');
        if (charge.refunded) ctx.fail(409, 'charge_already_refunded', 'Charge ' + charge.id + ' has already been fully refunded.');
        const given = b.amount !== undefined && b.amount !== null;
        if (given && (!Number.isInteger(b.amount) || b.amount < 1)) ctx.fail(422, 'invalid_amount', 'amount must be an integer of at least 1, found ' + b.amount);
        const reason = b.reason === undefined ? null : b.reason;
        if (!charge.captured) {
          if (given && b.amount !== charge.amount) ctx.fail(422, 'invalid_amount', 'Charge ' + charge.id + ' is not captured. Releasing it refunds the full ' + charge.amount + ', found ' + b.amount);
          const r = ctx.db.create('refund', { charge: charge.id, amount: charge.amount, currency: charge.currency, reason, payment_intent: charge.payment_intent });
          const done = ctx.db.update('refund', r.id, { status: 'succeeded', receipt_number: 'RN-' + r.id.slice(3) });
          ctx.db.update('charge', charge.id, { amount_refunded: charge.amount, refunded: true });
          return { status: 200, body: done };
        }
        const balance = charge.amount_captured - charge.amount_refunded;
        if (balance <= 0) ctx.fail(409, 'charge_already_refunded', 'Charge ' + charge.id + ' has no refundable balance left.');
        const amount = given ? b.amount : balance;
        if (amount > balance) ctx.fail(422, 'amount_too_large', 'Refund amount ' + amount + ' is greater than the refundable balance ' + balance + ' of charge ' + charge.id + '.');
        const r = ctx.db.create('refund', { charge: charge.id, amount, currency: charge.currency, reason, payment_intent: charge.payment_intent });
        const total = charge.amount_refunded + amount;
        ctx.db.update('charge', charge.id, { amount_refunded: total, refunded: total === charge.amount_captured });
        return { status: 200, body: r };
      }
  cancel_refund:
    method: POST
    path: /v1/refunds/{id}/cancel
    description: "Cancel a pending refund. The amount goes back to the charge: amount_refunded drops by the refund amount and refunded becomes false."
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const r = ctx.db.get('refund', id);
        if (r === null) ctx.fail(404, 'resource_missing', 'No such refund: ' + id);
        if (r.status !== 'pending') ctx.fail(409, 'refund_not_cancelable', 'Refund ' + id + ' is ' + r.status + '. Only pending refunds can be canceled.');
        const charge = ctx.db.get('charge', r.charge);
        const updated = ctx.db.update('refund', id, { status: 'canceled' });
        ctx.db.update('charge', charge.id, { amount_refunded: Math.max(0, charge.amount_refunded - r.amount), refunded: false });
        return { status: 200, body: updated };
      }
jobs:
  settle_pending_charges:
    description: "Every hour. A pending charge created at least 48 hours ago succeeds: paid, captured and amount_captured equal to amount."
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const c of ctx.db.list('charge', { where: { status: 'pending' } })) {
          if (ctx.time.minutesBetween(c.created_at, now) < 48 * 60) continue;
          ctx.db.update('charge', c.id, { status: 'succeeded', paid: true, captured: true, amount_captured: c.amount });
        }
      }
  expire_uncaptured_charges:
    description: "Every hour. A succeeded, uncaptured, not refunded charge created at least 7 days ago is released: a succeeded refund for the full amount with reason expired_uncaptured_charge is created and the charge becomes refunded."
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const c of ctx.db.list('charge', { where: { status: 'succeeded', captured: false, refunded: false } })) {
          if (ctx.time.minutesBetween(c.created_at, now) < 7 * 24 * 60) continue;
          const r = ctx.db.create('refund', { charge: c.id, amount: c.amount, currency: c.currency, reason: 'expired_uncaptured_charge', payment_intent: c.payment_intent });
          ctx.db.update('refund', r.id, { status: 'succeeded', receipt_number: 'RN-' + r.id.slice(3) });
          ctx.db.update('charge', c.id, { amount_refunded: c.amount, refunded: true });
        }
      }
  settle_refunds:
    description: Every 15 minutes. A pending refund at least 1 hour old succeeds with a receipt number, or fails with expired_or_canceled_card when the charge's customer has an expired card. A failed refund is subtracted from the charge's amount_refunded and clears refunded.
    every: 15m
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const r of ctx.db.list('refund', { where: { status: 'pending' } })) {
          if (ctx.time.minutesBetween(r.created_at, now) < 60) continue;
          const charge = ctx.db.get('charge', r.charge);
          const cust = charge.customer === null ? null : ctx.db.get('customer', charge.customer);
          if (cust !== null && cust.card_state === 'expired') {
            ctx.db.update('refund', r.id, { status: 'failed', failure_reason: 'expired_or_canceled_card' });
            ctx.db.update('charge', charge.id, { amount_refunded: Math.max(0, charge.amount_refunded - r.amount), refunded: false });
          } else {
            ctx.db.update('refund', r.id, { status: 'succeeded', receipt_number: 'RN-' + r.id.slice(3) });
          }
        }
      }
fixtures: {}
