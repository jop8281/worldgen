      [8, 20, 35, 50, 70, 95, 130].forEach((d, i) => {
        const amt = [2400000, 18500, 92000, 41000, 15600, 73000, 28800][i] / (i === 0 ? 100 : 1);
        mk(harbor, 'ok', amt, 'usd', 'Freight invoice #' + (7000 + i * 17), D(d), i === 2 ? { ref: 30000 } : {});
      });
      mk(harborSupply, 'auth', 22000, 'usd', 'Supply order #5520', 2 * 1440 + 300);
      // Cedar Analytics: planted duplicate pair, a same-amount decoy, and clean history.
      mk(cedar, 'ok', 18900, 'usd', 'Order #4821', 20 * 1440 + 7);
      mk(cedar, 'ok', 18900, 'usd', 'Order #4821', 20 * 1440);
      mk(cedar, 'ok', 18900, 'usd', 'Order #4790', D(30));
      [2, 5, 9, 14, 33, 45, 60, 88, 120].forEach((d) => mk(cedar, 'ok', ctx.int(15, 150) * 100, 'usd', 'Order #' + ctx.int(4000, 4700), D(d)));
      // Northwind Health.
      mk(nw, 'ok', 240000, 'usd', 'Annual plan renewal', 12 * 1440, { ref: 240000 });
      mk(nw, 'ok', 45000, 'usd', 'Support plan', 20 * 1440, { ref: 15000 });
      mk(nw, 'ok', 30000, 'usd', 'Onboarding fee', 40 * 1440, { ref: 30000 });
      [3, 33, 63].forEach((d) => mk(nw, 'ok', 12000, 'usd', 'Monthly usage', D(d)));
      // Redwood Labs: 24 charges.
      [12500, 8800, 45000, 23000, 6400, 31000, 15750, 9900, 27500].forEach((a, i) => mk(rw, 'ok', a, 'usd', 'Project invoice #' + (300 + i), D(7 + i * 14)));
      mk(rw, 'ok', 20000, 'usd', 'Project invoice #310', D(25), { cap: 12000 });
      [[30000, 10000], [18000, 6000], [52000, 20000], [7500, 2500], [40000, 15000]].forEach(([a, r], i) => mk(rw, 'ok', a, 'usd', 'Project invoice #' + (320 + i), D(10 + i * 19), { ref: r }));
      [14000, 9000, 22000].forEach((a, i) => mk(rw, 'ok', a, 'usd', 'Project invoice #' + (330 + i), D(15 + i * 30), { ref: a }));
      [[5000, 1], [11000, 3], [7000, 5]].forEach(([a, d], i) => mk(rw, 'auth', a, 'usd', 'Hold #' + (340 + i), d * 1440 + 400));
      mk(rw, 'released', 16000, 'usd', 'Hold #335', 20 * 1440 + 90);
      mk(rw, 'failed', 9000, 'usd', 'Project invoice #350', D(40));
      mk(rw, 'failed', 4000, 'usd', 'Project invoice #351', D(75));
      // Redwood Logistics.
      [12000, 8000, 21000].forEach((a, i) => mk(rl, 'ok', a, 'usd', 'Freight #' + (900 + i), D(10 + i * 20)));
      mk(rl, 'ok', 30000, 'usd', 'Freight #903', D(35), { ref: 10000 });
      mk(rl, 'auth', 9000, 'usd', 'Freight hold #904', 2 * 1440 + 100);
      const amt = () => ctx.int(5, 900) * 100 + ctx.pick([0, 50, 99]);
      for (let i = 0; i < 28; i++) mk(decExp[i % decExp.length], 'failed', amt(), curr(), desc(), ctx.int(30, 170 * 1440));
      for (let i = 0; i < 25; i++) mk(bankF[i % bankF.length], 'pending', amt(), curr(), desc(), ctx.int(60, 2800));
      const pool = validF.concat(bankF);
      const ages = [D(1), D(3), 5 * 1440 + ctx.int(0, 1000), 6 * 1440 + ctx.int(0, 600)];
      ages.forEach((a) => mk(ctx.pick(validF), 'auth', amt(), curr(), desc(), a));
      for (let i = 0; i < 3; i++) mk(ctx.pick(validF), 'released', amt(), curr(), desc(), D(ctx.int(9, 40)));
      for (let i = 0; i < 7; i++) { const a = amt(); mk(ctx.pick(pool), 'ok', a, curr(), desc(), D(ctx.int(6, 170)), { ref: Math.max(1, Math.floor(a * ctx.pick([0.25, 0.4, 0.5, 0.6]))) }); }
      for (let i = 0; i < 5; i++) { const a = amt(); mk(ctx.pick(pool), 'ok', a, curr(), desc(), D(ctx.int(6, 170)), { ref: a }); }
      { const a = amt(); mk(ctx.pick(validF), 'ok', a, curr(), desc(), D(ctx.int(6, 100)), { cap: Math.floor(a * 0.6) }); }
      for (let i = 0; i < 11; i++) mk(ctx.pick(pool), 'ok', amt(), curr(), desc(), ctx.int(3000, 170 * 1440));
      rows.sort((a, b) => (a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0));
      return rows.map((r, i) => ({ ...r, payment_intent: 'pi_' + String(i + 1).padStart(4, '0') }));
    })(before);
      const template = base.find((c) => c.status === 'succeeded' && c.captured && c.amount_refunded === 0 && c.customer !== null);
      const charge = (n, description, ago) => {
        const at = ctx.time.minus(ctx.now(), ago);
        return { ...template, amount: 14900, currency: 'usd', customer: acme.id, description, receipt_email: acme.email, amount_captured: 14900,
          payment_intent: 'pi_' + String(base.length + n).padStart(4, '0'), created_at: at, updated_at: at };
      };
      return [...base, charge(1, 'Order O-7301', '2d4h12m'), charge(2, 'Order O-7301', '2d4h5m'), charge(3, 'Order O-7302', '1d2h')];
    }
  refund: |-
    (ctx) => {
      const acme = ctx.rows('customer').find((c) => c.name === 'Acme Logistics');
      const before = { ...ctx, rows: (entity) => ctx.rows(entity).filter((r) => r.id !== acme.id && r.customer !== acme.id) };
      return ((ctx) => {
      const BASE = '2026-03-01T00:00:00.000Z';
      const START = '2026-10-06T09:00:00.000Z';
      const X = ctx.time.minutesBetween(BASE, START);
      const iso = (ago) => (ago === X ? BASE : ctx.time.plus(BASE, (X - ago) + 'm'));
      const custs = ctx.rows('customer');
      const name = {};
      for (const c of custs) name[c.id] = c.name;
      const anchorNames = new Set(['Harbor Freight Co', 'Cedar Analytics', 'Northwind Health', 'Redwood Labs', 'Redwood Logistics']);
      const reasons = ['duplicate', 'fraudulent', 'requested_by_customer', 'requested_by_customer', null];
      const nwPending = { 'Annual plan renewal': true, 'Support plan': true, 'Onboarding fee': false };
      const out = [];
      const push = (c, amount, reason, status, at, j) => {
        out.push({ at, row: {
          charge: c.id, amount, currency: c.currency, reason, status,
          failure_reason: status === 'failed' ? 'expired_or_canceled_card' : null,
          receipt_number: status === 'succeeded' ? 'RN-' + c.id.slice(3) + '-' + j : null,
          payment_intent: c.payment_intent,
        } });
      };
      const charges = ctx.rows('charge');
      let k = 0;
      for (const c of charges) {
        const idx = parseInt(c.id.slice(3), 10);
        const created = X - ctx.time.minutesBetween(BASE, c.created_at);
        const R = c.amount_refunded;
        const isNw = name[c.customer] === 'Northwind Health';
        if (R > 0) {
          if (!c.captured) {
            const when = ctx.time.plus(c.created_at, (7 * 1440 + ctx.int(5, 55)) + 'm');
            out.push({ at: X - ctx.time.minutesBetween(BASE, when), row: { charge: c.id, amount: c.amount, currency: c.currency, reason: 'expired_uncaptured_charge', status: 'succeeded', failure_reason: null, receipt_number: 'RN-' + c.id.slice(3) + '-0', payment_intent: c.payment_intent } });
          } else {
            const split = !isNw && idx % 4 === 0 && R >= 1000;
            const pieces = split ? [Math.floor(R * 0.4), R - Math.floor(R * 0.4)] : [R];
            const lastPending = isNw ? nwPending[c.description] === true : idx % 4 === 1;
            pieces.forEach((p, j) => {
              const last = j === pieces.length - 1;
              const reason = ctx.pick(reasons);
              if (last && lastPending) push(c, p, reason, 'pending', ctx.int(5, 50), j);
              else push(c, p, reason, 'succeeded', created - (120 + j * 180 + ctx.int(0, 60)), j);
            });
          }
        }
        if (c.status === 'succeeded' && c.captured && c.customer !== null && !anchorNames.has(name[c.customer])) {
          const slot = k++ % 3;
          const amount = Math.max(1, Math.floor(c.amount_captured / 3));
          if (slot === 0) push(c, amount, ctx.pick(reasons), 'failed', created - (60 + ctx.int(60, 120)), 9);
          else if (slot === 1) push(c, amount, ctx.pick(reasons), 'canceled', created - ctx.int(30, 90), 9);
        }
      }
      out.sort((a, b) => b.at - a.at);
      return out.map((e) => {
        const t = iso(e.at);
        return { ...e.row, created_at: t, updated_at: t };
      });
    })(before);
    }
tests:
  create_charge_without_customer:
    description: create_charge with no customer succeeds and is captured by default, capture=false makes an uncaptured authorization, and bad input is refused.
    script: |-
      (ctx) => {
        const r = ctx.api('POST', '/v1/charges', { amount: 5000, currency: 'usd', description: 'Order 1001', receipt_email: 'buyer@example.com' });
        ctx.assert(r.status === 200, 'create returned ' + r.status + ' ' + JSON.stringify(r.body));
        const c = r.body;
        ctx.assert(c.status === 'succeeded' && c.paid === true && c.captured === true && c.amount_captured === 5000, 'captured charge: ' + JSON.stringify(c));
        ctx.assert(c.amount_refunded === 0 && c.refunded === false && c.customer === null, 'no refunds, no customer: ' + JSON.stringify(c));
        ctx.assert(typeof c.payment_intent === 'string' && c.payment_intent.startsWith('pi_'), 'payment_intent set, got ' + c.payment_intent);
        const got = ctx.api('GET', '/v1/charges/' + c.id);
        ctx.assert(got.status === 200 && got.body.id === c.id, 'charge is retrievable');
        const a = ctx.api('POST', '/v1/charges', { amount: 7500, currency: 'eur', capture: false });
        ctx.assert(a.status === 200, 'authorization returned ' + a.status);
        ctx.assert(a.body.status === 'succeeded' && a.body.paid === true && a.body.captured === false && a.body.amount_captured === 0, 'authorization: ' + JSON.stringify(a.body));
        const low = ctx.api('POST', '/v1/charges', { amount: 10, currency: 'usd' });
        ctx.assert(low.status === 422 && low.body.error.code === 'invalid_amount', 'amount below 50: ' + JSON.stringify(low));
        const unknown = ctx.api('POST', '/v1/charges', { amount: 5000, currency: 'usd', customer: 'cus_9999' });
        ctx.assert(unknown.status === 422 && unknown.body.error.code === 'resource_missing', 'unknown customer: ' + JSON.stringify(unknown));
        const cur = ctx.api('POST', '/v1/charges', { amount: 5000, currency: 'xyz' });
        ctx.assert(cur.status === 400, 'bad currency: ' + cur.status);
        const missing = ctx.api('POST', '/v1/charges', { currency: 'usd' });
        ctx.assert(missing.status === 400, 'missing amount: ' + missing.status);
      }
  create_charge_follows_card_state:
    description: A declined or expired customer gets a failed charge with a failure code, a bank_debit customer gets a pending charge and cannot authorize, and a failed charge cannot be captured or refunded. Skipped for a card state no seeded customer has.
    script: |-
      (ctx) => {
        const find = (s) => {
          const r = ctx.api('GET', '/v1/customers?card_state=' + s + '&limit=1');
          return r.status === 200 && r.body.data.length > 0 ? r.body.data[0] : null;
        };
        const declined = find('declined');
        if (declined !== null) {
          const r = ctx.api('POST', '/v1/charges', { amount: 2500, currency: 'usd', customer: declined.id });
          ctx.assert(r.status === 200, 'declined create returned ' + r.status + ' ' + JSON.stringify(r.body));
          ctx.assert(r.body.status === 'failed' && r.body.paid === false && r.body.captured === false && r.body.amount_captured === 0, 'failed charge: ' + JSON.stringify(r.body));
          ctx.assert(r.body.failure_code === 'card_declined' && typeof r.body.failure_message === 'string', 'failure code: ' + JSON.stringify(r.body));
          const cap = ctx.api('POST', '/v1/charges/' + r.body.id + '/capture', {});
          ctx.assert(cap.status === 409, 'capture of a failed charge: ' + cap.status);
          const ref = ctx.api('POST', '/v1/refunds', { charge: r.body.id });
          ctx.assert(ref.status === 409 && ref.body.error.code === 'charge_not_refundable', 'refund of a failed charge: ' + JSON.stringify(ref));
        }
        const expired = find('expired');
        if (expired !== null) {
          const r = ctx.api('POST', '/v1/charges', { amount: 2500, currency: 'gbp', customer: expired.id });
          ctx.assert(r.status === 200 && r.body.status === 'failed' && r.body.failure_code === 'expired_card', 'expired card: ' + JSON.stringify(r.body));
        }
        const bank = find('bank_debit');
        if (bank !== null) {
          const r = ctx.api('POST', '/v1/charges', { amount: 9900, currency: 'usd', customer: bank.id });
          ctx.assert(r.status === 200 && r.body.status === 'pending' && r.body.paid === false && r.body.captured === false, 'bank debit stays pending: ' + JSON.stringify(r.body));
          const auth = ctx.api('POST', '/v1/charges', { amount: 9900, currency: 'usd', customer: bank.id, capture: false });
          ctx.assert(auth.status === 422 && auth.body.error.code === 'capture_unsupported', 'bank debit authorization: ' + JSON.stringify(auth));
        }
        const valid = find('valid');
        if (valid !== null) {
          const r = ctx.api('POST', '/v1/charges', { amount: 1200, currency: 'usd', customer: valid.id });
          ctx.assert(r.status === 200 && r.body.status === 'succeeded' && r.body.customer === valid.id, 'valid card: ' + JSON.stringify(r.body));
        }
      }
  capture_charge_full_and_partial:
    description: capture_charge captures an authorization in full or in part, refuses a second capture, an out-of-range amount, a captured charge and a missing charge.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/v1/charges', { amount: 8000, currency: 'usd', capture: false }).body;
        const bad0 = ctx.api('POST', '/v1/charges/' + a.id + '/capture', { amount_to_capture: 0 });
        ctx.assert(bad0.status === 422 && bad0.body.error.code === 'invalid_amount', 'capture 0: ' + JSON.stringify(bad0));
        const big = ctx.api('POST', '/v1/charges/' + a.id + '/capture', { amount_to_capture: 8001 });
        ctx.assert(big.status === 422, 'capture above amount: ' + big.status);
        const part = ctx.api('POST', '/v1/charges/' + a.id + '/capture', { amount_to_capture: 3000 });
        ctx.assert(part.status === 200, 'partial capture returned ' + part.status + ' ' + JSON.stringify(part.body));
        ctx.assert(part.body.captured === true && part.body.paid === true && part.body.amount_captured === 3000 && part.body.amount === 8000, 'partial capture: ' + JSON.stringify(part.body));
        const again = ctx.api('POST', '/v1/charges/' + a.id + '/capture', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'charge_already_captured', 'second capture: ' + JSON.stringify(again));
        const b = ctx.api('POST', '/v1/charges', { amount: 4200, currency: 'eur', capture: false }).body;
        const full = ctx.api('POST', '/v1/charges/' + b.id + '/capture', {});
        ctx.assert(full.status === 200 && full.body.captured === true && full.body.amount_captured === 4200, 'full capture: ' + JSON.stringify(full.body));
        const done = ctx.api('POST', '/v1/charges', { amount: 1000, currency: 'usd' }).body;
        const late = ctx.api('POST', '/v1/charges/' + done.id + '/capture', {});
        ctx.assert(late.status === 409, 'capture of a captured charge: ' + late.status);
        const missing = ctx.api('POST', '/v1/charges/ch_9999/capture', {});
        ctx.assert(missing.status === 404, 'capture of a missing charge: ' + missing.status);
        const rel = ctx.api('POST', '/v1/charges', { amount: 3000, currency: 'usd', capture: false }).body;
        ctx.assert(ctx.api('POST', '/v1/refunds', { charge: rel.id }).status === 200, 'release the authorization');
        const afterRelease = ctx.api('POST', '/v1/charges/' + rel.id + '/capture', {});
        ctx.assert(afterRelease.status === 409, 'capture of a released authorization: ' + afterRelease.status);
      }
  create_refund_partial_then_rest:
    description: create_refund starts pending, counts against amount_refunded at once, defaults to the refundable balance, flips refunded on the last refund, and refuses too large amounts, a fully refunded charge and an unknown charge.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/v1/charges', { amount: 5000, currency: 'usd', description: 'Annual plan' }).body;
        const r1 = ctx.api('POST', '/v1/refunds', { charge: c.id, amount: 1000, reason: 'requested_by_customer' });
        ctx.assert(r1.status === 200, 'refund returned ' + r1.status + ' ' + JSON.stringify(r1.body));
        ctx.assert(r1.body.status === 'pending' && r1.body.amount === 1000 && r1.body.currency === 'usd' && r1.body.charge === c.id && r1.body.reason === 'requested_by_customer', 'refund: ' + JSON.stringify(r1.body));
        let ch = ctx.api('GET', '/v1/charges/' + c.id).body;
        ctx.assert(ch.amount_refunded === 1000 && ch.refunded === false, 'charge after partial refund: ' + JSON.stringify(ch));
        const big = ctx.api('POST', '/v1/refunds', { charge: c.id, amount: 4001 });
        ctx.assert(big.status === 422 && big.body.error.code === 'amount_too_large', 'too large: ' + JSON.stringify(big));
        const zero = ctx.api('POST', '/v1/refunds', { charge: c.id, amount: 0 });
        ctx.assert(zero.status === 422, 'zero amount: ' + zero.status);
        const r2 = ctx.api('POST', '/v1/refunds', { charge: c.id, reason: 'duplicate' });
        ctx.assert(r2.status === 200 && r2.body.amount === 4000, 'default amount is the remainder: ' + JSON.stringify(r2.body));
        ch = ctx.api('GET', '/v1/charges/' + c.id).body;
        ctx.assert(ch.amount_refunded === 5000 && ch.refunded === true, 'charge fully refunded: ' + JSON.stringify(ch));
        const more = ctx.api('POST', '/v1/refunds', { charge: c.id });
        ctx.assert(more.status === 409 && more.body.error.code === 'charge_already_refunded', 'refund of a refunded charge: ' + JSON.stringify(more));
        const list = ctx.api('GET', '/v1/refunds?charge=' + c.id).body.data;
        ctx.assert(list.length === 2, 'two refunds on the charge, got ' + list.length);
        const unknown = ctx.api('POST', '/v1/refunds', { charge: 'ch_9999' });
        ctx.assert(unknown.status === 422 && unknown.body.error.code === 'resource_missing', 'unknown charge: ' + JSON.stringify(unknown));
        const reason = ctx.api('POST', '/v1/refunds', { charge: c.id, reason: 'expired_uncaptured_charge' });
        ctx.assert(reason.status === 400, 'reserved reason: ' + reason.status);
        const p = ctx.api('POST', '/v1/charges', { amount: 6000, currency: 'gbp' }).body;
        ctx.api('POST', '/v1/charges/' + p.id + '/capture', {});
        const cap = ctx.api('POST', '/v1/charges', { amount: 6000, currency: 'gbp', capture: false }).body;
        ctx.api('POST', '/v1/charges/' + cap.id + '/capture', { amount_to_capture: 2000 });
        const over = ctx.api('POST', '/v1/refunds', { charge: cap.id, amount: 2500 });
        ctx.assert(over.status === 422, 'refund above the captured amount: ' + over.status);
        const ok = ctx.api('POST', '/v1/refunds', { charge: cap.id });
        ctx.assert(ok.status === 200 && ok.body.amount === 2000, 'default amount is the captured amount: ' + JSON.stringify(ok.body));
        ctx.assert(ctx.api('GET', '/v1/charges/' + cap.id).body.refunded === true, 'partially captured charge is refunded once its captured amount is');
      }
  refund_uncaptured_releases_authorization:
    description: "Refunding an uncaptured charge releases it: the refund is succeeded at once with a receipt number, the charge is refunded with captured false, and a partial amount is refused."
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/v1/charges', { amount: 3500, currency: 'usd', capture: false }).body;
        const part = ctx.api('POST', '/v1/refunds', { charge: a.id, amount: 1000 });
        ctx.assert(part.status === 422 && part.body.error.code === 'invalid_amount', 'partial release: ' + JSON.stringify(part));
        const r = ctx.api('POST', '/v1/refunds', { charge: a.id, reason: 'requested_by_customer' });
        ctx.assert(r.status === 200, 'release returned ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(r.body.status === 'succeeded' && r.body.amount === 3500 && typeof r.body.receipt_number === 'string', 'release refund: ' + JSON.stringify(r.body));
        const ch = ctx.api('GET', '/v1/charges/' + a.id).body;
        ctx.assert(ch.refunded === true && ch.amount_refunded === 3500 && ch.captured === false && ch.amount_captured === 0, 'released charge: ' + JSON.stringify(ch));
        const cancel = ctx.api('POST', '/v1/refunds/' + r.body.id + '/cancel', {});
        ctx.assert(cancel.status === 409 && cancel.body.error.code === 'refund_not_cancelable', 'cancel of a succeeded refund: ' + JSON.stringify(cancel));
      }
  cancel_refund_restores_charge:
    description: cancel_refund cancels a pending refund, gives the amount back to the charge and clears refunded, and refuses a second cancel and a missing refund.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/v1/charges', { amount: 9000, currency: 'usd' }).body;
        const first = ctx.api('POST', '/v1/refunds', { charge: c.id, amount: 2000 }).body;
        const full = ctx.api('POST', '/v1/refunds', { charge: c.id }).body;
        ctx.assert(full.amount === 7000, 'second refund takes the rest: ' + JSON.stringify(full));
        ctx.assert(ctx.api('GET', '/v1/charges/' + c.id).body.refunded === true, 'charge refunded before the cancel');
        const r = ctx.api('POST', '/v1/refunds/' + full.id + '/cancel', {});
        ctx.assert(r.status === 200 && r.body.status === 'canceled', 'cancel: ' + JSON.stringify(r));
        const ch = ctx.api('GET', '/v1/charges/' + c.id).body;
        ctx.assert(ch.amount_refunded === 2000 && ch.refunded === false, 'charge after cancel: ' + JSON.stringify(ch));
        ctx.assert(ctx.api('GET', '/v1/refunds/' + first.id).body.status === 'pending', 'the other refund is untouched');
        const again = ctx.api('POST', '/v1/refunds/' + full.id + '/cancel', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'refund_not_cancelable', 'second cancel: ' + JSON.stringify(again));
        const missing = ctx.api('POST', '/v1/refunds/re_9999/cancel', {});
        ctx.assert(missing.status === 404, 'missing refund: ' + missing.status);
        const retry = ctx.api('POST', '/v1/refunds', { charge: c.id });
        ctx.assert(retry.status === 200 && retry.body.amount === 7000, 'the balance can be refunded again: ' + JSON.stringify(retry));
      }
  settle_refunds_job:
    description: settle_refunds leaves a refund younger than 1 hour pending, then settles it to succeeded with a receipt number, and ignores a canceled refund. For a customer with an expired card, a pending refund fails and is given back to the charge, when the seed has such a charge.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/v1/charges', { amount: 5000, currency: 'usd' }).body;
        const keep = ctx.api('POST', '/v1/refunds', { charge: c.id, amount: 2000 }).body;
        const drop = ctx.api('POST', '/v1/refunds', { charge: c.id, amount: 500 }).body;
        ctx.api('POST', '/v1/refunds/' + drop.id + '/cancel', {});
        ctx.advance('30m');
        ctx.assert(ctx.api('GET', '/v1/refunds/' + keep.id).body.status === 'pending', 'refund younger than 1h stays pending');
        ctx.advance('45m');
        const r = ctx.api('GET', '/v1/refunds/' + keep.id).body;
        ctx.assert(r.status === 'succeeded' && typeof r.receipt_number === 'string' && r.receipt_number.length > 0, 'refund settled: ' + JSON.stringify(r));
        ctx.assert(ctx.api('GET', '/v1/refunds/' + drop.id).body.status === 'canceled', 'canceled refund stays canceled');
        const ch = ctx.api('GET', '/v1/charges/' + c.id).body;
        ctx.assert(ch.amount_refunded === 2000 && ch.refunded === false, 'charge keeps the succeeded refund: ' + JSON.stringify(ch));
        const exp = ctx.api('GET', '/v1/customers?card_state=expired&limit=10').body.data;
        let target = null;
        for (const cu of exp) {
          const cs = ctx.api('GET', '/v1/charges?customer=' + cu.id + '&status=succeeded&captured=true&refunded=false&limit=10').body.data;
          const t = cs.find((x) => x.amount_captured - x.amount_refunded > 0);
          if (t) { target = t; break; }
        }
        if (target === null) return;
        const before = ctx.api('GET', '/v1/charges/' + target.id).body;
        const rf = ctx.api('POST', '/v1/refunds', { charge: target.id });
        ctx.assert(rf.status === 200, 'refund on an expired-card customer charge: ' + JSON.stringify(rf.body));
        ctx.advance('2h');
        const failed = ctx.api('GET', '/v1/refunds/' + rf.body.id).body;
        ctx.assert(failed.status === 'failed' && failed.failure_reason === 'expired_or_canceled_card', 'refund failed: ' + JSON.stringify(failed));
        const after = ctx.api('GET', '/v1/charges/' + target.id).body;
        ctx.assert(after.amount_refunded === before.amount_refunded && after.refunded === false, 'failed refund given back: ' + JSON.stringify(after));
      }
  expire_uncaptured_charges_job:
    description: expire_uncaptured_charges releases an authorization older than 7 days with a succeeded expired_uncaptured_charge refund, and leaves captured charges alone.
    script: |-
      (ctx) => {
        const a = ctx.api('POST', '/v1/charges', { amount: 4400, currency: 'eur', capture: false }).body;
        const k = ctx.api('POST', '/v1/charges', { amount: 1500, currency: 'eur' }).body;
        ctx.advance('100h');
        const young = ctx.api('GET', '/v1/charges/' + a.id).body;
        ctx.assert(young.refunded === false && young.amount_refunded === 0, 'authorization under 7 days stays open: ' + JSON.stringify(young));
        ctx.advance('70h');
        const ch = ctx.api('GET', '/v1/charges/' + a.id).body;
        ctx.assert(ch.refunded === true && ch.amount_refunded === 4400 && ch.captured === false, 'authorization released: ' + JSON.stringify(ch));
        const refunds = ctx.api('GET', '/v1/refunds?charge=' + a.id).body.data;
        ctx.assert(refunds.length === 1, 'one release refund, got ' + refunds.length);
        ctx.assert(refunds[0].reason === 'expired_uncaptured_charge' && refunds[0].status === 'succeeded' && refunds[0].amount === 4400 && refunds[0].currency === 'eur' && typeof refunds[0].receipt_number === 'string', 'release refund: ' + JSON.stringify(refunds[0]));
        const kept = ctx.api('GET', '/v1/charges/' + k.id).body;
        ctx.assert(kept.refunded === false && kept.amount_refunded === 0 && kept.captured === true, 'captured charge untouched: ' + JSON.stringify(kept));
        ctx.assert(ctx.api('GET', '/v1/refunds?charge=' + k.id).body.data.length === 0, 'no refund on the captured charge');
        const late = ctx.api('POST', '/v1/charges/' + a.id + '/capture', {});
        ctx.assert(late.status === 409, 'a released authorization cannot be captured: ' + late.status);
      }
  settle_pending_charges_job:
    description: settle_pending_charges keeps a bank-debit charge pending for 48 hours, then moves it to succeeded, paid and captured. Skipped when the seed has no bank_debit customer.
    script: |-
      (ctx) => {
        const r = ctx.api('GET', '/v1/customers?card_state=bank_debit&limit=1');
        if (r.status !== 200 || r.body.data.length === 0) return;
        const cust = r.body.data[0];
        const c = ctx.api('POST', '/v1/charges', { amount: 15000, currency: 'usd', customer: cust.id }).body;
        ctx.assert(c.status === 'pending', 'bank debit charge starts pending: ' + JSON.stringify(c));
        ctx.advance('47h');
        ctx.assert(ctx.api('GET', '/v1/charges/' + c.id).body.status === 'pending', 'still pending after 47h');
        ctx.advance('2h');
        const s = ctx.api('GET', '/v1/charges/' + c.id).body;
        ctx.assert(s.status === 'succeeded' && s.paid === true && s.captured === true && s.amount_captured === 15000, 'settled after 48h: ' + JSON.stringify(s));
        const pending = ctx.api('GET', '/v1/charges?status=pending&limit=10').body.data;
        ctx.assert(pending.every((p) => ctx.time === undefined || p.id !== c.id), 'settled charge is no longer pending');
      }
tasks:
  capture_pending_authorization:
    difficulty: easy
    instruction: The customer 'Harbor Freight Co' has one uncaptured charge, an authorization made with capture=false that is still open. Find that charge and capture it in full. Change nothing else.
    grader: |-
      (ctx) => {
        const cust = ctx.seed.list('customer', { where: { name: 'Harbor Freight Co' } })[0];
        if (!cust) return 0;
        const targets = ctx.seed.list('charge', { where: { customer: cust.id, status: 'succeeded', captured: false } }).filter((c) => !c.refunded);
        if (targets.length !== 1) return 0;
        const t = targets[0];
        const collateral = ctx.changes().some((c) => !(c.entity === 'charge' && c.id === t.id));
        ctx.guard('only the target charge changed', !collateral);
        const end = ctx.db.get('charge', t.id);
        ctx.goal(0.5, 'the authorization is captured', end.captured === true && end.paid === true);
        ctx.goal(0.5, 'it is captured in full', end.captured === true && end.amount_captured === t.amount);
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const cust = ctx.api('GET', '/v1/customers?q=Harbor+Freight').body.data.find((c) => c.name === 'Harbor Freight Co');
        ctx.assert(cust, 'customer Harbor Freight Co not found');
        const open = ctx.api('GET', '/v1/charges?customer=' + cust.id + '&status=succeeded&captured=false&refunded=false').body.data;
        ctx.assert(open.length === 1, 'expected one open authorization, found ' + open.length);
        const r = ctx.api('POST', '/v1/charges/' + open[0].id + '/capture', {});
        ctx.assert(r.status === 200, 'capture failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: captures only part of the authorization, so the rest is released and amount_captured is below the charge amount
