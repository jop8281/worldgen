            const cust = ctx.api('GET', '/v1/customers?q=Redwood').body.data.find((c) => c.name === 'Redwood Labs');
            const page = ctx.api('GET', '/v1/charges?customer=' + cust.id + '&status=succeeded&captured=true&refunded=false').body.data;
            for (const c of page) {
