      - why: also releases the uncaptured authorizations of the customer, which should stay open
        script: |-
          (ctx) => {
            const cust = ctx.api('GET', '/v1/customers?q=Redwood').body.data.find((c) => c.name === 'Redwood Labs');
            let cursor = null;
            const rows = [];
            do {
