# A small Petstore 3.0 for test/input-openapi.test.ts.
# REDACTION TEST: the token tok_REDACTION_TEST_8f2c4e6a appears below on purpose, in a security
# scheme, an Authorization header example and an api_key example. It must never reach a digest.
openapi: 3.0.3
info:
  title: Swagger Petstore
  version: 1.0.0
  description: |
    A sample pet store with pets and store orders.

    Second paragraph, not shown in the digest.
servers:
  - url: https://petstore.example.com/v1
components:
  securitySchemes:
    api_key:
      type: apiKey
      in: header
      name: X-Api-Key
      x-example: tok_REDACTION_TEST_8f2c4e6a
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Order not found
  schemas:
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        tag:
          type: string
    Pet:
      allOf:
        - $ref: '#/components/schemas/NewPet'
        - type: object
          required: [id]
          properties:
            id:
              type: integer
              format: int64
    Order:
      type: object
      required: [pet_id, quantity]
      properties:
        id:
          type: integer
          format: int64
        pet_id:
          type: integer
          format: int64
        quantity:
          type: integer
        ship_date:
          type: string
          format: date-time
        status:
          type: string
          enum: [placed, approved, delivered]
        complete:
          type: boolean
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
paths:
  /pets:
    get:
      summary: List all pets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: Authorization
          in: header
          example: Bearer tok_REDACTION_TEST_8f2c4e6a
          schema:
            type: string
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
              example:
                id: 7
                name: Rex
                tag: dog
                api_key: tok_REDACTION_TEST_8f2c4e6a
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /store/inventory:
    get:
      summary: Returns pet inventories by status
      responses:
        '200':
          description: Counts by status
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
  /store/orders:
    post:
      summary: Place an order for a pet
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: The placed order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                placed:
                  value:
                    id: 10
                    pet_id: 7
                    quantity: 1
                    ship_date: '2026-03-02T09:00:00Z'
                    status: placed
                    complete: false
        '400':
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /store/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      summary: Find purchase order by ID
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete purchase order by ID
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
