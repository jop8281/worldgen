        const dead = post('/plans', { name: 'Legacy Test', code: 'legacy_test_ref', amount: 1500, interval: 'month', active: false });
        const before = ctx.api('GET', '/subscriptions').body.data.length;
        const unknownCus = ctx.api('POST', '/subscriptions', { customer_id: 'cus_9999', plan_id: plan.id });
        ctx.assert(unknownCus.status === 400 && unknownCus.body.error.code === 'input.invalid', 'unknown customer, got ' + JSON.stringify(unknownCus));
        const unknownPlan = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: 'pln_9999' });
        ctx.assert(unknownPlan.status === 400 && unknownPlan.body.error.code === 'input.invalid', 'unknown plan, got ' + JSON.stringify(unknownPlan));
        const noCard = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id });
        ctx.assert(noCard.status === 409 && noCard.body.error.code === 'no_payment_method', 'no card, got ' + JSON.stringify(noCard));
        const pm = post('/payment_methods', { customer_id: cus.id, brand: 'visa', last4: '4242', exp_month: 12, exp_year: 2030, token: 'tok_visa' });
        const foreign = post('/payment_methods', { customer_id: other.id, brand: 'visa', last4: '1111', exp_month: 12, exp_year: 2030, token: 'tok_visa' });
        const mism = ctx.api('POST', '/customers/' + cus.id + '/default_payment_method', { payment_method_id: foreign.id });
        ctx.assert(mism.status === 409 && mism.body.error.code === 'payment_method_mismatch', 'foreign card, got ' + JSON.stringify(mism));
        const noCus = ctx.api('POST', '/customers/cus_9999/default_payment_method', { payment_method_id: pm.id });
        ctx.assert(noCus.status === 404 && noCus.body.error.code === 'not_found', 'unknown customer path, got ' + JSON.stringify(noCus));
        post('/customers/' + cus.id + '/default_payment_method', { payment_method_id: pm.id });
        const inactive = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: dead.id });
        ctx.assert(inactive.status === 409 && inactive.body.error.code === 'plan_inactive', 'inactive plan, got ' + JSON.stringify(inactive));
        ctx.assert(ctx.api('GET', '/subscriptions').body.data.length === before, 'refused calls created nothing');
        const ok = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id });
        ctx.assert(ok.status === 201 && ok.body.status === 'active', 'subscribe works once a card exists, got ' + JSON.stringify(ok));
        const dup = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id });
        ctx.assert(dup.status === 409 && dup.body.error.code === 'duplicate_subscription', 'duplicate, got ' + JSON.stringify(dup));
      }
tasks:
  cancel_harbor_dental_subscription:
    difficulty: easy
    instruction: The customer Harbor Dental has asked to cancel their subscription. Cancel it now. Another customer has a very similar name, so leave that account alone.
    grader: |-
      (ctx) => {
        const cus = ctx.seed.list('customer', { where: { name: 'Harbor Dental' } })[0];
        if (!cus) return 0;
        const target = ctx.seed.list('subscription', { where: { customer_id: cus.id } }).find((s) => s.status === 'active');
        if (!target) return 0;
        const openInvoices = ctx.seed.list('invoice', { where: { subscription_id: target.id, status: 'open' } });
        const events = ctx.db.list('billing_event', { where: { subscription_id: target.id } }).filter((e) => ctx.seed.get('billing_event', e.id) === null);
        ctx.guardChanges('only the target subscription, its open invoices and its new events changed', [
          { entity: 'subscription', id: target.id, kind: 'updated', fields: ['status', 'canceled_at', 'cancel_reason'] },
          ...openInvoices.map((i) => ({ entity: 'invoice', id: i.id, kind: 'updated', fields: ['status', 'next_retry_at'] })),
          ...events.map((e) => ({ entity: 'billing_event', id: e.id, kind: 'created', fields: ['subscription_id', 'invoice_id', 'kind', 'note'] })),
        ]);
        const end = ctx.db.get('subscription', target.id);
        return end.status === 'canceled' && end.cancel_reason === 'requested' && end.canceled_at !== null ? 1 : 0;
      }
    solution: |-
      (ctx) => {
        const hits = ctx.api('GET', '/customers?q=Harbor').body.data;
        const cus = hits.find((c) => c.name === 'Harbor Dental');
        ctx.assert(cus, 'customer Harbor Dental not found');
        const subs = ctx.api('GET', '/subscriptions?customer_id=' + cus.id + '&status=active').body.data;
        ctx.assert(subs.length === 1, 'expected one active subscription, found ' + subs.length);
        const r = ctx.api('POST', '/subscriptions/' + subs[0].id + '/cancel', {});
        ctx.assert(r.status === 200, 'cancel failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: cancels the subscription of the similarly named customer Harbor Dentistry instead of Harbor Dental
        script: |-
          (ctx) => {
            const hits = ctx.api('GET', '/customers?q=Harbor').body.data;
            const cus = hits.find((c) => c.name === 'Harbor Dentistry');
            const subs = ctx.api('GET', '/subscriptions?customer_id=' + cus.id + '&status=active').body.data;
            ctx.api('POST', '/subscriptions/' + subs[0].id + '/cancel', {});
          }
      - why: cancels the subscriptions of every customer whose name starts with Harbor, so the look-alike account is cancelled too
        script: |-
          (ctx) => {
            const hits = ctx.api('GET', '/customers?q=Harbor').body.data.filter((c) => c.name === 'Harbor Dental' || c.name === 'Harbor Dentistry');
            for (const c of hits) {
              const subs = ctx.api('GET', '/subscriptions?customer_id=' + c.id + '&status=active').body.data;
              for (const s of subs) ctx.api('POST', '/subscriptions/' + s.id + '/cancel', {});
            }
          }
  recover_bluefin_labs_with_backup_card:
    difficulty: medium
    instruction: Bluefin Labs' subscription is past due because its default card keeps getting declined. They already have a backup card ending in 4444 on file. Make that card the customer's default payment method, then collect their open invoice now using it. Do not add new cards or cancel anything.
    grader: |-
      (ctx) => {
        const cus = ctx.seed.list('customer', { where: { name: 'Bluefin Labs' } })[0];
        if (!cus) return 0;
        const backup = ctx.seed.list('payment_method', { where: { customer_id: cus.id } }).find((p) => p.last4 === '4444');
        const sub = ctx.seed.list('subscription', { where: { customer_id: cus.id, status: 'past_due' } })[0];
        if (!backup || !sub) return 0;
        const inv = ctx.seed.list('invoice', { where: { subscription_id: sub.id, status: 'open' } })[0];
        if (!inv) return 0;
        const pays = ctx.db.list('payment', { where: { invoice_id: inv.id } }).filter((p) => ctx.seed.get('payment', p.id) === null);
        const events = ctx.db.list('billing_event', { where: { subscription_id: sub.id } }).filter((e) => ctx.seed.get('billing_event', e.id) === null);
        ctx.guardChanges('only the default card, the invoice, the subscription status and their new payments and events changed', [
          { entity: 'customer', id: cus.id, kind: 'updated', fields: ['default_payment_method_id'] },
          { entity: 'invoice', id: inv.id, kind: 'updated', fields: ['status', 'paid_at', 'next_retry_at'] },
          { entity: 'subscription', id: sub.id, kind: 'updated', fields: ['status'] },
          ...pays.map((p) => ({ entity: 'payment', id: p.id, kind: 'created', fields: ['invoice_id', 'payment_method_id', 'amount', 'status', 'failure_code', 'kind'] })),
          ...events.map((e) => ({ entity: 'billing_event', id: e.id, kind: 'created', fields: ['subscription_id', 'invoice_id', 'kind', 'note'] })),
        ]);
        ctx.guard('no failed charge was attempted', pays.every((p) => p.status === 'succeeded'));
        const trace = ctx.trace();
        const firstPay = trace.find((c) => c.routeId === 'pay_invoice');
        const firstSet = trace.find((c) => c.routeId === 'set_default_payment_method');
        ctx.guard('the default card was switched before the invoice was collected', !firstPay || (firstSet !== undefined && firstSet.seq < firstPay.seq));
        const cEnd = ctx.db.get('customer', cus.id);
        const iEnd = ctx.db.get('invoice', inv.id);
        const sEnd = ctx.db.get('subscription', sub.id);
        ctx.guard('manual payment did not change the dunning attempt count', iEnd.attempt_count === inv.attempt_count);
        ctx.goal(0.3, 'the 4444 card is the default', cEnd.default_payment_method_id === backup.id);
        ctx.goal(0.4, 'the invoice is paid by a succeeded payment on the 4444 card', iEnd.status === 'paid' && pays.some((p) => p.status === 'succeeded' && p.payment_method_id === backup.id));
        ctx.goal(0.3, 'the subscription is active again', sEnd.status === 'active');
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const cus = ctx.api('GET', '/customers?q=Bluefin').body.data.find((c) => c.name === 'Bluefin Labs');
        ctx.assert(cus, 'customer Bluefin Labs not found');
        const cards = ctx.api('GET', '/customers/' + cus.id + '/payment_methods').body.data;
        const backup = cards.find((p) => p.last4 === '4444' && p.active);
        ctx.assert(backup, 'no active card ending 4444');
        const invs = ctx.api('GET', '/invoices?customer_id=' + cus.id + '&status=open').body.data;
        ctx.assert(invs.length === 1, 'expected one open invoice, found ' + invs.length);
        const d = ctx.api('POST', '/customers/' + cus.id + '/default_payment_method', { payment_method_id: backup.id });
        ctx.assert(d.status === 200, 'set default failed: ' + JSON.stringify(d.body));
        const p = ctx.api('POST', '/invoices/' + invs[0].id + '/pay', {});
        ctx.assert(p.status === 200 && p.body.status === 'succeeded', 'pay failed: ' + JSON.stringify(p.body));
      }
    decoys:
      - why: collects the invoice first with the old default card, which is declined, and only then switches the default card and pays again
        script: |-
          (ctx) => {
            const cus = ctx.api('GET', '/customers?q=Bluefin').body.data.find((c) => c.name === 'Bluefin Labs');
            const cards = ctx.api('GET', '/customers/' + cus.id + '/payment_methods').body.data;
            const backup = cards.find((p) => p.last4 === '4444');
            const inv = ctx.api('GET', '/invoices?customer_id=' + cus.id + '&status=open').body.data[0];
            ctx.api('POST', '/invoices/' + inv.id + '/pay', {});
            ctx.api('POST', '/customers/' + cus.id + '/default_payment_method', { payment_method_id: backup.id });
            ctx.api('POST', '/invoices/' + inv.id + '/pay', {});
          }
      - why: switches the default card but never collects the invoice, waiting for a retry job that agents cannot trigger
        script: |-
          (ctx) => {
            const cus = ctx.api('GET', '/customers?q=Bluefin').body.data.find((c) => c.name === 'Bluefin Labs');
            const cards = ctx.api('GET', '/customers/' + cus.id + '/payment_methods').body.data;
            const backup = cards.find((p) => p.last4 === '4444');
            ctx.api('POST', '/customers/' + cus.id + '/default_payment_method', { payment_method_id: backup.id });
          }
      - why: pays the invoice with the 4444 card by naming it, but never makes it the default card
        script: |-
          (ctx) => {
            const cus = ctx.api('GET', '/customers?q=Bluefin').body.data.find((c) => c.name === 'Bluefin Labs');
            const cards = ctx.api('GET', '/customers/' + cus.id + '/payment_methods').body.data;
            const backup = cards.find((p) => p.last4 === '4444');
            const inv = ctx.api('GET', '/invoices?customer_id=' + cus.id + '&status=open').body.data[0];
            ctx.api('POST', '/invoices/' + inv.id + '/pay', { payment_method_id: backup.id });
          }
      - why: attaches a brand new tok_visa card instead of using the backup card already on file, then makes it default and pays
        script: |-
          (ctx) => {
            const cus = ctx.api('GET', '/customers?q=Bluefin').body.data.find((c) => c.name === 'Bluefin Labs');
            const fresh = ctx.api('POST', '/payment_methods', { customer_id: cus.id, brand: 'visa', last4: '4242', exp_month: 12, exp_year: 2030, token: 'tok_visa' }).body;
            const inv = ctx.api('GET', '/invoices?customer_id=' + cus.id + '&status=open').body.data[0];
            ctx.api('POST', '/customers/' + cus.id + '/default_payment_method', { payment_method_id: fresh.id });
            ctx.api('POST', '/invoices/' + inv.id + '/pay', {});
          }
  cancel_final_retry_business_subscriptions:
    difficulty: hard
    instruction: Finance wants to stop dunning for the biggest accounts about to take their last retry. Cancel every subscription on the Business plan that is past due and whose open invoice is on its third charge attempt, so only the 7-day retry is left. Leave every other subscription alone, including other past due ones. Change nothing else.
    grader: |-
      (ctx) => {
        const plan = ctx.seed.list('plan', { where: { code: 'business_monthly' } })[0];
        if (!plan) return 0;
        const openInvoices = (s) => ctx.seed.list('invoice', { where: { subscription_id: s.id, status: 'open' } });
        const targets = ctx.seed.list('subscription', { where: { status: 'past_due', plan_id: plan.id } })
          .filter((s) => openInvoices(s).some((i) => i.attempt_count === 3));
        if (targets.length === 0) return 0;
        const allowed = [];
        for (const s of targets) {
          allowed.push({ entity: 'subscription', id: s.id, kind: 'updated', fields: ['status', 'canceled_at', 'cancel_reason'] });
          for (const i of openInvoices(s)) allowed.push({ entity: 'invoice', id: i.id, kind: 'updated', fields: ['status', 'next_retry_at'] });
          const events = ctx.db.list('billing_event', { where: { subscription_id: s.id } }).filter((e) => ctx.seed.get('billing_event', e.id) === null);
          for (const e of events) allowed.push({ entity: 'billing_event', id: e.id, kind: 'created', fields: ['subscription_id', 'invoice_id', 'kind', 'note'] });
        }
        ctx.guardChanges('only the target subscriptions, their open invoices and their new events changed', allowed);
        let done = 0;
        for (const s of targets) {
          const end = ctx.db.get('subscription', s.id);
          const voided = openInvoices(s).every((i) => ctx.db.get('invoice', i.id).status === 'void');
          if (end.status === 'canceled' && end.cancel_reason === 'requested' && voided) done += 1;
        }
        return done / targets.length;
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const sep = path.indexOf('?') >= 0 ? '&' : '?';
            const r = ctx.api('GET', path + (cursor === null ? '' : sep + 'cursor=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor || null;
          } while (cursor !== null);
          return rows;
        };
        const plan = pages('/plans').find((p) => p.code === 'business_monthly');
        ctx.assert(plan, 'Business plan not found');
        const subs = pages('/subscriptions?status=past_due&plan_id=' + plan.id);
        const targets = subs.filter((s) => pages('/subscriptions/' + s.id + '/invoices?status=open').some((i) => i.attempt_count === 3));
        ctx.assert(targets.length > 0, 'no Business subscriptions on their third attempt found');
        for (const s of targets) {
          const r = ctx.api('POST', '/subscriptions/' + s.id + '/cancel', {});
          ctx.assert(r.status === 200, 'cancel ' + s.id + ' failed: ' + JSON.stringify(r.body));
        }
      }
    decoys:
      - why: reads only the first page of past due subscriptions, so it misses the Business subscriptions on page 2
        script: |-
          (ctx) => {
            const plans = ctx.api('GET', '/plans').body.data;
            const plan = plans.find((p) => p.code === 'business_monthly');
            const page = ctx.api('GET', '/subscriptions?status=past_due').body.data;
            for (const s of page) {
              if (s.plan_id !== plan.id) continue;
              const invs = ctx.api('GET', '/subscriptions/' + s.id + '/invoices?status=open').body.data;
              if (invs.some((i) => i.attempt_count === 3)) ctx.api('POST', '/subscriptions/' + s.id + '/cancel', {});
            }
          }
      - why: cancels every past due Business subscription regardless of which attempt its invoice is on
        script: |-
          (ctx) => {
            const plans = ctx.api('GET', '/plans').body.data;
            const plan = plans.find((p) => p.code === 'business_monthly');
            let cursor = null;
            const ids = [];
            do {
              const r = ctx.api('GET', '/subscriptions?status=past_due&plan_id=' + plan.id + (cursor === null ? '' : '&cursor=' + cursor));
              for (const s of r.body.data) ids.push(s.id);
              cursor = r.body.next_cursor || null;
            } while (cursor !== null);
            for (const id of ids) ctx.api('POST', '/subscriptions/' + id + '/cancel', {});
          }
      - why: cancels every subscription whose open invoice is on its third attempt regardless of plan
        script: |-
          (ctx) => {
            let cursor = null;
            const ids = [];
            do {
              const r = ctx.api('GET', '/invoices?status=open&attempt_count=3' + (cursor === null ? '' : '&cursor=' + cursor));
              for (const i of r.body.data) ids.push(i.subscription_id);
              cursor = r.body.next_cursor || null;
            } while (cursor !== null);
            for (const id of ids) ctx.api('POST', '/subscriptions/' + id + '/cancel', {});
          }
      - why: tries to collect the target invoices by paying them instead of cancelling the subscriptions
        script: |-
          (ctx) => {
            const plans = ctx.api('GET', '/plans').body.data;
            const plan = plans.find((p) => p.code === 'business_monthly');
            const subs = ctx.api('GET', '/subscriptions?status=past_due&plan_id=' + plan.id).body.data;
            for (const s of subs) {
              const invs = ctx.api('GET', '/subscriptions/' + s.id + '/invoices?status=open').body.data;
              for (const i of invs) {
                if (i.attempt_count === 3) ctx.api('POST', '/invoices/' + i.id + '/pay', {});
              }
            }
          }
      - why: cancels every correct target and then also cancels one Business subscription that is still at an earlier dunning stage
        script: |-
          (ctx) => {
            const plans = ctx.api('GET', '/plans').body.data;
            const plan = plans.find((p) => p.code === 'business_monthly');
            const subs = ctx.api('GET', '/subscriptions?status=past_due&plan_id=' + plan.id).body.data;
            let extra = null;
            for (const s of subs) {
              const invs = ctx.api('GET', '/subscriptions/' + s.id + '/invoices?status=open').body.data;
              if (invs.some((i) => i.attempt_count === 3)) ctx.api('POST', '/subscriptions/' + s.id + '/cancel', {});
              else if (extra === null) extra = s;
            }
            ctx.api('POST', '/subscriptions/' + extra.id + '/cancel', {});
          }
