format: 1
meta:
  name: world
  description: "A subscription billing system. Customers hold card payment methods and subscribe to plans. Each billing period produces an invoice that is charged to the customer's default card. A failed charge puts the subscription in past_due and starts dunning. The invoice is retried 1, 3 and 7 days after the first failure. If the 7-day retry also fails, the invoice becomes uncollectible and the subscription is cancelled. Agents can subscribe customers, switch their default card, collect invoices manually, change plans and cancel subscriptions. Hourly jobs renew subscriptions and run the dunning retries. Card outcomes are deterministic: each payment method carries a test token that decides whether charges succeed or how they fail."
  resembles: Stripe Billing-style subscription billing (customers, plans, subscriptions, invoices, card payments, and smart-retry dunning)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 0s
  api:
    list:
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
    error:
      error:
        code: $code
        message: $message
entities:
  plan:
    description: A priced subscription offering billed every month (30 days) or year (365 days) in USD. Inactive plans cannot take new subscriptions or plan changes.
    idPrefix: pln
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      code:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 60
      amount:
        type: money
        description: Price per billing period in USD cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      interval:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - month
          - year
      active:
        type: bool
        description: Inactive plans refuse new subscriptions and plan changes.
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  customer:
    description: A billing account holder. default_payment_method_id is the card charged for every invoice and is changed only by the set_default_payment_method action.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      default_payment_method_id:
        type: ref
        description: The card charged for invoices. Null when no default is set.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: payment_method
        onDelete: nullify
  payment_method:
    description: "A card on file for a customer. The token is a deterministic test token: tok_visa always succeeds, tok_chargeDeclined fails with card_declined, tok_insufficient_funds fails with insufficient_funds, tok_expired_card fails with expired_card."
    idPrefix: pm
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      brand:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - visa
          - mastercard
          - amex
          - discover
      last4:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 4
        pattern: ^[0-9]{4}$
      exp_month:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 12
      exp_year:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 2000
        max: 2100
      token:
        type: enum
        description: Test token deciding how charges on this card end.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - tok_visa
          - tok_chargeDeclined
          - tok_insufficient_funds
          - tok_expired_card
      active:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  subscription:
    description: A customer's recurring purchase of a plan. Lifecycle active, past_due, canceled. Holds the current billing period. Changed only by actions and jobs.
    idPrefix: sub
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: customer
        onDelete: restrict
      plan_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: plan
        onDelete: restrict
      status:
        type: state
        description: active, past_due while dunning runs, canceled is final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - active
          - past_due
          - canceled
        initial: active
        transitions:
          active:
            - past_due
            - canceled
          past_due:
            - active
            - canceled
          canceled: []
      current_period_start:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
      current_period_end:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
      canceled_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      cancel_reason:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - requested
          - dunning_exhausted
  invoice:
    description: "A charge for one billing period. Also holds the dunning state: attempt_count, dunning_started_at, next_retry_at and last_failure_code. Status open, paid, void or uncollectible."
    idPrefix: inv
    fields:
      number:
        type: string
        description: INV-<seq>.
        required: true
        nullable: false
        unique: true
        readonly: true
        maxLength: 40
      subscription_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: subscription
        onDelete: restrict
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: customer
        onDelete: restrict
      amount_due:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - open
          - paid
          - void
          - uncollectible
        initial: open
        transitions:
          open:
            - paid
            - void
            - uncollectible
          paid: []
          void: []
          uncollectible: []
      period_start:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
      period_end:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
      attempt_count:
        type: int
        description: Charge attempts made by the invoice flow (initial or renewal, then retries). Manual payments never change it.
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        max: 4
        default: 0
      dunning_started_at:
        type: datetime
        description: Time of the first failed charge.
        required: false
        nullable: true
        unique: false
        readonly: true
      next_retry_at:
        type: datetime
        description: When the next dunning retry is due. Null when none is scheduled.
        required: false
        nullable: true
        unique: false
        readonly: true
      last_failure_code:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - card_declined
          - insufficient_funds
          - expired_card
          - no_payment_method
      paid_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
  payment:
    description: One card charge attempt against an invoice, successful or failed. Failed attempts are kept as history.
    idPrefix: pay
    fields:
      invoice_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: invoice
        onDelete: restrict
      payment_method_id:
        type: ref
        description: The card charged. Null when no card was available.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: payment_method
        onDelete: nullify
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      status:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - succeeded
          - failed
      failure_code:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - card_declined
          - insufficient_funds
          - expired_card
          - no_payment_method
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - initial
          - renewal
          - retry
          - manual
  billing_event:
    description: Append-only audit trail for a subscription. Written by actions and jobs.
    idPrefix: bev
    fields:
      subscription_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: subscription
        onDelete: restrict
      invoice_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: invoice
        onDelete: nullify
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - created
          - renewed
          - payment_failed
          - payment_succeeded
          - retry_scheduled
          - past_due
          - reactivated
          - plan_changed
          - canceled
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
