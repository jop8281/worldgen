format: 1
meta:
  name: helpdesk
  description: A customer-support helpdesk with SLA tiers and on-call escalation.
    Customers file tickets, agents work them through a fixed lifecycle, and
    urgent work escalates to the on-call agent.
  resembles: Zendesk Support tickets API
  source: hand
  seed: 1337
  clock:
    start: 2026-03-02T09:00:00.000Z
    tick: 1s
  api:
    list:
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A company that files tickets. Zendesk calls them end users
      (requesters). The tier picks the SLA policy.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        maxLength: 120
      tier:
        type: enum
        values:
          - standard
          - premium
          - enterprise
        required: true
      email:
        type: string
        format: email
        nullable: true
        unique: true
  agent:
    description: A support agent who works tickets and takes on-call shifts. tier2
      staffs on-call level 1, sre staffs level 2.
    idPrefix: agt
    fields:
      name:
        type: string
        required: true
        maxLength: 120
      email:
        type: string
        format: email
        required: true
        unique: true
      team:
        type: enum
        values:
          - tier1
          - tier2
          - sre
        required: true
      active:
        type: bool
        required: true
        default: true
  sla_policy:
    description: Resolution target in minutes for one (customer tier, ticket
      priority) pair. code is <tier>_<priority> and stands in for a composite
      unique key.
    idPrefix: sla
    fields:
      code:
        type: string
        required: true
        unique: true
        maxLength: 40
      tier:
        type: enum
        values:
          - standard
          - premium
          - enterprise
        required: true
      priority:
        type: enum
        values:
          - low
          - normal
          - high
          - urgent
        required: true
      resolution_minutes:
        type: int
        required: true
        min: 5
  oncall_shift:
    description: A half-open window [starts_at, ends_at) in which one agent is on
      call at an escalation level.
    idPrefix: onc
    fields:
      agent_id:
        type: ref
        entity: agent
        required: true
        onDelete: restrict
      level:
        type: int
        required: true
        min: 1
        max: 2
        description: 1 is first responder (tier2), 2 is the backup (sre).
      starts_at:
        type: datetime
        required: true
      ends_at:
        type: datetime
        required: true
  ticket:
    description: A support request from a customer, worked by an agent through the
      status lifecycle. The SLA clock starts at creation.
    idPrefix: tkt
    fields:
      subject:
        type: string
        required: true
        maxLength: 200
      description:
        type: text
        nullable: true
      customer_id:
        type: ref
        entity: customer
        required: true
        onDelete: restrict
      assignee_id:
        type: ref
        entity: agent
        nullable: true
        readonly: true
        onDelete: nullify
        description: Set by the assign and escalate actions.
      priority:
        type: enum
        values:
          - low
          - normal
          - high
          - urgent
        required: true
      status:
        type: state
        description: Lifecycle. Any declared move is a plain PATCH. No de-escalation.
          closed is final.
        states:
          - new
          - open
          - pending
          - escalated
          - resolved
          - closed
        initial: new
        transitions:
          new:
            - open
            - escalated
          open:
            - pending
            - escalated
            - resolved
          pending:
            - open
            - escalated
            - resolved
          escalated:
            - resolved
          resolved:
            - open
            - closed
          closed: []
      escalation_level:
        type: int
        required: true
        default: 0
        min: 0
        max: 2
        readonly: true
      escalated_at:
        type: datetime
        nullable: true
        readonly: true
      sla_started_at:
        type: datetime
        required: true
        default: now
        readonly: true
        description: Creation or last reopen.
      sla_due_at:
        type: datetime
        nullable: true
        readonly: true
        description: Resolution deadline, sla_started_at plus the policy target. Set by
          the workflow, never by a client.
      sla_breached:
        type: bool
        required: true
        default: false
        readonly: true
      resolved_at:
        type: datetime
        nullable: true
        readonly: true
  ticket_comment:
    description: A message on a ticket. Public comments reach the customer, private
      ones are internal notes.
    idPrefix: cmt
    fields:
      ticket_id:
        type: ref
        entity: ticket
        required: true
        onDelete: cascade
      author_id:
        type: ref
        entity: agent
        nullable: true
        onDelete: nullify
        description: The agent who wrote it. null means the customer did.
      body:
        type: text
        required: true
      public:
        type: bool
        required: true
        default: true
  ticket_event:
    description: Append-only audit trail of what happened to a ticket. Written by
      actions and jobs.
    idPrefix: evt
    fields:
      ticket_id:
        type: ref
        entity: ticket
        required: true
        onDelete: restrict
      kind:
        type: enum
        values:
          - created
          - assigned
          - escalated
          - sla_breach
          - priority_changed
          - resolved
          - reopened
          - closed
        required: true
      note:
        type: text
        nullable: true
      actor_id:
        type: ref
        entity: agent
        nullable: true
        onDelete: nullify
routes:
  list_tickets:
    op: list
    method: GET
    path: /tickets
    entity: ticket
    filters:
      - status
      - priority
      - customer_id
      - assignee_id
      - sla_breached
      - escalation_level
    search:
      - subject
    sort:
      - created_at
      - sla_due_at
    pageSize: 25
  get_ticket:
    op: get
    method: GET
    path: /tickets/{id}
    entity: ticket
  create_ticket:
    op: create
    method: POST
    path: /tickets
    entity: ticket
  update_ticket:
    op: update
    method: PATCH
    path: /tickets/{id}
    entity: ticket
  list_ticket_events:
    op: list
    method: GET
    path: /tickets/{ticket_id}/events
    entity: ticket_event
    sort:
      - created_at
  list_ticket_comments:
    op: list
    method: GET
    path: /tickets/{ticket_id}/comments
    entity: ticket_comment
    sort:
      - created_at
  list_customers:
    op: list
    method: GET
    path: /customers
    entity: customer
    filters:
      - tier
    search:
      - name
    sort:
      - name
  get_customer:
    op: get
    method: GET
    path: /customers/{id}
    entity: customer
  create_customer:
    op: create
    method: POST
    path: /customers
    entity: customer
  update_customer:
    op: update
    method: PATCH
    path: /customers/{id}
    entity: customer
  list_agents:
    op: list
    method: GET
    path: /agents
    entity: agent
    filters:
      - team
      - active
    search:
      - name
      - email
  list_oncall:
    op: list
    method: GET
    path: /oncall
    entity: oncall_shift
    filters:
      - level
      - agent_id
    sort:
      - starts_at
  list_sla_policies:
    op: list
    method: GET
    path: /sla_policies
    entity: sla_policy
    filters:
      - tier
      - priority
actions:
  assign_ticket:
    method: POST
    path: /tickets/{id}/assign
    description: Assign a new, open or pending ticket to an active agent. A new
      ticket moves to open.
    input:
      agent_id:
        type: ref
        entity: agent
        required: true
        description: The agent who will work the ticket. Must be active.
    handler: >
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status === 'escalated') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is escalated and belongs to the on-call agent ' + t.assignee_id + '. Resolve it instead of reassigning.');
        if (t.status !== 'new' && t.status !== 'open' && t.status !== 'pending') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only new, open and pending tickets can be assigned.');
        const agent = ctx.db.get('agent', ctx.body.agent_id);
        if (agent === null) ctx.fail(422, 'unknown_agent', 'agent ' + ctx.body.agent_id + ' not found. List agents with GET /agents.');
        if (!agent.active) ctx.fail(409, 'agent_inactive', 'agent ' + agent.id + ' (' + agent.name + ') is inactive. Pick an active agent.');
        if (t.assignee_id === agent.id) ctx.fail(409, 'no_change', 'ticket ' + id + ' is already assigned to ' + agent.id + '.');
        const patch = t.status === 'new' ? { assignee_id: agent.id, status: 'open' } : { assignee_id: agent.id };
        const updated = ctx.db.update('ticket', id, patch);
        ctx.db.create('ticket_event', { ticket_id: id, kind: 'assigned', note: 'assigned to ' + agent.name, actor_id: null });
        return { status: 200, body: updated };
      }
  escalate_ticket:
    method: POST
    path: /tickets/{id}/escalate
    description: Escalate a new, open or pending ticket to level 1 and reassign it
      to the agent on call at level 1 right now. Level 2 is reached only by the
      escalation_timeout job.
    input:
      reason:
        type: text
        required: true
        description: Why the ticket needs on-call attention. Stored on the escalated event.
    handler: >
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status === 'escalated') ctx.fail(409, 'already_escalated', 'ticket ' + id + ' is already escalated (level ' + t.escalation_level + ', on-call agent ' + t.assignee_id + '). Resolve it when the incident is over.');
        if (t.status !== 'new' && t.status !== 'open' && t.status !== 'pending') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only new, open and pending tickets can be escalated.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for escalate_ticket: reason expected a non-blank text, found ""');
        const now = ctx.now();
        const shift = ctx.db.list('oncall_shift', { where: { level: 1 } })
          .find((s) => ctx.time.minutesBetween(s.starts_at, now) >= 0 && ctx.time.minutesBetween(now, s.ends_at) > 0);
        if (!shift) ctx.fail(409, 'no_oncall', 'no level 1 on-call shift covers ' + now + '. Check GET /oncall?level=1.');
        const updated = ctx.db.update('ticket', id, { status: 'escalated', escalation_level: 1, escalated_at: now, assignee_id: shift.agent_id });
        ctx.db.create('ticket_event', { ticket_id: id, kind: 'escalated', note: reason, actor_id: null });
        return { status: 200, body: updated };
      }
  resolve_ticket:
    method: POST
    path: /tickets/{id}/resolve
    description: Resolve an open, pending or escalated ticket. Sets resolved_at and
      stops the SLA clock. The escalation level is kept for history.
    input:
      note:
        type: text
        nullable: true
        description: Optional resolution note, stored on the resolved event.
    handler: >
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status === 'new') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is new. Assign it before resolving.');
        if (t.status !== 'open' && t.status !== 'pending' && t.status !== 'escalated') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is already ' + t.status + '. Only open, pending and escalated tickets can be resolved.');
        const now = ctx.now();
        const updated = ctx.db.update('ticket', id, { status: 'resolved', resolved_at: now });
        const note = ctx.body.note === undefined ? null : ctx.body.note;
        ctx.db.create('ticket_event', { ticket_id: id, kind: 'resolved', note, actor_id: t.assignee_id });
        return { status: 200, body: updated };
      }
  reopen_ticket:
    method: POST
    path: /tickets/{id}/reopen
    description: Reopen a resolved ticket. It goes back to open with its assignee,
      level 0, and a fresh SLA clock from the customer's tier policy. Closed
      tickets cannot be reopened.
    input:
      reason:
        type: text
        required: true
        description: Why the ticket is reopened. Stored on the reopened event.
    handler: >
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status === 'closed') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is closed, and closed tickets cannot be reopened. Create a follow-up ticket instead.');
        if (t.status !== 'resolved') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only resolved tickets can be reopened.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for reopen_ticket: reason expected a non-blank text, found ""');
        const customer = ctx.db.get('customer', t.customer_id);
        const code = customer.tier + '_' + t.priority;
        const policy = ctx.db.list('sla_policy', { where: { code } })[0];
        if (!policy) ctx.fail(409, 'no_sla_policy', 'no sla_policy ' + code + ' to restart the SLA clock');
        const now = ctx.now();
        const updated = ctx.db.update('ticket', id, {
          status: 'open', resolved_at: null, escalation_level: 0, escalated_at: null,
          sla_started_at: now, sla_due_at: ctx.time.plus(now, policy.resolution_minutes + 'm'), sla_breached: false,
        });
        ctx.db.create('ticket_event', { ticket_id: id, kind: 'reopened', note: reason, actor_id: null });
        return { status: 200, body: updated };
      }
jobs:
  sla_breach:
    description: Every 15 minutes. Pass 1 applies the tier policy to active tickets
      created without a due time. Pass 2 flags active tickets whose sla_due_at
      has passed. Pass 3 escalates breached urgent tickets at level 0 to the
      level 1 on-call agent, the same rule as escalate_ticket.
    every: 15m
    run: >
      (ctx) => {
        const now = ctx.now();
        const active = ['new', 'open', 'pending', 'escalated'];
        const tierOf = {};
        for (const c of ctx.db.list('customer')) tierOf[c.id] = c.tier;
        const target = {};
        for (const p of ctx.db.list('sla_policy')) target[p.code] = p.resolution_minutes;
        for (const t of ctx.db.list('ticket', { where: { sla_breached: false } })) {
          if (!active.includes(t.status)) continue;
          let due = t.sla_due_at;
          if (due === null || due === undefined) {
            const minutes = target[tierOf[t.customer_id] + '_' + t.priority];
            if (minutes === undefined) continue;
            due = ctx.time.plus(t.sla_started_at, minutes + 'm');
            ctx.db.update('ticket', t.id, { sla_due_at: due });
          }
          if (ctx.time.minutesBetween(due, now) < 0) continue;
          ctx.db.update('ticket', t.id, { sla_breached: true });
          ctx.db.create('ticket_event', { ticket_id: t.id, kind: 'sla_breach', note: 'resolution target ' + due + ' passed', actor_id: null });
        }
        const shift = ctx.db.list('oncall_shift', { where: { level: 1 } })
          .find((s) => ctx.time.minutesBetween(s.starts_at, now) >= 0 && ctx.time.minutesBetween(now, s.ends_at) > 0);
        if (!shift) return;
        for (const t of ctx.db.list('ticket', { where: { priority: 'urgent', sla_breached: true, escalation_level: 0 } })) {
          if (t.status !== 'new' && t.status !== 'open' && t.status !== 'pending') continue;
          ctx.db.update('ticket', t.id, { status: 'escalated', escalation_level: 1, escalated_at: now, assignee_id: shift.agent_id });
          ctx.db.create('ticket_event', { ticket_id: t.id, kind: 'escalated', note: 'auto: SLA breach', actor_id: null });
        }
      }
  escalation_timeout:
    description: Every 15 minutes. An urgent ticket that has sat at level 1 for 60
      minutes moves to level 2 and to the level 2 on-call agent. Skipped while
      no level 2 shift covers now.
    every: 15m
    run: >
      (ctx) => {
        const now = ctx.now();
        const shift = ctx.db.list('oncall_shift', { where: { level: 2 } })
          .find((s) => ctx.time.minutesBetween(s.starts_at, now) >= 0 && ctx.time.minutesBetween(now, s.ends_at) > 0);
        if (!shift) return;
        for (const t of ctx.db.list('ticket', { where: { status: 'escalated', priority: 'urgent', escalation_level: 1 } })) {
          if (t.escalated_at === null || ctx.time.minutesBetween(t.escalated_at, now) < 60) continue;
          ctx.db.update('ticket', t.id, { escalation_level: 2, escalated_at: now, assignee_id: shift.agent_id });
          ctx.db.create('ticket_event', { ticket_id: t.id, kind: 'escalated', note: 'auto: level 1 timeout', actor_id: null });
        }
      }
  auto_close:
    description: Every hour. A ticket resolved at least 72 hours ago is closed.
    every: 1h
    run: >
      (ctx) => {
        const now = ctx.now();
        for (const t of ctx.db.list('ticket', { where: { status: 'resolved' } })) {
          if (t.resolved_at === null || ctx.time.minutesBetween(t.resolved_at, now) < 72 * 60) continue;
          ctx.db.update('ticket', t.id, { status: 'closed' });
          ctx.db.create('ticket_event', { ticket_id: t.id, kind: 'closed', note: 'auto: 72h after resolution', actor_id: null });
        }
      }
fixtures: {}
seed:
  customer: >
    (ctx) => {
      const rows = [
        { name: 'Acme Logistics', tier: 'enterprise', email: 'support@acmelogistics.example' },
        { name: 'Acme Paper Co.', tier: 'premium', email: 'help@acmepaper.example' },
        { name: 'Northwind Health', tier: 'enterprise', email: 'it-desk@northwindhealth.example' },
      ];
      const firsts = ['Bluefin', 'Cedar', 'Harbor', 'Summit', 'Brightline', 'Ironwood', 'Silverleaf', 'Redwood', 'Lakeside',
        'Granite', 'Copperfield', 'Maple', 'Pioneer', 'Evergreen', 'Riverside', 'Oakridge', 'Starling', 'Kestrel', 'Meridian',
        'Juniper', 'Sterling', 'Falcon', 'Atlas', 'Orchid', 'Beacon', 'Coastal', 'Highland', 'Willow', 'Tidewater'];
      const seconds = ['Freight', 'Health', 'Foods', 'Analytics', 'Robotics', 'Retail', 'Energy', 'Labs', 'Logistics', 'Media',
        'Credit Union', 'Travel', 'Pharma', 'Studios', 'Systems', 'Outfitters', 'Insurance', 'Motors', 'Telecom', 'Dental'];
      const tiers = [];
      for (let i = 0; i < 6; i++) tiers.push('enterprise');
      for (let i = 0; i < 15; i++) tiers.push('premium');
      for (let i = 0; i < 36; i++) tiers.push('standard');
      for (let i = tiers.length - 1; i > 0; i--) {
        const j = ctx.int(0, i);
        const x = tiers[i];
        tiers[i] = tiers[j];
        tiers[j] = x;
      }
      const mailbox = ['support', 'helpdesk', 'it', 'ops', 'service'];
      for (let i = 0; i < tiers.length; i++) {
        const name = firsts[i % firsts.length] + ' ' + seconds[(i * 7) % seconds.length];
        const domain = name.toLowerCase().replace(/[^a-z0-9]+/g, '');
        rows.push({ name, tier: tiers[i], email: mailbox[i % mailbox.length] + '@' + domain + '.example' });
      }
      // Customers signed up between 2024-01 and 2025-12.
      return rows.map((r) => {
        const since = ctx.time.plus('2024-01-08T09:00:00.000Z', ctx.int(1, 700) + 'd');
        return { ...r, created_at: since, updated_at: since };
      });
    }
  agent: >
    (ctx) => [
      ['Priya Raman', 'tier1'], ['Priya Shah', 'tier1'], ['Marcus Bell', 'tier2'], ['Dana Okafor', 'sre'],
      ['Lena Fischer', 'tier1'], ['Omar Haddad', 'tier2'], ['Sofia Alvarez', 'tier1'], ['Kenji Watanabe', 'sre'],
      ['Grace Mwangi', 'tier2'], ['Lucas Moreau', 'tier1'], ['Aisha Khan', 'sre'], ['Tom Reyes', 'tier1'],
    ].map(([name, team], i) => {
      const hired = ctx.time.plus('2023-06-05T09:00:00.000Z', i * 37 + 3 + 'd');
      return {
        name,
        email: name.toLowerCase().replace(' ', '.') + '@support.example',
        team,
        active: name !== 'Tom Reyes',
        created_at: hired,
        updated_at: hired,
      };
    })
  sla_policy: >
    (ctx) => {
      const minutes = {
        enterprise: { urgent: 60, high: 240, normal: 480, low: 1440 },
        premium: { urgent: 120, high: 480, normal: 1440, low: 2880 },
        standard: { urgent: 240, high: 1440, normal: 2880, low: 4320 },
      };
      const rows = [];
      for (const tier of ['enterprise', 'premium', 'standard']) {
        for (const priority of ['urgent', 'high', 'normal', 'low']) {
          rows.push({ code: tier + '_' + priority, tier, priority, resolution_minutes: minutes[tier][priority],
            created_at: '2025-01-06T09:00:00.000Z', updated_at: '2025-01-06T09:00:00.000Z' });
        }
      }
      return rows;
    }
  oncall_shift: >
    (ctx) => {
      // 12h blocks from S - 7d to S + 3d. Level 1 (tier2) is continuous. Level 2 (sre) has one gap,
      // S + 12h to S + 24h. Block 14 starts at S: Marcus Bell (agt_0003) at level 1, Dana Okafor (agt_0004) at level 2.
      const agents = ctx.rows('agent');
      const l1 = agents.filter((a) => a.team === 'tier2' && a.active).map((a) => a.id);
      const l2 = agents.filter((a) => a.team === 'sre' && a.active).map((a) => a.id);
      const first = '2026-02-23T09:00:00.000Z';
      const at = (k) => (k === 0 ? first : ctx.time.plus(first, 12 * k + 'h'));
      const published = '2026-02-16T09:00:00.000Z';
      const rows = [];
      for (let k = 0; k < 20; k++) {
        rows.push({ agent_id: l1[(k + 1) % l1.length], level: 1, starts_at: at(k), ends_at: at(k + 1), created_at: published, updated_at: published });
        if (k !== 15) rows.push({ agent_id: l2[(k + 1) % l2.length], level: 2, starts_at: at(k), ends_at: at(k + 1), created_at: published, updated_at: published });
      }
      return rows;
    }
  ticket: >
    (ctx) => {
      const BASE = '2026-01-01T00:00:00.000Z';
      const X = ctx.time.minutesBetween(BASE, ctx.now());
      const iso = (ago) => (X === ago ? BASE : ctx.time.plus(BASE, X - ago + 'm'));
      const customers = ctx.rows('customer');
      const agents = ctx.rows('agent');
      const target = {};
      for (const p of ctx.rows('sla_policy')) target[p.code] = p.resolution_minutes;
      const shifts = ctx.rows('oncall_shift').map((s) => ({
        level: s.level, agent: s.agent_id,
        from: X - ctx.time.minutesBetween(BASE, s.starts_at), to: X - ctx.time.minutesBetween(BASE, s.ends_at),
      }));
      if (Object.keys(target).length !== 12 || shifts.length === 0) throw new Error('ticket seed needs the sla_policy and oncall_shift rows');
      const onCall = (level, ago) => {
        const s = shifts.find((x) => x.level === level && x.from >= ago && ago > x.to);
        if (!s) throw new Error('no level ' + level + ' shift ' + ago + ' minutes before clock.start');
        return s.agent;
      };
      const tierOf = {};
      for (const c of customers) tierOf[c.id] = c.tier;
      const sla = (cid, prio) => target[tierOf[cid] + '_' + prio];
      const pool = (tier) => customers.filter((c) => c.tier === tier && c.name !== 'Acme Logistics').map((c) => c.id);
      const ent = pool('enterprise');
      const prem = pool('premium');
      const std = pool('standard');
      const anyCustomer = () => {
        const r = ctx.int(1, 100);
        return ctx.pick(r <= 15 ? ent : r <= 45 ? prem : std);
      };
      const nonEnterprise = () => ctx.pick(ctx.int(1, 100) <= 40 ? prem : std);
      const workers = agents.filter((a) => a.active && (a.team === 'tier1' || a.team === 'tier2')).map((a) => a.id);
      const pickPriority = () => {
        const r = ctx.int(1, 100);
        return r <= 25 ? 'low' : r <= 65 ? 'normal' : r <= 90 ? 'high' : 'urgent';
      };
      const subjects = [
        'Cannot log in after password reset', 'SSO login fails with SAML error', 'Two-factor codes not arriving by SMS',
        'Invoice shows wrong VAT rate', 'Charged twice for March subscription', 'Refund not received after 10 days',
        'CSV export times out for large reports', 'Dashboard charts not loading', 'API returns 429 rate limit errors',
        'Webhook deliveries failing with 500', 'Mobile app crashes on startup (iOS)', 'Android app stuck on splash screen',
        'Order sync with Shopify stopped', 'Tracking numbers missing from shipment emails', 'Scheduled report email not sent',
        'User invite link expired', 'Need to add 25 seats to our plan', 'Cannot remove former employee account',
        'Search results missing recent records', 'Data import fails at row 1204', 'Timezone wrong on audit log entries',
        'Slow page loads in EU region', 'Salesforce integration disconnected', 'Password reset email lands in spam',
        'Billing address cannot be updated', 'Request for SOC 2 report', 'GDPR data deletion request',
        'Barcode scanner not recognised', 'Label printer prints blank labels', 'All cards declined on payment page',
        'Custom domain SSL certificate expired', 'Bulk edit changes not saved', 'PDF invoices render without logo',
        'Calendar sync duplicates events', 'Audit log export is empty', 'Permissions error when opening shared folder',
        'Notifications delayed by several hours', 'API key revoked unexpectedly', 'Report totals do not match invoice',
        'Cannot attach files larger than 10 MB',
      ];
      const descriptions = [
        'Started this morning for several users in our team. Screenshots attached.',
        'We tried clearing the cache and a different browser. Same result.',
        'This blocks our month-end close. Please advise on a workaround.',
        'Happens intermittently, roughly one attempt in five.',
        'Our admin changed no settings recently. Error ID is in the attachment.',
        'Affects only the EU workspace as far as we can tell.',
        'Customer-facing, so we need an update today if possible.',
        'First noticed after the latest release.',
        null,
      ];
      // One row. age: minutes since creation. Optional: assignee, level, t1 (level 1 escalation ago),
      // t2 (level 2 escalation ago), resolvedAgo, closedAgo, subject, description.
      const ticket = (o) => {
        const due = o.age - sla(o.cid, o.prio);
        const resolved = o.resolvedAgo !== undefined;
        const breached = resolved ? due > o.resolvedAgo : due >= 0;
        const firstEscalation = o.t1 !== undefined ? o.t1 : null;
        const next = firstEscalation !== null ? firstEscalation : resolved ? o.resolvedAgo : 0;
        const times = [o.age];
        if (o.status !== 'new') times.push(o.age - Math.min(30, Math.floor((o.age - next) / 2)));
        if (breached) {
          const firing = 15 * Math.floor(due / 15);
          times.push(!resolved || firing >= o.resolvedAgo ? firing : due);
        }
        for (const k of ['t1', 't2', 'resolvedAgo', 'closedAgo']) if (o[k] !== undefined) times.push(o[k]);
        const created = iso(o.age);
        return {
          subject: o.subject !== undefined ? o.subject : ctx.pick(subjects),
          description: o.description !== undefined ? o.description : ctx.pick(descriptions),
          customer_id: o.cid,
          assignee_id: o.assignee !== undefined ? o.assignee : null,
          priority: o.prio,
          status: o.status,
          escalation_level: o.level !== undefined ? o.level : 0,
          escalated_at: o.t2 !== undefined ? iso(o.t2) : o.t1 !== undefined ? iso(o.t1) : null,
          sla_started_at: created,
          sla_due_at: iso(due),
          sla_breached: breached,
          resolved_at: resolved ? iso(o.resolvedAgo) : null,
          created_at: created,
          updated_at: iso(Math.min(...times)),
        };
      };

      const acme = customers.find((c) => c.name === 'Acme Logistics').id;
      const northwind = customers.find((c) => c.name === 'Northwind Health').id;
      const priya = agents.find((a) => a.name === 'Priya Raman').id;
      const lena = agents.find((a) => a.name === 'Lena Fischer').id;
      // Anchors tkt_0001..tkt_0005. The tasks and world tests read them.
      const rows = [
        ticket({ subject: 'Label printer offline in DC-3', description: 'The Zebra printer at dock 3 shows offline since 04:00. Outbound pallets cannot be labelled.',
          cid: acme, prio: 'high', status: 'open', assignee: priya, age: 300 }),
        ticket({ subject: 'Label printer jams on 4x6 stock', description: 'Jams about once per roll since we switched label stock.',
          cid: acme, prio: 'normal', status: 'open', assignee: priya, age: 120 }),
        ticket({ subject: "Can't export manifest CSV", description: 'The export button spins and never downloads.', cid: acme, prio: 'low', status: 'new', age: 180 }),
        ticket({ subject: 'Driver portal login loop', description: 'Drivers are sent back to the login page after entering their PIN.', cid: acme, prio: 'normal', status: 'new', age: 40 }),
        ticket({ subject: 'Checkout API returning 502 errors', description: 'About 30% of checkout calls fail with 502 since 08:05.', cid: northwind, prio: 'urgent', status: 'open', assignee: lena, age: 50 }),
      ];

      const plan = [];
      for (const [status, n] of [['new', 28], ['open', 87], ['pending', 30], ['escalated', 40], ['resolved', 85], ['closed', 45]]) {
        for (let i = 0; i < n; i++) plan.push(status);
      }
      for (let i = plan.length - 1; i > 0; i--) {
        const j = ctx.int(0, i);
        const x = plan[i];
        plan[i] = plan[j];
        plan[j] = x;
      }
      // The hard task's list (open, high, breached) gets 34 generated rows after tkt_0001. Its targets
      // (enterprise) sit at these places in that list, so three of them are on page 2.
      const TARGET_SLOTS = [3, 10, 17, 24, 28, 32];
      const seen = { new: 0, open: 0, pending: 0, escalated: 0, resolved: 0, closed: 0 };
      let listed = 0;
      let otherOpen = 0;
      const fresh = (cid, prio, longest) => {
        const T = sla(cid, prio);
        return prio === 'urgent' || prio === 'high' ? ctx.int(10, T - 1) : ctx.int(30, longest);
      };
      for (const status of plan) {
        const k = seen[status]++;
        if (status === 'new') {
          if (k < 2) {
            rows.push(ticket({ status, cid: ctx.pick(ent), prio: 'high', age: 240 + ctx.int(5, 900) }));
          } else {
            const cid = anyCustomer();
            const prio = pickPriority();
            rows.push(ticket({ status, cid, prio, age: prio === 'urgent' ? ctx.int(5, sla(cid, prio) - 1) : ctx.int(5, 2880) }));
          }
        } else if (status === 'open') {
          if ((k * 34) % 87 < 34) {
            const slot = listed++;
            const cid = TARGET_SLOTS.includes(slot) ? ctx.pick(ent) : nonEnterprise();
            rows.push(ticket({ status, cid, prio: 'high', assignee: ctx.pick(workers), age: sla(cid, 'high') + ctx.int(15, 4000) }));
          } else {
            const m = otherOpen++;
            const near = m === 7 || m === 33;
            const cid = near ? ctx.pick(ent) : anyCustomer();
            const prio = near ? 'high' : pickPriority();
            rows.push(ticket({ status, cid, prio, assignee: ctx.pick(workers), age: fresh(cid, prio, 8640) }));
          }
        } else if (status === 'pending') {
          if (k < 2) {
            rows.push(ticket({ status, cid: ctx.pick(ent), prio: 'high', assignee: ctx.pick(workers), age: 240 + ctx.int(30, 2000) }));
          } else {
            const cid = anyCustomer();
            const prio = pickPriority();
            const age = prio === 'urgent' ? ctx.int(10, sla(cid, prio) - 1) : ctx.int(60, 7200);
            rows.push(ticket({ status, cid, prio, assignee: ctx.pick(workers), age }));
          }
        } else if (status === 'escalated') {
          const cid = k < 2 ? ctx.pick(ent) : anyCustomer();
          const r = ctx.int(1, 100);
          const prio = k < 2 ? 'high' : r <= 30 ? 'urgent' : r <= 65 ? 'high' : r <= 90 ? 'normal' : 'low';
          if (prio === 'urgent') {
            // Auto-escalated by sla_breach at the firing that caught the breach. Level 1 for under 60 minutes,
            // otherwise escalation_timeout already moved it to level 2.
            if (ctx.int(1, 10) <= 3) {
              const t2 = 15 * ctx.int(1, 96);
              const t1 = t2 + 60;
              rows.push(ticket({ status, cid, prio, level: 2, t1, t2, assignee: onCall(2, t2), age: sla(cid, prio) + t1 + ctx.int(0, 14) }));
            } else {
              const t1 = 15 * ctx.int(1, 3);
              rows.push(ticket({ status, cid, prio, level: 1, t1, assignee: onCall(1, t1), age: sla(cid, prio) + t1 + ctx.int(0, 14) }));
            }
          } else {
            const age = k < 2 ? 240 + ctx.int(60, 2000) : ctx.int(30, 4320);
            const t1 = ctx.int(1, age - 5);
            rows.push(ticket({ status, cid, prio, level: 1, t1, assignee: onCall(1, t1), age }));
          }
        } else {
          // resolved: resolved_at in the last 72h. closed: resolved at least 73h ago, closed by auto_close.
          const cid = anyCustomer();
          const prio = pickPriority();
          const resolvedAgo = status === 'resolved' ? ctx.int(1, 4319) : ctx.int(4380, 12960);
          const age = prio === 'urgent' ? resolvedAgo + ctx.int(10, sla(cid, prio) - 1) : resolvedAgo + ctx.int(20, status === 'resolved' ? 7200 : 4320);
          const o = { status, cid, prio, age, resolvedAgo, assignee: ctx.pick(workers) };
          if (status === 'closed') o.closedAgo = 60 * Math.floor((resolvedAgo - 4320) / 60);
          else if (prio !== 'urgent' && age < 10000 && ctx.int(1, 100) <= 15) {
            o.level = 1;
            o.t1 = ctx.int(resolvedAgo + 1, age - 1);
            o.assignee = onCall(1, o.t1);
          }
          rows.push(ticket(o));
        }
      }
      return rows;
    }
  ticket_comment: >
    (ctx) => {
      const BASE = '2026-01-01T00:00:00.000Z';
      const X = ctx.time.minutesBetween(BASE, ctx.now());
      const iso = (ago) => (X === ago ? BASE : ctx.time.plus(BASE, X - ago + 'm'));
      const ago = (t) => X - ctx.time.minutesBetween(BASE, t);
      const asks = [
        'Could you send a screenshot of the error and the time it happened?',
        'Can you confirm which browser and version your team is using?',
        'Please share the request ID from the failed call so we can trace it.',
        'Could you check whether this also happens in a private window?',
      ];
      const followUps = ['Any update on this?', 'This is getting worse, three more users affected.', 'Adding our IT lead in copy.'];
      const internal = [
        'Reproduced on staging. Looks related to the last deploy.',
        'Checked the logs: requests time out at the load balancer.',
        'Waiting on engineering for a root cause.',
        'Workaround shared with the customer by phone.',
      ];
      const fixes = [
        'We deployed a fix. Please let us know if you still see the problem.',
        'Your account settings were corrected. Closing this out, reply to reopen.',
        'The integration token was refreshed and sync has resumed.',
        'Refund issued. It should appear within 3 to 5 business days.',
      ];
      const out = [];
      for (const t of ctx.rows('ticket')) {
        const age = ago(t.created_at);
        if (t.status === 'pending') {
          out.push({ at: Math.floor(age / 2), row: { ticket_id: t.id, author_id: t.assignee_id, body: ctx.pick(asks), public: true } });
        } else if (t.status === 'new') {
          if (ctx.int(1, 3) === 1) out.push({ at: Math.floor(age / 3), row: { ticket_id: t.id, author_id: null, body: ctx.pick(followUps), public: true } });
        } else if (t.status === 'open' || t.status === 'escalated') {
          const since = t.escalated_at === null ? age : ago(t.escalated_at);
          if (ctx.int(1, 2) === 1) out.push({ at: Math.floor(since / 2), row: { ticket_id: t.id, author_id: t.assignee_id, body: ctx.pick(internal), public: false } });
        } else {
          out.push({ at: ago(t.resolved_at), row: { ticket_id: t.id, author_id: t.assignee_id, body: ctx.pick(fixes), public: true } });
        }
      }
      out.sort((a, b) => b.at - a.at);
      return out.map((c) => {
        const when = iso(c.at);
        return { ...c.row, created_at: when, updated_at: when };
      });
    }
  ticket_event: >
    (ctx) => {
      // Derived from each ticket's fields with the same timing rules as the ticket seed, then put in time order.
      const BASE = '2026-01-01T00:00:00.000Z';
      const X = ctx.time.minutesBetween(BASE, ctx.now());
      const iso = (ago) => (X === ago ? BASE : ctx.time.plus(BASE, X - ago + 'm'));
      const ago = (t) => X - ctx.time.minutesBetween(BASE, t);
      const reasons = [
        'Customer reports a production outage', 'Needs tier 2 investigation', 'Workaround failed, customer is blocked',
        'Affects every user at the site', 'Escalated at the request of the account manager',
      ];
      const out = [];
      for (const t of ctx.rows('ticket')) {
        const ev = (kind, at, note, actor) => out.push({ at, row: { ticket_id: t.id, kind, note, actor_id: actor } });
        const age = ago(t.created_at);
        const resolvedAgo = t.resolved_at === null ? null : ago(t.resolved_at);
        const escalatedAgo = t.escalated_at === null ? null : ago(t.escalated_at);
        const t1 = escalatedAgo === null ? null : t.escalation_level === 2 ? escalatedAgo + 60 : escalatedAgo;
        const next = t1 !== null ? t1 : resolvedAgo !== null ? resolvedAgo : 0;
        ev('created', age, null, null);
        if (t.status !== 'new') ev('assigned', age - Math.min(30, Math.floor((age - next) / 2)), null, null);
        if (t.sla_breached) {
          const due = ago(t.sla_due_at);
          const firing = 15 * Math.floor(due / 15);
          ev('sla_breach', resolvedAgo === null || firing >= resolvedAgo ? firing : due, 'resolution target ' + t.sla_due_at + ' passed', null);
        }
        if (t1 !== null) {
          ev('escalated', t1, t.priority === 'urgent' ? 'auto: SLA breach' : ctx.pick(reasons), null);
          if (t.escalation_level === 2) ev('escalated', escalatedAgo, 'auto: level 1 timeout', null);
        }
        if (resolvedAgo !== null) ev('resolved', resolvedAgo, null, t.assignee_id);
        if (t.status === 'closed') ev('closed', 60 * Math.floor((resolvedAgo - 4320) / 60), 'auto: 72h after resolution', null);
      }
      out.sort((a, b) => b.at - a.at);
      return out.map((e) => {
        const when = iso(e.at);
        return { ...e.row, created_at: when, updated_at: when };
      });
    }
tests:
  escalate_assigns_oncall_agent:
    description: escalate_ticket moves an open ticket to escalated level 1, assigns
      the level 1 on-call agent (agt_0003 at clock.start) and records the
      reason.
    script: >
      (ctx) => {
        const before = ctx.api('GET', '/tickets/tkt_0001').body;
        ctx.assert(before.status === 'open' && before.sla_breached === true && before.assignee_id === 'agt_0001', 'seed: tkt_0001 is open, breached and assigned to agt_0001');
        const at = ctx.now();
        const r = ctx.api('POST', '/tickets/tkt_0001/escalate', { reason: 'SLA breached, printer still offline' });
        ctx.assert(r.status === 200, 'escalate returned ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(r.body.status === 'escalated' && r.body.escalation_level === 1, 'escalated at level 1, got ' + r.body.status + ' level ' + r.body.escalation_level);
        ctx.assert(r.body.assignee_id === 'agt_0003', 'assigned to the level 1 on-call agent agt_0003, got ' + r.body.assignee_id);
        ctx.assert(r.body.escalated_at === at, 'escalated_at is the call time ' + at + ', got ' + r.body.escalated_at);
        const last = ctx.api('GET', '/tickets/tkt_0001/events?sort=-created_at&limit=1').body.data[0];
        ctx.assert(last.kind === 'escalated' && last.note === 'SLA breached, printer still offline', 'last event is the escalation with its reason, got ' + JSON.stringify(last));
      }
  escalate_twice_is_409:
    description: A second escalation of the same ticket is refused with 409
      already_escalated and changes nothing.
    script: >
      (ctx) => {
        const first = ctx.api('POST', '/tickets/tkt_0002/escalate', { reason: 'Jams block outbound shipping' });
        ctx.assert(first.status === 200, 'first escalation returned ' + first.status + ' ' + JSON.stringify(first.body));
        const second = ctx.api('POST', '/tickets/tkt_0002/escalate', { reason: 'Still jamming' });
        ctx.assert(second.status === 409, 'second escalation returned ' + second.status);
        ctx.assert(second.body.error.code === 'already_escalated', 'code already_escalated, got ' + JSON.stringify(second.body));
        const after = ctx.api('GET', '/tickets/tkt_0002').body;
        ctx.assert(JSON.stringify(after) === JSON.stringify(first.body), 'the refused escalation changed the ticket');
        const events = ctx.api('GET', '/tickets/tkt_0002/events').body.data.filter((e) => e.kind === 'escalated');
        ctx.assert(events.length === 1, 'one escalated event, got ' + events.length);
      }
  escalate_refusals:
    description: escalate_ticket refuses a missing ticket (404), a missing reason
      (400) and a resolved ticket (409 invalid_state).
    script: >
      (ctx) => {
        const missing = ctx.api('POST', '/tickets/tkt_9999/escalate', { reason: 'down' });
        ctx.assert(missing.status === 404 && missing.body.error.code === 'not_found', 'missing ticket: ' + JSON.stringify(missing));
        const noReason = ctx.api('POST', '/tickets/tkt_0001/escalate', {});
        ctx.assert(noReason.status === 400 && noReason.body.error.code === 'input.invalid', 'missing reason: ' + JSON.stringify(noReason));
        const blank = ctx.api('POST', '/tickets/tkt_0001/escalate', { reason: '   ' });
        ctx.assert(blank.status === 400 && blank.body.error.code === 'input.invalid', 'blank reason: ' + JSON.stringify(blank));
        const resolved = ctx.api('GET', '/tickets?status=resolved&limit=1').body.data[0];
        const late = ctx.api('POST', '/tickets/' + resolved.id + '/escalate', { reason: 'too late' });
        ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'resolved ticket: ' + JSON.stringify(late));
      }
  resolve_sets_resolved_at:
    description: resolve_ticket moves an open ticket to resolved, sets resolved_at,
      records the note, and refuses new and already resolved tickets.
    script: >
      (ctx) => {
        const at = ctx.now();
        const r = ctx.api('POST', '/tickets/tkt_0002/resolve', { note: 'Replaced the feed roller' });
        ctx.assert(r.status === 200, 'resolve returned ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(r.body.status === 'resolved' && r.body.resolved_at === at, 'resolved at ' + at + ', got ' + r.body.status + ' ' + r.body.resolved_at);
        const last = ctx.api('GET', '/tickets/tkt_0002/events?sort=-created_at&limit=1').body.data[0];
        ctx.assert(last.kind === 'resolved' && last.note === 'Replaced the feed roller' && last.actor_id === 'agt_0001', 'resolved event by the assignee, got ' + JSON.stringify(last));
        const again = ctx.api('POST', '/tickets/tkt_0002/resolve', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second resolve: ' + JSON.stringify(again));
        const fresh = ctx.api('POST', '/tickets/tkt_0003/resolve', {});
        ctx.assert(fresh.status === 409 && fresh.body.error.code === 'invalid_state', 'new ticket: ' + JSON.stringify(fresh));
      }
  reopen_restarts_sla:
    description: reopen_ticket moves a resolved ticket back to open, keeps the
      assignee, clears resolved_at and restarts the SLA from the tier policy
      (enterprise normal is 480 minutes). Closed tickets stay closed.
    script: >
      (ctx) => {
        ctx.assert(ctx.api('POST', '/tickets/tkt_0002/resolve', {}).status === 200, 'resolve tkt_0002 first');
        const at = ctx.now();
        const r = ctx.api('POST', '/tickets/tkt_0002/reopen', { reason: 'Jams again on the new roll' });
        ctx.assert(r.status === 200, 'reopen returned ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(r.body.status === 'open' && r.body.resolved_at === null && r.body.assignee_id === 'agt_0001', 'open, unresolved, same assignee, got ' + JSON.stringify(r.body));
        ctx.assert(at === '2026-03-02T09:00:01.000Z', 'reopen runs one tick after start, at ' + at);
        ctx.assert(r.body.sla_started_at === at && r.body.sla_due_at === '2026-03-02T17:00:01.000Z' && r.body.sla_breached === false, 'SLA restarted, got ' + r.body.sla_started_at + ' due ' + r.body.sla_due_at);
        const again = ctx.api('POST', '/tickets/tkt_0002/reopen', { reason: 'again' });
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'reopen of an open ticket: ' + JSON.stringify(again));
        const closed = ctx.api('GET', '/tickets?status=closed&limit=1').body.data[0];
        const late = ctx.api('POST', '/tickets/' + closed.id + '/reopen', { reason: 'still broken' });
        ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'reopen of a closed ticket: ' + JSON.stringify(late));
      }
  assign_opens_new_ticket:
    description: assign_ticket moves a new ticket to open with the agent, and
      refuses the same agent, an inactive agent, an unknown agent and an
      escalated ticket.
    script: >
      (ctx) => {
        const r = ctx.api('POST', '/tickets/tkt_0004/assign', { agent_id: 'agt_0001' });
        ctx.assert(r.status === 200 && r.body.status === 'open' && r.body.assignee_id === 'agt_0001', 'assign: ' + JSON.stringify(r));
        const same = ctx.api('POST', '/tickets/tkt_0004/assign', { agent_id: 'agt_0001' });
        ctx.assert(same.status === 409 && same.body.error.code === 'no_change', 'same agent: ' + JSON.stringify(same));
        const inactive = ctx.api('POST', '/tickets/tkt_0003/assign', { agent_id: 'agt_0012' });
        ctx.assert(inactive.status === 409 && inactive.body.error.code === 'agent_inactive', 'inactive agent: ' + JSON.stringify(inactive));
        const unknown = ctx.api('POST', '/tickets/tkt_0003/assign', { agent_id: 'agt_9999' });
        ctx.assert(unknown.status === 400 && unknown.body.error.code === 'input.invalid', 'unknown agent: ' + JSON.stringify(unknown));
        ctx.assert(ctx.api('POST', '/tickets/tkt_0004/escalate', { reason: 'Drivers cannot start routes' }).status === 200, 'escalate tkt_0004');
        const late = ctx.api('POST', '/tickets/tkt_0004/assign', { agent_id: 'agt_0002' });
        ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'escalated ticket: ' + JSON.stringify(late));
      }
tasks:
  assign_newest_acme_ticket:
    difficulty: easy
    instruction: Assign the most recently created unassigned ticket from the
      customer Acme Logistics to the agent Priya Raman.
    grader: (ctx) => 1
    solution: >
      (ctx) => {
        const acme = ctx.api('GET', '/customers?q=Acme').body.data.find((c) => c.name === 'Acme Logistics');
        ctx.assert(acme, 'customer Acme Logistics not found');
        const newest = ctx.api('GET', '/tickets?customer_id=' + acme.id + '&status=new&sort=-created_at&limit=1').body.data[0];
        ctx.assert(newest && newest.assignee_id === null, 'no unassigned Acme Logistics ticket');
        const priya = ctx.api('GET', '/agents?q=Priya+Raman').body.data.find((a) => a.name === 'Priya Raman');
        ctx.assert(priya, 'agent Priya Raman not found');
        const r = ctx.api('POST', '/tickets/' + newest.id + '/assign', { agent_id: priya.id });
        ctx.assert(r.status === 200, 'assign failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: takes the first new Acme Logistics ticket in id order instead of the most
          recently created one
        script: >
          (ctx) => {
            const acme = ctx.api('GET', '/customers?q=Acme').body.data.find((c) => c.name === 'Acme Logistics');
            const first = ctx.api('GET', '/tickets?customer_id=' + acme.id + '&status=new').body.data[0];
            const priya = ctx.api('GET', '/agents?q=Priya+Raman').body.data[0];
            ctx.api('POST', '/tickets/' + first.id + '/assign', { agent_id: priya.id });
          }
      - why: PATCHes the ticket status to open instead of assigning it, so the ticket
          has no assignee
        script: >
          (ctx) => {
            const acme = ctx.api('GET', '/customers?q=Acme').body.data.find((c) => c.name === 'Acme Logistics');
            const newest = ctx.api('GET', '/tickets?customer_id=' + acme.id + '&status=new&sort=-created_at&limit=1').body.data[0];
            ctx.api('PATCH', '/tickets/' + newest.id, { status: 'open' });
          }
  escalate_breached_printer_ticket:
    difficulty: medium
    instruction: Acme Logistics says one of their label printer tickets has blown
      its SLA. Escalate that ticket to the on-call agent, with a reason that
      mentions the SLA. Do not reassign or edit the ticket yourself before the
      escalation.
    grader: >
      (ctx) => {
        const acme = ctx.seed.list('customer', { where: { name: 'Acme Logistics' } })[0];
        if (!acme) return 0;
        const target = ctx.seed.list('ticket', { where: { customer_id: acme.id, sla_breached: true } })
          .find((t) => t.subject.toLowerCase().includes('label printer'));
        if (!target) return 0;
        const collateral = ctx.changes().some((c) => {
          if (c.entity === 'ticket' && c.id === target.id) return false;
          const e = c.entity === 'ticket_event' && c.kind === 'created' ? ctx.db.get('ticket_event', c.id) : null;
          return e === null || e.ticket_id !== target.id;
        });
        ctx.guard('nothing but the target and its new events changed', !collateral);
        // History guard: the escalate action is the only call that writes the target ticket.
        ctx.guard('only the escalate action touched the target', ctx.trace().every((c) =>
          c.routeId === 'escalate_ticket' || !c.writes.some((w) => w.entity === 'ticket' && w.id === target.id)));
        const end = ctx.db.get('ticket', target.id);
        const at = end.escalated_at;
        const shift = at === null ? undefined : ctx.seed.list('oncall_shift', { where: { level: 1 } })
          .find((s) => ctx.time.minutesBetween(s.starts_at, at) >= 0 && ctx.time.minutesBetween(at, s.ends_at) > 0);
        const escalated = end.status === 'escalated' && end.escalation_level === 1 && shift !== undefined && end.assignee_id === shift.agent_id;
        ctx.goal(0.7, 'escalated to the level 1 on-call agent', escalated);
        const old = new Set(ctx.seed.list('ticket_event', { where: { ticket_id: target.id } }).map((e) => e.id));
        const reasons = ctx.db.list('ticket_event', { where: { ticket_id: target.id, kind: 'escalated' } }).filter((e) => !old.has(e.id));
        ctx.goal(0.3, 'the escalation reason mentions the SLA', escalated && reasons.some((e) => typeof e.note === 'string' && /\bsla\b/i.test(e.note)));
        return ctx.score();
      }
    solution: >
      (ctx) => {
        const acme = ctx.api('GET', '/customers?q=Acme').body.data.find((c) => c.name === 'Acme Logistics');
        ctx.assert(acme, 'customer Acme Logistics not found');
        const hits = ctx.api('GET', '/tickets?customer_id=' + acme.id + '&q=label+printer').body.data;
        const breached = hits.filter((t) => t.sla_breached);
        ctx.assert(breached.length === 1, 'expected one breached label printer ticket, found ' + breached.length);
        const r = ctx.api('POST', '/tickets/' + breached[0].id + '/escalate', { reason: 'SLA breached on a high-priority enterprise ticket: label printer offline' });
        ctx.assert(r.status === 200, 'escalate failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: escalates the newest label printer ticket without checking which one
          breached its SLA
        script: >
          (ctx) => {
            const acme = ctx.api('GET', '/customers?q=Acme').body.data.find((c) => c.name === 'Acme Logistics');
            const newest = ctx.api('GET', '/tickets?customer_id=' + acme.id + '&q=label+printer&sort=-created_at').body.data[0];
            ctx.api('POST', '/tickets/' + newest.id + '/escalate', { reason: 'SLA breached on a label printer ticket' });
          }
      - why: escalates the right ticket but gives a reason that does not mention the SLA
        script: >
          (ctx) => {
            const acme = ctx.api('GET', '/customers?q=Acme').body.data.find((c) => c.name === 'Acme Logistics');
            const hit = ctx.api('GET', '/tickets?customer_id=' + acme.id + '&q=label+printer&sla_breached=true').body.data[0];
            ctx.api('POST', '/tickets/' + hit.id + '/escalate', { reason: 'Customer asked us to escalate' });
          }
      - why: PATCHes the status to escalated instead of calling the escalate action, so
          no on-call agent is assigned
        script: >
          (ctx) => {
            const acme = ctx.api('GET', '/customers?q=Acme').body.data.find((c) => c.name === 'Acme Logistics');
            const hit = ctx.api('GET', '/tickets?customer_id=' + acme.id + '&q=label+printer&sla_breached=true').body.data[0];
            ctx.api('PATCH', '/tickets/' + hit.id, { status: 'escalated' });
          }
      - why: assigns the ticket to the on-call agent by hand before escalating it, so
          its end state passes but its history has a hand edit
        script: >
          (ctx) => {
            const acme = ctx.api('GET', '/customers?q=Acme').body.data.find((c) => c.name === 'Acme Logistics');
            const hit = ctx.api('GET', '/tickets?customer_id=' + acme.id + '&q=label+printer&sla_breached=true').body.data[0];
            const now = ctx.now();
            const shift = ctx.api('GET', '/oncall?level=1').body.data.find((s) => s.starts_at <= now && now < s.ends_at);
            ctx.api('POST', '/tickets/' + hit.id + '/assign', { agent_id: shift.agent_id });
            ctx.api('POST', '/tickets/' + hit.id + '/escalate', { reason: 'SLA breached on a label printer ticket' });
          }
  escalate_breached_enterprise_tickets:
    difficulty: hard
    instruction: Escalate every ticket that is in status open, has high priority,
      belongs to an enterprise customer and has breached its SLA. Give each
      escalation a reason. Change nothing else.
    grader: >
      (ctx) => {
        const tierOf = {};
        for (const c of ctx.seed.list('customer')) tierOf[c.id] = c.tier;
        const targets = ctx.seed.list('ticket', { where: { status: 'open', priority: 'high', sla_breached: true } })
          .filter((t) => tierOf[t.customer_id] === 'enterprise');
        if (targets.length === 0) return 0;
        const ids = new Set(targets.map((t) => t.id));
        const events = ctx.db.list('ticket_event', { where: { kind: 'escalated' } })
          .filter((e) => ctx.seed.get('ticket_event', e.id) === null && ids.has(e.ticket_id) && e.actor_id === null);
        ctx.guardChanges('only the escalation fields of the target tickets and their escalated events changed', [
          ...targets.map((t) => ({ entity: 'ticket', id: t.id, kind: 'updated', fields: ['status', 'escalation_level', 'escalated_at', 'assignee_id'] })),
          ...events.map((e) => ({ entity: 'ticket_event', id: e.id, kind: 'created', fields: ['ticket_id', 'kind', 'note', 'actor_id'] })),
        ]);
        const shifts = ctx.seed.list('oncall_shift', { where: { level: 1 } });
        let done = 0;
        for (const t of targets) {
          const end = ctx.db.get('ticket', t.id);
          if (end.status !== 'escalated' || end.escalation_level !== 1 || end.escalated_at === null) continue;
          const at = end.escalated_at;
          const shift = shifts.find((s) => ctx.time.minutesBetween(s.starts_at, at) >= 0 && ctx.time.minutesBetween(at, s.ends_at) > 0);
          if (shift && end.assignee_id === shift.agent_id) done += 1;
        }
        return done / targets.length;
      }
    solution: >
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor;
          } while (cursor !== null);
          return rows;
        };
        const enterprise = new Set(pages('/customers?tier=enterprise').map((c) => c.id));
        const targets = pages('/tickets?status=open&priority=high&sla_breached=true').filter((t) => enterprise.has(t.customer_id));
        ctx.assert(targets.length > 0, 'no breached high-priority enterprise tickets found');
        for (const t of targets) {
          const r = ctx.api('POST', '/tickets/' + t.id + '/escalate', { reason: 'SLA breached on a high-priority enterprise ticket' });
          ctx.assert(r.status === 200, 'escalate ' + t.id + ' failed: ' + JSON.stringify(r.body));
        }
      }
    decoys:
      - why: reads only the first page of open, high, breached tickets, so it misses the
          enterprise tickets on page 2
        script: >
          (ctx) => {
            const enterprise = new Set(ctx.api('GET', '/customers?tier=enterprise').body.data.map((c) => c.id));
            const page = ctx.api('GET', '/tickets?status=open&priority=high&sla_breached=true').body.data;
            for (const t of page) {
              if (enterprise.has(t.customer_id)) ctx.api('POST', '/tickets/' + t.id + '/escalate', { reason: 'SLA breached' });
            }
          }
      - why: ignores the customer tier and escalates every open, high-priority ticket
          that breached its SLA
        script: >
          (ctx) => {
            let cursor = null;
            const ids = [];
            do {
              const r = ctx.api('GET', '/tickets?status=open&priority=high&sla_breached=true' + (cursor === null ? '' : '&cursor=' + cursor));
              for (const t of r.body.data) ids.push(t.id);
              cursor = r.body.next_cursor;
            } while (cursor !== null);
            for (const id of ids) ctx.api('POST', '/tickets/' + id + '/escalate', { reason: 'SLA breached' });
          }
      - why: reads 'open' as 'not resolved yet' and also escalates new and pending
          enterprise tickets that breached
        script: >
          (ctx) => {
            const enterprise = new Set(ctx.api('GET', '/customers?tier=enterprise').body.data.map((c) => c.id));
            let cursor = null;
            const ids = [];
            do {
              const r = ctx.api('GET', '/tickets?priority=high&sla_breached=true' + (cursor === null ? '' : '&cursor=' + cursor));
              for (const t of r.body.data) {
                if (enterprise.has(t.customer_id) && ['new', 'open', 'pending'].includes(t.status)) ids.push(t.id);
              }
              cursor = r.body.next_cursor;
            } while (cursor !== null);
            for (const id of ids) ctx.api('POST', '/tickets/' + id + '/escalate', { reason: 'SLA breached' });
          }
      - why: forgets the SLA filter and escalates every open, high-priority enterprise
          ticket
        script: >
          (ctx) => {
            const enterprise = new Set(ctx.api('GET', '/customers?tier=enterprise').body.data.map((c) => c.id));
            let cursor = null;
            const ids = [];
            do {
              const r = ctx.api('GET', '/tickets?status=open&priority=high' + (cursor === null ? '' : '&cursor=' + cursor));
              for (const t of r.body.data) if (enterprise.has(t.customer_id)) ids.push(t.id);
              cursor = r.body.next_cursor;
            } while (cursor !== null);
            for (const id of ids) ctx.api('POST', '/tickets/' + id + '/escalate', { reason: 'SLA breached' });
          }
      - why: PATCHes each target's status to escalated instead of calling the escalate
          action, so nobody on call is assigned
        script: >
          (ctx) => {
            const enterprise = new Set(ctx.api('GET', '/customers?tier=enterprise').body.data.map((c) => c.id));
            let cursor = null;
            const ids = [];
            do {
              const r = ctx.api('GET', '/tickets?status=open&priority=high&sla_breached=true' + (cursor === null ? '' : '&cursor=' + cursor));
              for (const t of r.body.data) if (enterprise.has(t.customer_id)) ids.push(t.id);
              cursor = r.body.next_cursor;
            } while (cursor !== null);
            for (const id of ids) ctx.api('PATCH', '/tickets/' + id, { status: 'escalated' });
          }
