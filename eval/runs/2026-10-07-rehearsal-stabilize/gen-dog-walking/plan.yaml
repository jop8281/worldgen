    purpose: 'Action: cancel a booked walk, free until 2h before the slot, half price after.'
  - id: start_walk
    method: POST
    path: /bookings/{id}/start
    purpose: 'Action: walker starts the walk.'
  - id: complete_walk
    method: POST
    path: /bookings/{id}/complete
    purpose: 'Action: walker completes the walk.'
  - id: pay_booking
    method: POST
    path: /bookings/{id}/pay
    purpose: 'Action: pay for a completed walk or a late-cancellation fee. Answers 201 with the payment.'
seed:
  rowsPerEntity:
    owner: 12
    dog: 20
    walker: 5
    booking: 30
    booking_dog: 45
    payment: 12
  mix: 'Booking has 30 rows. Past bookings are on 2026-10-05 and 2026-10-06 and today before 09:00, and booked ones are in the future from 2026-10-07 11:00 on. 9 are booked (9 future slots), 3 in_progress (started today before 09:00, ending after 09:00), 9 completed (about two thirds paid), 6 cancelled (a mix of free and late with fee, some fees paid), 3 missed. Prices equal walker rate * dog_count * duration/30, dog_count equals the booking_dog rows, and payments exist exactly for paid bookings. Anchors: owner Maria Lopez with dogs Rocky and Daisy and a booked walk for Rocky on 2026-10-08. Owner Tom Becker with 3 completed unpaid walks, a late-cancelled unpaid booking, a missed booking and a paid completed walk. Owner Priya Nair with dogs Luna, Max and Pepper. The cheapest active walker has a booking on 2026-10-08 at 15:30. An even cheaper walker is inactive. Another active walker is free at 15:00 on 2026-10-08.'
  stateMix:
    booking:
      booked: 30
      in_progress: 10
      completed: 30
      cancelled: 20
      missed: 10
tasks:
  - id: cancel_rocky_walk_free
    difficulty: easy
    intent: Maria Lopez's dog Rocky has a booked walk tomorrow. Cancel that booking, which is free because it is more than 2 hours away, and leave her other dog Daisy's booking alone.
    decoyIdea: Cancel the booking of her other dog Daisy, or cancel every booking of Maria, or PATCH instead of using the cancel action.
  - id: pay_tom_completed_walks
    difficulty: medium
    intent: Tom Becker owes money for walks. Pay by card every completed walk of his that is still unpaid. Do not pay his late-cancellation fee or touch his missed or already paid bookings.
    decoyIdea: Pay every unpaid booking of Tom including the late-cancel fee booking, or pay only the first page of his bookings, or look at the wrong owner with a similar name.
  - id: book_priya_three_dogs
    difficulty: hard
    intent: Priya Nair wants a 60 minute walk tomorrow (2026-10-08) at 15:00 UTC for all three of her dogs, Luna, Max and Pepper. Book it with the cheapest active walker who is free for that whole slot, then add the other dogs to the booking.
    decoyIdea: Pick the cheapest walker overall (inactive or already busy at 15:30) or the first listed walker, or book only one dog without calling add_dog, or create separate bookings per dog.
open_questions:
  - question: Is a missed walk charged to the owner?
    default_answer: No. A missed walk is final, costs nothing and can't be paid.
  - question: Can a walk be started before its slot begins?
    default_answer: No. Starting before starts_at answers 409 too_early.
  - question: Is the 2-hour boundary inclusive?
    default_answer: Yes. Cancelling exactly 120 minutes before the slot is free.
  - question: How is the price determined?
    default_answer: The walker's rate_per_dog per 30 minutes, times the number of dogs and the number of 30 minute blocks.
  - question: Does the 4-dog limit and walker overlap rule apply across owners?
    default_answer: A booking belongs to one owner and holds up to 4 of that owner's dogs. The walker overlap rule applies across all owners.
  - question: Who can cancel, start or complete a booking?
    default_answer: There is no authentication. Any caller can act, and the rules depend only on state and time.
assumptions:
  - decision: Clock starts at 2026-10-07T09:00:00.000Z with tick 0s. Seeded history lies before it. Booked and in-progress-ending slots lie after it, and time moves only through explicit advance or jobs.
    why: Today is 2026-10-07. Deterministic time makes the 2-hour cancellation window, the 30-minute missed rule and the acceptance-test timestamps exact.
  - decision: A booking is a walk with one owner, one walker and 1 to 4 dogs of that owner. It is created with one dog and add_dog adds more, held as booking_dog rows with a denormalized dog_count.
    why: The input says a walker takes at most 4 dogs on one walk yet can't have overlapping slots. So several dogs must share one booking.
  - decision: Price is walker.rate_per_dog * dog_count * duration_minutes / 30. Durations are multiples of 30 from 30 to 120, and rates are multiples of 100 minor units so half of the price is exact.
    why: The input gives a price and half-price cancellation but no pricing model. This is the simplest rule that depends on dogs and duration.
  - decision: Late cancellation means fewer than 120 minutes remain before starts_at, so exactly 120 minutes is free. A cancellation after the slot began still comes from booked and costs half the price.
    why: The input says free until 2 hours before. Boundary inclusive is the natural reading.
  - decision: A walk may be started from starts_at on (not earlier) until it is flagged missed. The job flags a booked walk missed once now >= starts_at + 30m and runs every 5 minutes. Missed walks are final, not chargeable and not cancellable.
    why: The input says a walk not started 30 minutes after its slot begins is flagged. Charging for no-shows and un-missing are unspecified, so the plan keeps it simple.
  - decision: Payment is one full payment per booking, recorded as a payment row. It is the walk price for completed bookings or the cancellation fee for late-cancelled ones, with method card or cash. There is no payment gateway.
    why: The input says owners pay after the walk. A single settled payment keeps the model small.
  - decision: Overlap blocking counts booked, in_progress and completed bookings of the same walker. Cancelled and missed ones release the slot. A dog or owner may have overlapping bookings with different walkers.
    why: The input constrains only walkers.
  - decision: Unknown refs on action inputs answer the engine's 400 input.invalid, and action-specific failures use 409/422 codes named in the workflow rules. book_walk and pay_booking answer 201 and the other actions 200.
    why: Follows the engine error convention. Actions that create a row answer 201.
  - decision: Bookings have no standard create or update route. Only actions change them. Owners, dogs and walkers have standard create, get, list and update routes and no delete.
    why: Prevents bypassing the state machine and the pricing and overlap rules. Delete is not needed for any task.
outOfScope:
  - what: Real payment processing, refunds, tips and invoices
    why: The core value is the booking and cancellation workflow. Payment is a simple settle-once record.
  - what: Walker availability schedules, recurring walks, GPS tracking, ratings and reviews
    why: Not in the input and they would grow the model without adding core rules.
  - what: Dog-level overlap checks and notifications to owners or walkers
    why: The input constrains only walkers' slots, and notifications have no stateful record to test.
  - what: Rescheduling a booking
    why: The input offers only cancel and rebook.
