seed:
  customer: "(ctx) => ctx.fixtures.customers.map((c) => ({ name: c.name, email: c.email, country: c.country, plan: c.plan, created_at: c.created_at, updated_at: c.created_at }))"
  order: "(ctx) => ctx.fixtures.orders.map((o) => ({ customer_id: o.customer_id, status: o.status, total_cents: o.total_cents, currency: o.currency, item_count: o.item_count, placed_at: o.placed_at, shipped_at: o.shipped_at === undefined ? null : o.shipped_at, note: o.note === undefined ? null : o.note, created_at: o.placed_at, updated_at: o.shipped_at ? o.shipped_at : o.placed_at }))"
tests:
  pay_order_only_from_pending:
    description: Create a customer and an order, pay it, then pay again and expect 409 invalid_state.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Plan Tester Pay', email: 'pay.tester@plan-test.example.org', country: 'GB', plan: 'pro' });
        ctx.assert(c.status === 201, 'customer create ' + c.status + JSON.stringify(c.body));
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 2500, currency: 'USD', item_count: 2, placed_at: '2026-04-08T08:00:00.000Z' });
        ctx.assert(o.status === 201 && o.body.status === 'pending', 'order starts pending: ' + JSON.stringify(o.body));
        const p = ctx.api('POST', '/orders/' + o.body.id + '/pay', {});
        ctx.assert(p.status === 200 && p.body.status === 'paid', 'pay: ' + JSON.stringify(p.body));
        const again = ctx.api('POST', '/orders/' + o.body.id + '/pay', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second pay: ' + JSON.stringify(again.body));
        const missing = ctx.api('POST', '/orders/ord_999999/pay', {});
        ctx.assert(missing.status === 404, 'missing order: ' + missing.status);
      }
  ship_requires_paid_and_sets_shipped_at:
    description: Shipping a pending order is refused; after payment shipping succeeds and sets shipped_at to the call time.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Plan Tester Ship', email: 'ship.tester@plan-test.example.org', country: 'US', plan: 'free' });
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 1800, currency: 'USD', item_count: 1, placed_at: '2026-04-08T08:00:00.000Z' });
        ctx.assert(o.status === 201, 'order create ' + o.status);
        const early = ctx.api('POST', '/orders/' + o.body.id + '/ship', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'ship pending: ' + JSON.stringify(early.body));
        ctx.assert(ctx.api('POST', '/orders/' + o.body.id + '/pay', {}).status === 200, 'pay');
        const at = ctx.now();
        const s = ctx.api('POST', '/orders/' + o.body.id + '/ship', {});
        ctx.assert(s.status === 200 && s.body.status === 'shipped' && s.body.shipped_at === at, 'ship: ' + JSON.stringify(s.body));
      }
  deliver_only_from_shipped:
    description: Delivering a paid order is refused; after shipping it succeeds.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Plan Tester Deliver', email: 'deliver.tester@plan-test.example.org', country: 'DE', plan: 'basic' });
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 900, currency: 'USD', item_count: 3, placed_at: '2026-04-08T08:00:00.000Z' });
        ctx.assert(ctx.api('POST', '/orders/' + o.body.id + '/pay', {}).status === 200, 'pay');
        const early = ctx.api('POST', '/orders/' + o.body.id + '/deliver', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'deliver paid: ' + JSON.stringify(early.body));
        ctx.assert(ctx.api('POST', '/orders/' + o.body.id + '/ship', {}).status === 200, 'ship');
        const d = ctx.api('POST', '/orders/' + o.body.id + '/deliver', {});
        ctx.assert(d.status === 200 && d.body.status === 'delivered', 'deliver: ' + JSON.stringify(d.body));
      }
  cancel_only_before_shipping:
    description: Cancel a pending order; a cancelled order cannot be cancelled again; a shipped order cannot be cancelled.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Plan Tester Cancel', email: 'cancel.tester@plan-test.example.org', country: 'FR', plan: 'pro' });
        const mk = () => ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 1200, currency: 'USD', item_count: 1, placed_at: '2026-04-08T08:00:00.000Z' }).body.id;
        const a = mk();
        const r = ctx.api('POST', '/orders/' + a + '/cancel', {});
        ctx.assert(r.status === 200 && r.body.status === 'cancelled', 'cancel pending: ' + JSON.stringify(r.body));
        const twice = ctx.api('POST', '/orders/' + a + '/cancel', {});
        ctx.assert(twice.status === 409 && twice.body.error.code === 'invalid_state', 'cancel twice: ' + JSON.stringify(twice.body));
        const b = mk();
        ctx.api('POST', '/orders/' + b + '/pay', {});
        ctx.api('POST', '/orders/' + b + '/ship', {});
        const late = ctx.api('POST', '/orders/' + b + '/cancel', {});
        ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'cancel shipped: ' + JSON.stringify(late.body));
        const paid = mk();
        ctx.api('POST', '/orders/' + paid + '/pay', {});
        const pc = ctx.api('POST', '/orders/' + paid + '/cancel', {});
        ctx.assert(pc.status === 200 && pc.body.status === 'cancelled', 'cancel paid: ' + JSON.stringify(pc.body));
      }
  refund_only_after_payment:
    description: Refuse refunding a pending order; refund a delivered order; refuse a second refund.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Plan Tester Refund', email: 'refund.tester@plan-test.example.org', country: 'GB', plan: 'pro' });
        const mk = () => ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 4000, currency: 'USD', item_count: 4, placed_at: '2026-04-08T08:00:00.000Z' }).body.id;
        const a = mk();
        const early = ctx.api('POST', '/orders/' + a + '/refund', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'refund pending: ' + JSON.stringify(early.body));
        ctx.api('POST', '/orders/' + a + '/pay', {});
        ctx.api('POST', '/orders/' + a + '/ship', {});
        ctx.api('POST', '/orders/' + a + '/deliver', {});
        const r = ctx.api('POST', '/orders/' + a + '/refund', {});
        ctx.assert(r.status === 200 && r.body.status === 'refunded', 'refund delivered: ' + JSON.stringify(r.body));
        const again = ctx.api('POST', '/orders/' + a + '/refund', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'refund twice: ' + JSON.stringify(again.body));
        const b = mk();
        ctx.api('POST', '/orders/' + b + '/pay', {});
        const pr = ctx.api('POST', '/orders/' + b + '/refund', {});
        ctx.assert(pr.status === 200 && pr.body.status === 'refunded', 'refund paid: ' + JSON.stringify(pr.body));
      }
tasks:
  ship_latest_paid_order:
    difficulty: easy
    instruction: Ship the most recently placed paid order of the customer Ada Lovelace.
    grader: |-
      (ctx) => {
        const ada = ctx.seed.list('customer', { where: { name: 'Ada Lovelace' } })[0];
        if (!ada) return 0;
        let target = null;
        for (const o of ctx.seed.list('order', { where: { customer_id: ada.id, status: 'paid' } })) {
          if (target === null || ctx.time.minutesBetween(target.placed_at, o.placed_at) > 0) target = o;
        }
        if (target === null) return 0;
        ctx.guardChanges('only the status and shipped_at of the target order changed', [
          { entity: 'order', id: target.id, kind: 'updated', fields: ['status', 'shipped_at'] },
        ]);
        const end = ctx.db.get('order', target.id);
        return end.status === 'shipped' && end.shipped_at !== null ? 1 : 0;
      }
    solution: |-
      (ctx) => {
        const gb = ctx.api('GET', '/customers?country=GB');
        ctx.assert(gb.status === 200, 'customer list failed');
        const ada = gb.body.data.find((c) => c.name === 'Ada Lovelace');
        ctx.assert(ada, 'customer Ada Lovelace not found');
        const paid = ctx.api('GET', '/orders?customer_id=' + ada.id + '&status=paid&sort=-placed_at&limit=1').body.data;
        ctx.assert(paid.length === 1, 'no paid order for Ada Lovelace');
        const r = ctx.api('POST', '/orders/' + paid[0].id + '/ship', {});
        ctx.assert(r.status === 200, 'ship failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: ships the latest paid order of a different customer (Shafi Goldwasser) instead of Ada Lovelace
        script: |-
          (ctx) => {
            const gb = ctx.api('GET', '/customers?country=GB').body.data;
            const other = gb.find((c) => c.name === 'Shafi Goldwasser');
            const paid = ctx.api('GET', '/orders?customer_id=' + other.id + '&status=paid&sort=-placed_at&limit=1').body.data[0];
            ctx.api('POST', '/orders/' + paid.id + '/ship', {});
          }
      - why: ships Ada's paid order but also pays and ships one of her pending orders, a collateral change
        script: |-
          (ctx) => {
            const gb = ctx.api('GET', '/customers?country=GB').body.data;
            const ada = gb.find((c) => c.name === 'Ada Lovelace');
            const paid = ctx.api('GET', '/orders?customer_id=' + ada.id + '&status=paid&sort=-placed_at&limit=1').body.data[0];
            ctx.api('POST', '/orders/' + paid.id + '/ship', {});
            const pending = ctx.api('GET', '/orders?customer_id=' + ada.id + '&status=pending&sort=-placed_at&limit=1').body.data[0];
            ctx.api('POST', '/orders/' + pending.id + '/pay', {});
          }
    alternatives: []
    allows:
      - entity: order
        kind: updated
        fields:
          - status
          - shipped_at
        where:
          customer_id: cus_0001
          status: paid
  refund_delivered_orders_for_country:
    difficulty: medium
    instruction: Refund every delivered order worth more than 5000 cents that belongs to a customer in Great Britain (country code GB). Leave all other orders untouched.
    grader: |-
      (ctx) => {
        const gb = new Set(ctx.seed.list('customer', { where: { country: 'GB' } }).map((c) => c.id));
        const targets = ctx.seed.list('order', { where: { status: 'delivered' } })
          .filter((o) => gb.has(o.customer_id) && o.total_cents > 5000);
        if (targets.length === 0) return 0;
        ctx.guardChanges('only the status of the delivered GB orders over 5000 cents changed', targets.map((t) => ({ entity: 'order', id: t.id, kind: 'updated', fields: ['status'] })));
        let done = 0;
        for (const t of targets) {
          if (ctx.db.get('order', t.id).status === 'refunded') done += 1;
        }
        return done / targets.length;
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + encodeURIComponent(cursor)));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor;
          } while (cursor !== null);
          return rows;
        };
        const gb = new Set(pages('/customers?country=GB&limit=25').map((c) => c.id));
        const targets = pages('/orders?status=delivered&limit=25').filter((o) => gb.has(o.customer_id) && o.total_cents > 5000);
        ctx.assert(targets.length > 0, 'no delivered GB orders over 5000 cents found');
        for (const o of targets) {
          const r = ctx.api('POST', '/orders/' + o.id + '/refund', {});
          ctx.assert(r.status === 200, 'refund ' + o.id + ' failed: ' + JSON.stringify(r.body));
        }
      }
    decoys:
      - why: refunds every delivered order regardless of the customer's country
        script: |-
          (ctx) => {
            const rows = ctx.api('GET', '/orders?status=delivered&limit=25').body.data;
            for (const o of rows) ctx.api('POST', '/orders/' + o.id + '/refund', {});
          }
      - why: only handles Grace Hopper, the first GB customer it thinks of, and misses the delivered orders of other GB customers
        script: |-
          (ctx) => {
            const gb = ctx.api('GET', '/customers?country=GB').body.data;
            const grace = gb.find((c) => c.name === 'Grace Hopper');
            const rows = ctx.api('GET', '/orders?status=delivered&customer_id=' + grace.id).body.data;
            for (const o of rows) {
              if (o.total_cents > 5000) ctx.api('POST', '/orders/' + o.id + '/refund', {});
            }
          }
      - why: refunds the right delivered GB orders and also refunds shipped GB orders over 5000 cents
        script: |-
          (ctx) => {
            const gb = new Set(ctx.api('GET', '/customers?country=GB').body.data.map((c) => c.id));
            for (const status of ['delivered', 'shipped']) {
              const rows = ctx.api('GET', '/orders?status=' + status + '&limit=25').body.data;
              for (const o of rows) {
                if (gb.has(o.customer_id) && o.total_cents > 5000) ctx.api('POST', '/orders/' + o.id + '/refund', {});
              }
            }
          }
    alternatives: []
    allows:
      - entity: order
        kind: updated
        fields:
          - status
        where:
          customer_id: cus_0001
          status: delivered
      - entity: order
        kind: updated
        fields:
          - status
        where:
          customer_id: cus_0002
          status: delivered
      - entity: order
        kind: updated
        fields:
          - status
        where:
          customer_id: cus_0007
          status: delivered
      - entity: order
        kind: updated
        fields:
          - status
        where:
          customer_id: cus_0015
          status: delivered
  fulfil_pending_orders_of_pro_customers:
    difficulty: hard
    instruction: "For every pending order placed by a customer on the pro plan, record payment and then ship it. Cancel nothing and change no other order. Also, the pro customer Hedy Lamarr has relocated to Ireland: set her country to IE."
    grader: |-
      (ctx) => {
        const pro = new Set(ctx.seed.list('customer', { where: { plan: 'pro' } }).map((c) => c.id));
        const hedy = ctx.seed.list('customer', { where: { name: 'Hedy Lamarr' } })[0];
        const targets = ctx.seed.list('order', { where: { status: 'pending' } }).filter((o) => pro.has(o.customer_id));
        if (!hedy || targets.length === 0) return 0;
        ctx.guardChanges('only the pending orders of pro customers and Hedy Lamarr country changed', [
          ...targets.map((t) => ({ entity: 'order', id: t.id, kind: 'updated', fields: ['status', 'shipped_at'] })),
          { entity: 'customer', id: hedy.id, kind: 'updated', fields: ['country'] },
        ]);
        let done = 0;
        for (const t of targets) {
          const end = ctx.db.get('order', t.id);
          if (end.status === 'shipped' && end.shipped_at !== null) done += 1;
        }
        const moved = ctx.db.get('customer', hedy.id).country === 'IE' ? 1 : 0;
        return (done + moved) / (targets.length + 1);
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + encodeURIComponent(cursor)));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor;
          } while (cursor !== null);
          return rows;
        };
        const proRows = pages('/customers?plan=pro&limit=25');
        const pro = new Set(proRows.map((c) => c.id));
        const targets = pages('/orders?limit=25').filter((o) => o.status === 'pending' && pro.has(o.customer_id));
        ctx.assert(targets.length > 0, 'no pending orders of pro customers found');
        for (const o of targets) {
          const p = ctx.api('POST', '/orders/' + o.id + '/pay', {});
          ctx.assert(p.status === 200, 'pay ' + o.id + ' failed: ' + JSON.stringify(p.body));
          const s = ctx.api('POST', '/orders/' + o.id + '/ship', {});
          ctx.assert(s.status === 200, 'ship ' + o.id + ' failed: ' + JSON.stringify(s.body));
        }
        const hedy = proRows.find((c) => c.name === 'Hedy Lamarr');
        ctx.assert(hedy, 'customer Hedy Lamarr not found');
        const u = ctx.api('PATCH', '/customers/' + hedy.id, { country: 'IE' });
        ctx.assert(u.status === 200, 'customer update failed: ' + JSON.stringify(u.body));
      }
    decoys:
      - why: reads only the first page of orders, so it misses the pending pro orders on later pages
        script: |-
