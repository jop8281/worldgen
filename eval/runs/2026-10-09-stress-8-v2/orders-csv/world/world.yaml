format: 1
meta:
  name: world
  description: An order desk with customers and orders. Orders move through pending, paid, shipped, delivered, and can be cancelled before shipping or refunded after payment. The imported CSV fixtures (18 customers, 72 orders) are kept exactly.
  resembles: Shopify-style order desk (orders and customers API)
  source: worldgen
  seed: 0
  clock:
    start: 2026-04-08T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A buyer of the order desk, imported from customers.csv. Holds a unique email, country and subscription plan.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 200
        format: email
      country:
        type: string
        description: ISO 3166-1 alpha-2 country code
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 2
        pattern: ^[A-Z]{2}$
      plan:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - free
          - basic
          - pro
          - team
  order:
    description: A purchase by a customer, imported from orders.csv. Moves through pending, paid, shipped and delivered, and can be cancelled before shipping or refunded after payment. Status and shipped_at change only through workflow actions.
    idPrefix: ord
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - paid
          - shipped
          - delivered
          - cancelled
          - refunded
        initial: pending
        transitions:
          pending:
            - paid
            - cancelled
          paid:
            - shipped
            - cancelled
            - refunded
          shipped:
            - delivered
            - refunded
          delivered:
            - refunded
          cancelled: []
          refunded: []
      total_cents:
        type: money
        description: Order total in USD cents
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      currency:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - USD
        default: USD
      item_count:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      placed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      shipped_at:
        type: datetime
        description: Set by ship_order to the engine time
        required: false
        nullable: true
        unique: false
        readonly: true
      note:
        type: text
        description: Optional delivery note
        required: false
        nullable: true
        unique: false
        readonly: false
routes:
  list_orders:
    op: list
    entity: order
    filters:
      - status
      - customer_id
      - currency
    search:
      - note
    sort:
      - placed_at
      - total_cents
    pageSize: 25
    method: GET
    path: /orders
    description: List orders, filter by status, customer_id and currency, sort by placed_at or total_cents
  get_order:
    op: get
    entity: order
    method: GET
    path: /orders/{id}
    description: Read one order
  create_order:
    op: create
    entity: order
    method: POST
    path: /orders
    description: Create an order in the pending state
  update_order:
    op: update
    entity: order
    method: PATCH
    path: /orders/{id}
    description: Edit non-workflow order fields such as the note
  list_customers:
    op: list
    entity: customer
    filters:
      - country
      - plan
    search:
      - name
      - email
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /customers
    description: List customers, filter by country and plan, search by name and email
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /customers/{id}
    description: Read one customer
  create_customer:
    op: create
    entity: customer
    method: POST
    path: /customers
    description: Create a customer
  update_customer:
    op: update
    entity: customer
    method: PATCH
    path: /customers/{id}
    description: Edit a customer
actions:
  pay_order:
    method: POST
    path: /orders/{id}/pay
    description: Record payment for a pending order. Moves it to paid.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only pending orders can be paid.');
        const updated = ctx.db.update('order', id, { status: 'paid' });
        return { status: 200, body: updated };
      }
  ship_order:
    method: POST
    path: /orders/{id}/ship
    description: Ship a paid order. Moves it to shipped and sets shipped_at to the current time.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only paid orders can be shipped.');
        const updated = ctx.db.update('order', id, { status: 'shipped', shipped_at: ctx.now() });
        return { status: 200, body: updated };
      }
  deliver_order:
    method: POST
    path: /orders/{id}/deliver
    description: Mark a shipped order as delivered.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'shipped') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only shipped orders can be delivered.');
        const updated = ctx.db.update('order', id, { status: 'delivered' });
        return { status: 200, body: updated };
      }
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a pending or paid order. Cancelled is final.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'pending' && o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only pending and paid orders can be cancelled.');
        const updated = ctx.db.update('order', id, { status: 'cancelled' });
        return { status: 200, body: updated };
      }
  refund_order:
    method: POST
    path: /orders/{id}/refund
    description: Fully refund a paid, shipped or delivered order. Refunded is final.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'paid' && o.status !== 'shipped' && o.status !== 'delivered') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only paid, shipped and delivered orders can be refunded.');
        const updated = ctx.db.update('order', id, { status: 'refunded' });
        return { status: 200, body: updated };
      }
jobs: {}
