format: 1
meta:
  name: world
  description: Users save bookmarks into a nested folder tree and label them with per-user tags. Bookmarks move through unread, read, archived and trashed, and trash is purged after 30 days. Collections are private, shared with viewer/editor members, or public with an optional expiry. Actions enforce ownership, permission and folder-cycle rules and write an activity log. Two jobs purge old trash and expire public links.
  resembles: Pocket/Raindrop.io-style multi-user bookmark manager with folders, tags and shareable collections
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  user:
    description: A person who owns bookmarks, folders, tags and collections.
    idPrefix: usr
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 160
        format: email
  folder:
    description: Node in a user's nested folder tree; parent_id is null for a root folder.
    idPrefix: fld
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 120
      parent_id:
        type: ref
        description: Parent folder, null for a root folder. Changed only by move_folder.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: folder
        onDelete: restrict
  bookmark:
    description: A saved URL owned by one user, optionally in one folder, with a read-state. Status, owner, folder and trash time change only through actions.
    idPrefix: bkm
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      folder_id:
        type: ref
        description: Folder the bookmark is filed in, null when unfiled. Changed only by move_bookmark.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: folder
        onDelete: restrict
      url:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 2000
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 300
      notes:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - unread
          - read
          - archived
          - trashed
        initial: unread
        transitions:
          unread:
            - read
            - archived
            - trashed
          read:
            - archived
            - trashed
          archived:
            - trashed
          trashed:
            - unread
      trashed_at:
        type: datetime
        description: Set when trashed, cleared on restore. Trash is purged 30 days after this time.
        required: false
        nullable: true
        unique: false
        readonly: true
  tag:
    description: A per-user label.
    idPrefix: tag
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
  bookmark_tag:
    description: Link of a bookmark to one of its owner's tags. Created by the tag_bookmark action.
    idPrefix: btg
    fields:
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: bookmark
        onDelete: cascade
      tag_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: tag
        onDelete: cascade
  collection:
    description: A group of bookmarks with visibility private, shared or public (optional expiry). Visibility changes only through actions and the expire_public_links job.
    idPrefix: col
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 120
      visibility:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - private
          - shared
          - public
        initial: private
        transitions:
          private:
            - shared
            - public
          shared:
            - private
            - public
          public:
            - private
            - shared
      public_expires_at:
        type: datetime
        description: When a public collection reverts to shared or private; null means no expiry.
        required: false
        nullable: true
        unique: false
        readonly: true
  collection_member:
    description: A user granted viewer or editor access to a collection.
    idPrefix: cmb
    fields:
      collection_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: collection
        onDelete: cascade
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - viewer
          - editor
  collection_item:
    description: A bookmark placed in a collection by a user.
    idPrefix: cit
    fields:
      collection_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: collection
        onDelete: cascade
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: bookmark
        onDelete: cascade
      added_by:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
  activity:
    description: Log of actions and job runs; actor_id is null for jobs. Written by actions and jobs only.
    idPrefix: act
    fields:
      actor_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: user
        onDelete: nullify
      action:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 60
      bookmark_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: bookmark
        onDelete: nullify
      collection_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: collection
        onDelete: nullify
      folder_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: folder
        onDelete: nullify
routes:
  list_users:
    op: list
    entity: user
    filters: []
    search:
      - name
      - email
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /users
    description: List users, search by name or email.
  get_user:
    op: get
    entity: user
    method: GET
    path: /users/{id}
    description: Get a user.
  create_user:
    op: create
    entity: user
    method: POST
    path: /users
    description: Register a user.
  list_folders:
    op: list
    entity: folder
    filters:
      - owner_id
      - parent_id
    search:
      - name
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /folders
    description: List folders, filter by owner_id and parent_id.
  get_folder:
    op: get
    entity: folder
    method: GET
    path: /folders/{id}
    description: Get a folder.
  list_bookmarks:
    op: list
    entity: bookmark
    filters:
      - owner_id
      - folder_id
      - status
    search:
      - title
      - url
    sort:
      - title
      - created_at
    pageSize: 25
    method: GET
    path: /bookmarks
    description: List bookmarks, filter by owner_id, folder_id and status.
  get_bookmark:
    op: get
    entity: bookmark
    method: GET
    path: /bookmarks/{id}
    description: Get a bookmark.
  update_bookmark:
    op: update
    entity: bookmark
    method: PATCH
    path: /bookmarks/{id}
    description: Edit title and notes only.
  list_tags:
    op: list
    entity: tag
    filters:
      - owner_id
    search:
      - name
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /tags
    description: List tags, filter by owner_id.
  get_tag:
    op: get
    entity: tag
    method: GET
    path: /tags/{id}
    description: Get a tag.
  create_tag:
    op: create
    entity: tag
    method: POST
    path: /tags
    description: Create a per-user tag.
  list_bookmark_tags:
    op: list
    entity: bookmark_tag
    filters:
      - bookmark_id
      - tag_id
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /bookmark_tags
    description: List bookmark-tag links, filter by bookmark_id and tag_id.
  list_collections:
    op: list
    entity: collection
    filters:
      - owner_id
      - visibility
    search:
      - name
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /collections
    description: List collections, filter by owner_id and visibility.
  get_collection:
    op: get
    entity: collection
    method: GET
    path: /collections/{id}
    description: Get a collection.
  list_collection_members:
    op: list
    entity: collection_member
    filters:
      - role
      - user_id
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /collections/{collection_id}/members
    description: List members of a collection.
  list_collection_items:
    op: list
    entity: collection_item
    filters:
      - bookmark_id
      - added_by
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /collections/{collection_id}/items
    description: List items of a collection.
  list_activity:
    op: list
    entity: activity
    filters:
      - actor_id
      - action
      - bookmark_id
      - collection_id
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /activity
    description: List activity, filter by actor_id, action, bookmark_id and collection_id.
actions:
  create_bookmark:
    method: POST
    path: /bookmarks
    description: Save a bookmark for the actor, optionally into one of the actor's folders.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      url:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 2000
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 300
      notes:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      folder_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const b = ctx.body;
        const actor = ctx.db.get('user', b.actor_id);
        if (actor === null) ctx.fail(404, 'not_found', 'user ' + b.actor_id + ' not found');
        const fid = b.folder_id === undefined ? null : b.folder_id;
        if (fid !== null) {
          const f = ctx.db.get('folder', fid);
          if (f === null) ctx.fail(404, 'not_found', 'folder ' + fid + ' not found');
          if (f.owner_id !== actor.id) ctx.fail(409, 'not_owner', 'folder ' + fid + ' belongs to another user');
        }
        const row = ctx.db.create('bookmark', { owner_id: actor.id, folder_id: fid, url: b.url, title: b.title, notes: b.notes === undefined ? null : b.notes, trashed_at: null });
        ctx.db.create('activity', { actor_id: actor.id, action: 'create_bookmark', bookmark_id: row.id });
        return { status: 201, body: row };
      }
  mark_read:
    method: POST
    path: /bookmarks/{id}/read
    description: Mark an unread bookmark as read.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'bookmark ' + bm.id + ' belongs to another user');
        if (bm.status !== 'unread') ctx.fail(409, 'invalid_state', 'bookmark is ' + bm.status + '. Only unread bookmarks can be marked read.');
        const u = ctx.db.update('bookmark', bm.id, { status: 'read' });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'mark_read', bookmark_id: bm.id });
        return { status: 200, body: u };
      }
  archive_bookmark:
    method: POST
    path: /bookmarks/{id}/archive
    description: Archive an unread or read bookmark.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'bookmark ' + bm.id + ' belongs to another user');
        if (bm.status !== 'unread' && bm.status !== 'read') ctx.fail(409, 'invalid_state', 'bookmark is ' + bm.status + '. Only unread or read bookmarks can be archived.');
        const u = ctx.db.update('bookmark', bm.id, { status: 'archived' });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'archive_bookmark', bookmark_id: bm.id });
        return { status: 200, body: u };
      }
  trash_bookmark:
    method: POST
    path: /bookmarks/{id}/trash
    description: Move a bookmark to the trash; it is purged after 30 days.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'bookmark ' + bm.id + ' belongs to another user');
        if (bm.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark is already trashed');
        const u = ctx.db.update('bookmark', bm.id, { status: 'trashed', trashed_at: ctx.now() });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'trash_bookmark', bookmark_id: bm.id });
        return { status: 200, body: u };
      }
  restore_bookmark:
    method: POST
    path: /bookmarks/{id}/restore
    description: Restore a trashed bookmark to unread.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'bookmark ' + bm.id + ' belongs to another user');
        if (bm.status !== 'trashed') ctx.fail(409, 'invalid_state', 'bookmark is ' + bm.status + '. Only trashed bookmarks can be restored.');
        const u = ctx.db.update('bookmark', bm.id, { status: 'unread', trashed_at: null });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'restore_bookmark', bookmark_id: bm.id });
        return { status: 200, body: u };
      }
  move_bookmark:
    method: POST
    path: /bookmarks/{id}/move
    description: Move a bookmark into one of the actor's folders, or unfile it with a null folder_id.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      folder_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'bookmark ' + bm.id + ' belongs to another user');
        const fid = ctx.body.folder_id === undefined ? null : ctx.body.folder_id;
        if (fid !== null) {
          const f = ctx.db.get('folder', fid);
          if (f === null) ctx.fail(404, 'not_found', 'folder ' + fid + ' not found');
          if (f.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'folder ' + fid + ' belongs to another user');
        }
        const u = ctx.db.update('bookmark', bm.id, { folder_id: fid });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'move_bookmark', bookmark_id: bm.id, folder_id: fid });
        return { status: 200, body: u };
      }
  tag_bookmark:
    method: POST
    path: /bookmarks/{id}/tag
    description: Attach one of the owner's tags to a bookmark, once.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      tag_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: tag
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'bookmark ' + bm.id + ' belongs to another user');
        const tag = ctx.db.get('tag', ctx.body.tag_id);
        if (tag === null) ctx.fail(404, 'not_found', 'tag ' + ctx.body.tag_id + ' not found');
        if (tag.owner_id !== bm.owner_id) ctx.fail(409, 'tag_not_owned', 'tag ' + tag.id + ' does not belong to the bookmark owner');
        if (ctx.db.list('bookmark_tag', { where: { bookmark_id: bm.id, tag_id: tag.id } }).length > 0) ctx.fail(409, 'already_tagged', 'bookmark already has tag ' + tag.id);
        const link = ctx.db.create('bookmark_tag', { bookmark_id: bm.id, tag_id: tag.id });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'tag_bookmark', bookmark_id: bm.id });
        return { status: 201, body: link };
      }
  create_folder:
    method: POST
    path: /folders
    description: Create a folder for the actor, optionally under one of the actor's folders.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      parent_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const b = ctx.body;
        if (ctx.db.get('user', b.actor_id) === null) ctx.fail(404, 'not_found', 'user ' + b.actor_id + ' not found');
        const pid = b.parent_id === undefined ? null : b.parent_id;
        if (pid !== null) {
          const p = ctx.db.get('folder', pid);
          if (p === null) ctx.fail(404, 'not_found', 'folder ' + pid + ' not found');
          if (p.owner_id !== b.actor_id) ctx.fail(409, 'not_owner', 'folder ' + pid + ' belongs to another user');
        }
        const row = ctx.db.create('folder', { owner_id: b.actor_id, name: b.name, parent_id: pid });
        ctx.db.create('activity', { actor_id: b.actor_id, action: 'create_folder', folder_id: row.id });
        return { status: 201, body: row };
      }
  move_folder:
    method: POST
    path: /folders/{id}/move
    description: Re-parent a folder; refuses moves under itself or its descendants.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      parent_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const f = ctx.db.get('folder', ctx.params.id);
        if (f === null) ctx.fail(404, 'not_found', 'folder ' + ctx.params.id + ' not found');
        if (f.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'folder ' + f.id + ' belongs to another user');
        const pid = ctx.body.parent_id === undefined ? null : ctx.body.parent_id;
        if (pid !== null) {
          const p = ctx.db.get('folder', pid);
          if (p === null) ctx.fail(404, 'not_found', 'folder ' + pid + ' not found');
          if (p.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'folder ' + pid + ' belongs to another user');
          let cur = p;
          let guard = 0;
          while (cur !== null && guard < 1000) {
            if (cur.id === f.id) ctx.fail(409, 'folder_cycle', 'folder ' + f.id + ' cannot be moved under itself or its descendant ' + pid);
            cur = cur.parent_id === null ? null : ctx.db.get('folder', cur.parent_id);
            guard++;
          }
        }
        const u = ctx.db.update('folder', f.id, { parent_id: pid });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'move_folder', folder_id: f.id });
        return { status: 200, body: u };
      }
  create_collection:
    method: POST
    path: /collections
    description: Create a private collection owned by the actor.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
    handler: |-
      (ctx) => {
        if (ctx.db.get('user', ctx.body.actor_id) === null) ctx.fail(404, 'not_found', 'user ' + ctx.body.actor_id + ' not found');
        const row = ctx.db.create('collection', { owner_id: ctx.body.actor_id, name: ctx.body.name, public_expires_at: null });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'create_collection', collection_id: row.id });
        return { status: 201, body: row };
      }
  add_collection_member:
    method: POST
    path: /collections/{id}/add_member
    description: Owner grants a viewer or editor role; a private collection becomes shared.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - viewer
          - editor
    handler: |-
      (ctx) => {
        const c = ctx.db.get('collection', ctx.params.id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + ctx.params.id + ' not found');
        if (c.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'only the owner can add members');
        if (ctx.db.get('user', ctx.body.user_id) === null) ctx.fail(404, 'not_found', 'user ' + ctx.body.user_id + ' not found');
        if (ctx.db.list('collection_member', { where: { collection_id: c.id, user_id: ctx.body.user_id } }).length > 0) ctx.fail(409, 'already_member', 'user is already a member');
        const m = ctx.db.create('collection_member', { collection_id: c.id, user_id: ctx.body.user_id, role: ctx.body.role });
        if (c.visibility === 'private') ctx.db.update('collection', c.id, { visibility: 'shared' });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'add_collection_member', collection_id: c.id });
        return { status: 201, body: m };
      }
  add_collection_item:
    method: POST
    path: /collections/{id}/add_item
    description: Owner or editor adds one of their own bookmarks to a collection.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bookmark
        onDelete: restrict
    handler: |-
      (ctx) => {
        const c = ctx.db.get('collection', ctx.params.id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + ctx.params.id + ' not found');
        const bm = ctx.db.get('bookmark', ctx.body.bookmark_id);
        if (bm === null) ctx.fail(404, 'not_found', 'bookmark ' + ctx.body.bookmark_id + ' not found');
        const actor = ctx.body.actor_id;
        let allowed = c.owner_id === actor;
        if (!allowed) {
          allowed = ctx.db.list('collection_member', { where: { collection_id: c.id, user_id: actor } }).some((m) => m.role === 'editor');
        }
        if (!allowed) ctx.fail(409, 'permission_denied', 'only the owner or an editor can add items');
        if (bm.owner_id !== actor) ctx.fail(409, 'not_owner', 'bookmark ' + bm.id + ' belongs to another user');
        if (ctx.db.list('collection_item', { where: { collection_id: c.id, bookmark_id: bm.id } }).length > 0) ctx.fail(409, 'already_in_collection', 'bookmark is already in the collection');
        const it = ctx.db.create('collection_item', { collection_id: c.id, bookmark_id: bm.id, added_by: actor });
        ctx.db.create('activity', { actor_id: actor, action: 'add_collection_item', bookmark_id: bm.id, collection_id: c.id });
        return { status: 201, body: it };
      }
  make_public:
    method: POST
    path: /collections/{id}/make_public
    description: Owner makes a collection public, optionally expiring after expires_in_hours.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      expires_in_hours:
        type: int
        required: false
        nullable: true
        unique: false
        readonly: false
        min: 1
    handler: |-
      (ctx) => {
        const c = ctx.db.get('collection', ctx.params.id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + ctx.params.id + ' not found');
        if (c.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'only the owner can change visibility');
        const h = ctx.body.expires_in_hours;
        const exp = (h === undefined || h === null) ? null : ctx.time.plus(ctx.now(), h + 'h');
        const patch = { public_expires_at: exp };
        if (c.visibility !== 'public') patch.visibility = 'public';
        const u = ctx.db.update('collection', c.id, patch);
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'make_public', collection_id: c.id });
        return { status: 200, body: u };
      }
  make_private:
    method: POST
    path: /collections/{id}/make_private
    description: Owner makes a collection private, removing all members and the expiry.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const c = ctx.db.get('collection', ctx.params.id);
        if (c === null) ctx.fail(404, 'not_found', 'collection ' + ctx.params.id + ' not found');
        if (c.owner_id !== ctx.body.actor_id) ctx.fail(409, 'not_owner', 'only the owner can change visibility');
        for (const m of ctx.db.list('collection_member', { where: { collection_id: c.id } })) ctx.db.delete('collection_member', m.id);
        const patch = { public_expires_at: null };
        if (c.visibility !== 'private') patch.visibility = 'private';
        const u = ctx.db.update('collection', c.id, patch);
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'make_private', collection_id: c.id });
        return { status: 200, body: u };
      }
jobs:
  purge_trash:
    description: "Daily: delete bookmarks trashed 30 or more days ago, cascading collection items and detaching activity."
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const b of ctx.db.list('bookmark', { where: { status: 'trashed' } })) {
          if (b.trashed_at === null) continue;
          if (ctx.time.minutesBetween(b.trashed_at, now) >= 43200) ctx.db.delete('bookmark', b.id);
        }
      }
  expire_public_links:
    description: "Hourly: expired public collections revert to shared if they have members, else private."
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const c of ctx.db.list('collection', { where: { visibility: 'public' } })) {
          if (c.public_expires_at === null) continue;
          if (ctx.time.minutesBetween(c.public_expires_at, now) < 0) continue;
          const members = ctx.db.list('collection_member', { where: { collection_id: c.id } });
          ctx.db.update('collection', c.id, { visibility: members.length > 0 ? 'shared' : 'private', public_expires_at: null });
        }
      }
