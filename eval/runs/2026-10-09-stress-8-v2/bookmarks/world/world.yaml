              for (const b of r.body.data) {
                if (b.owner_id === sam.id && b.folder_id === rec.id && b.status === 'archived') targets.push(b);
              }
              cursor = r.body.next_cursor;
            } while (cursor !== null && cursor !== undefined);
            for (const t of targets) {
              const tr = ctx.api('POST', '/bookmarks/' + t.id + '/trash', { actor_id: sam.id });
              ctx.assert(tr.status === 200, 'trash failed');
