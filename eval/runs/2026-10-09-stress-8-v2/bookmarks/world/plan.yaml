open_questions:
  - question: Can a bookmark be in several collections?
    default_answer: Yes, once per collection.
  - question: Do viewers see private bookmarks of others?
    default_answer: Out of scope; access is only enforced on adding items and members.
  - question: Should purge also keep trashed bookmarks' tag links?
    default_answer: Tag links are removed with the bookmark (cascade).
assumptions:
  - decision: Clock starts 2026-10-09T09:00:00Z with tick 0s; seeded history precedes it, public expiries seeded after it.
    why: Deterministic time; jobs run only on explicit advance.
  - decision: Acting user is passed as actor_id in each action body; there is no authentication.
    why: The world has no sessions; ownership and permission rules need an explicit actor.
  - decision: Permission failures use 409 with codes not_owner, permission_denied, tag_not_owned; state errors use 409 invalid_state.
    why: ctx.fail only allows 400/404/409/422.
  - decision: Actions create bookmarks, folders, collections, members, items and tag links (201); users and tags use standard create routes.
    why: Rules and activity logging must not be bypassable.
  - decision: Restore moves a trashed bookmark to unread; mark_read only from unread.
    why: Original read state is not retained.
  - decision: Expired public collections revert to shared if they have members, otherwise private.
    why: Preserves existing member access.
  - decision: Folder workflow is descriptive with a single active state.
    why: Folders have no state field.
  - decision: Purge deletes the bookmark, cascades its collection items and nullifies activity.bookmark_id.
    why: Keeps the audit log without dangling refs.
outOfScope:
  - what: Authentication, sessions and API tokens
    why: The actor is passed explicitly; auth is not the core value.
  - what: Fetching page metadata, screenshots or full-text search of page content
    why: Computation, not stateful records.
  - what: Import/export of bookmark files and browser extensions
    why: Not needed for the record workflows.
