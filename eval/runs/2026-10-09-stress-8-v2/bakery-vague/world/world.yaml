        script: "(ctx) => { const cs = ctx.api('GET', '/customers?q=Maria').body.data.map((c) => c.id); const lena = ctx.api('GET', '/customers?q=Fischer').body.data.find((x) => x.name === 'Lena Fischer'); cs.push(lena.id); const disc = new Set(ctx.api('GET', '/products?limit=25').body.data.filter((p) => p.name.includes('discontinued')).map((p) => p.id)); const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null && cursor !== undefined); const targets = orders.filter((o) => cs.includes(o.customer_id) && o.status === 'placed'); for (const o of targets) { if (disc.has(o.product_id)) { ctx.api('POST', '/orders/' + o.id + '/cancel', {}); } else { ctx.api('POST', '/orders/' + o.id + '/start_baking', {}); ctx.api('POST', '/orders/' + o.id + '/mark_ready', {}); } } }"
