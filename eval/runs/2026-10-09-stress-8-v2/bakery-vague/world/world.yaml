format: 1
meta:
  name: world
  description: A neighborhood bakery tracks its products and stock, customers, and pre-orders. Orders move from placed to baking to ready to picked up, can be cancelled before they are ready, and stock is reserved when an order is placed. A daily job cancels ready orders that nobody collected.
  resembles: Square-for-Retail / Toast-style bakery order and pickup system
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T08:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  product:
    description: A baked good for sale with a price, category and stock on hand.
    idPrefix: prd
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 120
      category:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - bread
          - pastry
          - cake
          - cookie
      price:
        type: money
        description: Unit price in USD cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      stock:
        type: int
        description: Units on hand. Reduced when an order is placed and returned when it is cancelled.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
  customer:
    description: A person who places pre-orders for pickup.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 160
        format: email
      phone:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 30
  order:
    description: A pre-order of one product in a quantity by one customer, moving through bakery states. Written only by workflow actions and the expiry job.
    idPrefix: ord
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: customer
        onDelete: restrict
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: product
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 1
      total:
        type: money
        description: quantity times the product price at placement.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - placed
          - baking
          - ready
          - picked_up
          - cancelled
        initial: placed
        transitions:
          placed:
            - baking
            - cancelled
          baking:
            - ready
            - cancelled
          ready:
            - picked_up
            - cancelled
          picked_up: []
          cancelled: []
      ready_at:
        type: datetime
        description: When the order became ready for pickup; null before that.
        required: false
        nullable: true
        unique: false
        readonly: true
routes:
  list_products:
    op: list
    entity: product
    filters:
      - category
    search:
      - name
    sort:
      - name
      - price
      - stock
    pageSize: 25
    method: GET
    path: /products
    description: List products, filter by category, search by name.
  get_product:
    op: get
    entity: product
    method: GET
    path: /products/{id}
    description: Fetch one product.
  create_product:
    op: create
    entity: product
    method: POST
    path: /products
    description: Add a product.
  update_product:
    op: update
    entity: product
    method: PATCH
    path: /products/{id}
    description: Edit price, name, category or restock.
  list_customers:
    op: list
    entity: customer
    filters: []
    search:
      - name
      - email
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /customers
    description: List customers, search by name and email.
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /customers/{id}
    description: Fetch one customer.
  create_customer:
    op: create
    entity: customer
    method: POST
    path: /customers
    description: Register a customer.
  list_orders:
    op: list
    entity: order
    filters:
      - status
      - customer_id
      - product_id
    search: []
    sort:
      - created_at
      - ready_at
    pageSize: 25
    method: GET
    path: /orders
    description: List orders, filter by status, customer and product.
  get_order:
    op: get
    entity: order
    method: GET
    path: /orders/{id}
    description: Fetch one order.
actions:
  place_order:
    method: POST
    path: /orders
    description: Place a pre-order; reserves stock and computes total.
    input:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const b = ctx.body;
        if (!Number.isInteger(b.quantity) || b.quantity < 1) ctx.fail(400, 'input.invalid', 'quantity must be an integer of at least 1');
        const c = ctx.db.get('customer', b.customer_id);
        if (c === null) ctx.fail(404, 'not_found', 'customer ' + b.customer_id + ' not found');
        const p = ctx.db.get('product', b.product_id);
        if (p === null) ctx.fail(404, 'not_found', 'product ' + b.product_id + ' not found');
        if (b.quantity > p.stock) ctx.fail(409, 'insufficient_stock', 'only ' + p.stock + ' of ' + p.name + ' in stock, requested ' + b.quantity);
        ctx.db.update('product', p.id, { stock: p.stock - b.quantity });
        const o = ctx.db.create('order', { customer_id: c.id, product_id: p.id, quantity: b.quantity, total: b.quantity * p.price, ready_at: null });
        return { status: 201, body: o };
      }
  start_baking:
    method: POST
    path: /orders/{id}/start_baking
    description: Move a placed order to baking.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'placed') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only placed orders can start baking.');
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'baking' }) };
      }
  mark_ready:
    method: POST
    path: /orders/{id}/mark_ready
    description: Move a baking order to ready and stamp ready_at.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'baking') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only baking orders can be marked ready.');
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'ready', ready_at: ctx.now() }) };
      }
  pick_up_order:
    method: POST
    path: /orders/{id}/pick_up
    description: Customer collects a ready order.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'ready') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only ready orders can be picked up.');
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'picked_up' }) };
      }
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a placed or baking order and return its stock.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'placed' && o.status !== 'baking') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only placed or baking orders can be cancelled.');
        const p = ctx.db.get('product', o.product_id);
        ctx.db.update('product', p.id, { stock: p.stock + o.quantity });
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'cancelled' }) };
      }
jobs:
  expire_ready_orders:
    description: "Daily: cancel ready orders uncollected for 2 days or more and return their stock."
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const o of ctx.db.list('order', { where: { status: 'ready' } })) {
          if (o.ready_at === null || ctx.time.minutesBetween(o.ready_at, now) < 2880) continue;
          const p = ctx.db.get('product', o.product_id);
          ctx.db.update('product', p.id, { stock: p.stock + o.quantity });
          ctx.db.update('order', o.id, { status: 'cancelled' });
        }
      }
fixtures: {}
