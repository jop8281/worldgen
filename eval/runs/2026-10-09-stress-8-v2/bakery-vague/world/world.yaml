  fulfil_customer_placed_orders:
    difficulty: hard
    instruction: "Maria Lopez and Lena Fischer are both coming in to collect their pre-orders today. For each of them, take every order that is still placed through baking to ready so it can be handed over. The exception is any order for a product whose name says it is discontinued: cancel that order instead so its stock goes back on the shelf. Look through the full order list so none is missed, do not touch their other orders or anyone else's, and take care because customer names here can be near-identical."
    grader: "(ctx) => { const custs = ['Maria Lopez', 'Lena Fischer'].map((n) => ctx.seed.list('customer', { where: { name: n } })[0]); if (custs.some((c) => !c)) return 0; const disc = new Set(ctx.seed.list('product').filter((p) => p.name.includes('discontinued')).map((p) => p.id)); const targets = []; for (const c of custs) { for (const o of ctx.seed.list('order', { where: { customer_id: c.id, status: 'placed' } })) targets.push(o); } if (targets.length === 0) return 0; const allowed = []; const back = {}; for (const t of targets) { if (disc.has(t.product_id)) { allowed.push({ entity: 'order', id: t.id, kind: 'updated', fields: ['status'] }); back[t.product_id] = (back[t.product_id] || 0) + t.quantity; } else { allowed.push({ entity: 'order', id: t.id, kind: 'updated', fields: ['status', 'ready_at'] }); } } for (const pid of Object.keys(back)) allowed.push({ entity: 'product', id: pid, kind: 'updated', fields: ['stock'] }); ctx.guardChanges('only the two customers placed orders and the discontinued stock change', allowed); const isReady = (t) => { const e = ctx.db.get('order', t.id); return !!e && e.status === 'ready' && e.ready_at !== null; }; const isCancelled = (t) => { const e = ctx.db.get('order', t.id); return !!e && e.status === 'cancelled'; }; const maria = targets.filter((t) => t.customer_id === custs[0].id && !disc.has(t.product_id)); ctx.goal(0.3, 'Maria non-discontinued orders are ready', maria.length > 0 && maria.every(isReady)); const lena = targets.filter((t) => t.customer_id === custs[1].id); ctx.goal(0.3, 'Lena orders handled', lena.length > 0 && lena.every((t) => (disc.has(t.product_id) ? isCancelled(t) : isReady(t)))); const dis = targets.filter((t) => disc.has(t.product_id)); ctx.goal(0.4, 'discontinued orders cancelled and stock returned once', dis.length > 0 && dis.every(isCancelled) && Object.keys(back).every((pid) => ctx.db.get('product', pid).stock === ctx.seed.get('product', pid).stock + back[pid])); return ctx.score(); }"
    solution: "(ctx) => { const find = (q, name) => { const r = ctx.api('GET', '/customers?q=' + q); ctx.assert(r.status === 200, 'customer search failed'); const c = r.body.data.find((x) => x.name === name); ctx.assert(c, 'customer ' + name + ' not found'); return c; }; const maria = find('Lopez', 'Maria Lopez'); const lena = find('Fischer', 'Lena Fischer'); const pr = ctx.api('GET', '/products?limit=25'); ctx.assert(pr.status === 200, 'product list failed'); const disc = new Set(pr.body.data.filter((p) => p.name.includes('discontinued')).map((p) => p.id)); const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'order list failed: ' + JSON.stringify(r.body)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null && cursor !== undefined); const targets = orders.filter((o) => (o.customer_id === maria.id || o.customer_id === lena.id) && o.status === 'placed'); ctx.assert(targets.length > 0, 'no placed orders found'); for (const o of targets) { if (disc.has(o.product_id)) { const c = ctx.api('POST', '/orders/' + o.id + '/cancel', {}); ctx.assert(c.status === 200, 'cancel failed: ' + JSON.stringify(c.body)); } else { const b = ctx.api('POST', '/orders/' + o.id + '/start_baking', {}); ctx.assert(b.status === 200, 'start_baking failed: ' + JSON.stringify(b.body)); const m = ctx.api('POST', '/orders/' + o.id + '/mark_ready', {}); ctx.assert(m.status === 200, 'mark_ready failed: ' + JSON.stringify(m.body)); } } const check = ctx.api('GET', '/orders?customer_id=' + maria.id); ctx.assert(check.status === 200 && check.body.data.every((o) => o.status !== 'placed'), 'Maria still has placed orders'); }"
    decoys:
      - why: reads only the first page of orders, so it handles Maria Lopez but misses Lena Fischer's placed order on the later page
        script: (ctx) => { const maria = ctx.api('GET', '/customers?q=Lopez').body.data.find((x) => x.name === 'Maria Lopez'); const lena = ctx.api('GET', '/customers?q=Fischer').body.data.find((x) => x.name === 'Lena Fischer'); const disc = new Set(ctx.api('GET', '/products?limit=25').body.data.filter((p) => p.name.includes('discontinued')).map((p) => p.id)); const orders = ctx.api('GET', '/orders?limit=25').body.data; const targets = orders.filter((o) => (o.customer_id === maria.id || o.customer_id === lena.id) && o.status === 'placed'); for (const o of targets) { if (disc.has(o.product_id)) { ctx.api('POST', '/orders/' + o.id + '/cancel', {}); } else { ctx.api('POST', '/orders/' + o.id + '/start_baking', {}); ctx.api('POST', '/orders/' + o.id + '/mark_ready', {}); } } }
