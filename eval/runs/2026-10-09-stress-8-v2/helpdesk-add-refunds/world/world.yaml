          ctx.assert(ctx.api('POST', '/refunds/' + rf.body.id + '/approve', { supervisor_id: sup.id }).status === 200, 'approve failed');
          ctx.assert(ctx.api('POST', '/tickets/' + t.id + '/resolve', { agent_id: t.assignee_id }).status === 200, 'resolve failed');
