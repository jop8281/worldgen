  customer_confirms_then_resolve:
    difficulty: hard
    instruction: 'Noor Rahman wrote in about order ORD-10245 and her ticket about that order is pending, waiting on her. She has confirmed the problem is fixed. First record her reply on that ticket with exactly this text: "Thanks, the replacement arrived and everything is working now. Please close this ticket." Then resolve the ticket as the agent assigned to it. Do not touch her other tickets.'
    grader: |-
      (ctx) => {
      const ord = ctx.seed.list('order', { where: { number: 'ORD-10245' } })[0];
      if (!ord) return 0;
      const t = ctx.seed.list('ticket', { where: { order_id: ord.id } }).find((x) => x.status === 'pending');
      if (!t) return 0;
      const msg = 'Thanks, the replacement arrived and everything is working now. Please close this ticket.';
      const made = ctx.changes().filter((c) => c.entity === 'comment' && c.kind === 'created');
      const allowed = [{ entity: 'ticket', id: t.id, kind: 'updated', fields: ['status', 'resolved_at'] }].concat(made.map((c) => ({ entity: 'comment', id: c.id, kind: 'created', fields: c.fields || [] })));
      ctx.guardChanges('only the target ticket and its new comments changed', allowed);
      ctx.guard('every new comment is a customer comment on the target ticket', made.every((c) => { const row = ctx.db.get('comment', c.id); return row.ticket_id === t.id && row.author_kind === 'customer'; }));
      const end = ctx.db.get('ticket', t.id);
      const mine = made.map((c) => ctx.db.get('comment', c.id));
      ctx.goal(0.5, 'the customer reply with the exact text is recorded on the target ticket', mine.length === 1 && mine[0].body === msg);
      ctx.goal(0.5, 'the target ticket is resolved by its assignee', end.status === 'resolved' && end.resolved_at !== null && end.assignee_id === t.assignee_id);
      return ctx.score();
      }
    solution: |-
      (ctx) => {
      const msg = 'Thanks, the replacement arrived and everything is working now. Please close this ticket.';
      const ord = ctx.api('GET', '/orders?number=ORD-10245').body.data[0];
      ctx.assert(ord, 'order ORD-10245 not found');
      let cursor = null;
      let target = null;
      for (let i = 0; i < 10 && !target; i++) {
        const r = ctx.api('GET', '/tickets?limit=25' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''));
        target = r.body.data.find((x) => x.order_id === ord.id && x.status === 'pending') || null;
        cursor = r.body.next_cursor;
        if (!cursor) break;
      }
      ctx.assert(target, 'pending ticket for the order not found');
      const open = ctx.api('GET', '/tickets?customer_id=' + target.customer_id + '&status=open').body.data;
      ctx.assert(open.every((x) => x.id !== target.id), 'open tickets of the customer are other tickets');
      ctx.assert(target.assignee_id, 'ticket has no assignee');
      const r1 = ctx.api('POST', '/tickets/' + target.id + '/customer_reply', { body: msg });
      ctx.assert(r1.status === 200, 'customer reply failed: ' + JSON.stringify(r1.body));
      const r2 = ctx.api('POST', '/tickets/' + target.id + '/resolve', { agent_id: target.assignee_id });
      ctx.assert(r2.status === 200, 'resolve failed: ' + JSON.stringify(r2.body));
      }
    decoys:
      - why: resolves the ticket as its assignee without recording the customer's reply
        script: |-
          (ctx) => {
          const ord = ctx.api('GET', '/orders?number=ORD-10245').body.data[0];
          const t = ctx.api('GET', '/tickets?order_id=' + ord.id + '&status=pending').body.data[0];
          ctx.api('POST', '/tickets/' + t.id + '/resolve', { agent_id: t.assignee_id });
          }
      - why: posts only the customer's reply and never resolves, leaving the ticket open
        script: |-
          (ctx) => {
          const msg = 'Thanks, the replacement arrived and everything is working now. Please close this ticket.';
          const ord = ctx.api('GET', '/orders?number=ORD-10245').body.data[0];
          const t = ctx.api('GET', '/tickets?order_id=' + ord.id + '&status=pending').body.data[0];
          ctx.api('POST', '/tickets/' + t.id + '/customer_reply', { body: msg });
          }
      - why: records the reply and resolves Noor's other pending ticket, about a different order, instead of the one about ORD-10245
        script: |-
          (ctx) => {
          const msg = 'Thanks, the replacement arrived and everything is working now. Please close this ticket.';
          const ord = ctx.api('GET', '/orders?number=ORD-10245').body.data[0];
          const pending = ctx.api('GET', '/tickets?customer_id=' + ord.customer_id + '&status=pending').body.data;
          const other = pending.find((x) => x.order_id !== ord.id);
          ctx.api('POST', '/tickets/' + other.id + '/customer_reply', { body: msg });
          ctx.api('POST', '/tickets/' + other.id + '/resolve', { agent_id: other.assignee_id });
          }
    alternatives: []
    allows:
      - entity: ticket
        kind: updated
        fields:
          - status
          - resolved_at
        where:
          order_id: ord_0003
          status: pending
      - entity: comment
        kind: created
        fields: []
        where:
          ticket_id: tkt_0031
          author_kind: customer
  approve_large_refund_and_resolve:
    difficulty: medium
    instruction: Jack Turner has a pending ticket about order ORD-10350, assigned to one of the agents. As that assigned agent, request a $750 refund (75000 cents) on the ticket with the reason "Order lost in transit". A refund that large needs a supervisor, so have the supervisor Helen Overton approve it. Then resolve the ticket as its assigned agent. Do not touch Jack's other tickets.
    grader: |-
      (ctx) => {
      const ord = ctx.seed.list('order', { where: { number: 'ORD-10350' } })[0];
      if (!ord) return 0;
      const t = ctx.seed.list('ticket', { where: { order_id: ord.id } })[0];
      const helen = ctx.seed.list('agent', { where: { email: 'helen.overton@support.example' } })[0];
      if (!t || !helen) return 0;
      const made = ctx.changes().filter((c) => c.entity === 'refund' && c.kind === 'created');
      const rows = made.map((c) => ctx.db.get('refund', c.id));
      const allowed = [{ entity: 'ticket', id: t.id, kind: 'updated', fields: ['status', 'resolved_at'] }].concat(made.map((c) => ({ entity: 'refund', id: c.id, kind: 'created', fields: c.fields || [] })));
      ctx.guardChanges('only the target ticket status and new refunds on it changed', allowed);
      ctx.guard('every new refund is on the target ticket and its order', rows.every((r) => r.ticket_id === t.id && r.order_id === ord.id));
      const end = ctx.db.get('ticket', t.id);
      const r = rows.length === 1 ? rows[0] : null;
      const requested = r !== null && r.amount === 75000 && r.reason === 'Order lost in transit' && r.requested_by === t.assignee_id;
      const approved = requested && r.status === 'approved' && r.decided_by === helen.id && r.decided_at !== null;
      ctx.goal(0.3, 'the assigned agent requested the $750 refund with the given reason', requested);
      ctx.goal(0.3, 'Helen Overton approved the refund', approved);
      ctx.goal(0.4, 'the target ticket is resolved', end.status === 'resolved' && end.resolved_at !== null);
      return ctx.score();
      }
    solution: |-
      (ctx) => {
      const ord = ctx.api('GET', '/orders?number=ORD-10350').body.data[0];
      ctx.assert(ord, 'order ORD-10350 not found');
      const t = ctx.api('GET', '/tickets?order_id=' + ord.id).body.data.find((x) => x.status === 'pending');
      ctx.assert(t && t.assignee_id, 'pending assigned ticket for the order not found');
      const others = ctx.api('GET', '/tickets?customer_id=' + t.customer_id).body.data.filter((x) => x.id !== t.id);
      ctx.assert(others.every((x) => x.order_id !== ord.id), 'other tickets of the customer are about other orders');
      const sup = ctx.api('GET', '/agents?email=helen.overton@support.example').body.data[0];
      ctx.assert(sup && sup.role === 'supervisor' && sup.active, 'active supervisor Helen Overton not found');
      const rf = ctx.api('POST', '/tickets/' + t.id + '/refunds', { agent_id: t.assignee_id, amount: 75000, reason: 'Order lost in transit' });
      ctx.assert(rf.status === 201 && rf.body.status === 'pending', 'refund request failed: ' + JSON.stringify(rf.body));
      const ap = ctx.api('POST', '/refunds/' + rf.body.id + '/approve', { supervisor_id: sup.id });
      ctx.assert(ap.status === 200, 'approve failed: ' + JSON.stringify(ap.body));
      const rs = ctx.api('POST', '/tickets/' + t.id + '/resolve', { agent_id: t.assignee_id });
      ctx.assert(rs.status === 200, 'resolve failed: ' + JSON.stringify(rs.body));
      }
    decoys:
      - why: requests the refund as the assignee but never has a supervisor approve it, so the refund stays pending and the ticket stays unresolved
        script: |-
          (ctx) => {
          const ord = ctx.api('GET', '/orders?number=ORD-10350').body.data[0];
          const t = ctx.api('GET', '/tickets?order_id=' + ord.id).body.data.find((x) => x.status === 'pending');
          ctx.api('POST', '/tickets/' + t.id + '/refunds', { agent_id: t.assignee_id, amount: 75000, reason: 'Order lost in transit' });
          }
      - why: requests only $500 so it is approved at once without a supervisor, then resolves the ticket; the refund is not the $750 asked for
        script: |-
          (ctx) => {
          const ord = ctx.api('GET', '/orders?number=ORD-10350').body.data[0];
          const t = ctx.api('GET', '/tickets?order_id=' + ord.id).body.data.find((x) => x.status === 'pending');
          ctx.api('POST', '/tickets/' + t.id + '/refunds', { agent_id: t.assignee_id, amount: 50000, reason: 'Order lost in transit' });
          ctx.api('POST', '/tickets/' + t.id + '/resolve', { agent_id: t.assignee_id });
          }
      - why: does the refund and supervisor approval on Jack's other ticket, about a different order, instead of the ticket about ORD-10350
        script: |-
          (ctx) => {
          const ord = ctx.api('GET', '/orders?number=ORD-10350').body.data[0];
          const mine = ctx.api('GET', '/tickets?order_id=' + ord.id).body.data[0];
          const other = ctx.api('GET', '/tickets?customer_id=' + mine.customer_id).body.data.find((x) => x.id !== mine.id && x.assignee_id);
          const sup = ctx.api('GET', '/agents?email=helen.overton@support.example').body.data[0];
          const rf = ctx.api('POST', '/tickets/' + other.id + '/refunds', { agent_id: other.assignee_id, amount: 75000, reason: 'Order lost in transit' });
          ctx.api('POST', '/refunds/' + rf.body.id + '/approve', { supervisor_id: sup.id });
          ctx.api('POST', '/tickets/' + other.id + '/resolve', { agent_id: other.assignee_id });
          }
      - why: does the whole flow on the right ticket but has the other supervisor, Rafael Quinn, approve instead of Helen Overton
        script: |-
          (ctx) => {
          const ord = ctx.api('GET', '/orders?number=ORD-10350').body.data[0];
          const t = ctx.api('GET', '/tickets?order_id=' + ord.id).body.data.find((x) => x.status === 'pending');
