format: 1
meta:
  name: world
  description: Customers open tickets about their orders. Agents are assigned, reply (moving the ticket to pending), and resolve. Customer replies reopen pending tickets. Resolved tickets can be reopened.
  resembles: Zendesk-style helpdesk for order support tickets
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A shopper who opens support tickets.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
  agent:
    description: A support agent who can be assigned tickets. Only active agents can be assigned.
    idPrefix: agt
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      active:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
      role:
        type: enum
        description: Supervisors approve or reject refunds above $500.
        required: false
        nullable: false
        unique: false
        readonly: false
        values:
          - agent
          - supervisor
        default: agent
  order:
    description: A customer order that a ticket is about.
    idPrefix: ord
    fields:
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      status:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - pending
          - processing
          - shipped
          - delivered
          - cancelled
  ticket:
    description: A support ticket about an order. Status moves only through the ticket actions; the assignee is set by assign_ticket.
    idPrefix: tkt
    fields:
      subject:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: order
        onDelete: restrict
      assignee_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: agent
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - open
          - pending
          - resolved
        initial: open
        transitions:
          open:
            - pending
            - resolved
          pending:
            - open
            - resolved
          resolved:
            - open
      resolved_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
  comment:
    description: A message on a ticket, written by the customer or by an agent.
    idPrefix: cmt
    fields:
      ticket_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: ticket
        onDelete: restrict
      author_kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - customer
          - agent
      agent_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: agent
        onDelete: restrict
      body:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
  refund:
    description: A refund of an order linked to a ticket, requested by the ticket's assigned agent. Amount in USD cents. Above 50000 it stays pending until a supervisor approves or rejects it.
    idPrefix: rfd
    fields:
      ticket_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: ticket
        onDelete: restrict
      order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: order
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
      reason:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - pending
          - approved
          - rejected
        initial: pending
        transitions:
          pending:
            - approved
            - rejected
          approved: []
          rejected: []
      requested_by:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: agent
        onDelete: restrict
      decided_by:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: agent
        onDelete: restrict
      decided_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
