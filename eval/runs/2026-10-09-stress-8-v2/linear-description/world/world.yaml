actions:
  assign_issue:
    method: POST
    path: /issues/{id}/assign
    description: Assign an issue to a member of its own team.
    input:
      assignee_id:
        type: ref
        description: Member of the issue's team.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: member
        onDelete: restrict
    handler: |-
      (ctx) => {
        const issue = ctx.db.get('issue', ctx.params.id);
        if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
        if (issue.status === 'done' || issue.status === 'canceled') ctx.fail(409, 'invalid_state', 'issue ' + issue.id + ' is ' + issue.status + ' and cannot be assigned.');
        const m = ctx.db.get('member', ctx.body.assignee_id);
        if (m === null) ctx.fail(404, 'not_found', 'member ' + ctx.body.assignee_id + ' not found');
        if (m.team_id !== issue.team_id) ctx.fail(409, 'not_team_member', 'member ' + m.id + ' does not belong to team ' + issue.team_id + '.');
        const updated = ctx.db.update('issue', issue.id, { assignee_id: m.id });
        return { status: 200, body: updated };
      }
  start_issue:
    method: POST
    path: /issues/{id}/start
    description: Start work on an assigned backlog or todo issue.
    input: {}
    handler: |-
      (ctx) => {
        const issue = ctx.db.get('issue', ctx.params.id);
        if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
        if (issue.status !== 'backlog' && issue.status !== 'todo') ctx.fail(409, 'invalid_state', 'issue ' + issue.id + ' is ' + issue.status + '. Only backlog and todo issues can be started.');
        if (issue.assignee_id === null || issue.assignee_id === undefined) ctx.fail(409, 'no_assignee', 'issue ' + issue.id + ' has no assignee. Assign it first.');
        const updated = ctx.db.update('issue', issue.id, { status: 'in_progress', started_at: ctx.now() });
        return { status: 200, body: updated };
      }
  complete_issue:
    method: POST
    path: /issues/{id}/complete
    description: Mark an in_progress or in_review issue done.
    input: {}
    handler: |-
      (ctx) => {
        const issue = ctx.db.get('issue', ctx.params.id);
        if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
        if (issue.status !== 'in_progress' && issue.status !== 'in_review') ctx.fail(409, 'invalid_state', 'issue ' + issue.id + ' is ' + issue.status + '. Only in_progress and in_review issues can be completed.');
        const updated = ctx.db.update('issue', issue.id, { status: 'done', completed_at: ctx.now() });
        return { status: 200, body: updated };
      }
  cancel_issue:
    method: POST
    path: /issues/{id}/cancel
    description: Cancel an issue permanently. Done and canceled issues cannot be canceled.
    input: {}
    handler: |-
      (ctx) => {
        const issue = ctx.db.get('issue', ctx.params.id);
        if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
        if (issue.status === 'done' || issue.status === 'canceled') ctx.fail(409, 'invalid_state', 'issue ' + issue.id + ' is already ' + issue.status + ' and cannot be canceled.');
        const updated = ctx.db.update('issue', issue.id, { status: 'canceled', canceled_at: ctx.now() });
        return { status: 200, body: updated };
      }
  add_to_cycle:
    method: POST
    path: /issues/{id}/cycle
    description: Schedule an issue into a cycle of its own team that has free capacity.
    input:
      cycle_id:
        type: ref
        description: Target cycle of the issue's team.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: cycle
        onDelete: restrict
    handler: |-
      (ctx) => {
        const issue = ctx.db.get('issue', ctx.params.id);
        if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
        const cycle = ctx.db.get('cycle', ctx.body.cycle_id);
        if (cycle === null) ctx.fail(404, 'not_found', 'cycle ' + ctx.body.cycle_id + ' not found');
        if (issue.status === 'done' || issue.status === 'canceled') ctx.fail(409, 'invalid_state', 'issue ' + issue.id + ' is ' + issue.status + ' and cannot be scheduled.');
        if (cycle.team_id !== issue.team_id) ctx.fail(409, 'cycle_team_mismatch', 'cycle ' + cycle.id + ' belongs to team ' + cycle.team_id + ', not ' + issue.team_id + '.');
        if (issue.cycle_id === cycle.id) ctx.fail(409, 'no_change', 'issue ' + issue.id + ' is already in cycle ' + cycle.id + '.');
        const inCycle = ctx.db.list('issue', { where: { cycle_id: cycle.id } });
        if (inCycle.length >= cycle.capacity) ctx.fail(409, 'cycle_full', 'cycle ' + cycle.id + ' is full (' + inCycle.length + '/' + cycle.capacity + ').');
        const updated = ctx.db.update('issue', issue.id, { cycle_id: cycle.id });
        return { status: 200, body: updated };
      }
