        let prios = ['low','normal','high','urgent'];
        if ((team === P && status === 'todo') || (team === B && status === 'backlog')) prios = ['low','normal','high'];
        const title = titles[i % titles.length] + (i >= titles.length ? ' (follow-up)' : '');
        const pool = byTeam[team];
        const assignee = (status === 'backlog' || (status === 'todo' && i % 2 === 0)) ? null : ctx.pick(pool);
        return mk(title, team, status, ctx.pick(prios), assignee);
      });
      const all = A.concat(gen, Bk);
      return all.map((o, i) => {
        const created = ctx.time.minus(now, (2000 - i * 20) + 'h');
        const pool = byTeam[o.team];
        let started = null, completed = null, canceled = null, upd = created;
        if (['in_progress','in_review','done'].includes(o.status)) { started = ctx.time.plus(created, '5h'); upd = started; }
        if (o.status === 'done') { completed = ctx.time.plus(created, '30h'); upd = completed; }
        if (o.status === 'canceled') { canceled = ctx.time.plus(created, '10h'); upd = canceled; }
        return { title: o.title, description: i % 3 === 0 ? null : 'Reported by a customer; see linked thread for details.', team_id: o.team, creator_id: pool[i % pool.length], assignee_id: o.assignee, priority: o.priority, estimate: i % 4 === 0 ? null : (i % 5) + 1, status: o.status, cycle_id: o.cycle, started_at: started, completed_at: completed, canceled_at: canceled, created_at: created, updated_at: upd };
      });
    }
  comment: |-
    (ctx) => {
      const issues = ctx.rows('issue');
      const members = ctx.rows('member');
      const bodies = ['Reproduced on staging, looks related to the last deploy.','Can you share the request ID from the failed call?','Picking this up after the current sprint work.','Workaround shared with the customer by chat.','Waiting on a design review before continuing.','Fix is in review, should ship tomorrow.','Confirmed with support, affects several accounts.','Added logs to narrow down the cause.'];
      const out = [];
      for (let k = 0; k < 40; k++) {
        const iss = issues[(k * 7) % issues.length];
        const pool = members.filter((m) => m.team_id === iss.team_id);
        const t = ctx.time.plus(iss.created_at, (2 + k) + 'h');
        out.push({ issue_id: iss.id, author_id: pool[k % pool.length].id, body: bodies[k % bodies.length], created_at: t, updated_at: t });
      }
      return out;
    }
tests:
  assign_requires_team_member:
    description: Create two teams, a member in each and an issue in team A. Assigning the team B member returns 409 not_team_member; assigning the team A member succeeds.
    script: |-
      (ctx) => {
        const ta = ctx.api('POST', '/teams', { name: 'Alpha Assign', key: 'ASA' });
        ctx.assert(ta.status === 201, 'team a ' + JSON.stringify(ta.body));
        const tb = ctx.api('POST', '/teams', { name: 'Beta Assign', key: 'ASB' });
        ctx.assert(tb.status === 201, 'team b');
        const ma = ctx.api('POST', '/members', { name: 'Ann Assign', email: 'ann.assign@acceptance.example', team_id: ta.body.id, role: 'member' });
        ctx.assert(ma.status === 201, 'member a ' + JSON.stringify(ma.body));
        const mb = ctx.api('POST', '/members', { name: 'Ben Assign', email: 'ben.assign@acceptance.example', team_id: tb.body.id, role: 'member' });
        ctx.assert(mb.status === 201, 'member b');
        const i = ctx.api('POST', '/issues', { title: 'Acceptance assign issue', team_id: ta.body.id, creator_id: ma.body.id, priority: 'high' });
        ctx.assert(i.status === 201 && i.body.status === 'backlog', 'issue ' + JSON.stringify(i.body));
        const bad = ctx.api('POST', '/issues/' + i.body.id + '/assign', { assignee_id: mb.body.id });
        ctx.assert(bad.status === 409 && bad.body.error.code === 'not_team_member', 'bad ' + JSON.stringify(bad.body));
        const ok = ctx.api('POST', '/issues/' + i.body.id + '/assign', { assignee_id: ma.body.id });
        ctx.assert(ok.status === 200 && ok.body.assignee_id === ma.body.id, 'ok ' + JSON.stringify(ok.body));
      }
  start_requires_assignee:
    description: Starting an unassigned issue gives 409 no_assignee; after assignment start sets in_progress and started_at.
    script: |-
      (ctx) => {
        const t = ctx.api('POST', '/teams', { name: 'Start Team', key: 'STT' });
        const m = ctx.api('POST', '/members', { name: 'Sam Start', email: 'sam.start@acceptance.example', team_id: t.body.id, role: 'member' });
        const i = ctx.api('POST', '/issues', { title: 'Acceptance start issue', team_id: t.body.id, creator_id: m.body.id, priority: 'normal' });
        ctx.assert(i.status === 201, 'issue ' + JSON.stringify(i.body));
        const no = ctx.api('POST', '/issues/' + i.body.id + '/start', {});
        ctx.assert(no.status === 409 && no.body.error.code === 'no_assignee', 'no assignee ' + JSON.stringify(no.body));
        ctx.assert(ctx.api('POST', '/issues/' + i.body.id + '/assign', { assignee_id: m.body.id }).status === 200, 'assign');
        const s = ctx.api('POST', '/issues/' + i.body.id + '/start', {});
        ctx.assert(s.status === 200 && s.body.status === 'in_progress' && s.body.started_at !== null, 'start ' + JSON.stringify(s.body));
        const again = ctx.api('POST', '/issues/' + i.body.id + '/start', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'again ' + JSON.stringify(again.body));
      }
  complete_requires_started:
    description: Completing a backlog issue is refused; after start, complete sets done and completed_at.
    script: |-
      (ctx) => {
        const t = ctx.api('POST', '/teams', { name: 'Complete Team', key: 'CMT' });
        const m = ctx.api('POST', '/members', { name: 'Cleo Complete', email: 'cleo.complete@acceptance.example', team_id: t.body.id, role: 'admin' });
        const i = ctx.api('POST', '/issues', { title: 'Acceptance complete issue', team_id: t.body.id, creator_id: m.body.id, priority: 'low' });
        const early = ctx.api('POST', '/issues/' + i.body.id + '/complete', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'early ' + JSON.stringify(early.body));
        ctx.api('POST', '/issues/' + i.body.id + '/assign', { assignee_id: m.body.id });
        ctx.assert(ctx.api('POST', '/issues/' + i.body.id + '/start', {}).status === 200, 'start');
        const d = ctx.api('POST', '/issues/' + i.body.id + '/complete', {});
        ctx.assert(d.status === 200 && d.body.status === 'done' && d.body.completed_at !== null, 'done ' + JSON.stringify(d.body));
      }
  cycle_capacity_enforced:
    description: A cycle with capacity 1 accepts one issue; a second gets 409 cycle_full; an issue of another team gets 409 cycle_team_mismatch.
    script: |-
      (ctx) => {
        const t = ctx.api('POST', '/teams', { name: 'Cycle Team', key: 'CYT' });
        const o = ctx.api('POST', '/teams', { name: 'Other Cycle Team', key: 'CYO' });
        const m = ctx.api('POST', '/members', { name: 'Cy Cycle', email: 'cy.cycle@acceptance.example', team_id: t.body.id, role: 'member' });
        const c = ctx.api('POST', '/cycles', { team_id: t.body.id, name: 'Acceptance Sprint', capacity: 1, starts_at: '2026-10-12T00:00:00.000Z', ends_at: '2026-10-26T00:00:00.000Z' });
        ctx.assert(c.status === 201, 'cycle ' + JSON.stringify(c.body));
        const mk = (title, team) => ctx.api('POST', '/issues', { title, team_id: team, creator_id: m.body.id, priority: 'normal' }).body.id;
        const i1 = mk('Cycle issue one', t.body.id);
        const i2 = mk('Cycle issue two', t.body.id);
        const i3 = mk('Cycle issue foreign', o.body.id);
        const r1 = ctx.api('POST', '/issues/' + i1 + '/cycle', { cycle_id: c.body.id });
        ctx.assert(r1.status === 200 && r1.body.cycle_id === c.body.id, 'first ' + JSON.stringify(r1.body));
        const r2 = ctx.api('POST', '/issues/' + i2 + '/cycle', { cycle_id: c.body.id });
        ctx.assert(r2.status === 409 && r2.body.error.code === 'cycle_full', 'full ' + JSON.stringify(r2.body));
        const r3 = ctx.api('POST', '/issues/' + i3 + '/cycle', { cycle_id: c.body.id });
        ctx.assert(r3.status === 409 && r3.body.error.code === 'cycle_team_mismatch', 'mismatch ' + JSON.stringify(r3.body));
      }
  cancel_is_final:
    description: Cancel sets canceled and canceled_at; a canceled issue cannot be canceled, started again; a done issue cannot be canceled.
    script: |-
      (ctx) => {
        const t = ctx.api('POST', '/teams', { name: 'Cancel Team', key: 'CNT' });
        const m = ctx.api('POST', '/members', { name: 'Cam Cancel', email: 'cam.cancel@acceptance.example', team_id: t.body.id, role: 'member' });
        const mk = (title) => ctx.api('POST', '/issues', { title, team_id: t.body.id, creator_id: m.body.id, priority: 'urgent' }).body.id;
        const a = mk('Cancel me');
        const c = ctx.api('POST', '/issues/' + a + '/cancel', {});
        ctx.assert(c.status === 200 && c.body.status === 'canceled' && c.body.canceled_at !== null, 'cancel ' + JSON.stringify(c.body));
        const c2 = ctx.api('POST', '/issues/' + a + '/cancel', {});
        ctx.assert(c2.status === 409 && c2.body.error.code === 'invalid_state', 'twice ' + JSON.stringify(c2.body));
        ctx.api('POST', '/issues/' + a + '/assign', { assignee_id: m.body.id });
        const s = ctx.api('POST', '/issues/' + a + '/start', {});
        ctx.assert(s.status === 409, 'start canceled ' + s.status);
        const b = mk('Finish me');
        ctx.api('POST', '/issues/' + b + '/assign', { assignee_id: m.body.id });
        ctx.api('POST', '/issues/' + b + '/start', {});
        ctx.assert(ctx.api('POST', '/issues/' + b + '/complete', {}).status === 200, 'complete');
        const c3 = ctx.api('POST', '/issues/' + b + '/cancel', {});
        ctx.assert(c3.status === 409 && c3.body.error.code === 'invalid_state', 'cancel done ' + JSON.stringify(c3.body));
      }
tasks:
  assign_login_bug:
    difficulty: easy
    instruction: Assign the issue titled 'Login redirect loops on Safari' to the member Dana Okafor of its team.
    grader: "(ctx) => { const target = ctx.seed.list('issue', { where: { title: 'Login redirect loops on Safari' } })[0]; const dana = ctx.seed.list('member', { where: { name: 'Dana Okafor' } })[0]; if (!target || !dana) return 0; ctx.guardChanges('only the assignee of the target issue changed', [{ entity: 'issue', id: target.id, kind: 'updated', fields: ['assignee_id'] }]); const end = ctx.db.get('issue', target.id); ctx.goal(1, 'assigned to Dana Okafor', end.assignee_id === dana.id); return ctx.score(); }"
    solution: "(ctx) => { const hits = ctx.api('GET', '/issues?q=Login+redirect').body.data.filter((i) => i.title === 'Login redirect loops on Safari'); ctx.assert(hits.length === 1, 'expected exactly one issue with that title, found ' + hits.length); const dana = ctx.api('GET', '/members?q=Dana').body.data.find((m) => m.name === 'Dana Okafor' && m.team_id === hits[0].team_id); ctx.assert(dana, 'Dana Okafor not found in the issue team'); const r = ctx.api('POST', '/issues/' + hits[0].id + '/assign', { assignee_id: dana.id }); ctx.assert(r.status === 200, 'assign failed: ' + JSON.stringify(r.body)); }"
    decoys:
      - why: assigns the correct issue to Marta Lindqvist, another Platform member, instead of Dana Okafor
        script: "(ctx) => { const hit = ctx.api('GET', '/issues?q=Login+redirect').body.data.find((i) => i.title === 'Login redirect loops on Safari'); const marta = ctx.api('GET', '/members?q=Marta').body.data.find((m) => m.name === 'Marta Lindqvist'); const r = ctx.api('POST', '/issues/' + hit.id + '/assign', { assignee_id: marta.id }); ctx.assert(r.status === 200, 'assign failed'); }"
    alternatives: []
    allows:
      - entity: issue
        kind: updated
        fields:
          - assignee_id
        where:
          title: Login redirect loops on Safari
  start_urgent_billing:
    difficulty: medium
    instruction: Take the unassigned urgent backlog issue of the Billing team, assign it to the Billing team admin Rahul Menon and start it.
    grader: "(ctx) => { const B = ctx.seed.list('team', { where: { key: 'BIL' } })[0]; if (!B) return 0; const rahul = ctx.seed.list('member', { where: { team_id: B.id, name: 'Rahul Menon' } })[0]; if (!rahul) return 0; const target = ctx.seed.list('issue', { where: { team_id: B.id, priority: 'urgent', status: 'backlog' } }).find((i) => i.assignee_id === null); if (!target) return 0; ctx.guardChanges('only the target issue changed', [{ entity: 'issue', id: target.id, kind: 'updated', fields: ['assignee_id', 'status', 'started_at'] }]); const end = ctx.db.get('issue', target.id); ctx.goal(0.5, 'assigned to Rahul Menon', end.assignee_id === rahul.id); ctx.goal(0.5, 'started', end.status === 'in_progress' && end.started_at !== null); return ctx.score(); }"
    solution: "(ctx) => { const team = ctx.api('GET', '/teams?key=BIL').body.data[0]; ctx.assert(team, 'Billing team not found'); const open = ctx.api('GET', '/issues?team_id=' + team.id + '&priority=urgent&status=backlog').body.data.filter((i) => i.assignee_id === null); ctx.assert(open.length === 1, 'expected one unassigned urgent backlog issue, found ' + open.length); const rahul = ctx.api('GET', '/members?team_id=' + team.id + '&role=admin').body.data.find((m) => m.name === 'Rahul Menon'); ctx.assert(rahul, 'Rahul Menon not found among Billing admins'); const a = ctx.api('POST', '/issues/' + open[0].id + '/assign', { assignee_id: rahul.id }); ctx.assert(a.status === 200, 'assign failed: ' + JSON.stringify(a.body)); const s = ctx.api('POST', '/issues/' + open[0].id + '/start', {}); ctx.assert(s.status === 200, 'start failed: ' + JSON.stringify(s.body)); }"
    decoys:
      - why: assigns a non-admin Billing member and starts the issue, so the assignee is not the named admin
        script: "(ctx) => { const team = ctx.api('GET', '/teams?key=BIL').body.data[0]; const open = ctx.api('GET', '/issues?team_id=' + team.id + '&priority=urgent&status=backlog').body.data.filter((i) => i.assignee_id === null); const plain = ctx.api('GET', '/members?team_id=' + team.id + '&role=member').body.data[0]; ctx.assert(ctx.api('POST', '/issues/' + open[0].id + '/assign', { assignee_id: plain.id }).status === 200, 'assign failed'); ctx.assert(ctx.api('POST', '/issues/' + open[0].id + '/start', {}).status === 200, 'start failed'); }"
      - why: assigns the other Billing admin, Hannah Sato, instead of Rahul Menon, then starts the issue
        script: "(ctx) => { const team = ctx.api('GET', '/teams?key=BIL').body.data[0]; const open = ctx.api('GET', '/issues?team_id=' + team.id + '&priority=urgent&status=backlog').body.data.filter((i) => i.assignee_id === null); const hannah = ctx.api('GET', '/members?team_id=' + team.id + '&role=admin').body.data.find((m) => m.name === 'Hannah Sato'); ctx.assert(ctx.api('POST', '/issues/' + open[0].id + '/assign', { assignee_id: hannah.id }).status === 200, 'assign failed'); ctx.assert(ctx.api('POST', '/issues/' + open[0].id + '/start', {}).status === 200, 'start failed'); }"
      - why: starts the urgent Billing backlog issue that already has an assignee instead of the unassigned one
        script: (ctx) => { const team = ctx.api('GET', '/teams?key=BIL').body.data[0]; const taken = ctx.api('GET', '/issues?team_id=' + team.id + '&priority=urgent&status=backlog').body.data.filter((i) => i.assignee_id !== null); ctx.assert(taken.length > 0, 'no assigned urgent issue'); ctx.assert(ctx.api('POST', '/issues/' + taken[0].id + '/start', {}).status === 200, 'start failed'); }
    alternatives: []
