  fill_platform_cycle:
    difficulty: hard
    instruction: "Platform Sprint 42, the Platform team's next cycle, has only a few free slots. Schedule the highest-priority todo Platform issues that are not in any cycle yet into it until it is full, and assign each issue you schedule to Marta Lindqvist. Do not start, cancel or otherwise change any issue that did not fit. Finally create the Platform cycle that follows the existing ones: name 'Platform Sprint 44', capacity 5, starting 2026-11-09T00:00:00.000Z and ending 2026-11-23T00:00:00.000Z."
    grader: "(ctx) => { const P = ctx.seed.list('team', { where: { key: 'PLT' } })[0]; const marta = ctx.seed.list('member', { where: { name: 'Marta Lindqvist' } })[0]; if (!P || !marta) return 0; const sprint = ctx.seed.list('cycle', { where: { team_id: P.id, name: 'Platform Sprint 42' } })[0]; if (!sprint) return 0; const used = ctx.seed.list('issue', { where: { cycle_id: sprint.id } }).length; const free = sprint.capacity - used; const rank = { urgent: 3, high: 2, normal: 1, low: 0 }; const expected = ctx.seed.list('issue', { where: { team_id: P.id, status: 'todo' } }).filter((i) => i.cycle_id === null).sort((a, b) => rank[b.priority] - rank[a.priority] || (a.id < b.id ? -1 : 1)).slice(0, free); if (expected.length === 0) return 0; const fresh = ctx.db.list('cycle').filter((c) => ctx.seed.get('cycle', c.id) === null); ctx.guard('at most one new cycle', fresh.length <= 1); ctx.guardChanges('only the chosen issues and the new cycle changed', [...expected.map((i) => ({ entity: 'issue', id: i.id, kind: 'updated', fields: ['cycle_id', 'assignee_id'] })), ...fresh.map((c) => ({ entity: 'cycle', id: c.id, kind: 'created', fields: ['team_id', 'name', 'capacity', 'starts_at', 'ends_at'] }))]); const w = 0.7 / expected.length; for (const i of expected) { const end = ctx.db.get('issue', i.id); ctx.goal(w, 'scheduled and assigned ' + i.id, end.cycle_id === sprint.id && end.assignee_id === marta.id); } const c = fresh[0]; const ok = fresh.length === 1 && c.team_id === P.id && c.name === 'Platform Sprint 44' && c.capacity === 5 && ctx.time.minutesBetween(c.starts_at, '2026-11-09T00:00:00.000Z') === 0 && ctx.time.minutesBetween(c.ends_at, '2026-11-23T00:00:00.000Z') === 0; ctx.goal(0.3, 'next cycle created', ok); return ctx.score(); }"
    solution: "(ctx) => { const pages = (path) => { const rows = []; let cursor = null; do { const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); return rows; }; const team = ctx.api('GET', '/teams?key=PLT').body.data[0]; ctx.assert(team, 'Platform team not found'); const cycles = pages('/cycles?team_id=' + team.id + '&limit=25'); const sprint = cycles.find((c) => c.name === 'Platform Sprint 42'); ctx.assert(sprint, 'Platform Sprint 42 not found'); const marta = ctx.api('GET', '/members?team_id=' + team.id + '&q=Marta').body.data.find((m) => m.name === 'Marta Lindqvist'); ctx.assert(marta, 'Marta Lindqvist not found'); const issues = pages('/issues?limit=25'); const used = issues.filter((i) => i.cycle_id === sprint.id).length; const free = sprint.capacity - used; const rank = { urgent: 3, high: 2, normal: 1, low: 0 }; const chosen = issues.filter((i) => i.team_id === team.id && i.status === 'todo' && i.cycle_id === null).sort((a, b) => rank[b.priority] - rank[a.priority] || (a.id < b.id ? -1 : 1)).slice(0, free); ctx.assert(chosen.length > 0, 'nothing to schedule'); for (const i of chosen) { const a = ctx.api('POST', '/issues/' + i.id + '/assign', { assignee_id: marta.id }); ctx.assert(a.status === 200, 'assign ' + i.id + ' failed: ' + JSON.stringify(a.body)); const c = ctx.api('POST', '/issues/' + i.id + '/cycle', { cycle_id: sprint.id }); ctx.assert(c.status === 200, 'schedule ' + i.id + ' failed: ' + JSON.stringify(c.body)); } const n = ctx.api('POST', '/cycles', { team_id: team.id, name: 'Platform Sprint 44', capacity: 5, starts_at: '2026-11-09T00:00:00.000Z', ends_at: '2026-11-23T00:00:00.000Z' }); ctx.assert(n.status === 201, 'create cycle failed: ' + JSON.stringify(n.body)); }"
    decoys:
      - why: reads only the first page of issues, so it finds one urgent issue and leaves a free slot unfilled; the other urgent issue sits on a later page
        script: "(ctx) => { const team = ctx.api('GET', '/teams?key=PLT').body.data[0]; const marta = ctx.api('GET', '/members?team_id=' + team.id + '&q=Marta').body.data.find((m) => m.name === 'Marta Lindqvist'); const sprint = ctx.api('GET', '/cycles?team_id=' + team.id).body.data.find((c) => c.name === 'Platform Sprint 42'); const page = ctx.api('GET', '/issues?limit=25').body.data; const urgent = page.filter((i) => i.team_id === team.id && i.status === 'todo' && i.cycle_id === null && i.priority === 'urgent'); ctx.assert(urgent.length > 0, 'no urgent issue on page one'); for (const i of urgent) { ctx.assert(ctx.api('POST', '/issues/' + i.id + '/assign', { assignee_id: marta.id }).status === 200, 'assign failed'); ctx.assert(ctx.api('POST', '/issues/' + i.id + '/cycle', { cycle_id: sprint.id }).status === 200, 'schedule failed'); } ctx.assert(ctx.api('POST', '/cycles', { team_id: team.id, name: 'Platform Sprint 44', capacity: 5, starts_at: '2026-11-09T00:00:00.000Z', ends_at: '2026-11-23T00:00:00.000Z' }).status === 201, 'create cycle failed'); }"
      - why: fills the free slots with the first todo Platform issues in id order instead of the highest priority ones
        script: "(ctx) => { const team = ctx.api('GET', '/teams?key=PLT').body.data[0]; const marta = ctx.api('GET', '/members?team_id=' + team.id + '&q=Marta').body.data.find((m) => m.name === 'Marta Lindqvist'); const sprint = ctx.api('GET', '/cycles?team_id=' + team.id).body.data.find((c) => c.name === 'Platform Sprint 42'); const todo = ctx.api('GET', '/issues?team_id=' + team.id + '&status=todo&limit=25').body.data.filter((i) => i.cycle_id === null); for (const i of todo.slice(0, 2)) { ctx.assert(ctx.api('POST', '/issues/' + i.id + '/assign', { assignee_id: marta.id }).status === 200, 'assign failed'); ctx.assert(ctx.api('POST', '/issues/' + i.id + '/cycle', { cycle_id: sprint.id }).status === 200, 'schedule failed'); } ctx.assert(ctx.api('POST', '/cycles', { team_id: team.id, name: 'Platform Sprint 44', capacity: 5, starts_at: '2026-11-09T00:00:00.000Z', ends_at: '2026-11-23T00:00:00.000Z' }).status === 201, 'create cycle failed'); }"
      - why: schedules the right urgent issues into Platform Sprint 43, the later empty cycle, instead of the next cycle Platform Sprint 42
        script: "(ctx) => { const team = ctx.api('GET', '/teams?key=PLT').body.data[0]; const marta = ctx.api('GET', '/members?team_id=' + team.id + '&q=Marta').body.data.find((m) => m.name === 'Marta Lindqvist'); const later = ctx.api('GET', '/cycles?team_id=' + team.id).body.data.find((c) => c.name === 'Platform Sprint 43'); const urgent = ctx.api('GET', '/issues?team_id=' + team.id + '&status=todo&priority=urgent').body.data.filter((i) => i.cycle_id === null); ctx.assert(urgent.length > 0, 'no urgent issues'); for (const i of urgent) { ctx.assert(ctx.api('POST', '/issues/' + i.id + '/assign', { assignee_id: marta.id }).status === 200, 'assign failed'); ctx.assert(ctx.api('POST', '/issues/' + i.id + '/cycle', { cycle_id: later.id }).status === 200, 'schedule failed'); } ctx.assert(ctx.api('POST', '/cycles', { team_id: team.id, name: 'Platform Sprint 44', capacity: 5, starts_at: '2026-11-09T00:00:00.000Z', ends_at: '2026-11-23T00:00:00.000Z' }).status === 201, 'create cycle failed'); }"
    alternatives: []
    allows:
      - entity: issue
        kind: updated
        fields:
          - cycle_id
          - assignee_id
        where:
          team_id: team_0001
          status: todo
      - entity: cycle
        kind: created
        fields: []
        where:
          team_id: team_0001
          name: Platform Sprint 44
  cancel_duplicate_mobile:
    difficulty: medium
    instruction: Cancel every backlog issue of the Mobile team whose title starts with '[dup]'. Leave all other issues untouched, including '[dup]' issues that are in other statuses or belong to other teams.
    grader: "(ctx) => { const mob = ctx.seed.list('team', { where: { key: 'MOB' } })[0]; if (!mob) return 0; const targets = ctx.seed.list('issue', { where: { team_id: mob.id, status: 'backlog' } }).filter((i) => i.title.startsWith('[dup]')); if (targets.length === 0) return 0; ctx.guardChanges('only the Mobile backlog dup issues were canceled', targets.map((t) => ({ entity: 'issue', id: t.id, kind: 'updated', fields: ['status', 'canceled_at'] }))); const w = 1 / targets.length; for (const t of targets) { const end = ctx.db.get('issue', t.id); ctx.goal(w, 'canceled ' + t.id, end.status === 'canceled' && end.canceled_at !== null); } return ctx.score(); }"
    solution: "(ctx) => { const team = ctx.api('GET', '/teams?key=MOB').body.data[0]; ctx.assert(team, 'Mobile team not found'); const rows = []; let cursor = null; do { const r = ctx.api('GET', '/issues?team_id=' + team.id + '&limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'list failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); const targets = rows.filter((i) => i.status === 'backlog' && i.title.startsWith('[dup]')); ctx.assert(targets.length > 0, 'no dup backlog issues found'); for (const t of targets) { const c = ctx.api('POST', '/issues/' + t.id + '/cancel', {}); ctx.assert(c.status === 200, 'cancel ' + t.id + ' failed: ' + JSON.stringify(c.body)); } }"
    decoys:
      - why: reads only a page of two Mobile backlog issues, so it cancels only the first dup issue and misses the others
        script: (ctx) => { const team = ctx.api('GET', '/teams?key=MOB').body.data[0]; const page = ctx.api('GET', '/issues?team_id=' + team.id + '&status=backlog&limit=2').body.data.filter((i) => i.title.startsWith('[dup]')); ctx.assert(page.length > 0, 'no dup issue on the first page'); for (const t of page) { ctx.assert(ctx.api('POST', '/issues/' + t.id + '/cancel', {}).status === 200, 'cancel failed'); } }
      - why: ignores the team and cancels every backlog issue whose title starts with [dup], including the Platform one
        script: (ctx) => { const rows = ctx.api('GET', '/issues?status=backlog&limit=25').body.data.filter((i) => i.title.startsWith('[dup]')); ctx.assert(rows.length > 0, 'no dup issues'); for (const t of rows) { ctx.assert(ctx.api('POST', '/issues/' + t.id + '/cancel', {}).status === 200, 'cancel failed'); } }
      - why: ignores the status and cancels every Mobile [dup] issue it can, including the one that is in progress
        script: (ctx) => { const team = ctx.api('GET', '/teams?key=MOB').body.data[0]; const rows = ctx.api('GET', '/issues?team_id=' + team.id + '&limit=25').body.data.filter((i) => i.title.startsWith('[dup]')); ctx.assert(rows.length > 0, 'no dup issues'); for (const t of rows) { ctx.api('POST', '/issues/' + t.id + '/cancel', {}); } }
    alternatives: []
    allows:
      - entity: issue
        kind: updated
        fields:
          - status
          - canceled_at
        where:
          team_id: team_0003
          status: backlog
