format: 1
meta:
  name: world
  description: An issue tracker where teams own issues that move through a status lifecycle (backlog to done or canceled), get assigned to team members, and are scheduled into capacity-limited cycles (sprints).
  resembles: Linear-style issue tracker (teams, issues, cycles, comments)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  team:
    description: A group that owns issues and cycles. Identified by a short unique key such as ENG.
    idPrefix: team
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      key:
        type: string
        description: Short unique uppercase team key, such as ENG.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 10
        pattern: ^[A-Z][A-Z0-9]{1,9}$
  member:
    description: A user who belongs to exactly one team, as an admin or a regular member.
    idPrefix: mem
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: restrict
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - admin
          - member
  cycle:
    description: A time-boxed sprint of one team with a limited issue capacity. Any issue with the cycle_id counts toward capacity.
    idPrefix: cyc
    fields:
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      capacity:
        type: int
        description: Maximum number of issues the cycle can hold.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      starts_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      ends_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
  issue:
    description: A unit of work with a priority and a status lifecycle, an optional assignee and an optional cycle. Status, assignee, cycle and lifecycle timestamps change only through workflow actions.
    idPrefix: iss
    fields:
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: restrict
      creator_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: member
        onDelete: restrict
      assignee_id:
        type: ref
        description: Set by the assign action. Must be a member of the issue's team.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: member
        onDelete: nullify
      priority:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - low
          - normal
          - high
          - urgent
      estimate:
        type: int
        description: Optional effort estimate in points.
        required: false
        nullable: true
        unique: false
        readonly: false
        min: 0
        max: 100
      status:
        type: state
        description: Lifecycle. Moved by the start, complete and cancel actions. done and canceled are final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - backlog
          - todo
          - in_progress
          - in_review
          - done
          - canceled
        initial: backlog
        transitions:
          backlog:
            - todo
            - in_progress
            - canceled
          todo:
            - backlog
            - in_progress
            - canceled
          in_progress:
            - in_review
            - done
            - canceled
          in_review:
            - in_progress
            - done
            - canceled
          done: []
          canceled: []
      cycle_id:
        type: ref
        description: Set by the add_to_cycle action.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: cycle
        onDelete: nullify
      started_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      completed_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      canceled_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      project_id:
        type: ref
        description: Optional project the issue belongs to.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: project
        onDelete: nullify
      due_date:
        type: datetime
        description: Optional due date of the issue.
        required: false
        nullable: true
        unique: false
        readonly: false
  comment:
    description: A message written by a member on an issue.
    idPrefix: cmt
    fields:
      issue_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: issue
        onDelete: cascade
      author_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: member
        onDelete: restrict
      body:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
  project:
    description: A body of work that groups issues, owned by one team and optionally led by a member.
    idPrefix: prj
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: restrict
      lead_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: member
        onDelete: nullify
      status:
        type: enum
        required: false
        nullable: false
        unique: false
        readonly: false
        values:
          - planned
          - started
          - paused
          - completed
          - canceled
        default: planned
      start_date:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      target_date:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
  issue_label:
    description: A label that can be used to categorize issues, optionally scoped to one team.
    idPrefix: lbl
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
      color:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 20
      team_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: team
        onDelete: nullify
  workflow_state:
    description: A named column in a team's workflow (such as Todo or In Review) with a category type. Linear lets a state move between any categories.
    idPrefix: wfs
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: cascade
      color:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 20
      position:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
      type:
        type: state
        description: Category of the workflow state. Any category can be changed to any other.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - backlog
          - unstarted
          - started
          - completed
          - canceled
        initial: backlog
        transitions:
          backlog:
            - unstarted
            - started
            - completed
            - canceled
          unstarted:
            - backlog
            - started
            - completed
            - canceled
          started:
            - backlog
            - unstarted
            - completed
            - canceled
          completed:
            - backlog
            - unstarted
            - started
            - canceled
          canceled:
            - backlog
            - unstarted
            - started
            - completed
