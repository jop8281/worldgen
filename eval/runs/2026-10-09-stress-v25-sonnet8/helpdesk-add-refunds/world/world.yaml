  refund_large_and_approve:
    difficulty: medium
    instruction: 'Noor Rahman has an open ticket about order #W2000121 and has been promised a $750.00 refund on that order. Request the refund on that ticket as the support agent Priya Menon, with the reason "Item arrived damaged". Because it is above $500 it will need sign-off, so then approve it as the active supervisor. Do not change any other ticket, order or refund.'
    grader: |-
      (ctx) => {
      const REASON = 'Item arrived damaged';
      const t = ctx.seed.list('ticket', { where: { order_number: '#W2000121' } })[0];
      const o = ctx.seed.list('order', { where: { order_number: '#W2000121' } })[0];
      const priya = ctx.seed.list('agent', { where: { name: 'Priya Menon' } })[0];
      const sam = ctx.seed.list('agent', { where: { name: 'Sam Okafor' } })[0];
      if (!t || !o || !priya || !sam) return 0;
      const old = new Set(ctx.seed.list('refund', { where: { ticket_id: t.id } }).map((r) => r.id));
      const fresh = ctx.db.list('refund', { where: { ticket_id: t.id } }).filter((r) => !old.has(r.id));
      const fields = ['ticket_id', 'order_id', 'amount', 'requested_by', 'reason', 'status', 'approved_by'];
      const allowed = [];
      for (const r of fresh) {
        allowed.push({ entity: 'refund', id: r.id, kind: 'created', fields });
        allowed.push({ entity: 'refund', id: r.id, kind: 'updated', fields });
      }
      ctx.guardChanges('only the new refund on the target ticket changed', allowed);
      ctx.guard('at most one refund was created anywhere', ctx.changes().filter((c) => c.entity === 'refund' && c.kind === 'created').length <= 1);
      const r = fresh.length === 1 ? fresh[0] : null;
      const requested = r !== null && r.order_id === o.id && r.amount === 75000 && r.requested_by === priya.id && r.reason === REASON;
      ctx.goal(0.4, 'a $750 refund with the requested reason was requested by Priya Menon on the target order', requested);
      ctx.goal(0.6, 'that refund was approved by the supervisor', requested && r.status === 'approved' && r.approved_by === sam.id);
      return ctx.score();
      }
    solution: |-
      (ctx) => {
      const cust = ctx.api('GET', '/customers').body.data.find((c) => c.name === 'Noor Rahman');
      ctx.assert(cust, 'customer Noor Rahman not found');
      const agents = ctx.api('GET', '/agents').body.data;
      const priya = agents.find((a) => a.name === 'Priya Menon' && a.active === true);
      ctx.assert(priya, 'agent Priya Menon not found');
      const sup = agents.find((a) => a.role === 'supervisor' && a.active === true);
      ctx.assert(sup, 'active supervisor not found');
      const ticket = ctx.api('GET', '/tickets?customer_id=' + cust.id + '&status=open').body.data.find((t) => t.order_number === '#W2000121');
      ctx.assert(ticket, 'open ticket for #W2000121 not found');
      const order = ctx.api('GET', '/orders?customer_id=' + cust.id).body.data.find((o) => o.order_number === '#W2000121');
      ctx.assert(order, 'order #W2000121 not found');
      const r = ctx.api('POST', '/tickets/' + ticket.id + '/refunds', { agent_id: priya.id, order_id: order.id, amount: 75000, reason: 'Item arrived damaged' });
      ctx.assert(r.status === 201 && r.body.status === 'pending', 'refund request failed: ' + JSON.stringify(r.body));
      const a = ctx.api('POST', '/refunds/' + r.body.id + '/approve', { agent_id: sup.id });
      ctx.assert(a.status === 200 && a.body.status === 'approved', 'approve failed: ' + JSON.stringify(a.body));
      }
    decoys:
      - why: requests the $750 refund correctly but never has the supervisor approve it, leaving it pending
        script: |-
          (ctx) => {
          const priya = ctx.api('GET', '/agents').body.data.find((a) => a.name === 'Priya Menon' && a.active === true);
          const t = ctx.api('GET', '/tickets?order_number=%23W2000121').body.data[0];
          const o = ctx.api('GET', '/orders?order_number=%23W2000121').body.data[0];
          ctx.assert(t && o, 'ticket or order not found');
          const r = ctx.api('POST', '/tickets/' + t.id + '/refunds', { agent_id: priya.id, order_id: o.id, amount: 75000, reason: 'Item arrived damaged' });
          ctx.assert(r.status === 201, 'request failed: ' + JSON.stringify(r.body));
          }
      - why: "refunds and approves on Noor's other open ticket (order #W2000105) instead of the one about #W2000121"
        script: |-
          (ctx) => {
          const agents = ctx.api('GET', '/agents').body.data;
          const priya = agents.find((a) => a.name === 'Priya Menon' && a.active === true);
          const sup = agents.find((a) => a.role === 'supervisor' && a.active === true);
          const t = ctx.api('GET', '/tickets?order_number=%23W2000105').body.data[0];
          const o = ctx.api('GET', '/orders?order_number=%23W2000105').body.data[0];
          ctx.assert(t && o, 'wrong ticket or order not found');
          const r = ctx.api('POST', '/tickets/' + t.id + '/refunds', { agent_id: priya.id, order_id: o.id, amount: 75000, reason: 'Item arrived damaged' });
          ctx.assert(r.status === 201, 'request failed: ' + JSON.stringify(r.body));
          ctx.api('POST', '/refunds/' + r.body.id + '/approve', { agent_id: sup.id });
          }
      - why: requests only $500 on the right order, which auto-approves without any supervisor, instead of the $750 refund asked for
        script: |-
          (ctx) => {
          const priya = ctx.api('GET', '/agents').body.data.find((a) => a.name === 'Priya Menon' && a.active === true);
          const t = ctx.api('GET', '/tickets?order_number=%23W2000121').body.data[0];
          const o = ctx.api('GET', '/orders?order_number=%23W2000121').body.data[0];
          ctx.assert(t && o, 'ticket or order not found');
          ctx.api('POST', '/tickets/' + t.id + '/refunds', { agent_id: priya.id, order_id: o.id, amount: 50000, reason: 'Item arrived damaged' });
          }
    alternatives:
      - why: finds the ticket and order directly by order number filters instead of through the customer
        script: |-
          (ctx) => {
          const agents = ctx.api('GET', '/agents').body.data;
          const priya = agents.find((a) => a.name === 'Priya Menon' && a.active === true);
          const sup = agents.find((a) => a.role === 'supervisor' && a.active === true);
          const t = ctx.api('GET', '/tickets?order_number=%23W2000121&status=open').body.data[0];
          const o = ctx.api('GET', '/orders?order_number=%23W2000121').body.data[0];
          ctx.assert(priya && sup && t && o, 'lookup failed');
          const r = ctx.api('POST', '/tickets/' + t.id + '/refunds', { agent_id: priya.id, order_id: o.id, amount: 75000, reason: 'Item arrived damaged' });
          ctx.assert(r.status === 201, 'request failed: ' + JSON.stringify(r.body));
          const a = ctx.api('POST', '/refunds/' + r.body.id + '/approve', { agent_id: sup.id });
          ctx.assert(a.status === 200, 'approve failed: ' + JSON.stringify(a.body));
          }
    allows:
      - entity: refund
        kind: created
        fields: []
        where:
          ticket_id: tkt_0022
      - entity: refund
        kind: updated
        fields:
          - status
          - approved_by
        where:
          ticket_id: tkt_0022
