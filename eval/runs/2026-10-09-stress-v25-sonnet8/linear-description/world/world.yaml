format: 1
meta:
  name: world
  description: An issue tracker where teams own issues that members work through backlog, todo, in progress, in review, done or canceled. Actions enforce who may be assigned, a per-team work-in-progress limit, completion and cancellation rules, and comment rules.
  resembles: Linear-style issue tracker (teams, members, projects, issues with a workflow status, comments)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  team:
    description: A group that owns issues. Has a unique short key and a per-assignee work-in-progress limit.
    idPrefix: team
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      key:
        type: string
        description: Unique short uppercase key, such as ENG.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 10
        pattern: ^[A-Z][A-Z0-9]{1,9}$
      wip_limit:
        type: int
        description: Most in_progress issues one assignee may hold at once.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 50
        default: 3
  member:
    description: A person on a team. Role is admin, member or guest. Guests cannot be assigned issues.
    idPrefix: mem
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 200
        format: email
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: restrict
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - admin
          - member
          - guest
        default: member
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  project:
    description: A body of work within a team that groups issues.
    idPrefix: prj
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 160
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: restrict
      status:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - planned
          - active
          - completed
          - canceled
        default: active
  issue:
    description: A unit of work moving through the status lifecycle. Assignment, start, completion and cancellation go through actions.
    idPrefix: iss
    fields:
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: restrict
      project_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: project
        onDelete: nullify
      assignee_id:
        type: ref
        description: Set by the assign_issue action.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: member
        onDelete: nullify
      priority:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - urgent
          - high
          - medium
          - low
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - backlog
          - todo
          - in_progress
          - in_review
          - done
          - canceled
        initial: backlog
        transitions:
          backlog:
            - todo
            - in_progress
            - canceled
          todo:
            - backlog
            - in_progress
            - canceled
          in_progress:
            - todo
            - in_review
            - done
            - canceled
          in_review:
            - in_progress
            - done
            - canceled
          done: []
          canceled: []
      estimate:
        type: int
        description: Story points.
        required: false
        nullable: true
        unique: false
        readonly: false
        min: 0
        max: 100
      started_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      completed_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      canceled_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      due_date:
        type: string
        description: Target date as YYYY-MM-DD.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 10
        pattern: ^\d{4}-\d{2}-\d{2}$
      cycle_id:
        type: ref
        description: The cycle (sprint) the issue is planned into.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: cycle
        onDelete: nullify
  comment:
    description: A message on an issue written by a member of the issue's team. Created by the add_comment action.
    idPrefix: cmt
    fields:
      issue_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: issue
        onDelete: cascade
      author_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: member
        onDelete: restrict
      body:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
  workflow_state:
    description: A named column of a team's issue workflow, such as Todo or In Review. The type groups it into backlog, unstarted, started, completed or canceled. Reference data; issue status stays on the issue.
    idPrefix: wfs
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      type:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - backlog
          - unstarted
          - started
          - completed
          - canceled
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: cascade
      color:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 20
      position:
        type: int
        required: false
        nullable: true
        unique: false
        readonly: false
        min: 0
  issue_label:
    description: A label that can tag issues, either for one team or workspace-wide when team_id is null.
    idPrefix: lbl
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      color:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 20
      team_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: team
        onDelete: cascade
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  cycle:
    description: A time-boxed iteration (sprint) of a team that issues can be planned into.
    idPrefix: cyc
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      number:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      team_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: team
        onDelete: cascade
      starts_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      ends_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
