            const chloe = ctx.api('GET', '/users').body.data.find((u) => u.name === 'Chloe Park');
            const trashed = ctx.api('GET', '/bookmarks?owner_id=' + chloe.id + '&status=trashed').body.data;
            const t = trashed.find((b) => b.title === 'Rust async book');
            ctx.api('POST', '/bookmarks/' + t.id + '/restore', { actor_id: chloe.id });
          }
      - why: restores the right bookmark but then also marks it read, so it does not end unread
        script: |-
          (ctx) => {
            const ben = ctx.api('GET', '/users').body.data.find((u) => u.name === 'Ben Okoye');
            const trashed = ctx.api('GET', '/bookmarks?owner_id=' + ben.id + '&status=trashed').body.data;
            const t = trashed.find((b) => b.title === 'Rust async book');
