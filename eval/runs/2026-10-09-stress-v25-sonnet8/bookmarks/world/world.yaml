            const ben = ctx.api('GET', '/users').body.data.find((u) => u.name === 'Ben Okoye');
            const trashed = ctx.api('GET', '/bookmarks?owner_id=' + ben.id + '&status=trashed').body.data;
            for (const t of trashed) ctx.api('POST', '/bookmarks/' + t.id + '/restore', { actor_id: ben.id });
