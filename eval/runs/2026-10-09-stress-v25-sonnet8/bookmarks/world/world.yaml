    alternatives:
      - why: uses the unread status filter, collects every page first, then adds all bookmarks before marking all of them read
        script: |-
          (ctx) => {
            const users = ctx.api('GET', '/users').body.data;
            const ana = users.find((u) => u.name === 'Ana Rossi');
            const ben = users.find((u) => u.name === 'Ben Okoye');
            const col = ctx.api('GET', '/collections?owner_id=' + ana.id).body.data.find((c) => c.name === 'Team Reading');
            const folder = ctx.api('GET', '/folders?owner_id=' + ben.id).body.data.find((f) => f.name === 'Rust');
            const ids = [];
            let cursor = null;
            do {
              const r = ctx.api('GET', '/bookmarks?limit=10&owner_id=' + ben.id + '&folder_id=' + folder.id + '&status=unread' + (cursor === null ? '' : '&cursor=' + cursor));
              for (const b of r.body.data) ids.push(b.id);
              cursor = r.body.next_cursor;
            } while (cursor !== null && cursor !== undefined);
            ctx.assert(ids.length > 10, 'expected several pages');
            ctx.assert(ctx.api('POST', '/collections/' + col.id + '/members', { actor_id: ana.id, user_id: ben.id, role: 'editor' }).status < 300, 'share failed');
            for (const id of ids) ctx.assert(ctx.api('POST', '/collections/' + col.id + '/items', { actor_id: ben.id, bookmark_id: id }).status === 201, 'add failed');
            for (const id of ids) ctx.assert(ctx.api('POST', '/bookmarks/' + id + '/read', { actor_id: ben.id }).status === 200, 'read failed');
          }
