            for (const t of page) ctx.api('POST', '/collections/' + col.id + '/items', { actor_id: ben.id, bookmark_id: t.id });
          }
      - why: adds every bookmark in Ben's Rust folder on all pages, including read and archived ones, ignoring the unread condition
