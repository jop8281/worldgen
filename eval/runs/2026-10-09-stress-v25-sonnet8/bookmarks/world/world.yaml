  share_and_fill_collection:
    difficulty: hard
    instruction: Ana Rossi owns the private collection 'Team Reading'. As Ana, share it with Ben Okoye as an editor. Then, acting as Ben, add every bookmark of Ben's that is currently unread and sits in his folder 'Rust' to that collection, and mark each of those bookmarks as read after adding it. Ben has more bookmarks than fit on one page, so check all pages. Do not add or change bookmarks that are not unread or not in that folder.
    grader: |-
      (ctx) => {
        const ana = ctx.seed.list('user', { where: { name: 'Ana Rossi' } })[0];
        const ben = ctx.seed.list('user', { where: { name: 'Ben Okoye' } })[0];
        if (!ana || !ben) return 0;
        const col = ctx.seed.list('collection', { where: { owner_id: ana.id, name: 'Team Reading' } })[0];
        const folder = ctx.seed.list('folder', { where: { owner_id: ben.id, name: 'Rust' } })[0];
        if (!col || !folder) return 0;
        const targets = ctx.seed.list('bookmark', { where: { owner_id: ben.id, folder_id: folder.id, status: 'unread' } });
        if (targets.length === 0) return 0;
        const tids = new Set(targets.map((t) => t.id));
        const allowed = [{ entity: 'collection', id: col.id, kind: 'updated', fields: ['visibility'] }];
        for (const m of ctx.db.list('collection_member', { where: { collection_id: col.id } })) {
          if (ctx.seed.get('collection_member', m.id) === null && m.user_id === ben.id && m.role === 'editor') allowed.push({ entity: 'collection_member', id: m.id, kind: 'created', fields: ['collection_id', 'user_id', 'role'] });
        }
        for (const i of ctx.db.list('collection_item', { where: { collection_id: col.id } })) {
          if (ctx.seed.get('collection_item', i.id) === null && tids.has(i.bookmark_id) && i.added_by === ben.id) allowed.push({ entity: 'collection_item', id: i.id, kind: 'created', fields: ['collection_id', 'bookmark_id', 'added_by'] });
        }
        for (const t of targets) allowed.push({ entity: 'bookmark', id: t.id, kind: 'updated', fields: ['status'] });
        for (const a of ctx.db.list('activity')) {
          if (ctx.seed.get('activity', a.id) !== null) continue;
          const onCol = a.subject_id === col.id && (a.actor_id === ana.id || a.actor_id === ben.id);
          const onTarget = tids.has(a.subject_id) && a.actor_id === ben.id;
          if (onCol || onTarget) allowed.push({ entity: 'activity', id: a.id, kind: 'created', fields: ['actor_id', 'action', 'subject_type', 'subject_id', 'details'] });
        }
        ctx.guardChanges('only the share, the target items and their read status change', allowed);
        const members = ctx.db.list('collection_member', { where: { collection_id: col.id, user_id: ben.id } });
        ctx.goal(0.2, 'Ben is an editor', members.length === 1 && members[0].role === 'editor');
        const items = ctx.db.list('collection_item', { where: { collection_id: col.id } });
        ctx.goal(0.4, 'every unread Rust bookmark is in the collection', targets.every((t) => items.some((i) => i.bookmark_id === t.id && i.added_by === ben.id)));
        ctx.goal(0.4, 'every added bookmark is read', targets.every((t) => { const e = ctx.db.get('bookmark', t.id); return !!e && e.status === 'read'; }));
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const users = ctx.api('GET', '/users').body.data;
        const ana = users.find((u) => u.name === 'Ana Rossi');
        const ben = users.find((u) => u.name === 'Ben Okoye');
        ctx.assert(ana && ben, 'users not found');
        const col = ctx.api('GET', '/collections?owner_id=' + ana.id).body.data.find((c) => c.name === 'Team Reading');
        ctx.assert(col, 'collection not found');
        const folder = ctx.api('GET', '/folders?owner_id=' + ben.id).body.data.find((f) => f.name === 'Rust');
        ctx.assert(folder, 'folder not found');
        const targets = [];
