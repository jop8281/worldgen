            const trashed = ctx.api('GET', '/bookmarks?owner_id=' + ben.id + '&status=trashed').body.data;
            const t = trashed.find((b) => b.title === 'Rust async book (old)');
            ctx.api('POST', '/bookmarks/' + t.id + '/restore', { actor_id: ben.id });
