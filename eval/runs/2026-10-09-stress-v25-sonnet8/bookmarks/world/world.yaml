format: 1
meta:
  name: world
  description: Users save bookmarks into a nested folder tree, label them with per-user tags, and move them through unread, read, archived and trashed. Trash is purged after 30 days. Collections are private, shared (viewer or editor members) or public with an optional expiry. Actions enforce ownership, permission and folder-cycle rules and write an activity log. Two daily jobs purge old trash and expire public links.
  resembles: Raindrop.io / Pocket-style multi-user bookmark manager with folders, tags and shareable collections
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  user:
    description: Account that owns bookmarks, folders, tags and collections.
    idPrefix: usr
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 160
        format: email
  folder:
    description: Node in a user's nested folder tree; parent_id is null for a root folder. Created and moved only through actions.
    idPrefix: fld
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      parent_id:
        type: ref
        description: Parent folder, null for a root folder. Changed only by move_folder.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: folder
        onDelete: nullify
  tag:
    description: Per-user label that can be attached to the owner's bookmarks.
    idPrefix: tag
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: cascade
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
  bookmark:
    description: Saved URL owned by one user, with a status state machine, an optional folder and a trashed_at stamp. Status, folder and trashed_at change only through actions.
    idPrefix: bkm
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      url:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 2000
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 300
      note:
        type: text
        description: Optional personal note about the bookmark.
        required: false
        nullable: true
        unique: false
        readonly: false
      folder_id:
        type: ref
        description: Folder holding the bookmark, null when unfiled. Changed only by move_bookmark.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: folder
        onDelete: nullify
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - unread
          - read
          - archived
          - trashed
        initial: unread
        transitions:
          unread:
            - read
            - archived
            - trashed
          read:
            - unread
            - archived
            - trashed
          archived:
            - unread
            - read
            - trashed
          trashed:
            - unread
      trashed_at:
        type: datetime
        description: When the bookmark was moved to trash; null otherwise. Trash is purged 30 days after this.
        required: false
        nullable: true
        unique: false
        readonly: true
  bookmark_tag:
    description: Join row linking a bookmark to a tag, once per pair.
    idPrefix: bkt
    fields:
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: bookmark
        onDelete: cascade
      tag_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: tag
        onDelete: cascade
  collection:
    description: Group of bookmarks with visibility private, shared or public and an optional public expiry.
    idPrefix: col
    fields:
      owner_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      visibility:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - private
          - shared
          - public
        initial: private
        transitions:
          private:
            - shared
            - public
          shared:
            - private
            - public
          public:
            - private
            - shared
      public_expires_at:
        type: datetime
        description: When a public collection reverts to private; null means it never expires.
        required: false
        nullable: true
        unique: false
        readonly: true
  collection_member:
    description: Membership of a user in a shared collection as viewer or editor.
    idPrefix: cmb
    fields:
      collection_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: collection
        onDelete: cascade
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: cascade
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - viewer
          - editor
  collection_item:
    description: A bookmark placed in a collection by a user.
    idPrefix: cit
    fields:
      collection_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: collection
        onDelete: cascade
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: bookmark
        onDelete: cascade
      added_by:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: user
        onDelete: restrict
  activity:
    description: Activity log row written by every action and job.
    idPrefix: act
    fields:
      actor_id:
        type: ref
        description: The acting user, null when a job wrote the row.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: user
        onDelete: nullify
      action:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 80
      subject_type:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 40
      subject_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 40
      details:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
routes:
  list_users:
    op: list
    entity: user
    filters: []
    search:
      - name
      - email
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /users
    description: List users.
  get_user:
    op: get
    entity: user
    method: GET
    path: /users/{id}
    description: Fetch a user.
  create_user:
    op: create
    entity: user
    method: POST
    path: /users
    description: Register a user.
  list_folders:
    op: list
    entity: folder
    filters:
      - owner_id
      - parent_id
    search:
      - name
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /folders
    description: List folders, filter by owner_id and parent_id.
  get_folder:
    op: get
    entity: folder
    method: GET
    path: /folders/{id}
    description: Fetch a folder.
  list_tags:
    op: list
    entity: tag
    filters:
      - owner_id
    search:
      - name
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /tags
    description: List tags, filter by owner_id.
  create_tag:
    op: create
    entity: tag
    method: POST
    path: /tags
    description: Create a tag for an owner.
  list_bookmarks:
    op: list
    entity: bookmark
    filters:
      - owner_id
      - folder_id
      - status
    search:
      - title
      - url
    sort:
      - created_at
      - title
    pageSize: 10
    method: GET
    path: /bookmarks
    description: List bookmarks, filter by owner_id, folder_id and status; search title and url.
  get_bookmark:
    op: get
    entity: bookmark
    method: GET
    path: /bookmarks/{id}
    description: Fetch a bookmark.
  update_bookmark:
    op: update
    entity: bookmark
    method: PATCH
    path: /bookmarks/{id}
    description: Edit url, title and note only. Status, folder and trash change only through actions.
  list_bookmark_tags:
    op: list
    entity: bookmark_tag
    filters:
      - bookmark_id
      - tag_id
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /bookmark_tags
    description: List bookmark-tag links, filter by bookmark_id and tag_id.
  list_collections:
    op: list
    entity: collection
    filters:
      - owner_id
      - visibility
    search:
      - name
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /collections
    description: List collections, filter by owner_id and visibility.
  get_collection:
    op: get
    entity: collection
    method: GET
    path: /collections/{id}
    description: Fetch a collection.
  list_collection_members:
    op: list
    entity: collection_member
    filters:
      - user_id
      - role
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /collections/{collection_id}/members
    description: List members of a collection.
  list_collection_items:
    op: list
    entity: collection_item
    filters:
      - bookmark_id
      - added_by
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /collections/{collection_id}/items
    description: List items of a collection.
  list_activity:
    op: list
    entity: activity
    filters:
      - actor_id
      - action
      - subject_type
      - subject_id
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /activity
    description: List the activity log, filter by actor_id, action and subject_id.
actions:
  create_bookmark:
    method: POST
    path: /bookmarks
    description: Save a bookmark for the actor, optionally in one of their folders.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      url:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 2000
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 300
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      folder_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const b = ctx.body;
        let folderId = null;
        if (b.folder_id !== undefined && b.folder_id !== null) {
          const f = ctx.db.get('folder', b.folder_id);
          if (f === null) ctx.fail(404, 'row.not_found', 'folder ' + b.folder_id + ' not found');
          if (f.owner_id !== b.actor_id) ctx.fail(409, 'forbidden', 'folder ' + f.id + ' belongs to another user');
          folderId = f.id;
        }
        const row = ctx.db.create('bookmark', { owner_id: b.actor_id, url: b.url, title: b.title, note: b.note === undefined ? null : b.note, folder_id: folderId, trashed_at: null });
        ctx.db.create('activity', { actor_id: b.actor_id, action: 'create_bookmark', subject_type: 'bookmark', subject_id: row.id, details: null });
        return { status: 201, body: row };
      }
  mark_read:
    method: POST
    path: /bookmarks/{id}/read
    description: Mark an own bookmark as read. Refused on trashed bookmarks.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'row.not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may change bookmark ' + bm.id);
        if (bm.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + bm.id + ' is trashed. Restore it first.');
        let row = bm;
        if (bm.status !== 'read') row = ctx.db.update('bookmark', bm.id, { status: 'read' });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'mark_read', subject_type: 'bookmark', subject_id: bm.id, details: null });
        return { status: 200, body: row };
      }
  archive_bookmark:
    method: POST
    path: /bookmarks/{id}/archive
    description: Archive an own bookmark. Refused on trashed bookmarks.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'row.not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may change bookmark ' + bm.id);
        if (bm.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + bm.id + ' is trashed. Restore it first.');
        let row = bm;
        if (bm.status !== 'archived') row = ctx.db.update('bookmark', bm.id, { status: 'archived' });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'archive_bookmark', subject_type: 'bookmark', subject_id: bm.id, details: null });
        return { status: 200, body: row };
      }
  trash_bookmark:
    method: POST
    path: /bookmarks/{id}/trash
    description: Move an own bookmark to trash and stamp trashed_at.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'row.not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may trash bookmark ' + bm.id);
        if (bm.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + bm.id + ' is already trashed');
        const row = ctx.db.update('bookmark', bm.id, { status: 'trashed', trashed_at: ctx.now() });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'trash_bookmark', subject_type: 'bookmark', subject_id: bm.id, details: null });
        return { status: 200, body: row };
      }
  restore_bookmark:
    method: POST
    path: /bookmarks/{id}/restore
    description: Restore a trashed own bookmark to unread and clear trashed_at.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'row.not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may restore bookmark ' + bm.id);
        if (bm.status !== 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + bm.id + ' is ' + bm.status + '. Only trashed bookmarks can be restored.');
        const row = ctx.db.update('bookmark', bm.id, { status: 'unread', trashed_at: null });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'restore_bookmark', subject_type: 'bookmark', subject_id: bm.id, details: null });
        return { status: 200, body: row };
      }
  move_bookmark:
    method: POST
    path: /bookmarks/{id}/move
    description: Move an own bookmark into one of the owner's folders, or to no folder with null.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      folder_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'row.not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may move bookmark ' + bm.id);
        if (bm.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + bm.id + ' is trashed. Restore it first.');
        let folderId = null;
        if (ctx.body.folder_id !== undefined && ctx.body.folder_id !== null) {
          const f = ctx.db.get('folder', ctx.body.folder_id);
          if (f === null) ctx.fail(404, 'row.not_found', 'folder ' + ctx.body.folder_id + ' not found');
          if (f.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'folder ' + f.id + ' belongs to another user');
          folderId = f.id;
        }
        const row = ctx.db.update('bookmark', bm.id, { folder_id: folderId });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'move_bookmark', subject_type: 'bookmark', subject_id: bm.id, details: null });
        return { status: 200, body: row };
      }
  tag_bookmark:
    method: POST
    path: /bookmarks/{id}/tags
    description: Attach one of the actor's tags to one of the actor's bookmarks, once per pair.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      tag_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: tag
        onDelete: restrict
    handler: |-
      (ctx) => {
        const bm = ctx.db.get('bookmark', ctx.params.id);
        if (bm === null) ctx.fail(404, 'row.not_found', 'bookmark ' + ctx.params.id + ' not found');
        if (bm.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may tag bookmark ' + bm.id);
        const tag = ctx.db.get('tag', ctx.body.tag_id);
        if (tag === null) ctx.fail(404, 'row.not_found', 'tag ' + ctx.body.tag_id + ' not found');
        if (tag.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'tag ' + tag.id + ' belongs to another user');
        if (ctx.db.list('bookmark_tag', { where: { bookmark_id: bm.id, tag_id: tag.id } }).length > 0) ctx.fail(409, 'duplicate_tag', 'bookmark ' + bm.id + ' already has tag ' + tag.id);
        const row = ctx.db.create('bookmark_tag', { bookmark_id: bm.id, tag_id: tag.id });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'tag_bookmark', subject_type: 'bookmark', subject_id: bm.id, details: null });
        return { status: 201, body: row };
      }
  create_folder:
    method: POST
    path: /folders
    description: Create a folder for the actor, optionally under one of their folders.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      parent_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const b = ctx.body;
        let parentId = null;
        if (b.parent_id !== undefined && b.parent_id !== null) {
          const p = ctx.db.get('folder', b.parent_id);
          if (p === null) ctx.fail(404, 'row.not_found', 'folder ' + b.parent_id + ' not found');
          if (p.owner_id !== b.actor_id) ctx.fail(409, 'forbidden', 'folder ' + p.id + ' belongs to another user');
          parentId = p.id;
        }
        const row = ctx.db.create('folder', { owner_id: b.actor_id, name: b.name, parent_id: parentId });
        ctx.db.create('activity', { actor_id: b.actor_id, action: 'create_folder', subject_type: 'folder', subject_id: row.id, details: null });
        return { status: 201, body: row };
      }
  move_folder:
    method: POST
    path: /folders/{id}/move
    description: Reparent an own folder under another own folder or to root with null. Refuses cycles.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      parent_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: folder
        onDelete: restrict
    handler: |-
      (ctx) => {
        const f = ctx.db.get('folder', ctx.params.id);
        if (f === null) ctx.fail(404, 'row.not_found', 'folder ' + ctx.params.id + ' not found');
        if (f.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may move folder ' + f.id);
        let parentId = null;
        if (ctx.body.parent_id !== undefined && ctx.body.parent_id !== null) {
          const p = ctx.db.get('folder', ctx.body.parent_id);
          if (p === null) ctx.fail(404, 'row.not_found', 'folder ' + ctx.body.parent_id + ' not found');
          if (p.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'folder ' + p.id + ' belongs to another user');
          let cur = p; let guard = 0;
          while (cur !== null && guard < 1000) {
            if (cur.id === f.id) ctx.fail(409, 'cycle_detected', 'folder ' + f.id + ' cannot be moved into itself or its descendant ' + p.id);
            cur = cur.parent_id ? ctx.db.get('folder', cur.parent_id) : null;
            guard++;
          }
          parentId = p.id;
        }
        const row = ctx.db.update('folder', f.id, { parent_id: parentId });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'move_folder', subject_type: 'folder', subject_id: f.id, details: null });
        return { status: 200, body: row };
      }
  create_collection:
    method: POST
    path: /collections
    description: Create a private collection owned by the actor.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const b = ctx.body;
        const row = ctx.db.create('collection', { owner_id: b.actor_id, name: b.name, description: b.description === undefined ? null : b.description, public_expires_at: null });
        ctx.db.create('activity', { actor_id: b.actor_id, action: 'create_collection', subject_type: 'collection', subject_id: row.id, details: null });
        return { status: 201, body: row };
      }
  set_collection_visibility:
    method: POST
    path: /collections/{id}/visibility
    description: Owner sets visibility to private, shared or public. A public expiry must lie in the future and applies only to public.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      visibility:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - private
          - shared
          - public
      public_expires_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const c = ctx.db.get('collection', ctx.params.id);
        if (c === null) ctx.fail(404, 'row.not_found', 'collection ' + ctx.params.id + ' not found');
        if (c.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may change collection ' + c.id);
        const vis = ctx.body.visibility;
        let exp = null;
        if (vis === 'public' && ctx.body.public_expires_at !== undefined && ctx.body.public_expires_at !== null) {
          exp = ctx.body.public_expires_at;
          if (ctx.time.minutesBetween(ctx.now(), exp) <= 0) ctx.fail(400, 'invalid_expiry', 'public_expires_at must be in the future');
        }
        const patch = { public_expires_at: exp };
        if (vis !== c.visibility) patch.visibility = vis;
        const row = ctx.db.update('collection', c.id, patch);
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'set_collection_visibility', subject_type: 'collection', subject_id: c.id, details: vis });
        return { status: 200, body: row };
      }
  share_collection:
    method: POST
    path: /collections/{id}/members
    description: Owner adds a member as viewer or editor, or changes an existing member's role. A private collection becomes shared.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      user_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - viewer
          - editor
    handler: |-
      (ctx) => {
        const c = ctx.db.get('collection', ctx.params.id);
        if (c === null) ctx.fail(404, 'row.not_found', 'collection ' + ctx.params.id + ' not found');
        if (c.owner_id !== ctx.body.actor_id) ctx.fail(409, 'forbidden', 'only the owner may share collection ' + c.id);
        const u = ctx.db.get('user', ctx.body.user_id);
        if (u === null) ctx.fail(404, 'row.not_found', 'user ' + ctx.body.user_id + ' not found');
        if (u.id === c.owner_id) ctx.fail(400, 'invalid_member', 'the owner is already a member of the collection');
        const existing = ctx.db.list('collection_member', { where: { collection_id: c.id, user_id: u.id } });
        let row; let status = 201;
        if (existing.length > 0) {
          row = existing[0];
          if (row.role !== ctx.body.role) row = ctx.db.update('collection_member', row.id, { role: ctx.body.role });
          status = 200;
        } else {
          row = ctx.db.create('collection_member', { collection_id: c.id, user_id: u.id, role: ctx.body.role });
        }
        if (c.visibility === 'private') ctx.db.update('collection', c.id, { visibility: 'shared' });
        ctx.db.create('activity', { actor_id: ctx.body.actor_id, action: 'share_collection', subject_type: 'collection', subject_id: c.id, details: u.id + ':' + ctx.body.role });
        return { status, body: row };
      }
  add_to_collection:
    method: POST
    path: /collections/{id}/items
    description: Owner or editor adds one of their own bookmarks to a collection.
    input:
      actor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: user
        onDelete: restrict
      bookmark_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: bookmark
        onDelete: restrict
    handler: |-
      (ctx) => {
        const c = ctx.db.get('collection', ctx.params.id);
        if (c === null) ctx.fail(404, 'row.not_found', 'collection ' + ctx.params.id + ' not found');
        const actor = ctx.body.actor_id;
        let allowed = c.owner_id === actor;
        if (!allowed) {
          const m = ctx.db.list('collection_member', { where: { collection_id: c.id, user_id: actor } });
          allowed = m.length > 0 && m[0].role === 'editor';
        }
        if (!allowed) ctx.fail(409, 'forbidden', 'user ' + actor + ' may not add to collection ' + c.id);
        const bm = ctx.db.get('bookmark', ctx.body.bookmark_id);
        if (bm === null) ctx.fail(404, 'row.not_found', 'bookmark ' + ctx.body.bookmark_id + ' not found');
        if (bm.owner_id !== actor) ctx.fail(409, 'forbidden', 'bookmark ' + bm.id + ' belongs to another user');
        if (bm.status === 'trashed') ctx.fail(409, 'invalid_state', 'bookmark ' + bm.id + ' is trashed');
        if (ctx.db.list('collection_item', { where: { collection_id: c.id, bookmark_id: bm.id } }).length > 0) ctx.fail(409, 'duplicate_item', 'bookmark ' + bm.id + ' is already in collection ' + c.id);
        const row = ctx.db.create('collection_item', { collection_id: c.id, bookmark_id: bm.id, added_by: actor });
        ctx.db.create('activity', { actor_id: actor, action: 'add_to_collection', subject_type: 'collection', subject_id: c.id, details: bm.id });
        return { status: 201, body: row };
      }
jobs:
  purge_trash:
    description: Daily. Hard-delete trashed bookmarks 30 days or more past trashed_at, with their tag links and collection items, and log activity.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const b of ctx.db.list('bookmark', { where: { status: 'trashed' } })) {
          if (b.trashed_at === null || ctx.time.minutesBetween(b.trashed_at, now) < 43200) continue;
          for (const l of ctx.db.list('bookmark_tag', { where: { bookmark_id: b.id } })) ctx.db.delete('bookmark_tag', l.id);
          for (const i of ctx.db.list('collection_item', { where: { bookmark_id: b.id } })) ctx.db.delete('collection_item', i.id);
          ctx.db.delete('bookmark', b.id);
          ctx.db.create('activity', { action: 'purge_trash', subject_type: 'bookmark', subject_id: b.id, details: 'purged after 30 days in trash' });
        }
      }
  expire_public_links:
    description: Daily. Public collections whose expiry has passed go back to private and the expiry is cleared.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const c of ctx.db.list('collection', { where: { visibility: 'public' } })) {
          if (c.public_expires_at === null || ctx.time.minutesBetween(now, c.public_expires_at) > 0) continue;
          ctx.db.update('collection', c.id, { visibility: 'private', public_expires_at: null });
          ctx.db.create('activity', { action: 'expire_public_links', subject_type: 'collection', subject_id: c.id, details: 'public link expired' });
        }
      }
