    (ctx) => {
      const t = ctx.time.minus(ctx.now(), '60d');
      return [
        ['Country Sourdough','BRD-001','bread',750,3],
        ['Seeded Sourdough','BRD-002','bread',800,14],
        ['Cinnamon Roll','PST-001','pastry',425,20],
