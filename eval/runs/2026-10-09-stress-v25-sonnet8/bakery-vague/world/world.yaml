      return [
        ['Maria Lopez','maria.lopez@example.com','+1-555-0101'],
        ['Mario Lopez','mario.lopez@example.com','+1-555-0102'],
        ['Daniel Kim','daniel.kim@example.com','+1-555-0103'],
