format: 1
meta:
  name: world
  description: A bakery sells products with limited daily stock. Customers place pickup orders that reserve stock; staff move orders through production, ready and pickup. Cancelling a placed order restores stock, and ready orders not collected within 24 hours expire.
  resembles: Bakery order and pickup system (Square for Restaurants / Toast-style bakery ordering)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T08:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  product:
    description: A bakery item for sale (bread, pastry, cake) with a price and stock on hand. Stock changes only through restock_product and the order actions.
    idPrefix: prd
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      sku:
        type: string
        description: Unique stock keeping unit.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      category:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - bread
          - pastry
          - cake
          - cookie
          - other
      price:
        type: money
        description: Unit price in USD cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      stock:
        type: int
        description: Units on hand. Changed only by actions.
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
  customer:
    description: A person who orders for pickup.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 160
        format: email
      phone:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 30
  bakery_order:
    description: A pickup order of one quantity of one product by a customer. Moves through the fulfillment state machine by actions and the expire_ready_orders job only.
    idPrefix: ord
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: customer
        onDelete: restrict
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: product
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 1
        max: 1000
      total:
        type: money
        description: price x quantity at placement.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      pickup_date:
        type: string
        description: Pickup day, YYYY-MM-DD.
        required: true
        nullable: false
        unique: false
        readonly: true
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - placed
          - in_production
          - ready
          - picked_up
          - cancelled
          - expired
        initial: placed
        transitions:
          placed:
            - in_production
            - cancelled
          in_production:
            - ready
          ready:
            - picked_up
            - expired
          picked_up: []
          cancelled: []
          expired: []
      ready_at:
        type: datetime
        description: Stamped when the order is marked ready.
        required: false
        nullable: true
        unique: false
        readonly: true
routes:
  list_products:
    op: list
    entity: product
    filters:
      - category
    search:
      - name
      - sku
    sort:
      - price
      - name
    pageSize: 25
    method: GET
    path: /products
    description: List products, filter by category, sort by price or name.
  get_product:
    op: get
    entity: product
    method: GET
    path: /products/{id}
    description: Fetch one product.
  create_product:
    op: create
    entity: product
    method: POST
    path: /products
    description: Add a product. Stock starts at 0.
  update_product:
    op: update
    entity: product
    method: PATCH
    path: /products/{id}
    description: Edit name, category or price.
  list_customers:
    op: list
    entity: customer
    filters: []
    search:
      - name
      - email
    sort:
      - name
      - created_at
    pageSize: 25
    method: GET
    path: /customers
    description: List customers, search by name and email.
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /customers/{id}
    description: Fetch one customer.
  create_customer:
    op: create
    entity: customer
    method: POST
    path: /customers
    description: Register a customer.
  list_orders:
    op: list
    entity: bakery_order
    filters:
      - status
      - customer_id
      - product_id
      - pickup_date
    search: []
    sort:
      - pickup_date
      - created_at
    pageSize: 25
    method: GET
    path: /orders
    description: List orders, filter by status, customer, product and pickup date; sort by pickup_date.
  get_order:
    op: get
    entity: bakery_order
    method: GET
    path: /orders/{id}
    description: Fetch one order.
actions:
  place_order:
    method: POST
    path: /orders
    description: Place a pickup order. Reserves stock and computes total. 409 insufficient_stock if not enough stock.
    input:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 1000
      pickup_date:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    handler: |-
      (ctx) => {
        const b = ctx.body;
        const c = ctx.db.get('customer', b.customer_id);
        if (c === null) ctx.fail(404, 'not_found', 'customer ' + b.customer_id + ' not found');
        const p = ctx.db.get('product', b.product_id);
        if (p === null) ctx.fail(404, 'not_found', 'product ' + b.product_id + ' not found');
        if (p.stock < b.quantity) ctx.fail(409, 'insufficient_stock', 'product ' + p.name + ' has ' + p.stock + ' in stock but ' + b.quantity + ' requested');
        ctx.db.update('product', p.id, { stock: p.stock - b.quantity });
        const o = ctx.db.create('bakery_order', { customer_id: c.id, product_id: p.id, quantity: b.quantity, total: p.price * b.quantity, pickup_date: b.pickup_date, ready_at: null });
        return { status: 201, body: o };
      }
  start_production:
    method: POST
    path: /orders/{id}/start_production
    description: Move a placed order into production.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('bakery_order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'placed') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only placed orders can start production.');
        return { status: 200, body: ctx.db.update('bakery_order', id, { status: 'in_production' }) };
      }
  mark_ready:
    method: POST
    path: /orders/{id}/mark_ready
    description: Mark an in-production order ready and stamp ready_at.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('bakery_order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'in_production') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only in_production orders can be marked ready.');
        return { status: 200, body: ctx.db.update('bakery_order', id, { status: 'ready', ready_at: ctx.now() }) };
      }
  pick_up:
    method: POST
    path: /orders/{id}/pick_up
    description: Customer collects a ready order.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('bakery_order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'ready') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only ready orders can be picked up.');
        return { status: 200, body: ctx.db.update('bakery_order', id, { status: 'picked_up' }) };
      }
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a placed order and restore its reserved stock.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('bakery_order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'placed') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only placed orders can be cancelled.');
        const p = ctx.db.get('product', o.product_id);
        ctx.db.update('product', p.id, { stock: p.stock + o.quantity });
        return { status: 200, body: ctx.db.update('bakery_order', id, { status: 'cancelled' }) };
      }
  restock_product:
    method: POST
    path: /products/{id}/restock
    description: Add a positive quantity to a product's stock.
    input:
      quantity:
        type: int
        description: Units to add, must be positive.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const p = ctx.db.get('product', id);
        if (p === null) ctx.fail(404, 'not_found', 'product ' + id + ' not found');
        const q = ctx.body.quantity;
        if (!Number.isInteger(q) || q < 1) ctx.fail(400, 'input.invalid', 'quantity must be a positive integer');
        return { status: 200, body: ctx.db.update('product', id, { stock: p.stock + q }) };
      }
jobs:
  expire_ready_orders:
    description: Every hour, ready orders whose ready_at is 24 hours or more in the past become expired. Stock is not restored.
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const o of ctx.db.list('bakery_order', { where: { status: 'ready' } })) {
          if (o.ready_at === null) continue;
          if (ctx.time.minutesBetween(o.ready_at, now) >= 1440) ctx.db.update('bakery_order', o.id, { status: 'expired' });
        }
      }
fixtures: {}
