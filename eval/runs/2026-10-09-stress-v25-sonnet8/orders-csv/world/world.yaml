format: 1
meta:
  name: world
  description: An order desk where customers' orders move from pending through paid, shipped and delivered, or end cancelled or refunded. Agents read orders and customers and run the fulfilment actions. The orders and customers CSV tables are kept exactly.
  resembles: Shopify-style order desk (orders and customers admin API)
  source: worldgen
  seed: 0
  clock:
    start: 2026-04-08T09:00:00Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A buyer of the shop, imported from the customers CSV. Emails are unique.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 200
        format: email
      country:
        type: string
        description: ISO 3166 alpha-2 country code.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 2
      plan:
        type: string
        description: Subscription plan, such as free, pro or team.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 20
  order:
    description: A customer order. It starts pending and moves through paid, shipped and delivered, or ends cancelled or refunded. Transitions run through the workflow actions.
    idPrefix: ord
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      status:
        type: state
        description: Fulfilment status. Changed only by the pay, ship, deliver, cancel and refund actions.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - paid
          - shipped
          - delivered
          - cancelled
          - refunded
        initial: pending
        transitions:
          pending:
            - paid
            - cancelled
          paid:
            - shipped
            - cancelled
            - refunded
          shipped:
            - delivered
          delivered:
            - refunded
          cancelled: []
          refunded: []
      total_cents:
        type: money
        description: Order total in cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      currency:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 3
        default: USD
      item_count:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      placed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      shipped_at:
        type: datetime
        description: Set by the ship action.
        required: false
        nullable: true
        unique: false
        readonly: true
      note:
        type: enum
        description: Optional delivery note.
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - Deliver after 5pm
          - Back door, ring twice
          - Call "before" delivery
          - Gift wrap, no receipt
routes:
  list_orders:
    op: list
    entity: order
    filters:
      - status
      - customer_id
      - currency
      - note
      - item_count
    search: []
    sort:
      - placed_at
      - total_cents
    pageSize: 25
    method: GET
    path: /orders
    description: List orders, filter by status, customer_id, currency, note and item_count, sort by placed_at and total_cents.
  get_order:
    op: get
    entity: order
    method: GET
    path: /orders/{id}
    description: Read one order.
  create_order:
    op: create
    entity: order
    method: POST
    path: /orders
    description: Create a pending order.
  list_customers:
    op: list
    entity: customer
    filters:
      - plan
      - country
    search:
      - name
      - email
    sort:
      - name
    pageSize: 25
    method: GET
    path: /customers
    description: List customers, filter by plan and country, search by name and email.
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /customers/{id}
    description: Read one customer.
  create_customer:
    op: create
    entity: customer
    method: POST
    path: /customers
    description: Create a customer.
actions:
  pay_order:
    method: POST
    path: /orders/{id}/pay
    description: Mark a pending order paid.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only pending orders can be paid.');
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'paid' }) };
      }
  ship_order:
    method: POST
    path: /orders/{id}/ship
    description: Ship a paid order and set shipped_at.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only paid orders can be shipped.');
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'shipped', shipped_at: ctx.now() }) };
      }
  deliver_order:
    method: POST
    path: /orders/{id}/deliver
    description: Mark a shipped order delivered.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'shipped') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only shipped orders can be delivered.');
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'delivered' }) };
      }
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a pending or paid order.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'pending' && o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only pending and paid orders can be cancelled.');
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'cancelled' }) };
      }
  refund_order:
    method: POST
    path: /orders/{id}/refund
    description: Refund a paid or delivered order. Refund is final.
    input: {}
    handler: |-
      (ctx) => {
        const o = ctx.db.get('order', ctx.params.id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + ctx.params.id + ' not found');
        if (o.status !== 'paid' && o.status !== 'delivered') ctx.fail(409, 'invalid_state', 'order ' + o.id + ' is ' + o.status + '. Only paid and delivered orders can be refunded.');
        return { status: 200, body: ctx.db.update('order', o.id, { status: 'refunded' }) };
      }
jobs: {}
