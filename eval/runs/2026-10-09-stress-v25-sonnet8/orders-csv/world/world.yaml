seed:
  customer: "(ctx) => ctx.fixtures.customers.map((r) => { const { id, ...rest } = r; return { ...rest, updated_at: r.created_at }; })"
  order: "(ctx) => ctx.fixtures.orders.map((r) => { const { id, ...rest } = r; return { ...rest, created_at: r.placed_at, updated_at: r.shipped_at ? r.shipped_at : r.placed_at }; })"
tests:
  pay_order_flow:
    description: Create a customer and an order, pay it, then pay again.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Pay Tester', email: 'pay.tester@payflow.test', country: 'GB', plan: 'pro' });
        ctx.assert(c.status === 201, 'create customer ' + JSON.stringify(c.body));
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 1500, currency: 'USD', item_count: 1, placed_at: '2026-04-01T10:00:00Z' });
        ctx.assert(o.status === 201 && o.body.status === 'pending', 'create order ' + JSON.stringify(o.body));
        const p = ctx.api('POST', '/orders/' + o.body.id + '/pay', {});
        ctx.assert(p.status === 200 && p.body.status === 'paid', 'pay ' + JSON.stringify(p.body));
        const again = ctx.api('POST', '/orders/' + o.body.id + '/pay', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second pay ' + JSON.stringify(again.body));
      }
  ship_order_flow:
    description: Ship a pending order (refused), pay it, ship it.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Ship Tester', email: 'ship.tester@shipflow.test', country: 'DE', plan: 'free' });
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 2500, currency: 'USD', item_count: 2, placed_at: '2026-04-01T11:00:00Z' });
        ctx.assert(o.status === 201, 'create order ' + JSON.stringify(o.body));
        const early = ctx.api('POST', '/orders/' + o.body.id + '/ship', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'ship pending ' + JSON.stringify(early.body));
        ctx.assert(ctx.api('POST', '/orders/' + o.body.id + '/pay', {}).status === 200, 'pay');
        const s = ctx.api('POST', '/orders/' + o.body.id + '/ship', {});
        ctx.assert(s.status === 200 && s.body.status === 'shipped' && s.body.shipped_at !== null, 'ship ' + JSON.stringify(s.body));
      }
  deliver_order_flow:
    description: Deliver a paid order (refused), ship it, deliver it, deliver again.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Deliver Tester', email: 'deliver.tester@deliverflow.test', country: 'FR', plan: 'pro' });
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 900, currency: 'USD', item_count: 1, placed_at: '2026-04-02T10:00:00Z' });
        const id = o.body.id;
        ctx.api('POST', '/orders/' + id + '/pay', {});
        const early = ctx.api('POST', '/orders/' + id + '/deliver', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'deliver paid ' + JSON.stringify(early.body));
        ctx.api('POST', '/orders/' + id + '/ship', {});
        const d = ctx.api('POST', '/orders/' + id + '/deliver', {});
        ctx.assert(d.status === 200 && d.body.status === 'delivered', 'deliver ' + JSON.stringify(d.body));
        const again = ctx.api('POST', '/orders/' + id + '/deliver', {});
        ctx.assert(again.status === 409, 'deliver twice ' + again.status);
      }
  cancel_order_flow:
    description: Cancel a pending order, a paid order, and fail on a shipped order.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Cancel Tester', email: 'cancel.tester@cancelflow.test', country: 'ES', plan: 'free' });
        const mk = (n) => ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 700 + n, currency: 'USD', item_count: 1, placed_at: '2026-04-03T10:00:00Z' }).body.id;
        const a = mk(1), b = mk(2), s = mk(3);
        const ca = ctx.api('POST', '/orders/' + a + '/cancel', {});
        ctx.assert(ca.status === 200 && ca.body.status === 'cancelled', 'cancel pending ' + JSON.stringify(ca.body));
        ctx.api('POST', '/orders/' + b + '/pay', {});
        const cb = ctx.api('POST', '/orders/' + b + '/cancel', {});
        ctx.assert(cb.status === 200 && cb.body.status === 'cancelled', 'cancel paid ' + JSON.stringify(cb.body));
        ctx.api('POST', '/orders/' + s + '/pay', {});
        ctx.api('POST', '/orders/' + s + '/ship', {});
        const cs = ctx.api('POST', '/orders/' + s + '/cancel', {});
        ctx.assert(cs.status === 409 && cs.body.error.code === 'invalid_state', 'cancel shipped ' + JSON.stringify(cs.body));
      }
  refund_order_flow:
    description: Refuse refunding a pending order, refund a paid order, refuse a second refund.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Refund Tester', email: 'refund.tester@refundflow.test', country: 'IT', plan: 'pro' });
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 4200, currency: 'USD', item_count: 3, placed_at: '2026-04-04T10:00:00Z' });
        const id = o.body.id;
        const early = ctx.api('POST', '/orders/' + id + '/refund', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'refund pending ' + JSON.stringify(early.body));
        ctx.api('POST', '/orders/' + id + '/pay', {});
        const r = ctx.api('POST', '/orders/' + id + '/refund', {});
        ctx.assert(r.status === 200 && r.body.status === 'refunded', 'refund ' + JSON.stringify(r.body));
        const again = ctx.api('POST', '/orders/' + id + '/refund', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'refund twice ' + JSON.stringify(again.body));
      }
tasks:
  cancel_latest_pending:
    difficulty: easy
    instruction: Cancel the pending order that was placed most recently. Change nothing else.
    grader: "(ctx) => { let target = null; for (const o of ctx.seed.list('order', { where: { status: 'pending' } })) { if (target === null || ctx.time.minutesBetween(target.placed_at, o.placed_at) > 0) target = o; } if (target === null) return 0; ctx.guardChanges('only the latest pending order changed, and only its status', [{ entity: 'order', id: target.id, kind: 'updated', fields: ['status'] }]); return ctx.db.get('order', target.id).status === 'cancelled' ? 1 : 0; }"
    solution: (ctx) => { const r = ctx.api('GET', '/orders?status=pending&sort=-placed_at&limit=1'); ctx.assert(r.status === 200 && r.body.data.length === 1, 'no pending order ' + JSON.stringify(r.body)); const c = ctx.api('POST', '/orders/' + r.body.data[0].id + '/cancel', {}); ctx.assert(c.status === 200, 'cancel failed ' + JSON.stringify(c.body)); }
    decoys:
      - why: Cancels the earliest-placed pending order instead of the most recent one
        script: (ctx) => { const r = ctx.api('GET', '/orders?status=pending&sort=placed_at&limit=1'); ctx.api('POST', '/orders/' + r.body.data[0].id + '/cancel', {}); }
      - why: Cancels the two most recently placed pending orders, one more than asked
        script: (ctx) => { const r = ctx.api('GET', '/orders?status=pending&sort=-placed_at&limit=2'); for (const o of r.body.data) ctx.api('POST', '/orders/' + o.id + '/cancel', {}); }
    alternatives:
      - why: Reads every pending order and picks the latest placed_at itself instead of sorting on the server
        script: (ctx) => { const r = ctx.api('GET', '/orders?status=pending&limit=25'); ctx.assert(r.status === 200, 'list failed ' + JSON.stringify(r.body)); let latest = null; for (const o of r.body.data) { if (latest === null || o.placed_at > latest.placed_at) latest = o; } ctx.assert(latest !== null, 'no pending order'); const c = ctx.api('POST', '/orders/' + latest.id + '/cancel', {}); ctx.assert(c.status === 200, 'cancel failed ' + JSON.stringify(c.body)); }
    allows:
      - entity: order
        kind: updated
        fields:
          - status
        where:
          status: pending
          customer_id: cus_0003
  refund_top_delivered:
    difficulty: medium
    instruction: Refund the two delivered orders with the highest total_cents among the orders placed on or after 15 February 2026. Only an order that is delivered may be refunded, and every other order must stay as it is.
    grader: "(ctx) => { const since = '2026-02-15T00:00:00.000Z'; const cands = ctx.seed.list('order', { where: { status: 'delivered' } }).filter((o) => ctx.time.minutesBetween(since, o.placed_at) >= 0).sort((a, b) => b.total_cents - a.total_cents); if (cands.length < 2) return 0; const targets = cands.slice(0, 2); ctx.guardChanges('only the two top delivered orders changed, and only their status', targets.map((t) => ({ entity: 'order', id: t.id, kind: 'updated', fields: ['status'] }))); for (const t of targets) { ctx.goal(0.5, 'order ' + t.id + ' refunded', ctx.db.get('order', t.id).status === 'refunded'); } return ctx.score(); }"
    solution: "(ctx) => { const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'list failed ' + JSON.stringify(r.body)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); const cands = orders.filter((o) => o.status === 'delivered' && o.placed_at >= '2026-02-15T00:00:00.000Z').sort((a, b) => b.total_cents - a.total_cents); ctx.assert(cands.length >= 2, 'expected delivered orders since 15 Feb'); const peek = ctx.api('GET', '/orders?status=delivered&limit=5'); ctx.assert(peek.status === 200 && peek.body.data.every((o) => o.status === 'delivered'), 'delivered list failed'); for (const o of cands.slice(0, 2)) { const r = ctx.api('POST', '/orders/' + o.id + '/refund', {}); ctx.assert(r.status === 200, 'refund ' + o.id + ' failed ' + JSON.stringify(r.body)); } }"
    decoys:
      - why: Refunds only the single highest-total delivered order and forgets the second one
        script: "(ctx) => { const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); const cands = orders.filter((o) => o.status === 'delivered' && o.placed_at >= '2026-02-15T00:00:00.000Z').sort((a, b) => b.total_cents - a.total_cents); ctx.api('POST', '/orders/' + cands[0].id + '/refund', {}); }"
      - why: Ignores the 15 February cutoff and refunds the two highest-total delivered orders of all time
        script: "(ctx) => { const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?status=delivered&limit=5' + (cursor === null ? '' : '&cursor=' + cursor)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); const cands = orders.sort((a, b) => b.total_cents - a.total_cents); for (const o of cands.slice(0, 2)) ctx.api('POST', '/orders/' + o.id + '/refund', {}); }"
      - why: "Does not check the order is delivered: refunds the two highest-total paid or delivered orders since 15 February, which hits paid orders"
        script: "(ctx) => { const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); const cands = orders.filter((o) => (o.status === 'delivered' || o.status === 'paid') && o.placed_at >= '2026-02-15T00:00:00.000Z').sort((a, b) => b.total_cents - a.total_cents); for (const o of cands.slice(0, 2)) ctx.api('POST', '/orders/' + o.id + '/refund', {}); }"
      - why: Stops after the second page of orders, so it never sees the highest-total delivered order on page 3 and refunds a lower one instead
        script: "(ctx) => { const orders = []; let cursor = null; for (let i = 0; i < 2; i++) { const r = ctx.api('GET', '/orders?limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); orders.push(...r.body.data); cursor = r.body.next_cursor; if (cursor === null) break; } const cands = orders.filter((o) => o.status === 'delivered' && o.placed_at >= '2026-02-15T00:00:00.000Z').sort((a, b) => b.total_cents - a.total_cents); for (const o of cands.slice(0, 2)) ctx.api('POST', '/orders/' + o.id + '/refund', {}); }"
    alternatives:
      - why: Pages through the delivered-only list with a small page size instead of the whole order list
        script: "(ctx) => { const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?status=delivered&limit=5' + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'list failed ' + JSON.stringify(r.body)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); const cands = orders.filter((o) => o.placed_at >= '2026-02-15T00:00:00.000Z').sort((a, b) => b.total_cents - a.total_cents); ctx.assert(cands.length >= 2, 'expected delivered orders since 15 Feb'); for (const o of cands.slice(0, 2)) { const r = ctx.api('POST', '/orders/' + o.id + '/refund', {}); ctx.assert(r.status === 200, 'refund ' + o.id + ' failed ' + JSON.stringify(r.body)); } }"
    allows:
      - entity: order
        kind: updated
        fields:
          - status
        where:
          status: delivered
          total_cents: 34400
      - entity: order
        kind: updated
        fields:
          - status
        where:
          status: delivered
          total_cents: 25299
  pay_and_ship_pro_pending:
    difficulty: hard
    instruction: Register a new customer named Rosalind Franklin with the email rosalind.franklin@example.com, country GB and plan pro. Then pay and ship every order that is still pending and was placed by a customer on the pro plan. Change nothing else.
    grader: "(ctx) => { const plan = {}; for (const c of ctx.seed.list('customer')) plan[c.id] = c.plan; const targets = ctx.seed.list('order', { where: { status: 'pending' } }).filter((o) => plan[o.customer_id] === 'pro'); if (targets.length === 0) return 0; const fresh = ctx.db.list('customer').filter((c) => ctx.seed.get('customer', c.id) === null && c.name === 'Rosalind Franklin' && c.email === 'rosalind.franklin@example.com' && c.country === 'GB' && c.plan === 'pro'); ctx.guardChanges('only the new customer and the pro pending orders changed', [...targets.map((t) => ({ entity: 'order', id: t.id, kind: 'updated', fields: ['status', 'shipped_at'] })), ...fresh.map((c) => ({ entity: 'customer', id: c.id, kind: 'created', fields: ['name', 'email', 'country', 'plan'] }))]); let done = 0; for (const t of targets) { const end = ctx.db.get('order', t.id); if (end.status === 'shipped' && end.shipped_at !== null) done += 1; } const registered = fresh.length === 1 ? 15 : 0; return (registered + 85 * done / targets.length) / 100; }"
    solution: "(ctx) => { const c = ctx.api('POST', '/customers', { name: 'Rosalind Franklin', email: 'rosalind.franklin@example.com', country: 'GB', plan: 'pro' }); ctx.assert(c.status === 201, 'create customer failed ' + JSON.stringify(c.body)); const proRes = ctx.api('GET', '/customers?plan=pro'); ctx.assert(proRes.status === 200, 'customer list failed ' + JSON.stringify(proRes.body)); const pro = new Set(proRes.body.data.map((x) => x.id)); const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'order list failed ' + JSON.stringify(r.body)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); const targets = orders.filter((o) => o.status === 'pending' && pro.has(o.customer_id)); ctx.assert(targets.length > 0, 'no pending pro orders found'); for (const o of targets) { const p = ctx.api('POST', '/orders/' + o.id + '/pay', {}); ctx.assert(p.status === 200, 'pay ' + o.id + ' failed ' + JSON.stringify(p.body)); const s = ctx.api('POST', '/orders/' + o.id + '/ship', {}); ctx.assert(s.status === 200, 'ship ' + o.id + ' failed ' + JSON.stringify(s.body)); } }"
    decoys:
      - why: Registers the customer and pays every pro pending order but never ships them
        script: "(ctx) => { ctx.api('POST', '/customers', { name: 'Rosalind Franklin', email: 'rosalind.franklin@example.com', country: 'GB', plan: 'pro' }); const pro = new Set(ctx.api('GET', '/customers?plan=pro').body.data.map((x) => x.id)); const orders = []; let cursor = null; do { const r = ctx.api('GET', '/orders?limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); orders.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); for (const o of orders.filter((x) => x.status === 'pending' && pro.has(x.customer_id))) { ctx.api('POST', '/orders/' + o.id + '/pay', {}); } }"
      - why: Reads only the first page of orders, so it pays and ships just the pro pending orders on that page and misses the rest
