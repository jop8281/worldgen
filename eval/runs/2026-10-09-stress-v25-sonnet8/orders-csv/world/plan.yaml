revision: 1
software: Shopify-style order desk (orders and customers admin API)
summary: An order desk where customers' orders move from pending through paid, shipped and delivered, or end cancelled or refunded. Agents read orders and customers and run the fulfilment actions. The orders and customers CSV tables are kept exactly.
clock:
  start: 2026-04-08T09:00:00Z
  tick: 0s
verdict:
  kind: proceed
entities:
  - name: customer
    purpose: A buyer, imported from the customers CSV (18 rows).
    keyFields:
      - name
      - email
      - country
      - plan
  - name: order
    purpose: A customer order, imported from the orders CSV (72 rows), with a status state machine.
    keyFields:
      - customer_id
      - status
      - total_cents
      - currency
      - item_count
      - placed_at
      - shipped_at
      - note
workflows:
  - name: order_fulfilment
    entity: order
    states:
      - pending
      - paid
      - shipped
      - delivered
      - cancelled
      - refunded
    rules:
      - rule: Only a pending order can be paid.
        by:
          - pay_order
        test: pay_order_flow
      - rule: Only a paid order can be shipped, and shipping sets shipped_at.
        by:
          - ship_order
        test: ship_order_flow
      - rule: Only a shipped order can be delivered.
        by:
          - deliver_order
        test: deliver_order_flow
      - rule: Only a pending or paid order can be cancelled. A shipped order cannot.
        by:
          - cancel_order
        test: cancel_order_flow
      - rule: Only a paid or delivered order can be refunded. Refund is final.
        by:
          - refund_order
        test: refund_order_flow
      - rule: total_cents is not negative and customer emails are unique.
        schema: min 0 on the money field and unique on the email field are enforced by the data model.
    actions:
      - pay_order
      - ship_order
      - deliver_order
      - cancel_order
      - refund_order
jobs: []
acceptanceTests:
  - id: pay_order_flow
    intent: pay_order moves a pending order to paid and refuses a second payment.
    actions:
      - pay_order
    description: Create a customer and an order, pay it, then pay again.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Pay Tester', email: 'pay.tester@payflow.test', country: 'GB', plan: 'pro' });
        ctx.assert(c.status === 201, 'create customer ' + JSON.stringify(c.body));
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 1500, currency: 'USD', item_count: 1, placed_at: '2026-04-01T10:00:00Z' });
        ctx.assert(o.status === 201 && o.body.status === 'pending', 'create order ' + JSON.stringify(o.body));
        const p = ctx.api('POST', '/orders/' + o.body.id + '/pay', {});
        ctx.assert(p.status === 200 && p.body.status === 'paid', 'pay ' + JSON.stringify(p.body));
        const again = ctx.api('POST', '/orders/' + o.body.id + '/pay', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second pay ' + JSON.stringify(again.body));
      }
  - id: ship_order_flow
    intent: ship_order needs a paid order and sets shipped_at.
    actions:
      - pay_order
      - ship_order
    description: Ship a pending order (refused), pay it, ship it.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Ship Tester', email: 'ship.tester@shipflow.test', country: 'DE', plan: 'free' });
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 2500, currency: 'USD', item_count: 2, placed_at: '2026-04-01T11:00:00Z' });
        ctx.assert(o.status === 201, 'create order ' + JSON.stringify(o.body));
        const early = ctx.api('POST', '/orders/' + o.body.id + '/ship', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'ship pending ' + JSON.stringify(early.body));
        ctx.assert(ctx.api('POST', '/orders/' + o.body.id + '/pay', {}).status === 200, 'pay');
        const s = ctx.api('POST', '/orders/' + o.body.id + '/ship', {});
        ctx.assert(s.status === 200 && s.body.status === 'shipped' && s.body.shipped_at !== null, 'ship ' + JSON.stringify(s.body));
      }
  - id: deliver_order_flow
    intent: deliver_order moves a shipped order to delivered and refuses other states.
    actions:
      - pay_order
      - ship_order
      - deliver_order
    description: Deliver a paid order (refused), ship it, deliver it, deliver again.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Deliver Tester', email: 'deliver.tester@deliverflow.test', country: 'FR', plan: 'pro' });
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 900, currency: 'USD', item_count: 1, placed_at: '2026-04-02T10:00:00Z' });
        const id = o.body.id;
        ctx.api('POST', '/orders/' + id + '/pay', {});
        const early = ctx.api('POST', '/orders/' + id + '/deliver', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'deliver paid ' + JSON.stringify(early.body));
        ctx.api('POST', '/orders/' + id + '/ship', {});
        const d = ctx.api('POST', '/orders/' + id + '/deliver', {});
        ctx.assert(d.status === 200 && d.body.status === 'delivered', 'deliver ' + JSON.stringify(d.body));
        const again = ctx.api('POST', '/orders/' + id + '/deliver', {});
        ctx.assert(again.status === 409, 'deliver twice ' + again.status);
      }
  - id: cancel_order_flow
    intent: cancel_order works on pending and paid orders and refuses shipped ones.
    actions:
      - pay_order
      - ship_order
      - cancel_order
    description: Cancel a pending order, a paid order, and fail on a shipped order.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Cancel Tester', email: 'cancel.tester@cancelflow.test', country: 'ES', plan: 'free' });
        const mk = (n) => ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 700 + n, currency: 'USD', item_count: 1, placed_at: '2026-04-03T10:00:00Z' }).body.id;
        const a = mk(1), b = mk(2), s = mk(3);
        const ca = ctx.api('POST', '/orders/' + a + '/cancel', {});
        ctx.assert(ca.status === 200 && ca.body.status === 'cancelled', 'cancel pending ' + JSON.stringify(ca.body));
        ctx.api('POST', '/orders/' + b + '/pay', {});
        const cb = ctx.api('POST', '/orders/' + b + '/cancel', {});
        ctx.assert(cb.status === 200 && cb.body.status === 'cancelled', 'cancel paid ' + JSON.stringify(cb.body));
        ctx.api('POST', '/orders/' + s + '/pay', {});
        ctx.api('POST', '/orders/' + s + '/ship', {});
        const cs = ctx.api('POST', '/orders/' + s + '/cancel', {});
        ctx.assert(cs.status === 409 && cs.body.error.code === 'invalid_state', 'cancel shipped ' + JSON.stringify(cs.body));
      }
  - id: refund_order_flow
    intent: refund_order refunds paid or delivered orders only, once.
    actions:
      - pay_order
      - refund_order
    description: Refuse refunding a pending order, refund a paid order, refuse a second refund.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'Refund Tester', email: 'refund.tester@refundflow.test', country: 'IT', plan: 'pro' });
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 4200, currency: 'USD', item_count: 3, placed_at: '2026-04-04T10:00:00Z' });
        const id = o.body.id;
        const early = ctx.api('POST', '/orders/' + id + '/refund', {});
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'refund pending ' + JSON.stringify(early.body));
        ctx.api('POST', '/orders/' + id + '/pay', {});
        const r = ctx.api('POST', '/orders/' + id + '/refund', {});
        ctx.assert(r.status === 200 && r.body.status === 'refunded', 'refund ' + JSON.stringify(r.body));
        const again = ctx.api('POST', '/orders/' + id + '/refund', {});
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'refund twice ' + JSON.stringify(again.body));
      }
routes:
  - id: list_orders
    method: GET
    path: /orders
    purpose: List orders, filter by status, customer_id, currency, note and item_count, sort by placed_at and total_cents.
  - id: get_order
    method: GET
    path: /orders/{id}
    purpose: Read one order.
  - id: create_order
    method: POST
    path: /orders
    purpose: Create a pending order.
  - id: list_customers
    method: GET
    path: /customers
    purpose: List customers, filter by plan and country, search by name and email.
  - id: get_customer
    method: GET
    path: /customers/{id}
    purpose: Read one customer.
  - id: create_customer
    method: POST
    path: /customers
    purpose: Create a customer.
  - id: pay_order
    method: POST
    path: /orders/{id}/pay
    purpose: Mark a pending order paid.
  - id: ship_order
    method: POST
    path: /orders/{id}/ship
    purpose: Ship a paid order and set shipped_at.
  - id: deliver_order
    method: POST
    path: /orders/{id}/deliver
    purpose: Mark a shipped order delivered.
  - id: cancel_order
    method: POST
    path: /orders/{id}/cancel
    purpose: Cancel a pending or paid order.
  - id: refund_order
    method: POST
    path: /orders/{id}/refund
    purpose: Refund a paid or delivered order.
seed:
  rowsPerEntity:
    customer: 18
    order: 72
  mix: 'Imported CSV rows kept as they are: 18 customers across 6 countries and 3 plans, 72 orders across all six statuses with a spread of totals and item counts.'
  stateMix:
    order:
      pending: 19
      paid: 22
      shipped: 17
      delivered: 22
      cancelled: 14
      refunded: 6
tasks:
  - id: cancel_latest_pending
    difficulty: easy
    kind: irreversible
    intent: Cancel the most recently placed pending order.
    actions:
      - cancel_order
    decoyIdea: Cancels the earliest-placed pending order, or the latest order of any status.
    pressure:
      states:
        - order.pending
  - id: refund_top_delivered
    difficulty: medium
    kind: irreversible
    intent: Refund the delivered order with the highest total_cents. Check that it is delivered before refunding, and touch nothing else.
    actions:
      - refund_order
    decoyIdea: Refunds the highest-total order of any status, or the cheapest delivered order, or misses it on a later page.
    pressure:
      paging: order
      states:
        - order.delivered
      distractors: order
  - id: pay_and_ship_pro_pending
    difficulty: hard
    kind: two_actors
    intent: For every pending order placed by a customer on the pro plan, pay it and then ship it. Change nothing else.
    actions:
      - pay_order
      - ship_order
    decoyIdea: Pays the orders but does not ship them, reads only the first page, or includes customers on other plans.
    pressure:
      paging: order
      states:
        - order.pending
      distractors: customer
open_questions:
  - question: Can a shipped order be cancelled or refunded?
    default_answer: No. It must be delivered first, and then it can be refunded.
  - question: Should pending orders expire automatically?
    default_answer: No. There are no jobs.
  - question: Is there an actor, such as an agent or role, that restricts who may act on an order?
    default_answer: No. Any caller may run any action.
assumptions:
  - decision: Clock starts 2026-04-08T09:00:00Z with tick 0s.
    why: It is after the latest imported event (shipped_at 2026-04-07T14:00:00Z), and time then moves only explicitly.
  - decision: Order statuses and the transitions pending->paid|cancelled, paid->shipped|cancelled|refunded, shipped->delivered, delivered->refunded, with cancelled and refunded final.
    why: This is the standard order lifecycle for the CSV's six status values.
  - decision: Shipped orders cannot be cancelled or refunded directly. They must be delivered first.
    why: It keeps refund and cancel rules simple and checkable.
  - decision: 'stateMix is estimated from the CSV: about 32 of 72 orders have shipped_at, which covers shipped, delivered and some refunded orders.'
    why: The exact status counts are not given in the profile.
  - decision: The standard create_order route makes pending orders. All later transitions go through the actions, not PATCH.
    why: Actions set shipped_at and enforce the rules.
  - decision: No jobs.
    why: Time-based changes would break the idle-state checks on the tasks, and the request names none.
  - decision: customer.plan and country are strings, as in the CSV. The note enum has the four CSV values and is nullable.
    why: This keeps the imported values unchanged.
outOfScope:
  - what: Payments, carriers and inventory
    why: The CSV has only orders and customers.
  - what: Line items
    why: Only item_count exists in the data.
  - what: Multi-currency orders
    why: All imported orders are USD.
changes: []
