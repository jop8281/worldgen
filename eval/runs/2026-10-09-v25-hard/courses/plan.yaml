    method: GET
    path: /terms
    purpose: List terms
  - id: get_term
    method: GET
    path: /terms/{id}
    purpose: Get a term
  - id: create_term
    method: POST
    path: /terms
    purpose: Create a term
  - id: list_courses
    method: GET
    path: /courses
    purpose: List and search courses
  - id: get_course
    method: GET
    path: /courses/{id}
    purpose: Get a course
  - id: create_course
    method: POST
    path: /courses
    purpose: Create a course
  - id: list_prerequisites
    method: GET
    path: /prerequisites
    purpose: List prerequisites, filter by course
  - id: create_prerequisite
    method: POST
    path: /prerequisites
    purpose: Create a prerequisite
  - id: list_students
    method: GET
    path: /students
    purpose: List and search students
  - id: get_student
    method: GET
    path: /students/{id}
    purpose: Get a student
  - id: create_student
    method: POST
    path: /students
    purpose: Create a student
  - id: list_sections
    method: GET
    path: /sections
    purpose: List sections, filter by term and course
  - id: get_section
    method: GET
    path: /sections/{id}
    purpose: Get a section
  - id: create_section
    method: POST
    path: /sections
    purpose: Create a section
  - id: update_section
    method: PATCH
    path: /sections/{id}
    purpose: Update section caps
  - id: list_enrollments
    method: GET
    path: /enrollments
    purpose: List enrollments, filter by student, section, status
  - id: get_enrollment
    method: GET
    path: /enrollments/{id}
    purpose: Get an enrollment
seed:
  rowsPerEntity:
    term: 3
    course: 16
    prerequisite: 10
    student: 45
    section: 24
    enrollment: 90
  mix: 'Terms: Spring 2026 (past, completed enrollments with grades), Fall 2026 (current: add deadline 2026-10-16, drop 2026-10-30, withdraw 2026-11-20), Spring 2027 (future). Some Fall 2026 sections are full with waitlists. Include students with near-duplicate names (Omar Haddad / Omar Haddadi), a prerequisite chain CS 101 > CS 201 > CS 310 with min grades, completed rows with grades A to F, one course with sections 01, 02, 03 where 01 has five enrolled students, 02 has three free seats and 03 has one, and sections with a waitlist of two or more.'
  stateMix:
    enrollment:
      enrolled: 40
      waitlisted: 12
      dropped: 10
      withdrawn: 6
      completed: 32
tasks:
  - id: enroll_maya_cs201
    difficulty: easy
    intent: Register the student Maya Chen for CS 201 in Fall 2026 (a section with an open seat and prerequisite met).
    actions:
      - enroll_student
    decoyIdea: Enroll Maya in the Spring 2027 CS 201 section or enroll a different student with a similar name.
  - id: drop_omar_promote
    difficulty: medium
    kind: misleading_text
    intent: Drop the student Omar Haddad (not Omar Haddadi) from the full CS 310 Fall 2026 section so the first waitlisted student receives the seat.
    actions:
      - drop_enrollment
    decoyIdea: Drop Omar Haddadi, or withdraw instead of drop, leaving the waitlist unpromoted.
    pressure:
      states:
        - enrollment.enrolled
        - enrollment.waitlisted
      distractors: enrollment
  - id: cancel_cs120_section_01
    difficulty: hard
    kind: policy_conflict
    intent: CS 120 section 01 is cancelled. Move each of its enrolled students into section 02 or 03, whichever has a free seat. A student who cannot be placed because both sections are full stays enrolled in 01 and is unchanged. Never waitlist a moved student.
    actions:
      - drop_enrollment
      - enroll_student
    decoyIdea: Drop every student from section 01 first and enroll them afterwards, so the one student with no free seat ends on a waitlist or is left unenrolled.
    pressure:
      states:
        - enrollment.enrolled
      distractors: enrollment
open_questions:
  - question: Should a waitlisted student be auto-promoted when a seat frees?
    default_answer: Yes, the first waitlisted student by position is promoted inside drop and withdraw.
  - question: Are prerequisites satisfied by a passing grade only, or also by concurrent enrollment?
    default_answer: Only by a completed enrollment with at least the minimum grade.
  - question: What happens to waitlisted students once the add deadline passes?
    default_answer: A daily job drops them.
  - question: Do we model time conflicts or credit limits?
    default_answer: No, out of scope.
assumptions:
  - decision: Clock starts 2026-10-09T12:00:00Z with tick 0s; Fall 2026 deadlines lie in the future and Spring 2026 history lies in the past.
    why: Seeded history precedes the start, scheduled deadlines follow it, and time moves only by explicit advance.
  - decision: Enrollments are created only by the enroll_student action. No standard create route exists for them.
    why: Seat caps, prerequisites and deadlines must always be checked.
  - decision: Grades are A, B, C, D, F. Passing means D or better, and a prerequisite's min_grade is compared by that order.
    why: Simple ordered scale.
  - decision: Waitlist promotion is first-come, first-served by position and is done inside drop and withdraw. It skips no one.
    why: Standard registrar behaviour.
  - decision: Waitlisted students get no prerequisite waiver. The prerequisite check happens before waitlisting.
    why: Avoids invalid waitlist entries.
  - decision: enroll_student answers 201 for both enrolled and waitlisted outcomes. The other actions answer 200.
    why: Both create an enrollment row.
  - decision: Acceptance tests use fixed ISO dates relative to the clock start and ctx.advance.
    why: Tests cannot compute dates.
  - decision: Because the standard routes enforce no timing rules, any seeded term has a drop deadline after its add deadline.
    why: Keeps the term calendar consistent.
outOfScope:
  - what: Meeting times, room scheduling and time-conflict checks
    why: Adds a large scheduling model without changing the core registration workflow.
  - what: Tuition, billing and credit-load limits
    why: A separate finance domain.
  - what: Authentication and advisor/instructor roles
    why: The API acts as the registrar.
  - what: Co-requisites and permission overrides
    why: Only prerequisites are planned.
changes: []
