actions:
  pay_invoice:
    method: POST
    path: /invoices/{id}/pay
    description: Simulate a card charge on an open invoice. A failed charge answers 200 and leaves it open.
    input:
      card_result:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - succeeded
          - failed
    handler: |-
      (ctx) => {
      const inv = ctx.db.get('invoice', ctx.params.id);
      if (inv === null) ctx.fail(404, 'not_found', 'invoice ' + ctx.params.id + ' not found');
      if (inv.status !== 'open') ctx.fail(409, 'invalid_state', 'invoice ' + inv.number + ' is ' + inv.status + '. Only open invoices can be paid.');
      const ok = ctx.body.card_result === 'succeeded';
      ctx.db.create('payment_attempt', { invoice_id: inv.id, outcome: ok ? 'succeeded' : 'failed', amount: inv.total - inv.amount_paid });
      const patch = { attempt_count: inv.attempt_count + 1 };
      if (ok) { patch.amount_paid = inv.total; patch.status = 'paid'; }
      return { status: 200, body: ctx.db.update('invoice', inv.id, patch) };
      }
  void_invoice:
    method: POST
    path: /invoices/{id}/void
    description: Void an open invoice.
    input: {}
    handler: |-
      (ctx) => {
      const inv = ctx.db.get('invoice', ctx.params.id);
      if (inv === null) ctx.fail(404, 'not_found', 'invoice ' + ctx.params.id + ' not found');
      if (inv.status !== 'open') ctx.fail(409, 'invalid_state', 'invoice ' + inv.number + ' is ' + inv.status + '. Only open invoices can be voided.');
      return { status: 200, body: ctx.db.update('invoice', inv.id, { status: 'void' }) };
      }
  apply_credit:
    method: POST
    path: /invoices/{id}/apply_credit
    description: Spend account credit on an open invoice, up to the outstanding amount.
    input: {}
    handler: |-
      (ctx) => {
      const inv = ctx.db.get('invoice', ctx.params.id);
      if (inv === null) ctx.fail(404, 'not_found', 'invoice ' + ctx.params.id + ' not found');
      if (inv.status !== 'open') ctx.fail(409, 'invalid_state', 'invoice ' + inv.number + ' is ' + inv.status + '. Only open invoices accept credit.');
      const cus = ctx.db.get('customer', inv.customer_id);
      const outstanding = inv.total - inv.amount_paid;
      if (cus.credit_balance <= 0 || outstanding <= 0) ctx.fail(409, 'insufficient_credit', 'customer has no credit to apply');
      const use = Math.min(cus.credit_balance, outstanding);
      ctx.db.update('customer', cus.id, { credit_balance: cus.credit_balance - use });
      ctx.db.create('credit_entry', { customer_id: cus.id, kind: 'application', amount: use, invoice_id: inv.id, note: null });
      const paidNow = inv.amount_paid + use;
      const patch = { amount_paid: paidNow };
      if (paidNow >= inv.total) patch.status = 'paid';
      return { status: 200, body: ctx.db.update('invoice', inv.id, patch) };
      }
  write_off_invoice:
    method: POST
    path: /invoices/{id}/write_off
    description: Write off an open invoice at dunning level 2 as uncollectible.
    input: {}
    handler: |-
      (ctx) => {
      const inv = ctx.db.get('invoice', ctx.params.id);
      if (inv === null) ctx.fail(404, 'not_found', 'invoice ' + ctx.params.id + ' not found');
      if (inv.status !== 'open') ctx.fail(409, 'invalid_state', 'invoice ' + inv.number + ' is ' + inv.status + '. Only open invoices can be written off.');
      if (inv.dunning_level !== 2) ctx.fail(409, 'not_overdue', 'invoice ' + inv.number + ' is not at dunning level 2');
      return { status: 200, body: ctx.db.update('invoice', inv.id, { status: 'uncollectible' }) };
      }
  cancel_subscription:
    method: POST
    path: /subscriptions/{id}/cancel
    description: Cancel immediately and void open invoices that have no payment.
    input: {}
    handler: |-
      (ctx) => {
      const sub = ctx.db.get('subscription', ctx.params.id);
      if (sub === null) ctx.fail(404, 'not_found', 'subscription ' + ctx.params.id + ' not found');
      if (sub.status === 'canceled') ctx.fail(409, 'invalid_state', 'subscription is already canceled');
      const invs = ctx.db.list('invoice', { where: { subscription_id: sub.id, status: 'open' } });
      for (const i of invs) {
        if (i.amount_paid === 0) ctx.db.update('invoice', i.id, { status: 'void' });
      }
      return { status: 200, body: ctx.db.update('subscription', sub.id, { status: 'canceled', canceled_at: ctx.now() }) };
      }
  reactivate_subscription:
    method: POST
    path: /subscriptions/{id}/reactivate
    description: Move a past_due or suspended subscription back to active when it has no overdue open invoice.
    input: {}
    handler: |-
      (ctx) => {
      const sub = ctx.db.get('subscription', ctx.params.id);
      if (sub === null) ctx.fail(404, 'not_found', 'subscription ' + ctx.params.id + ' not found');
      if (sub.status !== 'past_due' && sub.status !== 'suspended') ctx.fail(409, 'invalid_state', 'subscription is ' + sub.status + '. Only past_due or suspended subscriptions can be reactivated.');
      const now = ctx.now();
      const overdue = ctx.db.list('invoice', { where: { subscription_id: sub.id, status: 'open' } }).filter((i) => ctx.time.minutesBetween(i.due_at, now) > 0);
      if (overdue.length > 0) ctx.fail(409, 'overdue_invoices', 'subscription has overdue open invoices');
      return { status: 200, body: ctx.db.update('subscription', sub.id, { status: 'active' }) };
      }
  request_refund:
    method: POST
    path: /invoices/{id}/refunds
    description: Request a refund on a paid invoice.
    input:
      amount:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      destination:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - original_payment
          - account_credit
      reason:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
      const inv = ctx.db.get('invoice', ctx.params.id);
      if (inv === null) ctx.fail(404, 'not_found', 'invoice ' + ctx.params.id + ' not found');
      if (inv.status !== 'paid') ctx.fail(409, 'invalid_state', 'invoice ' + inv.number + ' is ' + inv.status + '. Only paid invoices can be refunded.');
      const held = ctx.db.list('refund', { where: { invoice_id: inv.id } }).filter((r) => r.status === 'requested' || r.status === 'approved').reduce((s, r) => s + r.amount, 0);
      if (held + ctx.body.amount > inv.amount_paid) ctx.fail(409, 'refund_exceeds_paid', 'requested and approved refunds would exceed the amount paid');
      const r = ctx.db.create('refund', { invoice_id: inv.id, amount: ctx.body.amount, destination: ctx.body.destination, reason: ctx.body.reason === undefined ? null : ctx.body.reason });
      return { status: 201, body: r };
      }
  approve_refund:
    method: POST
    path: /refunds/{id}/approve
    description: Approve a requested refund.
    input: {}
    handler: |-
      (ctx) => {
      const r = ctx.db.get('refund', ctx.params.id);
      if (r === null) ctx.fail(404, 'not_found', 'refund ' + ctx.params.id + ' not found');
      if (r.status !== 'requested') ctx.fail(409, 'invalid_state', 'refund is ' + r.status);
      const inv = ctx.db.get('invoice', r.invoice_id);
      ctx.db.update('invoice', inv.id, { amount_refunded: inv.amount_refunded + r.amount });
      if (r.destination === 'account_credit') {
        const cus = ctx.db.get('customer', inv.customer_id);
        ctx.db.update('customer', cus.id, { credit_balance: cus.credit_balance + r.amount });
        ctx.db.create('credit_entry', { customer_id: cus.id, kind: 'refund', amount: r.amount, invoice_id: inv.id, note: null });
      }
      return { status: 200, body: ctx.db.update('refund', r.id, { status: 'approved' }) };
      }
  reject_refund:
    method: POST
    path: /refunds/{id}/reject
    description: Reject a requested refund; no money moves.
    input: {}
    handler: |-
      (ctx) => {
      const r = ctx.db.get('refund', ctx.params.id);
      if (r === null) ctx.fail(404, 'not_found', 'refund ' + ctx.params.id + ' not found');
      if (r.status !== 'requested') ctx.fail(409, 'invalid_state', 'refund is ' + r.status);
      return { status: 200, body: ctx.db.update('refund', r.id, { status: 'rejected' }) };
      }
  grant_credit:
    method: POST
    path: /customers/{id}/credits
    description: Grant account credit to a customer.
    input:
      amount:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      note:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
      const cus = ctx.db.get('customer', ctx.params.id);
      if (cus === null) ctx.fail(404, 'not_found', 'customer ' + ctx.params.id + ' not found');
      ctx.db.create('credit_entry', { customer_id: cus.id, kind: 'grant', amount: ctx.body.amount, invoice_id: null, note: ctx.body.note === undefined ? null : ctx.body.note });
      return { status: 200, body: ctx.db.update('customer', cus.id, { credit_balance: cus.credit_balance + ctx.body.amount }) };
      }
jobs:
  dunning_sweep:
    description: "Daily sweep: escalate open overdue invoices and the subscriptions behind them."
    every: 1d
    run: |-
      (ctx) => {
      const now = ctx.now();
      const invs = ctx.db.list('invoice', { where: { status: 'open' } });
      for (const inv of invs) {
        const mins = ctx.time.minutesBetween(inv.due_at, now);
        if (mins <= 0) continue;
        const level = mins < 14 * 1440 ? 1 : 2;
        if (inv.dunning_level !== level) ctx.db.update('invoice', inv.id, { dunning_level: level });
        const sub = ctx.db.get('subscription', inv.subscription_id);
        if (sub === null || sub.status === 'canceled') continue;
        if (level === 1 && sub.status === 'active') ctx.db.update('subscription', sub.id, { status: 'past_due' });
        else if (level === 2 && (sub.status === 'active' || sub.status === 'past_due')) ctx.db.update('subscription', sub.id, { status: 'suspended' });
      }
      }
fixtures: {}
seed:
  customer: |-
    (ctx) => {
    const d = [['Northwind Labs',25000],['Helios Systems',29999],['Orbital Freight',20000],['Pine Analytics',12000],['Kestrel Robotics',5000],['Maple Logistics',0],['Juniper Health',3000],['Quartz Media',0],['Bluefin Foods',500],['Atlas Learning',1500],['Cobalt Energy',0],['Sable Studios',800]];
    return d.map(([name, bal], i) => ({ name, email: 'billing' + (i + 1) + '@' + name.toLowerCase().split(' ')[0] + '.example.com', credit_balance: bal }));
    }
  plan: |-
    (ctx) => {
    return [['Starter', 2900], ['Pro', 9900], ['Team', 24900], ['Enterprise', 150000]].map(([name, monthly_price]) => ({ name, monthly_price }));
    }
  subscription: |-
    (ctx) => {
    const c = ctx.rows('customer'); const p = ctx.rows('plan');
    const now = ctx.now();
    const d = [[0,3,'past_due'],[1,3,'suspended'],[2,3,'past_due'],[3,3,'suspended'],[4,3,'past_due'],[5,1,'active'],[6,2,'active'],[7,0,'active'],[8,1,'active'],[9,2,'active'],[10,0,'active'],[11,1,'canceled'],[6,0,'canceled'],[7,1,'canceled']];
    return d.map(([ci, pi, status], i) => ({ customer_id: c[ci].id, plan_id: p[pi].id, status, current_period_end: ctx.time.plus(now, (10 + i) + 'd'), canceled_at: status === 'canceled' ? ctx.time.minus(now, (5 + i) + 'd') : null }));
    }
  invoice: |-
    (ctx) => {
    const now = ctx.now(); const subs = ctx.rows('subscription');
    const ago = (n) => ctx.time.minus(now, n + 'd'); const fwd = (n) => ctx.time.plus(now, n + 'd');
    let n = 1000;
    const mk = (si, total, due, status, extra) => Object.assign({ number: 'INV-' + (++n), customer_id: subs[si].customer_id, subscription_id: subs[si].id, total, amount_paid: 0, amount_refunded: 0, status, due_at: due, attempt_count: 0, dunning_level: 0, memo: null }, extra);
    const out = [];
    const totals = [9000,6000,12000,4500,8000,5000,15000,3500,10000,7000,6000,9500];
    const ref = { 1: 2000, 4: 1500, 6: 4000 };
    totals.forEach((t, k) => out.push(mk(5 + (k % 9), t, ago(40 + k), 'paid', { amount_paid: t, amount_refunded: ref[k] || 0, attempt_count: 1 })));
    [11, 12, 13].forEach((si) => out.push(mk(si, 3000, ago(60), 'void', { memo: 'subscription canceled' })));
    [2, 5, 8, 9].forEach((si) => out.push(mk(si, 4000, ago(90), 'uncollectible', { dunning_level: 2 })));
    const open = [
    [5,5000,13,0,1,null],[6,4000,14,0,1,null],[7,6000,29,0,1,null],[8,3000,-1,0,0,null],[9,2500,-10,1000,0,null],[10,7000,5,0,1,'paid offline, ignore'],[5,1500,-5,0,0,null],[6,8000,40,2000,1,null],
    [0,20000,45,0,0,null],[1,30000,31,0,1,null],[2,15000,30,0,0,null],[3,12000,60,0,1,'paid offline, ignore'],[4,18000,29,0,1,'already refunded']];
    open.forEach(([si, t, days, paid, att, memo]) => {
      const lvl = days >= 14 ? 2 : (days > 0 ? 1 : 0);
      out.push(mk(si, t, days > 0 ? ago(days) : fwd(-days), 'open', { amount_paid: paid, attempt_count: att, dunning_level: lvl, memo }));
    });
    return out;
    }
  payment_attempt: |-
    (ctx) => {
    const out = [];
    for (const i of ctx.rows('invoice')) {
      if (i.status === 'paid') out.push({ invoice_id: i.id, outcome: 'succeeded', amount: i.total });
      else if (i.status === 'open' && i.attempt_count > 0) out.push({ invoice_id: i.id, outcome: 'failed', amount: i.total - i.amount_paid });
    }
    return out;
    }
  credit_entry: |-
    (ctx) => {
    const c = ctx.rows('customer'); const inv = ctx.rows('invoice');
    const open = inv.filter((i) => i.status === 'open');
    const g = (ci, amount) => ({ customer_id: c[ci].id, kind: 'grant', amount, invoice_id: null, note: 'goodwill credit' });
    return [g(0,25000), g(1,29999), g(2,20000), g(3,12000), g(4,5000),
    { customer_id: open[4].customer_id, kind: 'application', amount: 1000, invoice_id: open[4].id, note: null },
    { customer_id: open[7].customer_id, kind: 'application', amount: 2000, invoice_id: open[7].id, note: null },
    { customer_id: inv[6].customer_id, kind: 'refund', amount: 4000, invoice_id: inv[6].id, note: null }];
    }
  refund: |-
    (ctx) => {
    const inv = ctx.rows('invoice');
    const r = (k, amount, destination, status, reason) => ({ invoice_id: inv[k].id, amount, destination, status, reason });
    return [
    r(0, 7500, 'account_credit', 'requested', 'service outage'),
    r(2, 5000, 'account_credit', 'requested', 'outage credit, pre-approved by finance'),
    r(1, 3500, 'original_payment', 'requested', 'duplicate charge'),
    r(1, 2000, 'original_payment', 'approved', 'partial service credit'),
    r(4, 1500, 'original_payment', 'approved', 'billing error'),
    r(6, 4000, 'account_credit', 'approved', 'downtime'),
    r(3, 1000, 'account_credit', 'rejected', 'changed mind'),
    r(5, 2000, 'original_payment', 'rejected', 'out of policy')];
    }
tests:
  t_pay:
    description: A failed card leaves the invoice open and logs an attempt; a success marks it paid.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('pay1',5000,'2030-01-01T00:00:00Z');
      const f=ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'failed'});
      ctx.assert(f.status===200&&f.body.status==='open'&&f.body.amount_paid===0&&f.body.attempt_count===1,'failed pay '+JSON.stringify(f.body));
      const ok=ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'succeeded'});
      ctx.assert(ok.status===200&&ok.body.status==='paid'&&ok.body.amount_paid===5000&&ok.body.attempt_count===2,'paid '+JSON.stringify(ok.body));
      const a=ctx.api('GET','/payment_attempts?invoice_id='+x.i.id);
      ctx.assert(a.status===200&&a.body.data.length===2&&a.body.data.filter((r)=>r.outcome==='failed').length===1,'attempts '+JSON.stringify(a.body));
      const bad=ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'maybe'});
      ctx.assert(bad.status===400&&bad.body.error.code==='input.invalid','bad input '+JSON.stringify(bad.body));
      }
  t_invoice_state:
    description: Only open invoices accept pay and void.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('st1',5000,'2030-01-01T00:00:00Z');
      ctx.assert(ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'succeeded'}).status===200,'pay');
      const p2=ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'succeeded'});
      ctx.assert(p2.status===409&&p2.body.error.code==='invalid_state','pay paid '+JSON.stringify(p2.body));
      const v1=ctx.api('POST','/invoices/'+x.i.id+'/void',{});
      ctx.assert(v1.status===409&&v1.body.error.code==='invalid_state','void paid '+JSON.stringify(v1.body));
      const y=mk('st2',5000,'2030-01-01T00:00:00Z');
      const v2=ctx.api('POST','/invoices/'+y.i.id+'/void',{});
      ctx.assert(v2.status===200&&v2.body.status==='void','void open '+JSON.stringify(v2.body));
      const p3=ctx.api('POST','/invoices/'+y.i.id+'/pay',{card_result:'succeeded'});
      ctx.assert(p3.status===409&&p3.body.error.code==='invalid_state','pay void '+JSON.stringify(p3.body));
      const v3=ctx.api('POST','/invoices/'+y.i.id+'/void',{});
      ctx.assert(v3.status===409,'void twice');
      }
  t_credit:
    description: Credit partially then fully covers an invoice; zero balance is refused.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('cr1',5000,'2030-01-01T00:00:00Z');
      const z=ctx.api('POST','/invoices/'+x.i.id+'/apply_credit',{});
      ctx.assert(z.status===409&&z.body.error.code==='insufficient_credit','zero balance '+JSON.stringify(z.body));
      const g=ctx.api('POST','/customers/'+x.c.id+'/credits',{amount:3000,note:'goodwill'});
      ctx.assert(g.status===200&&g.body.credit_balance===3000,'grant '+JSON.stringify(g.body));
      const a1=ctx.api('POST','/invoices/'+x.i.id+'/apply_credit',{});
      ctx.assert(a1.status===200&&a1.body.status==='open'&&a1.body.amount_paid===3000,'partial '+JSON.stringify(a1.body));
      ctx.assert(ctx.api('GET','/customers/'+x.c.id).body.credit_balance===0,'balance spent');
      ctx.api('POST','/customers/'+x.c.id+'/credits',{amount:4000,note:'more'});
      const a2=ctx.api('POST','/invoices/'+x.i.id+'/apply_credit',{});
      ctx.assert(a2.status===200&&a2.body.status==='paid'&&a2.body.amount_paid===5000,'full '+JSON.stringify(a2.body));
      ctx.assert(ctx.api('GET','/customers/'+x.c.id).body.credit_balance===2000,'remaining 2000');
      const a3=ctx.api('POST','/invoices/'+x.i.id+'/apply_credit',{});
      ctx.assert(a3.status===409&&a3.body.error.code==='invalid_state','paid invoice '+JSON.stringify(a3.body));
      }
  t_writeoff:
    description: After the dunning sweep an invoice 14+ days overdue can be written off; a current one cannot.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('wo1',4000,'2020-01-01T00:00:00Z');
      const y=mk('wo2',4000,'2030-01-01T00:00:00Z');
      const n=ctx.api('POST','/invoices/'+y.i.id+'/write_off',{});
      ctx.assert(n.status===409&&n.body.error.code==='not_overdue','current invoice '+JSON.stringify(n.body));
      ctx.advance('2d');
      ctx.assert(ctx.api('GET','/invoices/'+x.i.id).body.dunning_level===2,'level 2 after sweep');
      const w=ctx.api('POST','/invoices/'+x.i.id+'/write_off',{});
      ctx.assert(w.status===200&&w.body.status==='uncollectible','write off '+JSON.stringify(w.body));
      const p=ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'succeeded'});
      ctx.assert(p.status===409&&p.body.error.code==='invalid_state','pay written off');
      }
  t_cancel:
    description: Cancel stamps canceled_at, voids unpaid open invoices, keeps paid ones, refuses a second cancel.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('can1',3000,'2030-01-01T00:00:00Z');
      const r=ctx.api('POST','/subscriptions/'+x.s.id+'/cancel',{});
      ctx.assert(r.status===200&&r.body.status==='canceled'&&r.body.canceled_at,'cancel '+JSON.stringify(r.body));
      ctx.assert(ctx.api('GET','/invoices/'+x.i.id).body.status==='void','open invoice voided');
      const r2=ctx.api('POST','/subscriptions/'+x.s.id+'/cancel',{});
      ctx.assert(r2.status===409&&r2.body.error.code==='invalid_state','second cancel '+JSON.stringify(r2.body));
      const y=mk('can2',3000,'2030-01-01T00:00:00Z');
      ctx.assert(ctx.api('POST','/invoices/'+y.i.id+'/pay',{card_result:'succeeded'}).status===200,'pay');
      ctx.assert(ctx.api('POST','/subscriptions/'+y.s.id+'/cancel',{}).status===200,'cancel y');
      ctx.assert(ctx.api('GET','/invoices/'+y.i.id).body.status==='paid','paid invoice untouched');
      }
  t_reactivate:
    description: A past_due subscription cannot be reactivated until its overdue invoice is paid.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('rea1',3000,ctx.now());
      const a=ctx.api('POST','/subscriptions/'+x.s.id+'/reactivate',{});
      ctx.assert(a.status===409&&a.body.error.code==='invalid_state','active reactivate '+JSON.stringify(a.body));
      ctx.advance('2d');
      ctx.assert(ctx.api('GET','/subscriptions/'+x.s.id).body.status==='past_due','past_due after sweep');
      const b=ctx.api('POST','/subscriptions/'+x.s.id+'/reactivate',{});
      ctx.assert(b.status===409&&b.body.error.code==='overdue_invoices','overdue '+JSON.stringify(b.body));
      ctx.assert(ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'succeeded'}).status===200,'pay');
      const c=ctx.api('POST','/subscriptions/'+x.s.id+'/reactivate',{});
      ctx.assert(c.status===200&&c.body.status==='active','reactivated '+JSON.stringify(c.body));
      }
  t_dunning:
    description: Short-overdue invoice gives past_due level 1, long-overdue gives suspended level 2, future and paid invoices are untouched.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const a=mk('dun1',2000,ctx.now());
      const b=mk('dun2',2000,'2020-01-01T00:00:00Z');
      const c=mk('dun3',2000,'2030-01-01T00:00:00Z');
      const d=mk('dun4',2000,ctx.now());
      ctx.assert(ctx.api('POST','/invoices/'+d.i.id+'/pay',{card_result:'succeeded'}).status===200,'pay d');
      ctx.advance('2d');
      const st=(x)=>ctx.api('GET','/subscriptions/'+x.s.id).body.status;
      const lv=(x)=>ctx.api('GET','/invoices/'+x.i.id).body.dunning_level;
      ctx.assert(st(a)==='past_due'&&lv(a)===1,'a '+st(a)+' '+lv(a));
      ctx.assert(st(b)==='suspended'&&lv(b)===2,'b '+st(b)+' '+lv(b));
      ctx.assert(st(c)==='active'&&lv(c)===0,'c untouched');
      ctx.assert(st(d)==='active'&&lv(d)===0,'d paid untouched');
      }
  t_refund_limit:
    description: Open invoices refuse refunds; pending refunds count toward the paid cap.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('rl1',5000,'2030-01-01T00:00:00Z');
      const o=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:1000,destination:'original_payment',reason:'test'});
      ctx.assert(o.status===409&&o.body.error.code==='invalid_state','open invoice '+JSON.stringify(o.body));
      ctx.assert(ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'succeeded'}).status===200,'pay');
      const big=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:6000,destination:'original_payment',reason:'too much'});
      ctx.assert(big.status===409&&big.body.error.code==='refund_exceeds_paid','too big '+JSON.stringify(big.body));
      const r1=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:2000,destination:'original_payment',reason:'partial'});
      ctx.assert(r1.status===201&&r1.body.status==='requested','first '+JSON.stringify(r1.body));
      const r2=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:3500,destination:'original_payment',reason:'over cap with pending'});
      ctx.assert(r2.status===409&&r2.body.error.code==='refund_exceeds_paid','pending counts '+JSON.stringify(r2.body));
      const r3=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:3000,destination:'account_credit',reason:'rest'});
      ctx.assert(r3.status===201,'exact remainder '+JSON.stringify(r3.body));
      }
  t_refund_approve:
    description: Approved account_credit refund grows the credit balance; original_payment does not; decisions are final.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('ra1',5000,'2030-01-01T00:00:00Z');
      ctx.assert(ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'succeeded'}).status===200,'pay');
      const r1=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:2000,destination:'account_credit',reason:'service outage'});
      ctx.assert(r1.status===201,'request '+JSON.stringify(r1.body));
      const ap=ctx.api('POST','/refunds/'+r1.body.id+'/approve',{});
      ctx.assert(ap.status===200&&ap.body.status==='approved','approve '+JSON.stringify(ap.body));
      ctx.assert(ctx.api('GET','/invoices/'+x.i.id).body.amount_refunded===2000,'amount_refunded 2000');
      ctx.assert(ctx.api('GET','/customers/'+x.c.id).body.credit_balance===2000,'credit 2000');
      const again=ctx.api('POST','/refunds/'+r1.body.id+'/approve',{});
      ctx.assert(again.status===409&&again.body.error.code==='invalid_state','second approve '+JSON.stringify(again.body));
      const r2=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:1000,destination:'original_payment',reason:'card refund'});
      ctx.assert(r2.status===201,'second request');
      ctx.assert(ctx.api('POST','/refunds/'+r2.body.id+'/approve',{}).status===200,'approve 2');
      ctx.assert(ctx.api('GET','/invoices/'+x.i.id).body.amount_refunded===3000,'amount_refunded 3000');
      ctx.assert(ctx.api('GET','/customers/'+x.c.id).body.credit_balance===2000,'credit unchanged');
      }
  t_refund_reject:
    description: A rejected refund leaves balances alone, cannot be decided again, and frees its amount.
    script: |-
      (ctx) => {
      const mk=(tag,total,due)=>{const c=ctx.api('POST','/customers',{name:'AT '+tag,email:tag+'@example.test'});ctx.assert(c.status===201,'customer '+JSON.stringify(c.body));const p=ctx.api('POST','/plans',{name:'AT plan '+tag,monthly_price:total});ctx.assert(p.status===201,'plan');const s=ctx.api('POST','/subscriptions',{customer_id:c.body.id,plan_id:p.body.id,current_period_end:'2026-12-01T00:00:00Z'});ctx.assert(s.status===201,'sub '+JSON.stringify(s.body));const i=ctx.api('POST','/invoices',{number:'AT-'+tag,customer_id:c.body.id,subscription_id:s.body.id,total:total,due_at:due});ctx.assert(i.status===201,'invoice '+JSON.stringify(i.body));return {c:c.body,s:s.body,i:i.body};};
      const x=mk('rr1',5000,'2030-01-01T00:00:00Z');
      ctx.assert(ctx.api('POST','/invoices/'+x.i.id+'/pay',{card_result:'succeeded'}).status===200,'pay');
      const r1=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:1500,destination:'account_credit',reason:'dispute'});
      ctx.assert(r1.status===201,'request');
      const rj=ctx.api('POST','/refunds/'+r1.body.id+'/reject',{});
      ctx.assert(rj.status===200&&rj.body.status==='rejected','reject '+JSON.stringify(rj.body));
      ctx.assert(ctx.api('GET','/invoices/'+x.i.id).body.amount_refunded===0,'no refunded amount');
      ctx.assert(ctx.api('GET','/customers/'+x.c.id).body.credit_balance===0,'no credit');
      const again=ctx.api('POST','/refunds/'+r1.body.id+'/reject',{});
      ctx.assert(again.status===409&&again.body.error.code==='invalid_state','reject twice '+JSON.stringify(again.body));
      const ap=ctx.api('POST','/refunds/'+r1.body.id+'/approve',{});
      ctx.assert(ap.status===409&&ap.body.error.code==='invalid_state','approve rejected');
      const full=ctx.api('POST','/invoices/'+x.i.id+'/refunds',{amount:5000,destination:'original_payment',reason:'full'});
      ctx.assert(full.status===201,'full refund after rejection '+JSON.stringify(full.body));
      }
tasks:
  void_mistaken_invoice:
    difficulty: easy
    instruction: Maple Logistics (billing6@maple.example.com) has two open invoices. The one numbered INV-1026 was billed by mistake and nothing has been collected on it. Void that invoice and leave the customer's other invoice alone.
    grader: |-
      (ctx) => {
      const t = ctx.seed.list('invoice', { where: { number: 'INV-1026' } })[0];
      if (!t) return 0;
      ctx.guardChanges('only the mistaken invoice status changed', [{ entity: 'invoice', id: t.id, kind: 'updated', fields: ['status'] }]);
