      { entity: 'invoice', id: inv.id, kind: 'updated', fields: ['amount_refunded'] },
      { entity: 'customer', id: cus.id, kind: 'updated', fields: ['credit_balance'] }
      ]
      .concat(created.map((c) => ({ entity: 'credit_entry', id: c.id, kind: 'created', fields: ['customer_id', 'kind', 'amount', 'invoice_id', 'note'] })))
      .concat(refunds.map((c) => ({ entity: 'refund', id: c.id, kind: 'created', fields: ['invoice_id', 'amount', 'destination', 'status', 'reason'] })))
      .concat(refunds.map((c) => ({ entity: 'refund', id: c.id, kind: 'updated', fields: ['status'] })));
      ctx.guardChanges('only the target invoice, the customer, the new refund and its ledger row changed', allowed);
      ctx.guard('new refunds sit on the target invoice and new ledger rows are its refund credit', refunds.every((c) => ctx.db.get('refund', c.id).invoice_id === inv.id) && created.every((c) => { const e = ctx.db.get('credit_entry', c.id); return e.kind === 'refund' && e.customer_id === cus.id && e.invoice_id === inv.id && e.amount === 2000; }));
      const rs = ctx.db.list('refund', { where: { invoice_id: inv.id } });
      ctx.goal(0.25, 'one 2000 cent account credit refund with an outage reason was requested', rs.length === 1 && rs[0].amount === 2000 && rs[0].destination === 'account_credit' && /outage/i.test(rs[0].reason || ''));
