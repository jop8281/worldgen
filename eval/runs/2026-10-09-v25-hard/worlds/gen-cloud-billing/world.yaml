format: 1
meta:
  name: gen_cloud_billing
  description: A billing console where customers hold subscriptions to plans, invoices are paid, voided or written off, account credits are granted and applied, refunds go through a request and decision step, and a daily dunning job escalates overdue invoices and the subscriptions behind them.
  resembles: Stripe Billing / AWS Billing-style cloud billing console (subscriptions, invoices, credits, refunds, dunning)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A billed account holder with an account credit balance in USD cents.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      credit_balance:
        type: money
        description: Spendable account credit in cents. Changed only by credit grants, credit applications and approved account_credit refunds.
        required: false
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
  plan:
    description: A priced cloud plan billed monthly.
    idPrefix: pln
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      monthly_price:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  subscription:
    description: A customer's subscription to a plan. Its status moves through dunning and cancellation.
    idPrefix: sub
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      plan_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: plan
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - active
          - past_due
          - suspended
          - canceled
        initial: active
        transitions:
          active:
            - past_due
            - suspended
            - canceled
          past_due:
            - active
            - suspended
            - canceled
          suspended:
            - active
            - canceled
          canceled: []
      current_period_end:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      canceled_at:
        type: datetime
        description: Set when the subscription is canceled.
        required: false
        nullable: true
        unique: false
        readonly: true
  invoice:
    description: A bill for a subscription with payment, refund and dunning tracking. Amounts are USD cents.
    idPrefix: inv
    fields:
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      subscription_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: subscription
        onDelete: restrict
      total:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      amount_paid:
        type: money
        description: Cents collected so far by card or by applied credit.
        required: false
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      amount_refunded:
        type: money
        description: Cents refunded through approved refunds.
        required: false
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - open
          - paid
          - void
          - uncollectible
        initial: open
        transitions:
          open:
            - paid
            - void
            - uncollectible
          paid: []
          void: []
          uncollectible: []
      due_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      attempt_count:
        type: int
        description: Card payment attempts made, successful or failed.
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      dunning_level:
        type: int
        description: 0 current, 1 under 14 days overdue, 2 at least 14 days overdue.
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        max: 2
        default: 0
      memo:
        type: text
        description: Free-text note. Not authoritative; the money and status fields are.
        required: false
        nullable: true
        unique: false
        readonly: false
  payment_attempt:
    description: One card charge attempt against an invoice.
    idPrefix: pat
    fields:
      invoice_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: invoice
        onDelete: restrict
      outcome:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - succeeded
          - failed
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  credit_entry:
    description: Ledger row of account credit grants, applications to invoices and refund credits.
    idPrefix: crd
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - grant
          - application
          - refund
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      invoice_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: invoice
        onDelete: restrict
      note:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
  refund:
    description: A refund request on a paid invoice, decided once by approval or rejection.
    idPrefix: rfd
    fields:
      invoice_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: invoice
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
      destination:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - original_payment
          - account_credit
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - requested
          - approved
          - rejected
        initial: requested
        transitions:
          requested:
            - approved
            - rejected
          approved: []
          rejected: []
      reason:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
