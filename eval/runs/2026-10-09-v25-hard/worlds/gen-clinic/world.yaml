format: 1
meta:
  name: gen_clinic
  description: A clinic scheduler. Doctors have working hours and a no-show fee, patients book appointments with them, and the engine refuses double-booking of a doctor or a patient. Appointments move through scheduled, checked_in, completed, cancelled and no_show. A no-show posts a fee charge, either from a staff action or from an hourly job that sweeps stale unattended appointments.
  resembles: Jane App / Athenahealth-style clinic scheduling system (doctors, appointments, no-show fees)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  doctor:
    description: A clinician with a specialty, daily working hours in whole UTC hours, and the fee charged for a no-show.
    idPrefix: doc
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      specialty:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 60
      start_hour:
        type: int
        description: First working hour of the day, UTC.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        max: 23
      end_hour:
        type: int
        description: Hour at which the working day ends, UTC. Appointments must finish by then.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 24
      no_show_fee:
        type: money
        description: Fee in USD cents charged when a patient does not show up.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      active:
        type: bool
        description: Inactive doctors cannot be booked.
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  patient:
    description: A person who books appointments. Email is unique.
    idPrefix: pat
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 160
        format: email
      phone:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 30
  appointment:
    description: A booking of one doctor by one patient for a time window. Window, doctor, patient and status change only through actions and the auto_no_show job.
    idPrefix: apt
    fields:
      doctor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: doctor
        onDelete: restrict
      patient_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: patient
        onDelete: restrict
      starts_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
      ends_at:
        type: datetime
        description: Computed as starts_at plus duration_minutes.
        required: true
        nullable: false
        unique: false
        readonly: true
      duration_minutes:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 15
        max: 120
      status:
        type: state
        description: Moved only by actions and the auto_no_show job.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - scheduled
          - checked_in
          - completed
          - cancelled
          - no_show
        initial: scheduled
        transitions:
          scheduled:
            - checked_in
            - cancelled
            - no_show
          checked_in:
            - completed
          completed: []
          cancelled: []
          no_show: []
      reason:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 200
      cancel_requested:
        type: bool
        description: The patient has asked to cancel; staff still need to cancel the appointment.
        required: false
        nullable: false
        unique: false
        readonly: false
        default: false
      notes:
        type: text
        description: Free-text staff notes. They may be out of date and do not decide the status.
        required: false
        nullable: true
        unique: false
        readonly: false
  fee:
    description: A no-show fee charged to a patient for an appointment. Written by mark_no_show and the auto_no_show job only.
    idPrefix: fee
    fields:
      appointment_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: appointment
        onDelete: restrict
      patient_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: patient
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      kind:
        type: enum
        required: false
        nullable: false
        unique: false
        readonly: true
        values:
          - no_show
        default: no_show
routes:
  list_doctors:
