        script: |-
          (ctx) => {
            const now = ctx.now();
            const r = ctx.api('GET', '/appointments?status=scheduled&limit=25');
            ctx.assert(r.status === 200, 'list failed: ' + JSON.stringify(r.body));
            ctx.assert(r.body.next_cursor === null || r.body.next_cursor === undefined, 'scheduled rows span more than one page');
            for (const a of r.body.data) {
              if (a.starts_at <= now) {
                const m = ctx.api('POST', '/appointments/' + a.id + '/mark_no_show', {});
                ctx.assert(m.status === 200, 'mark_no_show failed: ' + JSON.stringify(m.body));
              } else if (a.cancel_requested === true) {
                const c = ctx.api('POST', '/appointments/' + a.id + '/cancel', {});
                ctx.assert(c.status === 200, 'cancel failed: ' + JSON.stringify(c.body));
              }
            }
          }
