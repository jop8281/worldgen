format: 1
meta:
  name: gen_hotel
  description: A hotel front desk where guests hold reservations for room types. The desk enforces an overbooking limit per room type, charges a late-cancellation fee inside 48h of arrival (waived for VIPs), automatically marks no-shows and charges a no-show fee, and checks guests into and out of physical rooms.
  resembles: Cloudbeds/Opera-style hotel property management booking desk
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T12:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  guest:
    description: A person who books stays. Tier standard or vip; vip guests are exempt from late-cancellation fees.
    idPrefix: gst
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        sensitive: true
        maxLength: 200
        format: email
      tier:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - standard
          - vip
        default: standard
  room_type:
    description: A sellable room category with a nightly rate, sellable capacity and an overbook percentage. The overbooking limit is capacity plus floor(capacity * overbook_percent / 100).
    idPrefix: rty
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 80
      nightly_rate:
        type: money
        description: Rate for one night in USD minor units.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      capacity:
        type: int
        description: Number of reservations of this type sellable for one night.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      overbook_percent:
        type: int
        description: Extra share of capacity that may be oversold.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        max: 100
        default: 0
  room:
    description: A physical room of a room type. Status is changed by check-in and check-out.
    idPrefix: rom
    fields:
      room_number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 20
      room_type_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: room_type
        onDelete: restrict
      status:
        type: state
        description: available, occupied by a checked-in stay, or out_of_service.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - available
          - occupied
          - out_of_service
        initial: available
        transitions:
          available:
            - occupied
            - out_of_service
          occupied:
            - available
            - out_of_service
          out_of_service:
            - available
  reservation:
    description: A booking of a room type for an arrival and departure date. Created by the create_reservation action, moved through its lifecycle by cancel, check-in and check-out actions and the no_show_sweep job.
    idPrefix: res
    fields:
      guest_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: guest
        onDelete: restrict
      room_type_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: room_type
        onDelete: restrict
      room_id:
        type: ref
        description: The physical room assigned at check-in, null before.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: room
        onDelete: nullify
      arrival_date:
        type: datetime
        description: Planned arrival time.
        required: true
        nullable: false
        unique: false
        readonly: false
      departure_date:
        type: datetime
        description: Planned departure time, after arrival.
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        description: Lifecycle. cancelled, no_show and checked_out are final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - booked
          - checked_in
          - checked_out
          - cancelled
          - no_show
        initial: booked
        transitions:
          booked:
            - checked_in
            - cancelled
            - no_show
          checked_in:
            - checked_out
          checked_out: []
          cancelled: []
          no_show: []
      nightly_rate:
        type: money
        description: Rate snapshot of the room type when booked.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      fee_amount:
        type: money
        description: Total fees charged for a late cancellation or no-show.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      notes:
        type: text
        description: Free-text desk notes.
        required: false
        nullable: true
        unique: false
        readonly: false
  charge:
    description: "A fee posted against a reservation: late_cancellation or no_show, equal to the first night at the reservation's rate."
    idPrefix: chg
    fields:
      reservation_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: reservation
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - late_cancellation
          - no_show
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
