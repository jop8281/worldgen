format: 1
meta:
  name: gen_insurance
  description: Claims against policies are assigned to adjusters whose approval limits cap what they can approve. Fraud flags can put a claim on hold; approved claims are paid.
  resembles: Guidewire-style insurance claims desk (ClaimCenter-like)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  adjuster:
    description: Claims adjuster. The approval limit caps the amount they can approve; only active adjusters can be assigned claims.
    idPrefix: adj
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      approval_limit:
        type: money
        description: Largest approved amount this adjuster may sign off, in cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      active:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  policy:
    description: Insurance policy with a coverage limit. A claim on a lapsed policy cannot be approved.
    idPrefix: pol
    fields:
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      holder_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      coverage_limit:
        type: money
        description: Maximum payable under the policy, in cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      status:
        type: enum
        required: false
        nullable: false
        unique: false
        readonly: false
        values:
          - active
          - lapsed
        default: active
  claim:
    description: "A claim against a policy moving through the desk: submitted, assigned, then approved or denied, and approved claims are paid."
    idPrefix: clm
    fields:
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      policy_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: policy
        onDelete: restrict
      adjuster_id:
        type: ref
        description: Set when the claim is assigned.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: adjuster
        onDelete: restrict
      amount_claimed:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      approved_amount:
        type: money
        description: Set when the claim is approved.
        required: false
        nullable: true
        unique: false
        readonly: true
        currency: USD
        min: 0
      description:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
      deny_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - submitted
          - assigned
          - approved
          - denied
          - paid
        initial: submitted
        transitions:
          submitted:
            - assigned
            - denied
          assigned:
            - approved
            - denied
          approved:
            - paid
            - denied
          denied: []
          paid: []
  fraud_flag:
    description: Fraud suspicion on a claim. Open until cleared or confirmed; an open flag blocks approval.
    idPrefix: frd
    fields:
      claim_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: claim
        onDelete: restrict
      severity:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - low
          - medium
          - high
      reason:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - open
          - cleared
          - confirmed
        initial: open
        transitions:
          open:
            - cleared
            - confirmed
          cleared: []
          confirmed: []
routes:
  list_adjusters:
    op: list
    entity: adjuster
    filters:
      - active
    search:
      - name
    sort: []
    pageSize: 25
    method: GET
    path: /adjusters
    description: List adjusters.
  create_adjuster:
    op: create
    entity: adjuster
    method: POST
    path: /adjusters
    description: Create an adjuster.
  get_adjuster:
    op: get
    entity: adjuster
    method: GET
    path: /adjusters/{id}
    description: Get an adjuster.
  list_policies:
    op: list
    entity: policy
    filters:
      - number
      - holder_name
      - status
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /policies
    description: List policies filtered by number, holder_name or status.
  create_policy:
    op: create
    entity: policy
    method: POST
    path: /policies
    description: Create a policy.
  get_policy:
    op: get
    entity: policy
    method: GET
    path: /policies/{id}
    description: Get a policy.
  list_claims:
    op: list
    entity: claim
    filters:
      - status
      - policy_id
      - adjuster_id
      - number
    search:
      - description
    sort: []
    pageSize: 25
    method: GET
    path: /claims
    description: List claims filtered by status, policy_id, adjuster_id or number.
  create_claim:
    op: create
    entity: claim
    method: POST
    path: /claims
    description: File a claim. It starts as submitted.
  get_claim:
    op: get
    entity: claim
    method: GET
    path: /claims/{id}
    description: Get a claim.
  list_fraud_flags:
    op: list
    entity: fraud_flag
    filters:
      - claim_id
      - status
      - severity
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /fraud_flags
    description: List fraud flags filtered by claim_id, status or severity.
  get_fraud_flag:
    op: get
    entity: fraud_flag
    method: GET
    path: /fraud_flags/{id}
    description: Get a fraud flag.
actions:
  assign_claim:
    method: POST
    path: /claims/{id}/assign
    description: Assign a submitted claim to an active adjuster.
    input:
      adjuster_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
       const c = ctx.db.get('claim', ctx.params.id);
       if (c === null) ctx.fail(404, 'not_found', 'claim not found');
       if (c.status !== 'submitted') ctx.fail(409, 'invalid_state', 'only a submitted claim can be assigned');
       const a = ctx.db.get('adjuster', ctx.body.adjuster_id);
       if (a === null) ctx.fail(404, 'not_found', 'adjuster not found');
       if (!a.active) ctx.fail(409, 'adjuster_inactive', 'adjuster is not active');
       return { status: 200, body: ctx.db.update('claim', c.id, { status: 'assigned', adjuster_id: a.id }) };
      }
  approve_claim:
    method: POST
    path: /claims/{id}/approve
    description: Approve an assigned claim up to the adjuster limit, claimed amount and coverage limit.
    input:
      approved_amount:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
    handler: |-
      (ctx) => {
       const c = ctx.db.get('claim', ctx.params.id);
       if (c === null) ctx.fail(404, 'not_found', 'claim not found');
       if (c.status !== 'assigned') ctx.fail(409, 'invalid_state', 'only an assigned claim can be approved');
       const open = ctx.db.list('fraud_flag', { where: { claim_id: c.id, status: 'open' } });
       if (open.length > 0) ctx.fail(409, 'fraud_hold', 'claim has an open fraud flag');
       const p = ctx.db.get('policy', c.policy_id);
       if (p.status === 'lapsed') ctx.fail(409, 'policy_lapsed', 'policy has lapsed');
       const a = ctx.db.get('adjuster', c.adjuster_id);
       const amt = ctx.body.approved_amount;
       if (amt > a.approval_limit) ctx.fail(409, 'over_limit', 'amount exceeds the adjuster approval limit');
       if (amt > c.amount_claimed) ctx.fail(409, 'over_limit', 'amount exceeds the amount claimed');
       if (amt > p.coverage_limit) ctx.fail(409, 'over_limit', 'amount exceeds the policy coverage limit');
       return { status: 200, body: ctx.db.update('claim', c.id, { status: 'approved', approved_amount: amt }) };
      }
  deny_claim:
    method: POST
    path: /claims/{id}/deny
    description: Deny a claim that is not yet paid or denied.
    input:
      reason:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
       const c = ctx.db.get('claim', ctx.params.id);
       if (c === null) ctx.fail(404, 'not_found', 'claim not found');
       if (c.status === 'denied' || c.status === 'paid') ctx.fail(409, 'invalid_state', 'claim is ' + c.status + ' and cannot be denied');
       return { status: 200, body: ctx.db.update('claim', c.id, { status: 'denied', deny_reason: ctx.body.reason }) };
      }
  pay_claim:
    method: POST
    path: /claims/{id}/pay
    description: Pay an approved claim once.
    input: {}
    handler: |-
      (ctx) => {
       const c = ctx.db.get('claim', ctx.params.id);
       if (c === null) ctx.fail(404, 'not_found', 'claim not found');
       if (c.status !== 'approved') ctx.fail(409, 'invalid_state', 'only an approved claim can be paid');
       return { status: 200, body: ctx.db.update('claim', c.id, { status: 'paid' }) };
      }
  flag_claim:
    method: POST
    path: /claims/{id}/flag
    description: Raise a fraud flag on a claim.
    input:
      severity:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - low
          - medium
          - high
      reason:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
       const c = ctx.db.get('claim', ctx.params.id);
       if (c === null) ctx.fail(404, 'not_found', 'claim not found');
       if (c.status === 'denied' || c.status === 'paid') ctx.fail(409, 'invalid_state', 'claim is ' + c.status + ' and cannot be flagged');
       const f = ctx.db.create('fraud_flag', { claim_id: c.id, severity: ctx.body.severity, reason: ctx.body.reason });
       return { status: 201, body: f };
      }
  resolve_fraud_flag:
    method: POST
    path: /fraud_flags/{id}/resolve
    description: Clear or confirm an open fraud flag. Confirming denies the claim unless it is paid.
    input:
      outcome:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - cleared
          - confirmed
    handler: |-
      (ctx) => {
       const f = ctx.db.get('fraud_flag', ctx.params.id);
       if (f === null) ctx.fail(404, 'not_found', 'fraud flag not found');
       if (f.status !== 'open') ctx.fail(409, 'invalid_state', 'fraud flag is already resolved');
       const out = ctx.body.outcome;
       const res = ctx.db.update('fraud_flag', f.id, { status: out });
       if (out === 'confirmed') {
       const c = ctx.db.get('claim', f.claim_id);
       if (c.status !== 'paid' && c.status !== 'denied') ctx.db.update('claim', c.id, { status: 'denied', deny_reason: 'Fraud confirmed: ' + f.reason });
       }
       return { status: 200, body: res };
      }
jobs: {}
