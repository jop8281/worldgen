tests:
  t_assign:
    description: Assign a claim, assign again, assign to an inactive adjuster
    script: |-
      (ctx) => {
      const a = ctx.api('POST','/adjusters',{name:'ACC Test Adjuster A',approval_limit:100000,active:true});
      ctx.assert(a.status===201,'adjuster create '+JSON.stringify(a.body));
      const p = ctx.api('POST','/policies',{number:'ACC-TP-1',holder_name:'ACC Test Holder',coverage_limit:500000,status:'active'});
      ctx.assert(p.status===201,'policy create');
      const c = ctx.api('POST','/claims',{number:'ACC-TC-1',policy_id:p.body.id,amount_claimed:50000,description:'Water damage'});
      ctx.assert(c.status===201 && c.body.status==='submitted','claim create');
      const r = ctx.api('POST','/claims/'+c.body.id+'/assign',{adjuster_id:a.body.id});
      ctx.assert(r.status===200 && r.body.status==='assigned' && r.body.adjuster_id===a.body.id,'assign '+JSON.stringify(r.body));
      const r2 = ctx.api('POST','/claims/'+c.body.id+'/assign',{adjuster_id:a.body.id});
      ctx.assert(r2.status===409 && r2.body.error.code==='invalid_state','second assign refused');
      const b = ctx.api('POST','/adjusters',{name:'ACC Test Adjuster B',approval_limit:100000,active:false});
      const c2 = ctx.api('POST','/claims',{number:'ACC-TC-2',policy_id:p.body.id,amount_claimed:1000,description:'Scratch'});
      const r3 = ctx.api('POST','/claims/'+c2.body.id+'/assign',{adjuster_id:b.body.id});
      ctx.assert(r3.status===409 && r3.body.error.code==='adjuster_inactive','inactive adjuster refused');
      }
  t_limit:
    description: Approve above limit fails, within limit succeeds
    script: |-
      (ctx) => {
      const a = ctx.api('POST','/adjusters',{name:'ACC Limit Adjuster',approval_limit:100000,active:true});
      const p = ctx.api('POST','/policies',{number:'ACC-TP-2',holder_name:'ACC Limit Holder',coverage_limit:500000,status:'active'});
      const c = ctx.api('POST','/claims',{number:'ACC-TC-3',policy_id:p.body.id,amount_claimed:150000,description:'Roof collapse'});
      ctx.assert(ctx.api('POST','/claims/'+c.body.id+'/assign',{adjuster_id:a.body.id}).status===200,'assign');
      const r = ctx.api('POST','/claims/'+c.body.id+'/approve',{approved_amount:150000});
      ctx.assert(r.status===409 && r.body.error.code==='over_limit','over limit refused '+JSON.stringify(r.body));
      const r2 = ctx.api('POST','/claims/'+c.body.id+'/approve',{approved_amount:90000});
      ctx.assert(r2.status===200 && r2.body.status==='approved' && r2.body.approved_amount===90000,'approve within limit '+JSON.stringify(r2.body));
      }
  t_fraud_block:
    description: Flag, approve refused, clear, approve succeeds
    script: |-
      (ctx) => {
      const a = ctx.api('POST','/adjusters',{name:'ACC Fraud Adjuster',approval_limit:100000,active:true});
      const p = ctx.api('POST','/policies',{number:'ACC-TP-3',holder_name:'ACC Fraud Holder',coverage_limit:500000,status:'active'});
      const c = ctx.api('POST','/claims',{number:'ACC-TC-4',policy_id:p.body.id,amount_claimed:20000,description:'Theft'});
      ctx.api('POST','/claims/'+c.body.id+'/assign',{adjuster_id:a.body.id});
      const f = ctx.api('POST','/claims/'+c.body.id+'/flag',{severity:'high',reason:'Duplicate submission'});
      ctx.assert(f.status===201 && f.body.status==='open' && f.body.claim_id===c.body.id,'flag '+JSON.stringify(f.body));
      const r = ctx.api('POST','/claims/'+c.body.id+'/approve',{approved_amount:20000});
      ctx.assert(r.status===409 && r.body.error.code==='fraud_hold','approve blocked '+JSON.stringify(r.body));
      const cl = ctx.api('POST','/fraud_flags/'+f.body.id+'/resolve',{outcome:'cleared'});
      ctx.assert(cl.status===200 && cl.body.status==='cleared','cleared');
      const r2 = ctx.api('POST','/claims/'+c.body.id+'/approve',{approved_amount:20000});
      ctx.assert(r2.status===200 && r2.body.status==='approved','approve after clearing');
      }
  t_lapsed:
    description: Approve on lapsed policy refused, deny works once
    script: |-
      (ctx) => {
      const a = ctx.api('POST','/adjusters',{name:'ACC Lapsed Adjuster',approval_limit:100000,active:true});
      const p = ctx.api('POST','/policies',{number:'ACC-TP-4',holder_name:'ACC Lapsed Holder',coverage_limit:500000,status:'lapsed'});
      const c = ctx.api('POST','/claims',{number:'ACC-TC-5',policy_id:p.body.id,amount_claimed:10000,description:'Collision'});
      ctx.api('POST','/claims/'+c.body.id+'/assign',{adjuster_id:a.body.id});
      const r = ctx.api('POST','/claims/'+c.body.id+'/approve',{approved_amount:10000});
      ctx.assert(r.status===409 && r.body.error.code==='policy_lapsed','lapsed refused '+JSON.stringify(r.body));
      const d = ctx.api('POST','/claims/'+c.body.id+'/deny',{reason:'Policy lapsed'});
      ctx.assert(d.status===200 && d.body.status==='denied' && d.body.deny_reason==='Policy lapsed','deny '+JSON.stringify(d.body));
      const d2 = ctx.api('POST','/claims/'+c.body.id+'/deny',{reason:'Again'});
      ctx.assert(d2.status===409 && d2.body.error.code==='invalid_state','second deny refused');
      }
  t_pay:
    description: Pay before approval fails, after approval succeeds, repeat fails
    script: |-
      (ctx) => {
      const a = ctx.api('POST','/adjusters',{name:'ACC Pay Adjuster',approval_limit:100000,active:true});
      const p = ctx.api('POST','/policies',{number:'ACC-TP-5',holder_name:'ACC Pay Holder',coverage_limit:500000,status:'active'});
      const c = ctx.api('POST','/claims',{number:'ACC-TC-6',policy_id:p.body.id,amount_claimed:30000,description:'Fire'});
      ctx.api('POST','/claims/'+c.body.id+'/assign',{adjuster_id:a.body.id});
      const e = ctx.api('POST','/claims/'+c.body.id+'/pay',{});
      ctx.assert(e.status===409 && e.body.error.code==='invalid_state','pay before approval refused');
      ctx.api('POST','/claims/'+c.body.id+'/approve',{approved_amount:30000});
      const r = ctx.api('POST','/claims/'+c.body.id+'/pay',{});
      ctx.assert(r.status===200 && r.body.status==='paid','paid '+JSON.stringify(r.body));
      const r2 = ctx.api('POST','/claims/'+c.body.id+'/pay',{});
      ctx.assert(r2.status===409 && r2.body.error.code==='invalid_state','second pay refused');
      }
  t_confirm:
    description: Flag, confirm, claim denied, resolve again refused
    script: |-
      (ctx) => {
      const a = ctx.api('POST','/adjusters',{name:'ACC Confirm Adjuster',approval_limit:100000,active:true});
      const p = ctx.api('POST','/policies',{number:'ACC-TP-6',holder_name:'ACC Confirm Holder',coverage_limit:500000,status:'active'});
      const c = ctx.api('POST','/claims',{number:'ACC-TC-7',policy_id:p.body.id,amount_claimed:40000,description:'Jewelry loss'});
      ctx.api('POST','/claims/'+c.body.id+'/assign',{adjuster_id:a.body.id});
      const f = ctx.api('POST','/claims/'+c.body.id+'/flag',{severity:'medium',reason:'Inconsistent statements'});
      ctx.assert(f.status===201,'flag');
      const r = ctx.api('POST','/fraud_flags/'+f.body.id+'/resolve',{outcome:'confirmed'});
      ctx.assert(r.status===200 && r.body.status==='confirmed','confirmed '+JSON.stringify(r.body));
      const cl = ctx.api('GET','/claims/'+c.body.id);
      ctx.assert(cl.body.status==='denied','claim denied after confirmation');
      const r2 = ctx.api('POST','/fraud_flags/'+f.body.id+'/resolve',{outcome:'cleared'});
      ctx.assert(r2.status===409 && r2.body.error.code==='invalid_state','resolved flag cannot be resolved again');
      }
tasks:
  assign_submitted_claim:
    difficulty: easy
    instruction: Claim CLM-2026-0003 (a stolen bicycle) is still submitted. Assign it to the active adjuster Marcus Webb. Note that there is also an adjuster called Marcus Webster; he is not the one.
    grader: "(ctx) => { const c = ctx.seed.list('claim', { where: { number: 'CLM-2026-0003' } })[0]; const a = ctx.seed.list('adjuster', { where: { name: 'Marcus Webb' } })[0]; if (!c || !a) return 0; ctx.guardChanges('only the target claim changed', [{ entity: 'claim', id: c.id, kind: 'updated', fields: ['status', 'adjuster_id'] }]); const end = ctx.db.get('claim', c.id); ctx.goal(0.5, 'the claim is assigned', end.status === 'assigned'); ctx.goal(0.5, 'it is assigned to Marcus Webb', end.adjuster_id === a.id); return ctx.score(); }"
    solution: "(ctx) => { const cl = ctx.api('GET', '/claims?number=CLM-2026-0003').body.data; ctx.assert(cl.length === 1 && cl[0].status === 'submitted', 'claim CLM-2026-0003 not found or not submitted'); const adjs = ctx.api('GET', '/adjusters').body.data; const a = adjs.find((x) => x.name === 'Marcus Webb'); ctx.assert(a && a.active, 'Marcus Webb not found or inactive'); const r = ctx.api('POST', '/claims/' + cl[0].id + '/assign', { adjuster_id: a.id }); ctx.assert(r.status === 200, 'assign failed: ' + JSON.stringify(r.body)); }"
    decoys:
      - why: assigns the claim to Marcus Webster, the adjuster with the similar name, instead of Marcus Webb
        script: "(ctx) => { const cl = ctx.api('GET', '/claims?number=CLM-2026-0003').body.data; const adjs = ctx.api('GET', '/adjusters').body.data; const a = adjs.find((x) => x.name === 'Marcus Webster'); ctx.api('POST', '/claims/' + cl[0].id + '/assign', { adjuster_id: a.id }); }"
    alternatives: []
    allows:
      - entity: claim
        kind: updated
        fields:
          - status
          - adjuster_id
        where:
          number: CLM-2026-0003
  approve_within_limit:
    difficulty: medium
    instruction: Claim CLM-2026-0006 (a fallen tree on a carport, $51,000.00 claimed) is submitted and needs a decision, and the desk wants a new adjuster to take it. First check the active adjusters so that nobody called Sam Idris is already on the desk. Then register a new active adjuster named Sam Idris with an approval limit of $60,000.00, assign the claim to him, and approve it for the full claimed amount.
    grader: "(ctx) => { const c = ctx.seed.list('claim', { where: { number: 'CLM-2026-0006' } })[0]; if (!c) return 0; const made = ctx.db.list('adjuster', { where: { name: 'Sam Idris' } }); if (made.length === 0) return 0; const a = made[0]; ctx.guardChanges('only the new adjuster and the target claim changed', [{ entity: 'adjuster', id: a.id, kind: 'created', fields: ['name', 'approval_limit', 'active'] }, { entity: 'claim', id: c.id, kind: 'updated', fields: ['status', 'adjuster_id', 'approved_amount'] }]); const end = ctx.db.get('claim', c.id); ctx.goal(0.3, 'Sam Idris is registered active with a 60000 dollar limit', made.length === 1 && a.active === true && a.approval_limit === 6000000); ctx.goal(0.3, 'the claim is assigned to Sam Idris', end.adjuster_id === a.id); ctx.goal(0.4, 'approved for the full claimed amount', end.status === 'approved' && end.approved_amount === c.amount_claimed); return ctx.score(); }"
    solution: "(ctx) => { const cl = ctx.api('GET', '/claims?number=CLM-2026-0006').body.data; ctx.assert(cl.length === 1 && cl[0].status === 'submitted', 'claim CLM-2026-0006 not found or not submitted'); const claim = cl[0]; const adjs = ctx.api('GET', '/adjusters?active=true').body.data; ctx.assert(adjs.length > 0, 'expected active adjusters'); ctx.assert(!adjs.some((x) => x.name === 'Sam Idris'), 'Sam Idris already exists'); const made = ctx.api('POST', '/adjusters', { name: 'Sam Idris', approval_limit: 6000000, active: true }); ctx.assert(made.status === 201, 'create adjuster failed: ' + JSON.stringify(made.body)); const r1 = ctx.api('POST', '/claims/' + claim.id + '/assign', { adjuster_id: made.body.id }); ctx.assert(r1.status === 200, 'assign failed: ' + JSON.stringify(r1.body)); const r2 = ctx.api('POST', '/claims/' + claim.id + '/approve', { approved_amount: claim.amount_claimed }); ctx.assert(r2.status === 200, 'approve failed: ' + JSON.stringify(r2.body)); }"
    decoys:
      - why: registers Sam Idris with a $50,000.00 limit, below the claimed amount, so the full approval is refused and the claim stays assigned
        script: "(ctx) => { const cl = ctx.api('GET', '/claims?number=CLM-2026-0006').body.data; ctx.api('GET', '/adjusters?active=true'); const made = ctx.api('POST', '/adjusters', { name: 'Sam Idris', approval_limit: 5000000, active: true }); ctx.api('POST', '/claims/' + cl[0].id + '/assign', { adjuster_id: made.body.id }); ctx.api('POST', '/claims/' + cl[0].id + '/approve', { approved_amount: cl[0].amount_claimed }); }"
      - why: registers Sam Idris correctly and assigns the claim but approves only $50,000.00 instead of the full claimed amount
        script: "(ctx) => { const cl = ctx.api('GET', '/claims?number=CLM-2026-0006').body.data; ctx.api('GET', '/adjusters?active=true'); const made = ctx.api('POST', '/adjusters', { name: 'Sam Idris', approval_limit: 6000000, active: true }); ctx.api('POST', '/claims/' + cl[0].id + '/assign', { adjuster_id: made.body.id }); ctx.api('POST', '/claims/' + cl[0].id + '/approve', { approved_amount: 5000000 }); }"
    alternatives: []
    allows:
      - entity: adjuster
        kind: created
        fields:
          - name
          - approval_limit
          - active
        where:
          name: Sam Idris
      - entity: claim
        kind: updated
        fields:
          - status
          - adjuster_id
          - approved_amount
        where:
          number: CLM-2026-0006
  review_holder_claims:
    difficulty: hard
    instruction: "Harold Becker holds two policies and has five assigned claims across them. Review them. Approve a claim for its full claimed amount only if it has no open fraud flag, the assigned adjuster's approval limit covers the amount, and its policy is active. The open fraud flag on his 'Water damage to living room' claim is a false alarm: clear that flag, then approve the claim as well. Deny any claim whose policy has lapsed with the reason 'Policy lapsed'. Leave every other claim, including any the assigned adjuster cannot approve, unchanged."
    grader: "(ctx) => { const byNum = (n) => ctx.seed.list('claim', { where: { number: n } })[0]; const c9 = byNum('CLM-2026-0009'); const c10 = byNum('CLM-2026-0010'); const c12 = byNum('CLM-2026-0012'); const c13 = byNum('CLM-2026-0013'); if (!c9 || !c10 || !c12 || !c13) return 0; const flag = ctx.seed.list('fraud_flag', { where: { claim_id: c10.id } })[0]; if (!flag) return 0; ctx.guardChanges('only the reviewed claims and the false alarm flag changed', [{ entity: 'claim', id: c9.id, kind: 'updated', fields: ['status', 'approved_amount'] }, { entity: 'claim', id: c10.id, kind: 'updated', fields: ['status', 'approved_amount'] }, { entity: 'claim', id: c12.id, kind: 'updated', fields: ['status', 'approved_amount'] }, { entity: 'claim', id: c13.id, kind: 'updated', fields: ['status', 'deny_reason'] }, { entity: 'fraud_flag', id: flag.id, kind: 'updated', fields: ['status'] }]); const approved = (c) => { const e = ctx.db.get('claim', c.id); return e.status === 'approved' && e.approved_amount === c.amount_claimed; }; ctx.goal(0.2, 'the clean claim on the active policy is approved in full', approved(c9)); ctx.goal(0.1, 'the false alarm flag is cleared', ctx.db.get('fraud_flag', flag.id).status === 'cleared'); ctx.goal(0.2, 'the living room claim is approved in full', approved(c10)); ctx.goal(0.2, 'the patio door claim is approved in full', approved(c12)); const d = ctx.db.get('claim', c13.id); ctx.goal(0.3, 'the claim on the lapsed policy is denied as Policy lapsed', d.status === 'denied' && d.deny_reason === 'Policy lapsed'); return ctx.score(); }"
    solution: "(ctx) => { const pols = ctx.api('GET', '/policies?holder_name=Harold%20Becker').body.data; ctx.assert(pols.length === 2, 'expected two policies for Harold Becker'); for (const p of pols) { const cl = ctx.api('GET', '/claims?policy_id=' + p.id + '&status=assigned').body.data; for (const c of cl) { if (p.status === 'lapsed') { const d = ctx.api('POST', '/claims/' + c.id + '/deny', { reason: 'Policy lapsed' }); ctx.assert(d.status === 200, 'deny failed: ' + JSON.stringify(d.body)); continue; } const adj = ctx.api('GET', '/adjusters/' + c.adjuster_id).body; if (c.amount_claimed > adj.approval_limit) continue; const open = ctx.api('GET', '/fraud_flags?claim_id=' + c.id + '&status=open').body.data; if (open.length > 0) { if (c.description !== 'Water damage to living room') continue; for (const f of open) { const rf = ctx.api('POST', '/fraud_flags/' + f.id + '/resolve', { outcome: 'cleared' }); ctx.assert(rf.status === 200, 'clear failed: ' + JSON.stringify(rf.body)); } } const a = ctx.api('POST', '/claims/' + c.id + '/approve', { approved_amount: c.amount_claimed }); ctx.assert(a.status === 200, 'approve failed: ' + JSON.stringify(a.body)); } } }"
    decoys:
      - why: tries to approve every assigned claim of the holder, ignoring fraud holds, limits and the lapsed policy; the desk refuses the blocked ones, so only the clean claims are approved
        script: "(ctx) => { const pols = ctx.api('GET', '/policies?holder_name=Harold%20Becker').body.data; for (const p of pols) { const cl = ctx.api('GET', '/claims?policy_id=' + p.id + '&status=assigned').body.data; for (const c of cl) { ctx.api('POST', '/claims/' + c.id + '/approve', { approved_amount: c.amount_claimed }); } } }"
      - why: approves the clean claims and denies the lapsed one but never clears the false alarm flag, so the living room claim stays unapproved
        script: "(ctx) => { const pols = ctx.api('GET', '/policies?holder_name=Harold%20Becker').body.data; for (const p of pols) { const cl = ctx.api('GET', '/claims?policy_id=' + p.id + '&status=assigned').body.data; for (const c of cl) { if (p.status === 'lapsed') { ctx.api('POST', '/claims/' + c.id + '/deny', { reason: 'Policy lapsed' }); continue; } const adj = ctx.api('GET', '/adjusters/' + c.adjuster_id).body; if (c.amount_claimed > adj.approval_limit) continue; const open = ctx.api('GET', '/fraud_flags?claim_id=' + c.id + '&status=open').body.data; if (open.length > 0) continue; ctx.api('POST', '/claims/' + c.id + '/approve', { approved_amount: c.amount_claimed }); } } }"
    alternatives: []
    allows:
      - entity: claim
        kind: updated
        fields:
          - status
          - approved_amount
        where:
          number: CLM-2026-0009
      - entity: claim
        kind: updated
        fields:
          - status
          - approved_amount
        where:
          number: CLM-2026-0010
      - entity: claim
        kind: updated
        fields:
          - status
          - approved_amount
        where:
          number: CLM-2026-0012
      - entity: claim
        kind: updated
        fields:
          - status
          - deny_reason
        where:
          number: CLM-2026-0013
      - entity: fraud_flag
        kind: updated
        fields:
          - status
        where:
          reason: Repair estimate inconsistent with photos
  find_and_confirm_fraud:
    difficulty: hard
    instruction: Aisha Khan has an assigned claim for $18,500.00 on which a high-severity fraud flag is still open. Confirm that flag. Then pay Aisha Khan's other claim that has already been approved. Other policyholders have similar claims, so go by the holder, the amount and the flag.
    grader: "(ctx) => { const c26 = ctx.seed.list('claim', { where: { number: 'CLM-2026-0026' } })[0]; const c27 = ctx.seed.list('claim', { where: { number: 'CLM-2026-0027' } })[0]; if (!c26 || !c27) return 0; const f = ctx.seed.list('fraud_flag', { where: { claim_id: c26.id } })[0]; if (!f) return 0; ctx.guardChanges('only the confirmed flag, its claim and the approved claim changed', [{ entity: 'fraud_flag', id: f.id, kind: 'updated', fields: ['status'] }, { entity: 'claim', id: c26.id, kind: 'updated', fields: ['status', 'deny_reason'] }, { entity: 'claim', id: c27.id, kind: 'updated', fields: ['status'] }]); ctx.goal(0.3, 'the high-severity flag is confirmed', ctx.db.get('fraud_flag', f.id).status === 'confirmed'); ctx.goal(0.2, 'the flagged claim is denied', ctx.db.get('claim', c26.id).status === 'denied'); const e27 = ctx.db.get('claim', c27.id); ctx.goal(0.5, 'the approved claim of the same holder is paid in full', e27.status === 'paid' && e27.approved_amount === c27.approved_amount); return ctx.score(); }"
    solution: "(ctx) => { const pols = ctx.api('GET', '/policies?holder_name=Aisha%20Khan').body.data; ctx.assert(pols.length === 1, 'expected one policy for Aisha Khan'); const claims = []; let cursor = null; for (let i = 0; i < 20; i++) { const r = ctx.api('GET', '/claims?limit=25' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : '')); ctx.assert(r.status === 200, 'claims page failed'); for (const c of r.body.data) claims.push(c); cursor = r.body.next_cursor; if (!cursor) break; } const mine = claims.filter((c) => c.policy_id === pols[0].id); const other = ctx.api('GET', '/policies?holder_name=Elaine%20Cho').body.data; ctx.assert(other.length === 1, 'expected one policy for Elaine Cho'); const otherClaims = ctx.api('GET', '/claims?policy_id=' + other[0].id).body.data; for (const oc of otherClaims) { if (oc.amount_claimed === 1850000) { const nf = ctx.api('GET', '/fraud_flags?claim_id=' + oc.id + '&status=open&severity=high').body.data; ctx.assert(nf.length === 0, 'near miss should have no open high flag'); } } const targets = mine.filter((c) => c.amount_claimed === 1850000 && c.status === 'assigned'); ctx.assert(targets.length === 1, 'expected one matching claim, found ' + targets.length); const flags = ctx.api('GET', '/fraud_flags?claim_id=' + targets[0].id + '&status=open&severity=high').body.data; ctx.assert(flags.length === 1, 'expected one open high flag'); const approved = mine.filter((c) => c.status === 'approved'); ctx.assert(approved.length === 1, 'expected one approved claim for the holder'); const r1 = ctx.api('POST', '/fraud_flags/' + flags[0].id + '/resolve', { outcome: 'confirmed' }); ctx.assert(r1.status === 200, 'confirm failed: ' + JSON.stringify(r1.body)); const r2 = ctx.api('POST', '/claims/' + approved[0].id + '/pay', {}); ctx.assert(r2.status === 200, 'pay failed: ' + JSON.stringify(r2.body)); }"
    decoys:
      - why: confirms the right high-severity flag but forgets to pay the holder's approved claim
        script: "(ctx) => { const flags = ctx.api('GET', '/fraud_flags?status=open&severity=high').body.data; ctx.api('POST', '/fraud_flags/' + flags[0].id + '/resolve', { outcome: 'confirmed' }); }"
      - why: pays the holder's approved claim but confirms the open flag on a near-miss claim of another holder instead of the high-severity flag
        script: "(ctx) => { const pols = ctx.api('GET', '/policies?holder_name=Aisha%20Khan').body.data; const approved = ctx.api('GET', '/claims?policy_id=' + pols[0].id + '&status=approved').body.data; const flags = ctx.api('GET', '/fraud_flags?status=open').body.data; const wrong = flags.find((f) => f.reason === 'Prior similar claim at another insurer'); ctx.api('POST', '/fraud_flags/' + wrong.id + '/resolve', { outcome: 'confirmed' }); ctx.api('POST', '/claims/' + approved[0].id + '/pay', {}); }"
    alternatives: []
    allows:
      - entity: fraud_flag
        kind: updated
        fields:
          - status
        where:
          reason: Claimant history shows repeated jewelry claims
      - entity: claim
        kind: updated
        fields:
          - status
          - deny_reason
        where:
          number: CLM-2026-0026
      - entity: claim
        kind: updated
        fields:
          - status
        where:
          number: CLM-2026-0027
