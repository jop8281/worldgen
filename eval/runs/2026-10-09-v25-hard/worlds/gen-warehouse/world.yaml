format: 1
meta:
  name: gen_warehouse
  description: A warehouse where products are stocked in inventory items by location, supplier purchase orders are submitted and received into stock, cycle counts reconcile shelf quantities, and damaged or lost goods are written off through an approval step.
  resembles: Warehouse management system (NetSuite/Fishbowl-style inventory with purchase orders, cycle counts and write-offs)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  product:
    description: A stockable SKU with a unit cost.
    idPrefix: prd
    fields:
      sku:
        type: string
        description: Unique stock keeping unit code.
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      unit_cost:
        type: money
        description: Cost of one unit in cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  supplier:
    description: A vendor purchase orders are placed with.
    idPrefix: sup
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      contact_email:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        format: email
  inventory_item:
    description: Stock of one product at one warehouse location. The location prefix encodes the zone, such as A-03.
    idPrefix: inv
    fields:
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      location:
        type: string
        description: Warehouse location such as A-03; the letter before the dash is the zone.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 40
      quantity_on_hand:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      reorder_point:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
  purchase_order:
    description: An order to a supplier. Its status moves only through the purchase order actions.
    idPrefix: po
    fields:
      supplier_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: supplier
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - draft
          - submitted
          - partially_received
          - received
          - cancelled
        initial: draft
        transitions:
          draft:
            - submitted
            - cancelled
          submitted:
            - partially_received
            - received
            - cancelled
          partially_received:
            - received
          received: []
          cancelled: []
      notes:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  purchase_order_line:
    description: A product, ordered quantity and received quantity on a purchase order.
    idPrefix: pol
    fields:
      purchase_order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: purchase_order
        onDelete: restrict
      product_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: product
        onDelete: restrict
      quantity_ordered:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      quantity_received:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      unit_cost:
        type: money
        description: Agreed cost of one unit in cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  cycle_count:
    description: A count of an inventory item compared with the quantity expected when the count was scheduled.
    idPrefix: cc
    fields:
      inventory_item_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: inventory_item
        onDelete: restrict
      expected_quantity:
        type: int
        description: On-hand quantity captured when the count was scheduled.
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
      counted_quantity:
        type: int
        required: false
        nullable: true
        unique: false
        readonly: true
        min: 0
      variance:
        type: int
        description: Counted minus expected.
        required: false
        nullable: true
        unique: false
        readonly: true
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - scheduled
          - counted
          - approved
        initial: scheduled
        transitions:
          scheduled:
            - counted
          counted:
            - approved
          approved: []
      notes:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  write_off:
    description: A request to remove damaged, expired or lost stock, valued at unit cost. Approval is final and deducts stock.
    idPrefix: wo
    fields:
      inventory_item_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: inventory_item
        onDelete: restrict
      quantity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      reason:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - damaged
          - expired
          - lost
      value:
        type: money
        description: Quantity times product unit cost, in cents.
        required: false
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - approved
          - rejected
        initial: pending
        transitions:
          pending:
            - approved
            - rejected
          approved: []
          rejected: []
