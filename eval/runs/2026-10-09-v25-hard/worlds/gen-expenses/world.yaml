format: 1
meta:
  name: gen_expenses
  description: Employees file expense reports of itemised expenses with receipts. Each category has a receipt threshold and an approval limit. Managers approve reports within limits, finance approves over-limit reports, and finance reimburses approved reports.
  resembles: Expensify/Concur-style expense reporting tool
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  employee:
    description: A person who files expense reports, approves them as a manager, or reimburses them as finance.
    idPrefix: emp
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - employee
          - manager
          - finance
      manager_id:
        type: ref
        description: Direct manager who may approve this employee's reports.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: employee
        onDelete: nullify
  category:
    description: Expense category with a receipt threshold and a per-expense approval limit.
    idPrefix: cat
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      approval_limit:
        type: money
        description: Per-expense amount above which a finance approver is needed.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      receipt_threshold:
        type: money
        description: Expenses above this amount need an attached receipt before the report can be submitted.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  expense_report:
    description: A report of itemised expenses. Status moves draft, submitted, then approved or rejected, and approved reports are reimbursed.
    idPrefix: rpt
    fields:
      employee_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: employee
        onDelete: restrict
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - draft
          - submitted
          - approved
          - rejected
          - reimbursed
        initial: draft
        transitions:
          draft:
            - submitted
          submitted:
            - approved
            - rejected
          approved:
            - reimbursed
          rejected: []
          reimbursed: []
      total:
        type: money
        description: Sum of the amounts of the report's expenses.
        required: false
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      approver_id:
        type: ref
        description: Employee who approved or rejected the report.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: employee
        onDelete: restrict
      rejection_reason:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: true
  expense:
    description: One line of an expense report.
    idPrefix: exp
    fields:
      report_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: expense_report
        onDelete: cascade
      category_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: category
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      merchant:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      incurred_on:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      receipt_attached:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  receipt:
    description: Receipt file metadata attached to an expense.
    idPrefix: rcp
    fields:
      expense_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: expense
        onDelete: cascade
      filename:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
  reimbursement:
    description: Payout record created when finance reimburses an approved report.
    idPrefix: rmb
    fields:
      report_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: expense_report
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      paid_by_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: employee
        onDelete: restrict
routes:
  list_employees:
    op: list
    entity: employee
    filters:
      - role
      - manager_id
      - email
    search:
      - name
    sort:
      - name
    pageSize: 25
    method: GET
    path: /employees
    description: List employees, filter by role, manager_id or email.
  get_employee:
    op: get
    entity: employee
    method: GET
    path: /employees/{id}
  create_employee:
    op: create
    entity: employee
    method: POST
    path: /employees
  list_categories:
    op: list
    entity: category
    filters: []
    search:
      - name
    sort: []
    pageSize: 25
    method: GET
    path: /categories
  get_category:
    op: get
    entity: category
    method: GET
    path: /categories/{id}
  create_category:
    op: create
    entity: category
    method: POST
    path: /categories
  list_reports:
    op: list
    entity: expense_report
    filters:
      - employee_id
      - status
      - approver_id
    search:
      - title
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /expense_reports
    description: List expense reports, filter by employee_id, status or approver_id.
  get_report:
    op: get
    entity: expense_report
    method: GET
    path: /expense_reports/{id}
  create_report:
    op: create
    entity: expense_report
    method: POST
    path: /expense_reports
    description: Create a draft report.
  list_expenses:
    op: list
    entity: expense
    filters:
      - report_id
      - category_id
    search:
      - merchant
    sort:
      - incurred_on
    pageSize: 25
    method: GET
    path: /expenses
  get_expense:
    op: get
    entity: expense
    method: GET
    path: /expenses/{id}
  list_receipts:
    op: list
    entity: receipt
    filters:
      - expense_id
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /receipts
  list_reimbursements:
    op: list
    entity: reimbursement
    filters:
      - report_id
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /reimbursements
actions:
  add_expense:
    method: POST
    path: /expense_reports/{id}/expenses
    description: Add an expense to a draft report and update the report total.
    input:
      category_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: category
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      merchant:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      incurred_on:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
      const r = ctx.db.get('expense_report', ctx.params.id);
      if (r === null) ctx.fail(404, 'not_found', 'report ' + ctx.params.id + ' not found');
      if (r.status !== 'draft') ctx.fail(409, 'invalid_state', 'expenses can be added only to a draft report');
      const c = ctx.db.get('category', ctx.body.category_id);
      if (c === null) ctx.fail(404, 'not_found', 'category not found');
      const b = ctx.body;
      const e = ctx.db.create('expense', { report_id: r.id, category_id: c.id, amount: b.amount, merchant: b.merchant, incurred_on: b.incurred_on, receipt_attached: false, note: b.note === undefined ? null : b.note });
      ctx.db.update('expense_report', r.id, { total: r.total + b.amount });
      return { status: 201, body: e };
      }
  attach_receipt:
    method: POST
    path: /expenses/{id}/receipt
    description: Attach a receipt to an expense of a draft report.
    input:
      filename:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
      const e = ctx.db.get('expense', ctx.params.id);
      if (e === null) ctx.fail(404, 'not_found', 'expense ' + ctx.params.id + ' not found');
      const r = ctx.db.get('expense_report', e.report_id);
      if (r.status !== 'draft') ctx.fail(409, 'invalid_state', 'receipts can be attached only while the report is a draft');
      ctx.db.create('receipt', { expense_id: e.id, filename: ctx.body.filename });
      return { status: 200, body: ctx.db.update('expense', e.id, { receipt_attached: true }) };
      }
  submit_report:
    method: POST
    path: /expense_reports/{id}/submit
    description: Submit a draft report that has expenses and all required receipts.
    input: {}
    handler: |-
      (ctx) => {
      const r = ctx.db.get('expense_report', ctx.params.id);
      if (r === null) ctx.fail(404, 'not_found', 'report ' + ctx.params.id + ' not found');
      if (r.status !== 'draft') ctx.fail(409, 'invalid_state', 'only a draft report can be submitted');
      const exps = ctx.db.list('expense', { where: { report_id: r.id } });
      if (exps.length === 0) ctx.fail(409, 'no_expenses', 'a report needs at least one expense');
      for (const e of exps) {
        const c = ctx.db.get('category', e.category_id);
        if (e.amount > c.receipt_threshold && !e.receipt_attached) ctx.fail(409, 'receipt_missing', 'expense ' + e.id + ' needs a receipt');
      }
      return { status: 200, body: ctx.db.update('expense_report', r.id, { status: 'submitted' }) };
      }
  approve_report:
    method: POST
    path: /expense_reports/{id}/approve
    description: Approve a submitted report as the submitter's manager or a finance employee; over-limit expenses need finance.
    input:
      approver_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
      const r = ctx.db.get('expense_report', ctx.params.id);
      if (r === null) ctx.fail(404, 'not_found', 'report ' + ctx.params.id + ' not found');
      const a = ctx.db.get('employee', ctx.body.approver_id);
      if (a === null) ctx.fail(404, 'not_found', 'approver not found');
      if (r.status !== 'submitted') ctx.fail(409, 'invalid_state', 'only a submitted report can be approved');
      if (a.id === r.employee_id) ctx.fail(409, 'self_approval', 'nobody approves their own report');
      const sub = ctx.db.get('employee', r.employee_id);
      const isFin = a.role === 'finance';
      if (!isFin && sub.manager_id !== a.id) ctx.fail(409, 'not_authorized', 'only the submitter manager or finance may approve');
      if (!isFin) {
        for (const e of ctx.db.list('expense', { where: { report_id: r.id } })) {
          const c = ctx.db.get('category', e.category_id);
          if (e.amount > c.approval_limit) ctx.fail(409, 'over_limit', 'expense ' + e.id + ' is above its category limit and needs a finance approver');
        }
      }
      return { status: 200, body: ctx.db.update('expense_report', r.id, { status: 'approved', approver_id: a.id }) };
      }
  reject_report:
    method: POST
    path: /expense_reports/{id}/reject
    description: Reject a submitted report with a reason. Rejected is final.
    input:
      approver_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      reason:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
      const r = ctx.db.get('expense_report', ctx.params.id);
      if (r === null) ctx.fail(404, 'not_found', 'report ' + ctx.params.id + ' not found');
      const reason = String(ctx.body.reason === undefined ? '' : ctx.body.reason).trim();
      if (reason === '') ctx.fail(400, 'input.invalid', 'a rejection reason is required');
      const a = ctx.db.get('employee', ctx.body.approver_id);
      if (a === null) ctx.fail(404, 'not_found', 'approver not found');
      if (r.status !== 'submitted') ctx.fail(409, 'invalid_state', 'only a submitted report can be rejected');
      if (a.id === r.employee_id) ctx.fail(409, 'self_approval', 'nobody rejects their own report');
      const sub = ctx.db.get('employee', r.employee_id);
      if (a.role !== 'finance' && sub.manager_id !== a.id) ctx.fail(409, 'not_authorized', 'only the submitter manager or finance may reject');
      return { status: 200, body: ctx.db.update('expense_report', r.id, { status: 'rejected', approver_id: a.id, rejection_reason: reason }) };
      }
  reimburse_report:
    method: POST
    path: /expense_reports/{id}/reimburse
    description: Finance reimburses an approved report once, creating a reimbursement for the total.
    input:
      finance_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
      const r = ctx.db.get('expense_report', ctx.params.id);
      if (r === null) ctx.fail(404, 'not_found', 'report ' + ctx.params.id + ' not found');
      const f = ctx.db.get('employee', ctx.body.finance_id);
      if (f === null) ctx.fail(404, 'not_found', 'finance employee not found');
      if (r.status !== 'approved') ctx.fail(409, 'invalid_state', 'only an approved report can be reimbursed');
      if (f.role !== 'finance') ctx.fail(409, 'not_authorized', 'only finance can reimburse');
      ctx.db.create('reimbursement', { report_id: r.id, amount: r.total, paid_by_id: f.id });
      return { status: 200, body: ctx.db.update('expense_report', r.id, { status: 'reimbursed' }) };
      }
jobs: {}
fixtures: {}
seed:
  employee: |-
    (ctx) => {
    return [
    { name: 'Priya Raman', email: 'priya.raman@northwind.example.com', role: 'finance', manager_id: null },
    { name: 'Gareth Lowe', email: 'gareth.lowe@northwind.example.com', role: 'finance', manager_id: null },
