  get_patron:
    op: get
    entity: patron
    method: GET
    path: /patrons/{id}
    description: Read one patron.
  create_patron:
    op: create
    entity: patron
    method: POST
    path: /patrons
    description: Register a patron.
  list_books:
    op: list
    entity: book
    filters: []
    search:
      - title
    sort: []
    pageSize: 25
    method: GET
    path: /books
    description: Search the catalogue by title.
  get_book:
    op: get
    entity: book
    method: GET
    path: /books/{id}
    description: Read one book.
  create_book:
    op: create
    entity: book
    method: POST
    path: /books
    description: Add a title to the catalogue.
  list_items:
    op: list
    entity: item
    filters:
      - book_id
      - status
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /items
