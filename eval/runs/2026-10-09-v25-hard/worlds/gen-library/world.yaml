format: 1
meta:
  name: gen_library
  description: "A public library circulation desk: patrons borrow copies of books, return them, renew them, place and fulfil holds on a title, and pay or waive the overdue and lost-item fines that returns and losses create. Copies are items, titles are books, and each loan, hold and fine has its own status workflow."
  resembles: Koha-style public library circulation API
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  patron:
    description: A library cardholder who borrows items and owes fines.
    idPrefix: pat
    fields:
      first_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      last_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      card_number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      category:
        type: enum
        required: false
        nullable: false
        unique: false
        readonly: false
        values:
          - adult
          - child
          - senior
        default: adult
  book:
    description: A title in the catalogue. Copies of a title are items.
    idPrefix: bok
    fields:
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      author:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      isbn:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
  item:
    description: One physical copy of a book, with a barcode, a replacement cost and a circulation status.
    idPrefix: itm
    fields:
      book_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: book
        onDelete: restrict
      barcode:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      replacement_cost:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - available
          - on_loan
          - lost
        initial: available
        transitions:
          available:
            - on_loan
            - lost
          on_loan:
            - available
            - lost
          lost: []
  loan:
    description: A checkout of one item by one patron, with loaned_at, due_at, returned_at, renewals and a status.
    idPrefix: lon
    fields:
      item_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: item
        onDelete: restrict
      patron_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: patron
        onDelete: restrict
      loaned_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      due_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      returned_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      renewals:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - active
          - returned
          - lost
        initial: active
        transitions:
          active:
            - returned
            - lost
          returned: []
          lost: []
  hold:
    description: A patron's request for the next available copy of a book, with placed_at and a status.
    idPrefix: hld
    fields:
      patron_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: patron
        onDelete: restrict
      book_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: book
        onDelete: restrict
      placed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - waiting
          - fulfilled
          - cancelled
        initial: waiting
        transitions:
          waiting:
            - fulfilled
            - cancelled
          fulfilled: []
          cancelled: []
  fine:
    description: "A charge on a patron: an overdue fine or a lost-item charge, with an amount in cents and a status."
    idPrefix: fin
    fields:
      patron_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: patron
        onDelete: restrict
      loan_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: loan
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - overdue
          - lost_item
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - open
          - paid
          - waived
        initial: open
        transitions:
          open:
            - paid
            - waived
          paid: []
          waived: []
