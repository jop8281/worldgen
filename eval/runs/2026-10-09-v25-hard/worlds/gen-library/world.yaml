  get_item:
    op: get
    entity: item
    method: GET
    path: /items/{id}
    description: Read one copy and its circulation status.
  create_item:
    op: create
    entity: item
    method: POST
    path: /items
    description: Add a copy of a book.
  list_loans:
    op: list
    entity: loan
    filters:
      - patron_id
      - item_id
      - status
    search: []
    sort:
      - due_at
    pageSize: 25
