  cancel_cs120_section_01:
    difficulty: hard
    instruction: "CS 120 section 01 in the Fall 2026 term is being cancelled. Move each of its enrolled students into section 02 or section 03 of CS 120 in the same term, whichever has a free seat: register the student in the new section and drop them from section 01. A student who cannot be placed because both sections are full must stay enrolled in section 01, unchanged. Never put a moved student on a waitlist."
    grader: |-
      (ctx) => {
        const course = ctx.seed.list('course', { where: { code: 'CS 120' } })[0];
        const term = ctx.seed.list('term', { where: { name: 'Fall 2026' } })[0];
        if (!course || !term) return 0;
        const secs = ctx.seed.list('section', { where: { course_id: course.id, term_id: term.id } });
        const s1 = secs.find((s) => s.section_code === '01');
        const s2 = secs.find((s) => s.section_code === '02');
        const s3 = secs.find((s) => s.section_code === '03');
        if (!s1 || !s2 || !s3) return 0;
        const targets = ctx.seed.list('enrollment', { where: { section_id: s1.id, status: 'enrolled' } });
        if (targets.length === 0) return 0;
        const fresh = (sid) => ctx.db.list('enrollment', { where: { section_id: sid } }).filter((e) => ctx.seed.get('enrollment', e.id) === null);
        const created = [...fresh(s2.id), ...fresh(s3.id)];
        const placed = created.filter((e) => e.status === 'enrolled');
        const moved = [];
        const stayed = [];
        for (const t of targets) {
          const end = ctx.db.get('enrollment', t.id);
          const dest = placed.find((e) => e.student_id === t.student_id);
          if (end.status === 'dropped' && dest) moved.push({ t, dest });
          else if (end.status === 'enrolled' && !dest) stayed.push(t);
        }
        ctx.guardChanges('only moved students changed: dropped from 01 and enrolled in 02 or 03, nobody waitlisted', [
          ...moved.map((m) => ({ entity: 'enrollment', id: m.t.id, kind: 'updated', fields: ['status', 'waitlist_position'] })),
          ...moved.map((m) => ({ entity: 'enrollment', id: m.dest.id, kind: 'created', fields: ['student_id', 'section_id', 'status', 'waitlist_position', 'grade'] })),
          { entity: 'section', id: s1.id, kind: 'updated', fields: ['enrolled_count', 'waitlist_count'] },
          { entity: 'section', id: s2.id, kind: 'updated', fields: ['enrolled_count', 'waitlist_count'] },
          { entity: 'section', id: s3.id, kind: 'updated', fields: ['enrolled_count', 'waitlist_count'] },
        ]);
        const e2 = ctx.db.get('section', s2.id);
        const e3 = ctx.db.get('section', s3.id);
        const waitlisted = ctx.db.list('enrollment', { where: { section_id: s2.id, status: 'waitlisted' } }).length + ctx.db.list('enrollment', { where: { section_id: s3.id, status: 'waitlisted' } }).length;
        ctx.goal(0.4, 'four students moved', moved.length === 4);
        ctx.goal(0.2, 'exactly one student stays enrolled in section 01 unchanged', stayed.length === 1 && moved.length + stayed.length === targets.length);
        ctx.goal(0.3, 'sections 02 and 03 are exactly full', e2.enrolled_count === e2.capacity && e3.enrolled_count === e3.capacity);
        ctx.goal(0.1, 'nobody was waitlisted', moved.length > 0 && waitlisted === 0 && created.every((e) => e.status === 'enrolled'));
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const get = (p) => { const r = ctx.api('GET', p); ctx.assert(r.status === 200, 'GET ' + p + ' failed: ' + JSON.stringify(r.body)); return r.body; };
        const course = get('/courses?q=CS+120').data.find((c) => c.code === 'CS 120');
        ctx.assert(course, 'course CS 120 not found');
        const term = get('/terms?q=Fall+2026').data.find((t) => t.name === 'Fall 2026');
        ctx.assert(term, 'term Fall 2026 not found');
        const secs = get('/sections?course_id=' + course.id + '&term_id=' + term.id).data;
        const s1 = secs.find((s) => s.section_code === '01');
        const s2 = secs.find((s) => s.section_code === '02');
        const s3 = secs.find((s) => s.section_code === '03');
        ctx.assert(s1 && s2 && s3, 'sections 01, 02 and 03 not found');
        const enrolled = get('/enrollments?section_id=' + s1.id + '&status=enrolled').data;
        ctx.assert(enrolled.length > 0, 'no enrolled students in section 01');
        for (const e of enrolled) {
          let dest = null;
          for (const s of [s2, s3]) {
            const cur = get('/sections/' + s.id);
            if (cur.enrolled_count < cur.capacity) { dest = cur; break; }
          }
          if (dest === null) continue;
          const r = ctx.api('POST', '/sections/' + dest.id + '/enroll', { student_id: e.student_id });
          ctx.assert(r.status === 201 && r.body.status === 'enrolled', 'enroll failed: ' + JSON.stringify(r.body));
          const d = ctx.api('POST', '/enrollments/' + e.id + '/drop', {});
          ctx.assert(d.status === 200 && d.body.status === 'dropped', 'drop failed: ' + JSON.stringify(d.body));
        }
      }
    decoys:
      - why: only looks at section 02 and never uses the free seat in section 03, so it moves three students and leaves two in section 01
        script: |-
          (ctx) => {
            const course = ctx.api('GET', '/courses?q=CS+120').body.data.find((c) => c.code === 'CS 120');
            const term = ctx.api('GET', '/terms?q=Fall+2026').body.data.find((t) => t.name === 'Fall 2026');
            const secs = ctx.api('GET', '/sections?course_id=' + course.id + '&term_id=' + term.id).body.data;
            const s1 = secs.find((s) => s.section_code === '01');
            const s2 = secs.find((s) => s.section_code === '02');
            const enrolled = ctx.api('GET', '/enrollments?section_id=' + s1.id + '&status=enrolled').body.data;
            for (const e of enrolled) {
              const cur = ctx.api('GET', '/sections/' + s2.id).body;
              if (cur.enrolled_count >= cur.capacity) continue;
              ctx.api('POST', '/sections/' + s2.id + '/enroll', { student_id: e.student_id });
              ctx.api('POST', '/enrollments/' + e.id + '/drop', {});
            }
          }
      - why: drops every student from section 01 first and enrolls them afterwards, so the one student without a free seat ends on a waitlist and is no longer enrolled in section 01
        script: |-
          (ctx) => {
            const course = ctx.api('GET', '/courses?q=CS+120').body.data.find((c) => c.code === 'CS 120');
