          status: enrolled
      - entity: section
        kind: updated
        fields:
          - enrolled_count
          - waitlist_count
        where:
          capacity: 6
          enrolled_count: 4
          section_code: "01"
  drop_omar_promote:
    difficulty: medium
    instruction: The student Omar Haddad (not Omar Haddadi) wants out of CS 310 in the Fall 2026 term. Drop his enrollment in that section with a normal drop, so the freed seat goes to the first student on the waitlist. Do not change any other enrollment yourself.
    grader: |-
      (ctx) => {
        const stu = ctx.seed.list('student', { where: { name: 'Omar Haddad' } })[0];
        const course = ctx.seed.list('course', { where: { code: 'CS 310' } })[0];
        const term = ctx.seed.list('term', { where: { name: 'Fall 2026' } })[0];
        if (!stu || !course || !term) return 0;
        const sec = ctx.seed.list('section', { where: { course_id: course.id, term_id: term.id } })[0];
        if (!sec) return 0;
        const target = ctx.seed.list('enrollment', { where: { student_id: stu.id, section_id: sec.id, status: 'enrolled' } })[0];
        if (!target) return 0;
        const waiting = ctx.seed.list('enrollment', { where: { section_id: sec.id, status: 'waitlisted' } })
          .sort((a, b) => a.waitlist_position - b.waitlist_position);
        if (waiting.length === 0) return 0;
        ctx.guardChanges('only Omar Haddad enrollment, the section waitlist and the section counts changed', [
          { entity: 'enrollment', id: target.id, kind: 'updated', fields: ['status', 'waitlist_position'] },
          ...waiting.map((w) => ({ entity: 'enrollment', id: w.id, kind: 'updated', fields: ['status', 'waitlist_position'] })),
          { entity: 'section', id: sec.id, kind: 'updated', fields: ['enrolled_count', 'waitlist_count'] },
        ]);
        const end = ctx.db.get('enrollment', target.id);
        ctx.goal(0.4, 'Omar Haddad enrollment is dropped', end.status === 'dropped');
        const first = ctx.db.get('enrollment', waiting[0].id);
        ctx.goal(0.3, 'the first waitlisted student is enrolled', first.status === 'enrolled' && first.waitlist_position === null);
        ctx.goal(0.2, 'the rest of the waitlist is renumbered from 1', waiting.slice(1).every((w, i) => {
          const x = ctx.db.get('enrollment', w.id);
          return x.status === 'waitlisted' && x.waitlist_position === i + 1;
        }));
        const s = ctx.db.get('section', sec.id);
        ctx.goal(0.1, 'section counts match', s.enrolled_count === sec.enrolled_count && s.waitlist_count === waiting.length - 1);
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const get = (p) => { const r = ctx.api('GET', p); ctx.assert(r.status === 200, 'GET ' + p + ' failed: ' + JSON.stringify(r.body)); return r.body; };
        const omars = get('/students?q=Omar+Haddad').data.filter((s) => s.name === 'Omar Haddad');
        ctx.assert(omars.length === 1, 'expected exactly one student named Omar Haddad');
        const course = get('/courses?q=CS+310').data.find((c) => c.code === 'CS 310');
        ctx.assert(course, 'course CS 310 not found');
        const term = get('/terms?q=Fall+2026').data.find((t) => t.name === 'Fall 2026');
        ctx.assert(term, 'term Fall 2026 not found');
        const sec = get('/sections?course_id=' + course.id + '&term_id=' + term.id).data[0];
        ctx.assert(sec, 'no CS 310 section in Fall 2026');
        const enrolled = get('/enrollments?section_id=' + sec.id + '&status=enrolled').data;
        const mine = enrolled.filter((e) => e.student_id === omars[0].id);
        ctx.assert(mine.length === 1, 'Omar Haddad has no enrolled enrollment in the section');
        const d = ctx.api('POST', '/enrollments/' + mine[0].id + '/drop', {});
        ctx.assert(d.status === 200 && d.body.status === 'dropped', 'drop failed: ' + JSON.stringify(d.body));
      }
    decoys:
      - why: withdraws Omar Haddad instead of dropping him, so the seat is freed and the waitlist moves but his enrollment ends withdrawn, not dropped
        script: |-
          (ctx) => {
            const omar = ctx.api('GET', '/students?q=Omar+Haddad').body.data.find((s) => s.name === 'Omar Haddad');
            const course = ctx.api('GET', '/courses?q=CS+310').body.data.find((c) => c.code === 'CS 310');
            const term = ctx.api('GET', '/terms?q=Fall+2026').body.data.find((t) => t.name === 'Fall 2026');
            const sec = ctx.api('GET', '/sections?course_id=' + course.id + '&term_id=' + term.id).body.data[0];
            const mine = ctx.api('GET', '/enrollments?section_id=' + sec.id + '&status=enrolled').body.data.find((e) => e.student_id === omar.id);
            ctx.api('POST', '/enrollments/' + mine.id + '/withdraw', {});
          }
      - why: drops the near-duplicate student Omar Haddadi instead of Omar Haddad
        script: |-
          (ctx) => {
            const omar = ctx.api('GET', '/students?q=Omar+Haddad').body.data.find((s) => s.name === 'Omar Haddadi');
            const course = ctx.api('GET', '/courses?q=CS+310').body.data.find((c) => c.code === 'CS 310');
            const term = ctx.api('GET', '/terms?q=Fall+2026').body.data.find((t) => t.name === 'Fall 2026');
            const sec = ctx.api('GET', '/sections?course_id=' + course.id + '&term_id=' + term.id).body.data[0];
            const mine = ctx.api('GET', '/enrollments?section_id=' + sec.id + '&status=enrolled').body.data.find((e) => e.student_id === omar.id);
            ctx.api('POST', '/enrollments/' + mine.id + '/drop', {});
          }
    alternatives:
      - why: finds Omar's enrollment by his student id and the enrolled status, then checks the section, instead of listing the section first
        script: |-
          (ctx) => {
            const get = (p) => { const r = ctx.api('GET', p); ctx.assert(r.status === 200, 'GET ' + p + ' failed'); return r.body; };
            const omar = get('/students?q=Omar+Haddad').data.find((s) => s.name === 'Omar Haddad');
            ctx.assert(omar, 'Omar Haddad not found');
            const course = get('/courses?q=CS+310').data.find((c) => c.code === 'CS 310');
            const term = get('/terms?q=Fall+2026').data.find((t) => t.name === 'Fall 2026');
            const sec = get('/sections?course_id=' + course.id + '&term_id=' + term.id).data[0];
            const mine = get('/enrollments?student_id=' + omar.id + '&status=enrolled').data.find((e) => e.section_id === sec.id);
            ctx.assert(mine, 'enrollment not found');
            const others = get('/enrollments?section_id=' + sec.id + '&status=enrolled').data.filter((e) => e.id !== mine.id);
            ctx.assert(others.length > 0, 'expected other enrolled students in the section');
            const d = ctx.api('POST', '/enrollments/' + mine.id + '/drop', {});
            ctx.assert(d.status === 200, 'drop failed: ' + JSON.stringify(d.body));
          }
    allows:
