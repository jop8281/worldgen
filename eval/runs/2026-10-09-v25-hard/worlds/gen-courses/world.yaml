            const s1 = secs.find((s) => s.section_code === '01');
            const s2 = secs.find((s) => s.section_code === '02');
            const s3 = secs.find((s) => s.section_code === '03');
            const enrolled = ctx.api('GET', '/enrollments?section_id=' + s1.id + '&status=enrolled').body.data;
            for (const e of enrolled) ctx.api('POST', '/enrollments/' + e.id + '/drop', {});
            for (const e of enrolled) {
              const cur = ctx.api('GET', '/sections/' + s2.id).body;
              const dest = cur.enrolled_count < cur.capacity ? s2 : s3;
              ctx.api('POST', '/sections/' + dest.id + '/enroll', { student_id: e.student_id });
            }
          }
