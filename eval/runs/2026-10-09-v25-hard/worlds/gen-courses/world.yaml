format: 1
meta:
  name: gen_courses
  description: Students register for course sections in a term. Sections have a seat cap and a bounded waitlist. Prerequisites must be passed first. Terms have add, drop and withdraw deadlines. Dropping or withdrawing frees a seat and promotes the first waitlisted student. A daily job clears waitlists after the add deadline.
  resembles: University course registration system (Banner / Ellucian-style student information system registration module)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T12:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  term:
    description: Academic term with add, drop and withdraw deadlines.
    idPrefix: trm
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 80
      add_deadline:
        type: datetime
        description: Last moment to enroll or join a waitlist. After it the waitlist_expiry job clears waitlists.
        required: true
        nullable: false
        unique: false
        readonly: false
      drop_deadline:
        type: datetime
        description: Last moment to drop. After it a student can only withdraw.
        required: true
        nullable: false
        unique: false
        readonly: false
      withdraw_deadline:
        type: datetime
        description: Last moment to withdraw.
        required: true
        nullable: false
        unique: false
        readonly: false
  course:
    description: Catalog course.
    idPrefix: crs
    fields:
      code:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 20
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      credits:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        max: 12
  prerequisite:
    description: A course that must be passed with at least a minimum grade before another course can be taken.
    idPrefix: pre
    fields:
      course_id:
        type: ref
        description: The course that has the prerequisite.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: course
        onDelete: cascade
      required_course_id:
        type: ref
        description: The course that must be passed first.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: course
        onDelete: cascade
      min_grade:
        type: enum
        description: Lowest passing grade, ordered A > B > C > D > F.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - A
          - B
          - C
          - D
          - F
  student:
    description: Enrolled university student.
    idPrefix: stu
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
  section:
    description: A course offering in a term with a seat cap and a bounded waitlist. Counts are maintained by the registration actions and the waitlist_expiry job.
    idPrefix: sec
    fields:
      course_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: course
        onDelete: restrict
      term_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: term
        onDelete: restrict
      section_code:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 10
      capacity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      waitlist_capacity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      enrolled_count:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      waitlist_count:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
  enrollment:
    description: A student's registration in a section, with lifecycle status, waitlist position and final grade. Created only by the enroll_student action.
    idPrefix: enr
    fields:
      student_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: student
        onDelete: restrict
      section_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: section
        onDelete: restrict
      status:
        type: state
        description: Registration lifecycle. waitlisted moves to enrolled on promotion or to dropped. enrolled moves to dropped, withdrawn or completed.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - waitlisted
          - enrolled
          - dropped
          - withdrawn
          - completed
        initial: waitlisted
        transitions:
          waitlisted:
            - enrolled
            - dropped
            - withdrawn
          enrolled:
            - dropped
            - withdrawn
            - completed
          dropped: []
          withdrawn: []
          completed: []
      waitlist_position:
        type: int
        description: 1-based place on the section waitlist, null unless waitlisted.
        required: false
        nullable: true
        unique: false
        readonly: true
        min: 1
      grade:
        type: enum
        description: Final grade, set by record_grade.
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - A
          - B
          - C
          - D
          - F
