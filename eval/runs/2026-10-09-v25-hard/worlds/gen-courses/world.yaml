actions:
  enroll_student:
    method: POST
    path: /sections/{id}/enroll
    description: "Enroll a student in a section: takes a seat, else joins the waitlist, else 409 waitlist_full. Checks add deadline, duplicates and prerequisites."
    input:
      student_id:
        type: ref
        description: The student to register.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: student
        onDelete: restrict
    handler: |-
      (ctx) => {
        const sec = ctx.db.get('section', ctx.params.id);
        if (sec === null) ctx.fail(404, 'not_found', 'section ' + ctx.params.id + ' not found');
        const stu = ctx.db.get('student', ctx.body.student_id);
        if (stu === null) ctx.fail(404, 'not_found', 'student ' + ctx.body.student_id + ' not found');
        const term = ctx.db.get('term', sec.term_id);
        const now = ctx.now();
        if (ctx.time.minutesBetween(term.add_deadline, now) > 0) ctx.fail(409, 'add_deadline_passed', 'the add deadline ' + term.add_deadline + ' for ' + term.name + ' has passed');
        const mine = ctx.db.list('enrollment', { where: { student_id: stu.id } });
        if (mine.some((e) => e.section_id === sec.id && (e.status === 'enrolled' || e.status === 'waitlisted'))) ctx.fail(409, 'already_registered', 'student ' + stu.id + ' already has an active enrollment in section ' + sec.id);
        const rank = { A: 4, B: 3, C: 2, D: 1, F: 0 };
        const prereqs = ctx.db.list('prerequisite', { where: { course_id: sec.course_id } });
        for (const p of prereqs) {
          const ok = mine.some((e) => {
            if (e.status !== 'completed' || e.grade === null || e.grade === 'F') return false;
            const s = ctx.db.get('section', e.section_id);
            return s !== null && s.course_id === p.required_course_id && rank[e.grade] >= rank[p.min_grade];
          });
          if (!ok) {
            const rc = ctx.db.get('course', p.required_course_id);
            ctx.fail(409, 'prerequisite_not_met', 'prerequisite ' + (rc ? rc.code : p.required_course_id) + ' with at least grade ' + p.min_grade + ' not met');
          }
        }
        if (sec.enrolled_count < sec.capacity) {
          const e = ctx.db.create('enrollment', { student_id: stu.id, section_id: sec.id, waitlist_position: null });
          ctx.db.update('enrollment', e.id, { status: 'enrolled' });
          ctx.db.update('section', sec.id, { enrolled_count: sec.enrolled_count + 1 });
          return { status: 201, body: ctx.db.get('enrollment', e.id) };
        }
        if (sec.waitlist_count < sec.waitlist_capacity) {
          const e = ctx.db.create('enrollment', { student_id: stu.id, section_id: sec.id, waitlist_position: sec.waitlist_count + 1 });
          ctx.db.update('section', sec.id, { waitlist_count: sec.waitlist_count + 1 });
          return { status: 201, body: ctx.db.get('enrollment', e.id) };
        }
        ctx.fail(409, 'waitlist_full', 'section ' + sec.id + ' is full and its waitlist is full');
      }
  drop_enrollment:
    method: POST
    path: /enrollments/{id}/drop
    description: Drop an enrolled or waitlisted enrollment on or before the term drop deadline. Frees the seat and promotes the first waitlisted student.
    input: {}
    handler: |-
      (ctx) => {
        const enr = ctx.db.get('enrollment', ctx.params.id);
        if (enr === null) ctx.fail(404, 'not_found', 'enrollment ' + ctx.params.id + ' not found');
        if (enr.status !== 'enrolled' && enr.status !== 'waitlisted') ctx.fail(409, 'invalid_state', 'enrollment ' + enr.id + ' is ' + enr.status + '. Only enrolled and waitlisted enrollments can be dropped.');
        const sec = ctx.db.get('section', enr.section_id);
        const term = ctx.db.get('term', sec.term_id);
        if (ctx.time.minutesBetween(term.drop_deadline, ctx.now()) > 0) ctx.fail(409, 'drop_deadline_passed', 'the drop deadline ' + term.drop_deadline + ' has passed. Withdraw instead.');
        ctx.db.update('enrollment', enr.id, { status: 'dropped', waitlist_position: null });
        const waiting = ctx.db.list('enrollment', { where: { section_id: sec.id, status: 'waitlisted' } }).sort((a, b) => a.waitlist_position - b.waitlist_position);
        let enrolled = ctx.db.list('enrollment', { where: { section_id: sec.id, status: 'enrolled' } }).length;
        let pos = 0;
        for (const w of waiting) {
          if (enrolled < sec.capacity) {
            ctx.db.update('enrollment', w.id, { status: 'enrolled', waitlist_position: null });
            enrolled += 1;
          } else {
            pos += 1;
            if (w.waitlist_position !== pos) ctx.db.update('enrollment', w.id, { waitlist_position: pos });
          }
        }
        ctx.db.update('section', sec.id, { enrolled_count: enrolled, waitlist_count: pos });
        return { status: 200, body: ctx.db.get('enrollment', enr.id) };
      }
  withdraw_enrollment:
    method: POST
    path: /enrollments/{id}/withdraw
    description: Withdraw an enrolled or waitlisted enrollment on or before the term withdraw deadline. Frees the seat and promotes the first waitlisted student.
    input: {}
    handler: |-
      (ctx) => {
        const enr = ctx.db.get('enrollment', ctx.params.id);
        if (enr === null) ctx.fail(404, 'not_found', 'enrollment ' + ctx.params.id + ' not found');
        if (enr.status !== 'enrolled' && enr.status !== 'waitlisted') ctx.fail(409, 'invalid_state', 'enrollment ' + enr.id + ' is ' + enr.status + '. Only enrolled and waitlisted enrollments can be withdrawn.');
        const sec = ctx.db.get('section', enr.section_id);
        const term = ctx.db.get('term', sec.term_id);
        if (ctx.time.minutesBetween(term.withdraw_deadline, ctx.now()) > 0) ctx.fail(409, 'withdraw_deadline_passed', 'the withdraw deadline ' + term.withdraw_deadline + ' has passed');
        ctx.db.update('enrollment', enr.id, { status: 'withdrawn', waitlist_position: null });
        const waiting = ctx.db.list('enrollment', { where: { section_id: sec.id, status: 'waitlisted' } }).sort((a, b) => a.waitlist_position - b.waitlist_position);
        let enrolled = ctx.db.list('enrollment', { where: { section_id: sec.id, status: 'enrolled' } }).length;
        let pos = 0;
        for (const w of waiting) {
          if (enrolled < sec.capacity) {
            ctx.db.update('enrollment', w.id, { status: 'enrolled', waitlist_position: null });
            enrolled += 1;
          } else {
            pos += 1;
            if (w.waitlist_position !== pos) ctx.db.update('enrollment', w.id, { waitlist_position: pos });
          }
        }
        ctx.db.update('section', sec.id, { enrolled_count: enrolled, waitlist_count: pos });
        return { status: 200, body: ctx.db.get('enrollment', enr.id) };
      }
  record_grade:
    method: POST
    path: /enrollments/{id}/grade
    description: Record a final grade for an enrolled enrollment and complete it.
    input:
      grade:
        type: enum
        description: Final grade.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - A
          - B
          - C
          - D
          - F
    handler: |-
      (ctx) => {
        const enr = ctx.db.get('enrollment', ctx.params.id);
        if (enr === null) ctx.fail(404, 'not_found', 'enrollment ' + ctx.params.id + ' not found');
        if (enr.status !== 'enrolled') ctx.fail(409, 'invalid_state', 'enrollment ' + enr.id + ' is ' + enr.status + '. Only enrolled enrollments can be graded.');
        const updated = ctx.db.update('enrollment', enr.id, { status: 'completed', grade: ctx.body.grade });
        const sec = ctx.db.get('section', enr.section_id);
        ctx.db.update('section', sec.id, { enrolled_count: Math.max(0, sec.enrolled_count - 1) });
        return { status: 200, body: updated };
      }
jobs:
  waitlist_expiry:
    description: Daily. Drops waitlisted enrollments whose term add deadline has passed and resets the section waitlist counts.
    every: 1d
    run: |-
      (ctx) => {
        const now = ctx.now();
        const touched = new Set();
        for (const e of ctx.db.list('enrollment', { where: { status: 'waitlisted' } })) {
          const sec = ctx.db.get('section', e.section_id);
          const term = ctx.db.get('term', sec.term_id);
          if (ctx.time.minutesBetween(term.add_deadline, now) > 0) {
            ctx.db.update('enrollment', e.id, { status: 'dropped', waitlist_position: null });
            touched.add(sec.id);
          }
        }
        for (const id of touched) ctx.db.update('section', id, { waitlist_count: 0 });
      }
