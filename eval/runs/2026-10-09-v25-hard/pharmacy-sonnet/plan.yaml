seed:
  rowsPerEntity:
    patient: 14
    medication: 14
    pharmacist: 5
    stock_lot: 32
    prescription: 40
    fill: 48
  mix: Controlled medications are about a third of the catalogue. Fills in pending_review are for controlled prescriptions, 12 of them. Of those prescriptions, 4 have expires_on just before the clock start (2026-10-08 to 2026-10-09T08:00) but are still status active because the daily job has not run, and 4 expire just after (2026-10-10 or later); the rest are far in the future. Two near-duplicate patients, Maria Lopez and Maria Lopes with different dates of birth, each have a ready fill. Pharmacists include 3 pharmacists and 2 technicians. Stock lots include several available lots of the same medication with different expiry dates, 3 quarantined and 10 expired lots. Prescription notes include misleading text such as 'already approved by phone' on rows whose fill status says otherwise. Prescriptions include completed ones with all refills used and cancelled ones.
  stateMix:
    prescription:
      active: 60
      completed: 15
      cancelled: 15
      expired: 10
    fill:
      pending_review: 25
      ready: 30
      dispensed: 35
      rejected: 10
    stock_lot:
      available: 59
      quarantined: 9
      expired: 32
tasks:
  - id: approve_pending_controlled_fill
    difficulty: easy
    kind: permissions
    intent: Approve the pending-review controlled fill for one named patient using a named pharmacist.
    decoyIdea: Approves a pending fill for a different patient, or uses a technician's id.
  - id: dispense_ready_fill_for_maria_lopez
    difficulty: medium
    kind: misleading_text
    intent: Dispense the ready fill for Maria Lopez (identified by date of birth) without touching the near-duplicate patient Maria Lopes.
    actions:
      - dispense_fill
    decoyIdea: Dispenses Maria Lopes' ready fill, or both fills.
    pressure:
      states:
        - fill.ready
      distractors: patient
  - id: process_controlled_review_queue
    difficulty: hard
    kind: time_sensitive
    intent: Process the controlled-substance review queue at the current date. Approve and dispense each pending_review fill whose prescription has not passed expires_on. Reject, with a reason, those whose prescription expiry date has passed, even though their status is still active.
    actions:
      - approve_fill
      - dispense_fill
      - reject_fill
    decoyIdea: Approves and dispenses every pending fill, trusting status active, or only approves without dispensing.
    pressure:
      states:
        - fill.pending_review
        - prescription.active
      distractors: prescription
open_questions:
  - question: Should technicians be allowed to dispense controlled fills once a pharmacist has approved them?
    default_answer: Yes. Dispensing needs no staff input; only approval and rejection need a pharmacist.
  - question: Do pending fills count against the refill allowance?
    default_answer: Yes, every non-rejected fill request counts.
  - question: Can a fill be split across lots?
    default_answer: No. One lot must hold the whole fill quantity.
  - question: Do expired or cancelled prescriptions auto-reject open fills?
    default_answer: Cancelling rejects open fills. Expiry does not; a pharmacist must reject them.
assumptions:
  - decision: Clock starts 2026-10-09T09:00:00Z with tick 0s; seeded history is before this and prescription and lot expiry dates lie on both sides of it.
    why: Time is explicit and deterministic; expiry-sensitive tasks need rows just before and after the cutoff.
  - decision: A prescription allows refills_allowed + 1 fills in total. fills_made counts non-rejected fill requests, and rejecting a fill gives the count back.
    why: Matches the real first-fill-plus-refills model and keeps the rule checkable.
  - decision: Controlled fills start as pending_review; otc and rx fills start as ready. Approval moves pending_review to ready and records approved_by.
    why: Keeps a single fill state machine with the pharmacist gate on controlled substances only.
  - decision: Only a pharmacist with role pharmacist and active=true may approve or reject. Technicians get 422 not_pharmacist.
    why: Models the permission rule for controlled substances.
  - decision: Dispensing picks the available lot with the earliest expires_on that is still in the future and has enough quantity, takes the fill quantity from it, and records lot_id. Otherwise it answers 409 insufficient_stock.
    why: First-expiring-first-out is the standard pharmacy practice, and it keeps expired stock from reaching patients.
  - decision: Daily jobs mark lots and prescriptions expired once past expires_on. The approve and dispense actions check the dates themselves and do not trust the status flag.
    why: Status can lag by up to a day, which creates the near-cutoff traps.
  - decision: Dispensing the last allowed fill of a prescription moves it to completed.
    why: Gives prescriptions a natural end state.
  - decision: Standard create routes may create lots with past expiry dates.
    why: This lets receiving and test flows work; dispense and the job guard against expired stock.
  - decision: 'State mix: prescriptions 60% active, 15% completed, 15% cancelled, 10% expired; fills 25% pending_review, 30% ready, 35% dispensed, 10% rejected; lots 59% available, 9% quarantined, 32% expired.'
    why: Spreads every state with none above 70% while matching the seed counts described.
outOfScope:
  - what: Insurance claims, pricing and payments
    why: The core value is the stock and approval workflow, not billing.
  - what: DEA/state controlled-substance reporting and drug-interaction checks
    why: External integrations and clinical decision support are not record workflows here.
  - what: Authentication and user sessions
    why: The acting pharmacist is passed as an action input.
  - what: Purchase orders and supplier management
    why: Lots arrive through the create route only.
changes: []
