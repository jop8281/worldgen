    path: /projects
    description: Page through projects, filtered by status, searched by name.
  get_project:
    op: get
    entity: project
    method: GET
    path: /projects/{id}
    description: Read one project.
  create_project:
    op: create
    entity: project
    method: POST
    path: /projects
    description: Create an active project.
  update_project:
    op: update
    entity: project
    method: PATCH
    path: /projects/{id}
    description: Rename a project. Status is not writable here.
  list_project_tasks:
