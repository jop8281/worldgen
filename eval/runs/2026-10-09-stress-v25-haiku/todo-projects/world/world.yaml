ted, completed]) => { const createdAt = at(-created); return { project_id: projects[p].id, title, notes: null, status, assignee_id: a < 0 ? null : members[a].id, due_at: at(due), completed_at: completed === null ? null : at(-completed), created_at: createdAt, updated_at: completed === null ? createdAt : at(-completed) }; }); }"
tests:
  archive_refuses_open_tasks:
    description: Create a project and an open task. Archiving is refused with tasks_open. After completing the task, archiving succeeds, and a second archive is refused with already_archived.
    script: |-
      (ctx) => {
        const p = ctx.api('POST', '/projects', { name: 'Plan check archive gate' });
        ctx.assert(p.status === 201, 'create project returned ' + p.status);
        const t = ctx.api('POST', '/tasks', { project_id: p.body.id, title: 'Plan check open task' });
        ctx.assert(t.status === 201, 'create task returned ' + t.status);
        const early = ctx.api('POST', '/projects/' + p.body.id + '/archive');
        ctx.assert(early.status === 409 && early.body.error.code === 'tasks_open', 'archive with an open task: ' + early.status + ' ' + JSON.stringify(early.body));
        const done = ctx.api('POST', '/tasks/' + t.body.id + '/complete');
        ctx.assert(done.status === 200, 'complete returned ' + done.status);
        const ok = ctx.api('POST', '/projects/' + p.body.id + '/archive');
        ctx.assert(ok.status === 200 && ok.body.status === 'archived', 'archive after completion: ' + ok.status + ' ' + JSON.stringify(ok.body));
        const again = ctx.api('POST', '/projects/' + p.body.id + '/archive');
        ctx.assert(again.status === 409 && again.body.error.code === 'already_archived', 'second archive: ' + again.status + ' ' + JSON.stringify(again.body));
      }
  assign_requires_active_member:
    description: Create two members, deactivate one, then assign a task to each. The inactive one is refused with member_inactive and the active one succeeds.
    script: |-
      (ctx) => {
        const m = ctx.api('POST', '/members', { name: 'Plan Check Active', email: 'plan.check.active@probe.example' });
        ctx.assert(m.status === 201, 'create active member returned ' + m.status);
        const gone = ctx.api('POST', '/members', { name: 'Plan Check Inactive', email: 'plan.check.inactive@probe.example' });
        ctx.assert(gone.status === 201, 'create second member returned ' + gone.status);
        const off = ctx.api('PATCH', '/members/' + gone.body.id, { active: false });
        ctx.assert(off.status === 200 && off.body.active === false, 'deactivate returned ' + off.status);
        const p = ctx.api('POST', '/projects', { name: 'Plan check assignment' });
        const t = ctx.api('POST', '/tasks', { project_id: p.body.id, title: 'Plan check assign task' });
        ctx.assert(t.status === 201, 'create task returned ' + t.status);
        const bad = ctx.api('POST', '/tasks/' + t.body.id + '/assign', { assignee_id: gone.body.id });
        ctx.assert(bad.status === 409 && bad.body.error.code === 'member_inactive', 'inactive member: ' + bad.status + ' ' + JSON.stringify(bad.body));
        const good = ctx.api('POST', '/tasks/' + t.body.id + '/assign', { assignee_id: m.body.id });
        ctx.assert(good.status === 200 && good.body.assignee_id === m.body.id, 'active member: ' + good.status + ' ' + JSON.stringify(good.body));
      }
  complete_sets_completed_at:
    description: Create a task and complete it. The result is done with a completed_at string. A second completion is refused with already_done, and a read shows done.
    script: |-
      (ctx) => {
        const p = ctx.api('POST', '/projects', { name: 'Plan check completion' });
        const t = ctx.api('POST', '/tasks', { project_id: p.body.id, title: 'Plan check complete task' });
        ctx.assert(t.status === 201, 'create task returned ' + t.status);
        const r = ctx.api('POST', '/tasks/' + t.body.id + '/complete');
        ctx.assert(r.status === 200 && r.body.status === 'done', 'complete: ' + r.status + ' ' + JSON.stringify(r.body));
        ctx.assert(typeof r.body.completed_at === 'string', 'completed_at set, got ' + JSON.stringify(r.body.completed_at));
        const again = ctx.api('POST', '/tasks/' + t.body.id + '/complete');
        ctx.assert(again.status === 409 && again.body.error.code === 'already_done', 'second complete: ' + again.status + ' ' + JSON.stringify(again.body));
        const read = ctx.api('GET', '/tasks/' + t.body.id);
        ctx.assert(read.status === 200 && read.body.status === 'done', 'read after complete: ' + read.status + ' ' + JSON.stringify(read.body));
      }
  project_tasks_filter_by_assignee:
    description: Create a project with two tasks, assign one to a member, and list the project's tasks. Unfiltered returns both, and filtering by the assignee returns only the assigned task.
    script: |-
      (ctx) => {
        const m = ctx.api('POST', '/members', { name: 'Plan Check Filter', email: 'plan.check.filter@probe.example' });
        ctx.assert(m.status === 201, 'create member returned ' + m.status);
        const p = ctx.api('POST', '/projects', { name: 'Plan check filter' });
        const t1 = ctx.api('POST', '/tasks', { project_id: p.body.id, title: 'Plan check first' });
        const t2 = ctx.api('POST', '/tasks', { project_id: p.body.id, title: 'Plan check second' });
        ctx.assert(t1.status === 201 && t2.status === 201, 'create tasks');
        const a = ctx.api('POST', '/tasks/' + t1.body.id + '/assign', { assignee_id: m.body.id });
        ctx.assert(a.status === 200, 'assign returned ' + a.status);
        const all = ctx.api('GET', '/projects/' + p.body.id + '/tasks');
        ctx.assert(all.status === 200 && all.body.data.length === 2, 'unfiltered list: ' + all.status + ' ' + JSON.stringify(all.body));
        const mine = ctx.api('GET', '/projects/' + p.body.id + '/tasks?assignee_id=' + m.body.id);
        ctx.assert(mine.status === 200 && mine.body.data.length === 1 && mine.body.data[0].id === t1.body.id, 'filtered list: ' + JSON.stringify(mine.body));
      }
  start_moves_task_to_in_progress:
    description: Create a task, start it, and check in_progress. A second start is refused with invalid_state.
    script: |-
      (ctx) => {
        const p = ctx.api('POST', '/projects', { name: 'Plan check start' });
        const t = ctx.api('POST', '/tasks', { project_id: p.body.id, title: 'Plan check start task' });
        ctx.assert(t.status === 201 && t.body.status === 'todo', 'new task is todo: ' + JSON.stringify(t.body));
        const r = ctx.api('POST', '/tasks/' + t.body.id + '/start');
        ctx.assert(r.status === 200 && r.body.status === 'in_progress', 'start: ' + r.status + ' ' + JSON.stringify(r.body));
        const again = ctx.api('POST', '/tasks/' + t.body.id + '/start');
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second start: ' + again.status + ' ' + JSON.stringify(again.body));
      }
tasks:
  complete_named_task:
    difficulty: easy
    instruction: Mark done the open task 'Renew SSL certificate' in project 'Website relaunch'.
    grader: |-
      (ctx) => {
        const proj = ctx.seed.list('project', { where: { name: 'Website relaunch' } })[0];
        if (!proj) return 0;
        const target = ctx.seed.list('task', { where: { project_id: proj.id, title: 'Renew SSL certificate' } })[0];
        if (!target) return 0;
        ctx.guardChanges('only the open Renew SSL certificate task in Website relaunch changed', [
          { entity: 'task', id: target.id, kind: 'updated', fields: ['status', 'completed_at'] },
        ]);
        const end = ctx.db.get('task', target.id);
        ctx.goal(1, 'Renew SSL certificate in Website relaunch is done', end.status === 'done' && typeof end.completed_at === 'string');
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const project = ctx.api('GET', '/projects?status=active').body.data.find((p) => p.name === 'Website relaunch');
        ctx.assert(project, 'project Website relaunch not found');
        const todo = ctx.api('GET', '/projects/' + project.id + '/tasks?status=todo').body.data;
        const target = todo.find((t) => t.title === 'Renew SSL certificate');
        ctx.assert(target, 'no open Renew SSL certificate task in Website relaunch');
        const r = ctx.api('POST', '/tasks/' + target.id + '/complete');
        ctx.assert(r.status === 200 && r.body.status === 'done', 'complete failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: completes the same-titled task in Mobile app v3, the near-duplicate the seed plants, and leaves the Website relaunch task open
        script: |-
          (ctx) => {
            const mobile = ctx.api('GET', '/projects?status=active').body.data.find((p) => p.name === 'Mobile app v3');
            ctx.assert(mobile, 'project Mobile app v3 not found');
            const dup = ctx.api('GET', '/projects/' + mobile.id + '/tasks?status=todo').body.data.find((t) => t.title === 'Renew SSL certificate');
            ctx.assert(dup, 'duplicate task not found');
            ctx.api('POST', '/tasks/' + dup.id + '/complete');
          }
    alternatives: []
    allows:
      - entity: task
        kind: updated
        fields:
          - status
          - completed_at
        where:
          project_id: prj_0001
          title: Renew SSL certificate
  assign_active_member_in_project:
    difficulty: medium
    instruction: Assign the todo task 'Draft Q4 onboarding checklist' in project 'Operations' to the active member Ana Ruiz, not the inactive duplicate with a similar name.
    grader: |-
      (ctx) => {
        const ops = ctx.seed.list('project', { where: { name: 'Operations' } })[0];
        if (!ops) return 0;
        const target = ctx.seed.list('task', { where: { project_id: ops.id, title: 'Draft Q4 onboarding checklist' } })[0];
        if (!target) return 0;
        const ana = ctx.seed.list('member', { where: { name: 'Ana Ruiz' } })[0];
        if (!ana) return 0;
        ctx.guardChanges('only the assignee of the draft onboarding task changed', [
          { entity: 'task', id: target.id, kind: 'updated', fields: ['assignee_id'] },
        ]);
        const end = ctx.db.get('task', target.id);
        const member = end.assignee_id === null ? null : ctx.db.get('member', end.assignee_id);
        ctx.goal(0.5, 'the task is assigned to an active member', member !== null && member.active === true);
        ctx.goal(0.5, 'the active member Ana Ruiz is assigned', end.assignee_id === ana.id);
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const ops = ctx.api('GET', '/projects?status=active').body.data.find((p) => p.name === 'Operations');
        ctx.assert(ops, 'project Operations not found');
        const todo = ctx.api('GET', '/projects/' + ops.id + '/tasks?status=todo').body.data;
        const task = todo.find((t) => t.title === 'Draft Q4 onboarding checklist');
        ctx.assert(task, 'no todo task Draft Q4 onboarding checklist in Operations');
        const inactive = ctx.api('GET', '/members?active=false').body.data;
        ctx.assert(inactive.some((m) => m.name === 'Ana Roiz'), 'inactive duplicate Ana Roiz not listed');
        const ana = ctx.api('GET', '/members?active=true').body.data.find((m) => m.name === 'Ana Ruiz');
        ctx.assert(ana, 'active member Ana Ruiz not found');
        const r = ctx.api('POST', '/tasks/' + task.id + '/assign', { assignee_id: ana.id });
        ctx.assert(r.status === 200 && r.body.assignee_id === ana.id, 'assign failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: tries the inactive duplicate Ana Roiz, which is refused with member_inactive, then assigns the last active member on the list, Elena Ruiz, instead of Ana Ruiz
        script: |-
          (ctx) => {
            const ops = ctx.api('GET', '/projects?status=active').body.data.find((p) => p.name === 'Operations');
            const task = ctx.api('GET', '/projects/' + ops.id + '/tasks?status=todo').body.data.find((t) => t.title === 'Draft Q4 onboarding checklist');
            const roiz = ctx.api('GET', '/members?active=false').body.data.find((m) => m.name === 'Ana Roiz');
            ctx.api('POST', '/tasks/' + task.id + '/assign', { assignee_id: roiz.id });
            const last = ctx.api('GET', '/members?active=true').body.data.pop();
            ctx.api('POST', '/tasks/' + task.id + '/assign', { assignee_id: last.id });
          }
    alternatives: []
    allows:
      - entity: task
        kind: updated
        fields:
          - assignee_id
        where:
          project_id: prj_0002
          title: Draft Q4 onboarding checklist
  close_out_project:
    difficulty: hard
    instruction: "Close out project 'Website relaunch': complete every task in it that is not done, then archive the project. Change nothing in other projects."
    grader: |-
      (ctx) => {
        const proj = ctx.seed.list('project', { where: { name: 'Website relaunch' } })[0];
        if (!proj) return 0;
        const open = ctx.seed.list('task', { where: { project_id: proj.id } }).filter((t) => t.status !== 'done');
        if (open.length === 0) return 0;
        ctx.guardChanges('only the open tasks of Website relaunch and the project status changed', [
          ...open.map((t) => ({ entity: 'task', id: t.id, kind: 'updated', fields: ['status', 'completed_at'] })),
          { entity: 'project', id: proj.id, kind: 'updated', fields: ['status'] },
        ]);
        const allDone = open.every((t) => {
          const e = ctx.db.get('task', t.id);
          return e !== null && e.status === 'done' && typeof e.completed_at === 'string';
        });
        const end = ctx.db.get('project', proj.id);
        ctx.goal(0.5, 'every open task of Website relaunch is done', allDone);
        ctx.goal(0.5, 'Website relaunch is archived', end.status === 'archived');
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const sep = path.includes('?') ? '&' : '?';
            const r = ctx.api('GET', path + (cursor === null ? '' : sep + 'cursor=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor;
          } while (cursor !== null);
          return rows;
        };
        const project = pages('/projects?status=active').find((p) => p.name === 'Website relaunch');
        ctx.assert(project, 'project Website relaunch not found');
        const open = pages('/projects/' + project.id + '/tasks').filter((t) => t.status !== 'done');
        ctx.assert(open.length > 0, 'no open tasks left in Website relaunch');
        for (const t of open) {
          const r = ctx.api('POST', '/tasks/' + t.id + '/complete');
          ctx.assert(r.status === 200, 'complete ' + t.id + ' failed: ' + JSON.stringify(r.body));
        }
        const a = ctx.api('POST', '/projects/' + project.id + '/archive');
        ctx.assert(a.status === 200 && a.body.status === 'archived', 'archive failed: ' + JSON.stringify(a.body));
      }
    decoys:
      - why: completes the open tasks of Website relaunch but never archives the project
        script: |-
          (ctx) => {
            const proj = ctx.api('GET', '/projects?status=active').body.data.find((p) => p.name === 'Website relaunch');
            const rows = ctx.api('GET', '/projects/' + proj.id + '/tasks').body.data;
            for (const t of rows) if (t.status !== 'done') ctx.api('POST', '/tasks/' + t.id + '/complete');
          }
      - why: completes only the in_progress tasks, then tries to archive, which is refused while the todo tasks stay open
        script: |-
          (ctx) => {
            const proj = ctx.api('GET', '/projects?status=active').body.data.find((p) => p.name === 'Website relaunch');
            const rows = ctx.api('GET', '/projects/' + proj.id + '/tasks?status=in_progress').body.data;
            for (const t of rows) ctx.api('POST', '/tasks/' + t.id + '/complete');
            ctx.api('POST', '/projects/' + proj.id + '/archive');
          }
      - why: closes out Website relaunch but also completes the open tasks of Operations, which it was not asked to touch
        script: |-
          (ctx) => {
            const projects = ctx.api('GET', '/projects?status=active').body.data;
            const site = projects.find((p) => p.name === 'Website relaunch');
            const ops = projects.find((p) => p.name === 'Operations');
            for (const proj of [site, ops]) {
              const rows = ctx.api('GET', '/projects/' + proj.id + '/tasks').body.data;
              for (const t of rows) if (t.status !== 'done') ctx.api('POST', '/tasks/' + t.id + '/complete');
            }
            ctx.api('POST', '/projects/' + site.id + '/archive');
          }
    alternatives: []
    allows:
      - entity: task
        kind: updated
        fields:
          - status
          - completed_at
        where:
          project_id: prj_0001
      - entity: project
        kind: updated
        fields:
          - status
        where:
          name: Website relaunch
