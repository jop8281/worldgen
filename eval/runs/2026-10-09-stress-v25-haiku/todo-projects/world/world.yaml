format: 1
meta:
  name: world
  description: "A to-do app where members work tasks grouped into projects. Tasks have an assignee and an optional due date and move through todo, in_progress and done. A project can be archived only when every one of its tasks is done. Feasible: the core value is stateful records that an agent reads and changes through an API with actions on them."
  resembles: Asana-style projects and tasks API
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  member:
    description: A person who can be assigned tasks. Inactive members cannot take new assignments.
    idPrefix: mem
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  project:
    description: A named group of tasks. Its status is a state field that only archive_project moves to archived. Archived is final.
    idPrefix: prj
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      status:
        type: state
        description: active until archive_project moves it to archived. No transition leaves archived.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - active
          - archived
        initial: active
        transitions:
          active:
            - archived
          archived: []
  task:
    description: A unit of work inside one project, with an optional assignee and due date. Its status moves only through start_task and complete_task. assignee_id is set only by assign_task.
    idPrefix: tsk
    fields:
      project_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: project
        onDelete: restrict
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      notes:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: state
        description: Starts todo. todo can move to in_progress or done, in_progress to done, and done is final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - todo
          - in_progress
          - done
        initial: todo
        transitions:
          todo:
            - in_progress
            - done
          in_progress:
            - done
          done: []
      assignee_id:
        type: ref
        description: Set only by assign_task. Must be an active member.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: member
        onDelete: nullify
      due_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      completed_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
