  list_tasks:
    op: list
    entity: task
    filters:
      - project_id
      - status
      - assignee_id
    search:
      - title
    sort:
      - due_at
      - created_at
    pageSize: 25
    method: GET
    path: /tasks
    description: Page through all tasks, filtered by project, status and assignee, searched by title.
  get_task:
    op: get
    entity: task
    method: GET
    path: /tasks/{id}
    description: Read one task.
  create_task:
    op: create
    entity: task
    method: POST
    path: /tasks
    description: Create a task in a project. It starts todo and unassigned.
  update_task:
    op: update
    entity: task
    method: PATCH
    path: /tasks/{id}
    description: Edit the title, notes or due date of a task.
  list_members:
    op: list
    entity: member
    filters:
      - active
    search:
      - name
      - email
    sort:
      - name
    pageSize: 25
    method: GET
    path: /members
    description: Page through members, filtered by active, searched by name and email.
  get_member:
    op: get
    entity: member
    method: GET
    path: /members/{id}
    description: Read one member.
  create_member:
    op: create
    entity: member
    method: POST
    path: /members
    description: Create an active member.
  update_member:
    op: update
    entity: member
    method: PATCH
    path: /members/{id}
    description: Change a member's name or active flag.
actions:
  archive_project:
    method: POST
    path: /projects/{id}/archive
    description: Archive an active project. Refused with tasks_open while any task is not done. Archived is final.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const p = ctx.db.get('project', id);
        if (p === null) ctx.fail(404, 'not_found', 'project ' + id + ' not found');
        if (p.status === 'archived') ctx.fail(409, 'already_archived', 'project ' + id + ' is already archived');
        const open = ctx.db.list('task', { where: { project_id: id } }).filter((t) => t.status !== 'done');
        if (open.length > 0) ctx.fail(409, 'tasks_open', 'project ' + id + ' has ' + open.length + ' task(s) not done: ' + open.map((t) => t.id).join(', ') + '. Complete them before archiving.');
        return { status: 200, body: ctx.db.update('project', id, { status: 'archived' }) };
      }
  start_task:
    method: POST
    path: /tasks/{id}/start
    description: Start a todo task, moving it to in_progress. Any other status is refused with invalid_state.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('task', id);
        if (t === null) ctx.fail(404, 'not_found', 'task ' + id + ' not found');
        if (t.status !== 'todo') ctx.fail(409, 'invalid_state', 'task ' + id + ' is ' + t.status + '. Only todo tasks can be started.');
        return { status: 200, body: ctx.db.update('task', id, { status: 'in_progress' }) };
      }
  assign_task:
    method: POST
    path: /tasks/{id}/assign
    description: Assign a task to an active member. Refused with member_inactive for an inactive member and invalid_state for a done task.
    input:
      assignee_id:
        type: ref
        description: The member who will work the task. Must be active.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: member
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('task', id);
        if (t === null) ctx.fail(404, 'not_found', 'task ' + id + ' not found');
        if (t.status === 'done') ctx.fail(409, 'invalid_state', 'task ' + id + ' is done. Done tasks cannot be reassigned.');
        const m = ctx.db.get('member', ctx.body.assignee_id);
        if (m === null) ctx.fail(422, 'unknown_member', 'member ' + ctx.body.assignee_id + ' not found. List members with GET /members.');
        if (m.active !== true) ctx.fail(409, 'member_inactive', 'member ' + m.id + ' (' + m.name + ') is inactive. Pick an active member.');
        return { status: 200, body: ctx.db.update('task', id, { assignee_id: m.id }) };
      }
  complete_task:
    method: POST
    path: /tasks/{id}/complete
    description: Mark a task done and set completed_at. A task that is already done is refused with already_done.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('task', id);
        if (t === null) ctx.fail(404, 'not_found', 'task ' + id + ' not found');
        if (t.status === 'done') ctx.fail(409, 'already_done', 'task ' + id + ' is already done.');
        return { status: 200, body: ctx.db.update('task', id, { status: 'done', completed_at: ctx.now() }) };
      }
