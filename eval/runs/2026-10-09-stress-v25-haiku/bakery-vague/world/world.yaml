          status: ready
  place_and_start_sourdough:
    difficulty: hard
    instruction: Customer Noor Haddad wants 2 Sourdough Loaves for pickup on 2030-01-15 at 10:00. Place that order if the bakery has the stock, then start preparing it.
    grader: |-
      (ctx) => {
        const noor = ctx.seed.list('customer', { where: { name: 'Noor Haddad' } })[0];
        const loaves = ctx.seed.list('product', { where: { name: 'Sourdough Loaves' } })[0];
        if (!noor || !loaves) return 0;
        if (ctx.changes().length === 0) return 0;
        const made = ctx.changes().filter((c) => c.entity === 'order' && c.kind === 'created');
        if (made.length !== 1) return 0;
        const id = made[0].id;
        ctx.guardChanges('one new Loaves order for Noor Haddad and the Loaves stock decremented', [
          { entity: 'order', id: id, kind: 'created', fields: ['customer_id', 'product_id', 'quantity', 'total', 'pickup_at', 'status', 'cancelled_at'] },
          { entity: 'order', id: id, kind: 'updated', fields: ['status'] },
          { entity: 'product', id: loaves.id, kind: 'updated', fields: ['stock'] },
        ]);
        const o = ctx.db.get('order', id);
        const endP = ctx.db.get('product', loaves.id);
        const right = o !== null && o.customer_id === noor.id && o.product_id === loaves.id && o.quantity === 2 && o.total === 2 * loaves.price && ctx.time.minutesBetween(o.pickup_at, '2030-01-15T10:00:00.000Z') === 0;
        ctx.goal(0.4, 'order for 2 Loaves to Noor at the pickup time, total right', right);
        ctx.goal(0.2, 'Loaves stock down by 2', endP !== null && endP.stock === loaves.stock - 2);
        ctx.goal(0.4, 'order is preparing', o !== null && o.status === 'preparing');
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const noor = ctx.api('GET', '/customers?q=Noor').body.data.find((x) => x.name === 'Noor Haddad');
        ctx.assert(noor, 'customer Noor Haddad not found');
        const bread = ctx.api('GET', '/products?category=bread').body.data;
        const loaves = bread.find((x) => x.name === 'Sourdough Loaves');
        ctx.assert(loaves, 'Sourdough Loaves not found among bread products');
        ctx.assert(loaves.stock >= 2, 'not enough stock: ' + loaves.stock);
        const placed = ctx.api('POST', '/orders', { customer_id: noor.id, product_id: loaves.id, quantity: 2, pickup_at: '2030-01-15T10:00:00.000Z' });
        ctx.assert(placed.status === 201, 'place failed: ' + JSON.stringify(placed.body));
        const started = ctx.api('POST', '/orders/' + placed.body.id + '/start', {});
        ctx.assert(started.status === 200 && started.body.status === 'preparing', 'start failed: ' + JSON.stringify(started.body));
      }
    decoys:
      - why: places the order on the similar Sourdough Boule product, which has more stock, and starts it
        script: |-
          (ctx) => {
            const noor = ctx.api('GET', '/customers?q=Noor').body.data.find((x) => x.name === 'Noor Haddad');
            const boule = ctx.api('GET', '/products?q=Boule').body.data.find((x) => x.name === 'Sourdough Boule');
            const o = ctx.api('POST', '/orders', { customer_id: noor.id, product_id: boule.id, quantity: 2, pickup_at: '2030-01-15T10:00:00.000Z' });
            ctx.api('POST', '/orders/' + o.body.id + '/start', {});
          }
      - why: places the correct Sourdough Loaves order but never starts preparing it
        script: |-
          (ctx) => {
            const noor = ctx.api('GET', '/customers?q=Noor').body.data.find((x) => x.name === 'Noor Haddad');
            const loaves = ctx.api('GET', '/products?category=bread').body.data.find((x) => x.name === 'Sourdough Loaves');
            ctx.api('POST', '/orders', { customer_id: noor.id, product_id: loaves.id, quantity: 2, pickup_at: '2030-01-15T10:00:00.000Z' });
          }
    alternatives: []
    allows:
      - entity: order
        kind: created
        fields:
          - customer_id
          - product_id
          - quantity
          - total
          - pickup_at
          - status
          - cancelled_at
        where:
          status: preparing
          quantity: 2
      - entity: order
        kind: updated
        fields:
          - status
      - entity: product
        kind: updated
        fields:
          - stock
        where:
          name: Sourdough Loaves
