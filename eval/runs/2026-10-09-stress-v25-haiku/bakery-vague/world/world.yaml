    grader: |-
      (ctx) => {
        const liam = ctx.seed.list('customer', { where: { name: 'Liam Carter' } })[0];
        if (!liam) return 0;
        const target = ctx.seed.list('order', { where: { customer_id: liam.id, status: 'ready' } })[0];
        if (!target) return 0;
        if (ctx.changes().length === 0) return 0;
        ctx.guardChanges('only Liam Carter ready order is marked picked up', [
          { entity: 'order', id: target.id, kind: 'updated', fields: ['status'] },
        ]);
        const end = ctx.db.get('order', target.id);
        ctx.goal(1, 'order picked up', end !== null && end.status === 'picked_up');
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const liam = ctx.api('GET', '/customers?q=Liam').body.data.find((x) => x.name === 'Liam Carter');
        ctx.assert(liam, 'customer Liam Carter not found');
        const ready = ctx.api('GET', '/orders?status=ready').body.data.filter((o) => o.customer_id === liam.id);
        ctx.assert(ready.length === 1, 'expected one ready order for Liam Carter, found ' + ready.length);
        const r = ctx.api('POST', '/orders/' + ready[0].id + '/pickup', {});
        ctx.assert(r.status === 200 && r.body.status === 'picked_up', 'pickup failed: ' + JSON.stringify(r.body));
      }
    decoys:
      - why: marks the oldest ready order in the list as picked up, which belongs to another customer, not Liam Carter
        script: |-
          (ctx) => {
            const first = ctx.api('GET', '/orders?status=ready&sort=created_at').body.data[0];
            ctx.api('POST', '/orders/' + first.id + '/pickup', {});
