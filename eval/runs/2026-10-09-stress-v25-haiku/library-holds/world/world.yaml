format: 1
meta:
  name: world
  description: A public library circulation API. Branches hold book copies of titles. Members borrow copies as checkouts with a due date. A holds queue per title serves waiting members in order when a copy comes back. Overdue checkouts accrue fines that block new loans until paid. The world has four workflows (copy, loan, hold queue, fine settlement), six actions, two jobs, list and get routes for every entity, and a seed with one list page of copies and a few scenarios the tasks need.
  resembles: Library circulation system (Koha-style branches, copies, holds and fines)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  branch:
    description: A library branch that holds copies and is the home branch of members.
    idPrefix: brn
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      code:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 20
      city:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
  title:
    description: A bibliographic title. Copies are physical instances of a title.
    idPrefix: ttl
    fields:
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      author:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
  book_copy:
    description: "One physical copy at a branch. Its status is the copy lifecycle: available, checked_out, on_hold or withdrawn."
    idPrefix: cpy
    fields:
      barcode:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      title_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: title
        onDelete: restrict
      branch_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: branch
        onDelete: restrict
      status:
        type: state
        description: Copy lifecycle. Only actions and jobs move it.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - available
          - checked_out
          - on_hold
          - withdrawn
        initial: available
        transitions:
          available:
            - checked_out
            - withdrawn
          checked_out:
            - available
            - on_hold
          on_hold:
            - checked_out
            - available
          withdrawn: []
  member:
    description: A library patron who borrows copies and places holds.
    idPrefix: mem
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 200
        format: email
      home_branch_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: branch
        onDelete: restrict
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  checkout:
    description: A loan of one copy to one member with a due date. Created only by checkout_copy and closed by return_copy.
    idPrefix: chk
    fields:
      member_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: member
        onDelete: restrict
      copy_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: book_copy
        onDelete: restrict
      checked_out_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
        default: now
      due_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
      returned_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      status:
        type: state
        description: Loan lifecycle. A returned loan stays returned.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - active
          - returned
        initial: active
        transitions:
          active:
            - returned
          returned: []
  hold:
    description: A member's place in the queue for a title. Becomes ready when a copy comes back, names that copy and expires after a window.
    idPrefix: hld
    fields:
      title_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: title
        onDelete: restrict
      member_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: member
        onDelete: restrict
      copy_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: book_copy
        onDelete: restrict
      queued_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: true
        default: now
      ready_until:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      status:
        type: state
        description: Queue lifecycle. A ready hold is fulfilled by checkout, or cancelled by cancel_hold or expiry.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - waiting
          - ready
          - fulfilled
          - cancelled
        initial: waiting
        transitions:
          waiting:
            - ready
            - cancelled
          ready:
            - fulfilled
            - cancelled
          fulfilled: []
          cancelled: []
  fine:
    description: Money a member owes for one overdue checkout. One fine per checkout, amount grows daily until paid.
    idPrefix: fin
    fields:
      member_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: member
        onDelete: restrict
      checkout_id:
        type: ref
        required: true
        nullable: false
        unique: true
        readonly: true
        entity: checkout
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      status:
        type: state
        description: Fine lifecycle. A paid fine cannot be paid again.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - open
          - paid
        initial: open
        transitions:
          open:
            - paid
          paid: []
      paid_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
