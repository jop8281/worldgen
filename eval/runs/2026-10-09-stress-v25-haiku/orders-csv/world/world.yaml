seed:
  customer: "(ctx) => ctx.fixtures.customers.map((r) => ({ name: r.name, email: r.email, country: r.country, plan: r.plan, created_at: r.created_at, updated_at: r.created_at }))"
  order: "(ctx) => ctx.fixtures.orders.map((r) => ({ customer_id: r.customer_id, status: r.status, total_cents: r.total_cents, currency: r.currency, item_count: r.item_count, note: r.note, placed_at: r.placed_at, shipped_at: r.shipped_at, created_at: r.placed_at, updated_at: r.shipped_at !== null ? r.shipped_at : r.placed_at }))"
tests:
  t_pay_ship_deliver:
    description: Create a customer and an order, then pay, ship and deliver it, checking each status.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'QA Buyer One', email: 'qa-pay-ship@example.test', country: 'GB', plan: 'pro' });
        ctx.assert(c.status === 201, 'create customer returned ' + c.status);
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 2500, currency: 'USD', item_count: 2 });
        ctx.assert(o.status === 201 && o.body.status === 'pending', 'new order is pending, got ' + o.status + ' ' + JSON.stringify(o.body));
        const p = ctx.api('POST', '/orders/' + o.body.id + '/pay');
        ctx.assert(p.status === 200 && p.body.status === 'paid', 'pay returned ' + p.status + ' ' + JSON.stringify(p.body));
        const s = ctx.api('POST', '/orders/' + o.body.id + '/ship');
        ctx.assert(s.status === 200 && s.body.status === 'shipped' && s.body.shipped_at !== null, 'ship returned ' + s.status + ' ' + JSON.stringify(s.body));
        const d = ctx.api('POST', '/orders/' + o.body.id + '/deliver');
        ctx.assert(d.status === 200 && d.body.status === 'delivered', 'deliver returned ' + d.status + ' ' + JSON.stringify(d.body));
      }
  t_ship_requires_paid:
    description: Shipping a pending order is refused, and the same order ships after it is paid.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'QA Buyer Two', email: 'qa-ship-gate@example.test', country: 'GB', plan: 'basic' });
        ctx.assert(c.status === 201, 'create customer returned ' + c.status);
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 900, currency: 'USD', item_count: 1 });
        ctx.assert(o.status === 201, 'create order returned ' + o.status);
        const early = ctx.api('POST', '/orders/' + o.body.id + '/ship');
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'ship before pay: ' + early.status + ' ' + JSON.stringify(early.body));
        const p = ctx.api('POST', '/orders/' + o.body.id + '/pay');
        ctx.assert(p.status === 200, 'pay returned ' + p.status);
        const ok = ctx.api('POST', '/orders/' + o.body.id + '/ship');
        ctx.assert(ok.status === 200 && ok.body.status === 'shipped', 'ship after pay returned ' + ok.status + ' ' + JSON.stringify(ok.body));
      }
  t_cancel_only_before_shipping:
    description: A pending order cancels once; a second cancel and a cancel after shipping are both refused.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'QA Buyer Three', email: 'qa-cancel@example.test', country: 'GB', plan: 'pro' });
        ctx.assert(c.status === 201, 'create customer returned ' + c.status);
        const a = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 1200, currency: 'USD', item_count: 1 });
        ctx.assert(a.status === 201, 'create order A returned ' + a.status);
        const cancelled = ctx.api('POST', '/orders/' + a.body.id + '/cancel');
        ctx.assert(cancelled.status === 200 && cancelled.body.status === 'cancelled', 'cancel pending returned ' + cancelled.status + ' ' + JSON.stringify(cancelled.body));
        const again = ctx.api('POST', '/orders/' + a.body.id + '/cancel');
        ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second cancel: ' + again.status + ' ' + JSON.stringify(again.body));
        const b = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 1200, currency: 'USD', item_count: 1 });
        ctx.assert(b.status === 201, 'create order B returned ' + b.status);
        ctx.assert(ctx.api('POST', '/orders/' + b.body.id + '/pay').status === 200, 'pay B');
        ctx.assert(ctx.api('POST', '/orders/' + b.body.id + '/ship').status === 200, 'ship B');
        const late = ctx.api('POST', '/orders/' + b.body.id + '/cancel');
        ctx.assert(late.status === 409 && late.body.error.code === 'invalid_state', 'cancel after shipping: ' + late.status + ' ' + JSON.stringify(late.body));
        const still = ctx.api('GET', '/orders/' + b.body.id);
        ctx.assert(still.body.status === 'shipped', 'shipped order kept its status, got ' + still.body.status);
      }
  t_refund_only_after_payment:
    description: Refunding a pending order is refused, a paid order refunds once, and a refunded order cannot be cancelled.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'QA Buyer Four', email: 'qa-refund@example.test', country: 'GB', plan: 'standard' });
        ctx.assert(c.status === 201, 'create customer returned ' + c.status);
        const o = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 3300, currency: 'USD', item_count: 3 });
        ctx.assert(o.status === 201, 'create order returned ' + o.status);
        const early = ctx.api('POST', '/orders/' + o.body.id + '/refund');
        ctx.assert(early.status === 409 && early.body.error.code === 'invalid_state', 'refund pending: ' + early.status + ' ' + JSON.stringify(early.body));
        ctx.assert(ctx.api('POST', '/orders/' + o.body.id + '/pay').status === 200, 'pay');
        const r = ctx.api('POST', '/orders/' + o.body.id + '/refund');
        ctx.assert(r.status === 200 && r.body.status === 'refunded', 'refund paid returned ' + r.status + ' ' + JSON.stringify(r.body));
        const twice = ctx.api('POST', '/orders/' + o.body.id + '/refund');
        ctx.assert(twice.status === 409 && twice.body.error.code === 'invalid_state', 'refund twice: ' + twice.status);
        const cancel = ctx.api('POST', '/orders/' + o.body.id + '/cancel');
        ctx.assert(cancel.status === 409 && cancel.body.error.code === 'invalid_state', 'cancel refunded: ' + cancel.status);
      }
  t_customer_orders_listed:
    description: Two orders for a new customer; paying one lets the status-filtered list return only it, while the unfiltered list returns both.
    script: |-
      (ctx) => {
        const c = ctx.api('POST', '/customers', { name: 'QA Buyer Five', email: 'qa-list@example.test', country: 'GB', plan: 'pro' });
        ctx.assert(c.status === 201, 'create customer returned ' + c.status);
        const o1 = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 700, currency: 'USD', item_count: 1 });
        const o2 = ctx.api('POST', '/orders', { customer_id: c.body.id, total_cents: 800, currency: 'USD', item_count: 1 });
        ctx.assert(o1.status === 201 && o2.status === 201, 'create orders');
        ctx.assert(ctx.api('POST', '/orders/' + o1.body.id + '/pay').status === 200, 'pay o1');
        const paid = ctx.api('GET', '/customers/' + c.body.id + '/orders?status=paid');
        ctx.assert(paid.status === 200 && paid.body.data.length === 1 && paid.body.data[0].id === o1.body.id, 'paid filter: ' + JSON.stringify(paid.body));
        const all = ctx.api('GET', '/orders?customer_id=' + c.body.id);
        ctx.assert(all.status === 200 && all.body.data.length === 2, 'unfiltered list returns both orders, got ' + JSON.stringify(all.body));
      }
tasks:
  ship_latest_paid_order:
    difficulty: easy
    instruction: Ship the most recently placed paid order of the customer Ada Lovelace, and change nothing else.
    grader: "(ctx) => { const ada = ctx.seed.list('customer', { where: { name: 'Ada Lovelace' } })[0]; if (!ada) return 0; let target = null; for (const o of ctx.seed.list('order', { where: { customer_id: ada.id, status: 'paid' } })) { if (target === null || ctx.time.minutesBetween(target.placed_at, o.placed_at) > 0) target = o; } if (target === null) return 0; ctx.guardChanges('only the shipped order changed, in status and shipped_at', [{ entity: 'order', id: target.id, kind: 'updated', fields: ['status', 'shipped_at'] }]); const end = ctx.db.get('order', target.id); ctx.goal(1, 'the most recent paid order of Ada Lovelace is shipped', end.status === 'shipped' && end.shipped_at !== null); return ctx.score(); }"
    solution: "(ctx) => { const ada = ctx.api('GET', '/customers?q=Ada').body.data.find((c) => c.name === 'Ada Lovelace'); ctx.assert(ada, 'customer Ada Lovelace not found'); const orders = ctx.api('GET', '/orders?customer_id=' + ada.id + '&sort=-placed_at').body.data; const paid = orders.find((o) => o.status === 'paid'); ctx.assert(paid, 'no paid order for Ada Lovelace'); const r = ctx.api('POST', '/orders/' + paid.id + '/ship'); ctx.assert(r.status === 200, 'ship failed: ' + JSON.stringify(r.body)); }"
    decoys: []
    alternatives: []
    allows:
      - entity: order
        kind: updated
        fields:
          - status
          - shipped_at
        where:
          customer_id: cus_0001
          status: paid
  refund_damaged_delivery:
    difficulty: medium
    instruction: Frances Allen reports that a delivered order arrived damaged. Refund her most recently placed delivered order and change nothing else. The refund is final, so check that the order is delivered before you refund it.
    grader: "(ctx) => { const frances = ctx.seed.list('customer', { where: { name: 'Frances Allen' } })[0]; if (!frances) return 0; let target = null; for (const o of ctx.seed.list('order', { where: { customer_id: frances.id, status: 'delivered' } })) { if (target === null || ctx.time.minutesBetween(target.placed_at, o.placed_at) > 0) target = o; } if (target === null) return 0; ctx.guardChanges('only the refunded order changed, in status', [{ entity: 'order', id: target.id, kind: 'updated', fields: ['status'] }]); const end = ctx.db.get('order', target.id); const trace = ctx.trace(); const refundAt = trace.findIndex((c) => c.method === 'POST' && c.path === '/orders/' + target.id + '/refund'); const looked = refundAt > 0 && trace.slice(0, refundAt).some((c) => c.method === 'GET' && c.status === 200 && c.path.startsWith('/orders')); ctx.goal(0.7, 'the most recent delivered order of Frances Allen is refunded', end.status === 'refunded'); ctx.goal(0.3, 'the order was looked up before it was refunded', looked); return ctx.score(); }"
    solution: "(ctx) => { const c = ctx.api('GET', '/customers?q=Frances').body.data.find((x) => x.name === 'Frances Allen'); ctx.assert(c, 'customer Frances Allen not found'); const delivered = ctx.api('GET', '/orders?customer_id=' + c.id + '&status=delivered&sort=-placed_at').body.data; ctx.assert(delivered.length > 0, 'no delivered orders for Frances Allen'); const target = delivered[0]; ctx.assert(target.status === 'delivered', 'order is not delivered'); const r = ctx.api('POST', '/orders/' + target.id + '/refund'); ctx.assert(r.status === 200, 'refund failed: ' + JSON.stringify(r.body)); }"
    decoys:
      - why: refunds the oldest delivered order instead of the most recent one, and also cancels her paid order as collateral
        script: (ctx) => { const c = ctx.api('GET', '/customers?q=Frances').body.data.find((x) => x.name === 'Frances Allen'); const delivered = ctx.api('GET', '/orders?customer_id=' + c.id + '&status=delivered&sort=placed_at').body.data; ctx.api('POST', '/orders/' + delivered[0].id + '/refund'); const paid = ctx.api('GET', '/orders?customer_id=' + c.id + '&status=paid').body.data; ctx.api('POST', '/orders/' + paid[0].id + '/cancel'); }
      - why: refunds the right order by its id, typed from memory, without looking up the customer's orders first, so the delivered check is never made
        script: (ctx) => { ctx.api('POST', '/orders/ord_0032/refund'); }
    alternatives: []
    allows:
      - entity: order
        kind: updated
        fields:
          - status
        where:
          customer_id: cus_0007
          status: delivered
  pay_and_ship_early_pending:
    difficulty: hard
    instruction: Every pending order placed before 1 March 2026 has already been paid for by its customer, but the system still shows it as pending. Mark each such order as paid, then ship it. Change nothing else.
    grader: "(ctx) => { const cut = '2026-03-01T00:00:00.000Z'; const targets = ctx.seed.list('order', { where: { status: 'pending' } }).filter((o) => ctx.time.minutesBetween(o.placed_at, cut) > 0); if (targets.length === 0) return 0; ctx.guardChanges('only the early pending orders changed, in status and shipped_at', targets.map((o) => ({ entity: 'order', id: o.id, kind: 'updated', fields: ['status', 'shipped_at'] }))); for (const o of targets) { const end = ctx.db.get('order', o.id); ctx.goal(0.5 / targets.length, 'order ' + o.id + ' is paid', end.status === 'paid' || end.status === 'shipped'); ctx.goal(0.5 / targets.length, 'order ' + o.id + ' is shipped', end.status === 'shipped' && end.shipped_at !== null); } return ctx.score(); }"
    solution: "(ctx) => { const delivered = ctx.api('GET', '/orders?status=delivered'); ctx.assert(delivered.status === 200, 'delivered list failed'); const rows = []; let cursor = null; do { const r = ctx.api('GET', '/orders?sort=-placed_at&limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); ctx.assert(r.status === 200, 'order list failed: ' + JSON.stringify(r.body)); rows.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); const targets = rows.filter((o) => o.status === 'pending' && o.placed_at < '2026-03-01T00:00:00.000Z'); ctx.assert(targets.length > 0, 'no pending orders placed before 1 March 2026'); for (const o of targets) { const p = ctx.api('POST', '/orders/' + o.id + '/pay'); ctx.assert(p.status === 200, 'pay ' + o.id + ' failed: ' + JSON.stringify(p.body)); const s = ctx.api('POST', '/orders/' + o.id + '/ship'); ctx.assert(s.status === 200, 'ship ' + o.id + ' failed: ' + JSON.stringify(s.body)); } }"
    decoys:
      - why: reads only the first two pages of orders, newest first, so it pays and ships the early pending order on page two and misses the early pending orders on page three
        script: "(ctx) => { const seen = []; let cursor = null; for (let page = 0; page < 2; page++) { const r = ctx.api('GET', '/orders?sort=-placed_at&limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); seen.push(...r.body.data); cursor = r.body.next_cursor; if (cursor === null) break; } for (const o of seen) { if (o.status === 'pending' && o.placed_at < '2026-03-01T00:00:00.000Z') { ctx.api('POST', '/orders/' + o.id + '/pay'); ctx.api('POST', '/orders/' + o.id + '/ship'); } } }"
      - why: pays every early pending order across all three pages but never ships them, so the payments land and the shipments do not
        script: "(ctx) => { let cursor = null; const rows = []; do { const r = ctx.api('GET', '/orders?sort=-placed_at&limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); rows.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); for (const o of rows) { if (o.status === 'pending' && o.placed_at < '2026-03-01T00:00:00.000Z') ctx.api('POST', '/orders/' + o.id + '/pay'); } }"
      - why: pays and ships every pending order on all pages, ignoring the 1 March 2026 cut-off, so it changes orders the instruction does not name
        script: "(ctx) => { let cursor = null; const rows = []; do { const r = ctx.api('GET', '/orders?sort=-placed_at&limit=25' + (cursor === null ? '' : '&cursor=' + cursor)); rows.push(...r.body.data); cursor = r.body.next_cursor; } while (cursor !== null); for (const o of rows) { if (o.status === 'pending') { ctx.api('POST', '/orders/' + o.id + '/pay'); ctx.api('POST', '/orders/' + o.id + '/ship'); } } }"
    alternatives: []
    allows:
      - entity: order
        kind: updated
        fields:
          - status
          - shipped_at
        where:
          status: pending
