format: 1
meta:
  name: world
  description: "An orders API where agents read customers and orders, and move orders through a fixed fulfilment lifecycle (pending, paid, shipped, delivered, with cancelled and refunded as end states). Core value is stateful order records changed through actions, so the world is feasible. Both CSV tables are imported exactly: 18 customers and 72 orders. Only the five order actions and the standard CRUD and list routes are built."
  resembles: Shopify-style order management API (orders and customers)
  source: worldgen
  seed: 0
  clock:
    start: 2026-04-08T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A buyer who places orders. Imported from the customers CSV table, 18 rows, ids kept as in the CSV.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      country:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 2
        pattern: ^[A-Z]{2}$
      plan:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - free
          - basic
          - standard
          - pro
          - team
  order:
    description: A purchase by one customer. status is a state field moved only by the workflow actions (pay_order, ship_order, deliver_order, cancel_order, refund_order).
    idPrefix: ord
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      status:
        type: state
        description: Order lifecycle. Only the five order actions move it; create and PATCH refuse it.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - paid
          - shipped
          - delivered
          - cancelled
          - refunded
        initial: pending
        transitions:
          pending:
            - paid
            - cancelled
          paid:
            - shipped
            - cancelled
            - refunded
          shipped:
            - delivered
            - refunded
          delivered:
            - refunded
          cancelled: []
          refunded: []
      total_cents:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      currency:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - USD
        default: USD
      item_count:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      placed_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
        default: now
      shipped_at:
        type: datetime
        description: Set by ship_order to engine time.
        required: false
        nullable: true
        unique: false
        readonly: true
routes:
  list_orders:
    op: list
    entity: order
    filters:
      - status
      - customer_id
    search: []
    sort:
      - placed_at
      - total_cents
    pageSize: 25
    method: GET
    path: /orders
    description: List orders, filter by status and customer_id, sort by placed_at or total_cents.
  get_order:
    op: get
    entity: order
    method: GET
    path: /orders/{id}
    description: Read one order.
  create_order:
    op: create
    entity: order
    method: POST
    path: /orders
    description: Place a new order for an existing customer. It starts in pending.
  update_order:
    op: update
    entity: order
    method: PATCH
    path: /orders/{id}
    description: Edit order details such as note and item_count. status is readonly here.
  list_customer_orders:
    op: list
    entity: order
    filters:
      - status
    search: []
    sort:
      - placed_at
    pageSize: 25
    method: GET
    path: /customers/{customer_id}/orders
    description: List one customer's orders, filter by status.
  list_customers:
    op: list
    entity: customer
    filters:
      - plan
      - country
    search:
      - name
      - email
    sort:
      - name
    pageSize: 25
    method: GET
    path: /customers
    description: List customers, filter by plan and country, search name and email, sort by name.
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /customers/{id}
    description: Read one customer.
  create_customer:
    op: create
    entity: customer
    method: POST
    path: /customers
    description: Create a customer with a unique email.
  update_customer:
    op: update
    entity: customer
    method: PATCH
    path: /customers/{id}
    description: Edit a customer's details.
actions:
  pay_order:
    method: POST
    path: /orders/{id}/pay
    description: Mark a pending order as paid.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only pending orders can be paid.');
        const updated = ctx.db.update('order', id, { status: 'paid' });
        return { status: 200, body: updated };
      }
  ship_order:
    method: POST
    path: /orders/{id}/ship
    description: Ship a paid order. Sets status to shipped and shipped_at to engine time.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only paid orders can be shipped.');
        const updated = ctx.db.update('order', id, { status: 'shipped', shipped_at: ctx.now() });
        return { status: 200, body: updated };
      }
  deliver_order:
    method: POST
    path: /orders/{id}/deliver
    description: Mark a shipped order as delivered.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'shipped') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only shipped orders can be delivered.');
        const updated = ctx.db.update('order', id, { status: 'delivered' });
        return { status: 200, body: updated };
      }
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a pending or paid order. Shipped, delivered, cancelled and refunded orders are refused.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'pending' && o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only pending or paid orders can be cancelled.');
        const updated = ctx.db.update('order', id, { status: 'cancelled' });
        return { status: 200, body: updated };
      }
  refund_order:
    method: POST
    path: /orders/{id}/refund
    description: Full refund of a paid, shipped or delivered order. Refunded and cancelled orders are final.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'paid' && o.status !== 'shipped' && o.status !== 'delivered') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only paid, shipped or delivered orders can be refunded.');
        const updated = ctx.db.update('order', id, { status: 'refunded' });
        return { status: 200, body: updated };
      }
jobs: {}
