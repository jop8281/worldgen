format: 1
meta:
  name: world
  description: A clinic scheduling API. Doctors publish bookable time slots, patients book a slot (no double booking), cancel up to 24 hours before the visit, and staff record no-shows and completed visits. The core value is stateful records (slots and appointments) that an agent reads and changes through actions, so the request is feasible.
  resembles: Acuity Scheduling-style clinic appointments API
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T08:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  doctor:
    description: A clinician who offers bookable slots. specialty is a fixed enum of four values.
    idPrefix: doc
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      specialty:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - general
          - cardiology
          - pediatrics
          - dermatology
      active:
        type: bool
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  patient:
    description: A person who books visits. no_show_count is kept by mark_no_show and cannot be set by clients.
    idPrefix: pat
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: false
        nullable: true
        unique: true
        readonly: false
        format: email
      no_show_count:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
  slot:
    description: A bookable time window with one doctor. status is open or booked and moves only through the booking actions.
    idPrefix: slot
    fields:
      doctor_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: doctor
        onDelete: restrict
      starts_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      ends_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - open
          - booked
        initial: open
        transitions:
          open:
            - booked
          booked:
            - open
  appointment:
    description: A patient's booking of one slot, with its outcome. status moves only through the appointment actions, and cancelled, no_show and completed are final.
    idPrefix: apt
    fields:
      patient_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: patient
        onDelete: restrict
      slot_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: slot
        onDelete: restrict
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - booked
          - cancelled
          - no_show
          - completed
        initial: booked
        transitions:
          booked:
            - cancelled
            - no_show
            - completed
          cancelled: []
          no_show: []
          completed: []
      cancelled_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
routes:
  list_doctors:
    op: list
    entity: doctor
    filters:
      - specialty
      - active
    search:
      - name
    sort: []
    pageSize: 25
    method: GET
    path: /doctors
    description: List doctors, filter by specialty and active, search by name.
  get_doctor:
    op: get
    entity: doctor
    method: GET
    path: /doctors/{id}
    description: Read one doctor.
  create_doctor:
    op: create
    entity: doctor
    method: POST
    path: /doctors
    description: Add a doctor.
  list_patients:
    op: list
    entity: patient
    filters: []
    search:
      - name
      - email
    sort: []
    pageSize: 25
    method: GET
    path: /patients
    description: List patients, search by name and email.
  get_patient:
    op: get
    entity: patient
    method: GET
    path: /patients/{id}
    description: Read one patient, including no_show_count.
  create_patient:
    op: create
    entity: patient
    method: POST
    path: /patients
    description: Register a patient.
  list_slots:
    op: list
    entity: slot
    filters:
      - doctor_id
      - status
    search: []
    sort:
      - starts_at
    pageSize: 25
    method: GET
    path: /slots
    description: List slots, filter by doctor_id and status, sort by starts_at.
  get_slot:
    op: get
    entity: slot
    method: GET
    path: /slots/{id}
    description: Read one slot.
  create_slot:
    op: create
    entity: slot
    method: POST
    path: /slots
    description: Publish a bookable slot for a doctor.
  list_appointments:
    op: list
    entity: appointment
    filters:
      - status
      - patient_id
      - slot_id
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /appointments
    description: List appointments, filter by status, patient_id and slot_id.
  get_appointment:
    op: get
    entity: appointment
    method: GET
    path: /appointments/{id}
    description: Read one appointment.
actions:
  book_appointment:
    method: POST
    path: /appointments
    description: Book a slot for a patient. Refuses a slot that has already started (409 slot_in_past) and a slot already held by a booking (409 slot_taken). A slot starting exactly now can be booked. Marks the slot booked.
    input:
      patient_id:
        type: ref
        description: The patient who books the visit.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: patient
        onDelete: restrict
      slot_id:
        type: ref
        description: The slot to book. Must be open.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: slot
        onDelete: restrict
    handler: "(ctx) => { const patient = ctx.db.get('patient', ctx.body.patient_id); if (patient === null) ctx.fail(422, 'ref.unresolved', 'patient ' + ctx.body.patient_id + ' not found'); const slot = ctx.db.get('slot', ctx.body.slot_id); if (slot === null) ctx.fail(422, 'ref.unresolved', 'slot ' + ctx.body.slot_id + ' not found'); const now = ctx.now(); if (ctx.time.minutesBetween(slot.starts_at, now) > 0) ctx.fail(409, 'slot_in_past', 'slot ' + slot.id + ' started at ' + slot.starts_at + ' and cannot be booked'); if (slot.status === 'booked') ctx.fail(409, 'slot_taken', 'slot ' + slot.id + ' is already booked'); const appt = ctx.db.create('appointment', { patient_id: patient.id, slot_id: slot.id }); ctx.db.update('slot', slot.id, { status: 'booked' }); return { status: 201, body: appt }; }"
  cancel_appointment:
    method: POST
    path: /appointments/{id}/cancel
    description: Cancel a booked appointment whose slot starts at least 24 hours from now (409 cancel_too_late otherwise). Sets cancelled_at and reopens the slot. Only booked appointments can be cancelled (409 invalid_state).
    input: {}
    handler: "(ctx) => { const appt = ctx.db.get('appointment', ctx.params.id); if (appt === null) ctx.fail(404, 'row.not_found', 'appointment ' + ctx.params.id + ' not found'); if (appt.status !== 'booked') ctx.fail(409, 'invalid_state', 'appointment ' + appt.id + ' is ' + appt.status + '. Only booked appointments can be cancelled.'); const slot = ctx.db.get('slot', appt.slot_id); const now = ctx.now(); if (ctx.time.minutesBetween(now, slot.starts_at) < 1440) ctx.fail(409, 'cancel_too_late', 'visit at ' + slot.starts_at + ' starts less than 24 hours from now and cannot be cancelled'); const updated = ctx.db.update('appointment', appt.id, { status: 'cancelled', cancelled_at: now }); ctx.db.update('slot', slot.id, { status: 'open' }); return { status: 200, body: updated }; }"
  mark_no_show:
    method: POST
    path: /appointments/{id}/no-show
    description: Record that a booked patient did not attend. Refuses a visit that has not started (409 visit_not_started). Adds one to the patient's no_show_count. The slot stays booked. Only booked appointments can be marked (409 invalid_state).
    input: {}
    handler: "(ctx) => { const appt = ctx.db.get('appointment', ctx.params.id); if (appt === null) ctx.fail(404, 'row.not_found', 'appointment ' + ctx.params.id + ' not found'); if (appt.status !== 'booked') ctx.fail(409, 'invalid_state', 'appointment ' + appt.id + ' is ' + appt.status + '. Only booked appointments can be marked no-show.'); const slot = ctx.db.get('slot', appt.slot_id); const now = ctx.now(); if (ctx.time.minutesBetween(now, slot.starts_at) > 0) ctx.fail(409, 'visit_not_started', 'visit at ' + slot.starts_at + ' has not started, so it cannot be marked no-show'); const patient = ctx.db.get('patient', appt.patient_id); ctx.db.update('patient', patient.id, { no_show_count: patient.no_show_count + 1 }); const updated = ctx.db.update('appointment', appt.id, { status: 'no_show' }); return { status: 200, body: updated }; }"
  complete_appointment:
    method: POST
    path: /appointments/{id}/complete
    description: Mark a booked visit as completed. Refuses a visit that has not started (409 visit_not_started). Only booked appointments can be completed (409 invalid_state).
    input: {}
    handler: "(ctx) => { const appt = ctx.db.get('appointment', ctx.params.id); if (appt === null) ctx.fail(404, 'row.not_found', 'appointment ' + ctx.params.id + ' not found'); if (appt.status !== 'booked') ctx.fail(409, 'invalid_state', 'appointment ' + appt.id + ' is ' + appt.status + '. Only booked appointments can be completed.'); const slot = ctx.db.get('slot', appt.slot_id); const now = ctx.now(); if (ctx.time.minutesBetween(now, slot.starts_at) > 0) ctx.fail(409, 'visit_not_started', 'visit at ' + slot.starts_at + ' has not started, so it cannot be completed'); const updated = ctx.db.update('appointment', appt.id, { status: 'completed' }); return { status: 200, body: updated }; }"
