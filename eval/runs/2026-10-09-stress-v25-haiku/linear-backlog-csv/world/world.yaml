format: 1
meta:
  name: world
  description: "A Linear-style issue tracker seeded from the 123-row linear_backlog CSV. Agents read issues, create and update them, comment on them, and move them through a status machine (backlog, in_progress, in_review, done, canceled, duplicate) with actions that guard each transition. Feasible: the core value is stateful issue records changed through an API, not computation."
  resembles: Linear issue tracker API (issues and comments), as in the imported WorldGen backlog
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  issue:
    description: A tracked work item, seeded from the linear_backlog rows. Status is a workflow state that changes only through the workflow actions.
    idPrefix: iss
    fields:
      identifier:
        type: string
        description: Human issue key such as YOS-12.
        required: true
        nullable: false
        unique: true
        readonly: false
        pattern: ^[A-Z]+-[0-9]+$
      title:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      priority:
        type: enum
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - Urgent
          - High
          - Medium
          - Low
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - backlog
          - in_progress
          - in_review
          - done
          - canceled
          - duplicate
        initial: backlog
        transitions:
          backlog:
            - in_progress
            - canceled
            - duplicate
          in_progress:
            - in_review
            - done
            - canceled
            - duplicate
          in_review:
            - done
            - canceled
          done: []
          canceled: []
          duplicate:
            - backlog
      project:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
      milestone:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
      labels:
        type: string
        description: Semicolon-joined label names.
        required: false
        nullable: true
        unique: false
        readonly: false
      parent:
        type: string
        description: Identifier of the parent issue, such as YOS-91.
        required: false
        nullable: true
        unique: false
        readonly: false
      completed_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      source_created_at:
        type: datetime
        description: Creation time of the issue in the source backlog.
        required: false
        nullable: false
        unique: false
        readonly: false
        default: now
      source_updated_at:
        type: datetime
        description: Last update time of the issue in the source backlog.
        required: false
        nullable: false
        unique: false
        readonly: false
        default: now
  comment:
    description: A comment on an issue, created by agents through the API.
    idPrefix: cmt
    fields:
      issue_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: issue
        onDelete: restrict
      body:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
      author:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
routes:
  list_issues:
    op: list
    entity: issue
    filters:
      - identifier
      - status
      - priority
      - project
      - milestone
      - parent
    search:
      - title
    sort: []
    pageSize: 25
    method: GET
    path: /issues
    description: Page through issues; filter by status, priority, identifier, project, milestone, parent; search titles.
  get_issue:
    op: get
    entity: issue
    method: GET
    path: /issues/{id}
    description: Read one issue.
  create_issue:
    op: create
    entity: issue
    method: POST
    path: /issues
    description: Open a new issue in backlog.
  update_issue:
    op: update
    entity: issue
    method: PATCH
    path: /issues/{id}
    description: Change title, priority, project, milestone, labels or parent. Status is refused.
  list_comments:
    op: list
    entity: comment
    filters:
      - issue_id
    search: []
    sort: []
    pageSize: 25
    method: GET
    path: /comments
    description: List comments filtered by issue_id.
  create_comment:
    op: create
    entity: comment
    method: POST
    path: /issues/{issue_id}/comments
    description: Comment on an existing issue.
actions:
  start_issue:
    method: POST
    path: /issues/{id}/start
    description: Start a backlog issue, moving it to in_progress. Any other status answers 409.
    input: {}
    handler: |-
      (ctx) => {
      const issue = ctx.db.get('issue', ctx.params.id);
      if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
      if (issue.status !== 'backlog') ctx.fail(409, 'invalid_state', 'issue ' + issue.identifier + ' is ' + issue.status + '. Only backlog issues can be started.');
      return { status: 200, body: ctx.db.update('issue', issue.id, { status: 'in_progress' }) };
      }
  request_review:
    method: POST
    path: /issues/{id}/review
    description: Request review of an in_progress issue, moving it to in_review. Any other status answers 409.
    input: {}
    handler: |-
      (ctx) => {
      const issue = ctx.db.get('issue', ctx.params.id);
      if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
      if (issue.status !== 'in_progress') ctx.fail(409, 'invalid_state', 'issue ' + issue.identifier + ' is ' + issue.status + '. Only in_progress issues can go to review.');
      return { status: 200, body: ctx.db.update('issue', issue.id, { status: 'in_review' }) };
      }
  complete_issue:
    method: POST
    path: /issues/{id}/complete
    description: Complete an in_progress or in_review issue, moving it to done and setting completed_at. Any other status answers 409.
    input: {}
    handler: |-
      (ctx) => {
      const issue = ctx.db.get('issue', ctx.params.id);
      if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
      if (issue.status !== 'in_progress' && issue.status !== 'in_review') ctx.fail(409, 'invalid_state', 'issue ' + issue.identifier + ' is ' + issue.status + '. Only in_progress or in_review issues can be completed.');
      return { status: 200, body: ctx.db.update('issue', issue.id, { status: 'done', completed_at: ctx.now() }) };
      }
  cancel_issue:
    method: POST
    path: /issues/{id}/cancel
    description: Cancel a backlog, in_progress or in_review issue. canceled is terminal; any other status answers 409.
    input: {}
    handler: |-
      (ctx) => {
      const issue = ctx.db.get('issue', ctx.params.id);
      if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
      if (issue.status !== 'backlog' && issue.status !== 'in_progress' && issue.status !== 'in_review') ctx.fail(409, 'invalid_state', 'issue ' + issue.identifier + ' is ' + issue.status + '. Only backlog, in_progress or in_review issues can be canceled.');
      return { status: 200, body: ctx.db.update('issue', issue.id, { status: 'canceled' }) };
      }
  mark_duplicate:
    method: POST
    path: /issues/{id}/duplicate
    description: Mark a backlog or in_progress issue as a duplicate of an existing issue named by its identifier. An unknown target answers 404.
    input:
      duplicate_of:
        type: string
        description: Identifier of the canonical issue, such as YOS-12.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
      const issue = ctx.db.get('issue', ctx.params.id);
      if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
      const targets = ctx.db.list('issue', { where: { identifier: ctx.body.duplicate_of } });
      if (targets.length === 0) ctx.fail(404, 'not_found', 'issue ' + ctx.body.duplicate_of + ' not found');
      if (targets[0].id === issue.id) ctx.fail(400, 'input.invalid', 'an issue cannot duplicate itself');
      if (issue.status !== 'backlog' && issue.status !== 'in_progress') ctx.fail(409, 'invalid_state', 'issue ' + issue.identifier + ' is ' + issue.status + '. Only backlog or in_progress issues can be marked duplicate.');
      return { status: 200, body: ctx.db.update('issue', issue.id, { status: 'duplicate' }) };
      }
  reopen_issue:
    method: POST
    path: /issues/{id}/reopen
    description: Reopen a duplicate issue to backlog. A canceled or done issue answers 409.
    input: {}
    handler: |-
      (ctx) => {
      const issue = ctx.db.get('issue', ctx.params.id);
      if (issue === null) ctx.fail(404, 'not_found', 'issue ' + ctx.params.id + ' not found');
      if (issue.status !== 'duplicate') ctx.fail(409, 'invalid_state', 'issue ' + issue.identifier + ' is ' + issue.status + '. Only duplicate issues can be reopened.');
      return { status: 200, body: ctx.db.update('issue', issue.id, { status: 'backlog' }) };
      }
