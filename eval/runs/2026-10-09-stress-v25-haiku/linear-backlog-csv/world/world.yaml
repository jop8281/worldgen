  request_review_then_complete:
    difficulty: hard
    instruction: 'The issue titled "Live smoke: thin WorldGen slice on one description with the real model" is in progress. Its engineer asks for review, and then the reviewer completes it. Make both calls in that order so the issue ends up done.'
    grader: "(ctx) => { const o = ctx.seed.list('issue', { where: { identifier: 'YOS-36' } })[0]; if (!o) return 0; ctx.guardChanges('only the target issue changes status and completed_at', [{ entity: 'issue', id: o.id, kind: 'updated', fields: ['status', 'completed_at'] }]); const trace = ctx.trace(); const reviewIdx = trace.findIndex((t) => t.routeId === 'request_review' && t.path === '/issues/' + o.id + '/review'); const completeIdx = trace.findIndex((t) => t.routeId === 'complete_issue' && t.path === '/issues/' + o.id + '/complete'); ctx.guard('review is requested before the issue completes', completeIdx < 0 || (reviewIdx >= 0 && completeIdx > reviewIdx)); const end = ctx.db.get('issue', o.id); ctx.goal(0.4, 'the issue was sent to review', reviewIdx >= 0); ctx.goal(0.6, 'the issue is done after review, with completed_at set', end.status === 'done' && end.completed_at !== null && completeIdx > reviewIdx); return ctx.score(); }"
    solution: "(ctx) => { const TITLE = 'Live smoke: thin WorldGen slice on one description with the real model'; let cursor = null; let found = null; let pages = 0; do { const path = '/issues?limit=25' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''); const page = ctx.api('GET', path); ctx.assert(page.status === 200, 'list failed: ' + JSON.stringify(page.body)); pages += 1; found = page.body.data.find((i) => i.title === TITLE) || null; cursor = page.body.next_cursor; } while (found === null && cursor); ctx.assert(found !== null, 'the issue was not found in any page'); ctx.assert(pages > 1, 'the issue should sit past the first page'); const other = ctx.api('GET', '/issues?status=in_review&limit=25'); ctx.assert(other.status === 200, 'filtered list failed'); const r1 = ctx.api('POST', '/issues/' + found.id + '/review'); ctx.assert(r1.status === 200 && r1.body.status === 'in_review', 'review failed: ' + JSON.stringify(r1.body)); const r2 = ctx.api('POST', '/issues/' + found.id + '/complete'); ctx.assert(r2.status === 200 && r2.body.status === 'done' && r2.body.completed_at != null, 'complete failed: ' + JSON.stringify(r2.body)); }"
