        script: "(ctx) => { const TITLE = 'Live smoke: thin WorldGen slice on one description with the real model'; let cursor = null; let found = null; do { const path = '/issues?limit=25' + (cursor ? '&cursor=' + encodeURIComponent(cursor) : ''); const page = ctx.api('GET', path); found = page.body.data.find((i) => i.title === TITLE) || null; cursor = page.body.next_cursor; } while (found === null && cursor); ctx.api('POST', '/issues/' + found.id + '/complete'); }"
