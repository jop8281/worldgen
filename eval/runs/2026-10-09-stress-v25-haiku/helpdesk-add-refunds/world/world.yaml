actions:
  assign_ticket:
    method: POST
    path: /tickets/{id}/assign
    description: Assign a ticket to an agent. The agent must exist, or the call answers 422 ref.unresolved. A resolved ticket answers 409 invalid_state.
    input:
      agent_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
       const t = ctx.db.get('ticket', ctx.params.id);
       if (t === null) ctx.fail(404, 'not_found', 'ticket ' + ctx.params.id + ' not found');
       if (t.status === 'resolved') ctx.fail(409, 'invalid_state', 'ticket ' + t.id + ' is resolved and cannot be assigned');
       const a = ctx.db.get('agent', ctx.body.agent_id);
       if (a === null) ctx.fail(422, 'ref.unresolved', 'agent ' + ctx.body.agent_id + ' not found');
       return { status: 200, body: ctx.db.update('ticket', t.id, { assignee_id: a.id }) };
      }
  reply_to_ticket:
    method: POST
    path: /tickets/{id}/reply
    description: An agent replies on a ticket. Stores an agent comment. An open ticket moves to pending. A resolved ticket answers 409 invalid_state.
    input:
      agent_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      message:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
       const t = ctx.db.get('ticket', ctx.params.id);
       if (t === null) ctx.fail(404, 'not_found', 'ticket ' + ctx.params.id + ' not found');
       if (t.status === 'resolved') ctx.fail(409, 'invalid_state', 'ticket ' + t.id + ' is resolved and takes no replies');
       const a = ctx.db.get('agent', ctx.body.agent_id);
       if (a === null) ctx.fail(422, 'ref.unresolved', 'agent ' + ctx.body.agent_id + ' not found');
       ctx.db.create('comment', { ticket_id: t.id, author_kind: 'agent', agent_id: a.id, body: ctx.body.message });
       if (t.status === 'open') ctx.db.update('ticket', t.id, { status: 'pending' });
       return { status: 200, body: ctx.db.get('ticket', t.id) };
      }
  customer_reply:
    method: POST
    path: /tickets/{id}/customer_reply
    description: The customer replies on a ticket. Stores a customer comment. A pending ticket moves back to open. A resolved ticket answers 409 invalid_state.
    input:
      message:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
       const t = ctx.db.get('ticket', ctx.params.id);
       if (t === null) ctx.fail(404, 'not_found', 'ticket ' + ctx.params.id + ' not found');
       if (t.status === 'resolved') ctx.fail(409, 'invalid_state', 'ticket ' + t.id + ' is resolved and takes no replies');
       ctx.db.create('comment', { ticket_id: t.id, author_kind: 'customer', agent_id: null, body: ctx.body.message });
       if (t.status === 'pending') ctx.db.update('ticket', t.id, { status: 'open' });
       return { status: 200, body: ctx.db.get('ticket', t.id) };
      }
  resolve_ticket:
    method: POST
    path: /tickets/{id}/resolve
    description: Resolve a ticket. Only its assigned agent may resolve it. An unassigned ticket answers 409 unassigned, a non-assignee answers 409 not_assignee, a resolved ticket answers 409 invalid_state, and a ticket with a pending refund answers 409 refund_pending.
    input:
      agent_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const t = ctx.db.get('ticket', ctx.params.id); if (t === null) ctx.fail(404, 'not_found', 'ticket ' + ctx.params.id + ' not found'); if (t.status === 'resolved') ctx.fail(409, 'invalid_state', 'ticket ' + t.id + ' is already resolved'); if (t.assignee_id === null || t.assignee_id === undefined) ctx.fail(409, 'unassigned', 'ticket ' + t.id + ' has no assignee and cannot be resolved'); if (t.assignee_id !== ctx.body.agent_id) ctx.fail(409, 'not_assignee', 'only the assigned agent can resolve ticket ' + t.id); if (ctx.db.list('refund', { where: { ticket_id: t.id, status: 'pending' } }).length > 0) ctx.fail(409, 'refund_pending', 'ticket ' + t.id + ' has a pending refund and cannot be resolved until it is decided'); return { status: 200, body: ctx.db.update('ticket', t.id, { status: 'resolved' }) }; }"
  reopen_ticket:
    method: POST
    path: /tickets/{id}/reopen
    description: Reopen a resolved ticket, setting it to open. Any other status answers 409 invalid_state.
    input: {}
    handler: |-
      (ctx) => {
       const t = ctx.db.get('ticket', ctx.params.id);
       if (t === null) ctx.fail(404, 'not_found', 'ticket ' + ctx.params.id + ' not found');
       if (t.status !== 'resolved') ctx.fail(409, 'invalid_state', 'ticket ' + t.id + ' is ' + t.status + ' and only a resolved ticket can be reopened');
       return { status: 200, body: ctx.db.update('ticket', t.id, { status: 'open' }) };
      }
  create_refund:
    method: POST
    path: /tickets/{id}/refunds
    description: "An agent refunds the order linked to the ticket. Body: order_id, amount (minor units, USD), agent_id. Amounts of 50000 or less are issued at once. Larger amounts stay pending until a lead approves them. An order that is not the ticket's order answers 422 order_not_on_ticket."
    input:
      order_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
      agent_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const t = ctx.db.get('ticket', ctx.params.id); if (t === null) ctx.fail(404, 'not_found', 'ticket ' + ctx.params.id + ' not found'); if (t.order_id === null || t.order_id !== ctx.body.order_id) ctx.fail(422, 'order_not_on_ticket', 'order ' + ctx.body.order_id + ' is not the order of ticket ' + t.id); const a = ctx.db.get('agent', ctx.body.agent_id); if (a === null) ctx.fail(422, 'ref.unresolved', 'agent ' + ctx.body.agent_id + ' not found'); const r = ctx.db.create('refund', { ticket_id: t.id, order_id: t.order_id, agent_id: a.id, approver_id: null, amount: ctx.body.amount, status: 'pending' }); const out = ctx.body.amount > 50000 ? r : ctx.db.update('refund', r.id, { status: 'issued' }); return { status: 201, body: out }; }"
  approve_refund:
    method: POST
    path: /refunds/{id}/approve
    description: "A lead approves a pending refund, which becomes issued. Body: supervisor_id. An agent whose role is not lead answers 409 not_supervisor. A refund that is not pending answers 409 invalid_state."
    input:
      supervisor_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const r = ctx.db.get('refund', ctx.params.id); if (r === null) ctx.fail(404, 'not_found', 'refund ' + ctx.params.id + ' not found'); const s = ctx.db.get('agent', ctx.body.supervisor_id); if (s === null) ctx.fail(422, 'ref.unresolved', 'agent ' + ctx.body.supervisor_id + ' not found'); if (s.role !== 'lead') ctx.fail(409, 'not_supervisor', 'agent ' + s.id + ' is not a lead and cannot approve refunds'); if (r.status !== 'pending') ctx.fail(409, 'invalid_state', 'refund ' + r.id + ' is ' + r.status + ' and only a pending refund can be approved'); return { status: 200, body: ctx.db.update('refund', r.id, { status: 'issued', approver_id: s.id }) }; }"
  reject_refund:
    method: POST
    path: /refunds/{id}/reject
    description: "A lead rejects a pending refund, which becomes rejected and no longer blocks its ticket. Body: supervisor_id. An agent whose role is not lead answers 409 not_supervisor. A refund that is not pending answers 409 invalid_state."
    input:
      supervisor_id:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: "(ctx) => { const r = ctx.db.get('refund', ctx.params.id); if (r === null) ctx.fail(404, 'not_found', 'refund ' + ctx.params.id + ' not found'); const s = ctx.db.get('agent', ctx.body.supervisor_id); if (s === null) ctx.fail(422, 'ref.unresolved', 'agent ' + ctx.body.supervisor_id + ' not found'); if (s.role !== 'lead') ctx.fail(409, 'not_supervisor', 'agent ' + s.id + ' is not a lead and cannot reject refunds'); if (r.status !== 'pending') ctx.fail(409, 'invalid_state', 'refund ' + r.id + ' is ' + r.status + ' and only a pending refund can be rejected'); return { status: 200, body: ctx.db.update('refund', r.id, { status: 'rejected', approver_id: s.id }) }; }"
jobs:
  close_stale_pending:
    description: Resolves every pending ticket whose last update is at least 7 days before now, except tickets that have a pending refund.
    every: 1d
    run: "(ctx) => { const cutoff = ctx.time.minus(ctx.now(), '7d'); const pending = ctx.db.list('ticket', { where: { status: 'pending' } }); for (const t of pending) { if (t.updated_at > cutoff) continue; if (ctx.db.list('refund', { where: { ticket_id: t.id, status: 'pending' } }).length > 0) continue; ctx.db.update('ticket', t.id, { status: 'resolved' }); } }"
