  assign_reply_resolve_refund:
    difficulty: hard
    instruction: "Priya Nair (priya.nair1936@example.com) has an open ticket titled 'Refund not received' that nobody is working on yet. Assign it to Dev Evans, reply on it as Dev Evans saying the refund was issued, then resolve it as Dev Evans. The three calls must run in that order: assign, then reply, then resolve."
    grader: "(ctx) => { const priya = ctx.seed.list('customer', { where: { email: 'priya.nair1936@example.com' } })[0]; const t = priya ? ctx.seed.list('ticket', { where: { customer_id: priya.id, subject: 'Refund not received' } })[0] : undefined; if (!t) return 0; const dev = ctx.seed.list('agent', { where: { name: 'Dev Evans' } })[0]; const mine = ctx.changes().filter((c) => c.entity === 'comment' && c.kind === 'created' && ctx.db.get('comment', c.id).ticket_id === t.id); ctx.guardChanges('only the target ticket and comments added to it change', [{ entity: 'ticket', id: t.id, kind: 'updated', fields: ['assignee_id', 'status'] }].concat(mine.map((c) => ({ entity: 'comment', id: c.id, kind: 'created', fields: c.fields })))); const end = ctx.db.get('ticket', t.id); const replies = ctx.db.list('comment', { where: { ticket_id: t.id, author_kind: 'agent', agent_id: dev.id } }).filter((c) => c.body.toLowerCase().indexOf('refund') >= 0 && c.body.toLowerCase().indexOf('issued') >= 0); const tr = ctx.trace(); const at = (method, suffix) => { const hit = tr.find((c) => c.method === method && c.path === '/tickets/' + t.id + suffix && c.status < 300); return hit ? hit.seq : -1; }; const a = at('POST', '/assign'); const rp = at('POST', '/reply'); const z = at('POST', '/resolve'); ctx.goal(0.2, 'the ticket is assigned to Dev Evans', end.assignee_id === dev.id); ctx.goal(0.25, 'Dev Evans replies that the refund was issued', replies.length > 0); ctx.goal(0.4, 'the ticket is resolved', end.status === 'resolved'); ctx.goal(0.15, 'assign, reply and resolve ran in that order', a >= 0 && rp > a && z > rp); return ctx.score(); }"
    solution: "(ctx) => { const esc = (s) => s.split('%').join('%25').split('=').join('%3D').split('+').join('%2B').split('/').join('%2F'); const priya = ctx.api('GET', '/customers?email=priya.nair1936@example.com').body.data[0]; ctx.assert(priya !== undefined, 'customer not found'); const dev = ctx.api('GET', '/agents').body.data.find((a) => a.name === 'Dev Evans'); ctx.assert(dev !== undefined, 'agent not found'); let rows = []; let cur = null; do { const q = cur === null ? '/tickets?limit=25' : '/tickets?limit=25&cursor=' + esc(cur); const page = ctx.api('GET', q).body; ctx.assert(Array.isArray(page.data), 'list failed'); rows = rows.concat(page.data); cur = page.next_cursor === undefined ? null : page.next_cursor; } while (cur !== null); const t = rows.find((x) => x.customer_id === priya.id && x.subject === 'Refund not received' && x.status === 'open'); ctx.assert(t !== undefined, 'ticket not found on any page'); ctx.api('GET', '/tickets?assignee_id=' + dev.id); const a = ctx.api('POST', '/tickets/' + t.id + '/assign', { agent_id: dev.id }); ctx.assert(a.status === 200, 'assign failed: ' + JSON.stringify(a.body)); const r = ctx.api('POST', '/tickets/' + t.id + '/reply', { agent_id: dev.id, message: 'Good news: the refund was issued to your original payment method.' }); ctx.assert(r.status === 200, 'reply failed: ' + JSON.stringify(r.body)); const z = ctx.api('POST', '/tickets/' + t.id + '/resolve', { agent_id: dev.id }); ctx.assert(z.status === 200 && z.body.status === 'resolved', 'resolve failed: ' + JSON.stringify(z.body)); }"
    decoys:
      - why: replies and resolves without assigning first, so resolve answers 409 unassigned and the ticket is never closed
        script: "(ctx) => { const priya = ctx.api('GET', '/customers?email=priya.nair1936@example.com').body.data[0]; const dev = ctx.api('GET', '/agents').body.data.find((a) => a.name === 'Dev Evans'); const t = ctx.api('GET', '/tickets?customer_id=' + priya.id + '&status=open').body.data.find((x) => x.subject === 'Refund not received'); ctx.api('POST', '/tickets/' + t.id + '/reply', { agent_id: dev.id, message: 'Good news: the refund was issued to your original payment method.' }); ctx.api('POST', '/tickets/' + t.id + '/resolve', { agent_id: dev.id }); }"
