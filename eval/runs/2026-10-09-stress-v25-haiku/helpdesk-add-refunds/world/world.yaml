format: 1
meta:
  name: world
  description: A helpdesk where customers open tickets about their orders, agents reply, and tickets move between open, pending and resolved. Agents assign tickets, reply, resolve and reopen them. A stale pending ticket resolves itself after 7 days without an update. The world holds customers, agents, orders, tickets and comments (the replies on a ticket), with list and get routes and create routes so tests can build their own rows.
  resembles: Zendesk-style helpdesk ticketing API
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-01T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A person who opens tickets. Email is unique.
    idPrefix: cus
    fields:
      first_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      last_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
  agent:
    description: A support agent who is assigned tickets and writes replies. Role is agent or lead.
    idPrefix: agt
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      role:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - agent
          - lead
  order:
    description: A purchase by a customer that a ticket can be about.
    idPrefix: ord
    fields:
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        pattern: ^#W[0-9]{7}$
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      item_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      total:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
  ticket:
    description: A support case with a status state field (open, pending, resolved), an optional order, and an optional assignee agent.
    idPrefix: tkt
    fields:
      subject:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      description:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      order_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: order
        onDelete: restrict
      assignee_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: agent
        onDelete: restrict
      priority:
        type: enum
        required: false
        nullable: false
        unique: false
        readonly: false
        values:
          - low
          - normal
          - high
          - urgent
        default: normal
      status:
        type: state
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - open
          - pending
          - resolved
        initial: open
        transitions:
          open:
            - pending
            - resolved
          pending:
            - open
            - resolved
          resolved:
            - open
  comment:
    description: One reply on a ticket, written by an agent or by the customer.
    idPrefix: cmt
    fields:
      ticket_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: ticket
        onDelete: restrict
      author_kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - agent
          - customer
      agent_id:
        type: ref
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: agent
        onDelete: restrict
      body:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
  refund:
    description: Money an agent returns to the customer for an order linked to a ticket. Status is pending, issued or rejected. Refunds above 50000 minor units (USD) stay pending until a lead approves them. The row records the decision only; no money moves.
    idPrefix: rfd
    fields:
      ticket_id:
        type: ref
        description: The ticket the refund belongs to.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: ticket
        onDelete: restrict
      order_id:
        type: ref
        description: The order refunded. Must be the order the ticket names.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: order
        onDelete: restrict
      agent_id:
        type: ref
        description: The agent who requested the refund.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: agent
        onDelete: restrict
      approver_id:
        type: ref
        description: The lead who approved or rejected a pending refund. null until decided, or when the refund was issued at once.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: agent
        onDelete: nullify
      amount:
        type: money
        description: Refund amount in minor units, USD.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 1
      status:
        type: state
        description: pending until issued at once (50000 or less) or decided by a lead. issued and rejected are final.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - pending
          - issued
          - rejected
        initial: pending
        transitions:
          pending:
            - issued
            - rejected
          issued: []
          rejected: []
