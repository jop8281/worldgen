format: 1
meta:
  name: world
  description: "A small equipment repair desk. Technicians have a name and an active flag. Repair tickets have a subject, customer name, priority (normal or urgent), a status (queued, active, closed) and an optional assigned technician. Tickets are listed with pagination and filters, created and edited through standard routes, and moved through explicit assign, start and close actions. Starting needs a queued ticket with an active assigned technician; closing needs an active ticket; assigning needs a queued ticket and an active technician. Refused calls write nothing. The seed is deterministic: four technicians (one inactive) and twelve tickets across all statuses and both priorities, with the list page size at 5 so the hard task must page."
  resembles: Field service equipment repair desk ticketing (Zendesk / Freshdesk-style service desk)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  technician:
    description: A repair technician who can be assigned tickets only while active.
    idPrefix: tec
    fields:
      name:
        type: string
        description: Full name of the technician.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      active:
        type: bool
        description: Only active technicians can be assigned or start a ticket.
        required: true
        nullable: false
        unique: false
        readonly: false
        default: true
  ticket:
    description: A repair request for one piece of equipment, with a customer, a priority, a lifecycle status and an optional assigned technician. Status and assignment change only through actions.
    idPrefix: tkt
    fields:
      subject:
        type: string
        description: Short summary of the equipment problem.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 200
      customer_name:
        type: string
        description: Customer name as given at intake.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      priority:
        type: enum
        description: Editable through update_ticket in any status.
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - normal
          - urgent
        default: normal
      status:
        type: state
        description: Moved only by assign, start and close actions. A new ticket starts queued.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - queued
          - active
          - closed
        initial: queued
        transitions:
          queued:
            - active
          active:
            - closed
          closed: []
      assigned_technician_id:
        type: ref
        description: Set only by assign_ticket. Null until a technician is assigned.
        required: false
        nullable: true
        unique: false
        readonly: true
        entity: technician
        onDelete: restrict
routes:
  list_technicians:
    op: list
    entity: technician
    filters:
      - active
    search:
      - name
    sort: []
    pageSize: 25
    method: GET
    path: /technicians
    description: List technicians, filter by active, search by name.
  get_technician:
    op: get
    entity: technician
    method: GET
    path: /technicians/{id}
    description: Fetch one technician.
  create_technician:
    op: create
    entity: technician
    method: POST
    path: /technicians
    description: Register a technician; active defaults to true.
  update_technician:
    op: update
    entity: technician
    method: PATCH
    path: /technicians/{id}
    description: Rename a technician or set active to false or true.
  list_tickets:
    op: list
    entity: ticket
    filters:
      - status
      - priority
      - assigned_technician_id
    search:
      - subject
      - customer_name
    sort:
      - priority
      - created_at
    pageSize: 5
    method: GET
    path: /tickets
    description: List tickets with cursor paging of 5 rows, filter by status, priority and assigned technician, search by subject and customer name, sort by priority or created_at.
  get_ticket:
    op: get
    entity: ticket
    method: GET
    path: /tickets/{id}
    description: Fetch one ticket.
  create_ticket:
    op: create
    entity: ticket
    method: POST
    path: /tickets
    description: Create a queued, unassigned ticket with subject, customer name and priority.
  update_ticket:
    op: update
    entity: ticket
    method: PATCH
    path: /tickets/{id}
    description: Edit subject, customer name or priority. Status and assignment are refused here.
actions:
  assign_ticket:
    method: POST
    path: /tickets/{id}/assign
    description: Assign an active technician to a queued ticket. Refuses a ticket that is not queued (409 invalid_state), an unknown technician (404 not_found) and an inactive technician (409 technician_inactive). Writes nothing on refusal.
    input:
      technician_id:
        type: ref
        description: The technician to assign.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: technician
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        const tech = ctx.db.get('technician', ctx.body.technician_id);
        if (tech === null) ctx.fail(404, 'not_found', 'technician ' + ctx.body.technician_id + ' not found');
        if (t.status !== 'queued') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only queued tickets can be assigned.');
        if (!tech.active) ctx.fail(409, 'technician_inactive', 'technician ' + tech.name + ' is inactive and cannot be assigned');
        const updated = ctx.db.update('ticket', id, { assigned_technician_id: tech.id });
        return { status: 200, body: updated };
      }
  start_ticket:
    method: POST
    path: /tickets/{id}/start
    description: Start a queued ticket that has an active assigned technician. Refuses a ticket that is not queued (409 invalid_state), an unassigned ticket (409 no_technician), and an inactive assigned technician (409 technician_inactive). Writes nothing on refusal.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status !== 'queued') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only queued tickets can be started.');
        if (!t.assigned_technician_id) ctx.fail(409, 'no_technician', 'ticket ' + id + ' has no assigned technician and cannot be started');
        const tech = ctx.db.get('technician', t.assigned_technician_id);
        if (tech === null) ctx.fail(409, 'no_technician', 'ticket ' + id + ' has no assigned technician and cannot be started');
        if (!tech.active) ctx.fail(409, 'technician_inactive', 'technician ' + tech.name + ' is inactive and cannot start ticket ' + id);
        const updated = ctx.db.update('ticket', id, { status: 'active' });
        return { status: 200, body: updated };
      }
  close_ticket:
    method: POST
    path: /tickets/{id}/close
    description: Close an active ticket. Refuses any other status with 409 invalid_state and writes nothing on refusal.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const t = ctx.db.get('ticket', id);
        if (t === null) ctx.fail(404, 'not_found', 'ticket ' + id + ' not found');
        if (t.status !== 'active') ctx.fail(409, 'invalid_state', 'ticket ' + id + ' is ' + t.status + '. Only active tickets can be closed.');
        const updated = ctx.db.update('ticket', id, { status: 'closed' });
        return { status: 200, body: updated };
      }
jobs: {}
