  cancel_mistaken_refund:
    difficulty: medium
    instruction: A refund was filed by mistake on the charge described 'Conference tickets, October' and is still pending. Cancel that pending refund. The near-duplicate charge 'Conference tickets, October (resend)' and its refund must stay untouched. Change nothing else.
    grader: "(ctx) => { const t = ctx.seed.list('charge', { where: { description: 'Conference tickets, October' } })[0]; if (!t) return 0; const pend = ctx.seed.list('refund', { where: { charge: t.id, status: 'pending' } })[0]; if (!pend) return 0; if (ctx.changes().length === 0) return 0; ctx.guardChanges('only the pending refund is canceled and the charge refund total is restored', [ { entity: 'refund', id: pend.id, kind: 'updated', fields: ['status'] }, { entity: 'charge', id: t.id, kind: 'updated', fields: ['amount_refunded', 'refunded'] } ]); const end = ctx.db.get('refund', pend.id); const ch = ctx.db.get('charge', t.id); ctx.goal(0.6, 'the pending refund is canceled', end !== null && end.status === 'canceled'); ctx.goal(0.4, 'the charge carries no live refund', ch !== null && ch.amount_refunded === 0 && ch.refunded === false); return ctx.score(); }"
    solution: "(ctx) => { const list = ctx.api('GET', '/v1/charges?customer=cus_Zt5HnQ4c'); ctx.assert(list.status === 200, 'list charges: ' + JSON.stringify(list.body)); const target = list.body.data.find((c) => c.description === 'Conference tickets, October'); ctx.assert(target, 'charge Conference tickets, October not found'); const refunds = ctx.api('GET', '/v1/refunds?charge=' + target.id); ctx.assert(refunds.status === 200, 'list refunds: ' + JSON.stringify(refunds.body)); const pending = refunds.body.data.filter((r) => r.status === 'pending'); ctx.assert(pending.length === 1, 'expected one pending refund, found ' + pending.length); const r = ctx.api('POST', '/v1/refunds/' + pending[0].id + '/cancel', {}); ctx.assert(r.status === 200 && r.body.status === 'canceled', 'cancel failed: ' + JSON.stringify(r.body)); }"
    decoys:
      - why: cancels the pending refund on Design review hours, a different charge with a pending refund, instead of the Conference tickets one
        script: (ctx) => { const list = ctx.api('GET', '/v1/charges?customer=cus_Yw6Lm2Ds'); const other = list.body.data.find((c) => c.description === 'Design review hours'); const refunds = ctx.api('GET', '/v1/refunds?charge=' + other.id); const pending = refunds.body.data.find((r) => r.status === 'pending'); ctx.api('POST', '/v1/refunds/' + pending.id + '/cancel', {}); }
      - why: cancels the right pending refund, then refunds the charge's remaining amount again, so the charge ends up refunded in full
        script: "(ctx) => { const list = ctx.api('GET', '/v1/charges?customer=cus_Zt5HnQ4c'); const target = list.body.data.find((c) => c.description === 'Conference tickets, October'); const refunds = ctx.api('GET', '/v1/refunds?charge=' + target.id); const pending = refunds.body.data.find((r) => r.status === 'pending'); ctx.api('POST', '/v1/refunds/' + pending.id + '/cancel', {}); ctx.api('POST', '/v1/refunds', { charge: target.id }); }"
    alternatives: []
    allows:
      - entity: refund
        kind: updated
        fields:
          - status
        where:
          amount: 45000
          status: pending
      - entity: charge
        kind: updated
        fields:
          - amount_refunded
          - refunded
        where:
          description: Conference tickets, October
  resize_studio_refund:
    difficulty: hard
    instruction: The pending refund of 1500 on the charge described 'Studio rental, deposit' was wrong. Cancel that pending refund, then issue a refund of 1200 on the same charge. The charge has 2000, so the 1200 refund fits only after the wrong one is canceled. Change nothing else.
    grader: "(ctx) => { const c = ctx.seed.list('charge', { where: { description: 'Studio rental, deposit' } })[0]; if (!c) return 0; const wrong = ctx.seed.list('refund', { where: { charge: c.id, status: 'pending', amount: 1500 } })[0]; if (!wrong) return 0; if (ctx.changes().length === 0) return 0; const news = ctx.db.list('refund', { where: { charge: c.id } }).filter((r) => ctx.seed.get('refund', r.id) === null); ctx.guardChanges('the 1500 pending refund is canceled, one new refund is added on the same charge, and only the charge refund totals move', [ { entity: 'refund', id: wrong.id, kind: 'updated', fields: ['status'] }, { entity: 'charge', id: c.id, kind: 'updated', fields: ['amount_refunded', 'refunded'] }, ...news.map((r) => ({ entity: 'refund', id: r.id, kind: 'created', fields: ['charge', 'amount', 'currency', 'status', 'reason', 'metadata'] })) ]); const end = ctx.db.get('refund', wrong.id); const ch = ctx.db.get('charge', c.id); const fresh = news.filter((r) => r.amount === 1200 && r.status === 'pending'); ctx.goal(0.4, 'the wrong 1500 refund is canceled', end !== null && end.status === 'canceled'); ctx.goal(0.4, 'a pending 1200 refund is issued on the charge', fresh.length === 1); ctx.goal(0.2, 'the charge shows 1200 refunded and is not fully refunded', ch !== null && ch.amount_refunded === 1200 && ch.refunded === false); return ctx.score(); }"
    solution: "(ctx) => { const found = []; let after = null; do { const page = ctx.api('GET', '/v1/charges?limit=10' + (after === null ? '' : '&starting_after=' + after)); ctx.assert(page.status === 200, 'list charges: ' + JSON.stringify(page.body)); for (const c of page.body.data) found.push(c); after = page.body.has_more === true ? page.body.data[page.body.data.length - 1].id : null; } while (after !== null); const target = found.find((c) => c.description === 'Studio rental, deposit'); ctx.assert(target, 'charge Studio rental, deposit not found'); const refunds = ctx.api('GET', '/v1/refunds?charge=' + target.id); ctx.assert(refunds.status === 200, 'list refunds: ' + JSON.stringify(refunds.body)); const wrong = refunds.body.data.filter((r) => r.status === 'pending' && r.amount === 1500); ctx.assert(wrong.length === 1, 'expected one pending 1500 refund, found ' + wrong.length); const c = ctx.api('POST', '/v1/refunds/' + wrong[0].id + '/cancel', {}); ctx.assert(c.status === 200 && c.body.status === 'canceled', 'cancel failed: ' + JSON.stringify(c.body)); const left = ctx.api('GET', '/v1/charges/' + target.id).body; ctx.assert(left.amount - left.amount_refunded >= 1200, 'room for 1200 after the cancel, got ' + (left.amount - left.amount_refunded)); const r = ctx.api('POST', '/v1/refunds', { charge: target.id, amount: 1200 }); ctx.assert(r.status === 200 && r.body.status === 'pending', 'refund 1200 failed: ' + JSON.stringify(r.body)); }"
    decoys:
      - why: cancels the wrong 1500 refund and stops, never issuing the replacement 1200 refund
        script: (ctx) => { const list = ctx.api('GET', '/v1/charges?customer=cus_Yw6Lm2Ds'); const target = list.body.data.find((c) => c.description === 'Studio rental, deposit'); const refunds = ctx.api('GET', '/v1/refunds?charge=' + target.id); const wrong = refunds.body.data.find((r) => r.status === 'pending' && r.amount === 1500); ctx.api('POST', '/v1/refunds/' + wrong.id + '/cancel', {}); }
      - why: tries the 1200 refund before cancelling, which the remaining 500 refuses, then cancels the 1500 refund and stops
        script: "(ctx) => { const list = ctx.api('GET', '/v1/charges?customer=cus_Yw6Lm2Ds'); const target = list.body.data.find((c) => c.description === 'Studio rental, deposit'); ctx.api('POST', '/v1/refunds', { charge: target.id, amount: 1200 }); const refunds = ctx.api('GET', '/v1/refunds?charge=' + target.id); const wrong = refunds.body.data.find((r) => r.status === 'pending' && r.amount === 1500); ctx.api('POST', '/v1/refunds/' + wrong.id + '/cancel', {}); }"
      - why: cancels the 1500 refund, then refunds 1500 again on the same charge instead of the 1200 that was asked for
        script: "(ctx) => { const list = ctx.api('GET', '/v1/charges?customer=cus_Yw6Lm2Ds'); const target = list.body.data.find((c) => c.description === 'Studio rental, deposit'); const refunds = ctx.api('GET', '/v1/refunds?charge=' + target.id); const wrong = refunds.body.data.find((r) => r.status === 'pending' && r.amount === 1500); ctx.api('POST', '/v1/refunds/' + wrong.id + '/cancel', {}); ctx.api('POST', '/v1/refunds', { charge: target.id, amount: 1500 }); }"
    alternatives: []
    allows:
      - entity: refund
        kind: updated
        fields:
          - status
        where:
          amount: 1500
          status: pending
      - entity: refund
        kind: created
        fields: []
        where:
          amount: 1200
          currency: usd
          status: pending
      - entity: charge
        kind: updated
        fields:
          - amount_refunded
          - refunded
        where:
          description: Studio rental, deposit
