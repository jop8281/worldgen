format: 1
meta:
  name: world
  description: A Stripe-style payments world with charges and refunds. An agent creates charges, refunds them in part or in full, cancels pending refunds, and reads paged Stripe-style lists. Refund status moves through a state machine, a job settles old pending refunds, and charge amount_refunded always tracks live refunds. Customers are a plain string on the charge, because no customer operation is among the kept eight.
  resembles: Stripe API (charges and refunds subset, version 2024-06-20)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T12:00:00.000Z
    tick: 1s
  api:
    list:
      mode: stripe
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        type: invalid_request_error
        code: $code
        message: $message
entities:
  charge:
    description: A Stripe-style payment of amount minor units in a currency. Created by create_charge. amount_refunded and refunded move only through refund actions, and status is set at creation.
    idPrefix: ch
    fields:
      amount:
        type: int
        description: Amount in minor units, a positive integer.
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 1
      currency:
        type: string
        description: Three-letter lowercase ISO currency code.
        required: true
        nullable: false
        unique: false
        readonly: true
        pattern: ^[a-z]{3}$
      customer:
        type: string
        description: Customer id as a plain string. No customer entity is modelled.
        required: false
        nullable: true
        unique: false
        readonly: true
        maxLength: 255
      description:
        type: string
        description: Free-text description of the charge.
        required: false
        nullable: true
        unique: false
        readonly: true
        maxLength: 500
      amount_refunded:
        type: int
        description: Sum of the live (non-canceled) refunds on this charge.
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      amount_captured:
        type: int
        description: "Amount captured: equal to amount when captured is true, otherwise 0."
        required: false
        nullable: false
        unique: false
        readonly: true
        min: 0
        default: 0
      captured:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: true
        default: true
      paid:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: true
        default: true
      refunded:
        type: bool
        description: True once amount_refunded equals amount.
        required: false
        nullable: false
        unique: false
        readonly: true
        default: false
      status:
        type: enum
        description: Plain status set at creation. No action moves a charge afterwards.
        required: false
        nullable: false
        unique: false
        readonly: true
        values:
          - succeeded
          - pending
          - failed
        default: succeeded
      metadata:
        type: text
        description: Metadata stored as a JSON text string.
        required: false
        nullable: true
        unique: false
        readonly: false
  refund:
    description: A refund of part or all of one charge. Status is a state field moved only by create_refund, cancel_refund and the settle_refunds job. metadata is the only editable field.
    idPrefix: re
    fields:
      charge:
        type: ref
        description: The charge being refunded.
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: charge
        onDelete: restrict
      amount:
        type: int
        description: Refunded amount in minor units.
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 1
      currency:
        type: string
        description: Three-letter lowercase ISO currency code, copied from the charge.
        required: true
        nullable: false
        unique: false
        readonly: true
        pattern: ^[a-z]{3}$
      status:
        type: state
        description: Refund lifecycle. Moved only by actions and the settle_refunds job.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - requires_action
          - succeeded
          - failed
          - canceled
        initial: pending
        transitions:
          pending:
            - requires_action
            - succeeded
            - failed
            - canceled
          requires_action:
            - pending
            - failed
            - canceled
          succeeded: []
          failed: []
          canceled: []
      reason:
        type: enum
        description: Optional reason for the refund.
        required: false
        nullable: true
        unique: false
        readonly: true
        values:
          - duplicate
          - fraudulent
          - requested_by_customer
          - expired_uncaptured_charge
      metadata:
        type: text
        description: Metadata stored as a JSON text string. The only editable field.
        required: false
        nullable: true
        unique: false
        readonly: false
routes:
  list_charges:
    op: list
    entity: charge
    filters:
      - customer
      - description
    search: []
    sort: []
    pageSize: 10
    method: GET
    path: /v1/charges
    description: Stripe-mode list of charges, newest first. Filter by customer and description.
  get_charge:
    op: get
    entity: charge
    method: GET
    path: /v1/charges/{id}
    description: Retrieve one charge.
  list_refunds:
    op: list
    entity: refund
    filters:
      - charge
    search: []
    sort: []
    pageSize: 10
    method: GET
    path: /v1/refunds
    description: Stripe-mode list of refunds, newest first. Filter by charge.
  get_refund:
    op: get
    entity: refund
    method: GET
    path: /v1/refunds/{id}
    description: Retrieve one refund.
  update_refund:
    op: update
    entity: refund
    method: POST
    path: /v1/refunds/{id}
    description: Update a refund's metadata. Any other field is refused as readonly.
actions:
  create_charge:
    method: POST
    path: /v1/charges
    description: Create a charge. Stored as succeeded, captured and paid unless capture is false, with nothing refunded. amount is minor units and must be positive; currency is three lowercase letters.
    input:
      amount:
        type: int
        description: Amount in minor units, a positive integer.
        required: true
        nullable: false
        unique: false
        readonly: false
      currency:
        type: string
        description: Three-letter lowercase ISO currency code.
        required: true
        nullable: false
        unique: false
        readonly: false
        pattern: ^[a-z]{3}$
      customer:
        type: string
        description: Customer id as a plain string.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 255
      description:
        type: string
        description: Free-text description.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 500
      capture:
        type: bool
        description: Whether the charge is captured. Defaults to true.
        required: false
        nullable: false
        unique: false
        readonly: false
      metadata:
        type: text
        description: Metadata as a JSON text string.
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: "(ctx) => { const b = ctx.body; if (typeof b.amount !== 'number' || !Number.isInteger(b.amount) || b.amount < 1) ctx.fail(400, 'parameter_invalid', 'amount must be a positive integer in minor units', { param: 'amount' }); if (typeof b.currency !== 'string' || !/^[a-z]{3}$/.test(b.currency)) ctx.fail(400, 'parameter_invalid', 'currency must be a three-letter lowercase ISO code', { param: 'currency' }); const capture = b.capture === undefined || b.capture === null ? true : b.capture === true; const created = ctx.db.create('charge', { amount: b.amount, currency: b.currency, customer: b.customer === undefined ? null : b.customer, description: b.description === undefined ? null : b.description, metadata: b.metadata === undefined ? null : b.metadata, amount_refunded: 0, amount_captured: capture ? b.amount : 0, captured: capture, paid: capture, refunded: false, status: 'succeeded' }); return { status: 200, body: created }; }"
  create_refund:
    method: POST
    path: /v1/refunds
    description: Refund part or all of one charge. An omitted amount refunds the remainder. The amount may not exceed the charge's remaining refundable amount. The refund starts pending and counts toward the charge's amount_refunded.
    input:
      charge:
        type: ref
        description: The charge being refunded.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: charge
        onDelete: restrict
      amount:
        type: int
        description: Amount in minor units. Omit to refund the remainder.
        required: false
        nullable: true
        unique: false
        readonly: false
      reason:
        type: enum
        description: Optional reason.
        required: false
        nullable: true
        unique: false
        readonly: false
        values:
          - duplicate
          - fraudulent
          - requested_by_customer
          - expired_uncaptured_charge
      metadata:
        type: text
        description: Metadata as a JSON text string.
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: "(ctx) => { const b = ctx.body; if (b.charge === undefined || b.charge === null) ctx.fail(400, 'parameter_missing', 'charge is required', { param: 'charge' }); const c = ctx.db.get('charge', b.charge); if (c === null) ctx.fail(404, 'resource_missing', 'No such charge: ' + b.charge, { param: 'charge' }); const refundable = c.amount - c.amount_refunded; const amount = b.amount === undefined || b.amount === null ? refundable : b.amount; if (typeof amount !== 'number' || !Number.isInteger(amount) || amount < 1) ctx.fail(400, 'parameter_invalid', 'amount must be a positive integer in minor units', { param: 'amount' }); if (refundable <= 0) ctx.fail(400, 'charge_fully_refunded', 'charge ' + c.id + ' has nothing left to refund', { param: 'amount' }); if (amount > refundable) ctx.fail(400, 'amount_too_large', 'amount ' + amount + ' exceeds the remaining refundable amount ' + refundable, { param: 'amount' }); const refund = ctx.db.create('refund', { charge: c.id, amount: amount, currency: c.currency, status: 'pending', reason: b.reason === undefined ? null : b.reason, metadata: b.metadata === undefined ? null : b.metadata }); const total = c.amount_refunded + amount; ctx.db.update('charge', c.id, { amount_refunded: total, refunded: total === c.amount }); return { status: 200, body: refund }; }"
  cancel_refund:
    method: POST
    path: /v1/refunds/{id}/cancel
    description: Cancel a pending refund. Its amount returns to the charge's refundable amount. Any other status is refused with invalid_state.
    input: {}
    handler: "(ctx) => { const id = ctx.params.id; const r = ctx.db.get('refund', id); if (r === null) ctx.fail(404, 'resource_missing', 'No such refund: ' + id, { param: 'id' }); if (r.status !== 'pending') ctx.fail(409, 'invalid_state', 'refund ' + id + ' is ' + r.status + '. Only pending refunds can be canceled.'); const updated = ctx.db.update('refund', id, { status: 'canceled' }); const c = ctx.db.get('charge', r.charge); const left = c.amount_refunded - r.amount; ctx.db.update('charge', c.id, { amount_refunded: left, refunded: left === c.amount }); return { status: 200, body: updated }; }"
jobs:
  settle_refunds:
    description: Every hour. A pending refund whose created_at is at least 1440 minutes before now becomes succeeded.
    every: 1h
    run: "(ctx) => { const now = ctx.now(); for (const r of ctx.db.list('refund', { where: { status: 'pending' } })) { if (ctx.time.minutesBetween(r.created_at, now) < 1440) continue; ctx.db.update('refund', r.id, { status: 'succeeded' }); } }"
fixtures: {}
seed:
  charge: "(ctx) => { const T0 = '2026-10-09T12:00:00.000Z'; const at = (m) => ctx.time.minus(T0, m + 'm'); const rows = [ ['Studio rental, deposit', 12960, 2000, 'cus_Yw6Lm2Ds', 1500], ['Quarterly bookkeeping retainer', 11520, 35000, 'cus_8mPq2Lw1', 5000], ['Office coffee subscription', 10080, 4900, 'cus_3kRd7Vb9', 0], ['Conference tickets, October', 8640, 45000, 'cus_Zt5HnQ4c', 45000], ['Team plan, March renewal', 7920, 12000, 'cus_8mPq2Lw1', 0], ['Design review hours', 7200, 9600, 'cus_Yw6Lm2Ds', 2500], ['Conference tickets, October (resend)', 6480, 45000, 'cus_Zt5HnQ4c', 15000], ['Printer lease, Q3', 5040, 18500, 'cus_3kRd7Vb9', 18500], ['Software license, annual', 4320, 7500, 'cus_Zt5HnQ4c', 7500], ['Lunch catering, offsite', 3000, 6200, 'cus_Yw6Lm2Ds', 0], ['Hosting overage, September', 2400, 3100, 'cus_8mPq2Lw1', 800], ['Domain renewal, example.org', 1440, 1200, 'cus_3kRd7Vb9', 0] ]; return rows.map(([description, m, amount, customer, refunded]) => { const created = at(m); return { amount: amount, currency: 'usd', customer: customer, description: description, amount_refunded: refunded, amount_captured: amount, captured: true, paid: true, refunded: refunded === amount, status: 'succeeded', metadata: null, created_at: created, updated_at: created }; }); }"
  refund: "(ctx) => { const T0 = '2026-10-09T12:00:00.000Z'; const at = (m) => ctx.time.minus(T0, m + 'm'); const ch = ctx.rows('charge'); const rows = [ [3, 45000, 'pending', 150, 150, 'requested_by_customer'], [0, 1500, 'pending', 420, 420, 'requested_by_customer'], [5, 2500, 'pending', 1080, 1080, 'duplicate'], [1, 5000, 'succeeded', 3000, 2940, 'requested_by_customer'], [6, 15000, 'succeeded', 2800, 2740, 'requested_by_customer'], [7, 18500, 'succeeded', 2600, 2540, 'duplicate'], [8, 7500, 'succeeded', 2200, 2140, 'requested_by_customer'], [10, 800, 'succeeded', 1900, 1840, null], [2, 1000, 'canceled', 2400, 2100, null], [9, 2000, 'canceled', 2000, 1990, null] ]; rows.sort((a, b) => b[3] - a[3]); return rows.map(([i, amount, status, cm, um, reason]) => ({ charge: ch[i].id, amount: amount, currency: 'usd', status: status, reason: reason, metadata: null, created_at: at(cm), updated_at: at(um) })); }"
tests:
  charge_create_and_get:
    description: Create a charge, read it back, refuse amount 0 with 400, and refuse an unknown charge with row.not_found.
    script: "(ctx) => { const c = ctx.api('POST', '/v1/charges', { amount: 1234, currency: 'usd', customer: 'acc_cus_t1', description: 'acceptance charge one' }); ctx.assert(c.status === 200, 'create charge: ' + JSON.stringify(c.body)); ctx.assert(c.body.amount === 1234 && c.body.currency === 'usd', 'amount and currency kept'); ctx.assert(c.body.status === 'succeeded' && c.body.captured === true && c.body.paid === true, 'succeeded, captured and paid by default'); ctx.assert(c.body.amount_refunded === 0 && c.body.refunded === false, 'nothing refunded yet'); const g = ctx.api('GET', '/v1/charges/' + c.body.id); ctx.assert(g.status === 200 && g.body.id === c.body.id, 'get returns the charge'); const bad = ctx.api('POST', '/v1/charges', { amount: 0, currency: 'usd' }); ctx.assert(bad.status === 400, 'zero amount refused, got ' + bad.status); const miss = ctx.api('GET', '/v1/charges/ch_9999'); ctx.assert(miss.status === 404 && miss.body.error.code === 'row.not_found', 'unknown charge: ' + JSON.stringify(miss.body)); }"
  charge_list_paging:
    description: Create three charges for one customer, then page them with limit 2 using starting_after and ending_before.
    script: "(ctx) => { const ids = []; for (const n of [1, 2, 3]) { const c = ctx.api('POST', '/v1/charges', { amount: 100 * n, currency: 'usd', customer: 'acc_cus_t2' }); ctx.assert(c.status === 200, 'create: ' + JSON.stringify(c.body)); ids.push(c.body.id); } const p1 = ctx.api('GET', '/v1/charges?customer=acc_cus_t2&limit=2'); ctx.assert(p1.status === 200 && p1.body.data.length === 2, 'first page of two: ' + JSON.stringify(p1.body)); ctx.assert(p1.body.data[0].id === ids[2] && p1.body.data[1].id === ids[1], 'newest first'); ctx.assert(p1.body.has_more === true, 'more rows past page one'); const p2 = ctx.api('GET', '/v1/charges?customer=acc_cus_t2&limit=2&starting_after=' + ids[1]); ctx.assert(p2.body.data.length === 1 && p2.body.data[0].id === ids[0] && p2.body.has_more === false, 'second page holds the oldest: ' + JSON.stringify(p2.body)); const back = ctx.api('GET', '/v1/charges?customer=acc_cus_t2&limit=2&ending_before=' + ids[0]); ctx.assert(back.body.data.length === 2 && back.body.data[0].id === ids[2] && back.body.has_more === false, 'ending_before returns the newer rows: ' + JSON.stringify(back.body)); }"
  cancel_refund_rules:
    description: Refund 700, cancel it, check the charge is back to 0 refunded, refuse a second cancel with invalid_state, and refuse an unknown refund with 404.
    script: "(ctx) => { const c = ctx.api('POST', '/v1/charges', { amount: 1000, currency: 'usd', customer: 'acc_cus_t4' }); ctx.assert(c.status === 200, 'charge: ' + JSON.stringify(c.body)); const r = ctx.api('POST', '/v1/refunds', { charge: c.body.id, amount: 700 }); ctx.assert(r.status === 200, 'refund: ' + JSON.stringify(r.body)); const x = ctx.api('POST', '/v1/refunds/' + r.body.id + '/cancel', {}); ctx.assert(x.status === 200 && x.body.status === 'canceled', 'cancel pending: ' + JSON.stringify(x.body)); const ch = ctx.api('GET', '/v1/charges/' + c.body.id).body; ctx.assert(ch.amount_refunded === 0 && ch.refunded === false, 'amount returned to the charge: ' + JSON.stringify(ch)); const again = ctx.api('POST', '/v1/refunds/' + r.body.id + '/cancel', {}); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second cancel: ' + JSON.stringify(again.body)); const none = ctx.api('POST', '/v1/refunds/re_9999/cancel', {}); ctx.assert(none.status === 404, 'unknown refund: ' + none.status); }"
  refund_settles_after_24h:
    description: Create a pending refund, advance 2 hours and see it still pending, then advance 24 hours and see settle_refunds fire and the refund succeed.
    script: "(ctx) => { const c = ctx.api('POST', '/v1/charges', { amount: 500, currency: 'usd', customer: 'acc_cus_t5' }); const r = ctx.api('POST', '/v1/refunds', { charge: c.body.id, amount: 500 }); ctx.assert(r.status === 200 && r.body.status === 'pending', 'pending refund: ' + JSON.stringify(r.body)); ctx.advance('2h'); ctx.assert(ctx.api('GET', '/v1/refunds/' + r.body.id).body.status === 'pending', 'still pending after two hours'); const run = ctx.advance('24h'); ctx.assert(run.jobsFired.includes('settle_refunds'), 'settle_refunds fired: ' + JSON.stringify(run)); ctx.assert(run.jobsFailed.length === 0, 'no job failed: ' + JSON.stringify(run.jobsFailed)); ctx.assert(ctx.api('GET', '/v1/refunds/' + r.body.id).body.status === 'succeeded', 'settled after a day'); }"
  refund_update_metadata_only:
    description: Create a refund with metadata, update its metadata, refuse an amount change with field.readonly, and check the refund is unchanged.
    script: "(ctx) => { const c = ctx.api('POST', '/v1/charges', { amount: 300, currency: 'usd', customer: 'acc_cus_t6' }); const r = ctx.api('POST', '/v1/refunds', { charge: c.body.id, amount: 300, metadata: 'acc note' }); ctx.assert(r.status === 200, 'refund: ' + JSON.stringify(r.body)); const up = ctx.api('POST', '/v1/refunds/' + r.body.id, { metadata: 'acc reviewed' }); ctx.assert(up.status === 200 && up.body.metadata === 'acc reviewed', 'metadata updated: ' + JSON.stringify(up.body)); const bad = ctx.api('POST', '/v1/refunds/' + r.body.id, { amount: 5 }); ctx.assert(bad.status === 422 && bad.body.error.code === 'field.readonly', 'amount is fixed: ' + JSON.stringify(bad.body)); const same = ctx.api('GET', '/v1/refunds/' + r.body.id).body; ctx.assert(same.amount === 300 && same.status === 'pending', 'refund unchanged by the refused update'); }"
  full_refund_marks_charge:
    description: Refund a charge with no amount, check it is fully refunded, refuse more, cancel the refund, and check the charge is reopened.
    script: "(ctx) => { const c = ctx.api('POST', '/v1/charges', { amount: 800, currency: 'usd', customer: 'acc_cus_t7' }); const r = ctx.api('POST', '/v1/refunds', { charge: c.body.id }); ctx.assert(r.status === 200 && r.body.amount === 800, 'no amount refunds the remainder: ' + JSON.stringify(r.body)); const full = ctx.api('GET', '/v1/charges/' + c.body.id).body; ctx.assert(full.amount_refunded === 800 && full.refunded === true, 'fully refunded: ' + JSON.stringify(full)); const more = ctx.api('POST', '/v1/refunds', { charge: c.body.id, amount: 1 }); ctx.assert(more.status === 400, 'no more refunds, got ' + more.status); const x = ctx.api('POST', '/v1/refunds/' + r.body.id + '/cancel', {}); ctx.assert(x.status === 200, 'cancel: ' + JSON.stringify(x.body)); const back = ctx.api('GET', '/v1/charges/' + c.body.id).body; ctx.assert(back.amount_refunded === 0 && back.refunded === false, 'charge reopened: ' + JSON.stringify(back)); }"
  refund_list_by_charge:
    description: Refund two charges, list refunds filtered to the first charge, and check only its refund is returned.
    script: "(ctx) => { const a = ctx.api('POST', '/v1/charges', { amount: 900, currency: 'usd', customer: 'acc_cus_t8' }); const b = ctx.api('POST', '/v1/charges', { amount: 900, currency: 'usd', customer: 'acc_cus_t8' }); const ra = ctx.api('POST', '/v1/refunds', { charge: a.body.id, amount: 100 }); const rb = ctx.api('POST', '/v1/refunds', { charge: b.body.id, amount: 200 }); ctx.assert(ra.status === 200 && rb.status === 200, 'two refunds'); const list = ctx.api('GET', '/v1/refunds?charge=' + a.body.id); ctx.assert(list.status === 200, 'list: ' + JSON.stringify(list.body)); ctx.assert(list.body.data.length === 1 && list.body.data[0].id === ra.body.id, 'only the refund of charge a: ' + JSON.stringify(list.body)); ctx.assert(list.body.data.every((r) => r.charge === a.body.id), 'every row names charge a'); }"
  refund_over_amount_refused:
    description: Charge 1000, refund 600, refuse 500 with 400 and check the charge and its refund list are unchanged, refuse a refund with no charge, refund the remaining 400 so the total reaches 1000 and the charge is refunded, then refuse any further refund.
    script: "(ctx) => { const c = ctx.api('POST', '/v1/charges', { amount: 1000, currency: 'usd', customer: 'acc_cus_t3' }); ctx.assert(c.status === 200, 'charge: ' + JSON.stringify(c.body)); const r1 = ctx.api('POST', '/v1/refunds', { charge: c.body.id, amount: 600 }); ctx.assert(r1.status === 200 && r1.body.status === 'pending', 'first partial refund pending: ' + JSON.stringify(r1.body)); const over = ctx.api('POST', '/v1/refunds', { charge: c.body.id, amount: 500 }); ctx.assert(over.status === 400, 'refund above the remaining 400 refused, got ' + over.status); const mid = ctx.api('GET', '/v1/charges/' + c.body.id).body; ctx.assert(mid.amount_refunded === 600 && mid.refunded === false, 'refused refund changed nothing on the charge: ' + JSON.stringify(mid)); const rows = ctx.api('GET', '/v1/refunds?charge=' + c.body.id).body.data; ctx.assert(rows.length === 1 && rows[0].id === r1.body.id, 'refused refund wrote no row: ' + JSON.stringify(rows)); const none = ctx.api('POST', '/v1/refunds', { amount: 100 }); ctx.assert(none.status === 400, 'refund without a charge refused, got ' + none.status); const r2 = ctx.api('POST', '/v1/refunds', { charge: c.body.id, amount: 400 }); ctx.assert(r2.status === 200, 'refund of exactly the remainder: ' + JSON.stringify(r2.body)); const full = ctx.api('GET', '/v1/charges/' + c.body.id).body; ctx.assert(full.amount_refunded === 1000 && full.refunded === true, 'total reached the amount, charge refunded: ' + JSON.stringify(full)); const more = ctx.api('POST', '/v1/refunds', { charge: c.body.id, amount: 1 }); ctx.assert(more.status === 400, 'nothing left to refund, got ' + more.status); }"
tasks:
  refund_team_plan_in_full:
    difficulty: easy
    instruction: Refund the full amount of the charge described 'Team plan, March renewal'. Create one refund with no amount, so the whole remaining amount is refunded. Change nothing else.
    grader: "(ctx) => { const c = ctx.seed.list('charge', { where: { description: 'Team plan, March renewal' } })[0]; if (!c) return 0; if (ctx.changes().length === 0) return 0; const news = ctx.db.list('refund', { where: { charge: c.id } }).filter((r) => ctx.seed.get('refund', r.id) === null); ctx.guardChanges('one new refund on the target charge and its refunded totals, nothing else', [ { entity: 'charge', id: c.id, kind: 'updated', fields: ['amount_refunded', 'refunded'] }, ...news.map((r) => ({ entity: 'refund', id: r.id, kind: 'created', fields: ['charge', 'amount', 'currency', 'status', 'reason', 'metadata'] })) ]); ctx.goal(0.5, 'one refund exists on the charge', news.length === 1); ctx.goal(0.5, 'the refund covers the full amount and is pending', news.length === 1 && news[0].amount === c.amount && news[0].status === 'pending'); return ctx.score(); }"
    solution: "(ctx) => { const list = ctx.api('GET', '/v1/charges?customer=cus_8mPq2Lw1'); ctx.assert(list.status === 200, 'list charges: ' + JSON.stringify(list.body)); const target = list.body.data.find((c) => c.description === 'Team plan, March renewal'); ctx.assert(target, 'charge Team plan, March renewal not found'); const r = ctx.api('POST', '/v1/refunds', { charge: target.id }); ctx.assert(r.status === 200 && r.body.amount === target.amount, 'full refund failed: ' + JSON.stringify(r.body)); }"
