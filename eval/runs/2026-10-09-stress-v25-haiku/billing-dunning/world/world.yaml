actions:
  create_subscription:
    method: POST
    path: /subscriptions
    description: Subscribe a customer to a plan on one of their cards. The subscription starts active and opens one invoice at the plan price.
    input:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      plan_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: plan
        onDelete: restrict
      payment_method_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
    handler: "(ctx) => { const b = ctx.body; const cus = ctx.db.get('customer', b.customer_id); if (cus === null) ctx.fail(404, 'not_found', 'customer ' + b.customer_id + ' not found'); const plan = ctx.db.get('plan', b.plan_id); if (plan === null) ctx.fail(404, 'not_found', 'plan ' + b.plan_id + ' not found'); const pm = ctx.db.get('payment_method', b.payment_method_id); if (pm === null) ctx.fail(404, 'not_found', 'payment method ' + b.payment_method_id + ' not found'); if (pm.customer_id !== cus.id) ctx.fail(422, 'payment_method.not_owned', 'payment method ' + pm.id + ' does not belong to customer ' + cus.id); const sub = ctx.db.create('subscription', { customer_id: cus.id, plan_id: plan.id, payment_method_id: pm.id, status: 'active', cancelled_at: null }); ctx.db.create('invoice', { subscription_id: sub.id, number: 'INV-' + sub.id, amount: plan.price, status: 'open', attempts: 0, first_failed_at: null, next_retry_at: null, paid_at: null }); return { status: 201, body: sub }; }"
  cancel_subscription:
    method: POST
    path: /subscriptions/{id}/cancel
    description: Cancel a subscription. Its open and past_due invoices are voided and cancelled_at is set. A cancelled subscription cannot be cancelled again.
    input: {}
    handler: "(ctx) => { const s = ctx.db.get('subscription', ctx.params.id); if (s === null) ctx.fail(404, 'not_found', 'subscription ' + ctx.params.id + ' not found'); if (s.status === 'cancelled') ctx.fail(409, 'invalid_state', 'subscription ' + s.id + ' is already cancelled'); const now = ctx.now(); const invs = ctx.db.list('invoice', { where: { subscription_id: s.id } }); for (const i of invs) { if (i.status === 'open' || i.status === 'past_due') ctx.db.update('invoice', i.id, { status: 'void', next_retry_at: null }); } return { status: 200, body: ctx.db.update('subscription', s.id, { status: 'cancelled', cancelled_at: now }) }; }"
  update_subscription_payment_method:
    method: POST
    path: /subscriptions/{id}/payment_method
    description: Put another card on a subscription. The card must belong to the subscription customer.
    input:
      payment_method_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
    handler: "(ctx) => { const s = ctx.db.get('subscription', ctx.params.id); if (s === null) ctx.fail(404, 'not_found', 'subscription ' + ctx.params.id + ' not found'); if (s.status === 'cancelled') ctx.fail(409, 'invalid_state', 'subscription ' + s.id + ' is cancelled'); const pm = ctx.db.get('payment_method', ctx.body.payment_method_id); if (pm === null) ctx.fail(404, 'not_found', 'payment method ' + ctx.body.payment_method_id + ' not found'); if (pm.customer_id !== s.customer_id) ctx.fail(422, 'payment_method.not_owned', 'payment method ' + pm.id + ' does not belong to the subscription customer'); return { status: 200, body: ctx.db.update('subscription', s.id, { payment_method_id: pm.id }) }; }"
  charge_invoice:
    method: POST
    path: /invoices/{id}/charge
    description: "Charge an invoice on the subscription card. A success marks it paid and returns a past_due subscription to active. A decline starts or continues dunning: retries follow 1, 3 and 7 days after the first failure, and the fourth failed attempt cancels the subscription and voids the invoice. Paid, void and cancelled-subscription invoices answer 409."
    input: {}
    handler: "(ctx) => { const inv = ctx.db.get('invoice', ctx.params.id); if (inv === null) ctx.fail(404, 'not_found', 'invoice ' + ctx.params.id + ' not found'); if (inv.status === 'paid' || inv.status === 'void') ctx.fail(409, 'invalid_state', 'invoice ' + inv.number + ' is ' + inv.status + ' and cannot be charged'); const sub = ctx.db.get('subscription', inv.subscription_id); if (sub.status === 'cancelled') ctx.fail(409, 'invalid_state', 'subscription ' + sub.id + ' is cancelled'); const pm = ctx.db.get('payment_method', sub.payment_method_id); const now = ctx.now(); const attempts = inv.attempts + 1; if (pm.card_state === 'good') { ctx.db.create('payment', { invoice_id: inv.id, payment_method_id: pm.id, amount: inv.amount, outcome: 'succeeded' }); ctx.db.update('invoice', inv.id, { status: 'paid', attempts: attempts, paid_at: now, next_retry_at: null }); if (sub.status === 'past_due') ctx.db.update('subscription', sub.id, { status: 'active' }); return { status: 200, body: ctx.db.get('invoice', inv.id) }; } ctx.db.create('payment', { invoice_id: inv.id, payment_method_id: pm.id, amount: inv.amount, outcome: 'failed' }); if (attempts >= 4) { ctx.db.update('invoice', inv.id, { status: 'void', attempts: attempts, next_retry_at: null }); ctx.db.update('subscription', sub.id, { status: 'cancelled', cancelled_at: now }); return { status: 200, body: ctx.db.get('invoice', inv.id) }; } const first = inv.first_failed_at === null ? now : inv.first_failed_at; const days = attempts === 1 ? '1d' : attempts === 2 ? '3d' : '7d'; ctx.db.update('invoice', inv.id, { status: 'past_due', attempts: attempts, first_failed_at: first, next_retry_at: ctx.time.plus(first, days) }); if (sub.status !== 'past_due') ctx.db.update('subscription', sub.id, { status: 'past_due' }); return { status: 200, body: ctx.db.get('invoice', inv.id) }; }"
jobs:
  dunning_retry:
    description: "Retry each past_due invoice whose next_retry_at has come, on the subscription card. Same outcome rules as charge_invoice: success pays the invoice and reactivates the subscription; the fourth failed attempt cancels the subscription and voids the invoice."
    every: 1h
    run: "(ctx) => { const now = ctx.now(); const due = ctx.db.list('invoice', { where: { status: 'past_due' } }).filter((i) => i.next_retry_at !== null && i.next_retry_at <= now); for (const inv of due) { const sub = ctx.db.get('subscription', inv.subscription_id); if (sub === null || sub.status === 'cancelled') continue; const pm = ctx.db.get('payment_method', sub.payment_method_id); const attempts = inv.attempts + 1; if (pm.card_state === 'good') { ctx.db.create('payment', { invoice_id: inv.id, payment_method_id: pm.id, amount: inv.amount, outcome: 'succeeded' }); ctx.db.update('invoice', inv.id, { status: 'paid', attempts: attempts, paid_at: now, next_retry_at: null }); if (sub.status === 'past_due') ctx.db.update('subscription', sub.id, { status: 'active' }); continue; } ctx.db.create('payment', { invoice_id: inv.id, payment_method_id: pm.id, amount: inv.amount, outcome: 'failed' }); if (attempts >= 4) { ctx.db.update('invoice', inv.id, { status: 'void', attempts: attempts, next_retry_at: null }); ctx.db.update('subscription', sub.id, { status: 'cancelled', cancelled_at: now }); continue; } const first = inv.first_failed_at === null ? now : inv.first_failed_at; const days = attempts === 1 ? '1d' : attempts === 2 ? '3d' : '7d'; ctx.db.update('invoice', inv.id, { status: 'past_due', attempts: attempts, first_failed_at: first, next_retry_at: ctx.time.plus(first, days) }); } }"
