format: 1
meta:
  name: world
  description: "A subscription billing API. Customers hold cards and subscribe to plans; each subscription bills an invoice per period. A declined charge moves the invoice and subscription to past_due and starts dunning: retries run 1, 3 and 7 days after the first failure, and when the last retry fails the subscription is cancelled and its invoice voided. Agents charge invoices, change a subscription's card, cancel subscriptions and read invoices and payments. Feasible: the core value is stateful billing records that an agent reads and changes through actions."
  resembles: Stripe Billing subscriptions with invoices, card payments and dunning
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-09T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A paying account with a name and a unique email.
    idPrefix: cus
    fields:
      first_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      last_name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
  plan:
    description: A price list entry that subscriptions bill against.
    idPrefix: pln
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
      price:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      interval:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - monthly
          - yearly
  payment_method:
    description: A card on file for a customer. card_state declined simulates an issuer decline.
    idPrefix: pm
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - card
      last_four:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        pattern: ^[0-9]{4}$
      card_state:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - good
          - declined
  subscription:
    description: A customer's recurring subscription to a plan, with its status state machine.
    idPrefix: sub
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      plan_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: plan
        onDelete: restrict
      payment_method_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
      status:
        type: state
        required: true
        nullable: false
        unique: false
        readonly: false
        states:
          - active
          - past_due
          - cancelled
        initial: active
        transitions:
          active:
            - past_due
            - cancelled
          past_due:
            - active
            - past_due
            - cancelled
          cancelled: []
      cancelled_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
  invoice:
    description: One bill of a subscription, with dunning fields attempts, first_failed_at and next_retry_at.
    idPrefix: inv
    fields:
      subscription_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: subscription
        onDelete: restrict
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      status:
        type: state
        required: true
        nullable: false
        unique: false
        readonly: false
        states:
          - open
          - paid
          - past_due
          - void
        initial: open
        transitions:
          open:
            - paid
            - past_due
            - void
          past_due:
            - paid
            - past_due
            - void
          paid: []
          void: []
      attempts:
        type: int
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
      first_failed_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      next_retry_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      paid_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
  payment:
    description: One charge attempt against an invoice, succeeded or failed, on a payment method.
    idPrefix: pay
    fields:
      invoice_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: invoice
        onDelete: restrict
      payment_method_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: payment_method
        onDelete: restrict
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      outcome:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - succeeded
          - failed
