revision: 2
software: Stripe Billing subscriptions with invoices, card payments and dunning
summary: "A subscription billing API. Customers hold cards and subscribe to plans; each subscription bills an invoice per period. A declined charge moves the invoice and subscription to past_due and starts dunning: retries run 1, 3 and 7 days after the first failure, and when the last retry fails the subscription is cancelled and its invoice voided. Agents charge invoices, change a subscription's card, cancel subscriptions and read invoices and payments. Feasible: the core value is stateful billing records that an agent reads and changes through actions."
clock:
  start: 2026-10-09T09:00:00.000Z
  tick: 0s
verdict:
  kind: proceed
entities:
  - name: customer
    purpose: A paying account with a name and a unique email.
    keyFields:
      - first_name
      - last_name
      - email
  - name: plan
    purpose: A price list entry that subscriptions bill against.
    keyFields:
      - name
      - price
      - interval
  - name: payment_method
    purpose: A card on file for a customer. card_state declined simulates an issuer decline.
    keyFields:
      - customer_id
      - kind
      - last_four
      - card_state
  - name: subscription
    purpose: A customer's recurring subscription to a plan, with its status state machine.
    keyFields:
      - customer_id
      - plan_id
      - payment_method_id
      - status
      - cancelled_at
  - name: invoice
    purpose: One bill of a subscription, with dunning fields attempts, first_failed_at and next_retry_at.
    keyFields:
      - subscription_id
      - number
      - amount
      - status
      - attempts
      - first_failed_at
      - next_retry_at
      - paid_at
  - name: payment
    purpose: One charge attempt against an invoice, succeeded or failed, on a payment method.
    keyFields:
      - invoice_id
      - payment_method_id
      - amount
      - outcome
workflows:
  - name: subscription_lifecycle
    entity: subscription
    states:
      - active
      - past_due
      - cancelled
    rules:
      - rule: A new subscription starts active and opens one invoice at the plan price
        by:
          - create_subscription
        test: create_subscription_opens_invoice
      - rule: A declined charge moves the subscription to past_due and records the first failure
        by:
          - charge_invoice
        test: declined_charge_starts_dunning
      - rule: Dunning retries run 1, 3 and 7 days after the first failure; when the last retry fails the subscription is cancelled and its invoice voided
        by:
          - dunning_retry
        test: dunning_retries_then_cancels
      - rule: A successful retry returns the subscription to active
        by:
          - dunning_retry
        test: retry_after_card_fix_restores
      - rule: Cancelling a subscription voids its open and past_due invoices and sets cancelled_at
        by:
          - cancel_subscription
        test: cancel_voids_open_invoices
      - rule: The card on a subscription must belong to the subscription customer
        by:
          - update_subscription_payment_method
        test: payment_method_must_belong
      - rule: Status moves only active to past_due and back, or to cancelled
        schema: subscription.status is a state field whose transitions the engine enforces on every write
    actions:
      - create_subscription
      - cancel_subscription
      - update_subscription_payment_method
  - name: invoice_collection
    entity: invoice
    states:
      - open
      - paid
      - past_due
      - void
    rules:
      - rule: A cancelled subscription accepts no charge
        by:
          - charge_invoice
        test: cancelled_refuses_charge
      - rule: A paid invoice cannot be charged again
        by:
          - charge_invoice
        test: paid_invoice_refuses_charge
      - rule: Invoice numbers are unique
        schema: invoice.number is declared unique
      - rule: An invoice cannot move from paid back to open
        schema: invoice.status is a state field whose transitions the engine enforces
    actions:
      - charge_invoice
jobs:
  - name: dunning_retry
    every: 1h
    rule: For each past_due invoice whose next_retry_at is at or before now, charge its subscription's card. A success marks the invoice paid with paid_at, clears next_retry_at and returns the subscription to active. A failure increments attempts and records a payment failed. The first failure sets next_retry_at to first_failed_at plus 1 day; after attempt 2 the next retry is first_failed_at plus 3 days; after attempt 3 it is first_failed_at plus 7 days. When the 4th attempt fails the subscription is cancelled and the invoice voided.
acceptanceTests:
  - id: create_subscription_opens_invoice
    intent: A new subscription is active and bills one open invoice at the plan price.
    actions:
      - create_subscription
    description: Create a customer, plan and card, subscribe, and check the subscription and its single open invoice.
    script: "(ctx) => { const cus = ctx.api('POST', '/customers', { first_name: 'Ines', last_name: 'Opener', email: 'ines.opener.t1@example.test' }); ctx.assert(cus.status === 201, 'create customer: ' + JSON.stringify(cus.body)); const plan = ctx.api('POST', '/plans', { name: 'Test Plan T1', price: 1500, interval: 'monthly' }); ctx.assert(plan.status === 201, 'create plan: ' + JSON.stringify(plan.body)); const card = ctx.api('POST', '/payment_methods', { customer_id: cus.body.id, kind: 'card', last_four: '7001', card_state: 'good' }); ctx.assert(card.status === 201, 'create card: ' + JSON.stringify(card.body)); const sub = ctx.api('POST', '/subscriptions', { customer_id: cus.body.id, plan_id: plan.body.id, payment_method_id: card.body.id }); ctx.assert(sub.status === 201 && sub.body.status === 'active', 'subscribe: ' + JSON.stringify(sub.body)); const inv = ctx.api('GET', '/invoices?subscription_id=' + sub.body.id).body.data; ctx.assert(inv.length === 1 && inv[0].status === 'open' && inv[0].amount === 1500, 'one open invoice of 1500 expected: ' + JSON.stringify(inv)); }"
  - id: declined_charge_starts_dunning
    intent: 'A declined charge starts dunning: invoice and subscription past_due, one attempt, one failed payment row.'
    actions:
      - charge_invoice
    description: Charge an invoice on a declined card and check the past_due state, the attempt count, the scheduled retry and the failed payment.
    script: "(ctx) => { const cus = ctx.api('POST', '/customers', { first_name: 'Ravi', last_name: 'Declined', email: 'ravi.declined.t2@example.test' }).body; const plan = ctx.api('POST', '/plans', { name: 'Test Plan T2', price: 2000, interval: 'monthly' }).body; const card = ctx.api('POST', '/payment_methods', { customer_id: cus.id, kind: 'card', last_four: '7002', card_state: 'declined' }).body; const sub = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id, payment_method_id: card.id }).body; const inv = ctx.api('GET', '/invoices?subscription_id=' + sub.id).body.data[0]; const r = ctx.api('POST', '/invoices/' + inv.id + '/charge'); ctx.assert(r.status === 200 && r.body.status === 'past_due' && r.body.attempts === 1, 'charge should fail and start dunning: ' + JSON.stringify(r.body)); ctx.assert(r.body.first_failed_at !== null && r.body.next_retry_at !== null, 'the retry is scheduled'); ctx.assert(ctx.api('GET', '/subscriptions/' + sub.id).body.status === 'past_due', 'subscription should be past_due'); const pays = ctx.api('GET', '/payments?invoice_id=' + inv.id).body.data; ctx.assert(pays.length === 1 && pays[0].outcome === 'failed', 'one failed payment expected: ' + JSON.stringify(pays)); }"
  - id: dunning_retries_then_cancels
    intent: Retries run on days 1, 3 and 7 after the first failure; the failure on day 7 cancels the subscription and voids the invoice.
    actions:
      - charge_invoice
    description: Start dunning on a declined card, advance 1, 3 and 7 days so the dunning job fires, and check each retry, the cancellation, the void invoice and four failed payments.
    script: "(ctx) => { const cus = ctx.api('POST', '/customers', { first_name: 'Dana', last_name: 'Retry', email: 'dana.retry.t3@example.test' }).body; const plan = ctx.api('POST', '/plans', { name: 'Test Plan T3', price: 2500, interval: 'monthly' }).body; const card = ctx.api('POST', '/payment_methods', { customer_id: cus.id, kind: 'card', last_four: '7003', card_state: 'declined' }).body; const sub = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id, payment_method_id: card.id }).body; const inv = ctx.api('GET', '/invoices?subscription_id=' + sub.id).body.data[0]; ctx.api('POST', '/invoices/' + inv.id + '/charge'); ctx.advance('1d'); let i = ctx.api('GET', '/invoices/' + inv.id).body; ctx.assert(i.attempts === 2 && i.status === 'past_due', 'day 1 retry should fail: ' + JSON.stringify(i)); ctx.advance('2d'); i = ctx.api('GET', '/invoices/' + inv.id).body; ctx.assert(i.attempts === 3 && i.status === 'past_due', 'day 3 retry should fail: ' + JSON.stringify(i)); ctx.advance('4d'); i = ctx.api('GET', '/invoices/' + inv.id).body; ctx.assert(i.attempts === 4 && i.status === 'void', 'day 7 retry should fail and void: ' + JSON.stringify(i)); ctx.assert(ctx.api('GET', '/subscriptions/' + sub.id).body.status === 'cancelled', 'subscription should be cancelled'); const pays = ctx.api('GET', '/payments?invoice_id=' + inv.id).body.data; ctx.assert(pays.length === 4 && pays.every((p) => p.outcome === 'failed'), 'four failed attempts expected'); }"
  - id: retry_after_card_fix_restores
    intent: After the customer's card is replaced, the next dunning retry collects the invoice and returns the subscription to active.
    actions:
      - charge_invoice
      - update_subscription_payment_method
    description: Fail a charge, move the subscription to a good card, advance one day so the dunning job fires, and check the paid invoice, the active subscription and a succeeded payment.
    script: "(ctx) => { const cus = ctx.api('POST', '/customers', { first_name: 'Fay', last_name: 'Recovered', email: 'fay.recovered.t4@example.test' }).body; const plan = ctx.api('POST', '/plans', { name: 'Test Plan T4', price: 1800, interval: 'monthly' }).body; const bad = ctx.api('POST', '/payment_methods', { customer_id: cus.id, kind: 'card', last_four: '7004', card_state: 'declined' }).body; const good = ctx.api('POST', '/payment_methods', { customer_id: cus.id, kind: 'card', last_four: '7014', card_state: 'good' }).body; const sub = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id, payment_method_id: bad.id }).body; const inv = ctx.api('GET', '/invoices?subscription_id=' + sub.id).body.data[0]; ctx.api('POST', '/invoices/' + inv.id + '/charge'); const u = ctx.api('POST', '/subscriptions/' + sub.id + '/payment_method', { payment_method_id: good.id }); ctx.assert(u.status === 200, 'card change failed: ' + JSON.stringify(u.body)); ctx.advance('1d'); const i = ctx.api('GET', '/invoices/' + inv.id).body; ctx.assert(i.status === 'paid' && i.paid_at !== null, 'retry should pay the invoice: ' + JSON.stringify(i)); ctx.assert(ctx.api('GET', '/subscriptions/' + sub.id).body.status === 'active', 'subscription should be active again'); const pays = ctx.api('GET', '/payments?invoice_id=' + inv.id).body.data; ctx.assert(pays.some((p) => p.outcome === 'succeeded' && p.payment_method_id === good.id), 'a succeeded payment on the good card is expected'); }"
  - id: cancel_voids_open_invoices
    intent: Cancelling an active subscription sets cancelled_at and voids its open invoice; cancelling again is refused.
    actions:
      - cancel_subscription
    description: Cancel an active subscription, check the cancelled subscription, the void invoice and the refused second cancel.
    script: "(ctx) => { const cus = ctx.api('POST', '/customers', { first_name: 'Gus', last_name: 'Cancel', email: 'gus.cancel.t5@example.test' }).body; const plan = ctx.api('POST', '/plans', { name: 'Test Plan T5', price: 900, interval: 'yearly' }).body; const card = ctx.api('POST', '/payment_methods', { customer_id: cus.id, kind: 'card', last_four: '7005', card_state: 'good' }).body; const sub = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id, payment_method_id: card.id }).body; const inv = ctx.api('GET', '/invoices?subscription_id=' + sub.id).body.data[0]; const r = ctx.api('POST', '/subscriptions/' + sub.id + '/cancel'); ctx.assert(r.status === 200 && r.body.status === 'cancelled' && r.body.cancelled_at !== null, 'cancel failed: ' + JSON.stringify(r.body)); ctx.assert(ctx.api('GET', '/invoices/' + inv.id).body.status === 'void', 'open invoice should be void'); const again = ctx.api('POST', '/subscriptions/' + sub.id + '/cancel'); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'second cancel should answer 409 invalid_state: ' + JSON.stringify(again.body)); }"
  - id: cancelled_refuses_charge
    intent: A cancelled subscription's invoice cannot be charged.
    actions:
      - cancel_subscription
      - charge_invoice
    description: Cancel a subscription and try to charge its invoice; the charge answers 409 invalid_state.
    script: "(ctx) => { const cus = ctx.api('POST', '/customers', { first_name: 'Hugo', last_name: 'Frozen', email: 'hugo.frozen.t6@example.test' }).body; const plan = ctx.api('POST', '/plans', { name: 'Test Plan T6', price: 700, interval: 'monthly' }).body; const card = ctx.api('POST', '/payment_methods', { customer_id: cus.id, kind: 'card', last_four: '7006', card_state: 'good' }).body; const sub = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id, payment_method_id: card.id }).body; const inv = ctx.api('GET', '/invoices?subscription_id=' + sub.id).body.data[0]; ctx.assert(ctx.api('POST', '/subscriptions/' + sub.id + '/cancel').status === 200, 'cancel should succeed'); const r = ctx.api('POST', '/invoices/' + inv.id + '/charge'); ctx.assert(r.status === 409 && r.body.error.code === 'invalid_state', 'charge should be refused with invalid_state: ' + JSON.stringify(r.body)); ctx.assert(ctx.api('GET', '/payments?invoice_id=' + inv.id).body.data.length === 0, 'no payment row should be written'); }"
  - id: paid_invoice_refuses_charge
    intent: A paid invoice cannot be charged again; the second charge answers 409 invalid_state and writes no payment row.
    actions:
      - charge_invoice
    description: Charge an invoice on a good card so it is paid, then charge it again and check the 409 invalid_state refusal and the single succeeded payment.
    script: "(ctx) => { const cus = ctx.api('POST', '/customers', { first_name: 'Iris', last_name: 'Settled', email: 'iris.settled.t8@example.test' }).body; const plan = ctx.api('POST', '/plans', { name: 'Test Plan T8', price: 1200, interval: 'monthly' }).body; const card = ctx.api('POST', '/payment_methods', { customer_id: cus.id, kind: 'card', last_four: '7008', card_state: 'good' }).body; const sub = ctx.api('POST', '/subscriptions', { customer_id: cus.id, plan_id: plan.id, payment_method_id: card.id }).body; const inv = ctx.api('GET', '/invoices?subscription_id=' + sub.id).body.data[0]; const paid = ctx.api('POST', '/invoices/' + inv.id + '/charge'); ctx.assert(paid.status === 200 && paid.body.status === 'paid', 'first charge should pay: ' + JSON.stringify(paid.body)); const again = ctx.api('POST', '/invoices/' + inv.id + '/charge'); ctx.assert(again.status === 409 && again.body.error.code === 'invalid_state', 'a paid invoice cannot be charged again: ' + JSON.stringify(again.body)); ctx.assert(ctx.api('GET', '/payments?invoice_id=' + inv.id).body.data.length === 1, 'only the first payment row should exist'); }"
  - id: payment_method_must_belong
    intent: A subscription can only take a card of its own customer; another customer's card is refused and the subscription keeps its card.
    actions:
      - update_subscription_payment_method
    description: Try to put another customer's card on a subscription; the call answers 422 payment_method.not_owned and the subscription keeps its card.
    script: "(ctx) => { const a = ctx.api('POST', '/customers', { first_name: 'Ada', last_name: 'Owner', email: 'ada.owner.t7@example.test' }).body; const b = ctx.api('POST', '/customers', { first_name: 'Bo', last_name: 'Stranger', email: 'bo.stranger.t7@example.test' }).body; const plan = ctx.api('POST', '/plans', { name: 'Test Plan T7', price: 1100, interval: 'monthly' }).body; const cardA = ctx.api('POST', '/payment_methods', { customer_id: a.id, kind: 'card', last_four: '7007', card_state: 'good' }).body; const cardB = ctx.api('POST', '/payment_methods', { customer_id: b.id, kind: 'card', last_four: '7017', card_state: 'good' }).body; const sub = ctx.api('POST', '/subscriptions', { customer_id: a.id, plan_id: plan.id, payment_method_id: cardA.id }).body; const r = ctx.api('POST', '/subscriptions/' + sub.id + '/payment_method', { payment_method_id: cardB.id }); ctx.assert(r.status === 422 && r.body.error.code === 'payment_method.not_owned', 'foreign card should be refused: ' + JSON.stringify(r.body)); ctx.assert(ctx.api('GET', '/subscriptions/' + sub.id).body.payment_method_id === cardA.id, 'the subscription keeps its card'); }"
routes:
  - id: create_customer
    method: POST
    path: /customers
    purpose: Create a customer for tests and agents.
  - id: list_customers
    method: GET
    path: /customers
    purpose: List customers, filter by email or last_name.
  - id: get_customer
    method: GET
    path: /customers/{id}
    purpose: Read one customer.
  - id: create_plan
    method: POST
    path: /plans
    purpose: Create a plan.
  - id: list_plans
    method: GET
    path: /plans
    purpose: List plans.
  - id: get_plan
    method: GET
    path: /plans/{id}
    purpose: Read one plan.
  - id: create_payment_method
    method: POST
    path: /payment_methods
    purpose: Add a card to a customer.
  - id: list_payment_methods
    method: GET
    path: /payment_methods
    purpose: List cards, filter by customer_id.
  - id: get_payment_method
    method: GET
    path: /payment_methods/{id}
    purpose: Read one card.
  - id: list_subscriptions
    method: GET
    path: /subscriptions
    purpose: List subscriptions, filter by customer_id and status.
  - id: get_subscription
    method: GET
    path: /subscriptions/{id}
    purpose: Read one subscription.
  - id: list_invoices
    method: GET
    path: /invoices
    purpose: List invoices, filter by subscription_id and status.
  - id: get_invoice
    method: GET
    path: /invoices/{id}
    purpose: Read one invoice.
  - id: list_payments
    method: GET
    path: /payments
    purpose: List payment attempts, filter by invoice_id and outcome.
  - id: get_payment
    method: GET
    path: /payments/{id}
    purpose: Read one payment attempt.
seed:
  rowsPerEntity:
    customer: 12
    plan: 3
    payment_method: 16
    subscription: 12
    invoice: 28
    payment: 30
  mix: 'Named customers: Ruth Adeyemi (ruth.adeyemi@example.com) has one active Basic subscription; Marco Bellini (marco.bellini@example.com) has a past_due subscription whose invoice is past_due, a declined card on file and a good card ending 4417; Hana Kowalski (hana.kowalski@example.com) has a past_due Plus subscription with a past_due invoice, an active Basic subscription and a good card ending 2208. Other rows spread over all states. Seeded past_due invoices carry attempts and first_failed_at before the clock start, and next_retry_at after it. Seed never uses last_four values 7001 to 7099 or emails under example.test, which the tests create.'
  stateMix:
    subscription:
      active: 58
      past_due: 25
      cancelled: 17
    invoice:
      open: 15
      paid: 60
      past_due: 15
      void: 10
tasks:
  - id: cancel_ruth_subscription
    difficulty: easy
    kind: irreversible
    intent: Ruth Adeyemi (ruth.adeyemi@example.com) wants to stop her subscription. Cancel her active subscription.
    actions:
      - cancel_subscription
    decoyIdea: cancels the subscription of a different customer with a similar plan
  - id: collect_marco_with_new_card
    difficulty: medium
    kind: permissions
    intent: Marco Bellini's subscription is past due because his card was declined. He has added a new card ending in 4417. Put that card on his subscription and collect the unpaid invoice.
    actions:
      - update_subscription_payment_method
      - charge_invoice
    decoyIdea: charges the unpaid invoice on the declined card without changing the subscription's card
    pressure:
      states:
        - subscription.past_due
        - invoice.past_due
  - id: move_hana_plus_and_cancel_basic
    difficulty: hard
    kind: irreversible
    intent: Hana Kowalski's Plus subscription is past due. Put her card ending in 2208 on the Plus subscription and collect its unpaid invoice. Then cancel her other subscription, the Basic one, which she no longer wants.
    actions:
      - update_subscription_payment_method
      - charge_invoice
      - cancel_subscription
    decoyIdea: cancels the past_due Plus subscription instead of the Basic one, or skips the card change and charges the declined card
    pressure:
      states:
        - subscription.past_due
        - invoice.past_due
      distractors: subscription
open_questions:
  - question: Are retries counted from the first failure or from the previous retry?
    default_answer: 'From the first failure: days 1, 3 and 7 after it.'
  - question: Does the subscription's invoice get voided when dunning cancels the subscription?
    default_answer: Yes, the open or past_due invoice becomes void.
  - question: Does a manual charge reset the dunning schedule?
    default_answer: No; it counts as an attempt and only a success clears the schedule.
  - question: Is the currency USD?
    default_answer: Yes, amounts in cents.
  - question: Are renewals generated each period?
    default_answer: No; one invoice is created with the subscription.
assumptions:
  - decision: Dunning retries are 1, 3 and 7 days after the first failure (first_failed_at); the fourth attempt, the day-7 retry, failing cancels the subscription and voids its invoice.
    why: The request says retries after 1, 3 and 7 days then cancel; anchoring to the first failure makes the schedule deterministic.
  - decision: The first failed charge sets next_retry_at to first_failed_at plus 1 day; each later failure sets it to the next offset (3 days after attempt 2, 7 days after attempt 3).
    why: The day-1 retry needs a stored due time for the hourly job to find; without it the schedule of retries 1, 3 and 7 days is undefined.
  - decision: The dunning job runs every 1h so each retry fires at its due time within the advance that reaches it.
    why: A daily job would fire retries late; hourly keeps day-exact retries without a per-invoice timer.
  - decision: Each invoice is created with its subscription at the plan price in USD cents, and no recurring renewal cycles are generated.
    why: The request names invoices and card payments, not period renewal; one invoice per subscription keeps the world finite.
  - decision: A card decline is simulated by card_state declined on the payment method.
    why: No payment network exists in the world; a declared field is the only deterministic way to choose the outcome.
  - decision: A manual charge on a past_due invoice counts as an attempt and does not reset the dunning schedule; a success clears it.
    why: Keeps attempt counting one rule, consistent with dunning being the sole retry driver.
  - decision: Tests use emails under example.test, plan names starting with Test Plan, and last_four 7001 to 7099; the seed avoids these values.
    why: Avoids test.seed_collision while keeping test rows unique.
  - decision: Clock starts at 2026-10-09T09:00:00.000Z with tick 0s, after all seeded history.
    why: Explicit deterministic time; seeded history precedes the start.
outOfScope:
  - what: Recurring renewal billing cycles and proration
    why: Requested scope is dunning and payment collection, not the period engine.
  - what: Refunds and credit notes
    why: Not mentioned in the request.
  - what: Tax, currencies other than USD, and discounts
    why: Not mentioned in the request.
  - what: Webhooks and dunning emails
    why: Outbound notifications are not stateful records an agent reads.
changes: []
