format: 1
meta:
  name: gen_it_asset_tracker
  description: An IT asset tracker. Laptops move between in-stock, assigned, in-repair, lost and retired. Employees check laptops out and back in. Repair tickets take a laptop out of service until complete. Quarterly audits snapshot the laptops at a location, record whether each was found, and close by flagging missing laptops as lost.
  resembles: Snipe-IT style IT asset management (laptops, checkouts, maintenance, audits)
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-07T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  employee:
    description: A person who can hold laptops. active false means offboarded.
    idPrefix: emp
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      department:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      active:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  laptop:
    description: A tracked laptop with a lifecycle state and a location. asset_tag and serial are unique.
    idPrefix: lap
    fields:
      asset_tag:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 40
      serial:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 60
      model:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      location:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      purchased_on:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      status:
        type: state
        description: Lifecycle. assign_laptop, return_laptop, open_repair, complete_repair, retire_laptop and close_audit move it. retired is final.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - in_stock
          - assigned
          - in_repair
          - lost
          - retired
        initial: in_stock
        transitions:
          in_stock:
            - assigned
            - in_repair
            - lost
            - retired
          assigned:
            - in_stock
            - in_repair
            - lost
          in_repair:
            - in_stock
            - lost
          lost:
            - retired
          retired: []
  assignment:
    description: A checkout of a laptop to an employee. active until the laptop is returned, repaired or found missing.
    idPrefix: asg
    fields:
      laptop_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: laptop
        onDelete: restrict
      employee_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: employee
        onDelete: restrict
      assigned_at:
        type: datetime
        required: true
        nullable: false
        unique: false
        readonly: false
        default: now
      returned_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: false
      active:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: true
  repair_ticket:
    description: A repair job on a laptop. Open until completed. Open tickets older than 7 days are flagged stale by a daily job.
    idPrefix: rep
    fields:
      laptop_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: laptop
        onDelete: restrict
      issue:
        type: text
        required: true
        nullable: false
        unique: false
        readonly: false
      status:
        type: state
        description: open until complete_repair, then completed.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - open
          - completed
        initial: open
        transitions:
          open:
            - completed
          completed: []
      stale:
        type: bool
        description: Set by the flag_stale_repairs job.
        required: false
        nullable: false
        unique: false
        readonly: false
        default: false
      cost:
        type: money
        description: Repair cost in cents, recorded on completion.
        required: false
        nullable: true
        unique: false
        readonly: false
        currency: USD
        min: 0
      resolution:
        type: text
        description: What was done, recorded on completion.
        required: false
        nullable: true
        unique: false
        readonly: false
  audit:
    description: A quarterly audit of the laptops at one location.
    idPrefix: aud
    fields:
      quarter:
        type: string
        description: Such as 2026-Q4.
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 20
      location:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 80
      status:
        type: state
        description: planned until start_audit, in_progress until close_audit, then closed.
        required: false
        nullable: false
        unique: false
        readonly: false
        states:
          - planned
          - in_progress
          - closed
        initial: planned
        transitions:
          planned:
            - in_progress
          in_progress:
            - closed
          closed: []
      found_count:
        type: int
        description: Set on close.
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
      missing_count:
        type: int
        description: Set on close.
        required: false
        nullable: false
        unique: false
        readonly: false
        min: 0
        default: 0
  audit_item:
    description: One laptop line in an audit with its expected holder and verification result.
    idPrefix: aui
    fields:
      audit_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: audit
        onDelete: cascade
      laptop_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: laptop
        onDelete: restrict
      expected_holder_id:
        type: ref
        description: Who held the laptop when the audit started. null when it was in stock.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: employee
        onDelete: nullify
      result:
        type: enum
        required: false
        nullable: false
        unique: false
        readonly: false
        values:
          - pending
          - found
          - missing
          - mismatch
        default: pending
