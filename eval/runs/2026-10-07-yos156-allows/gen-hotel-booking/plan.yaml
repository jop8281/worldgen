revision: 2
software: Cloudbeds / Opera-style hotel property management system (PMS) reservations API
summary: A single-property hotel booking system. Room types carry a nightly rate and capacity, rooms belong to a type, guests make reservations for a specific room over a half-open stay window [check-in 15:00, check-out 11:00). The engine refuses overlapping non-cancelled reservations on the same room (same-day turnover is allowed). Cancelling within 48 hours of check-in charges a one-night fee, posted as a folio charge, and a job marks unclaimed arrivals as no-shows. Status changes happen only through actions so the overlap and fee rules cannot be bypassed. This revision only declares, for every task, the allows list (entities, kinds, exact update fields and target-row where) taken from the task instruction.
clock:
  start: 2026-10-06T09:00:00.000Z
  tick: 1s
verdict:
  kind: proceed
entities:
  - name: room_type
    purpose: A category of room with a base nightly rate and capacity, such as Standard Queen or Executive Suite.
    keyFields:
      - name (unique)
      - description
      - capacity (int)
      - nightly_rate (money USD)
      - 'bed_config (enum: single, double, queen, king, twin)'
  - name: room
    purpose: A physical room that can be booked. Housekeeping state gates check-in and bookability.
    keyFields:
      - number (unique string)
      - floor (int)
      - room_type_id (ref room_type)
      - 'housekeeping (enum: clean, dirty, out_of_service)'
  - name: guest
    purpose: A person who books and stays.
    keyFields:
      - name
      - email (unique, email)
      - phone
      - 'loyalty_tier (enum: none, silver, gold)'
  - name: reservation
    purpose: A booking of one room by one guest for a stay window. Status is readonly and moved only by actions. Overlap and cancellation-fee rules live here.
    keyFields:
      - guest_id (ref guest)
      - room_id (ref room)
      - check_in (datetime, 15:00 UTC)
      - check_out (datetime, 11:00 UTC)
      - nights (int)
      - adults (int)
      - nightly_rate (money, snapshot of the room type rate at booking)
      - total (money = nights x nightly_rate)
      - 'status (state: confirmed, checked_in, checked_out, cancelled, no_show)'
      - cancelled_at (datetime, nullable)
      - cancellation_fee (money, readonly, default 0)
      - special_requests (text, nullable)
  - name: folio_charge
    purpose: 'A charge posted against a reservation: room revenue at check-out, or a cancellation or no-show fee. Written by actions and jobs only.'
    keyFields:
      - reservation_id (ref reservation)
      - 'kind (enum: room, cancellation_fee, no_show_fee)'
      - amount (money USD)
      - description (string)
workflows:
  - name: reservation_lifecycle
    entity: reservation
    states:
      - confirmed
      - checked_in
      - checked_out
      - cancelled
      - no_show
    rules:
      - 'create_reservation: guest and room must exist, room housekeeping must not be out_of_service, check_out_date must be after check_in_date, adults <= room type capacity, check_in must not be in the past (day granularity). nights, nightly_rate (from room type) and total are computed. Status starts confirmed.'
      - 'No overlap: refuse with 409 room_unavailable if any confirmed, checked_in or checked_out reservation on the same room has check_in < new check_out and check_out > new check_in. Cancelled and no_show are ignored. The error names the conflicting reservation id.'
      - 'cancel_reservation: only confirmed. If now >= check_in, 409. If minutes from now to check_in <= 48h (2880 min), set cancellation_fee to nightly_rate, create a folio_charge cancellation_fee for one night; otherwise fee 0 and no charge. Set cancelled_at to now.'
      - 'check_in_reservation: only confirmed, now must be at or after the 00:00 of the check-in day, room housekeeping must be clean (409 room_not_ready otherwise).'
      - 'check_out_reservation: only checked_in. Creates a folio_charge of kind room for total and sets the room housekeeping to dirty.'
      - 'change_room: only confirmed. New room must differ, not be out_of_service, have capacity >= adults and have no overlap for the same dates. Total and nightly_rate stay as booked.'
      - 'mark_no_shows job: confirmed reservations whose check_in is at least 24h in the past become no_show, with a one-night no_show_fee folio_charge and cancellation_fee unchanged.'
      - cancelled, checked_out and no_show are final.
      - 'find_available_rooms: returns clean or dirty rooms (not out_of_service) with no overlapping active reservation for the range, filtered by optional room_type_id. Writes nothing.'
    actions:
      - create_reservation
      - cancel_reservation
      - check_in_reservation
      - check_out_reservation
      - change_room
      - find_available_rooms
jobs:
  - name: mark_no_shows
    every: 1h
    rule: Every hour, each confirmed reservation whose check_in is at least 24 hours before now moves to no_show and gets a one-night no_show_fee folio_charge at the reservation's nightly_rate. Frees the room for new overlapping bookings.
acceptanceTests: []
routes:
  - id: list_room_types
    method: GET
    path: /room_types
    purpose: List room types, filter by bed_config, sort by nightly_rate.
  - id: get_room_type
    method: GET
    path: /room_types/{id}
    purpose: Fetch one room type.
  - id: list_rooms
    method: GET
    path: /rooms
    purpose: List rooms, filter by room_type_id, floor, housekeeping; search by number.
  - id: get_room
    method: GET
    path: /rooms/{id}
    purpose: Fetch one room.
  - id: update_room
    method: PATCH
    path: /rooms/{id}
    purpose: Update housekeeping status (clean, dirty, out_of_service) and floor.
  - id: list_guests
    method: GET
    path: /guests
    purpose: List guests, filter by loyalty_tier, search by name and email.
  - id: get_guest
    method: GET
    path: /guests/{id}
    purpose: Fetch one guest.
  - id: create_guest
    method: POST
    path: /guests
    purpose: Register a new guest.
  - id: update_guest
    method: PATCH
    path: /guests/{id}
    purpose: Edit guest contact details or loyalty tier.
  - id: list_reservations
    method: GET
    path: /reservations
    purpose: List reservations, filter by status, room_id, guest_id; sort by check_in and created_at; paged at 25.
  - id: get_reservation
    method: GET
    path: /reservations/{id}
    purpose: Fetch one reservation.
  - id: update_reservation
    method: PATCH
    path: /reservations/{id}
    purpose: Edit special_requests and adults only. Status, room and dates are readonly and change only through actions.
  - id: list_reservation_charges
    method: GET
    path: /reservations/{reservation_id}/charges
    purpose: List folio charges for a reservation.
  - id: list_charges
    method: GET
    path: /charges
    purpose: List all folio charges, filter by kind and reservation_id.
  - id: create_reservation
    method: POST
    path: /reservations
    purpose: 'Action: book a room for a guest. Refuses overlap (409 room_unavailable), out_of_service rooms, over-capacity, bad dates.'
  - id: cancel_reservation
    method: POST
    path: /reservations/{id}/cancel
    purpose: 'Action: cancel a confirmed reservation. Charges a one-night fee when check-in is 48 hours or less away.'
  - id: check_in_reservation
    method: POST
    path: /reservations/{id}/check_in
    purpose: 'Action: check in a confirmed reservation on or after its check-in day if the room is clean.'
  - id: check_out_reservation
    method: POST
    path: /reservations/{id}/check_out
    purpose: 'Action: check out a checked-in guest, post the room charge, mark the room dirty.'
  - id: change_room
    method: POST
    path: /reservations/{id}/change_room
    purpose: 'Action: move a confirmed reservation to another room for the same dates, re-checking overlap and capacity; rate stays the original snapshot.'
  - id: find_available_rooms
    method: POST
    path: /rooms/available
    purpose: 'Action (read only): rooms free for a date range, optionally of one room type.'
seed:
  rowsPerEntity:
    room_type: 5
    room: 42
    guest: 70
    reservation: 130
    folio_charge: 75
  mix: 'Reservations: ~35% confirmed (mostly future, a handful arriving within 48h and a few just over 48h), ~10% checked_in, ~30% checked_out, ~18% cancelled (about a third with a one-night fee because they cancelled inside 48h), ~7% no_show. No two non-cancelled, non-no_show reservations overlap on one room; the seed is built room by room along a timeline so same-day turnovers exist. Rooms: ~80% clean, ~15% dirty, 2 out_of_service. Room types: five tiers with rates from 119.00 to 489.00. Guests: 60% no loyalty, 28% silver, 12% gold; a few guests share a surname and one guest has several future reservations. Charges: one room charge per checked_out reservation, one fee per fee-bearing cancellation and per no_show. Over 25 reservations so listing is paged.'
tasks:
  - id: cancel_distant_reservation
    difficulty: easy
    intent: "Cancel the confirmed reservation of the guest Eleanor Whitfield, whose stay starts well over 48 hours from now. The agent must find the guest, find their only confirmed reservation and call cancel. The grader checks status cancelled, cancellation_fee 0, no fee charge, and no other changes. ALLOWS (from the instruction): reservation, kind updated, fields [status, cancelled_at, cancellation_fee], where { guest_id: Eleanor Whitfield's guest id, status: confirmed } (her one confirmed reservation). No entity may be created or deleted (the fee is 0, so no folio_charge). Nothing on Daniel Whitfield's reservations, rooms or guests may change."
    decoyIdea: Cancels the confirmed reservation of a different guest sharing the surname Whitfield (Daniel Whitfield).
  - id: cancel_arriving_tomorrow_with_fee
    difficulty: medium
    intent: "A guest named Marcus Okafor phoned to cancel his booking that starts tomorrow. Cancel it. The fee rule applies automatically; the grader checks the reservation is cancelled with a cancellation_fee equal to exactly one night's snapshot rate and exactly one cancellation_fee folio_charge exists, and that his other, later confirmed reservation is untouched. ALLOWS (from the instruction): (1) reservation, kind updated, fields [status, cancelled_at, cancellation_fee], where { guest_id: Marcus Okafor's guest id, status: confirmed, check_in: the seeded check_in of the booking starting tomorrow }; (2) folio_charge, kind created, where { kind: cancellation_fee } (the automatic one-night fee). Nothing is deleted, and his later confirmed reservation is not changed."
    decoyIdea: Cancels Marcus Okafor's later confirmed reservation (more than 48h out, no fee) instead of the one starting tomorrow; or cancels both.
  - id: move_booking_to_free_room
    difficulty: medium
    intent: "The guest in room 305 for next weekend's reservation (reservation of guest Priya Nair) needs a different room because of a plumbing issue. Move that reservation to any free room of the same room type for the same dates. The grader checks room_id changed to a room of the same room_type with no overlap, dates, total and status unchanged, and no other rows changed. ALLOWS (from the instruction): reservation, kind updated, fields [room_id], where { guest_id: Priya Nair's guest id, room_id: room 305's id, status: confirmed }. No entity may be created or deleted, and no room, guest or folio_charge changes."
    decoyIdea: Moves the reservation to a free room of a different (cheaper) room type, or to a room that is free but out_of_service, or cancels and recreates the booking, which changes the id and may trigger a fee.
  - id: relocate_all_from_maintenance_room
    difficulty: hard
    intent: "Room 214 was just marked out_of_service for repairs. Move every future confirmed reservation currently on room 214 to another room of the same room type with no conflict, keeping dates, without cancelling anything, and without moving reservations that are already checked_in, checked_out or cancelled. Some targets need different replacement rooms because free rooms differ by date, and the reservation list needs paging to see all of them. The grader returns the fraction of target reservations correctly relocated, 0 if any non-target reservation changed or any cancellation or fee charge was created. ALLOWS (from the instruction): reservation, kind updated, fields [room_id], where { room_id: room 214's id, status: confirmed } (the future confirmed reservations on room 214). No entity may be created or deleted, and room 214 itself and all other rows stay unchanged."
    decoyIdea: Reads only the first page of /reservations, or relocates every reservation on room 214 including the checked_in and past ones, or puts two targets into the same replacement room with overlapping dates, which the engine refuses, or cancels the reservations (incurring fees for those inside 48h).
open_questions:
  - question: Is the 48-hour window inclusive at exactly 48:00 before check-in, and is it measured against the check-in time or the check-in date?
    default_answer: Inclusive, measured against the check-in datetime (15:00 UTC on the arrival day).
  - question: 'How big is the cancellation fee: first night only, or the first night at the booked rate regardless of the total?'
    default_answer: One night at the reservation's snapshot nightly_rate.
  - question: Do no-shows incur the fee as well?
    default_answer: Yes, a one-night no_show_fee posted by an hourly job 24h after check-in.
  - question: Can two reservations touch on the same room when one checks out the day the next checks in?
    default_answer: Yes. Intervals are half-open, with check-out 11:00 and check-in 15:00.
  - question: Can one reservation contain several rooms?
    default_answer: No. One reservation, one room. Group bookings are multiple reservations.
  - question: Are there rate plans, taxes, deposits or payments?
    default_answer: No. Flat room-type rate, USD, no payments.
  - question: Should clients be able to PATCH reservation status or dates directly?
    default_answer: No. Those fields are readonly and change only through actions so the rules cannot be bypassed.
  - question: What timezone and clock should the world use?
    default_answer: UTC, clock start 2026-10-06T09:00:00Z, 1s tick.
  - question: Is there authentication or per-user permissions?
    default_answer: No. Out of scope.
  - question: Should the allows lists include side-effect fields the actions write (cancelled_at, cancellation_fee) even when unchanged in value?
    default_answer: Yes. Allow every field the permitted action may write on the target rows, and nothing beyond what the instruction implies.
assumptions:
  - decision: 'Stay times are fixed: check-in 15:00 UTC, check-out 11:00 UTC. Actions take date strings (YYYY-MM-DD) and build the datetimes.'
    why: The field types have no date-only type. Fixed times make the 48-hour rule and same-day turnover deterministic.
  - decision: 'Overlap is half-open: [check_in, check_out). A reservation ending the same day another begins on the same room is allowed. Only confirmed, checked_in and checked_out reservations count; cancelled and no_show free the room.'
    why: Standard hotel turnover behavior.
  - decision: The cancellation fee applies when minutes from now to check_in are between 0 and 48h inclusive (<= 2880 minutes). The fee is one night at the reservation's snapshot nightly_rate, recorded on the reservation (cancellation_fee) and as a folio_charge of kind cancellation_fee.
    why: The input says 'within 48 hours of check-in' and 'one-night fee'. Inclusive is the guest-unfriendly reading, chosen so the boundary is explicit and testable.
  - decision: Cancelling after the check-in time has passed is refused with 409. Such a reservation is checked in or becomes a no_show.
    why: Cancellation is a pre-arrival operation. The fee rule has no meaning after check-in.
  - decision: A no_show (set by the mark_no_shows job when a confirmed reservation is 24h past check_in) is charged one night as a no_show_fee folio charge.
    why: Mirrors common hotel policy and the same one-night fee as the input.
  - decision: Reservation status, room_id, dates and money fields are readonly on PATCH. Everything changes through actions.
    why: Otherwise a plain PATCH would bypass the overlap and fee rules.
  - decision: One reservation books exactly one room. Group bookings are several reservations by the same guest.
    why: Keeps the overlap rule per room and the model small.
  - decision: Rate is a snapshot from the room type at booking time, with no seasonal rates, taxes or discounts. Total = nights x nightly_rate.
    why: The input only requires a flat one-night fee. Pricing complexity is out of scope.
  - decision: Check-in requires the room housekeeping to be clean, and check-out sets it to dirty. update_room lets staff mark it clean.
    why: Gives rooms a realistic lifecycle and a plausible 409 case without a separate entity.
  - decision: Single property, a single currency (USD), no auth or users.
    why: Not specified in the input. Worlds are tested through the API only.
  - decision: Clock starts at 2026-10-06T09:00:00Z with a 1s tick. Seed dates are relative to the clock start.
    why: Today's date, so the 48-hour window can be tested from seed data.
  - decision: "Each task's allows list is derived from its instruction: the entity and kind of change it asks for, the exact fields its action writes (status, cancelled_at, cancellation_fee for cancel; room_id for change_room), and a where that picks the target rows by seeded values (guest, room, status, check_in). The task intent text records it because plan tasks have no separate allows field; the tasks stage writes it into tasks.<id>.allows."
    why: The request asks for allows taken from the instruction, not from what the solution happens to write, with no change to pressure, seed, routes, solutions, graders or decoys.
outOfScope:
  - what: Payments, deposits, refunds and card handling
    why: The fee is a ledger charge only. Payment processing adds no value to the tests.
  - what: Seasonal or dynamic pricing, taxes, promo codes
    why: Flat room-type rates are enough for the one-night fee rule.
  - what: Multi-property chains, channel managers, OTA sync
    why: Single-property scope.
  - what: Authentication, staff users and roles
    why: The input has no permission model.
  - what: Date modification and early-departure or extension of stays
    why: Overlap logic is already exercised by create_reservation and change_room.
  - what: Email notifications and housekeeping task assignment
    why: No outbound integrations. Housekeeping is a single status field.
  - what: Changes to plan pressure claims, seed, routes, solutions, graders or decoys
    why: The request only adds allows lists to the tasks.
changes:
  - tasks.cancel_distant_reservation
  - tasks.cancel_arriving_tomorrow_with_fee
  - tasks.move_booking_to_free_room
  - tasks.relocate_all_from_maintenance_room
