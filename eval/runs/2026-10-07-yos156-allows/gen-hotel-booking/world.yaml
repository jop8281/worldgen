        ctx.assert(res.length === 1, 'expected one confirmed reservation, found ' + res.length);
        const r = res[0];
        const av = ctx.api('POST', '/rooms/available', { check_in_date: r.check_in.slice(0, 10), check_out_date: r.check_out.slice(0, 10), room_type_id: room.room_type_id }).body.data;
        const pick = av.find((x) => x.id !== room.id);
        ctx.assert(pick, 'no free room of the same type');
        const mv = ctx.api('POST', '/reservations/' + r.id + '/change_room', { room_id: pick.id });
        ctx.assert(mv.status === 200, 'change_room failed: ' + JSON.stringify(mv.body));
      }
