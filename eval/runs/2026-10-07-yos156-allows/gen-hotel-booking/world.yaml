  move_booking_to_free_room:
    difficulty: medium
    instruction: Priya Nair has an upcoming confirmed reservation in room 305, but the room has a plumbing problem. Move that reservation to a different room of the same room type that is free for the same dates. Do not cancel or rebook it, and change nothing else.
    grader: |-
      (ctx) => {
        const room = ctx.seed.list('room', { where: { number: '305' } })[0];
        const g = ctx.seed.list('guest', { where: { name: 'Priya Nair' } })[0];
        if (!room || !g) return 0;
        const t = ctx.seed.list('reservation', { where: { guest_id: g.id, room_id: room.id, status: 'confirmed' } })[0];
        if (!t) return 0;
        const ch = ctx.changes();
        if (ch.length === 0) return 0;
        for (const c of ch) {
          if (!(c.entity === 'reservation' && c.id === t.id)) return 0;
        }
        const end = ctx.db.get('reservation', t.id);
        if (!end || end.room_id === t.room_id) return 0;
        for (const k of Object.keys(t)) {
          if (k === 'room_id' || k === 'updated_at') continue;
          if (end[k] !== t[k]) return 0;
        }
        const nr = ctx.db.get('room', end.room_id);
        if (!nr || nr.room_type_id !== room.room_type_id || nr.housekeeping === 'out_of_service') return 0;
        for (const st of ['confirmed', 'checked_in', 'checked_out']) {
          for (const o of ctx.db.list('reservation', { where: { room_id: nr.id, status: st } })) {
            if (o.id === t.id) continue;
            if (ctx.time.minutesBetween(o.check_in, end.check_out) > 0 && ctx.time.minutesBetween(end.check_in, o.check_out) > 0) return 0;
          }
        }
        return 1;
      }
    solution: |-
      (ctx) => {
        const room = ctx.api('GET', '/rooms?q=305').body.data.find((x) => x.number === '305');
        ctx.assert(room, 'room 305 not found');
        const g = ctx.api('GET', '/guests?q=Nair').body.data.find((x) => x.name === 'Priya Nair');
