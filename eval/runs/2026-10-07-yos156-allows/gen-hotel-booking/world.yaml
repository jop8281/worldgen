  relocate_all_from_maintenance_room:
    difficulty: hard
    instruction: Room 214 has just been taken out of service for repairs. Move every upcoming confirmed reservation in room 214 to a different room of the same room type that is free for the same dates, keeping the dates unchanged. Different reservations may need different replacement rooms. Do not cancel anything, and leave reservations that are already checked in, checked out or cancelled where they are.
    grader: |-
      (ctx) => {
        const old = ctx.seed.list('room', { where: { number: '214' } })[0];
        if (!old) return 0;
        const targets = ctx.seed.list('reservation', { where: { room_id: old.id, status: 'confirmed' } });
        if (targets.length === 0) return 0;
        const ids = new Set(targets.map((t) => t.id));
        const ch = ctx.changes();
        if (ch.length === 0) return 0;
        for (const c of ch) {
          if (!(c.entity === 'reservation' && ids.has(c.id))) return 0;
        }
        let done = 0;
        for (const t of targets) {
          const end = ctx.db.get('reservation', t.id);
          if (!end || end.room_id === old.id) continue;
          let same = true;
          for (const k of Object.keys(t)) {
            if (k === 'room_id' || k === 'updated_at') continue;
            if (end[k] !== t[k]) same = false;
          }
          if (!same) continue;
          const nr = ctx.db.get('room', end.room_id);
          if (!nr || nr.room_type_id !== old.room_type_id || nr.housekeeping === 'out_of_service') continue;
          let clash = false;
          for (const st of ['confirmed', 'checked_in', 'checked_out']) {
            for (const o of ctx.db.list('reservation', { where: { room_id: nr.id, status: st } })) {
              if (o.id === t.id) continue;
              if (ctx.time.minutesBetween(o.check_in, end.check_out) > 0 && ctx.time.minutesBetween(end.check_in, o.check_out) > 0) clash = true;
            }
          }
          if (!clash) done += 1;
        }
        return done / targets.length;
      }
    solution: |-
      (ctx) => {
        const room = ctx.api('GET', '/rooms?q=214').body.data.find((x) => x.number === '214');
        ctx.assert(room, 'room 214 not found');
        const targets = [];
        let cursor = null;
        do {
          const r = ctx.api('GET', '/reservations?room_id=' + room.id + '&status=confirmed' + (cursor === null ? '' : '&cursor=' + cursor));
          ctx.assert(r.status === 200, 'list failed: ' + JSON.stringify(r.body));
          targets.push(...r.body.data);
          cursor = r.body.next_cursor;
        } while (cursor !== null && cursor !== undefined);
        ctx.assert(targets.length > 0, 'no confirmed reservations on room 214');
        for (const t of targets) {
          const av = ctx.api('POST', '/rooms/available', { check_in_date: t.check_in.slice(0, 10), check_out_date: t.check_out.slice(0, 10), room_type_id: room.room_type_id }).body.data;
          const pick = av.find((x) => x.id !== room.id);
          ctx.assert(pick, 'no free room of the same type for ' + t.id);
          const mv = ctx.api('POST', '/reservations/' + t.id + '/change_room', { room_id: pick.id });
          ctx.assert(mv.status === 200, 'change_room ' + t.id + ' failed: ' + JSON.stringify(mv.body));
        }
      }
    decoys:
      - why: reads only the first page of confirmed reservations, so it misses the room 214 bookings that start later
        script: |-
          (ctx) => {
            const room = ctx.api('GET', '/rooms?q=214').body.data.find((x) => x.number === '214');
            const page = ctx.api('GET', '/reservations?status=confirmed&sort=check_in').body.data.filter((r) => r.room_id === room.id);
            for (const t of page) {
              const av = ctx.api('POST', '/rooms/available', { check_in_date: t.check_in.slice(0, 10), check_out_date: t.check_out.slice(0, 10), room_type_id: room.room_type_id }).body.data;
              const pick = av.find((x) => x.id !== room.id);
              if (pick) ctx.api('POST', '/reservations/' + t.id + '/change_room', { room_id: pick.id });
            }
          }
      - why: cancels the confirmed reservations on room 214 instead of relocating them
        script: |-
          (ctx) => {
            const room = ctx.api('GET', '/rooms?q=214').body.data.find((x) => x.number === '214');
            const res = ctx.api('GET', '/reservations?room_id=' + room.id + '&status=confirmed').body.data;
            for (const t of res) ctx.api('POST', '/reservations/' + t.id + '/cancel', {});
          }
      - why: moves each reservation to any free room without checking that it has the same room type as 214
        script: |-
          (ctx) => {
            const room = ctx.api('GET', '/rooms?q=214').body.data.find((x) => x.number === '214');
            const res = ctx.api('GET', '/reservations?room_id=' + room.id + '&status=confirmed').body.data;
            for (const t of res) {
              const av = ctx.api('POST', '/rooms/available', { check_in_date: t.check_in.slice(0, 10), check_out_date: t.check_out.slice(0, 10) }).body.data;
              const pick = av.find((x) => x.room_type_id !== room.room_type_id && x.id !== room.id);
              if (pick) ctx.api('POST', '/reservations/' + t.id + '/change_room', { room_id: pick.id });
            }
          }
    alternatives: []
    allows:
      - entity: reservation
        kind: updated
        fields:
          - room_id
        where:
          room_id: rom_0022
          status: confirmed
