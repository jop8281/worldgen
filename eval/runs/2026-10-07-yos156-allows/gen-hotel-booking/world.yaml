actions:
  create_reservation:
    method: POST
    path: /reservations
    description: Book one room for one guest. Stay is [check_in_date 15:00 UTC, check_out_date 11:00 UTC). Refuses overlap (409 room_unavailable), out_of_service rooms, over-capacity, bad or past dates. nights, nightly_rate (room type snapshot) and total are computed.
    input:
      guest_id:
        type: ref
        description: The guest who is booking.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: guest
        onDelete: restrict
      room_id:
        type: ref
        description: The room to book.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: room
        onDelete: restrict
      check_in_date:
        type: string
        description: Arrival date, YYYY-MM-DD. Check-in time is 15:00 UTC.
        required: true
        nullable: false
        unique: false
        readonly: false
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      check_out_date:
        type: string
        description: Departure date, YYYY-MM-DD. Check-out time is 11:00 UTC. Must be after check_in_date.
        required: true
        nullable: false
        unique: false
        readonly: false
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      adults:
        type: int
        description: Number of adults. Must not exceed the room type capacity.
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 10
      special_requests:
        type: text
        description: Optional note for the hotel.
        required: false
        nullable: true
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const isDate = (s) => { if (typeof s !== 'string') return false; const p = s.split('-'); if (p.length !== 3 || p[0].length !== 4 || p[1].length !== 2 || p[2].length !== 2) return false; const y = Number(p[0]); const mo = Number(p[1]); const d = Number(p[2]); if (!Number.isInteger(y) || !Number.isInteger(mo) || !Number.isInteger(d) || mo < 1 || mo > 12 || d < 1) return false; const leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; const dim = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]; return d <= dim[mo - 1]; };
        const b = ctx.body;
        if (!isDate(b.check_in_date) || !isDate(b.check_out_date)) ctx.fail(400, 'input.invalid', 'check_in_date and check_out_date must be valid calendar dates (YYYY-MM-DD)');
        if (b.check_out_date <= b.check_in_date) ctx.fail(400, 'invalid_dates', 'check_out_date ' + b.check_out_date + ' must be after check_in_date ' + b.check_in_date);
        const today = ctx.now().slice(0, 10);
        if (b.check_in_date < today) ctx.fail(400, 'check_in_in_past', 'check_in_date ' + b.check_in_date + ' is before today (' + today + ')');
        const guest = ctx.db.get('guest', b.guest_id);
        if (guest === null) ctx.fail(404, 'not_found', 'guest ' + b.guest_id + ' not found');
        const room = ctx.db.get('room', b.room_id);
        if (room === null) ctx.fail(404, 'not_found', 'room ' + b.room_id + ' not found');
        if (room.housekeeping === 'out_of_service') ctx.fail(409, 'room_out_of_service', 'room ' + room.number + ' is out of service and cannot be booked');
        const type = ctx.db.get('room_type', room.room_type_id);
        if (b.adults > type.capacity) ctx.fail(422, 'over_capacity', 'room ' + room.number + ' (' + type.name + ') sleeps ' + type.capacity + ' but ' + b.adults + ' adults were requested');
        const checkIn = b.check_in_date + 'T15:00:00.000Z';
        const checkOut = b.check_out_date + 'T11:00:00.000Z';
        for (const st of ['confirmed', 'checked_in', 'checked_out']) {
          for (const r of ctx.db.list('reservation', { where: { room_id: room.id, status: st } })) {
            if (ctx.time.minutesBetween(r.check_in, checkOut) > 0 && ctx.time.minutesBetween(checkIn, r.check_out) > 0) {
              ctx.fail(409, 'room_unavailable', 'room ' + room.number + ' is already booked for these dates by reservation ' + r.id + ' (' + r.check_in + ' to ' + r.check_out + ')');
            }
          }
        }
        const nights = Math.round(ctx.time.minutesBetween(checkIn, checkOut) / 1440);
        const rate = type.nightly_rate;
        const created = ctx.db.create('reservation', {
          guest_id: guest.id, room_id: room.id, check_in: checkIn, check_out: checkOut, nights, adults: b.adults,
          nightly_rate: rate, total: nights * rate, cancelled_at: null, cancellation_fee: 0,
          special_requests: b.special_requests === undefined ? null : b.special_requests,
        });
        return { status: 201, body: created };
      }
  cancel_reservation:
    method: POST
    path: /reservations/{id}/cancel
    description: Cancel a confirmed reservation before check-in. When check-in is 48 hours or less away, one night at the snapshot rate is charged as a cancellation_fee folio charge and recorded on the reservation.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const r = ctx.db.get('reservation', id);
        if (r === null) ctx.fail(404, 'not_found', 'reservation ' + id + ' not found');
        if (r.status !== 'confirmed') ctx.fail(409, 'invalid_state', 'reservation ' + id + ' is ' + r.status + '. Only confirmed reservations can be cancelled.');
        const now = ctx.now();
        const minutes = ctx.time.minutesBetween(now, r.check_in);
        if (minutes <= 0) ctx.fail(409, 'check_in_passed', 'reservation ' + id + ' check-in time ' + r.check_in + ' has passed. It can no longer be cancelled.');
        const fee = minutes <= 2880 ? r.nightly_rate : 0;
        const updated = ctx.db.update('reservation', id, { status: 'cancelled', cancelled_at: now, cancellation_fee: fee });
        if (fee > 0) {
          ctx.db.create('folio_charge', { reservation_id: id, kind: 'cancellation_fee', amount: fee, description: 'Late cancellation fee: one night' });
        }
        return { status: 200, body: updated };
      }
  check_in_reservation:
    method: POST
    path: /reservations/{id}/check_in
    description: Check in a confirmed reservation. Allowed from 00:00 UTC of the check-in day, and only when the room housekeeping is clean.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const r = ctx.db.get('reservation', id);
        if (r === null) ctx.fail(404, 'not_found', 'reservation ' + id + ' not found');
        if (r.status !== 'confirmed') ctx.fail(409, 'invalid_state', 'reservation ' + id + ' is ' + r.status + '. Only confirmed reservations can be checked in.');
        const now = ctx.now();
        const dayStart = r.check_in.slice(0, 10) + 'T00:00:00.000Z';
        if (ctx.time.minutesBetween(dayStart, now) < 0) ctx.fail(409, 'too_early', 'reservation ' + id + ' arrives on ' + r.check_in.slice(0, 10) + '. Check-in opens at ' + dayStart + '.');
        const room = ctx.db.get('room', r.room_id);
        if (room.housekeeping !== 'clean') ctx.fail(409, 'room_not_ready', 'room ' + room.number + ' is ' + room.housekeeping + '. It must be clean before check-in.');
        const updated = ctx.db.update('reservation', id, { status: 'checked_in' });
        return { status: 200, body: updated };
      }
  check_out_reservation:
    method: POST
    path: /reservations/{id}/check_out
    description: Check out a checked-in guest. Posts the room charge for the reservation total and marks the room dirty.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const r = ctx.db.get('reservation', id);
        if (r === null) ctx.fail(404, 'not_found', 'reservation ' + id + ' not found');
        if (r.status !== 'checked_in') ctx.fail(409, 'invalid_state', 'reservation ' + id + ' is ' + r.status + '. Only checked_in reservations can be checked out.');
        const updated = ctx.db.update('reservation', id, { status: 'checked_out' });
        ctx.db.create('folio_charge', { reservation_id: id, kind: 'room', amount: r.total, description: 'Room charge: ' + r.nights + ' night(s) at ' + r.nightly_rate });
        ctx.db.update('room', r.room_id, { housekeeping: 'dirty' });
        return { status: 200, body: updated };
      }
  change_room:
    method: POST
    path: /reservations/{id}/change_room
    description: Move a confirmed reservation to another room for the same dates. The new room must differ, be in service, sleep the adults and be free. Nightly rate and total stay as booked.
    input:
      room_id:
        type: ref
        description: The room to move the reservation to.
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: room
        onDelete: restrict
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const r = ctx.db.get('reservation', id);
        if (r === null) ctx.fail(404, 'not_found', 'reservation ' + id + ' not found');
        if (r.status !== 'confirmed') ctx.fail(409, 'invalid_state', 'reservation ' + id + ' is ' + r.status + '. Only confirmed reservations can change room.');
        const room = ctx.db.get('room', ctx.body.room_id);
        if (room === null) ctx.fail(404, 'not_found', 'room ' + ctx.body.room_id + ' not found');
        if (room.id === r.room_id) ctx.fail(409, 'same_room', 'reservation ' + id + ' is already in room ' + room.number);
        if (room.housekeeping === 'out_of_service') ctx.fail(409, 'room_out_of_service', 'room ' + room.number + ' is out of service');
        const type = ctx.db.get('room_type', room.room_type_id);
        if (type.capacity < r.adults) ctx.fail(409, 'over_capacity', 'room ' + room.number + ' sleeps ' + type.capacity + ' but the reservation has ' + r.adults + ' adults');
        for (const st of ['confirmed', 'checked_in', 'checked_out']) {
          for (const o of ctx.db.list('reservation', { where: { room_id: room.id, status: st } })) {
            if (o.id === id) continue;
            if (ctx.time.minutesBetween(o.check_in, r.check_out) > 0 && ctx.time.minutesBetween(r.check_in, o.check_out) > 0) {
              ctx.fail(409, 'room_unavailable', 'room ' + room.number + ' is already booked for these dates by reservation ' + o.id);
            }
          }
        }
        const updated = ctx.db.update('reservation', id, { room_id: room.id });
        return { status: 200, body: updated };
      }
  find_available_rooms:
    method: POST
    path: /rooms/available
    description: Read only. Lists in-service rooms with no confirmed, checked_in or checked_out reservation overlapping the stay window, optionally of one room type. Writes nothing.
    input:
      check_in_date:
        type: string
        description: Arrival date, YYYY-MM-DD.
        required: true
        nullable: false
        unique: false
        readonly: false
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      check_out_date:
        type: string
        description: Departure date, YYYY-MM-DD. Must be after check_in_date.
        required: true
        nullable: false
        unique: false
        readonly: false
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      room_type_id:
        type: ref
        description: Optional room type filter.
        required: false
        nullable: true
        unique: false
        readonly: false
        entity: room_type
        onDelete: restrict
    handler: |-
      (ctx) => {
        const isDate = (s) => { if (typeof s !== 'string') return false; const p = s.split('-'); if (p.length !== 3 || p[0].length !== 4 || p[1].length !== 2 || p[2].length !== 2) return false; const y = Number(p[0]); const mo = Number(p[1]); const d = Number(p[2]); if (!Number.isInteger(y) || !Number.isInteger(mo) || !Number.isInteger(d) || mo < 1 || mo > 12 || d < 1) return false; const leap = (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; const dim = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31]; return d <= dim[mo - 1]; };
        const b = ctx.body;
        if (!isDate(b.check_in_date) || !isDate(b.check_out_date)) ctx.fail(400, 'input.invalid', 'check_in_date and check_out_date must be valid calendar dates (YYYY-MM-DD)');
        if (b.check_out_date <= b.check_in_date) ctx.fail(400, 'invalid_dates', 'check_out_date must be after check_in_date');
        const checkIn = b.check_in_date + 'T15:00:00.000Z';
        const checkOut = b.check_out_date + 'T11:00:00.000Z';
        const busy = new Set();
        for (const st of ['confirmed', 'checked_in', 'checked_out']) {
          for (const r of ctx.db.list('reservation', { where: { status: st } })) {
            if (ctx.time.minutesBetween(r.check_in, checkOut) > 0 && ctx.time.minutesBetween(checkIn, r.check_out) > 0) busy.add(r.room_id);
          }
        }
        const rooms = b.room_type_id ? ctx.db.list('room', { where: { room_type_id: b.room_type_id } }) : ctx.db.list('room');
        const data = rooms.filter((x) => x.housekeeping !== 'out_of_service' && !busy.has(x.id));
        return { status: 200, body: { data } };
      }
jobs:
  mark_no_shows:
    description: Every hour. A confirmed reservation whose check-in time is at least 24 hours past becomes no_show and gets a one-night no_show_fee folio charge at its snapshot rate. This frees the room for new bookings.
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const r of ctx.db.list('reservation', { where: { status: 'confirmed' } })) {
          if (ctx.time.minutesBetween(r.check_in, now) < 1440) continue;
          ctx.db.update('reservation', r.id, { status: 'no_show' });
          ctx.db.create('folio_charge', { reservation_id: r.id, kind: 'no_show_fee', amount: r.nightly_rate, description: 'No-show fee: one night' });
        }
      }
