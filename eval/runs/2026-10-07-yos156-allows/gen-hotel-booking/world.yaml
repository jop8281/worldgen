format: 1
meta:
  name: world
  description: A single-property hotel booking system. Room types carry a nightly rate and capacity, rooms belong to a type, guests make reservations for a specific room over a half-open stay window [check-in 15:00, check-out 11:00). The engine refuses overlapping non-cancelled reservations on the same room (same-day turnover is allowed). Cancelling within 48 hours of check-in charges a one-night fee, posted as a folio charge, and a job marks unclaimed arrivals as no-shows. Status changes happen only through actions so the overlap and fee rules cannot be bypassed.
  resembles: Cloudbeds / Opera-style hotel property management system (PMS) reservations API
  source: worldgen
  seed: 0
  clock:
    start: 2026-10-06T09:00:00.000Z
    tick: 1s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  room_type:
    description: A category of room with a base nightly rate and capacity, such as Standard Queen or Executive Suite.
    idPrefix: rty
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 80
      description:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
      capacity:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 10
      nightly_rate:
        type: money
        description: Base nightly rate in USD cents.
        required: true
        nullable: false
        unique: false
        readonly: false
        currency: USD
        min: 0
      bed_config:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - single
          - double
          - queen
          - king
          - twin
  room:
    description: A physical room that can be booked. Housekeeping state gates check-in and bookability.
    idPrefix: rom
    fields:
      number:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: true
        maxLength: 10
      floor:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
        max: 100
      room_type_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: room_type
        onDelete: restrict
      housekeeping:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - clean
          - dirty
          - out_of_service
        default: clean
  guest:
    description: A person who books and stays.
    idPrefix: gst
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        maxLength: 160
        format: email
      phone:
        type: string
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 30
      loyalty_tier:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - none
          - silver
          - gold
        default: none
  reservation:
    description: A booking of one room by one guest for the half-open stay window [check_in 15:00 UTC, check_out 11:00 UTC). Status, room, dates and money fields are readonly and change only through actions.
    idPrefix: res
    fields:
      guest_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: guest
        onDelete: restrict
      room_id:
        type: ref
        description: Changed only by the change_room action.
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: room
        onDelete: restrict
      check_in:
        type: datetime
        description: Arrival at 15:00 UTC.
        required: true
        nullable: false
        unique: false
        readonly: true
      check_out:
        type: datetime
        description: Departure at 11:00 UTC.
        required: true
        nullable: false
        unique: false
        readonly: true
      nights:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: true
        min: 1
      adults:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
        max: 10
      nightly_rate:
        type: money
        description: Snapshot of the room type rate at booking.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      total:
        type: money
        description: nights x nightly_rate.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      status:
        type: state
        description: Moved only by actions and the mark_no_shows job. cancelled, checked_out and no_show are final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - confirmed
          - checked_in
          - checked_out
          - cancelled
          - no_show
        initial: confirmed
        transitions:
          confirmed:
            - checked_in
            - cancelled
            - no_show
          checked_in:
            - checked_out
          checked_out: []
          cancelled: []
          no_show: []
      cancelled_at:
        type: datetime
        required: false
        nullable: true
        unique: false
        readonly: true
      cancellation_fee:
        type: money
        description: One night at the snapshot rate when cancelled within 48 hours of check-in, else 0.
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
        default: 0
      special_requests:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
  folio_charge:
    description: "A charge posted against a reservation: room revenue at check-out, or a cancellation or no-show fee. Written by actions and jobs only."
    idPrefix: chg
    fields:
      reservation_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: true
        entity: reservation
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: true
        values:
          - room
          - cancellation_fee
          - no_show_fee
      amount:
        type: money
        required: true
        nullable: false
        unique: false
        readonly: true
        currency: USD
        min: 0
      description:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: true
        maxLength: 200
