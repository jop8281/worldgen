format: 1
meta:
  name: out
  description: An order-management desk built around the imported orders table. Customers own orders. Each order moves through pending, paid, shipped, delivered, with cancellation and refund exits. Status changes happen only through guarded actions (pay, ship, deliver, cancel, refund) that stamp timestamps and write an audit trail, and an hourly job cancels orders left unpaid for 72 hours.
  resembles: "Shopify-style order desk (Shopify Admin / WooCommerce orders API): customers place orders that are paid, shipped, delivered, cancelled or refunded."
  source: worldgen
  seed: 0
  clock:
    start: 2026-04-08T09:00:00.000Z
    tick: 0s
  api:
    list:
      mode: cursor
      dataKey: data
      cursorKey: next_cursor
      limitParam: limit
      cursorParam: cursor
      hasMoreKey: has_more
      startingAfterParam: starting_after
      endingBeforeParam: ending_before
    error:
      error:
        code: $code
        message: $message
entities:
  customer:
    description: A buyer who places orders. The seed creates cus_0001..cus_0018 so the imported orders resolve.
    idPrefix: cus
    fields:
      name:
        type: string
        required: true
        nullable: false
        unique: false
        readonly: false
        maxLength: 120
      email:
        type: string
        required: true
        nullable: false
        unique: true
        readonly: false
        format: email
      vip:
        type: bool
        required: false
        nullable: false
        unique: false
        readonly: false
        default: false
  order:
    description: A purchase placed by a customer. Status moves only through the pay, ship, deliver, cancel and refund actions, which stamp the timestamp fields.
    idPrefix: ord
    fields:
      customer_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: customer
        onDelete: restrict
      status:
        type: state
        description: Lifecycle. Changed only by actions and the auto_cancel_unpaid job. cancelled and refunded are final.
        required: false
        nullable: false
        unique: false
        readonly: true
        states:
          - pending
          - paid
          - shipped
          - delivered
          - cancelled
          - refunded
        initial: pending
        transitions:
          pending:
            - paid
            - cancelled
          paid:
            - shipped
            - cancelled
            - refunded
          shipped:
            - delivered
            - refunded
          delivered:
            - refunded
          cancelled: []
          refunded: []
      total_cents:
        type: int
        description: Order total in minor units (cents).
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 0
      currency:
        type: enum
        required: false
        nullable: false
        unique: false
        readonly: false
        values:
          - USD
        default: USD
      item_count:
        type: int
        required: true
        nullable: false
        unique: false
        readonly: false
        min: 1
      placed_at:
        type: datetime
        description: When the order was placed. Set to engine time on create.
        required: false
        nullable: false
        unique: false
        readonly: true
        default: now
      shipped_at:
        type: datetime
        description: Stamped by ship_order.
        required: false
        nullable: true
        unique: false
        readonly: true
      delivered_at:
        type: datetime
        description: Stamped by deliver_order.
        required: false
        nullable: true
        unique: false
        readonly: true
      cancelled_at:
        type: datetime
        description: Stamped by cancel_order or the auto_cancel_unpaid job.
        required: false
        nullable: true
        unique: false
        readonly: true
      refunded_at:
        type: datetime
        description: Stamped by refund_order.
        required: false
        nullable: true
        unique: false
        readonly: true
      tracking_number:
        type: string
        description: Optional carrier tracking number given to ship_order.
        required: false
        nullable: true
        unique: false
        readonly: true
        maxLength: 60
      note:
        type: string
        description: Free customer note, the only field edited by plain update.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 500
  order_event:
    description: Append-only audit trail of status changes on an order, written by actions and the auto-cancel job.
    idPrefix: oev
    fields:
      order_id:
        type: ref
        required: true
        nullable: false
        unique: false
        readonly: false
        entity: order
        onDelete: restrict
      kind:
        type: enum
        required: true
        nullable: false
        unique: false
        readonly: false
        values:
          - paid
          - shipped
          - delivered
          - cancelled
          - refunded
      note:
        type: text
        required: false
        nullable: true
        unique: false
        readonly: false
routes:
  list_orders:
    op: list
    entity: order
    filters:
      - status
      - customer_id
      - currency
      - item_count
      - note
    search:
      - note
    sort:
      - placed_at
      - total_cents
      - shipped_at
    pageSize: 25
    method: GET
    path: /orders
    description: List orders with filters, note search and sorting. Cursor paging.
  get_order:
    op: get
    entity: order
    method: GET
    path: /orders/{id}
    description: Fetch one order.
  create_order:
    op: create
    entity: order
    method: POST
    path: /orders
    description: Place an order. It starts pending with placed_at set to now.
  update_order:
    op: update
    entity: order
    method: PATCH
    path: /orders/{id}
    description: Edit the order. Status and timestamps are readonly and move through actions.
  list_order_events:
    op: list
    entity: order_event
    filters:
      - kind
    search: []
    sort:
      - created_at
    pageSize: 25
    method: GET
    path: /orders/{order_id}/events
    description: Audit trail of one order.
  list_customers:
    op: list
    entity: customer
    filters:
      - vip
    search:
      - name
      - email
    sort:
      - name
    pageSize: 25
    method: GET
    path: /customers
    description: List customers.
  get_customer:
    op: get
    entity: customer
    method: GET
    path: /customers/{id}
    description: Fetch one customer.
  create_customer:
    op: create
    entity: customer
    method: POST
    path: /customers
    description: Create a customer.
actions:
  pay_order:
    method: POST
    path: /orders/{id}/pay
    description: Mark a pending order as paid.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'pending') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only pending orders can be paid.');
        const updated = ctx.db.update('order', id, { status: 'paid' });
        ctx.db.create('order_event', { order_id: id, kind: 'paid', note: null });
        return { status: 200, body: updated };
      }
  ship_order:
    method: POST
    path: /orders/{id}/ship
    description: Ship a paid order, stamping shipped_at and optional tracking number.
    input:
      tracking_number:
        type: string
        description: Optional carrier tracking number.
        required: false
        nullable: true
        unique: false
        readonly: false
        maxLength: 60
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only paid orders can be shipped.');
        const tn = ctx.body.tracking_number === undefined ? null : ctx.body.tracking_number;
        const updated = ctx.db.update('order', id, { status: 'shipped', shipped_at: ctx.now(), tracking_number: tn });
        ctx.db.create('order_event', { order_id: id, kind: 'shipped', note: tn === null ? null : 'tracking ' + tn });
        return { status: 200, body: updated };
      }
  deliver_order:
    method: POST
    path: /orders/{id}/deliver
    description: Mark a shipped order as delivered.
    input: {}
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'shipped') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only shipped orders can be delivered.');
        const updated = ctx.db.update('order', id, { status: 'delivered', delivered_at: ctx.now() });
        ctx.db.create('order_event', { order_id: id, kind: 'delivered', note: null });
        return { status: 200, body: updated };
      }
  cancel_order:
    method: POST
    path: /orders/{id}/cancel
    description: Cancel a pending or paid order with a reason.
    input:
      reason:
        type: text
        description: Why the order is cancelled.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'pending' && o.status !== 'paid') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only pending or paid orders can be cancelled.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for cancel_order: reason expected a non-blank text, found ""');
        const updated = ctx.db.update('order', id, { status: 'cancelled', cancelled_at: ctx.now() });
        ctx.db.create('order_event', { order_id: id, kind: 'cancelled', note: reason });
        return { status: 200, body: updated };
      }
  refund_order:
    method: POST
    path: /orders/{id}/refund
    description: Fully refund a paid, shipped or delivered order with a reason.
    input:
      reason:
        type: text
        description: Why the order is refunded.
        required: true
        nullable: false
        unique: false
        readonly: false
    handler: |-
      (ctx) => {
        const id = ctx.params.id;
        const o = ctx.db.get('order', id);
        if (o === null) ctx.fail(404, 'not_found', 'order ' + id + ' not found');
        if (o.status !== 'paid' && o.status !== 'shipped' && o.status !== 'delivered') ctx.fail(409, 'invalid_state', 'order ' + id + ' is ' + o.status + '. Only paid, shipped or delivered orders can be refunded.');
        const reason = ctx.body.reason.trim();
        if (reason === '') ctx.fail(400, 'input.invalid', 'Invalid input for refund_order: reason expected a non-blank text, found ""');
        const updated = ctx.db.update('order', id, { status: 'refunded', refunded_at: ctx.now() });
        ctx.db.create('order_event', { order_id: id, kind: 'refunded', note: reason });
        return { status: 200, body: updated };
      }
jobs:
  auto_cancel_unpaid:
    description: Every hour, cancel pending orders placed 72 hours or more ago.
    every: 1h
    run: |-
      (ctx) => {
        const now = ctx.now();
        for (const o of ctx.db.list('order', { where: { status: 'pending' } })) {
          if (ctx.time.minutesBetween(o.placed_at, now) < 72 * 60) continue;
          ctx.db.update('order', o.id, { status: 'cancelled', cancelled_at: now });
          ctx.db.create('order_event', { order_id: o.id, kind: 'cancelled', note: 'auto: unpaid for 72h' });
        }
      }
