  reassign_and_start_dana_queue:
    difficulty: hard
    instruction: The technician Dana Ortiz is on leave and inactive, but she still has queued tickets assigned to her. Reassign every queued ticket assigned to Dana to the technician Priya Nair and start each of them. Leave Dana's active and closed tickets, and every other ticket, untouched.
    grader: |-
      (ctx) => {
        const dana = ctx.seed.list('technician', { where: { name: 'Dana Ortiz' } })[0];
        const priya = ctx.seed.list('technician', { where: { name: 'Priya Nair' } })[0];
        if (!dana || !priya) return 0;
        const targets = ctx.seed.list('ticket', { where: { status: 'queued', technician_id: dana.id } });
        if (targets.length === 0) return 0;
        const ids = new Set(targets.map((t) => t.id));
        ctx.guardChanges('only Dana queued tickets technician and status changed',
          targets.map((t) => ({ entity: 'ticket', id: t.id, kind: 'updated', fields: ['technician_id', 'status'] })));
        const ends = targets.map((t) => ctx.db.get('ticket', t.id));
        ctx.goal(0.5, 'every queued Dana ticket reassigned to Priya', ends.every((t) => t.technician_id === priya.id));
        ctx.goal(0.5, 'every queued Dana ticket reassigned and active', ends.every((t) => t.technician_id === priya.id && t.status === 'active'));
        return ctx.score();
      }
    solution: |-
      (ctx) => {
        const pages = (path) => {
          const rows = [];
          let cursor = null;
          do {
            const r = ctx.api('GET', path + (cursor === null ? '' : '&cursor=' + cursor));
            ctx.assert(r.status === 200, 'GET ' + path + ' failed: ' + JSON.stringify(r.body));
            rows.push(...r.body.data);
            cursor = r.body.next_cursor;
          } while (cursor !== null && cursor !== undefined);
          return rows;
        };
        const dana = ctx.api('GET', '/technicians?q=Dana').body.data.find((t) => t.name === 'Dana Ortiz');
        const priya = ctx.api('GET', '/technicians?q=Priya').body.data.find((t) => t.name === 'Priya Nair');
        ctx.assert(dana && priya, 'technicians not found');
        const targets = pages('/tickets?status=queued&technician_id=' + dana.id);
        ctx.assert(targets.length > 0, 'no queued tickets for Dana');
        for (const t of targets) {
          const a = ctx.api('POST', '/tickets/' + t.id + '/assign', { technician_id: priya.id });
          ctx.assert(a.status === 200, 'assign ' + t.id + ' failed: ' + JSON.stringify(a.body));
          const s = ctx.api('POST', '/tickets/' + t.id + '/start', {});
          ctx.assert(s.status === 200, 'start ' + t.id + ' failed: ' + JSON.stringify(s.body));
        }
      }
    decoys:
      - why: handles only the first page of Dana's queued tickets and misses the rest
        script: |-
          (ctx) => {
            const dana = ctx.api('GET', '/technicians?q=Dana').body.data[0];
            const priya = ctx.api('GET', '/technicians?q=Priya').body.data[0];
            const page = ctx.api('GET', '/tickets?status=queued&technician_id=' + dana.id).body.data;
            for (const t of page) {
              ctx.api('POST', '/tickets/' + t.id + '/assign', { technician_id: priya.id });
              ctx.api('POST', '/tickets/' + t.id + '/start', {});
            }
          }
      - why: reassigns all of Dana's queued tickets to the wrong technician, Marco Silva, instead of Priya Nair, and starts them
        script: |-
          (ctx) => {
            const dana = ctx.api('GET', '/technicians?q=Dana').body.data[0];
            const marco = ctx.api('GET', '/technicians?q=Marco').body.data[0];
